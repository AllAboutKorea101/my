"fi": "Kolme vuotta sitten lähtien.", "ja": "3年前からです。", "zh-CN": "从3年前开始。"}}], "quizzes": [{"id": 1, "type": "comprehension", "questionAudio": "수미는 무슨 일을 해요?", "questionTrans": {"en": "What does Sumi do for work?", "de": "Was macht Sumi beruflich?", "fr": "Que fait Sumi comme travail?", "es": "¿A qué se dedica Sumi?", "pl": "Czym zajmuje się Sumi?", "it": "Che lavoro fa Sumi?", "sv": "Vad jobbar Sumi med?", "fi": "Mitä Sumi tekee työkseen?", "ja": "スミの仕事は何ですか？", "zh-CN": "수미是做什么工作的？"}, "options": [{"text": "1) 의사", "trans": {"en": "Doctor", "de": "Arzt/Ärztin", "fr": "Médecin", "es": "Médico/a", "pl": "Lekarz/ka", "it": "Medico", "sv": "Läkare", "fi": "Lääkäri", "ja": "医師", "zh-CN": "医生"}}, {"text": "2) 회사원", "trans": {"en": "Office worker", "de": "Büroangestellter", "fr": "Employé de bureau", "es": "Empleado de oficina", "pl": "Pracownik biurowy", "it": "Impiegato", "sv": "Kontorsanställd", "fi": "Toimistotyöntekijä", "ja": "会社員", "zh-CN": "公司职员"}}, {"text": "3) 선생님", "trans": {"en": "Teacher", "de": "Lehrer/in", "fr": "Enseignant/e", "es": "Profesor/a", "pl": "Nauczyciel/ka", "it": "Insegnante", "sv": "Lärare", "fi": "Opettaja", "ja": "先生", "zh-CN": "老师"}}, {"text": "4) 요리사", "trans": {"en": "Cook / Chef", "de": "Koch / Chefkoch", "fr": "Cuisinier / Chef", "es": "Cocinero / Chef", "pl": "Kucharz", "it": "Cuoco / Chef", "sv": "Kock", "fi": "Kokki", "ja": "料理師", "zh-CN": "厨师"}}], "answer": 2, "explanation": {"en": "Sumi said '저는 선생님이에요' (I'm a teacher) and works at an elementary school.", "de": "Sumi sagte '저는 선생님이에요' (Ich bin Lehrerin) und arbeitet an einer Grundschule.", "fr": "Sumi a dit '저는 선생님이에요' (Je suis enseignante) et travaille dans une école primaire.", "es": "Sumi dijo '저는 선생님이에요' (Soy profesora) y trabaja en una escuela primaria.", "pl": "Sumi powiedziała '저는 선생님이에요' (Jestem nauczycielką) i pracuje w szkole podstawowej.", "it": "Sumi ha detto '저는 선생님이에요' (Sono un'insegnante) e lavora in una scuola elementare.", "sv": "Sumi sa '저는 선생님이에요' (Jag är lärare) och jobbar på en grundskola.", "fi": "Sumi sanoi '저는 선생님이에요' (Olen opettaja) ja työskentelee alakoulussa.", "ja": "스미는 '저는 선생님이에요'（私は先生です）と言い、小学校で働いています。", "zh-CN": "수미说「저는 선생님이에요」（我是老师），在小学工作。"}}, {"id": 2, "type": "detail", "questionAudio": "지민은 어디에서 일해요?", "questionTrans": {"en": "Where does Jimin work?", "de": "Wo arbeitet Jimin?", "fr": "Où travaille Jimin?", "es": "¿Dónde trabaja Jimin?", "pl": "Gdzie pracuje Jimin?", "it": "Dove lavora Jimin?", "sv": "Var jobbar Jimin?", "fi": "Missä Jimin työskentelee?", "ja": "지민はどこで働いていますか？", "zh-CN": "지민在哪里工作？"}, "options": [{"text": "1) 병원", "trans": {"en": "Hospital", "de": "Krankenhaus", "fr": "Hôpital", "es": "Hospital", "pl": "Szpital", "it": "Ospedale", "sv": "Sjukhus", "fi": "Sairaala", "ja": "病院", "zh-CN": "医院"}}, {"text": "2) 학교", "trans": {"en": "School", "de": "Schule", "fr": "École", "es": "Escuela", "pl": "Szkoła", "it": "Scuola", "sv": "Skola", "fi": "Koulu", "ja": "学校", "zh-CN": "学校"}}, {"text": "3) IT 회사", "trans": {"en": "IT company", "de": "IT-Unternehmen", "fr": "Entreprise informatique", "es": "Empresa de TI", "pl": "Firma IT", "it": "Azienda IT", "sv": "IT-företag", "fi": "IT-yritys", "ja": "IT会社", "zh-CN": "IT公司"}}, {"text": "4) 식당", "trans": {"en": "Restaurant", "de": "Restaurant", "fr": "Restaurant", "es": "Restaurante", "pl": "Restauracja", "it": "Ristorante", "sv": "Restaurang", "fi": "Ravintola", "ja": "食堂・レストラン", "zh-CN": "餐厅"}}], "answer": 2, "explanation": {"en": "Jimin said 'IT 회사에 다녀요' (I work at an IT company).", "de": "Jimin sagte 'IT 회사에 다녀요' (Ich arbeite bei einem IT-Unternehmen).", "fr": "Jimin a dit 'IT 회사에 다녀요' (Je travaille dans une entreprise informatique).", "es": "Jimin dijo 'IT 회사에 다녀요' (Trabajo en una empresa de TI).", "pl": "Jimin powiedział 'IT 회사에 다녀요' (Pracuję w firmie IT).", "it": "Jimin ha detto 'IT 회사에 다녀요' (Lavoro in un'azienda IT).", "sv": "Jimin sa 'IT 회사에 다녀요' (Jag jobbar på ett IT-företag).", "fi": "Jimin sanoi 'IT 회사에 다녀요' (Työskentelen IT-yrityksessä).", "ja": "지민は「IT 회사에 다녀요」（IT会社に通っています）と言いました。", "zh-CN": "지민说「IT 회사에 다녀요」（我在一家IT公司上班）。"}}, {"id": 3, "type": "comprehension", "questionAudio": "지민은 현재 직장에서 얼마나 일했어요?", "questionTrans": {"en": "How long has Jimin worked at their current job?", "de": "Wie lange hat Jimin bei seiner aktuellen Stelle gearbeitet?", "fr": "Depuis combien de temps Jimin travaille-t-il à son poste actuel?", "es": "¿Cuánto tiempo lleva Jimin en su trabajo actual?", "pl": "Jak długo Jimin pracuje w obecnym miejscu pracy?", "it": "Da quanto tempo lavora Jimin nel suo attuale posto?", "sv": "Hur länge har Jimin jobbat på sin nuvarande arbetsplats?", "fi": "Kuinka kauan Jimin on työskennellyt nykyisessä työssään?", "ja": "지민は今の職場でどのくらい働いていますか？", "zh-CN": "지민在现在的工作单位工作了多久？"}, "options": [{"text": "1) 1년", "trans": {"en": "1 year", "de": "1 Jahr", "fr": "1 an", "es": "1 año", "pl": "1 rok", "it": "1 anno", "sv": "1 år", "fi": "1 vuosi", "ja": "1年", "zh-CN": "1年"}}, {"text": "2) 5년", "trans": {"en": "5 years", "de": "5 Jahre", "fr": "5 ans", "es": "5 años", "pl": "5 lat", "it": "5 anni", "sv": "5 år", "fi": "5 vuotta", "ja": "5年", "zh-CN": "5年"}}, {"text": "3) 3년", "trans": {"en": "3 years", "de": "3 Jahre", "fr": "3 ans", "es": "3 años", "pl": "3 lata", "it": "3 anni", "sv": "3 år", "fi": "3 vuotta", "ja": "3年", "zh-CN": "3年"}}, {"text": "4) 10년", "trans": {"en": "10 years", "de": "10 Jahre", "fr": "10 ans", "es": "10 años", "pl": "10 lat", "it": "10 anni", "sv": "10 år", "fi": "10 vuotta", "ja": "10年", "zh-CN": "10年"}}], "answer": 2, "explanation": {"en": "Jimin said '3년 전부터요' (since 3 years ago), so they've been working there for 3 years.", "de": "Jimin sagte '3년 전부터요' (seit 3 Jahren), also arbeitet er dort seit 3 Jahren.", "fr": "Jimin a dit '3년 전부터요' (depuis 3 ans), il y travaille donc depuis 3 ans.", "es": "Jimin dijo '3년 전부터요' (desde hace 3 años), por lo que lleva 3 años trabajando allí.", "pl": "Jimin powiedział '3년 전부터요' (od 3 lat), więc pracuje tam od 3 lat.", "it": "Jimin ha detto '3년 전부터요' (da 3 anni fa), quindi lavora lì da 3 anni.", "sv": "Jimin sa '3년 전부터요' (sedan 3 år tillbaka), så de har jobbat där i 3 år.", "fi": "Jimin sanoi '3년 전부터요' (kolme vuotta sitten), joten hän on työskennellyt siellä 3 vuotta.", "ja": "지민は「3년 전부터요」（3年前から）と言いましたので、3年間働いています。", "zh-CN": "지민说「3년 전부터요」（从3年前开始），所以已经工作了3年。"}}]},
  21: {"id": 21, "title": "21. 학교 생활", "titleTrans": {"en": "21. School Life", "de": "21. Schulleben", "fr": "21. La vie scolaire", "es": "21. La vida escolar", "pl": "21. Życie szkolne", "it": "21. La vita scolastica", "sv": "21. Skolliv", "fi": "21. Kouluelämä", "ja": "21. 学校生活", "zh-CN": "21. 学校生活"}, "desc": "학교에서 일어나는 일상적인 대화를 연습합니다. 수업, 시험, 친구 이야기를 들어 보세요.", "descTrans": {"en": "Practice everyday conversations that happen at school. Listen to talk about classes, exams, and friends.", "de": "Üben Sie alltägliche Gespräche, die in der Schule stattfinden. Hören Sie Gespräche über Unterricht, Prüfungen und Freunde.", "fr": "Entraînez-vous aux conversations quotidiennes à l'école. Écoutez des discussions sur les cours, les examens et les amis.", "es": "Practica conversaciones cotidianas que ocurren en la escuela. Escucha sobre clases, exámenes y amigos.", "pl": "Ćwicz codzienne rozmowy, które mają miejsce w szkole. Posłuchaj o lekcjach, egzaminach i przyjaciołach.", "it": "Esercitati nelle conversazioni quotidiane che avvengono a scuola. Ascolta di classi, esami e amici.", "sv": "Öva på vardagliga samtal som sker på skolan. Lyssna på samtal om lektioner, prov och vänner.", "fi": "Harjoittele koulussa käytäviä arkikeskusteluja. Kuuntele oppitunneista, kokeista ja ystävistä.", "ja": "学校で起こる日常会話を練習します。授業、試験、友達の話を聞いてみましょう。", "zh-CN": "练习学校里发生的日常对话。听关于课程、考试和朋友的对话。"}, "dialogue": [{"speaker": "수미", "text": "지민아, 오늘 수학 시험 어땠어?", "trans": {"en": "Jimin, how was the math exam today?", "de": "Jimin, wie war die Matheprüfung heute?", "fr": "Jimin, comment s'est passé l'examen de maths aujourd'hui ?", "es": "Jimin, ¿cómo estuvo el examen de matemáticas hoy?", "pl": "Jimin, jak był dzisiaj egzamin z matematyki?", "it": "Jimin, com'è andato l'esame di matematica oggi?", "sv": "Jimin, hur gick matematikprovet idag?", "fi": "Jimin, miten matematiikan koe meni tänään?", "ja": "ジミン、今日の数学のテストはどうだった？", "zh-CN": "智敏，今天的数学考试怎么样？"}}, {"speaker": "지민", "text": "어려웠어. 문제가 너무 많았어.", "trans": {"en": "It was hard. There were too many questions.", "de": "Es war schwer. Es gab zu viele Fragen.", "fr": "C'était difficile. Il y avait trop de questions.", "es": "Fue difícil. Había demasiadas preguntas.", "pl": "Było trudno. Było za dużo pytań.", "it": "Era difficile. C'erano troppe domande.", "sv": "Det var svårt. Det var för många frågor.", "fi": "Se oli vaikea. Kysymyksiä oli liikaa.", "ja": "難しかった。問題が多すぎた。", "zh-CN": "很难。题目太多了。"}}, {"speaker": "수미", "text": "나도 잘 못 봤어. 다음에는 같이 공부하자.", "trans": {"en": "I didn't do well either. Let's study together next time.", "de": "Ich habe auch nicht gut abgeschnitten. Lass uns nächstes Mal zusammen lernen.", "fr": "Moi non plus je n'ai pas bien fait. Étudions ensemble la prochaine fois.", "es": "Yo tampoco lo hice bien. Estudiemos juntos la próxima vez.", "pl": "Ja też nie poszło mi dobrze. Uczmy się razem następnym razem.", "it": "Neanch'io ho fatto bene. Studiamo insieme la prossima volta.", "sv": "Jag gick inte heller bra. Låt oss studera tillsammans nästa gång.", "fi": "Minullakaan ei mennyt hyvin. Opiskellaan yhdessä ensi kerralla.", "ja": "私もうまくいかなかった。次は一緒に勉強しよう。", "zh-CN": "我也没考好。下次我们一起学习吧。"}}, {"speaker": "지민", "text": "좋아! 도서관에서 만날까?", "trans": {"en": "Sure! Shall we meet at the library?", "de": "Gut! Sollen wir uns in der Bibliothek treffen?", "fr": "D'accord ! On se retrouve à la bibliothèque ?", "es": "¡Bien! ¿Nos vemos en la biblioteca?", "pl": "Dobrze! Spotkamy się w bibliotece?", "it": "Va bene! Ci incontriamo in biblioteca?", "sv": "Bra! Ska vi mötas på biblioteket?", "fi": "Hyvä! Tavataan kirjastossa?", "ja": "いいね！図書館で会おうか？", "zh-CN": "好！我们在图书馆见？"}}, {"speaker": "수미", "text": "응, 수업 끝나고 3시에 보자.", "trans": {"en": "Yes, let's meet at 3 o'clock after class.", "de": "Ja, lass uns nach dem Unterricht um 3 Uhr treffen.", "fr": "Oui, retrouvons-nous à 3 heures après les cours.", "es": "Sí, nos vemos a las 3 después de clase.", "pl": "Tak, spotkajmy się o 3 po lekcjach.", "it": "Sì, ci vediamo alle 3 dopo la lezione.", "sv": "Ja, vi ses klockan 3 efter lektionen.", "fi": "Joo, tavataan klo 3 tuntien jälkeen.", "ja": "うん、授業が終わったら3時に会おう。", "zh-CN": "好，下课后3点见。"}}, {"speaker": "지민", "text": "알았어. 그때 봐.", "trans": {"en": "Got it. See you then.", "de": "Verstanden. Bis dann.", "fr": "D'accord. À tout à l'heure.", "es": "Entendido. Hasta luego.", "pl": "Rozumiem. Do zobaczenia.", "it": "Capito. A dopo.", "sv": "Okej. Vi ses då.", "fi": "Selvä. Nähdään sitten.", "ja": "わかった。その時にね。", "zh-CN": "好的，到时见。"}}], "vocab": [{"word": "수학", "trans": {"en": "math", "de": "Mathematik", "fr": "mathématiques", "es": "matemáticas", "pl": "matematyka", "it": "matematica", "sv": "matematik", "fi": "matematiikka", "ja": "数学", "zh-CN": "数学"}}, {"word": "시험", "trans": {"en": "exam / test", "de": "Prüfung", "fr": "examen", "es": "examen", "pl": "egzamin", "it": "esame", "sv": "prov", "fi": "koe", "ja": "試験", "zh-CN": "考试"}}, {"word": "어렵다", "trans": {"en": "to be difficult", "de": "schwierig sein", "fr": "être difficile", "es": "ser difícil", "pl": "być trudnym", "it": "essere difficile", "sv": "vara svårt", "fi": "olla vaikea", "ja": "難しい", "zh-CN": "难"}}, {"word": "문제", "trans": {"en": "problem / question", "de": "Problem / Aufgabe", "fr": "problème / question", "es": "problema / pregunta", "pl": "problem / pytanie", "it": "problema / domanda", "sv": "problem / fråga", "fi": "ongelma / kysymys", "ja": "問題", "zh-CN": "问题"}}, {"word": "공부하다", "trans": {"en": "to study", "de": "lernen", "fr": "étudier", "es": "estudiar", "pl": "uczyć się", "it": "studiare", "sv": "studera", "fi": "opiskella", "ja": "勉強する", "zh-CN": "学习"}}, {"word": "도서관", "trans": {"en": "library", "de": "Bibliothek", "fr": "bibliothèque", "es": "biblioteca", "pl": "biblioteka", "it": "biblioteca", "sv": "bibliotek", "fi": "kirjasto", "ja": "図書館", "zh-CN": "图书馆"}}, {"word": "수업", "trans": {"en": "class / lesson", "de": "Unterricht", "fr": "cours", "es": "clase", "pl": "lekcja", "it": "lezione", "sv": "lektion", "fi": "oppitunti", "ja": "授業", "zh-CN": "课"}}, {"word": "끝나다", "trans": {"en": "to end / finish", "de": "enden", "fr": "finir", "es": "terminar", "pl": "kończyć się", "it": "finire", "sv": "sluta", "fi": "loppua", "ja": "終わる", "zh-CN": "结束"}}, {"word": "같이", "trans": {"en": "together", "de": "zusammen", "fr": "ensemble", "es": "juntos", "pl": "razem", "it": "insieme", "sv": "tillsammans", "fi": "yhdessä", "ja": "一緒に", "zh-CN": "一起"}}, {"word": "다음", "trans": {"en": "next", "de": "nächste(r/s)", "fr": "prochain", "es": "siguiente / próximo", "pl": "następny", "it": "prossimo", "sv": "nästa", "fi": "seuraava", "ja": "次", "zh-CN": "下次"}}], "patterns": [{"pattern": "~(으)ㄹ까?", "patternTrans": {"en": "Shall we ~? / Should we ~?", "de": "Sollen wir ~?", "fr": "On ~ ?", "es": "¿~emos?", "pl": "Czy ~emy?", "it": "~iamo?", "sv": "Ska vi ~?", "fi": "Mennäänkö ~?", "ja": "～しようか？", "zh-CN": "我们～吗？"}, "example": "도서관에서 만날까?", "trans": {"en": "Shall we meet at the library?", "de": "Sollen wir uns in der Bibliothek treffen?", "fr": "On se retrouve à la bibliothèque ?", "es": "¿Nos vemos en la biblioteca?", "pl": "Spotkamy się w bibliotece?", "it": "Ci incontriamo in biblioteca?", "sv": "Ska vi mötas på biblioteket?", "fi": "Tavataan kirjastossa?", "ja": "図書館で会おうか？", "zh-CN": "我们在图书馆见吗？"}}, {"pattern": "~자", "patternTrans": {"en": "Let's ~", "de": "Lass uns ~", "fr": "Allons ~", "es": "Vamos a ~", "pl": "Chodźmy ~", "it": "~iamo", "sv": "Låt oss ~", "fi": "Mennään ~", "ja": "～しよう", "zh-CN": "我们～吧"}, "example": "같이 공부하자.", "trans": {"en": "Let's study together.", "de": "Lass uns zusammen lernen.", "fr": "Étudions ensemble.", "es": "Estudiemos juntos.", "pl": "Uczmy się razem.", "it": "Studiamo insieme.", "sv": "Låt oss studera tillsammans.", "fi": "Opiskellaan yhdessä.", "ja": "一緒に勉強しよう。", "zh-CN": "一起学习吧。"}}, {"pattern": "나도 ~", "patternTrans": {"en": "Me too ~ / I also ~", "de": "Ich auch ~", "fr": "Moi aussi ~", "es": "Yo también ~", "pl": "Ja też ~", "it": "Anch'io ~", "sv": "Jag också ~", "fi": "Minäkin ~", "ja": "私も～", "zh-CN": "我也～"}, "example": "나도 잘 못 봤어.", "trans": {"en": "I didn't do well either.", "de": "Ich habe auch nicht gut abgeschnitten.", "fr": "Moi non plus, je n'ai pas bien fait.", "es": "Yo tampoco lo hice bien.", "pl": "Ja też nie poszło mi dobrze.", "it": "Neanch'io ho fatto bene.", "sv": "Jag gick inte heller bra.", "fi": "Minullakaan ei mennyt hyvin.", "ja": "私もうまくいかなかった。", "zh-CN": "我也没考好。"}}], "quizzes": [{"id": 1, "type": "comprehension", "questionAudio": "지민이는 수학 시험이 어땠다고 했어요?", "questionTrans": {"en": "What did Jimin say about the math exam?", "de": "Was sagte Jimin über die Matheprüfung?", "fr": "Qu'a dit Jimin de l'examen de maths ?", "es": "¿Qué dijo Jimin sobre el examen de matemáticas?", "pl": "Co Jimin powiedział o egzaminie z matematyki?", "it": "Cosa ha detto Jimin dell'esame di matematica?", "sv": "Vad sa Jimin om matematikprovet?", "fi": "Mitä Jimin sanoi matematiikan kokeesta?", "ja": "ジミンは数学のテストについて何と言いましたか？", "zh-CN": "智敏说数学考试怎么样？"}, "options": [{"text": "1) 어려웠어요.", "trans": {"en": "It was difficult.", "de": "Es war schwierig.", "fr": "C'était difficile.", "es": "Fue difícil.", "pl": "Było trudno.", "it": "Era difficile.", "sv": "Det var svårt.", "fi": "Se oli vaikea.", "ja": "難しかったです。", "zh-CN": "很难。"}}, {"text": "2) 쉬웠어요.", "trans": {"en": "It was easy.", "de": "Es war einfach.", "fr": "C'était facile.", "es": "Fue fácil.", "pl": "Było łatwo.", "it": "Era facile.", "sv": "Det var lätt.", "fi": "Se oli helppo.", "ja": "簡単でした。", "zh-CN": "很容易。"}}, {"text": "3) 재미있었어요.", "trans": {"en": "It was fun.", "de": "Es war lustig.", "fr": "C'était amusant.", "es": "Fue divertido.", "pl": "Było zabawnie.", "it": "Era divertente.", "sv": "Det var roligt.", "fi": "Se oli hauskaa.", "ja": "楽しかったです。", "zh-CN": "很有趣。"}}, {"text": "4) 괜찮았어요.", "trans": {"en": "It was okay.", "de": "Es war in Ordnung.", "fr": "C'était bien.", "es": "Estuvo bien.", "pl": "Było okej.", "it": "Era okay.", "sv": "Det var okej.", "fi": "Se oli ihan ok.", "ja": "まあまあでした。", "zh-CN": "还好。"}}], "answer": 0, "explanation": {"en": "Jimin said '어려웠어' (it was hard) because there were too many questions.", "de": "Jimin sagte '어려웠어' (es war schwer), weil es zu viele Fragen gab.", "fr": "Jimin a dit '어려웠어' (c'était difficile) car il y avait trop de questions.", "es": "Jimin dijo '어려웠어' (fue difícil) porque había demasiadas preguntas.", "pl": "Jimin powiedział '어려웠어' (było trudno), bo było za dużo pytań.", "it": "Jimin ha detto '어려웠어' (era difficile) perché c'erano troppe domande.", "sv": "Jimin sa '어려웠어' (det var svårt) eftersom det var för många frågor.", "fi": "Jimin sanoi '어려웠어' (se oli vaikea), koska kysymyksiä oli liikaa.", "ja": "ジミンは「어려웠어」（難しかった）と言いました。問題が多すぎたからです。", "zh-CN": "智敏说\"어려웠어\"（很难），因为题目太多了。"}}, {"id": 2, "type": "vocabulary", "questionAudio": "도서관이 무슨 뜻이에요?", "questionTrans": {"en": "What does '도서관' mean?", "de": "Was bedeutet '도서관'?", "fr": "Que signifie '도서관' ?", "es": "¿Qué significa '도서관'?", "pl": "Co znaczy '도서관'?", "it": "Cosa significa '도서관'?", "sv": "Vad betyder '도서관'?", "fi": "Mitä '도서관' tarkoittaa?", "ja": "「도서관」はどういう意味ですか？", "zh-CN": "\"도서관\"是什么意思？"}, "options": [{"text": "1) 식당", "trans": {"en": "restaurant", "de": "Restaurant", "fr": "restaurant", "es": "restaurante", "pl": "restauracja", "it": "ristorante", "sv": "restaurang", "fi": "ravintola", "ja": "食堂", "zh-CN": "餐厅"}}, {"text": "2) 학교", "trans": {"en": "school", "de": "Schule", "fr": "école", "es": "escuela", "pl": "szkoła", "it": "scuola", "sv": "skola", "fi": "koulu", "ja": "学校", "zh-CN": "学校"}}, {"text": "3) 도서관", "trans": {"en": "library", "de": "Bibliothek", "fr": "bibliothèque", "es": "biblioteca", "pl": "biblioteka", "it": "biblioteca", "sv": "bibliotek", "fi": "kirjasto", "ja": "図書館", "zh-CN": "图书馆"}}, {"text": "4) 병원", "trans": {"en": "hospital", "de": "Krankenhaus", "fr": "hôpital", "es": "hospital", "pl": "szpital", "it": "ospedale", "sv": "sjukhus", "fi": "sairaala", "ja": "病院", "zh-CN": "医院"}}], "answer": 2, "explanation": {"en": "'도서관' means library. Sumi and Jimin decided to meet at the library to study.", "de": "'도서관' bedeutet Bibliothek. Sumi und Jimin beschlossen, sich in der Bibliothek zu treffen.", "fr": "'도서관' signifie bibliothèque. Sumi et Jimin ont décidé de se retrouver à la bibliothèque.", "es": "'도서관' significa biblioteca. Sumi y Jimin decidieron verse en la biblioteca.", "pl": "'도서관' oznacza bibliotekę. Sumi i Jimin postanowili spotkać się w bibliotece.", "it": "'도서관' significa biblioteca. Sumi e Jimin hanno deciso di incontrarsi in biblioteca.", "sv": "'도서관' betyder bibliotek. Sumi och Jimin bestämde sig för att mötas på biblioteket.", "fi": "'도서관' tarkoittaa kirjastoa. Sumi ja Jimin päättivät tavata kirjastossa.", "ja": "「도서관」は図書館という意味です。スミとジミンは図書館で会うことにしました。", "zh-CN": "\"도서관\"的意思是图书馆。秀美和智敏决定在图书馆见面学习。"}}, {"id": 3, "type": "grammar", "questionAudio": "수미와 지민은 몇 시에 만나기로 했어요?", "questionTrans": {"en": "What time did Sumi and Jimin agree to meet?", "de": "Um wie viel Uhr haben sich Sumi und Jimin verabredet?", "fr": "À quelle heure Sumi et Jimin ont-ils convenu de se retrouver ?", "es": "¿A qué hora quedaron en verse Sumi y Jimin?", "pl": "O której godzinie Sumi i Jimin umówili się na spotkanie?", "it": "A che ora Sumi e Jimin hanno deciso di incontrarsi?", "sv": "Vilken tid bestämde sig Sumi och Jimin för att mötas?", "fi": "Mihin aikaan Sumi ja Jimin sopivat tapaavansa?", "ja": "スミとジミンは何時に会う約束をしましたか？", "zh-CN": "秀美和智敏约好几点见面？"}, "options": [{"text": "1) 1시", "trans": {"en": "1 o'clock", "de": "1 Uhr", "fr": "1 heure", "es": "la 1", "pl": "1:00", "it": "le 1", "sv": "klockan 1", "fi": "kello 1", "ja": "1時", "zh-CN": "1点"}}, {"text": "2) 2시", "trans": {"en": "2 o'clock", "de": "2 Uhr", "fr": "2 heures", "es": "las 2", "pl": "2:00", "it": "le 2", "sv": "klockan 2", "fi": "kello 2", "ja": "2時", "zh-CN": "2点"}}, {"text": "3) 3시", "trans": {"en": "3 o'clock", "de": "3 Uhr", "fr": "3 heures", "es": "las 3", "pl": "3:00", "it": "le 3", "sv": "klockan 3", "fi": "kello 3", "ja": "3時", "zh-CN": "3点"}}, {"text": "4) 4시", "trans": {"en": "4 o'clock", "de": "4 Uhr", "fr": "4 heures", "es": "las 4", "pl": "4:00", "it": "le 4", "sv": "klockan 4", "fi": "kello 4", "ja": "4時", "zh-CN": "4点"}}], "answer": 2, "explanation": {"en": "Sumi said '수업 끝나고 3시에 보자' — let's meet at 3 after class.", "de": "Sumi sagte '수업 끝나고 3시에 보자' — lass uns nach dem Unterricht um 3 treffen.", "fr": "Sumi a dit '수업 끝나고 3시에 보자' — retrouvons-nous à 3h après les cours.", "es": "Sumi dijo '수업 끝나고 3시에 보자' — nos vemos a las 3 después de clase.", "pl": "Sumi powiedziała '수업 끝나고 3시에 보자' — spotkajmy się o 3 po lekcjach.", "it": "Sumi ha detto '수업 끝나고 3시에 보자' — ci vediamo alle 3 dopo la lezione.", "sv": "Sumi sa '수업 끝나고 3시에 보자' — vi ses klockan 3 efter lektionen.", "fi": "Sumi sanoi '수업 끝나고 3시에 보자' — tavataan klo 3 tuntien jälkeen.", "ja": "スミが「수업 끝나고 3시에 보자」と言いました — 授業が終わったら3時に会おう。", "zh-CN": "秀美说\"수업 끝나고 3시에 보자\"——下课后3点见。"}}, {"type": "comprehension", "questionAudio": "두 사람은 어디서 공부하기로 했어요?", "questionTrans": {"en": "Where did they decide to study?", "de": "Wo haben sie beschlossen zu lernen?", "fr": "Où ont-ils décidé d'étudier ?", "es": "¿Dónde decidieron estudiar?", "pl": "Gdzie postanowili się uczyć?", "it": "Dove hanno deciso di studiare?", "sv": "Var bestämde de sig för att studera?", "fi": "Missä he päättivät opiskella?", "ja": "二人はどこで勉強することにしましたか？", "zh-CN": "两人决定在哪里学习？"}, "options": [{"text": "교실에서요.", "trans": {"en": "In the classroom.", "de": "Im Klassenzimmer.", "fr": "En classe.", "es": "En el aula.", "pl": "W klasie.", "it": "In classe.", "sv": "I klassrummet.", "fi": "Luokkahuoneessa.", "ja": "教室で。", "zh-CN": "在教室。"}}, {"text": "집에서요.", "trans": {"en": "At home.", "de": "Zu Hause.", "fr": "À la maison.", "es": "En casa.", "pl": "W domu.", "it": "A casa.", "sv": "Hemma.", "fi": "Kotona.", "ja": "家で。", "zh-CN": "在家。"}}, {"text": "도서관에서요.", "trans": {"en": "At the library.", "de": "In der Bibliothek.", "fr": "À la bibliothèque.", "es": "En la biblioteca.", "pl": "W bibliotece.", "it": "In biblioteca.", "sv": "På biblioteket.", "fi": "Kirjastossa.", "ja": "図書館で。", "zh-CN": "在图书馆。"}}, {"text": "카페에서요.", "trans": {"en": "At a café.", "de": "Im Café.", "fr": "Dans un café.", "es": "En una cafetería.", "pl": "W kawiarni.", "it": "In un caffè.", "sv": "På ett kafé.", "fi": "Kahvilassa.", "ja": "カフェで。", "zh-CN": "在咖啡馆。"}}], "answer": 2, "explanation": {"en": "Sumi suggests meeting at the library (도서관에서 만날까?) and Jimin agrees.", "de": "Sumi schlägt die Bibliothek vor und Jimin stimmt zu.", "fr": "Sumi propose la bibliothèque et Jimin accepte.", "es": "Sumi propone la biblioteca y Jimin acepta.", "pl": "Sumi proponuje bibliotekę i Jimin się zgadza.", "it": "Sumi propone la biblioteca e Jimin accetta.", "sv": "Sumi föreslår biblioteket och Jimin håller med.", "fi": "Sumi ehdottaa kirjastoa ja Jimin suostuu.", "ja": "スミが図書館を提案し、ジミンが同意。", "zh-CN": "秀美提议去图书馆，智敏同意了。"}}]},
  22: {"id": 22, "title": "22. 여행 계획 (국내 여행)", "titleTrans": {"en": "22. Travel Plans (Domestic Travel)", "de": "22. Reisepläne (Inlandsreise)", "fr": "22. Plans de voyage (voyage intérieur)", "es": "22. Planes de viaje (viaje nacional)", "pl": "22. Plany podróży (podróż krajowa)", "it": "22. Piani di viaggio (viaggio nazionale)", "sv": "22. Reseplanering (inrikesresa)", "fi": "22. Matkasuunnitelmat (kotimaan matka)", "ja": "22. 旅行計画（国内旅行）", "zh-CN": "22. 旅行计划（国内旅行）"}, "desc": "국내 여행을 계획하는 대화를 연습합니다. 장소, 교통수단, 여행 준비에 대해 이야기해 보세요.", "descTrans": {"en": "Practice conversations about planning a domestic trip. Talk about places, transportation, and travel preparation.", "de": "Üben Sie Gespräche über die Planung einer Inlandsreise. Sprechen Sie über Orte, Verkehrsmittel und Reisevorbereitung.", "fr": "Entraînez-vous aux conversations sur la planification d'un voyage intérieur. Parlez de lieux, de transports et de préparation.", "es": "Practica conversaciones sobre planificar un viaje nacional. Habla de lugares, transporte y preparación del viaje.", "pl": "Ćwicz rozmowy o planowaniu podróży krajowej. Rozmawiaj o miejscach, środkach transportu i przygotowaniach.", "it": "Esercitati nelle conversazioni sulla pianificazione di un viaggio nazionale. Parla di luoghi, trasporti e preparativi.", "sv": "Öva på samtal om att planera en inrikesresa. Prata om platser, transport och resförberedelser.", "fi": "Harjoittele kotimaan matkan suunnittelusta käytäviä keskusteluja. Puhu paikoista, kulkuvälineistä ja matkan valmistelusta.", "ja": "国内旅行を計画する会話を練習します。場所、交通手段、旅行の準備について話しましょう。", "zh-CN": "练习计划国内旅行的对话。谈论地点、交通方式和旅行准备。"}, "dialogue": [{"speaker": "수미", "text": "이번 주말에 뭐 할 거야?", "trans": {"en": "What are you going to do this weekend?", "de": "Was machst du dieses Wochenende?", "fr": "Qu'est-ce que tu vas faire ce week-end ?", "es": "¿Qué vas a hacer este fin de semana?", "pl": "Co będziesz robić w ten weekend?", "it": "Cosa farai questo fine settimana?", "sv": "Vad ska du göra den här helgen?", "fi": "Mitä aiot tehdä tänä viikonloppuna?", "ja": "今週末は何をするつもり？", "zh-CN": "这个周末你打算做什么？"}}, {"speaker": "지민", "text": "부산에 여행 가려고 해. 같이 갈래?", "trans": {"en": "I'm planning to travel to Busan. Want to come?", "de": "Ich plane eine Reise nach Busan. Willst du mitkommen?", "fr": "Je prévois de voyager à Busan. Tu veux venir ?", "es": "Voy a ir de viaje a Busan. ¿Quieres venir?", "pl": "Planuję pojechać do Busan. Chcesz jechać?", "it": "Ho in programma di andare a Busan. Vuoi venire?", "sv": "Jag planerar att resa till Busan. Vill du följa med?", "fi": "Olen suunnitellut matkaa Busaniin. Haluatko tulla?", "ja": "釜山に旅行に行こうと思ってる。一緒に行く？", "zh-CN": "我打算去釜山旅游。要一起去吗？"}}, {"speaker": "수미", "text": "좋아! 어떻게 갈 거야? 기차로?", "trans": {"en": "Sounds good! How are we going? By train?", "de": "Super! Wie fahren wir? Mit dem Zug?", "fr": "Super ! Comment on y va ? En train ?", "es": "¡Genial! ¿Cómo vamos? ¿En tren?", "pl": "Świetnie! Jak pojedziemy? Pociągiem?", "it": "Ottimo! Come andiamo? In treno?", "sv": "Bra! Hur ska vi åka? Med tåg?", "fi": "Hienoa! Miten menemme? Junalla?", "ja": "いいね！どうやって行くの？電車で？", "zh-CN": "好！怎么去？坐火车吗？"}}, {"speaker": "지민", "text": "응, KTX 타면 2시간 30분 걸려.", "trans": {"en": "Yes, it takes 2 hours 30 minutes by KTX.", "de": "Ja, mit dem KTX dauert es 2 Stunden 30 Minuten.", "fr": "Oui, ça prend 2 heures 30 en KTX.", "es": "Sí, en KTX tarda 2 horas 30 minutos.", "pl": "Tak, KTX jedzie 2 godziny 30 minut.", "it": "Sì, in KTX ci vogliono 2 ore e 30 minuti.", "sv": "Ja, med KTX tar det 2 timmar 30 minuter.", "fi": "Kyllä, KTX:llä kestää 2 tuntia 30 minuuttia.", "ja": "うん、KTXに乗ると2時間30分かかる。", "zh-CN": "是的，坐KTX需要2小时30分钟。"}}, {"speaker": "수미", "text": "빠르네! 거기서 뭐 할 거야?", "trans": {"en": "That's fast! What will we do there?", "de": "Das ist schnell! Was machen wir dort?", "fr": "C'est rapide ! Qu'est-ce qu'on va faire là-bas ?", "es": "¡Es rápido! ¿Qué vamos a hacer allí?", "pl": "Szybko! Co będziemy tam robić?", "it": "Veloce! Cosa faremo lì?", "sv": "Det är snabbt! Vad ska vi göra där?", "fi": "Se on nopea! Mitä teemme siellä?", "ja": "速いね！向こうでは何をするの？", "zh-CN": "真快！在那里做什么？"}}, {"speaker": "지민", "text": "해운대 바다도 보고, 시장에서 음식도 먹자.", "trans": {"en": "Let's see Haeundae Beach and eat food at the market.", "de": "Lass uns den Strand Haeundae sehen und auf dem Markt essen.", "fr": "Allons voir la plage de Haeundae et manger au marché.", "es": "Veamos la playa Haeundae y comamos en el mercado.", "pl": "Zobaczmy plażę Haeundae i zjedzmy na targu.", "it": "Vediamo la spiaggia di Haeundae e mangiamo al mercato.", "sv": "Låt oss se Haeundae-stranden och äta mat på marknaden.", "fi": "Katsotaan Haeundaen ranta ja syödään torilla.", "ja": "海雲台の海を見て、市場で食べ物も食べよう。", "zh-CN": "去看看海云台海边，也在市场吃东西。"}}, {"speaker": "수미", "text": "완전 좋아! 빨리 가고 싶다.", "trans": {"en": "That sounds amazing! I can't wait to go.", "de": "Das klingt toll! Ich kann es kaum erwarten.", "fr": "C'est super ! J'ai hâte d'y aller.", "es": "¡Suena genial! Ganas de ir.", "pl": "Brzmi super! Nie mogę się doczekać.", "it": "Sembra fantastico! Non vedo l'ora di andare.", "sv": "Det låter fantastiskt! Jag längtar dit.", "fi": "Se kuulostaa mahtavalta! En malta odottaa.", "ja": "最高！早く行きたいな。", "zh-CN": "太棒了！好想快点去。"}}], "vocab": [{"word": "여행", "trans": {"en": "travel / trip", "de": "Reise", "fr": "voyage", "es": "viaje", "pl": "podróż", "it": "viaggio", "sv": "resa", "fi": "matka", "ja": "旅行", "zh-CN": "旅行"}}, {"word": "주말", "trans": {"en": "weekend", "de": "Wochenende", "fr": "week-end", "es": "fin de semana", "pl": "weekend", "it": "fine settimana", "sv": "helg", "fi": "viikonloppu", "ja": "週末", "zh-CN": "周末"}}, {"word": "기차", "trans": {"en": "train", "de": "Zug", "fr": "train", "es": "tren", "pl": "pociąg", "it": "treno", "sv": "tåg", "fi": "juna", "ja": "電車", "zh-CN": "火车"}}, {"word": "걸리다", "trans": {"en": "to take (time)", "de": "dauern", "fr": "prendre (du temps)", "es": "tardar", "pl": "zajmować (czas)", "it": "impiegare (tempo)", "sv": "ta (tid)", "fi": "kestää", "ja"  torilla.", "ja": "ジミンが海雲台の海を見て市場で食べることを提案しました。", "zh-CN": "智敏建议去看海云台海边，在市场吃东西。"}}]},
  23: {"id": 23, "title": "23. 숙박 예약 (호텔)", "titleTrans": {"en": "23. Accommodation Booking (Hotel)", "de": "23. Unterkunftsbuchung (Hotel)", "fr": "23. Réservation d'hébergement (hôtel)", "es": "23. Reserva de alojamiento (hotel)", "pl": "23. Rezerwacja noclegu (hotel)", "it": "23. Prenotazione alloggio (hotel)", "sv": "23. Bokning av boende (hotell)", "fi": "23. Majoitusvaraus (hotelli)", "ja": "23. 宿泊予約（ホテル）", "zh-CN": "23. 住宿预订（酒店）"}, "desc": "호텔을 예약하는 대화를 연습합니다. 체크인, 체크아웃, 방 종류에 대해 이야기해 보세요.", "descTrans": {"en": "Practice conversations for booking a hotel. Talk about check-in, check-out, and room types.", "de": "Üben Sie Gespräche für die Hotelbuchung. Sprechen Sie über Check-in, Check-out und Zimmertypen.", "fr": "Entraînez-vous aux conversations pour réserver un hôtel. Parlez du check-in, du check-out et des types de chambres.", "es": "Practica conversaciones para reservar un hotel. Habla sobre el check-in, el check-out y los tipos de habitaciones.", "pl": "Ćwicz rozmowy przy rezerwacji hotelu. Rozmawiaj o zameldowaniu, wymeldowaniu i typach pokojów.", "it": "Esercitati nelle conversazioni per prenotare un hotel. Parla di check-in, check-out e tipi di camera.", "sv": "Öva på samtal för att boka ett hotell. Prata om incheckning, utcheckning och rumstyper.", "fi": "Harjoittele hotellin varaamisen keskusteluja. Puhu sisäänkirjautumisesta, uloskikrjautumisesta ja huonetyypeistä.", "ja": "ホテルを予約する会話を練習します。チェックイン、チェックアウト、部屋のタイプについて話しましょう。", "zh-CN": "练习预订酒店的对话。谈论入住、退房和房间类型。"}, "dialogue": [{"speaker": "수미", "text": "여보세요, 방을 예약하고 싶어요.", "trans": {"en": "Hello, I'd like to book a room.", "de": "Hallo, ich möchte ein Zimmer buchen.", "fr": "Allô, je voudrais réserver une chambre.", "es": "Hola, me gustaría reservar una habitación.", "pl": "Słucham, chciałabym zarezerwować pokój.", "it": "Pronto, vorrei prenotare una camera.", "sv": "Hej, jag vill boka ett rum.", "fi": "Hei, haluaisin varata huoneen.", "ja": "もしもし、部屋を予約したいのですが。", "zh-CN": "您好，我想预订一间客房。"}}, {"speaker": "지민", "text": "네, 언제 오실 거예요?", "trans": {"en": "Sure, when will you be coming?", "de": "Natürlich, wann kommen Sie?", "fr": "Bien sûr, quand allez-vous venir ?", "es": "Claro, ¿cuándo viene?", "pl": "Oczywiście, kiedy Pan/Pani przyjedzie?", "it": "Certo, quando verrà?", "sv": "Självklart, när tänker du komma?", "fi": "Toki, milloin aiotte tulla?", "ja": "はい、いついらっしゃいますか？", "zh-CN": "好的，您什么时候来？"}}, {"speaker": "수미", "text": "이번 주 금요일에 체크인할 거예요.", "trans": {"en": "I'll check in this Friday.", "de": "Ich werde diesen Freitag einchecken.", "fr": "Je vais m'enregistrer ce vendredi.", "es": "Haré el check-in este viernes.", "pl": "Zamelduje się w ten piątek.", "it": "Farò il check-in questo venerdì.", "sv": "Jag checkar in den här fredagen.", "fi": "Kirjaudun sisään tänä perjantaina.", "ja": "今週の金曜日にチェックインします。", "zh-CN": "我这周五办理入住。"}}, {"speaker": "지민", "text": "몇 박 하실 거예요?", "trans": {"en": "How many nights will you stay?", "de": "Wie viele Nächte bleiben Sie?", "fr": "Combien de nuits allez-vous rester ?", "es": "¿Cuántas noches se va a quedar?", "pl": "Ile nocy zostanie Pan/Pani?", "it": "Quante notti si fermerà?", "sv": "Hur många nätter ska du stanna?", "fi": "Kuinka monta yötä aiotte olla?", "ja": "何泊されますか？", "zh-CN": "您住几晚？"}}, {"speaker": "수미", "text": "2박 3일이요. 더블룸 있어요?", "trans": {"en": "Two nights and three days. Do you have a double room?", "de": "Zwei Nächte und drei Tage. Gibt es ein Doppelzimmer?", "fr": "Deux nuits et trois jours. Avez-vous une chambre double ?", "es": "Dos noches y tres días. ¿Tienen habitación doble?", "pl": "Dwie noce i trzy dni. Czy jest pokój dwuosobowy?", "it": "Due notti e tre giorni. Avete una camera doppia?", "sv": "Två nätter och tre dagar. Finns det ett dubbelrum?", "fi": "Kaksi yötä ja kolme päivää. Onko teillä kahden hengen huone?", "ja": "2泊3日です。ダブルルームはありますか？", "zh-CN": "两晚三天。有双人房吗？"}}, {"speaker": "지민", "text": "네, 있어요. 1박에 8만 원이에요.", "trans": {"en": "Yes, we have one. It's 80,000 won per night.", "de": "Ja, wir haben eins. Es kostet 80.000 Won pro Nacht.", "fr": "Oui, nous en avons une. C'est 80 000 wons par nuit.", "es": "Sí, tenemos una. Son 80.000 won por noche.", "pl": "Tak, mamy. To 80 000 wonów za noc.", "it": "Sì, abbiamo una. Costa 80.000 won per notte.", "sv": "Ja, vi har ett. Det kostar 80 000 won per natt.", "fi": "Kyllä, meillä on. Se maksaa 80 000 wonia per yö.", "ja": "はい、ございます。1泊8万ウォンです。", "zh-CN": "有的。每晚8万韩元。"}}, {"speaker": "수미", "text": "좋아요. 그럼 예약할게요.", "trans": {"en": "Great. Then I'll book it.", "de": "Gut. Dann buche ich es.", "fr": "Bien. Alors je vais réserver.", "es": "Bien. Entonces voy a reservar.", "pl": "Dobrze. W takim razie rezerwuję.", "it": "Bene. Allora prenoto.", "sv": "Bra. Då bokar jag.", "fi": "Hyvä. Sitten varaan.", "ja": "いいですね。では予約します。", "zh-CN": "好的，那我就预订了。"}}], "vocab": [{"word": "예약하다", "trans": {"en": "to book / reserve", "de": "reservieren", "fr": "réserver", "es": "reservar", "pl": "rezerwować", "it": "prenotare", "sv": "boka", "fi": "varata", "ja": "予約する", "zh-CN": "预订"}}, {"word": "체크인", "trans": {"en": "check-in", "de": "Einchecken", "fr": "check-in", "es": "check-in", "pl": "zameldowanie", "it": "check-in", "sv": "incheckning", "fi": "sisäänkirjautuminen", "ja": "チェックイン", "zh-CN": "入住"}}, {"word": "체크아웃", "trans": {"en": "check-out", "de": "Auschecken", "fr": "check-out", "es": "check-out", "pl": "wymeldowanie", "it": "check-out", "sv": "utcheckning", "fi": "uloskirjautuminen", "ja": "チェックアウト", "zh-CN": "退房"}}, {"word": "방", "trans": {"en": "room", "de": "Zimmer", "fr": "chambre", "es": "habitación", "pl": "pokój", "it": "camera", "sv": "rum", "fi": "huone", "ja": "部屋", "zh-CN": "房间"}}, {"word": "박", "trans": {"en": "night (counter)", "de": "Nacht (Zählwort)", "fr": "nuit (compteur)", "es": "noche (contador)", "pl": "noc (liczebnik)", "it": "notte (numerale)", "sv": "natt (räkneord)", "fi": "yö (laskusana)", "ja": "泊（宿泊の単位）", "zh-CN": "晚（住宿单位）"}}, {"word": "더블룸", "trans": {"en": "double room", "de": "Doppelzimmer", "fr": "chambre double", "es": "habitación doble", "pl": "pokój dwuosobowy", "it": "camera doppia", "sv": "dubbelrum", "fi": "kahden hengen huone", "ja": "ダブルルーム", "zh-CN": "双人房"}}, {"word": "금요일", "trans": {"en": "Friday", "de": "Freitag", "fr": "vendredi", "es": "viernes", "pl": "piątek", "it": "venerdì", "sv": "fredag", "fi": "perjantai", "ja": "金曜日", "zh-CN": "星期五"}}, {"word": "1박에", "trans": {"en": "per night", "de": "pro Nacht", "fr": "par nuit", "es": "por noche", "pl": "za noc", "it": "per notte", "sv": "per natt", "fi": "per yö", "ja": "1泊に", "zh-CN": "每晚"}}, {"word": "있어요", "trans": {"en": "there is / we have", "de": "es gibt / wir haben", "fr": "il y a / nous avons", "es": "hay / tenemos", "pl": "jest / mamy", "it": "c'è / abbiamo", "sv": "det finns / vi har", "fi": "on / meillä on", "ja": "あります", "zh-CN": "有"}}], "patterns": [{"pattern": "~고 싶어요", "patternTrans": {"en": "I want to ~", "de": "Ich möchte ~", "fr": "Je veux ~", "es": "Quiero ~", "pl": "Chcę ~", "it": "Voglio ~", "sv": "Jag vill ~", "fi": "Haluan ~", "ja": "～したいです", "zh-CN": "想～"}, "example": "방을 예약하고 싶어요.", "trans": {"en": "I want to book a room.", "de": "Ich möchte ein Zimmer buchen.", "fr": "Je veux réserver une chambre.", "es": "Quiero reservar una habitación.", "pl": "Chcę zarezerwować pokój.", "it": "Voglio prenotare una camera.", "sv": "Jag vill boka ett rum.", "fi": "Haluan varata huoneen.", "ja": "部屋を予約したいです。", "zh-CN": "我想预订一间客房。"}}, {"pattern": "~에 ~할 거예요", "patternTrans": {"en": "I will ~ on/at ~", "de": "Ich werde ~ am/um ~", "fr": "Je vais ~ à/le ~", "es": "Voy a ~ el/en ~", "pl": "Będę ~ w ~", "it": "Farò ~ a/il ~", "sv": "Jag ska ~ på ~", "fi": "Teen ~ ~na", "ja": "～に～するつもりです", "zh-CN": "我打算在～～"}, "example": "금요일에 체크인할 거예요.", "trans": {"en": "I will check in on Friday.", "de": "Ich werde am Freitag einchecken.", "fr": "Je vais m'enregistrer vendredi.", "es": "Haré el check-in el viernes.", "pl": "Zamelduje się w piątek.", "it": "Farò il check-in venerdì.", "sv": "Jag checkar in på fredag.", "fi": "Kirjaudun sisään perjantaina.", "ja": "金曜日にチェックインします。", "zh-CN": "我星期五办理入住。"}}, {"pattern": "~이/가 있어요?", "patternTrans": {"en": "Do you have ~? / Is there ~?", "de": "Gibt es ~ / Haben Sie ~?", "fr": "Avez-vous ~ ? / Il y a ~ ?", "es": "¿Hay ~ ? / ¿Tienen ~ ?", "pl": "Czy jest ~ ? / Czy mają Państwo ~ ?", "it": "C'è ~ ? / Avete ~ ?", "sv": "Finns det ~ ? / Har ni ~ ?", "fi": "Onko ~ ? / Onko teillä ~ ?", "ja": "～がありますか？", "zh-CN": "有～吗？"}, "example": "더블룸 있어요?", "trans": {"en": "Do you have a double room?", "de": "Gibt es ein Doppelzimmer?", "fr": "Avez-vous une chambre double ?", "es": "¿Tienen habitación doble?", "pl": "Czy jest pokój dwuosobowy?", "it": "Avete una camera doppia?", "sv": "Finns det ett dubbelrum?", "fi": "Onko teillä kahden hengen huone?", "ja": "ダブルルームはありますか？", "zh-CN": "有双人房吗？"}}], "quizzes": [{"id": 1, "type": "comprehension", "questionAudio": "수미는 언제 체크인할 거예요?", "questionTrans": {"en": "When will Sumi check in?", "de": "Wann wird Sumi einchecken?", "fr": "Quand Sumi va-t-elle s'enregistrer ?", "es": "¿Cuándo hará Sumi el check-in?", "pl": "Kiedy Sumi się zamelduje?", "it": "Quando farà il check-in Sumi?", "sv": "När kommer Sumi att checka in?", "fi": "Milloin Sumi kirjautuu sisään?", "ja": "スミはいつチェックインしますか？", "zh-CN": "秀美什么时候入住？"}, "options": [{"text": "1) 월요일", "trans": {"en": "Monday", "de": "Montag", "fr": "lundi", "es": "lunes", "pl": "poniedziałek", "it": "lunedì", "sv": "måndag", "fi": "maanantai", "ja": "月曜日", "zh-CN": "星期一"}}, {"text": "2) 수요일", "trans": {"en": "Wednesday", "de": "Mittwoch", "fr": "mercredi", "es": "miércoles", "pl": "środa", "it": "mercoledì", "sv": "onsdag", "fi": "keskiviikko", "ja": "水曜日", "zh-CN": "星期三"}}, {"text": "3) 토요일", "trans": {"en": "Saturday", "de": "Samstag", "fr": "samedi", "es": "sábado", "pl": "sobota", "it": "sabato", "sv": "lördag", "fi": "lauantai", "ja": "土曜日", "zh-CN": "星期六"}}, {"text": "4) 금요일", "trans": {"en": "Friday", "de": "Freitag", "fr": "vendredi", "es": "viernes", "pl": "piątek", "it": "venerdì", "sv": "fredag", "fi": "perjantai", "ja": "金曜日", "zh-CN": "星期五"}}], "answer": 3, "explanation": {"en": "Sumi said '이번 주 금요일에 체크인할 거예요' — I'll check in this Friday.", "de": "Sumi sagte '이번 주 금요일에 체크인할 거예요' — Ich werde diesen Freitag einchecken.", "fr": "Sumi a dit '이번 주 금요일에 체크인할 거예요' — Je vais m'enregistrer ce vendredi.", "es": "Sumi dijo '이번 주 금요일에 체크인할 거예요' — Haré el check-in este viernes.", "pl": "Sumi powiedziała '이번 주 금요일에 체크인할 거예요' — Zamelduje się w ten piątek.", "it": "Sumi ha detto '이번 주 금요일에 체크인할 거예요' — Farò il check-in questo venerdì.", "sv": "Sumi sa '이번 주 금요일에 체크인할 거예요' — Jag checkar in den här fredagen.", "fi": "Sumi sanoi '이번 주 금요일에 체크인할 거예요' — Kirjaudun sisään tänä perjantaina.", "ja": "スミは「이번 주 금요일에 체크인할 거예요」と言いました — 今週の金曜日にチェックインします。", "zh-CN": "秀美说\"이번 주 금요일에 체크인할 거예요\"——我这周五办理入住。"}}, {"id": 2, "type": "vocabulary", "questionAudio": "'2박 3일'은 무슨 뜻이에요?", "questionTrans": {"en": "What does '2박 3일' mean?", "de": "Was bedeutet '2박 3일'?", "fr": "Que signifie '2박 3일' ?", "es": "¿Qué significa '2박 3일'?", "pl": "Co znaczy '2박 3일'?", "it": "Cosa significa '2박 3일'?", "sv": "Vad betyder '2박 3일'?", "fi": "Mitä '2박 3일' tarkoittaa?", "ja": "「2박 3일」はどういう意味ですか？", "zh-CN": "\"2박 3일\"是什么意思？"}, "options": [{"text": "1) 2일 3박", "trans": {"en": "2 days and 3 nights", "de": "2 Tage und 3 Nächte", "fr": "2 jours et 3 nuits", "es": "2 días y 3 noches", "pl": "2 dni i 3 noce", "it": "2 giorni e 3 notti", "sv": "2 dagar och 3 nätter", "fi": "2 päivää ja 3 yötä", "ja": "2日3泊", "zh-CN": "2天3晚"}}, {"text": "2) 2박 3일 = 2 nights and 3 days", "trans": {"en": "2 nights and 3 days", "de": "2 Nächte und 3 Tage", "fr": "2 nuits et 3 jours", "es": "2 noches y 3 días", "pl": "2 noce i 3 dni", "it": "2 notti e 3 giorni", "sv": "2 nätter och 3 dagar", "fi": "2 yötä ja 3 päivää", "ja": "2泊3日", "zh-CN": "2晚3天"}}, {"text": "3) 3박 2일", "trans": {"en": "3 nights and 2 days", "de": "3 Nächte und 2 Tage", "fr": "3 nuits et 2 jours", "es": "3 noches y 2 días", "pl": "3 noce i 2 dni", "it": "3 notti e 2 giorni", "sv": "3 nätter och 2 dagar", "fi": "3 yötä ja 2 päivää", "ja": "3泊2日", "zh-CN": "3晚2天"}}, {"text": "4) 2주", "trans": {"en": "2 weeks", "de": "2 Wochen", "fr": "2 semaines", "es": "2 semanas", "pl": "2 tygodnie", "it": "2 settimane", "sv": "2 veckor", "fi": "2 viikkoa", "ja": "2週間", "zh-CN": "2周"}}], "answer": 1, "explanation": {"en": "'2박 3일' means 2 nights and 3 days. '박' is the counter for nights of accommodation.", "de": "'2박 3일' bedeutet 2 Nächte und 3 Tage. '박' ist das Zählwort für Übernachtungen.", "fr": "'2박 3일' signifie 2 nuits et 3 jours. '박' est le compteur pour les nuits d'hébergement.", "es": "'2박 3일' significa 2 noches y 3 días. '박' es el contador de noches de alojamiento.", "pl": "'2박 3일' oznacza 2 noce i 3 dni. '박' to liczebnik dla nocy noclegowych.", "it": "'2박 3일' significa 2 notti e 3 giorni. '박' è il numerale per le notti di alloggio.", "sv": "'2박 3일' betyder 2 nätter och 3 dagar. '박' är räkneordet för övernattningar.", "fi": "'2박 3일' tarkoittaa 2 yötä ja 3 päivää. '박' on yöpymisten laskusana.", "ja": "「2박 3일」は2泊3日という意味です。「박」は宿泊の数を数える単位です。", "zh-CN": "2박 3일\"是2晚3天的意思。\"박\"是住宿晚数的单位。\""}}, {"id": 3, "type": "comprehension", "questionAudio": "1박에 얼마예요?", "questionTrans": {"en": "How much is it per night?", "de": "Wie viel kostet eine Nacht?", "fr": "Combien ça coûte par nuit ?", "es": "¿Cuánto cuesta por noche?", "pl": "Ile kosztuje jedna noc?", "it": "Quanto costa per notte?", "sv": "Hur mycket kostar det per natt?", "fi": "Paljonko maksaa per yö?", "ja": "1泊いくらですか？", "zh-CN": "每晚多少钱？"}, "options": [{"text": "1) 5만 원", "trans": {"en": "50,000 won", "de": "50.000 Won", "fr": "50 000 wons", "es": "50.000 won", "pl": "50 000 wonów", "it": "50.000 won", "sv": "50 000 won", "fi": "50 000 wonia", "ja": "5万ウォン", "zh-CN": "5万韩元"}}, {"text": "2) 8만 원", "trans": {"en": "80,000 won", "de": "80.000 Won", "fr": "80 000 wons", "es": "80.000 won", "pl": "80 000 wonów", "it": "80.000 won", "sv": "80 000 won", "fi": "80 000 wonia", "ja": "8万ウォン", "zh-CN": "8万韩元"}}, {"text": "3) 10만 원", "trans": {"en": "100,000 won", "de": "100.000 Won", "fr": "100 000 wons", "es": "100.000 won", "pl": "100 000 wonów", "it": "100.000 won", "sv": "100 000 won", "fi": "100 000 wonia", "ja": "10万ウォン", "zh-CN": "10万韩元"}}, {"text": "4) 12만 원", "trans": {"en": "120,000 won", "de": "120.000 Won", "fr": "120 000 wons", "es": "120.000 won", "pl": "120 000 wonów", "it": "120.000 won", "sv": "120 000 won", "fi": "120 000 wonia", "ja": "12万ウォン", "zh-CN": "12万韩元"}}], "answer": 1, "explanation": {"en": "The hotel staff (Jimin) said '1박에 8만 원이에요' — It's 80,000 won per night.", "de": "Das Hotelpersonal (Jimin) sagte '1박에 8만 원이에요' — Es kostet 80.000 Won pro Nacht.", "fr": "Le personnel de l'hôtel (Jimin) a dit '1박에 8만 원이에요' — C'est 80 000 wons par nuit.", "es": "El personal del hotel (Jimin) dijo '1박에 8만 원이에요' — Son 80.000 won por noche.", "pl": "Personel hotelu (Jimin) powiedział '1박에 8만 원이에요' — To 80 000 wonów za noc.", "it": "Il personale dell'hotel (Jimin) ha detto '1박에 8만 원이에요' — Costa 80.000 won per notte.", "sv": "Hotellpersonalen (Jimin) sa '1박에 8만 원이에요' — Det kostar 80 000 won per natt.", "fi": "Hotellin henkilökunta (Jimin) sanoi '1박에 8만 원이에요' — Se maksaa 80 000 wonia per yö.", "ja": "ホテルのスタッフ（ジミン）が「1박에 8만 원이에요」と言いました — 1泊8万ウォンです。", "zh-CN": "酒店工作人员（智敏）说\"1박에 8만 원이에요\"——每晚8万韩元。"}}]},
  24: {"id": 24, "title": "24. 공항에서", "titleTrans": {"en": "24. At the Airport", "de": "24. Am Flughafen", "fr": "24. À l'aéroport", "es": "24. En el aeropuerto", "pl": "24. Na lotnisku", "it": "24. In aeroporto", "sv": "24. På flygplatsen", "fi": "24. Lentokentällä", "ja": "24. 空港で", "zh-CN": "24. 在机场"}, "desc": "공항에서 필요한 대화를 연습합니다. 탑승 수속, 수하물, 출발 게이트에 대해 이야기해 보세요.", "descTrans": {"en": "Practice conversations needed at the airport. Talk about check-in, baggage, and departure gates.", "de": "Üben Sie Gespräche, die am Flughafen benötigt werden. Sprechen Sie über Check-in, Gepäck und Abfluggates.", "fr": "Entraînez-vous aux conversations nécessaires à l'aéroport. Parlez de l'enregistrement, des bagages et des portes d'embarquement.", "es": "Practica conversaciones necesarias en el aeropuerto. Habla sobre el check-in, el equipaje y las puertas de embarque.", "pl": "Ćwicz rozmowy potrzebne na lotnisku. Rozmawiaj o odprawie, bagażu i bramkach odlotów.", "it": "Esercitati nelle conversazioni necessarie in aeroporto. Parla di check-in, bagagli e gate di partenza.", "sv": "Öva på samtal som behövs på flygplatsen. Prata om incheckning, bagage och avgångsgrindar.", "fi": "Harjoittele lentokentällä tarvittavia keskusteluja. Puhu lähtöselvityksestä, matkatavaroista ja lähtöporteista.", "ja": "空港で必要な会話を練習します。搭乗手続き、荷物、出発ゲートについて話しましょう。", "zh-CN": "练习在机场需要的对话。谈论值机、行李和登机口。"}, "dialogue": [{"speaker": "수미", "text": "지민아, 여권 가져왔어?", "trans": {"en": "Jimin, did you bring your passport?", "de": "Jimin, hast du deinen Reisepass mitgebracht?", "fr": "Jimin, tu as apporté ton passeport ?", "es": "Jimin, ¿trajiste tu pasaporte?", "pl": "Jimin, czy zabrałeś paszport?", "it": "Jimin, hai portato il passaporto?", "sv": "Jimin, tog du med ditt pass?", "fi": "Jimin, otitko passin mukaan?", "ja": "ジミン、パスポート持ってきた？", "zh-CN": "智敏，你带护照了吗？"}}, {"speaker": "지민", "text": "응, 여기 있어. 짐은 어디서 맡겨?", "trans": {"en": "Yes, it's right here. Where do we check in the luggage?", "de": "Ja, hier ist es. Wo geben wir das Gepäck auf?", "fr": "Oui, le voilà. Où dépose-t-on les bagages ?", "es": "Sí, aquí está. ¿Dónde entregamos el equipaje?", "pl": "Tak, mam. Gdzie oddajemy bagaż?", "it": "Sì, eccolo. Dove consegniamo il bagaglio?", "sv": "Ja, här är det. Var lämnar vi in bagaget?", "fi": "Kyllä, tässä se on. Missä jätämme matkatavarat?", "ja": "うん、ここにある。荷物はどこで預ける？", "zh-CN": "嗯，在这里。行李在哪里托运？"}}, {"speaker": "수미", "text": "저기 체크인 카운터에서 해.", "trans": {"en": "Over there at the check-in counter.", "de": "Dort drüben am Check-in-Schalter.", "fr": "Là-bas au comptoir d'enregistrement.", "es": "Allá en el mostrador de facturación.", "pl": "Tam przy ladzie odprawy.", "it": "Laggiù al banco check-in.", "sv": "Där borta vid incheckningsdisken.", "fi": "Tuolla sisäänkirjautumistiskillä.", "ja": "あそこのチェックインカウンターで。", "zh-CN": "在那边的值机柜台。"}}, {"speaker": "지민", "text": "알겠어. 비행기 몇 시에 출발해?", "trans": {"en": "Got it. What time does the plane depart?", "de": "Verstanden. Um wie viel Uhr geht das Flugzeug ab?", "fr": "Compris. À quelle heure l'avion part-il ?", "es": "Entendido. ¿A qué hora sale el avión?", "pl": "Rozumiem. O której godzinie odlatuje samolot?", "it": "Capito. A che ora parte l'aereo?", "sv": "Okej. Vilken tid avgår planet?", "fi": "Selvä. Mihin aikaan lentokone lähtee?", "ja": "わかった。飛行機は何時に出発する？", "zh-CN": "明白了。飞机几点出发？"}}, {"speaker": "수미", "text": "오전 10시야. 게이트는 23번이야.", "trans": {"en": "It's at 10 in the morning. The gate is number 23.", "de": "Um 10 Uhr morgens. Das Gate ist Nummer 23.", "fr": "À 10 heures du matin. La porte est le numéro 23.", "es": "A las 10 de la mañana. La puerta es la número 23.", "pl": "O 10:00 rano. Bramka numer 23.", "it": "Alle 10 del mattino. Il gate è il numero 23.", "sv": "Klockan 10 på morgonen. Grinden är nummer 23.", "fi": "Klo 10 aamulla. Portti on numero 23.", "ja": "午前10時。ゲートは23番。", "zh-CN": "上午10点。登机口是23号。"}}, {"speaker": "지민", "text": "빨리 가야겠다. 지금 몇 시야?", "trans": {"en": "We need to go quickly. What time is it now?", "de": "Wir müssen schnell gehen. Wie spät ist es jetzt?", "fr": "Il faut qu'on se dépêche. Quelle heure est-il maintenant ?", "es": "Hay que ir rápido. ¿Qué hora es ahora?", "pl": "Musimy się pospieszić. Która jest godzina?", "it": "Dobbiamo andare in fretta. Che ore sono adesso?", "sv": "Vi måste skynda oss. Vad är klockan nu?", "fi": "Meidän täytyy mennä nopeasti. Mitä kello on nyt?", "ja": "急がないといけないな。今何時？", "zh-CN": "要快点了。现在几点了？"}}, {"speaker": "수미", "text": "8시 반이야. 빨리 가자!", "trans": {"en": "It's 8:30. Let's go quickly!", "de": "Es ist 8:30. Lass uns schnell gehen!", "fr": "Il est 8h30. Allons-y vite !", "es": "Son las 8:30. ¡Vamos rápido!", "pl": "8:30. Chodźmy szybko!", "it": "Sono le 8:30. Andiamo in fretta!", "sv": "Klockan är 8:30. Vi måste skynda!", "fi": "Kello on 8:30. Mennään nopeasti!", "ja": "8時半だよ。早く行こう！", "zh-CN": "八点半了。快走吧！"}}], "vocab": [{"word": "여권", "trans": {"en": "passport", "de": "Reisepass", "fr": "passeport", "es": "pasaporte", "pl": "paszport", "it": "passaporto", "sv": "pass", "fi": "passi", "ja": "パスポート", "zh-CN": "护照"}}, {"word": "짐", "trans": {"en": "luggage / baggage", "de": "Gepäck", "fr": "bagages", "es": "equipaje", "pl": "bagaż", "it": "bagaglio", "sv": "bagage", "fi": "matkatavarat", "ja": "荷物", "zh-CN": "行李"}}, {"word": "비행기", "trans": {"en": "airplane", "de": "Flugzeug", "fr": "avion", "es": "avión", "pl": "samolot", "it": "aereo", "sv": "flygplan", "fi": "lentokone", "ja": "飛行機", "zh-CN": "飞机"}}, {"word": "출발하다", "trans": {"en": "to depart / leave", "de": "abfliegen / abfahren", "fr": "partir / décoller", "es": "salir / partir", "pl": "odlatywać / odjeżdżać", "it": "partire", "sv": "avgå", "fi": "lähteä", "ja": "出発する", "zh-CN": "出发"}}, {"word": "게이트", "trans": {"en": "gate", "de": "Gate", "fr": "porte", "es": "puerta de embarque", "pl": "bramka", "it": "gate", "sv": "gate", "fi": "portti", "ja": "ゲート", "zh-CN": "登机口"}}, {"word": "카운터", "trans": {"en": "counter / desk", "de": "Schalter", "fr": "comptoir", "es": "mostrador", "pl": "lada / okienko", "it": "banco", "sv": "disk", "fi": "tiski", "ja": "カウンター", "zh-CN": "柜台"}}, {"word": "맡기다", "trans": {"en": "to check in / deposit", "de": "aufgeben / einlagern", "fr": "déposer / confier", "es": "facturar / depositar", "pl": "oddać / nadać", "it": "consegnare / depositare", "sv": "lämna in", "fi": "jättää / tallettaa", "ja": "預ける", "zh-CN": "托运/存放"}}, {"word": "오전", "trans": {"en": "morning / A.M.", "de": "Vormittag / morgens", "fr": "matin / A.M.", "es": "mañana / A.M.", "pl": "przedpołudnie", "it": "mattina / A.M.", "sv": "förmiddag", "fi": "aamupäivä", "ja": "午前", "zh-CN": "上午"}}, {"word": "반", "trans": {"en": "half (past)", "de": "halb", "fr": "et demie", "es": "y media", "pl": "pół (do/po)", "it": "e mezza", "sv": "halv", "fi": "puoli", "ja": "半", "zh-CN": "半"}}], "patterns": [{"pattern": "~야/이야", "patternTrans": {"en": "It's ~ (informal)", "de": "Das ist ~ (informell)", "fr": "C'est ~ (familier)", "es": "Es ~ (informal)", "pl": "To jest ~ (nieformalnie)", "it": "È ~ (informale)", "sv": "Det är ~ (informellt)", "fi": "Se on ~ (epämuodollinen)", "ja": "～だよ（カジュアル）", "zh-CN": "是～（非正式）"}, "example": "오전 10시야.", "trans": {"en": "It's 10 in the morning.", "de": "Es ist 10 Uhr morgens.", "fr": "C'est 10 heures du matin.", "es": "Son las 10 de la mañana.", "pl": "Jest 10:00 rano.", "it": "Sono le 10 del mattino.", "sv": "Klockan är 10 på morgonen.", "fi": "Kello on 10 aamulla.", "ja": "午前10時だよ。", "zh-CN": "上午10点。"}}, {"pattern": "~아/어야겠다", "patternTrans": {"en": "I/We should ~ / need to ~", "de": "Ich/Wir sollten ~", "fr": "Je/Nous devons ~", "es": "Debo/Debemos ~", "pl": "Muszę/Musimy ~", "it": "Devo/Dobbiamo ~", "sv": "Jag/Vi borde ~", "fi": "Minun/Meidän täytyy ~", "ja": "～しなければ", "zh-CN": "得～"}, "example": "빨리 가야겠다.", "trans": {"en": "We need to go quickly.", "de": "Wir müssen schnell gehen.", "fr": "Il faut qu'on y aille vite.", "es": "Hay que ir rápido.", "pl": "Musimy się pospieszyć.", "it": "Dobbiamo andare in fretta.", "sv": "Vi måste gå snabbt.", "fi": "Meidän täytyy mennä nopeasti.", "ja": "急いで行かないと。", "zh-CN": "得快点去了。"}}, {"pattern": "~에서 ~", "patternTrans": {"en": "~ at/from ~", "de": "~ bei/von ~", "fr": "~ à/de ~", "es": "~ en/de ~", "pl": "~ w/z ~", "it": "~ a/da ~", "sv": "~ på/från ~", "fi": "~ ~lla/~stä", "ja": "～で～する", "zh-CN": "在～～"}, "example": "저기 체크인 카운터에서 해.", "trans": {"en": "Do it over there at the check-in counter.", "de": "Mach es dort am Check-in-Schalter.", "fr": "Fais-le là-bas au comptoir d'enregistrement.", "es": "Hazlo allá en el mostrador de facturación.", "pl": "Zrób to tam przy ladzie odprawy.", "it": "Fallo lì al banco check-in.", "sv": "Gör det där vid incheckningsdisken.", "fi": "Tee se tuolla sisäänkirjautumistiskillä.", "ja": "あそこのチェックインカウンターでやって。", "zh-CN": "在那边的值机柜台办理。"}}], "quizzes": [{"id": 1, "type": "comprehension", "questionAudio": "비행기 게이트는 몇 번이에요?", "questionTrans": {"en": "What is the plane's gate number?", "de": "Welche Nummer hat das Abfluggate?", "fr": "Quel est le numéro de la porte d'embarquement ?", "es": "¿Cuál es el número de la puerta de embarque?", "pl": "Jaki jest numer bramki odlotu?", "it": "Qual è il numero del gate dell'aereo?", "sv": "Vilket nummer har flygets gate?", "fi": "Mikä on lentokoneen portin numero?", "ja": "飛行機のゲートは何番ですか？", "zh-CN": "飞机的登机口是几号？"}, "options": [{"text": "1) 13번", "trans": {"en": "Number 13", "de": "Nummer 13", "fr": "numéro 13", "es": "número 13", "pl": "numer 13", "it": "numero 13", "sv": "nummer 13", "fi": "numero 13", "ja": "13番", "zh-CN": "13号"}}, {"text": "2) 23번", "trans": {"en": "Number 23", "de": "Nummer 23", "fr": "numéro 23", "es": "número 23", "pl": "numer 23", "it": "numero 23", "sv": "nummer 23", "fi": "numero 23", "ja": "23番", "zh-CN": "23号"}}, {"text": "3) 32번", "trans": {"en": "Number 32", "de": "Nummer 32", "fr": "numéro 32", "es": "número 32", "pl": "numer 32", "it": "numero 32", "sv": "nummer 32", "fi": "numero 32", "ja": "32番", "zh-CN": "32号"}}, {"text": "4) 33번", "trans": {"en": "Number 33", "de": "Nummer 33", "fr": "numéro 33", "es": "número 33", "pl": "numer 33", "it": "numero 33", "sv": "nummer 33", "fi": "numero 33", "ja": "33番", "zh-CN": "33号"}}], "answer": 1, "explanation": {"en": "Sumi said '게이트는 23번이야' — the gate is number 23.", "de": "Sumi sagte '게이트는 23번이야' — das Gate ist Nummer 23.", "fr": "Sumi a dit '게이트는 23번이야' — la porte est le numéro 23.", "es": "Sumi dijo '게이트는 23번이야' — la puerta es la número 23.", "pl": "Sumi powiedziała '게이트는 23번이야' — bramka numer 23.", "it": "Sumi ha detto '게이트는 23번이야' — il gate è il numero 23.", "sv": "Sumi sa '게이트는 23번이야' — grinden är nummer 23.", "fi": "Sumi sanoi '게이트는 23번이야' — portti on numero 23.", "ja": "スミが「게이트는 23번이야」と言いました — ゲートは23番です。", "zh-CN": "秀美说\"게이트는 23번이야\"——登机口是23号。"}}, {"id": 2, "type": "vocabulary", "questionAudio": "'여권'이 뭐예요?", "questionTrans": {"en": "What is '여권'?", "de": "Was ist '여권'?", "fr": "Qu'est-ce que '여권' ?", "es": "¿Qué es '여권'?", "pl": "Co to jest '여권'?", "it": "Cos'è '여권'?", "sv": "Vad är '여권'?", "fi": "Mikä on '여권'?", "ja": "「여권」は何ですか？", "zh-CN": "\"여권\"是什么？"}, "options": [{"text": "1) 비행기 표", "trans": {"en": "plane ticket", "de": "Flugticket", "fr": "billet d'avion", "es": "billete de avión", "pl": "bilet lotniczy", "it": "biglietto aereo", "sv": "flygbiljett", "fi": "lentolippu", "ja": "航空券", "zh-CN": "机票"}}, {"text": "2) 여행 가방", "trans": {"en": "travel bag", "de": "Reisetasche", "fr": "sac de voyage", "es": "bolsa de viaje", "pl": "torba podróżna", "it": "borsa da viaggio", "sv": "resväska", "fi": "matkakassi", "ja": "旅行バッグ", "zh-CN": "旅行袋"}}, {"text": "3) 신분증", "trans": {"en": "ID card", "de": "Ausweis", "fr": "carte d'identité", "es": "carné de identidad", "pl": "dowód osobisty", "it": "carta d'identità", "sv": "ID-kort", "fi": "henkilökortti", "ja": "身分証明書", "zh-CN": "身份证"}}, {"text": "4) 여권", "trans": {"en": "passport", "de": "Reisepass", "fr": "passeport", "es": "pasaporte", "pl": "paszport", "it": "passaporto", "sv": "pass", "fi": "passi", "ja": "パスポート", "zh-CN": "护照"}}], "answer": 3, "explanation": {"en": "'여권' means passport. You need it to board an international flight.", "de": "'여권' bedeutet Reisepass. Man braucht ihn für einen internationalen Flug.", "fr": "'여권' signifie passeport. Il faut l'avoir pour prendre un vol international.", "es": "'여권' significa pasaporte. Lo necesitas para tomar un vuelo internacional.", "pl": "'여권' oznacza paszport. Potrzebujesz go, aby wsiąść na samolot.", "it": "'여권' significa passaporto. Ti serve per prendere un volo.", "sv": "'여권' betyder pass. Du behöver det för att ta ett internationellt flyg.", "fi": "'여권' tarkoittaa passia. Tarvitset sitä kansainväliselle lennolle.", "ja": "「여권」はパスポートという意味です。国際線に搭乗するのに必要です。", "zh-CN": "\"여권\"是护照的意思。搭乘国际航班时需要用到。"}}, {"id": 3, "type": "comprehension", "questionAudio": "지금 몇 시예요?", "questionTrans": {"en": "What time is it now?", "de": "Wie spät ist es jetzt?", "fr": "Quelle heure est-il maintenant ?", "es": "¿Qué hora es ahora?", "pl": "Która jest godzina?", "it": "Che ore sono adesso?", "sv": "Vad är klockan nu?", "fi": "Mitä kello on nyt?", "ja": "今何時ですか？", "zh-CN": "现在几点？"}, "options": [{"text": "1) 7시 반", "trans": {"en": "7:30", "de": "7:30 Uhr", "fr": "7h30", "es": "las 7:30", "pl": "7:30", "it": "le 7:30", "sv": "07:30", "fi": "7:30", "ja": "7時半", "zh-CN": "7点半"}}, {"text": "2) 8시", "trans": {"en": "8:00", "de": "8:00 Uhr", "fr": "8h00", "es": "las 8:00", "pl": "8:00", "it": "le 8:00", "sv": "08:00", "fi": "8:00", "ja": "8時", "zh-CN": "8点"}}, {"text": "3) 8시 반", "trans": {"en": "8:30", "de": "8:30 Uhr", "fr": "8h30", "es": "las 8:30", "pl": "8:30", "it": "le 8:30", "sv": "08:30", "fi": "8:30", "ja": "8時半", "zh-CN": "8点半"}}, {"text": "4) 9시", "trans": {"en": "9:00", "de": "9:00 Uhr", "fr": "9h00", "es": "las 9:00", "pl": "9:00", "it": "le 9:00", "sv": "09:00", "fi": "9:00", "ja": "9時", "zh-CN": "9点"}}], "answer": 2, "explanation": {"en": "Sumi said '8시 반이야' — it's 8:30.", "de": "Sumi sagte '8시 반이야' — es ist 8:30 Uhr.", "fr": "Sumi a dit '8시 반이야' — il est 8h30.", "es": "Sumi di   25: {"id": 25, "title": "25. 취미 이야기", "titleTrans": {"en": "25. Talking About Hobbies", "de": "25. Über Hobbys sprechen", "fr": "25. Parler de ses loisirs", "es": "25. Hablar sobre aficiones", "pl": "25. Rozmowa o hobby", "it": "25. Parlare degli hobby", "sv": "25. Prata om hobbyer", "fi": "25. Harrastuksista puhuminen", "ja": "25. 趣味について話す", "zh-CN": "25. 谈论爱好"}, "desc": "좋아하는 취미에 대해 이야기하는 대화를 연습합니다. 운동, 음악, 독서 등의 활동을 표현해 보세요.", "descTrans": {"en": "Practice conversations about favorite hobbies. Express activities such as exercise, music, and reading.", "de": "Üben Sie Gespräche über Lieblingshobbys. Drücken Sie Aktivitäten wie Sport, Musik und Lesen aus.", "fr": "Entraînez-vous aux conversations sur les loisirs préférés. Exprimez des activités comme le sport, la musique et la lecture.", "es": "Practica conversaciones sobre aficiones favoritas. Expresa actividades como el ejercicio, la música y la lectura.", "pl": "Ćwicz rozmowy o ulubionych hobby. Wyrażaj aktywności takie jak sport, muzyka i czytanie.", "it": "Esercitati nelle conversazioni sugli hobby preferiti. Esprimi attività come sport, musica e lettura.", "sv": "Öva på samtal om favorithobbyer. Uttryck aktiviteter som träning, musik och läsning.", "fi": "Harjoittele suosikkiharrastuksista käytäviä keskusteluja. Ilmaise toimintoja kuten urheilu, musiikki ja lukeminen.", "ja": "好きな趣味について話す会話を練習します。運動、音楽、読書などの活動を表現してみましょう。", "zh-CN": "练习谈论喜欢的爱好的对话。表达运动、音乐、阅读等活动。"}, "dialogue": [{"speaker": "수미", "text": "지민아, 취미가 뭐야?", "trans": {"en": "Jimin, what's your hobby?", "de": "Jimin, was ist dein Hobby?", "fr": "Jimin, quel est ton passe-temps ?", "es": "Jimin, ¿cuál es tu afición?", "pl": "Jimin, jakie masz hobby?", "it": "Jimin, qual è il tuo hobby?", "sv": "Jimin, vad är din hobby?", "fi": "Jimin, mikä on sinun harrastuksesi?", "ja": "ジミン、趣味は何？", "zh-CN": "智敏，你的爱好是什么？"}}, {"speaker": "지민", "text": "나는 사진 찍는 걸 좋아해. 수미 너는?", "trans": {"en": "I like taking photos. What about you, Sumi?", "de": "Ich mag fotografieren. Und du, Sumi?", "fr": "J'aime prendre des photos. Et toi, Sumi ?", "es": "Me gusta tomar fotos. ¿Y tú, Sumi?", "pl": "Lubię robić zdjęcia. A ty, Sumi?", "it": "Mi piace scattare foto. E tu, Sumi?", "sv": "Jag gillar att ta foton. Och du, Sumi?", "fi": "Pidän valokuvien ottamisesta. Entä sinä, Sumi?", "ja": "写真を撮るのが好き。スミは？", "zh-CN": "我喜欢拍照。你呢，秀美？"}}, {"speaker": "수미", "text": "나는 요리하는 걸 좋아해.", "trans": {"en": "I like cooking.", "de": "Ich mag kochen.", "fr": "J'aime cuisiner.", "es": "Me gusta cocinar.", "pl": "Lubię gotować.", "it": "Mi piace cucinare.", "sv": "Jag gillar att laga mat.", "fi": "Pidän ruoanlaitosta.", "ja": "料理するのが好き。", "zh-CN": "我喜欢做饭。"}}, {"speaker": "지민", "text": "와, 멋있다! 어떤 음식을 잘 만들어?", "trans": {"en": "Wow, cool! What food can you cook well?", "de": "Wow, das ist toll! Welches Essen kannst du gut kochen?", "fr": "Waouh, c'est cool ! Quel plat cuisines-tu bien ?", "es": "¡Vaya, qué guay! ¿Qué comida cocinas bien?", "pl": "Wow, fajnie! Jakie jedzenie gotujesz dobrze?", "it": "Wow, bello! Che cibo cucini bene?", "sv": "Wow, häftigt! Vilken mat kan du laga bra?", "fi": "Vau, siistiä! Mitä ruokaa osaat valmistaa hyvin?", "ja": "わあ、かっこいい！どんな料理が得意？", "zh-CN": "哇，好棒！你擅长做什么菜？"}}, {"speaker": "수미", "text": "파스타하고 김치찌개 잘 만들어.", "trans": {"en": "I can make pasta and kimchi jjigae well.", "de": "Ich kann Pasta und Kimchi-Jjigae gut kochen.", "fr": "Je fais bien les pâtes et le kimchi jjigae.", "es": "Hago bien los espaguetis y el kimchi jjigae.", "pl": "Dobrze gotuję makaron i kimchi jjigae.", "it": "So cucinare bene la pasta e il kimchi jjigae.", "sv": "Jag kan laga pasta och kimchi jjigae bra.", "fi": "Osaan valmistaa hyvin pastaa ja kimchi jjigaeta.", "ja": "パスタとキムチチゲが得意。", "zh-CN": "我擅长做意面和泡菜汤。"}}, {"speaker": "지민", "text": "나중에 해 줄 수 있어?", "trans": {"en": "Can you make it for me sometime?", "de": "Kannst du es mir später machen?", "fr": "Tu pourrais m'en préparer un jour ?", "es": "¿Puedes hacérmelo algún día?", "pl": "Możesz mi to kiedyś ugotować?", "it": "Potresti farlo per me un giorno?", "sv": "Kan du göra det för mig någon gång?", "fi": "Voitko tehdä sen minulle joskus?", "ja": "今度作ってくれる？", "zh-CN": "以后能给我做吗？"}}, {"speaker": "수미", "text": "물론이지! 주말에 우리 집에 와.", "trans": {"en": "Of course! Come to my place this weekend.", "de": "Natürlich! Komm am Wochenende zu mir nach Hause.", "fr": "Bien sûr ! Viens chez moi ce week-end.", "es": "¡Claro que sí! Ven a mi casa este fin de semana.", "pl": "Oczywiście! Wpadnij do mnie w weekend.", "it": "Certo! Vieni a casa mia questo fine settimana.", "sv": "Självklart! Kom hem till mig i helgen.", "fi": "Tietysti! Tule minulle viikonloppuna.", "ja": "もちろん！週末うちに来て。", "zh-CN": "当然！周末来我家吧。"}}], "vocab": [{"word": "취미", "trans": {"en": "hobby", "de": "Hobby", "fr": "loisir / hobby", "es": "afición", "pl": "hobby", "it": "hobby", "sv": "hobby", "fi": "harrastus", "ja": "趣味", "zh-CN": "爱好"}}, {"word": "사진 찍다", "trans": {"en": "to take photos", "de": "fotografieren", "fr": "prendre des photos", "es": "tomar fotos", "pl": "robić zdjęcia", "it": "scattare foto", "sv": "ta foton", "fi": "ottaa valokuvia", "ja": "写真を撮る", "zh-CN": "拍照"}}, {"word": "요리하다", "trans": {"en": "to cook", "de": "kochen", "fr": "cuisiner", "es": "cocinar", "pl": "gotować", "it": "cucinare", "sv": "laga mat", "fi": "laittaa ruokaa", "ja": "料理する", "zh-CN": "做饭"}}, {"word": "잘", "trans": {"en": "well", "de": "gut", "fr": "bien", "es": "bien", "pl": "dobrze", "it": "bene", "sv": "bra", "fi": "hyvin", "ja": "上手に", "zh-CN": "好/擅长"}}, {"word": "만들다", "trans": {"en": "to make", "de": "machen", "fr": "faire / préparer", "es": "hacer / preparar", "pl": "robić / przygotowywać", "it": "fare / preparare", "sv": "göra / laga", "fi": "tehdä / valmistaa", "ja": "作る", "zh-CN": "做/制作"}}, {"word": "나중에", "trans": {"en": "later / sometime", "de": "später / irgendwann", "fr": "plus tard / un jour", "es": "después / algún día", "pl": "później / kiedyś", "it": "più tardi / un giorno", "sv": "senare / någon gång", "fi": "myöhemmin / joskus", "ja": "後で", "zh-CN": "以后"}}, {"word": "물론", "trans": {"en": "of course", "de": "natürlich", "fr": "bien sûr", "es": "claro / por supuesto", "pl": "oczywiście", "it": "ovviamente / certo", "sv": "självklart", "fi": "tietysti", "ja": "もちろん", "zh-CN": "当然"}}, {"word": "운동", "trans": {"en": "exercise / sport", "de": "Sport / Bewegung", "fr": "sport / exercice", "es": "ejercicio / deporte", "pl": "ćwiczenia / sport", "it": "esercizio / sport", "sv": "träning / sport", "fi": "liikunta / urheilu", "ja": "運動", "zh-CN": "运动"}}, {"word": "독서", "trans": {"en": "reading", "de": "Lesen", "fr": "lecture", "es": "lectura", "pl": "czytanie", "it": "lettura", "sv": "läsning", "fi": "lukeminen", "ja": "読書", "zh-CN": "阅读"}}], "patterns": [{"pattern": "~는 걸 좋아해", "patternTrans": {"en": "I like ~ing", "de": "Ich mag ~", "fr": "J'aime ~", "es": "Me gusta ~", "pl": "Lubię ~", "it": "Mi piace ~", "sv": "Jag gillar att ~", "fi": "Pidän ~misesta", "ja": "～するのが好き", "zh-CN": "喜欢～"}, "example": "사진 찍는 걸 좋아해.", "trans": {"en": "I like taking photos.", "de": "Ich mag fotografieren.", "fr": "J'aime prendre des photos.", "es": "Me gusta tomar fotos.", "pl": "Lubię robić zdjęcia.", "it": "Mi piace scattare foto.", "sv": "Jag gillar att ta foton.", "fi": "Pidän valokuvien ottamisesta.", "ja": "写真を撮るのが好き。", "zh-CN": "喜欢拍照。"}}, {"pattern": "~아/어 줄 수 있어?", "patternTrans": {"en": "Can you ~ for me?", "de": "Kannst du ~ für mich?", "fr": "Tu peux ~ pour moi ?", "es": "¿Puedes ~ para mí?", "pl": "Czy możesz ~ dla mnie?", "it": "Puoi ~ per me?", "sv": "Kan du ~ för mig?", "fi": "Voitko ~ minulle?", "ja": "～してくれる？", "zh-CN": "能帮我～吗？"}, "example": "나중에 해 줄 수 있어?", "trans": {"en": "Can you do it for me sometime?", "de": "Kannst du es mir später machen?", "fr": "Tu peux le faire pour moi plus tard ?", "es": "¿Puedes hacérmelo algún día?", "pl": "Możesz mi to kiedyś zrobić?", "it": "Puoi farlo per me più tardi?", "sv": "Kan du göra det för mig senare?", "fi": "Voitko tehdä sen minulle joskus?", "ja": "今
