// ============================================================
// APP STATE
// ============================================================
let selectedLang = 'en';
let currentUnitId = 1;
let playbackSpeed = 1.0;
let isHideAll = false;
let isHideTrans = false;
let currentAudio = null;

// ============================================================
// TTS — 구글 여성 음성 (Web Speech API, ko-KR female)
// ============================================================
let _krFemaleVoice = null;

function loadKoreanVoice() {
    const voices = window.speechSynthesis.getVoices();
    // 구글 한국어 여성 음성 우선 선택
    const preferred = [
        v => v.name.includes('Google') && v.lang.startsWith('ko') && /female|여성|Yuna|Sora|Heami/i.test(v.name),
        v => v.name.includes('Google') && v.lang.startsWith('ko'),
        v => v.lang.startsWith('ko') && /female|여성|Yuna|Sora|Heami/i.test(v.name),
        v => v.lang.startsWith('ko'),
    ];
    for (const fn of preferred) {
        const found = voices.find(fn);
        if (found) { _krFemaleVoice = found; break; }
    }
}

if (window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = loadKoreanVoice;
}
// 일부 브라우저는 즉시 로드됨
loadKoreanVoice();

function speak(text) {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ko-KR';
    utter.rate = playbackSpeed;
    if (_krFemaleVoice) utter.voice = _krFemaleVoice;
    window.speechSynthesis.speak(utter);
}

let dialoguePlayIndex = 0;
let isPlayingAll = false;
let dialogueAudioChain = null;

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
    buildUnitMenu();
    renderAll(currentUnitId);
    updateNavButtons();
});

document.addEventListener('click', (e) => {
    const dropdown = document.getElementById('unit-menu-dropdown');
    const burgerBtn = document.getElementById('unit-burger-btn');
    if (!dropdown.contains(e.target) && !burgerBtn.contains(e.target)) {
        dropdown.classList.add('hidden');
    }
});

// ============================================================
// UNIT MENU
// ============================================================
function buildUnitMenu() {
    const container = document.getElementById('unit-btn-list');
    const unitIds = Object.keys(unitsData).map(Number).sort((a,b)=>a-b);
    container.innerHTML = '';
    unitIds.forEach(id => {
        const u = unitsData[id];
        const btn = document.createElement('button');
        btn.id = `unit-menu-btn-${id}`;
        btn.className = 'w-full text-left px-3 py-2 rounded-lg text-xs font-medium text-slate-700 hover:bg-indigo-50 hover:text-indigo-700 transition flex items-start gap-2';
        const transTxt = (u.titleTrans && (u.titleTrans[selectedLang] || u.titleTrans['en'])) || '';
        btn.innerHTML = `<span class="text-[10px] font-bold text-indigo-400 mt-0.5 min-w-[28px]">U${id}</span><span class="flex flex-col"><span>${u.title}</span><span class="text-[10px] font-normal text-slate-400 unit-menu-trans">${transTxt}</span></span>`;
        btn.onclick = () => { goToUnit(id); toggleUnitMenu(); };
        container.appendChild(btn);
    });
}

function refreshUnitMenuTrans() {
    const unitIds = Object.keys(unitsData).map(Number).sort((a,b)=>a-b);
    unitIds.forEach(id => {
        const u = unitsData[id];
        const btn = document.getElementById(`unit-menu-btn-${id}`);
        if (!btn) return;
        const transEl = btn.querySelector('.unit-menu-trans');
        if (transEl) {
            transEl.textContent = (u.titleTrans && (u.titleTrans[selectedLang] || u.titleTrans['en'])) || '';
        }
    });
}

function toggleUnitMenu() {
    const d = document.getElementById('unit-menu-dropdown');
    d.classList.toggle('hidden');
    if (!d.classList.contains('hidden')) {
        const active = document.getElementById(`unit-menu-btn-${currentUnitId}`);
        if (active) active.scrollIntoView({ block: 'nearest' });
    }
}

// ============================================================
// LANGUAGE
// ============================================================
function changeLanguage(lang) {
    selectedLang = lang;
    renderAll(currentUnitId);
    refreshUnitMenuTrans();
}

// ============================================================
// SPEED
// ============================================================
function setSpeed(s) {
    playbackSpeed = s;
    document.querySelectorAll('.speed-btn').forEach(b => {
        b.classList.remove('bg-white','shadow-sm','text-indigo-600','font-bold');
    });
    const active = document.getElementById(`speed-${s}`);
    if (active) active.classList.add('bg-white','shadow-sm','text-indigo-600','font-bold');
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    window.speechSynthesis && window.speechSynthesis.cancel();
    isPlayingAll = false;
}

// ============================================================
// HIDE TOGGLES
// ============================================================
function toggleHideAll() {
    isHideAll = !isHideAll;
    const t = uiTranslations[selectedLang] || uiTranslations['en'];
    const textEl = document.getElementById('hide-all-text');
    const iconEl = document.getElementById('hide-all-icon');
    if (isHideAll) {
        textEl.innerHTML = t.showAllText;
        iconEl.className = 'fa-solid fa-eye text-indigo-500 ml-2';
        document.querySelectorAll('.dialogue-korean').forEach(el => el.classList.add('blur-text'));
    } else {
        textEl.innerHTML = t.hideAllText;
        iconEl.className = 'fa-solid fa-eye-slash text-slate-500 ml-2';
        document.querySelectorAll('.dialogue-korean').forEach(el => el.classList.remove('blur-text'));
    }
}

function toggleHideTrans() {
    isHideTrans = !isHideTrans;
    const t = uiTranslations[selectedLang] || uiTranslations['en'];
    const textEl = document.getElementById('hide-trans-text');
    const iconEl = document.getElementById('hide-trans-icon');
    if (isHideTrans) {
        textEl.innerHTML = t.showTransText;
        iconEl.className = 'fa-solid fa-language text-indigo-500 ml-2';
        document.querySelectorAll('.translation-text').forEach(el => el.classList.add('hide-translation'));
    } else {
        textEl.innerHTML = t.hideTransText;
        iconEl.className = 'fa-solid fa-language text-slate-500 ml-2';
        document.querySelectorAll('.translation-text').forEach(el => el.classList.remove('hide-translation'));
    }
}

function playFullDialogue() {
    window.speechSynthesis.cancel();
    isPlayingAll = false;
    const unit = unitsData[currentUnitId];
    if (!unit || !unit.dialogue) return;
    isPlayingAll = true;
    dialoguePlayIndex = 0;
    playNextLine(unit.dialogue);
}

function playNextLine(dialogue) {
    if (dialoguePlayIndex >= dialogue.length || !isPlayingAll) {
        isPlayingAll = false;
        document.querySelectorAll('.dialogue-line').forEach(el => {
            el.classList.remove('ring-2','ring-indigo-400');
        });
        return;
    }
    const line = dialogue[dialoguePlayIndex];
    // Highlight active line
    document.querySelectorAll('.dialogue-line').forEach((el, i) => {
        el.classList.toggle('ring-2', i === dialoguePlayIndex);
        el.classList.toggle('ring-indigo-400', i === dialoguePlayIndex);
    });
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(line.text);
    utter.lang = 'ko-KR';
    utter.rate = playbackSpeed;
    if (_krFemaleVoice) utter.voice = _krFemaleVoice;
    utter.onend = () => { dialoguePlayIndex++; setTimeout(() => playNextLine(dialogue), 400); };
    utter.onerror = () => { isPlayingAll = false; };
    window.speechSynthesis.speak(utter);
}

// ============================================================
// NAVIGATION
// ============================================================
function goToUnit(id) {
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    window.speechSynthesis && window.speechSynthesis.cancel();
    isPlayingAll = false;
    currentUnitId = id;
    renderAll(id);
    updateNavButtons();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goToPrevUnit() {
    const ids = Object.keys(unitsData).map(Number).sort((a,b)=>a-b);
    const idx = ids.indexOf(currentUnitId);
    if (idx > 0) goToUnit(ids[idx-1]);
}

function goToNextUnit() {
    const ids = Object.keys(unitsData).map(Number).sort((a,b)=>a-b);
    const idx = ids.indexOf(currentUnitId);
    if (idx < ids.length - 1) goToUnit(ids[idx+1]);
}

function updateNavButtons() {
    const ids = Object.keys(unitsData).map(Number).sort((a,b)=>a-b);
    const idx = ids.indexOf(currentUnitId);
    document.getElementById('prev-unit-btn').disabled = idx === 0;
    document.getElementById('next-unit-btn').disabled = idx === ids.length - 1;
}

// ============================================================
// RENDER
// ============================================================
function renderAll(unitId) {
    const unit = unitsData[unitId];
    if (!unit) return;
    updateUIStrings();
    renderUnitHeader(unit);
    renderDialogue(unit);
    renderVocab(unit);
    renderPatterns(unit);
    renderQuizzes(unit);

    // Re-apply hide states
    if (isHideAll) {
        document.querySelectorAll('.dialogue-korean').forEach(el => el.classList.add('blur-text'));
    }
    if (isHideTrans) {
        document.querySelectorAll('.translation-text').forEach(el => el.classList.add('hide-translation'));
    }

    // Update active unit in menu
    document.querySelectorAll('[id^="unit-menu-btn-"]').forEach(btn => {
        btn.classList.remove('bg-indigo-50','text-indigo-700','font-semibold');
    });
    const active = document.getElementById(`unit-menu-btn-${unitId}`);
    if (active) active.classList.add('bg-indigo-50','text-indigo-700','font-semibold');
}

function updateUIStrings() {
    const t = uiTranslations[selectedLang] || uiTranslations['en'];
    setHTML('ui-sub-title', t.subTitle);
    setHTML('ui-lang-label', t.langLabel);
    setHTML('ui-burger-unit-title', t.unitMenuTitle);
    setHTML('ui-audio-settings-title', `<i class="fa-solid fa-sliders text-indigo-600"></i> ${t.audioSettingsTitle}`);
    setHTML('ui-speed-label', t.speedLabel);
    setHTML('ui-display-label', t.displayLabel);
    setHTML('hide-all-text', isHideAll ? t.showAllText : t.hideAllText);
    setHTML('hide-trans-text', isHideTrans ? t.showTransText : t.hideTransText);
    setHTML('ui-subtitle-desc', t.subtitleDesc);
    setHTML('ui-step1-title', `<i class="fa-solid fa-comments text-indigo-600"></i> ${t.step1Title}`);
    setHTML('ui-play-all-span', t.playAllBtn);
    setHTML('ui-step2-title', `<i class="fa-solid fa-spell-check text-emerald-600"></i> ${t.step2Title}`);
    setHTML('ui-vocab-guide', t.vocabGuide);
    setHTML('ui-step3-title', `<i class="fa-solid fa-lightbulb text-amber-500"></i> ${t.step3Title}`);
    setHTML('ui-step4-title', `<i class="fa-solid fa-circle-question text-rose-500"></i> ${t.step4Title}`);
    setHTML('ui-prev-unit-text', t.prevUnitText);
    setHTML('ui-prev-unit-sub', t.prevUnitSub);
    setHTML('ui-next-unit-text', t.nextUnitText);
    setHTML('ui-next-unit-sub', t.nextUnitSub);
}

function setHTML(id, html) {
    const el = document.getElementById(id);
    if (el) el.innerHTML = html;
}

function getTrans(obj) {
    if (!obj) return '';
    return obj[selectedLang] || obj['en'] || '';
}

function renderUnitHeader(unit) {
    setHTML('unit-badge', `Unit ${unit.id}`);
    setHTML('unit-title', unit.title || '');
    setHTML('unit-title-trans', getTrans(unit.titleTrans));
    setHTML('unit-desc', unit.desc || '');
    setHTML('unit-desc-trans', getTrans(unit.descTrans));
}

function renderDialogue(unit) {
    const container = document.getElementById('dialogue-container');
    if (!unit.dialogue || !unit.dialogue.length) { container.innerHTML = ''; return; }
    const speakerColors = {
        '수미': { bg: 'bg-indigo-50', border: 'border-indigo-200', name: 'text-indigo-700', dir: '' },
        '지민': { bg: 'bg-emerald-50', border: 'border-emerald-200', name: 'text-emerald-700', dir: 'flex-row-reverse text-right' },
    };
    const defaultA = { bg: 'bg-indigo-50', border: 'border-indigo-200', name: 'text-indigo-700', dir: '' };
    const defaultB = { bg: 'bg-emerald-50', border: 'border-emerald-200', name: 'text-emerald-700', dir: 'flex-row-reverse text-right' };
    const speakers = [...new Set(unit.dialogue.map(l => l.speaker))];

    container.innerHTML = unit.dialogue.map((line, i) => {
        let style;
        if (speakerColors[line.speaker]) {
            style = speakerColors[line.speaker];
        } else {
            const sidx = speakers.indexOf(line.speaker);
            style = sidx % 2 === 0 ? defaultA : defaultB;
        }
        const trans = getTrans(line.trans);
        const isReverse = style.dir.includes('reverse');
        return `
        <div class="dialogue-line flex items-start gap-3 ${style.dir} p-1 rounded-xl transition-all">
            <button class="speak-btn flex-shrink-0 w-9 h-9 rounded-full ${style.bg} border ${style.border} flex items-center justify-center text-base font-bold ${style.name} hover:scale-110 transition-transform shadow-sm" data-text="${line.text.replace(/"/g,'&quot;')}" title="듣기">
                ${line.speaker.charAt(0)}
            </button>
            <div class="${style.bg} border ${style.border} rounded-2xl p-3 max-w-sm flex-1">
                <div class="flex items-center gap-2 mb-1 ${isReverse ? 'justify-end' : 'justify-between'}">
                    <span class="text-[11px] font-bold ${style.name}">${line.speaker}</span>
                    <button class="speak-btn inline-flex items-center gap-1 px-2 py-0.5 bg-white/60 hover:bg-white border border-slate-200 rounded-full text-[10px] text-slate-500 hover:text-indigo-600 transition" data-text="${line.text.replace(/"/g,'&quot;')}" title="이 문장 듣기">
                        <i class="fa-solid fa-play text-[8px]"></i> 듣기
                    </button>
                </div>
                <p class="dialogue-korean text-sm font-medium text-slate-800 leading-relaxed">${line.text}</p>
                <p class="translation-text text-xs text-slate-500 mt-1 leading-relaxed${isHideTrans ? ' hide-translation' : ''}">${trans}</p>
            </div>
        </div>`;
    }).join('');

    // Bind speak buttons via data attribute (avoids inline JS escaping issues)
    container.querySelectorAll('.speak-btn').forEach(btn => {
        btn.addEventListener('click', () => speak(btn.dataset.text));
    });

    if (isHideAll) {
        container.querySelectorAll('.dialogue-korean').forEach(el => el.classList.add('blur-text'));
    }
}

function renderVocab(unit) {
    const container = document.getElementById('vocab-container');
    if (!unit.vocab || !unit.vocab.length) { container.innerHTML = ''; return; }
    container.innerHTML = unit.vocab.map(v => {
        const trans = getTrans(v.trans);
        return `
        <button class="vocab-speak-btn p-3 bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 rounded-xl text-left transition group shadow-sm hover:shadow-md" data-text="${v.word.replace(/"/g,'&quot;')}">
            <div class="flex items-center justify-between mb-1">
                <span class="text-sm font-bold text-slate-800 group-hover:text-indigo-700">${v.word}</span>
                <i class="fa-solid fa-volume-high text-slate-300 group-hover:text-indigo-500 text-xs transition"></i>
            </div>
            <p class="translation-text text-xs text-slate-500 leading-snug${isHideTrans ? ' hide-translation' : ''}">${trans}</p>
        </button>`;
    }).join('');
    container.querySelectorAll('.vocab-speak-btn').forEach(btn => {
        btn.addEventListener('click', () => speak(btn.dataset.text));
    });
}

function renderPatterns(unit) {
    const container = document.getElementById('patterns-container');
    if (!unit.patterns || !unit.patterns.length) { container.innerHTML = ''; return; }
    container.innerHTML = unit.patterns.map((p, pi) => {
        const ptrans = getTrans(p.patternTrans);
        const etrans = getTrans(p.trans);
        return `
        <div class="bg-amber-50 border border-amber-200 rounded-xl p-4">
            <div class="flex items-start gap-2 mb-2">
                <i class="fa-solid fa-star text-amber-400 mt-0.5 text-xs flex-shrink-0"></i>
                <div class="flex-1">
                    <div class="flex items-center justify-between gap-2">
                        <p class="font-bold text-slate-800 text-sm">${p.pattern}</p>
                        <button class="pattern-speak-btn flex-shrink-0 w-6 h-6 bg-amber-200 hover:bg-amber-300 rounded-full flex items-center justify-center transition" data-text="${p.pattern.replace(/"/g,'&quot;')}" title="패턴 듣기">
                            <i class="fa-solid fa-volume-high text-amber-700 text-[9px]"></i>
                        </button>
                    </div>
                    <p class="translation-text text-xs text-amber-700 mt-0.5${isHideTrans ? ' hide-translation' : ''}">${ptrans}</p>
                </div>
            </div>
            <div class="mt-2 pt-2 border-t border-amber-200 flex items-start gap-2">
                <button class="pattern-speak-btn flex-shrink-0 w-6 h-6 bg-amber-200 hover:bg-amber-300 rounded-full flex items-center justify-center transition" data-text="${p.example.replace(/"/g,'&quot;')}" title="예문 듣기">
                    <i class="fa-solid fa-play text-amber-700 text-[9px]"></i>
                </button>
                <div>
                    <p class="text-sm text-slate-700">${p.example}</p>
                    <p class="translation-text text-xs text-slate-500 mt-0.5${isHideTrans ? ' hide-translation' : ''}">${etrans}</p>
                </div>
            </div>
        </div>`;
    }).join('');
    container.querySelectorAll('.pattern-speak-btn').forEach(btn => {
        btn.addEventListener('click', () => speak(btn.dataset.text));
    });
}

function renderQuizzes(unit) {
    const t = uiTranslations[selectedLang] || uiTranslations['en'];
    const container = document.getElementById('quiz-list');
    if (!unit.quizzes || !unit.quizzes.length) { container.innerHTML = ''; return; }
    // 듣기 이해 관련 문제만 표시 (어휘/단어/문법 문제 제외)
    const filteredQuizzes = unit.quizzes.filter(q => {
        const qtype = (q.type || '').toLowerCase();
        return !/어휘|단어|문법|grammar|vocab|vocabulary/i.test(qtype);
    });
    if (!filteredQuizzes.length) { container.innerHTML = ''; return; }
    container.innerHTML = filteredQuizzes.map((q, qi) => {
        const qtrans = getTrans(q.questionTrans);
        const explanationTrans = getTrans(q.explanation);
        const options = (q.options || []).map((opt, oi) => {
            const otrans = getTrans(opt.trans);
            return `
            <label class="quiz-option flex items-start gap-3 p-3 bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 rounded-xl cursor-pointer transition group" data-quiz="${qi}" data-opt="${oi}">
                <input type="radio" name="quiz-${unit.id}-${qi}" value="${oi}"
                    class="mt-0.5 accent-indigo-600 flex-shrink-0"
                    data-qi="${qi}" data-oi="${oi}" data-answer="${q.answer}" data-expl="${explanationTrans.replace(/"/g,'&quot;')}">
                <div>
                    <span class="text-sm font-medium text-slate-700 group-hover:text-indigo-700">${opt.text}</span>
                    <p class="translation-text text-xs text-slate-400 mt-0.5${isHideTrans ? ' hide-translation' : ''}">${otrans}</p>
                </div>
            </label>`;
        }).join('');
        return `
        <div class="quiz-card bg-white border border-slate-200 rounded-2xl p-5 shadow-sm" id="quiz-card-${qi}">
            <div class="flex items-start justify-between gap-2 mb-2">
                <div>
                    <span class="text-[11px] font-bold text-rose-400 uppercase tracking-wide">Q${qi+1}</span>
                    <p class="text-xs text-slate-400 font-medium">${q.type || ''}</p>
                </div>
                <button class="quiz-listen-btn px-3 py-1.5 bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-600 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition flex-shrink-0" data-text="${q.questionAudio.replace(/"/g,'&quot;')}">
                    <i class="fa-solid fa-headphones"></i>
                    <span>${t.listenQuestion}</span>
                </button>
            </div>
            <p class="text-sm font-semibold text-slate-700 mb-1">${q.questionAudio}</p>
            <p class="translation-text text-xs text-slate-500 mb-4${isHideTrans ? ' hide-translation' : ''}">${qtrans}</p>
            <div class="space-y-2" id="quiz-options-${qi}">${options}</div>
            <div id="quiz-result-${qi}" class="hidden mt-4 p-3 rounded-xl text-sm font-medium"></div>
        </div>`;
    }).join('');

    // Bind quiz listen buttons
    container.querySelectorAll('.quiz-listen-btn').forEach(btn => {
        btn.addEventListener('click', () => speak(btn.dataset.text));
    });

    // Bind radio change
    container.querySelectorAll('input[type="radio"]').forEach(radio => {
        radio.addEventListener('change', () => {
            const qi = parseInt(radio.dataset.qi);
            const oi = parseInt(radio.dataset.oi);
            const answer = parseInt(radio.dataset.answer);
            const expl = radio.dataset.expl;
            checkAnswer(qi, oi, answer, expl);
        });
    });
}

function checkAnswer(qIdx, selected, correct, explanation) {
    const t = uiTranslations[selectedLang] || uiTranslations['en'];
    const resultEl = document.getElementById(`quiz-result-${qIdx}`);
    const optionsEl = document.getElementById(`quiz-options-${qIdx}`);

    // Disable all options
    optionsEl.querySelectorAll('input[type="radio"]').forEach(r => r.disabled = true);
    optionsEl.querySelectorAll('.quiz-option').forEach((el, i) => {
        el.classList.remove('hover:bg-indigo-50','hover:border-indigo-300','cursor-pointer');
        if (i === correct) {
            el.classList.add('bg-emerald-50','border-emerald-400','ring-2','ring-emerald-300');
        } else if (i === selected && selected !== correct) {
            el.classList.add('bg-rose-50','border-rose-400','ring-2','ring-rose-300');
        }
    });

    const isCorrect = selected === correct;
    resultEl.className = `mt-4 p-3 rounded-xl text-sm font-medium flex items-start gap-2 ${isCorrect ? 'bg-emerald-50 border border-emerald-200 text-emerald-800' : 'bg-rose-50 border border-rose-200 text-rose-800'}`;
    resultEl.innerHTML = `
        <i class="fa-solid ${isCorrect ? 'fa-circle-check text-emerald-500' : 'fa-circle-xmark text-rose-500'} mt-0.5 flex-shrink-0"></i>
        <div>
            <span class="font-bold">${isCorrect ? t.correctText : t.incorrectText}</span>
            ${explanation ? `<p class="text-xs mt-1 font-normal opacity-80">${explanation}</p>` : ''}
        </div>`;
    resultEl.classList.remove('hidden');
}

</script>
</body>
</html>
