 — I like taking photos.", "de": "Jimin sagte '사진 찍는 걸 좋아해' — Ich mag fotografieren.", "fr": "Jimin a dit '사진 찍는 걸 좋아해' — J'aime prendre des photos.", "es": "Jimin dijo '사진 찍는 걸 좋아해' — me gusta tomar fotos.", "pl": "Jimin powiedział '사진 찍는 걸 좋아해' — lubię robić zdjęcia.", "it": "Jimin ha detto '사진 찍는 걸 좋아해' — mi piace scattare foto.", "sv": "Jimin sa '사진 찍는 걸 좋아해' — jag gillar att ta foton.", "fi": "Jimin sanoi '사진 찍는 걸 좋아해' — pidän valokuvien ottamisesta.", "ja": "ジミンは「사진 찍는 걸 좋아해」と言いました — 写真を撮るのが好きです。", "zh-CN": "智敏说\"사진 찍는 걸 좋아해\"——我喜欢拍照。"}}, {"id": 2, "type": "vocabulary", "questionAudio": "'잘'은 무슨 뜻이에요?", "questionTrans": {"en": "What does '잘' mean?", "de": "Was bedeutet '잘'?", "fr": "Que signifie '잘' ?", "es": "¿Qué significa '잘'?", "pl": "Co znaczy '잘'?", "it": "Cosa significa '잘'?", "sv": "Vad betyder '잘'?", "fi": "Mitä '잘' tarkoittaa?", "ja": "「잘」はどういう意味ですか？", "zh-CN": "\"잘\"是什么意思？"}, "options": [{"text": "1) 천천히", "trans": {"en": "slowly", "de": "langsam", "fr": "lentement", "es": "despacio", "pl": "powoli", "it": "lentamente", "sv": "sakta", "fi": "hitaasti", "ja": "ゆっくり", "zh-CN": "慢慢地"}}, {"text": "2) 잘 — 잘하다 (well)", "trans": {"en": "well / skillfully", "de": "gut / geschickt", "fr": "bien / habilement", "es": "bien / hábilmente", "pl": "dobrze / sprawnie", "it": "bene / abilmente", "sv": "bra / skickligt", "fi": "hyvin / taitavasti", "ja": "上手に", "zh-CN": "好/擅长地"}}, {"text": "3) 빨리", "trans": {"en": "quickly", "de": "schnell", "fr": "vite", "es": "rápido", "pl": "szybko", "it": "velocemente", "sv": "snabbt", "fi": "nopeasti", "ja": "速く", "zh-CN": "快速地"}}, {"text": "4) 많이", "trans": {"en": "a lot", "de": "viel", "fr": "beaucoup", "es": "mucho", "pl": "dużo", "it": "molto", "sv": "mycket", "fi": "paljon", "ja": "たくさん", "zh-CN": "很多"}}], "answer": 1, "explanation": {"en": "'잘' means 'well' or 'skillfully'. '잘 만들어' means 'makes it well / is good at making'.", "de": "'잘' bedeutet 'gut' oder 'geschickt'. '잘 만들어' bedeutet 'macht es gut'.", "fr": "'잘' signifie 'bien'. '잘 만들어' veut dire 'fait ça bien'.", "es": "'잘' significa 'bien'. '잘 만들어' significa 'lo hace bien'.", "pl": "'잘' oznacza 'dobrze'. '잘 만들어' znaczy 'robi to dobrze'.", "it": "'잘' significa 'bene'. '잘 만들어' vuol dire 'lo fa bene'.", "sv": "'잘' betyder 'bra'. '잘 만들어' betyder 'gör det bra'.", "fi": "'잘' tarkoittaa 'hyvin'. '잘 만들어' tarkoittaa 'tekee sen hyvin'.", "ja": "「잘」は「上手に」という意味です。「잘 만들어」は「上手に作る」という意味。", "zh-CN": "잘\"是\"好/擅长\"的意思。\"잘 만들어\"是\"做得好\"的意思。\""}}, {"id": 3, "type": "comprehension", "questionAudio": "수미는 어디에서 요리해 줄 거예요?", "questionTrans": {"en": "Where will Sumi cook for Jimin?", "de": "Wo wird Sumi für Jimin kochen?", "fr": "Où Sumi va-t-elle cuisiner pour Jimin ?", "es": "¿Dónde cocinará Sumi para Jimin?", "pl": "Gdzie Sumi ugotuje dla Jimina?", "it": "Dove cucinerà Sumi per Jimin?", "sv": "Var kommer Sumi att laga mat för Jimin?", "fi": "Missä Sumi laittaa ruokaa Juminille?", "ja": "スミはどこでジミンに料理を作りますか？", "zh-CN": "秀美在哪里给智敏做饭？"}, "options": [{"text": "1) 지민이 집", "trans": {"en": "Jimin's home", "de": "Jimins Zuhause", "fr": "chez Jimin", "es": "la casa de Jimin", "pl": "dom Jimina", "it": "casa di Jimin", "sv": "Jimins hem", "fi": "Jiminin koti", "ja": "ジミンの家", "zh-CN": "智敏家"}}, {"text": "2) 식당", "trans": {"en": "restaurant", "de": "Restaurant", "fr": "restaurant", "es": "restaurante", "pl": "restauracja", "it": "ristorante", "sv": "restaurang", "fi": "ravintola", "ja": "食堂", "zh-CN": "餐厅"}}, {"text": "3) 수미 집", "trans": {"en": "Sumi's home", "de": "Sumis Zuhause", "fr": "chez Sumi", "es": "la casa de Sumi", "pl": "dom Sumi", "it": "casa di Sumi", "sv": "Sumis hem", "fi": "Sumin koti", "ja": "スミの家", "zh-CN": "秀美家"}}, {"text": "4) 학교 식당", "trans": {"en": "school cafeteria", "de": "Schulkantine", "fr": "cantine scolaire", "es": "comedor escolar", "pl": "stołówka szkolna", "it": "mensa scolastica", "sv": "skolmatsalen", "fi": "koulun ruokala", "ja": "学校の食堂", "zh-CN": "学校食堂"}}], "answer": 2, "explanation": {"en": "Sumi said '주말에 우리 집에 와' — come to my place this weekend.", "de": "Sumi sagte '주말에 우리 집에 와' — komm am Wochenende zu mir.", "fr": "Sumi a dit '주말에 우리 집에 와' — viens chez moi ce week-end.", "es": "Sumi dijo '주말에 우리 집에 와' — ven a mi casa este fin de semana.", "pl": "Sumi powiedziała '주말에 우리 집에 와' — wpadnij do mnie w weekend.", "it": "Sumi ha detto '주말에 우리 집에 와' — vieni a casa mia questo fine settimana.", "sv": "Sumi sa '주말에 우리 집에 와' — kom hem till mig i helgen.", "fi": "Sumi sanoi '주말에 우리 집에 와' — tule minulle viikonloppuna.", "ja": "スミが「주말에 우리 집에 와」と言いました — 週末うちに来て。", "zh-CN": "秀美说\"주말에 우리 집에 와\"——周末来我家。"}}]},
  26: {"id": 26, "title": "26. 생일 파티", "titleTrans": {"en": "26. Birthday Party", "de": "26. Geburtstagsfeier", "fr": "26. Fête d'anniversaire", "es": "26. Fiesta de cumpleaños", "pl": "26. Przyjęcie urodzinowe", "it": "26. Festa di compleanno", "sv": "26. Födelsedagsfest", "fi": "26. Syntymäpäiväjuhlat", "ja": "26. 誕生日パーティー", "zh-CN": "26. 生日派对"}, "desc": "생일 파티에 관한 대화를 연습합니다. 선물, 축하 인사, 파티 준비에 대해 이야기해 보세요.", "descTrans": {"en": "Practice conversations about a birthday party. Talk about gifts, greetings, and party preparations.", "de": "Üben Sie Gespräche über eine Geburtstagsfeier. Sprechen Sie über Geschenke, Glückwünsche und Feiervorbereitungen.", "fr": "Entraînez-vous aux conversations sur une fête d'anniversaire. Parlez de cadeaux, de félicitations et de préparatifs.", "es": "Practica conversaciones sobre una fiesta de cumpleaños. Habla de regalos, felicitaciones y preparativos.", "pl": "Ćwicz rozmowy o przyjęciu urodzinowym. Rozmawiaj o prezentach, życzeniach i przygotowaniach.", "it": "Esercitati nelle conversazioni su una festa di compleanno. Parla di regali, auguri e preparativi.", "sv": "Öva på samtal om en födelsedagsfest. Prata om presenter, hälsningar och förberedelser.", "fi": "Harjoittele syntymäpäiväjuhlista käytäviä keskusteluja. Puhu lahjoista, onnitteluista ja juhlien valmisteluista.", "ja": "誕生日パーティーに関する会話を練習します。プレゼント、お祝いの言葉、パーティーの準備について話しましょう。", "zh-CN": "练习关于生日派对的对话。谈论礼物、祝贺语和派对准备。"}, "dialogue": [{"speaker": "수미", "text": "지민아, 내일이 내 생일이야!", "trans": {"en": "Jimin, tomorrow is my birthday!", "de": "Jimin, morgen ist mein Geburtstag!", "fr": "Jimin, c'est mon anniversaire demain !", "es": "Jimin, ¡mañana es mi cumpleaños!", "pl": "Jimin, jutro są moje urodziny!", "it": "Jimin, domani è il mio compleanno!", "sv": "Jimin, imorgon är min födelsedag!", "fi": "Jimin, huomenna on syntymäpäiväni!", "ja": "ジミン、明日私の誕生日なの！", "zh-CN": "智敏，明天是我的生日！"}}, {"speaker": "지민", "text": "정말? 생일 축하해! 파티 할 거야?", "trans": {"en": "Really? Happy birthday! Are you having a party?", "de": "Wirklich? Alles Gute zum Geburtstag! Machst du eine Party?", "fr": "Vraiment ? Joyeux anniversaire ! Tu fais une fête ?", "es": "¿En serio? ¡Feliz cumpleaños! ¿Vas a hacer una fiesta?", "pl": "Naprawdę? Wszystkiego najlepszego! Robisz przyjęcie?", "it": "Davvero? Buon compleanno! Fai una festa?", "sv": "Verkligen? Grattis på födelsedagen! Håller du fest?", "fi": "Totta? Hyvää syntymäpäivää! Pidätkö juhlat?", "ja": "本当に？誕生日おめでとう！パーティーするの？", "zh-CN": "真的吗？生日快乐！要开派对吗？"}}, {"speaker": "수미", "text": "응, 친구들을 초대했어. 너도 올 수 있어?", "trans": {"en": "Yes, I invited my friends. Can you come too?", "de": "Ja, ich habe Freunde eingeladen. Kannst du auch kommen?", "fr": "Oui, j'ai invité des amis. Tu peux venir aussi ?", "es": "Sí, invité a mis amigos. ¿Puedes venir también?", "pl": "Tak, zaprosiłam znajomych. Czy ty też możesz przyjść?", "it": "Sì, ho invitato gli amici. Puoi venire anche tu?", "sv": "Ja, jag har bjudit in vänner. Kan du också komma?", "fi": "Kyllä, kutsuin ystäviäni. Voitko sinäkin tulla?", "ja": "うん、友達を招待したよ。あなたも来られる？", "zh-CN": "是的，我邀请了朋友们。你也能来吗？"}}, {"speaker": "지민", "text": "물론이지! 몇 시에 시작해?", "trans": {"en": "Of course! What time does it start?", "de": "Natürlich! Um wie viel Uhr fängt es an?", "fr": "Bien sûr ! Ça commence à quelle heure ?", "es": "¡Por supuesto! ¿A qué hora empieza?", "pl": "Oczywiście! O której zaczyna się impreza?", "it": "Ovviamente! A che ora inizia?", "sv": "Självklart! Vilken tid börjar det?", "fi": "Tietysti! Mihin aikaan se alkaa?", "ja": "もちろん！何時に始まる？", "zh-CN": "当然！几点开始？"}}, {"speaker": "수미", "text": "저녁 6시야. 케이크도 있어!", "trans": {"en": "6 in the evening. There's cake too!", "de": "Um 18 Uhr. Es gibt auch Kuchen!", "fr": "À 18h. Il y a aussi du gâteau !", "es": "A las 6 de la tarde. ¡También hay pastel!", "pl": "O 18:00. Będzie też tort!", "it": "Alle 18. C'è anche la torta!", "sv": "Klockan 6 på kvällen. Det finns tårta också!", "fi": "Klo 18. On myös kakku!", "ja": "夜の6時。ケーキもあるよ！", "zh-CN": "晚上6点。还有蛋糕！"}}, {"speaker": "지민", "text": "선물은 뭐 사면 좋을까?", "trans": {"en": "What should I buy as a gift?", "de": "Was soll ich als Geschenk kaufen?", "fr": "Qu'est-ce que je devrais acheter comme cadeau ?", "es": "¿Qué debería comprar de regalo?", "pl": "Co powinienem kupić w prezencie?", "it": "Cosa dovrei comprare come regalo?", "sv": "Vad borde jag köpa som present?", "fi": "Mitä ostaisin lahjaksi?", "ja": "プレゼントは何を買えばいい？", "zh-CN": "买什么礼物好呢？"}}, {"speaker": "수미", "text": "괜찮아, 그냥 와줘. 네가 오면 돼!", "trans": {"en": "It's fine, just come. Having you here is enough!", "de": "Es ist okay, komm einfach. Dass du da bist, reicht!", "fr": "C'est bon, viens juste. Ta présence me suffit !", "es": "Está bien, solo ven. ¡Con que vengas es suficiente!", "pl": "Nie przejmuj się, po prostu przyjdź. Wystarczy, że jesteś!", "it": "Va bene, vieni solo. Basta che ci sei!", "sv": "Det är okej, kom bara. Att du är där räcker!", "fi": "Ei haittaa, tule vain. Riittää, että tulet!", "ja": "いいよ、ただ来てくれれば。あなたが来てくれれば十分！", "zh-CN": "没关系，你来就好了。你来就够了！"}}], "vocab": [{"word": "생일", "trans": {"en": "birthday", "de": "Geburtstag", "fr": "anniversaire", "es": "cumpleaños", "pl": "urodziny", "it": "compleanno", "sv": "födelsedag", "fi": "syntymäpäivä", "ja": "誕生日", "zh-CN": "生日"}}, {"word": "축하하다", "trans": {"en": "to congratulate / celebrate", "de": "gratulieren / feiern", "fr": "féliciter / célébrer", "es": "felicitar / celebrar", "pl": "gratulować / świętować", "it": "congratulare / celebrare", "sv": "gratulera / fira", "fi": "onnitella / juhlia", "ja": "お祝いする", "zh-CN": "祝贺/庆祝"}}, {"word": "초대하다", "trans": {"en": "to invite", "de": "einladen", "fr": "inviter", "es": "invitar", "pl": "zapraszać", "it": "invitare", "sv": "bjuda in", "fi": "kutsua", "ja": "招待する", "zh-CN": "邀请"}}, {"word": "시작하다", "trans": {"en": "to start / begin", "de": "beginnen / anfangen", "fr": "commencer / démarrer", "es": "empezar / comenzar", "pl": "zaczynać", "it": "iniziare / cominciare", "sv": "börja / starta", "fi": "alkaa / aloittaa", "ja": "始まる", "zh-CN": "开始"}}, {"word": "케이크", "trans": {"en": "cake", "de": "Kuchen / Torte", "fr": "gâteau", "es": "pastel / tarta", "pl": "tort / ciasto", "it": "torta", "sv": "tårta", "fi": "kakku", "ja": "ケーキ", "zh-CN": "蛋糕"}}, {"word": "선물", "trans": {"en": "gift / present", "de": "Geschenk", "fr": "cadeau", "es": "regalo", "pl": "prezent", "it": "regalo", "sv": "present", "fi": "lahja", "ja": "プレゼント", "zh-CN": "礼物"}}, {"word": "저녁", "trans": {"en": "evening", "de": "Abend", "fr": "soir", "es": "tarde / noche", "pl": "wieczór", "it": "sera", "sv": "kväll", "fi": "ilta", "ja": "夜/夕方", "zh-CN": "晚上"}}, {"word": "그냥", "trans": {"en": "just / simply", "de": "einfach / nur", "fr": "juste / simplement", "es": "simplemente / solo", "pl": "po prostu", "it": "semplicemente / solo", "sv": "bara / enkelt", "fi": "vain / yksinkertaisesti", "ja": "ただ/そのまま", "zh-CN": "就/只是"}}, {"word": "친구들", "trans": {"en": "friends (plural)", "de": "Freunde", "fr": "amis", "es": "amigos", "pl": "przyjaciele", "it": "amici", "sv": "vänner", "fi": "ystävät", "ja": "友達たち", "zh-CN": "朋友们"}}], "patterns": [{"pattern": "생일 축하해!", "patternTrans": {"en": "Happy birthday!", "de": "Alles Gute zum Geburtstag!", "fr": "Joyeux anniversaire !", "es": "¡Feliz cumpleaños!", "pl": "Wszystkiego najlepszego!", "it": "Buon compleanno!", "sv": "Grattis på födelsedagen!", "fi": "Hyvää syntymäpäivää!", "ja": "誕生日おめでとう！", "zh-CN": "生日快乐！"}, "example": "정말? 생일 축하해!", "trans": {"en": "Really? Happy birthday!", "de": "Wirklich? Alles Gute zum Geburtstag!", "fr": "Vraiment ? Joyeux anniversaire !", "es": "¿En serio? ¡Feliz cumpleaños!", "pl": "Naprawdę? Wszystkiego najlepszego!", "it": "Davvero? Buon compleanno!", "sv": "Verkligen? Grattis på födelsedagen!", "fi": "Totta? Hyvää syntymäpäivää!", "ja": "本当に？誕生日おめでとう！", "zh-CN": "真的吗？生日快乐！"}}, {"pattern": "~을/를 초대하다", "patternTrans": {"en": "to invite ~", "de": "~ einladen", "fr": "inviter ~", "es": "invitar a ~", "pl": "zapraszać ~", "it": "invitare ~", "sv": "bjuda in ~", "fi": "kutsua ~", "ja": "～を招待する", "zh-CN": "邀请～"}, "example": "친구들을 초대했어.", "trans": {"en": "I invited my friends.", "de": "Ich habe meine Freunde eingeladen.", "fr": "J'ai invité mes amis.", "es": "Invité a mis amigos.", "pl": "Zaprosiłam swoich przyjaciół.", "it": "Ho invitato i miei amici.", "sv": "Jag bjöd in mina vänner.", "fi": "Kutsuin ystäviäni.", "ja": "友達を招待した。", "zh-CN": "我邀请了朋友们。"}}, {"pattern": "~면 뭐가 좋을까?", "patternTrans": {"en": "What would be good to ~?", "de": "Was wäre gut zu ~?", "fr": "Qu'est-ce qui serait bien pour ~ ?", "es": "¿Qué sería bueno ~?", "pl": "Co byłoby dobre, żeby ~?", "it": "Cosa sarebbe bello ~?", "sv": "Vad vore bra att ~?", "fi": "Mitä olisi hyvä ~?", "ja": "～したらいい？", "zh-CN": "～什么好呢？"}, "example": "선물은 뭐 사면 좋을까?", "trans": {"en": "What would be good to buy as a gift?", "de": "Was wäre gut als Geschenk zu kaufen?", "fr": "Qu'est-ce qui serait bien d'acheter comme cadeau ?", "es": "¿Qué sería bueno comprar de regalo?", "pl": "Co byłoby dobrze kupić w prezencie?", "it": "Cosa sarebbe bello comprare come regalo?", "sv": "Vad vore bra att köpa som present?", "fi": "Mitä olisi hyvä ostaa lahjaksi?", "ja": "プレゼントは何を買えばいいかな？", "zh-CN": "买什么礼物好呢？"}}], "quizzes": [{"id": 1, "type": "comprehension", "questionAudio": "파티는 몇 시에 시작해요?", "questionTrans": {"en": "What time does the party start?", "de": "Um wie viel Uhr beginnt die Party?", "fr": "À quelle heure commence la fête ?", "es": "¿A qué hora empieza la fiesta?", "pl": "O której godzinie zaczyna się impreza?", "it": "A che ora inizia la festa?", "sv": "Vilken tid börjar festen?", "fi": "Mihin aikaan juhlat alkavat?", "ja": "パーティーは何時に始まりますか？", "zh-CN": "派对几点开始？"}, "options": [{"text": "1) 저녁 5시", "trans": {"en": "5 p.m.", "de": "17 Uhr", "fr": "17h", "es": "las 5 de la tarde", "pl": "17:00", "it": "le 17", "sv": "17:00", "fi": "klo 17", "ja": "夕方5時", "zh-CN": "下午5点"}}, {"text": "2) 저녁 6시", "trans": {"en": "6 p.m.", "de": "18 Uhr", "fr": "18h", "es": "las 6 de la tarde", "pl": "18:00", "it": "le 18", "sv": "18:00", "fi": "klo 18", "ja": "夕方6時", "zh-CN": "下午6点"}}, {"text": "3) 저녁 7시", "trans": {"en": "7 p.m.", "de": "19 Uhr", "fr": "19h", "es": "las 7 de la tarde", "pl": "19:00", "it": "le 19", "sv": "19:00", "fi": "klo 19", "ja": "夜7時", "zh-CN": "晚上7点"}}, {"text": "4) 저녁 8시", "trans": {"en": "8 p.m.", "de": "20 Uhr", "fr": "20h", "es": "las 8 de la tarde", "pl": "20:00", "it": "le 20", "sv": "20:00", "fi": "klo 20", "ja": "夜8時", "zh-CN": "晚上8点"}}], "answer": 1, "explanation": {"en": "Sumi said '저녁 6시야' — it's 6 in the evening.", "de": "Sumi sagte '저녁 6시야' — es ist 18 Uhr.", "fr": "Sumi a dit '저녁 6시야' — c'est à 18h.", "es": "Sumi dijo '저녁 6시야' — son las 6 de la tarde.", "pl": "Sumi powiedziała '저녁 6시야' — jest 18:00.", "it": "Sumi ha detto '저녁 6시야' — sono le 18.", "sv": "Sumi sa '저녁 6시야' — klockan är 18.", "fi": "Sumi sanoi '저녁 6시야' — kello on 18.", "ja": "スミが「저녁 6시야」と言いました — 夜の6時です。", "zh-CN": "秀美说\"저녁 6시야\"——晚上6点。"}}, {"id": 2, "type": "vocabulary", "questionAudio": "'선물'이 무슨 뜻이에요?", "questionTrans": {"en": "What does '선물' mean?", "de": "Was bedeutet '선물'?", "fr": "Que signifie '선물' ?", "es": "¿Qué significa '선물'?", "pl": "Co znaczy '선물'?", "it": "Cosa significa '선물'?", "sv": "Vad betyder '선물'?", "fi": "Mitä '선물' tarkoittaa?", "ja": "「선물」はどういう意味ですか？", "zh-CN": "\"선물\"是什么意思？"}, "options": [{"text": "1) 케이크", "trans": {"en": "cake", "de": "Kuchen", "fr": "gâteau", "es": "pastel", "pl": "tort", "it": "torta", "sv": "tårta", "fi": "kakku", "ja": "ケーキ", "zh-CN": "蛋糕"}}, {"text": "2) 파티", "trans": {"en": "party", "de": "Party", "fr": "fête", "es": "fiesta", "pl": "impreza", "it": "festa", "sv": "fest", "fi": "juhlat", "ja": "パーティー", "zh-CN": "派对"}}, {"text": "3) 선물 — gift", "trans": {"en": "gift / present", "de": "Geschenk", "fr": "cadeau", "es": "regalo", "pl": "prezent", "it": "regalo", "sv": "present", "fi": "lahja", "ja": "プレゼント", "zh-CN": "礼物"}}, {"text": "4) 초대장", "trans": {"en": "invitation card", "de": "Einladungskarte", "fr": "carte d'invitation", "es": "invitación", "pl": "zaproszenie", "it": "invito", "sv": "inbjudningskort", "fi": "kutsukortti", "ja": "招待状", "zh-CN": "邀请函"}}], "answer": 2, "explanation": {"en": "'선물' means gift or present. Jimin asked what to buy as a gift.", "de": "'선물' bedeutet Geschenk. Jimin fragte, was er als Geschenk kaufen soll.", "fr": "'선물' signifie cadeau. Jimin a demandé quoi acheter comme cadeau.", "es": "'선물' significa regalo. Jimin preguntó qué comprar de regalo.", "pl": "'선물' oznacza prezent. Jimin zapytał, co kupić w prezencie.", "it": "'선물' significa regalo. Jimin ha chiesto cosa comprare come regalo.", "sv": "'선물' betyder present. Jimin frågade vad han ska köpa som present.", "fi": "'선물' tarkoittaa lahjaa. Jimin kysyi mitä ostaa lahjaksi.", "ja": "「선물」はプレゼントという意味です。ジミンは何を買えばいいか聞きました。", "zh-CN": "\"선물\"是礼物的意思。智敏问买什么礼物好。"}}, {"id": 3, "type": "comprehension", "questionAudio": "수미는 선물이 필요해요?", "questionTrans": {"en": "Does Sumi need a gift?", "de": "Braucht Sumi ein Geschenk?", "fr": "Sumi a-t-elle besoin d'un cadeau ?", "es": "¿Sumi necesita un regalo?", "pl": "Czy Sumi potrzebuje prezentu?", "it": "Sumi ha bisogno di un regalo?", "sv": "Behöver Sumi en present?", "fi": "Tarvitseeko Sumi lahjaa?", "ja": "スミはプレゼントが必要ですか？", "zh-CN": "秀美需要礼物吗？"}, "options": [{"text": "1) 네, 비싼 선물이 필요해요.", "trans": {"en": "Yes, she needs an expensive gift.", "de": "Ja, sie braucht ein teures Geschenk.", "fr": "Oui, elle a besoin d'un cadeau cher.", "es": "Sí, necesita un regalo caro.", "pl": "Tak, potrzebuje drogiego prezentu.", "it": "Sì, ha bisogno di un regalo costoso.", "sv": "Ja, hon behöver en dyr present.", "fi": "Kyllä, hän tarvitsee kalliin lahjan.", "ja": "はい、高いプレゼントが必要です。", "zh-CN": "是的，需要贵重礼物。"}}, {"text": "2) 네, 케이크가 필요해요.", "trans": {"en": "Yes, she needs a cake.", "de": "Ja, sie braucht einen Kuchen.", "fr": "Oui, elle a besoin d'un gâteau.", "es": "Sí, necesita un pastel.", "pl": "Tak, potrzebuje tortu.", "it": "Sì, ha bisogno di una torta.", "sv": "Ja, hon behöver en tårta.", "fi": "Kyllä, hän tarvitsee kakun.", "ja": "はい、ケーキが必要です。", "zh-CN": "是的，需要蛋糕。"}}, {"text": "3) 아니요, 그냥 오면 돼요.", "trans": {"en": "No, just coming is enough.", "de": "Nein, einfach kommen reicht.", "fr": "Non, venir suffit.", "es": "No, con solo venir es suficiente.", "pl": "Nie, wystarczy przyjść.", "it": "No, basta venire.", "sv": "Nej, att komma räcker.", "fi": "Ei, pelkkä tuleminen riittää.", "ja": "いいえ、ただ来てくれれば十分です。", "zh-CN": "不，来就够了。"}}, {"text": "4) 아니요, 파티가 없어요.", "trans": {"en": "No, there's no party.", "de": "Nein, es gibt keine Party.", "fr": "Non, il n'y a pas de fête.", "es": "No, no hay fiesta.", "pl": "Nie, nie ma imprezy.", "it": "No, non c'è festa.", "sv": "Nej, det är ingen fest.", "fi": "Ei, juhlat ei ole.", "ja": "いいえ、パーティーはありません。", "zh-CN": "不，没有派对。"}}], "answer": 2, "explanation": {"en": "Sumi said '그냥 와줘. 네가 오면 돼!' — Just come. Having you here is enough!", "de": "Sumi sagte '그냥 와줘. 네가 오면 돼!' — Komm einfach. Es reicht, dass du da bist!", "fr": "Sumi a dit '그냥 와줘. 네가 오면 돼!' — Viens juste. Ta présence suffit !", "es": "Sumi dijo '그냥 와줘. 네가 오면 돼!' — Solo ven. ¡Con que vengas es suficiente!", "pl": "Sumi powiedziała '그냥 와줘. 네가 오면 돼!' — Po prostu przyjdź. Wystarczy, że jesteś!", "it": "Sumi ha detto '그냥 와줘. 네가 오면 돼!' — Vieni e basta. Basta che ci sei!", "sv": "Sumi sa '그냥 와줘. 네가 오면 돼!' — Kom bara. Att du är här räcker!", "fi": "Sumi sanoi '그냥 와줘. 네가 오면 돼!' — Tule vain. Riittää, että tulet!", "ja": "スミが「그냥 와줘. 네가 오면 돼!」と言いました — ただ来てくれれば、あなたが来てくれるだけで十分！", "zh-CN": "秀美说\"그냥 와줘. 네가 오면 돼!\"——你来就好了，你来就够了！"}}]},
  27: {"id": 27, "title": "27. 인터넷/스마트폰 사용", "titleTrans": {"en": "27. Using the Internet / Smartphone", "de": "27. Internet / Smartphone nutzen", "fr": "27. Utiliser Internet / Smartphone", "es": "27. Usar Internet / Teléfono inteligente", "pl": "27. Korzystanie z internetu / smartfona", "it": "27. Usare Internet / Smartphone", "sv": "27. Använda internet / Smartphone", "fi": "27. Internetin / Älypuhelimen käyttö", "ja": "27. インターネット/スマートフォンの使い方", "zh-CN": "27. 使用网络/智能手机"}, "desc": "인터넷과 스마트폰 사용에 관한 대화를 연습합니다. 앱, 검색, 배터리 등에 대해 이야기해 보세요.", "descTrans": {"en": "Practice conversations about using the internet and smartphones. Talk about apps, searching, and battery.", "de": "Üben Sie Gespräche über die Nutzung von Internet und Smartphones. Sprechen Sie über Apps, Suche und Akku.", "fr": "Entraînez-vous aux conversations sur l'utilisation d'Internet et des smartphones. Parlez d'applications, de recherche et de batterie.", "es": "Practica conversaciones sobre el uso de internet y smartphones. Habla de apps, búsquedas y batería.", "pl": "Ćwicz rozmowy o korzystaniu z internetu i smartfonów. Rozmawiaj o aplikacjach, wyszukiwaniu i baterii.", "it": "Esercitati nelle conversazioni sull'uso di internet e smartphone. Parla di app, ricerche e batteria.", "sv": "Öva på samtal om att använda internet och smartphones. Prata om appar, sökning och batteri.", "fi": "Harjoittele internetin ja älypuhelimen käyttöä koskevia keskusteluja. Puhu sovelluksista, hakemisesta ja akusta.", "ja": "インターネットとスマートフォンの使用に関する会話を練習します。アプリ、検索、バッテリーについて話しましょう。", "zh-CN": "练习关于使用网络和智能手机的对话。谈论应用程序、搜索和电池。"}, "dialogue": [{"speaker": "수미", "text": "지민아, 좋은 식당 찾는 앱 알아?", "trans": {"en": "Jimin, do you know a good app for finding restaurants?", "de": "Jimin, kennst du eine gute App, um Restaurants zu finden?", "fr": "Jimin, tu connais une bonne appli pour trouver des restaurants ?", "es": "Jimin, ¿conoces una buena app para buscar restaurantes?", "pl": "Jimin, znasz dobrą aplikację do szukania restauracji?", "it": "Jimin, conosci una buona app per trovare ristoranti?", "sv": "Jimin, känner du till en bra app för att hitta restauranger?", "fi": "Jimin, tiedätkö hyvän sovelluksen ravintoloiden etsimiseen?", "ja": "ジミン、良いレストランを探すアプリ知ってる？", "zh-CN": "智敏，你知道找餐厅的好APP吗？"}}, {"speaker": "지민", "text": "응, 네이버 지도 써봐. 편해.", "trans": {"en": "Yes, try Naver Maps. It's convenient.", "de": "Ja, probier Naver Maps. Es ist praktisch.", "fr": "Oui, essaie Naver Maps. C'est pratique.", "es": "Sí, prueba Naver Maps. Es práctico.", "pl": "Tak, wypróbuj Naver Maps. Jest wygodna.", "it": "Sì, prova Naver Maps. È comodo.", "sv": "Ja, prova Naver Maps. Det är bekvämt.", "fi": "Kyllä, kokeile Naver Mapsia. Se on kätevä.", "ja": "うん、NAVERマップを使ってみて。便利だよ。", "zh-CN": "嗯，试试Naver地图，很方便。"}}, {"speaker": "수미", "text": "어떻게 사용해?", "trans": {"en": "How do I use it?", "de": "Wie benutze ich es?", "fr": "Comment ça s'utilise ?", "es": "¿Cómo se usa?", "pl": "Jak się tego używa?", "it": "Come si usa?", "sv": "Hur använder man den?", "fi": "Miten sitä käytetään?", "ja": "どうやって使うの？", "zh-CN": "怎么用？"}}, {"speaker": "지민", "text": "그냥 검색창에 음식 이름을 쓰면 돼.", "trans": {"en": "Just type the food name in the search bar.", "de": "Schreib einfach den Namen des Essens in die Suchleiste.", "fr": "Écris juste le nom du plat dans la barre de recherche.", "es": "Solo escribe el nombre de la comida en el buscador.", "pl": "Wystarczy wpisać nazwę jedzenia w wyszukiwarce.", "it": "Scrivi solo il nome del cibo nella barra di ricerca.", "sv": "Skriv bara matens namn i sökrutan.", "fi": "Kirjoita vain ruoan nimi hakukenttään.", "ja": "検索欄に食べ物の名前を書くだけ。", "zh-CN": "在搜索框里输入食物名称就可以了。"}}, {"speaker": "수미", "text": "아, 간단하다! 그런데 내 폰 배터리가 없어.", "trans": {"en": "Oh, it's simple! But my phone has no battery.", "de": "Oh, das ist einfach! Aber mein Handy hat keinen Akku mehr.", "fr": "Oh, c'est simple ! Mais mon téléphone n'a plus de batterie.", "es": "¡Ah, es sencillo! Pero mi teléfono no tiene batería.", "pl": "Ach, proste! Ale mój telefon nie ma baterii.", "it": "Oh, è semplice! Ma il mio telefono non ha batteria.", "sv": "Åh, det är enkelt! Men min telefon har inget batteri.", "fi": "Vau, se on yksinkertaista! Mutta puhelimessani ei ole akkua.", "ja": "あ、簡単だ！でも私のスマホ、充電がない。", "zh-CN": "哦，这么简单！但我手机没电了。"}}, {"speaker": "지민", "text": "내 충전기 써. 여기 있어.", "trans": {"en": "Use my charger. Here it is.", "de": "Benutze mein Ladekabel. Hier ist es.", "fr": "Utilise mon chargeur. Le voilà.", "es": "Usa mi cargador. Aquí está.", "pl": "Użyj mojej ładowarki. Masz ją.", "it": "Usa il mio caricatore. Eccolo.", "sv": "Använd min laddare. Här är den.", "fi": "Käytä laturiani. Tässä se on.", "ja": "私の充電器使って。ここにあるよ。", "zh-CN": "用我的充电器。在这里。"}}, {"speaker": "수미", "text": "고마워! 정말 도움이 됐어.", "trans": {"en": "Thank you! That really helped.", "de": "Danke! Das hat wirklich geholfen.", "fr": "Merci ! Ça m'a vraiment aidée.", "es": "¡Gracias! De verdad que fue de ayuda.", "pl": "Dziękuję! Naprawdę mi pomogłeś.", "it": "Grazie! Hai davvero aiutato.", "sv": "Tack! Det hjälpte verkligen.", "fi": "Kiitos! Se todella auttoi.", "ja": "ありがとう！本当に助かった。", "zh-CN": "谢谢！真的帮了大忙。"}}], "vocab": [{"word": "앱", "trans": {"en": "app", "de": "App", "fr": "appli", "es": "aplicación", "pl": "aplikacja", "it": "app", "sv": "app", "fi": "sovellus", "ja": "アプリ", "zh-CN": "应用程序"}}, {"word": "검색하다", "trans": {"en": "to search", "de": "suchen", "fr": "chercher / rechercher", "es": "buscar", "pl": "szukać / wyszukiwać", "it": "cercare / ricercare", "sv": "söka", "fi": "hakea / etsiä", "ja": "検索する", "zh-CN": "搜索"}}, {"word": "지도", "trans": {"en": "map", "de": "Karte", "fr": "carte / plan", "es": "mapa", "pl": "mapa", "it": "mappa / carta", "sv": "karta", "fi": "kartta", "ja": "地図", "zh-CN": "地图"}}, {"word": "편하다", "trans": {"en": "to be convenient / comfortable", "de": "bequem / praktisch sein", "fr": "être pratique / confortable", "es": "ser conveniente / cómodo", "pl": "być wygodnym", "it": "essere comodo / conveniente", "sv": "vara bekväm / praktisk",  "es": "Naver Maps", "pl": "Naver Maps", "it": "Naver Maps", "sv": "Naver Maps", "fi": "Naver Maps", "ja": "NAVERマップ", "zh-CN": "Naver地图"}}, {"text": "3) 구글 지도", "trans": {"en": "Google Maps", "de": "Google Maps", "fr": "Google Maps", "es": "Google Maps", "pl": "Google Maps", "it": "Google Maps", "sv": "Google Maps", "fi": "Google Maps", "ja": "Googleマップ", "zh-CN": "谷歌地图"}}, {"text": "4) 배달 앱", "trans": {"en": "delivery app", "de": "Liefer-App", "fr": "appli de livraison", "es": "app de delivery", "pl": "aplikacja dostawcza", "it": "app di consegna", "sv": "leveransapp", "fi": "toimitussovellus", "ja": "デリバリーアプリ", "zh-CN": "外卖APP"}}], "answer": 1, "explanation": {"en": "Jimin said '네이버 지도 써봐' — try Naver Maps.", "de": "Jimin sagte '네이버 지도 써봐' — probier Naver Maps.", "fr": "Jimin a dit '네이버 지도 써봐' — essaie Naver Maps.", "es": "Jimin dijo '네이버 지도 써봐' — prueba Naver Maps.", "pl": "Jimin powiedział '네이버 지도 써봐' — wypróbuj Naver Maps.", "it": "Jimin ha detto '네이버 지도 써봐' — prova Naver Maps.", "sv": "Jimin sa '네이버 지도 써봐' — prova Naver Maps.", "fi": "Jimin sanoi '네이버 지도 써봐' — kokeile Naver Mapsia.", "ja": "ジミンが「네이버 지도 써봐」と言いました — NAVERマップを使ってみて。", "zh-CN": "智敏说\"네이버 지도 써봐\"——试试Naver地图。"}}, {"id": 2, "type": "vocabulary", "questionAudio": "'배터리가 없다'는 무슨 뜻이에요?", "questionTrans": {"en": "What does '배터리가 없다' mean?", "de": "Was bedeutet '배터리가 없다'?", "fr": "Que signifie '배터리가 없다' ?", "es": "¿Qué significa '배터리가 없다'?", "pl": "Co znaczy '배터리가 없다'?", "it": "Cosa significa '배터리가 없다'?", "sv": "Vad betyder '배터리가 없다'?", "fi": "Mitä '배터리가 없다' tarkoittaa?", "ja": "「배터리가 없다」はどういう意味ですか？", "zh-CN": "\"배터리가 없다\"是什么意思？"}, "options": [{"text": "1) 배터리가 충전됐어요.", "trans": {"en": "The battery is charged.", "de": "Der Akku ist geladen.", "fr": "La batterie est chargée.", "es": "La batería está cargada.", "pl": "Bateria jest naładowana.", "it": "La batteria è carica.", "sv": "Batteriet är laddat.", "fi": "Akku on ladattu.", "ja": "バッテリーが充電されています。", "zh-CN": "电池已充电。"}}, {"text": "2) 배터리가 없어요 — 배터리가 다 됐어요", "trans": {"en": "There's no battery — the battery is dead.", "de": "Kein Akku — der Akku ist leer.", "fr": "Pas de batterie — la batterie est morte.", "es": "Sin batería — la batería está agotada.", "pl": "Brak baterii — bateria jest rozładowana.", "it": "Non c'è batteria — la batteria è scarica.", "sv": "Inget batteri — batteriet är dött.", "fi": "Ei akkua — akku on tyhjä.", "ja": "バッテリーがない — バッテリーが切れている", "zh-CN": "没电了——电池耗尽了"}}, {"text": "3) 스마트폰이 없어요.", "trans": {"en": "There's no smartphone.", "de": "Es gibt kein Smartphone.", "fr": "Il n'y a pas de smartphone.", "es": "No hay smartphone.", "pl": "Nie ma smartfona.", "it": "Non c'è smartphone.", "sv": "Det finns ingen smartphone.", "fi": "Älypuhelinta ei ole.", "ja": "スマートフォンがない。", "zh-CN": "没有智能手机。"}}, {"text": "4) 인터넷이 느려요.", "trans": {"en": "The internet is slow.", "de": "Das Internet ist langsam.", "fr": "Internet est lent.", "es": "El internet es lento.", "pl": "Internet jest wolny.", "it": "Internet è lento.", "sv": "Internet är långsamt.", "fi": "Internet on hidas.", "ja": "インターネットが遅い。", "zh-CN": "网络很慢。"}}], "answer": 1, "explanation": {"en": "'배터리가 없어' means the battery is dead or there's no battery left. Sumi needed a charger.", "de": "'배터리가 없어' bedeutet, der Akku ist leer. Sumi brauchte ein Ladekabel.", "fr": "'배터리가 없어' signifie que la batterie est morte. Sumi avait besoin d'un chargeur.", "es": "'배터리가 없어' significa que la batería está agotada. Sumi necesitaba un cargador.", "pl": "'배터리가 없어' oznacza, że bateria jest rozładowana. Sumi potrzebowała ładowarki.", "it": "'배터리가 없어' significa che la batteria è scarica. Sumi aveva bisogno di un caricatore.", "sv": "'배터리가 없어' betyder att batteriet är dött. Sumi behövde en laddare.", "fi": "'배터리가 없어' tarkoittaa, että akku on tyhjä. Sumi tarvitsi laturia.", "ja": "「배터리가 없어」はバッテリーが切れているという意味です。スミは充電器が必要でした。", "zh-CN": "\"배터리가 없어\"意思是没电了。秀美需要充电器。"}}, {"id": 3, "type": "grammar", "questionAudio": "음식을 어떻게 검색해요?", "questionTrans": {"en": "How do you search for food?", "de": "Wie sucht man nach Essen?", "fr": "Comment cherche-t-on de la nourriture ?", "es": "¿Cómo se busca comida?", "pl": "Jak szuka się jedzenia?", "it": "Come si cerca il cibo?", "sv": "Hur söker man efter mat?", "fi": "Kuinka etsitään ruokaa?", "ja": "食べ物をどうやって検索しますか？", "zh-CN": "怎么搜索食物？"}, "options": [{"text": "1) 지도를 그려요.", "trans": {"en": "Draw a map.", "de": "Zeichne eine Karte.", "fr": "Dessine une carte.", "es": "Dibujar un mapa.", "pl": "Narysuj mapę.", "it": "Disegna una mappa.", "sv": "Rita en karta.", "fi": "Piirrä kartta.", "ja": "地図を描く。", "zh-CN": "画地图。"}}, {"text": "2) 전화해요.", "trans": {"en": "Call by phone.", "de": "Telefonieren.", "fr": "Appeler.", "es": "Llamar por teléfono.", "pl": "Zadzwonić.", "it": "Telefonare.", "sv": "Ringa.", "fi": "Soittaa.", "ja": "電話する。", "zh-CN": "打电话。"}}, {"text": "3) 검색창에 음식 이름을 써요.", "trans": {"en": "Write the food name in the search bar.", "de": "Den Speisennamen in die Suchleiste schreiben.", "fr": "Écrire le nom du plat dans la barre de recherche.", "es": "Escribir el nombre de la comida en el buscador.", "pl": "Wpisać nazwę jedzenia w wyszukiwarce.", "it": "Scrivere il nome del cibo nella barra di ricerca.", "sv": "Skriva matens namn i sökrutan.", "fi": "Kirjoittaa ruoan nimi hakukenttään.", "ja": "検索欄に食べ物の名前を書く。", "zh-CN": "在搜索框输入食物名称。"}}, {"text": "4) 앱을 삭제해요.", "trans": {"en": "Delete the app.", "de": "Die App löschen.", "fr": "Supprimer l'appli.", "es": "Eliminar la app.", "pl": "Usuń aplikację.", "it": "Elimina l'app.", "sv": "Ta bort appen.", "fi": "Poista sovellus.", "ja": "アプリを削除する。", "zh-CN": "删除应用。"}}], "answer": 2, "explanation": {"en": "Jimin said '검색창에 음식 이름을 쓰면 돼' — just write the food name in the search bar.", "de": "Jimin sagte '검색창에 음식 이름을 쓰면 돼' — schreib einfach den Speisennamen in die Suchleiste.", "fr": "Jimin a dit '검색창에 음식 이름을 쓰면 돼' — il suffit d'écrire le nom du plat dans la barre de recherche.", "es": "Jimin dijo '검색창에 음식 이름을 쓰면 돼' — solo escribe el nombre de la comida en el buscador.", "pl": "Jimin powiedział '검색창에 음식 이름을 쓰면 돼' — wystarczy wpisać nazwę jedzenia w wyszukiwarce.", "it": "Jimin ha detto '검색창에 음식 이름을 쓰면 돼' — basta scrivere il nome del cibo nella barra di ricerca.", "sv": "Jimin sa '검색창에 음식 이름을 쓰면 돼' — skriv bara matens namn i sökrutan.", "fi": "Jimin sanoi '검색창에 음식 이름을 쓰면 돼' — kirjoita vain ruoan nimi hakukenttään.", "ja": "ジミンが「검색창에 음식 이름을 쓰면 돼」と言いました — 検索欄に食べ物の名前を書けばいい。", "zh-CN": "智敏说\"검색창에 음식 이름을 쓰면 돼\"——在搜索框里输入食物名称就行。"}}, {"type": "comprehension", "questionAudio": "수미 씨는 왜 폰을 쓸 수 없었어요?", "questionTrans": {"en": "Why couldn't Sumi use her phone?", "de": "Warum konnte Sumi ihr Handy nicht benutzen?", "fr": "Pourquoi Sumi ne pouvait-elle pas utiliser son téléphone ?", "es": "¿Por qué no podía Sumi usar su teléfono?", "pl": "Dlaczego Sumi nie mogła używać telefonu?", "it": "Perché Sumi non poteva usare il telefono?", "sv": "Varför kunde Sumi inte använda sin telefon?", "fi": "Miksi Sumi ei voinut käyttää puhelintaan?", "ja": "スミさんはなぜ携帯を使えなかったのですか？", "zh-CN": "秀美为什么不能用手机？"}, "options": [{"text": "인터넷이 없어서요.", "trans": {"en": "No internet.", "de": "Kein Internet.", "fr": "Pas d'internet.", "es": "Sin internet.", "pl": "Brak internetu.", "it": "Niente internet.", "sv": "Inget internet.", "fi": "Ei nettiä.", "ja": "ネットがないから。", "zh-CN": "没有网络。"}}, {"text": "배터리가 없어서요.", "trans": {"en": "Dead battery.", "de": "Leerer Akku.", "fr": "Batterie vide.", "es": "Batería agotada.", "pl": "Pusta bateria.", "it": "Batteria scarica.", "sv": "Tomt batteri.", "fi": "Akku tyhjä.", "ja": "バッテリー切れ。", "zh-CN": "没电了。"}}, {"text": "앱이 없어서요.", "trans": {"en": "No app.", "de": "Keine App.", "fr": "Pas d'application.", "es": "Sin aplicación.", "pl": "Brak aplikacji.", "it": "Nessuna app.", "sv": "Ingen app.", "fi": "Ei sovellusta.", "ja": "アプリがないから。", "zh-CN": "没有应用。"}}, {"text": "폰이 고장 나서요.", "trans": {"en": "Phone is broken.", "de": "Handy kaputt.", "fr": "Téléphone cassé.", "es": "Teléfono roto.", "pl": "Telefon zepsuty.", "it": "Telefono rotto.", "sv": "Telefonen är trasig.", "fi": "Puhelin rikki.", "ja": "携帯が壊れているから。", "zh-CN": "手机坏了。"}}], "answer": 1, "explanation": {"en": "Sumi says 내 폰 배터리가 없어 (my phone has no battery).", "de": "Sumi sagt 내 폰 배터리가 없어.", "fr": "Sumi dit 내 폰 배터리가 없어.", "es": "Sumi dice 내 폰 배터리가 없어.", "pl": "Sumi mówi 내 폰 배터리가 없어.", "it": "Sumi dice 내 폰 배터리가 없어.", "sv": "Sumi säger 내 폰 배터리가 없어.", "fi": "Sumi sanoo 내 폰 배터리가 없어.", "ja": "スミは내 폰 배터리가 없어と言います。", "zh-CN": "秀美说내 폰 배터리가 없어。"}}]},
  28: {"id": 28, "title": "28. 편의점에서", "titleTrans": {"en": "28. At the Convenience Store", "de": "28. Im Convenience Store", "fr": "28. Au convenience store", "es": "28. En la tienda de conveniencia", "pl": "28. W sklepie całodobowym", "it": "28. Al convenience store", "sv": "28. På bekvämlighetsbutiken", "fi": "28. Lähikaupassa", "ja": "28. コンビニで", "zh-CN": "28. 在便利店"}, "desc": "편의점에서 물건을 사는 대화를 연습합니다. 물건 찾기, 계산, 포인트 카드 등에 대해 이야기해 보세요.", "descTrans": {"en": "Practice conversations for buying things at a convenience store. Talk about finding items, paying, and point cards.", "de": "Üben Sie Gespräche zum Einkaufen im Convenience Store. Sprechen Sie über Artikel finden, Bezahlen und Punktekarten.", "fr": "Entraînez-vous aux conversations pour acheter des choses dans un convenience store. Parlez de trouver des articles, payer et cartes de points.", "es": "Practica conversaciones para comprar cosas en una tienda de conveniencia. Habla de encontrar productos, pagar y tarjetas de puntos.", "pl": "Ćwicz rozmowy przy zakupach w sklepie całodobowym. Rozmawiaj o szukaniu produktów, płaceniu i kartach punktowych.", "it": "Esercitati nelle conversazioni per comprare cose in un convenience store. Parla di trovare articoli, pagare e carte punti.", "sv": "Öva på samtal för att köpa saker i en bekvämlighetsbutik. Prata om att hitta varor, betala och poängkort.", "fi": "Harjoittele lähikaupassa ostamisesta käytäviä keskusteluja. Puhu tuotteiden etsimisestä, maksamisesta ja pistekortista.", "ja": "コンビニで物を買う会話を練習します。商品探し、支払い、ポイントカードについて話しましょう。", "zh-CN": "练习在便利店买东西的对话。谈论找商品、结账和积分卡。"}, "dialogue": [{"speaker": "수미", "text": "저기요, 삼각김밥 어디 있어요?", "trans": {"en": "Excuse me, where are the triangle kimbap?", "de": "Entschuldigung, wo sind die Dreieckskimbap?", "fr": "Excusez-moi, où sont les kimbap triangles ?", "es": "Disculpe, ¿dónde están los kimbap triangulares?", "pl": "Przepraszam, gdzie są trójkątne kimbap?", "it": "Mi scusi, dove sono i kimbap triangolari?", "sv": "Ursäkta, var finns de triangulära kimbap?", "fi": "Anteeksi, missä ovat kolmiokimbap?", "ja": "すみません、おにぎりはどこにありますか？", "zh-CN": "请问，三角饭团在哪里？"}}, {"speaker": "지민", "text": "저기 냉장고 옆에 있어요.", "trans": {"en": "They're over there next to the refrigerator.", "de": "Sie sind dort drüben neben dem Kühlschrank.", "fr": "Ils sont là-bas à côté du réfrigérateur.", "es": "Están allá, al lado de la nevera.", "pl": "Są tam, obok lodówki.", "it": "Sono lì accanto al frigorifero.", "sv": "De är där borta vid sidan av kylen.", "fi": "Ne ovat tuolla jääkaapin vieressä.", "ja": "あそこの冷蔵庫の横にあります。", "zh-CN": "就在那边冰箱旁边。"}}, {"speaker": "수미", "text": "감사합니다. 이거 하나 살게요.", "trans": {"en": "Thank you. I'll buy one of these.", "de": "Danke. Ich kaufe eines davon.", "fr": "Merci. Je vais en prendre un.", "es": "Gracias. Compraré uno de estos.", "pl": "Dziękuję. Kupię jedno.", "it": "Grazie. Compro uno di questi.", "sv": "Tack. Jag köper en av dessa.", "fi": "Kiitos. Ostan yhden näistä.", "ja": "ありがとうございます。これを一個買います。", "zh-CN": "谢谢。我买一个这个。"}}, {"speaker": "지민", "text": "음료수도 드릴까요?", "trans": {"en": "Would you like a drink too?", "de": "Möchten Sie auch ein Getränk?", "fr": "Vous désirez aussi une boisson ?", "es": "¿Quiere también una bebida?", "pl": "Czy chciałaby Pani też napój?", "it": "Vuole anche una bibita?", "sv": "Vill du ha en dryck också?", "fi": "Haluatko myös juotavaa?", "ja": "飲み物もいかがですか？", "zh-CN": "要饮料吗？"}}, {"speaker": "수미", "text": "아니요, 괜찮아요. 얼마예요?", "trans": {"en": "No, it's okay. How much is it?", "de": "Nein, danke. Wie viel kostet es?", "fr": "Non, ça va. Combien ça fait ?", "es": "No, gracias. ¿Cuánto es?", "pl": "Nie, dziękuję. Ile to kosztuje?", "it": "No, grazie. Quanto costa?", "sv": "Nej, det är okej. Hur mycket kostar det?", "fi": "Ei, kiitos. Paljonko se maksaa?", "ja": "いいえ、結構です。いくらですか？", "zh-CN": "不了，谢谢。多少钱？"}}, {"speaker": "지민", "text": "1,500원이에요. 포인트 카드 있으세요?", "trans": {"en": "It's 1,500 won. Do you have a point card?", "de": "Es kostet 1.500 Won. Haben Sie eine Punktekarte?", "fr": "C'est 1 500 wons. Vous avez une carte de fidélité ?", "es": "Son 1.500 won. ¿Tiene tarjeta de puntos?", "pl": "To 1 500 wonów. Czy ma Pani kartę punktową?", "it": "Sono 1.500 won. Ha una carta punti?", "sv": "Det är 1 500 won. Har du ett poängkort?", "fi": "Se on 1 500 wonia. Onko teillä pistekorttiä?", "ja": "1,500ウォンです。ポイントカードはお持ちですか？", "zh-CN": "1500韩元。您有积分卡吗？"}}, {"speaker": "수미", "text": "아니요, 없어요. 카드로 계산할게요.", "trans": {"en": "No, I don't. I'll pay by card.", "de": "Nein, nicht. Ich zahle mit Karte.", "fr": "Non, je n'en ai pas. Je paie par carte.", "es": "No, no tengo. Pagaré con tarjeta.", "pl": "Nie, nie mam. Zapłacę kartą.", "it": "No, non ce l'ho. Pago con carta.", "sv": "Nej, det har jag inte. Jag betalar med kort.", "fi": "Ei, minulla ei ole. Maksan kortilla.", "ja": "いいえ、ないです。カードで払います。", "zh-CN": "没有。我用卡付款。"}}], "vocab": [{"word": "편의점", "trans": {"en": "convenience store", "de": "Convenience Store", "fr": "épicerie de nuit / convenience store", "es": "tienda de conveniencia", "pl": "sklep całodobowy", "it": "convenience store", "sv": "bekvämlighetsbutik", "fi": "lähikauppa", "ja": "コンビニ", "zh-CN": "便利店"}}, {"word": "삼각김밥", "trans": {"en": "triangle kimbap / rice ball", "de": "Dreiecks-Kimbap", "fr": "kimbap triangulaire", "es": "kimbap triangular", "pl": "trójkątne kimbap", "it": "kimbap triangolare", "sv": "triangulär kimbap", "fi": "kolmio-kimbap", "ja": "三角おにぎり", "zh-CN": "三角饭团"}}, {"word": "냉장고", "trans": {"en": "refrigerator", "de": "Kühlschrank", "fr": "réfrigérateur", "es": "nevera / refrigerador", "pl": "lodówka", "it": "frigorifero", "sv": "kylskåp", "fi": "jääkaappi", "ja": "冷蔵庫", "zh-CN": "冰箱"}}, {"word": "옆", "trans": {"en": "beside / next to", "de": "neben", "fr": "à côté de", "es": "al lado de", "pl": "obok", "it": "accanto a", "sv": "bredvid", "fi": "vieressä", "ja": "横", "zh-CN": "旁边"}}, {"word": "음료수", "trans": {"en": "beverage / drink", "de": "Getränk", "fr": "boisson", "es": "bebida", "pl": "napój", "it": "bibita / bevanda", "sv": "dryck", "fi": "juoma", "ja": "飲み物", "zh-CN": "饮料"}}, {"word": "얼마", "trans": {"en": "how much", "de": "wie viel", "fr": "combien", "es": "cuánto", "pl": "ile", "it": "quanto", "sv": "hur mycket", "fi": "paljonko", "ja": "いくら", "zh-CN": "多少钱"}}, {"word": "포인트 카드", "trans": {"en": "point card / loyalty card", "de": "Punktekarte", "fr": "carte de fidélité", "es": "tarjeta de puntos", "pl": "karta punktowa", "it": "carta punti", "sv": "poängkort", "fi": "pistekortti", "ja": "ポイントカード", "zh-CN": "积分卡"}}, {"word": "계산하다", "trans": {"en": "to pay / check out", "de": "bezahlen / abrechnen", "fr": "payer / régler", "es": "pagar", "pl": "płacić / rozliczać", "it": "pagare", "sv": "betala / checka ut", "fi": "maksaa / laskea", "ja": "計算する/払う", "zh-CN": "结账/付款"}}, {"word": "카드", "trans": {"en": "card", "de": "Karte", "fr": "carte", "es": "tarjeta", "pl": "karta", "it": "carta", "sv": "kort", "fi": "kortti", "ja": "カード", "zh-CN": "卡"}}], "patterns": [{"pattern": "저기요", "patternTrans": {"en": "Excuse me (to get attention)", "de": "Entschuldigung", "fr": "Excusez-moi", "es": "Disculpe", "pl": "Przepraszam", "it": "Mi scusi", "sv": "Ursäkta", "fi": "Anteeksi", "ja": "すみません", "zh-CN": "请问/打扰一下"}, "example": "저기요, 삼각김밥 어디 있어요?", "trans": {"en": "Excuse me, where are the triangle kimbap?", "de": "Entschuldigung, wo sind die Dreiecks-Kimbap?", "fr": "Excusez-moi, où sont les kimbap triangles ?", "es": "Disculpe, ¿dónde están los kimbap triangulares?", "pl": "Przepraszam, gdzie są trójkątne kimbap?", "it": "Mi scusi, dove sono i kimbap triangolari?", "sv": "Ursäkta, var finns de triangulära kimbap?", "fi": "Anteeksi, missä ovat kolmiokimbap?", "ja": "すみません、三角おにぎりはどこにありますか？", "zh-CN": "请问，三角饭团在哪里？"}}, {"pattern": "~(으)로 계산할게요", "patternTrans": {"en": "I'll pay by ~", "de": "Ich zahle mit ~", "fr": "Je paie par ~", "es": "Pagaré con ~", "pl": "Zapłacę ~", "it": "Pago con ~", "sv": "Jag betalar med ~", "fi": "Maksan ~lla", "ja": "～で払います", "zh-CN": "用～付款"}, "example": "카드로 계산할게요.", "trans": {"en": "I'll pay by card.", "de": "Ich zahle mit Karte.", "fr": "Je paie par carte.", "es": "Pagaré con tarjeta.", "pl": "Zapłacę kartą.", "it": "Pago con carta.", "sv": "Jag betalar med kort.", "fi": "Maksan kortilla.", "ja": "カードで払います。", "zh-CN": "用卡付款。"}}, {"pattern": "이거 ~살게요", "patternTrans": {"en": "I'll buy ~ of this", "de": "Ich kaufe ~ davon", "fr": "Je vais acheter ~ de ceci", "es": "Voy a comprar ~ de esto", "pl": "Kupię ~ tego", "it": "Compro ~ di questo", "sv": "Jag köper ~ av detta", "fi": "Ostan ~ tätä", "ja": "これを～買います", "zh-CN": "我买这个～"}, "example": "이거 하나 살게요.", "trans": {"en": "I'll buy one of these.", "de": "Ich kaufe eines davon.", "fr": "Je vais en acheter un.", "es": "Voy a comprar uno de estos.", "pl": "Kupię jedno.", "it": "Compro uno di questi.", "sv": "Jag köper en av dessa.", "fi": "Ostan yhden tätä.", "ja": "これを一個買います。", "zh-CN": "我买一个这个。"}}], "quizzes": [{"id": 1, "type": "comprehension", "questionAudio": "삼각김밥은 어디에 있어요?", "questionTrans": {"en": "Where are the triangle kimbap?", "de": "Wo sind die Dreiecks-Kimbap?", "fr": "Où sont les kimbap triangles ?", "es": "¿Dónde están los kimbap triangulares?", "pl": "Gdzie są trójkątne kimbap?", "it": "Dove sono i kimbap triangolari?", "sv": "Var finns de triangulära kimbap?", "fi": "Missä ovat kolmiokimbap?", "ja": "三角おにぎりはどこにありますか？", "zh-CN": "三角饭团在哪里？"}, "options": [{"text": "1) 계산대 옆", "trans": {"en": "next to the checkout counter", "de": "neben der Kasse", "fr": "à côté de la caisse", "es": "al lado de la caja", "pl": "obok kasy", "it": "accanto alla cassa", "sv": "bredvid kassan", "fi": "kassan vieressä", "ja": "レジの横", "zh-CN": "收银台旁边"}}, {"text": "2) 입구 옆", "trans": {"en": "next to the entrance", "de": "neben dem Eingang", "fr": "à côté de l'entrée", "es": "al lado de la entrada", "pl": "obok wejścia", "it": "accanto all'entrata", "sv": "bredvid entrén", "fi": "sisäänkäynnin vieressä", "ja": "入口の横", "zh-CN": "入口旁边"}}, {"text": "3) 냉장고 옆", "trans": {"en": "next to the refrigerator", "de": "neben dem Kühlschrank", "fr": "à côté du réfrigérateur", "es": "al lado de la nevera", "pl": "obok lodówki", "it": "accanto al frigorifero", "sv": "bredvid kylen", "fi": "jääkaapin vieressä", "ja": "冷蔵庫の横", "zh-CN": "冰箱旁边"}}, {"text": "4) 창문 옆", "trans": {"en": "next to the window", "de": "neben dem Fenster", "fr": "à côté de la fenêtre", "es": "al lado de la ventana", "pl": "obok okna", "it": "accanto alla finestra", "sv": "bredvid fönstret", "fi": "ikkunan vieressä", "ja": "窓の横", "zh-CN": "窗户旁边"}}], "answer": 2, "explanation": {"en": "Jimin said '저기 냉장고 옆에 있어요' — they're over there next to the refrigerator.", "de": "Jimin sagte '저기 냉장고 옆에 있어요' — sie sind dort drüben neben dem Kühlschrank.", "fr": "Jimin a dit '저기 냉장고 옆에 있어요' — ils sont là-bas à côté du réfrigérateur.", "es": "Jimin dijo '저기 냉장고 옆에 있어요' — están allá al lado de la nevera.", "pl": "Jimin powiedział '저기 냉장고 옆에 있어요' — są tam obok lodówki.", "it": "Jimin ha detto '저기 냉장고 옆에 있어요' — sono lì accanto al frigorifero.", "sv": "Jimin sa '저기 냉장고 옆에 있어요' — de är där borta vid sidan om kylen.", "fi": "Jimin sanoi '저기 냉장고 옆에 있어요' — ne ovat tuolla jääkaapin vieressä.", "ja": "ジミンが「저기 냉장고 옆에 있어요」と言いました — あそこの冷蔵庫の横にあります。", "zh-CN": "智敏说\"저기 냉장고 옆에 있어요\"——就在那边冰箱旁边。"}}, {"id": 2, "type": "vocabulary", "questionAudio": "'얼마예요?'는 언제 써요?", "questionTrans": {"en": "When do you use '얼마예요?'?", "de": "Wann benutzt man '얼마예요?'?", "fr": "Quand utilise-t-on '얼마예요?' ?", "es": "¿Cuándo se usa '얼마예요?'?", "pl": "Kiedy używa się '얼마예요?'?", "it": "Quando si usa '얼마예요?'?", "sv": "När används '얼마예요?'?", "fi": "Milloin käytetään '얼마예요?'?", "ja": "「얼마예요?」はいつ使いますか？", "zh-CN": "\"얼마예요?\"什么时候用？"}, "options": [{"text": "1) 물건을 찾을 때", "trans": {"en": "when looking for an item", "de": "wenn man etwas sucht", "fr": "quand on cherche un article", "es": "cuando busca un artículo", "pl": "gdy szuka się produktu", "it": "quando si cerca un articolo", "sv": "när man letar efter en vara", "fi": "kun etsii tuotetta", "ja": "物を探すとき", "zh-CN": "找东西的时候"}}, {"text": "2) 가격을 물어볼 때", "trans": {"en": "when asking the price", "de": "wenn man nach dem Preis fragt", "fr": "quand on demande le prix", "es": "cuando se pregunta el precio", "pl": "gdy pyta się o cenę", "it": "quando si chiede il prezzo", "sv": "när man frågar om priset", "fi": "kun kysytään hintaa", "ja": "値段を聞くとき", "zh-CN": "问价格的时候"}}, {"text": "3) 계산할 때", "trans": {"en": "when paying", "de": "beim Bezahlen", "fr": "quand on paie", "es": "cuando se paga", "pl": "gdy się płaci", "it": "quando si paga", "sv": "när man betalar", "fi": "kun maksetaan", "ja": "支払うとき", "zh-CN": "结账的时候"}}, {"text": "4) 인사할 때", "trans": {"en": "when greeting", "de": "beim Begrüßen", "fr": "quand on se salue", "es": "cuando se saluda", "pl": "gdy się wita", "it": "quando si saluta", "sv": "när man hälsar", "fi": "kun tervehditään", "ja": "挨拶するとき", "zh-CN": "打招呼的时候"}}], "answer": 1, "explanation": {"en": "'얼마예요?' means 'How much is it?' — used to ask the price of something.", "de": "'얼마예요?' bedeutet 'Wie viel kostet es?' — wird verwendet, um nach dem Preis zu fragen.", "fr": "'얼마예요?' signifie 'Combien ça coûte ?' — utilisé pour demander le prix de quelque chose.", "es": "'얼마예요?' significa '¿Cuánto cuesta?' — se usa para preguntar el precio.", "pl": "'얼마예요?' znaczy 'Ile to kosztuje?' — używa się, gdy pyta o cenę.", "it": "'얼마예요?' significa 'Quanto costa?' — si usa per chiedere il prezzo.", "sv": "'얼마예요?' betyder 'Hur mycket kostar det?' — används för att fråga om priset.", "fi": "'얼마예요?' tarkoittaa 'Paljonko se maksaa?' — käytetään hinnan kysymiseen.", "ja": "「얼마예요?」は「いくらですか？」という意味です。値段を聞くときに使います。", "zh-CN": "얼마예요?\"是\"多少钱？\"的意思，用来问价格。\""}}, {"id": 3, "type": "comprehension", "questionAudio": "수미는 어떻게 계산했어요?", "questionTrans": {"en": "How did Sumi pay?", "de": "Wie hat Sumi bezahlt?", "fr": "Comment Sumi a-t-elle payé ?", "es": "¿Cómo pagó Sumi?", "pl": "Jak Sumi zapłaciła?", "it": "Come ha pagato Sumi?", "sv": "Hur betalade Sumi?", "fi": "Miten Sumi maksoi?", "ja": "スミはどうやって払いましたか？", "zh-CN": "秀美怎么付款的？"}, "options": [{"text": "1) 현금으로", "trans": {"en": "with cash", "de": "mit Bargeld", "fr": "en espèces", "es": "en efectivo", "pl": "gotówką", "it": "in contanti", "sv": "med kontanter", "fi": "käteisellä", "ja": "現金で", "zh-CN": "用现金"}}, {"text": "2) 포인트 카드로", "trans": {"en": "with a point card", "de": "mit einer Punktekarte", "fr": "avec une carte de fidélité", "es": "con tarjeta de puntos", "pl": "kartą punktową", "it": "con una carta punti", "sv": "med ett poängkort", "fi": "pistekorttia käyttäen", "ja": "ポイントカードで", "zh-CN": "用积分卡"}}, {"text": "3) 카드로", "trans": {"en": "by card", "de": "mit Karte", "fr": "par carte", "es": "con tarjeta", "pl": "kartą", "it": "con carta", "sv": "med kort", "fi": "kortilla", "ja": "カードで", "zh-CN": "用卡"}}, {"text": "4) 폰으로", "trans": {"en": "with phone payment", "de": "per Handy-Zahlung", "fr": "par paiement téléphonique", "es": "con pago por teléfono", "pl": "płatnością telefoniczną", "it": "con pagamento via telefono", "sv": "med mobilbetalning", "fi": "puhelinmaksulla", "ja": "スマホで", "zh-CN": "用手机支付"}}], "answer": 2, "explanation": {"en": "Sumi said '카드로 계산할게요' — I'll pay by card.", "de": "Sumi sagte '카드로 계산할게요' — ich zahle mit Karte.", "fr": "Sumi a dit '카드로 계산할게요' — je paie par carte.", "es": "Sumi dijo '카드로 계산할게요' — pagaré con tarjeta.", "pl": "Sumi powiedziała '카드로 계산할게요' — zapłacę kartą.", "it": "Sumi ha detto '카드로 계산할게요' — pago con carta.", "sv": "Sumi sa '카드로 계산할게요' — jag betalar med kort.", "fi": "Sumi sanoi '카드로 계산할게요' — maksan kortilla.", "ja": "スミが「카드로 계산할게요」と言いました — カードで払います。", "zh-CN": "秀美说\"카드로 계산할게요\"——我用卡付款。"}}]},
  29: {"id": 29, "title": "29. 계절과 날씨 활동", "titleTrans": {"en": "29. Seasons and Weather Activities", "de": "29. Jahreszeiten und Wetteraktivitäten", "fr": "29. Saisons et activités météo", "es": "29. Estaciones y actividades según el clima", "pl": "29. Pory roku i aktywności pogodowe", "it": "29. Stagioni e attività meteo", "sv": "29. Årstider och väderaktiviteter", "fi": "29. Vuodenajat ja säätoiminnot", "ja": "29. 季節と天気の活動", "zh-CN": "29. 季节与天气活动"}, "desc": "계절과 날씨에 맞는 활동에 대해 이야기하는 대화를 연습합니다. 봄, 여름, 가을, 겨울 활동을 표현해 보세요.", "descTrans": {"en": "Practice conversations about activities for each season. Express spring, summer, autumn, and winter activities.", "de": "Üben Sie Gespräche über Aktivitäten für jede Jahreszeit.", "fr": "Entraînez-vous aux conversations sur les activités de chaque saison.", "es": "Practica conversaciones sobre actividades de cada estación.", "pl": "Ćwicz rozmowy o aktywnościach w każdej porze roku.", "it": "Esercitati nelle conversazioni sulle attività di ogni stagione.", "sv": "Öva på samtal om aktiviteter för varje årstid.", "fi": "Harjoittele jokaiseen vuodenaikaan sopivia toimintoja.", "ja": "季節ごとの活動について話す会話を練習します。", "zh-CN": "练习关于每个季节活动的对话。"}, "dialogue": [{"speaker": "수미", "text": "지민아, 요즘 날씨 어때?", "trans": {"en": "Jimin, how's the weather lately?", "de": "Jimin, wie ist das Wetter zurzeit?", "fr": "Jimin, comment est le temps ces derniers temps ?", "es": "Jimin, ¿cómo está el tiempo últimamente?", "pl": "Jimin, jak jest ostatnio pogoda?", "it": "Jimin, com'è il tempo ultimamente?", "sv": "Jimin, hur är vädret nuförtiden?", "fi": "Jimin, minkälainen sää on viime aikoina?", "ja": "ジミン、最近天気どう？", "zh-CN": "智敏，最近天气怎么样？"}}, {"speaker": "지민", "text": "많이 추워졌어. 겨울이 됐나봐.", "trans": {"en": "It got a lot colder. Looks like winter has come.", "de": "Es ist viel kälter geworden. Es scheint Winter zu sein.", "fr": "Il fait beaucoup plus froid. On dirait que l'hiver est arrivé.", "es": "Ha hecho mucho más frío. Parece que ya llegó el invierno.", "pl": "Bardzo się ochłodziło. Chyba zima przyszła.", "it": "È diventato molto più freddo. Sembra arrivato l'inverno.", "sv": "Det har blivit mycket kallare. Det ser ut som att vintern kommit.", "fi": "On tullut paljon kylmemmäksi. Näyttää siltä että talvi on tullut.", "ja": "だいぶ寒くなった。冬になったみたい。", "zh-CN": "变冷多了。好像冬天来了。"}}, {"speaker": "수미", "text": "맞아, 눈도 올 것 같아. 좋아?", "trans": {"en": "Right, it might snow too. Do you like it?", "de": "Stimmt, es könnte auch schneien. Magst du es?", "fr": "Oui, il pourrait neiger aussi. Tu aimes ça ?", "es": "Exacto, quizás también nieve. ¿Te gusta?", "pl": "Racja, może też spaść śnieg. Lubisz to?", "it": "Esatto, potrebbe anche nevicare. Ti piace?", "sv": "Ja, det kanske snöar också. Gillar du det?", "fi": "Niin, saattaa sataa lumistakin. Pidätkö siitä?", "ja": "そう、雪も降りそう。好き？", "zh-CN": "对，好像也要下雪了。你喜欢吗？"}}, {"speaker": "지민", "text": "응! 겨울에 스키 타는 거 좋아해.", "trans": {"en": "Yes! I like skiing in winter.", "de": "Ja! Ich mag Skifahren im Winter.", "fr": "Oui ! J'aime faire du ski en hiver.", "es": "¡Sí! Me gusta esquiar en invierno.", "pl": "Tak! Lubię jeździć na nartach zimą.", "it": "Sì! Mi piace sciare in inverno.", "sv": "Ja! Jag gillar att åka skidor på vintern.", "fi": "Kyllä! Pidän hiihtämisestä talvella.", "ja": "うん！冬にスキーするのが好き。", "zh-CN": "嗯！我喜欢冬天滑雪。"}}, {"speaker": "수미", "text": "나는 봄이 제일 좋아. 따뜻하고 꽃도 피잖아.", "trans": {"en": "I like spring the best. It's warm and flowers bloom.", "de": "Ich mag den Frühling am liebsten. Es ist warm und Blumen blühen.", "fr": "Je préfère le printemps. Il fait chaud et les fleurs fleurissent.", "es": "A mí me gusta más la primavera. Hace calor y florecen las flores.", "pl": "Lubię najbardziej wiosnę. Jest ciepło i kwitną kwiaty.", "it": "Amo di più la primavera. È caldo e i fiori sbocciano.", "sv": "Jag gillar våren bäst. Det är varmt och blommor blommar.", "fi": "Pidän eniten keväästä. On lämmin ja kukat kukkivat.", "ja": "私は春が一番好き。暖かくて花も咲くじゃない。", "zh-CN": "我最喜欢春天。暖暖的，花也开了。"}}, {"speaker": "지민", "text": "맞아. 봄에 소풍 가는 것도 좋아.", "trans": {"en": "Right. I also like going on picnics in spring.", "de": "Stimmt. Im Frühling auf ein Picknick zu gehen mag ich auch.", "fr": "Oui. J'aime aussi faire des pique-niques au printemps.", "es": "Exacto. También me gustan los picnics en primavera.", "pl": "Racja. Lubię też wycieczki na pikniku wiosną.", "it": "Esatto. Mi piace anche fare picnic in primavera.", "sv": "Ja. Jag gillar också att ha picknick på våren.", "fi": "Niin. Pidän myös retkistä keväällä.", "ja": "そうだね。春にピクニックに行くのも好き。", "zh-CN": "对。春天去郊游也很好。"}}, {"speaker": "수미", "text": "이번 봄에 같이 소풍 가자!", "trans": {"en": "Let's go on a picnic together this spring!", "de": "Lass uns diesen Frühling zusammen picknicken!", "fr": "Allons faire un pique-nique ensemble ce printemps !", "es": "¡Vamos a hacer un picnic juntos esta primavera!", "pl": "Chodźmy razem na piknik tej wiosny!", "it": "Andiamo a fare un picnic insieme questa primavera!", "sv": "Låt oss ha picknick tillsammans i vår!", "fi": "Mennään yhdessä retkelle tänä keväänä!", "ja": "今春一緒にピクニックに行こう！", "zh-CN": "今年春天我们一起去郊游吧！"}}], "vocab": [{"word": "날씨", "trans": {"en": "weather", "de": "Wetter", "fr": "météo / temps", "es": "tiempo / clima", "pl": "pogoda", "it": "tempo / meteo", "sv": "väder", "fi": "sää", "ja": "天気", "zh-CN": "天气"}}, {"word": "계절", "trans": {"en": "season", "de": "Jahreszeit", "fr": "saison", "es": "estación", "pl": "pora roku", "it": "stagione", "sv": "årstid", "fi": "vuodenaika", "ja": "季節", "zh-CN": "季节"}}, {"word": "춥다", "trans": {"en": "to be cold", "de": "kalt sein", "fr": "avoir froid / être froid", "es": "hacer frío", "pl": "być zimnym", "it": "fare freddo", "sv": "vara kallt", "fi": "olla kylmä", "ja": "寒い", "zh-CN": "冷"}}, {"word": "눈", "trans": {"en": "snow", "de": "Schnee", "fr": "neige", "es": "nieve", "pl": "śnieg", "it": "neve", "sv": "snö", "fi": "lumi", "ja": "雪", "zh-CN": "雪"}}, {"word": "스키", "trans": {"en": "skiing / ski", "de": "Ski fahren", "fr": "ski", "es": "esquí", "pl": "narty", "it": "sci", "sv": "skidåkning", "fi": "hiihto", "ja": "スキー", "zh-CN": "滑雪"}}, {"word": "봄", "trans": {"en": "spring", "de": "Frühling", "fr": "printemps", "es": "primavera", "pl": "wiosna", "it": "primavera", "sv": "vår", "fi": "kevät", "ja": "春", "zh-CN": "春天"}}, {"word": "따뜻하다", "trans": {"en": "to be warm", "de": "warm sein", "fr": "être chaud", "es": "ser cálido", "pl": "być ciepłym", "it": "essere caldo", "sv": "vara varmt", "fi": "olla lämmin", "ja": "暖かい", "zh-CN": "暖和"}}, {"word": "꽃", "trans": {"en": "flower", "de": "Blume", "fr": "fleur", "es": "flor", "pl": "kwiat", "it": "fiore", "sv": "blomma", "fi": "kukka", "ja": "花", "zh-CN": "花"}}, {"word": "소풍", "trans": {"en": "picnic / outing", "de": "Ausflug / Picknick", "fr": "pique-nique / sortie", "es": "picnic / excursión", "pl": "piknik / wycieczka", "it": "picnic / gita", "sv": "picknick / utflykt", "fi": "retki / piknik", "ja": "ピクニック/遠足", "zh-CN": "郊游/野餐"}}], "patterns": [{"pattern": "~(아/어)졌어", "patternTrans": {"en": "It became ~ / It got ~", "de": "Es wurde ~", "fr": "C'est devenu ~", "es": "Se puso ~", "pl": "Stało się ~", "it": "È diventato ~", "sv": "Det blev ~", "fi": "Siitä tuli ~", "ja": "～くなった", "zh-CN": "变～了"}, "example": "많이 추워졌어.", "trans": {"en": "It got a lot colder.", "de": "Es ist viel kälter geworden.", "fr": "Il fait beaucoup plus froid.", "es": "Ha hecho mucho más frío.", "pl": "Bardzo się ochłodziło.", "it": "È diventato molto più freddo.", "sv": "Det har blivit mycket kallare.", "fi": "On tullut paljon kylmemmäksi.", "ja": "だいぶ寒くなった。", "zh-CN": "变冷多了。"}}, {"pattern": "~이/가 제일 좋아", "patternTrans": {"en": "I like ~ the best", "de": "Ich mag ~ am liebsten", "fr": "Je préfère ~", "es": "Me gusta ~ más que nada", "pl": "Najbardziej lubię ~", "it": "Amo di più ~", "sv": "Jag gillar ~ bäst", "fi": "Pidän ~ eniten", "ja": "～が一番好き", "zh-CN": "最喜欢～"}, "example": "나는 봄이 제일 좋아.", "trans": {"en": "I like spring the best.", "de": "Ich mag den Frühling am liebsten.", "fr": "Je préfère le pri ": "winter", "de": "Winter", "fr": "hiver", "es": "invierno", "pl": "zima", "it": "inverno", "sv": "vinter", "fi": "talvi", "ja": "冬", "zh-CN": "冬天"}}], "answer": 3, "explanation": {"en": "Jimin said '겨울에 스키 타는 거 좋아해' — I like skiing in winter.", "de": "Jimin sagte '겨울에 스키 타는 거 좋아해' — ich mag Skifahren im Winter.", "fr": "Jimin a dit '겨울에 스키 타는 거 좋아해' — j'aime faire du ski en hiver.", "es": "Jimin dijo '겨울에 스키 타는 거 좋아해' — me gusta esquiar en invierno.", "pl": "Jimin powiedział '겨울에 스키 타는 거 좋아해' — lubię jeździć na nartach zimą.", "it": "Jimin ha detto '겨울에 스키 타는 거 좋아해' — mi piace sciare in inverno.", "sv": "Jimin sa '겨울에 스키 타는 거 좋아해' — jag gillar att åka skidor på vintern.", "fi": "Jimin sanoi '겨울에 스키 타는 거 좋아해' — pidän hiihtämisestä talvella.", "ja": "ジミンが「겨울에 스키 타는 거 좋아해」と言いました — 冬にスキーするのが好き。", "zh-CN": "智敏说\"겨울에 스키 타는 거 좋아해\"——我喜欢冬天滑雪。"}}, {"id": 2, "type": "vocabulary", "questionAudio": "'따뜻하다'는 무슨 뜻이에요?", "questionTrans": {"en": "What does '따뜻하다' mean?", "de": "Was bedeutet '따뜻하다'?", "fr": "Que signifie '따뜻하다' ?", "es": "¿Qué significa '따뜻하다'?", "pl": "Co znaczy '따뜻하다'?", "it": "Cosa significa '따뜻하다'?", "sv": "Vad betyder '따뜻하다'?", "fi": "Mitä '따뜻하다' tarkoittaa?", "ja": "「따뜻하다」はどういう意味ですか？", "zh-CN": "\"따뜻하다\"是什么意思？"}, "options": [{"text": "1) 따뜻하다 — warm", "trans": {"en": "to be warm", "de": "warm sein", "fr": "être chaud", "es": "ser cálido", "pl": "być ciepłym", "it": "essere caldo", "sv": "vara varmt", "fi": "olla lämmin", "ja": "暖かい", "zh-CN": "暖和"}}, {"text": "2) 춥다", "trans": {"en": "to be cold", "de": "kalt sein", "fr": "avoir froid", "es": "hacer frío", "pl": "być zimnym", "it": "fare freddo", "sv": "vara kallt", "fi": "olla kylmä", "ja": "寒い", "zh-CN": "冷"}}, {"text": "3) 흐리다", "trans": {"en": "to be cloudy", "de": "bewölkt sein", "fr": "être nuageux", "es": "estar nublado", "pl": "być pochmurnym", "it": "essere nuvoloso", "sv": "vara molnigt", "fi": "olla pilvistä", "ja": "曇っている", "zh-CN": "阴天"}}, {"text": "4) 습하다", "trans": {"en": "to be humid", "de": "feucht sein", "fr": "être humide", "es": "ser húmedo", "pl": "być wilgotnym", "it": "essere umido", "sv": "vara fuktigt", "fi": "olla kosteaa", "ja": "湿っている", "zh-CN": "潮湿"}}], "answer": 0, "explanation": {"en": "'따뜻하다' means 'to be warm'. Sumi said spring is warm and flowers bloom.", "de": "'따뜻하다' bedeutet 'warm sein'. Sumi sagte, der Frühling ist warm und Blumen blühen.", "fr": "'따뜻하다' signifie 'être chaud'. Sumi a dit que le printemps est chaud et que les fleurs fleurissent.", "es": "'따뜻하다' significa 'ser cálido'. Sumi dijo que la primavera es cálida y las flores florecen.", "pl": "'따뜻하다' oznacza 'być ciepłym'. Sumi powiedziała, że wiosna jest ciepła i kwitną kwiaty.", "it": "'따뜻하다' significa 'essere caldo'. Sumi ha detto che la primavera è calda e i fiori sbocciano.", "sv": "'따뜻하다' betyder 'vara varmt'. Sumi sa att våren är varm och att blommor blommar.", "fi": "'따뜻하다' tarkoittaa 'olla lämmin'. Sumi sanoi, että kevät on lämmin ja kukat kukkivat.", "ja": "「따뜻하다」は「暖かい」という意味です。スミは春は暖かくて花も咲くと言いました。", "zh-CN": "따뜻하다\"是\"暖和\"的意思。秀美说春天暖和，花也开了。\""}}, {"id": 3, "type": "comprehension", "questionAudio": "두 사람은 무엇을 같이 하기로 했어요?", "questionTrans": {"en": "What did the two of them decide to do together?", "de": "Was haben die beiden beschlossen zusammen zu machen?", "fr": "Qu'ont décidé de faire ensemble les deux ?", "es": "¿Qué decidieron hacer juntos los dos?", "pl": "Co postanowili zrobić razem?", "it": "Cosa hanno deciso di fare insieme i due?", "sv": "Vad bestämde de två att göra tillsammans?", "fi": "Mitä he kaksi päättivät tehdä yhdessä?", "ja": "二人は一緒に何をすることにしましたか？", "zh-CN": "两人决定一起做什么？"}, "options": [{"text": "1) 스키 타기", "trans": {"en": "go skiing", "de": "Ski fahren", "fr": "faire du ski", "es": "esquiar", "pl": "jeździć na nartach", "it": "sciare", "sv": "åka skidor", "fi": "hiihto", "ja": "スキーをする", "zh-CN": "滑雪"}}, {"text": "2) 소풍 가기", "trans": {"en": "go on a picnic", "de": "picknicken", "fr": "faire un pique-nique", "es": "ir de picnic", "pl": "iść na piknik", "it": "fare un picnic", "sv": "ha picknick", "fi": "mennä retkelle", "ja": "ピクニックに行く", "zh-CN": "去郊游"}}, {"text": "3) 눈 구경하기", "trans": {"en": "watch snow", "de": "Schnee anschauen", "fr": "regarder la neige", "es": "ver la nieve", "pl": "oglądać śnieg", "it": "guardare la neve", "sv": "titta på snön", "fi": "katsoa lunta", "ja": "雪を見る", "zh-CN": "看雪"}}, {"text": "4) 꽃 사기", "trans": {"en": "buy flowers", "de": "Blumen kaufen", "fr": "acheter des fleurs", "es": "comprar flores", "pl": "kupować kwiaty", "it": "comprare fiori", "sv": "köpa blommor", "fi": "ostaa kukkia", "ja": "花を買う", "zh-CN": "买花"}}], "answer": 1, "explanation": {"en": "Sumi said '이번 봄에 같이 소풍 가자!' — let's go on a picnic together this spring!", "de": "Sumi sagte '이번 봄에 같이 소풍 가자!' — lass uns diesen Frühling zusammen picknicken!", "fr": "Sumi a dit '이번 봄에 같이 소풍 가자!' — allons faire un pique-nique ensemble ce printemps!", "es": "Sumi dijo '이번 봄에 같이 소풍 가자!' — ¡vamos de picnic juntos esta primavera!", "pl": "Sumi powiedziała '이번 봄에 같이 소풍 가자!' — chodźmy razem na piknik tej wiosny!", "it": "Sumi ha detto '이번 봄에 같이 소풍 가자!' — andiamo a fare un picnic insieme questa primavera!", "sv": "Sumi sa '이번 봄에 같이 소풍 가자!' — låt oss ha picknick tillsammans i vår!", "fi": "Sumi sanoi '이번 봄에 같이 소풍 가자!' — mennään yhdessä retkelle tänä keväänä!", "ja": "スミが「이번 봄에 같이 소풍 가자!」と言いました — 今春一緒にピクニックに行こう！", "zh-CN": "秀美说\"이번 봄에 같이 소풍 가자!\"——今年春天我们一起去郊游吧！"}}]},
  30: {"id": 30, "title": "30. 한국 음식 설명하기", "titleTrans": {"en": "30. Describing Korean Food", "de": "30. Koreanisches Essen beschreiben", "fr": "30. Décrire la nourriture coréenne", "es": "30. Describir la comida coreana", "pl": "30. Opisywanie koreańskiego jedzenia", "it": "30. Descrivere il cibo coreano", "sv": "30. Beskriva koreansk mat", "fi": "30. Korealaisen ruoan kuvaileminen", "ja": "30. 韓国料理を説明する", "zh-CN": "30. 介绍韩国料理"}, "desc": "한국 음식을 설명하고 추천하는 대화를 연습합니다. 맛, 재료, 먹는 방법에 대해 이야기해 보세요.", "descTrans": {"en": "Practice conversations describing and recommending Korean food. Talk about taste, ingredients, and how to eat it.", "de": "Üben Sie Gespräche, in denen koreanisches Essen beschrieben und empfohlen wird. Sprechen Sie über Geschmack, Zutaten und wie man es isst.", "fr": "Entraînez-vous aux conversations pour décrire et recommander la cuisine coréenne. Parlez du goût, des ingrédients et de la façon de le manger.", "es": "Practica conversaciones describiendo y recomendando comida coreana. Habla del sabor, los ingredientes y cómo comerla.", "pl": "Ćwicz rozmowy opisując i polecając koreańskie jedzenie. Rozmawiaj o smaku, składnikach i sposobie jedzenia.", "it": "Esercitati nelle conversazioni per descrivere e consigliare il cibo coreano. Parla di gusto, ingredienti e come mangiarlo.", "sv": "Öva på samtal för att beskriva och rekommendera koreansk mat. Prata om smak, ingredienser och hur man äter den.", "fi": "Harjoittele korealaisen ruoan kuvailusta ja suosittelusta käytäviä keskusteluja. Puhu mausta, ainesosista ja siitä miten sitä syödään.", "ja": "韓国料理を説明したり勧めたりする会話を練習します。味、材料、食べ方について話しましょう。", "zh-CN": "练习介绍和推荐韩国料理的对话。谈论口味、食材和吃法。"}, "dialogue": [{"speaker": "수미", "text": "지민아, 한국 음식 중에 뭐가 제일 맛있어?", "trans": {"en": "Jimin, which Korean food tastes the best?", "de": "Jimin, welches koreanische Gericht schmeckt am besten?", "fr": "Jimin, quel plat coréen est le meilleur ?", "es": "Jimin, ¿qué comida coreana está más rica?", "pl": "Jimin, które koreańskie jedzenie jest najlepsze?", "it": "Jimin, quale cibo coreano è più buono?", "sv": "Jimin, vilket koreanskt matgods smakar bäst?", "fi": "Jimin, mikä korealainen ruoka maistuu parhaiten?", "ja": "ジミン、韓国料理の中で何が一番おいしい？", "zh-CN": "智敏，韩国料理里哪个最好吃？"}}, {"speaker": "지민", "text": "나는 삼겹살이 제일 좋아. 구워서 먹으면 정말 맛있어.", "trans": {"en": "I like samgyeopsal the best. It's really delicious when you grill and eat it.", "de": "Ich mag Samgyeopsal am liebsten. Es schmeckt wirklich lecker, wenn man es grillt.", "fr": "Je préfère le samgyeopsal. C'est vraiment délicieux quand on le grille.", "es": "A mí me gusta más el samgyeopsal. Está riquísimo cuando se asa.", "pl": "Najbardziej lubię samgyeopsal. Jest naprawdę smaczne, kiedy się je grilluje.", "it": "Amo di più il samgyeopsal. È davvero delizioso quando lo si griglia.", "sv": "Jag gillar samgyeopsal bäst. Det är verkligen gott när man grillar och äter det.", "fi": "Pidän eniten samgyeopsalista. Se on todella herkullista grillattuna.", "ja": "私はサムギョプサルが一番好き。焼いて食べると本当においしい。", "zh-CN": "我最喜欢五花肉。烤着吃真的很好吃。"}}, {"speaker": "수미", "text": "맞아! 김치랑 같이 먹으면 더 맛있어.", "trans": {"en": "Right! It's even more delicious when you eat it with kimchi.", "de": "Stimmt! Es schmeckt noch besser, wenn man es mit Kimchi isst.", "fr": "Oui ! C'est encore meilleur avec du kimchi.", "es": "¡Exacto! Está más rico cuando se come con kimchi.", "pl": "Racja! Jest jeszcze smaczniejsze z kimchi.", "it": "Esatto! È ancora più buono quando si mangia con il kimchi.", "sv": "Ja! Det smakar ännu godare när man äter det med kimchi.", "fi": "Niin! Se on vielä herkullisempaa kimchin kanssa.", "ja": "そうだよ！キムチと一緒に食べるともっとおいしい。", "zh-CN": "对！和泡菜一起吃更好吃。"}}, {"speaker": "지민", "text": "비빔밥도 건강에 좋아. 채소가 많이 들어가.", "trans": {"en": "Bibimbap is also good for health. It has a lot of vegetables.", "de": "Bibimbap ist auch gesund. Es enthält viele Gemüse.", "fr": "Le bibimbap est aussi bon pour la santé. Il y a beaucoup de légumes.", "es": "El bibimbap también es bueno para la salud. Tiene muchas verduras.", "pl": "Bibimbap też jest zdrowe. Ma dużo warzyw.", "it": "Il bibimbap è anche salutare. Ha molte verdure.", "sv": "Bibimbap är också bra för hälsan. Det innehåller mycket grönsaker.", "fi": "Bibimbap on myös terveellistä. Siinä on paljon kasviksia.", "ja": "ビビンバも健康にいい。野菜がたくさん入っている。", "zh-CN": "拌饭也对健康好。里面有很多蔬菜。"}}, {"speaker": "수미", "text": "맞아, 참기름도 넣고 쭉 비벼서 먹으면 돼.", "trans": {"en": "Right, you add sesame oil and mix it all together.", "de": "Stimmt, man gibt Sesamöl dazu und mischt alles gut.", "fr": "Oui, on ajoute de l'huile de sésame et on mélange bien.", "es": "Exacto, se le añade aceite de sésamo y se mezcla bien.", "pl": "Racja, dodaje się olej sezamowy i dobrze miesza.", "it": "Esatto, si aggiunge olio di sesamo e si mescola bene.", "sv": "Ja, man lägger till sesamolja och blandar allt.", "fi": "Niin, lisätään seesamiöljyä ja sekoitetaan kunnolla.", "ja": "そうだよ、ごま油も入れてよく混ぜて食べればいい。", "zh-CN": "对，加点芝麻油，搅拌均匀吃就好。"}}, {"speaker": "지민", "text": "외국 친구한테 어떤 음식을 추천해 줄 거야?", "trans": {"en": "What food will you recommend to a foreign friend?", "de": "Welches Essen würdest du einem ausländischen Freund empfehlen?", "fr": "Quel plat recommanderais-tu à un ami étranger ?", "es": "¿Qué comida le recomendarías a un amigo extranjero?", "pl": "Jakie jedzenie polecisz zagranicznemu przyjacielowi?", "it": "Che cibo consiglieresti a un amico straniero?", "sv": "Vilket mat rekommenderar du till en utländsk vän?", "fi": "Mitä ruokaa suosittelisit ulkomaalaiselle ystävälle?", "ja": "外国の友達にどんな料理を勧める？", "zh-CN": "你会给外国朋友推荐什么食物？"}}, {"speaker": "수미", "text": "떡볶이! 달콤하고 매콤해서 처음 먹어도 좋아할 거야.", "trans": {"en": "Tteokbokki! It's sweet and spicy so even first-timers will like it.", "de": "Tteokbokki! Es ist süß und würzig, also werden es auch Erstesser mögen.", "fr": "Le tteokbokki ! C'est sucré et épicé, donc même les novices l'aimeront.", "es": "¡El tteokbokki! Es dulce y picante, así que incluso los que lo prueban por primera vez lo amarán.", "pl": "Tteokbokki! Jest słodko-pikantne, więc nawet ci, którzy jedzą po raz pierwszy, polubią je.", "it": "Il tteokbokki! È dolce e piccante, quindi anche chi lo mangia per la prima volta lo amerà.", "sv": "Tteokbokki! Det är sött och kryddigt så även nybörjare kommer att gilla det.", "fi": "Tteokbokki! Se on makeaa ja mausteista, joten jopa ensikertalaiset pitävät siitä.", "ja": "トッポッキ！甘くて辛くて、初めて食べても好きになると思う。", "zh-CN": "炒年糕！甜辣的，第一次吃也会喜欢的。"}}], "vocab": [{"word": "맛있다", "trans": {"en": "to be delicious", "de": "lecker sein", "fr": "être délicieux", "es": "estar delicioso", "pl": "być smacznym", "it": "essere delizioso", "sv": "vara gott", "fi": "olla maukasta", "ja": "おいしい", "zh-CN": "好吃"}}, {"word": "굽다", "trans": {"en": "to grill / roast", "de": "grillen / braten", "fr": "griller / rôtir", "es": "asar / grillar", "pl": "grillować / piec", "it": "grigliare / arrostire", "sv": "grilla / rosta", "fi": "grillata / paahtaa", "ja": "焼く", "zh-CN": "烤"}}, {"word": "채소", "trans": {"en": "vegetable", "de": "Gemüse", "fr": "légume", "es": "verdura / vegetal", "pl": "warzywo", "it": "verdura", "sv": "grönsak", "fi": "kasvikset", "ja": "野菜", "zh-CN": "蔬菜"}}, {"word": "건강에 좋다", "trans": {"en": "to be good for health", "de": "gesund sein", "fr": "être bon pour la santé", "es": "ser bueno para la salud", "pl": "być zdrowym", "it": "fare bene alla salute", "sv": "vara hälsosamt", "fi": "olla terveellistä", "ja": "健康に良い", "zh-CN": "对健康好"}}, {"word": "참기름", "trans": {"en": "sesame oil", "de": "Sesamöl", "fr": "huile de sésame", "es": "aceite de sésamo", "pl": "olej sezamowy", "it": "olio di sesamo", "sv": "sesamolja", "fi": "seesamiöljy", "ja": "ごま油", "zh-CN": "芝麻油"}}, {"word": "비비다", "trans": {"en": "to mix / stir", "de": "mischen / rühren", "fr": "mélanger", "es": "mezclar", "pl": "mieszać", "it": "mescolare", "sv": "blanda", "fi": "sekoittaa", "ja": "混ぜる", "zh-CN": "搅拌/混合"}}, {"word": "추천하다", "trans": {"en": "to recommend", "de": "empfehlen", "fr": "recommander", "es": "recomendar", "pl": "polecać", "it":
