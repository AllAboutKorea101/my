on allait au bord de la rivière Han pour un pique-nique?", "es": "¿Qué tal ir al río Han para un picnic?", "pl": "Co powiesz na wycieczkę nad rzekę Han na piknik?", "it": "Che ne dici di andare al fiume Han per un picnic?", "sv": "Vad sägs om att åka till Hanfloden för en picknick?", "fi": "Entä mennä Han-joelle piknikille?", "ja": "漢江に行ってピクニックはどう？", "zh-CN": "去汉江野餐怎么样？"}}, {"pattern": "N 가져올게", "patternTrans": {"en": "I'll bring N", "de": "Ich bringe N mit", "fr": "J'apporterai N", "es": "Traeré N", "pl": "Przyniosę N", "it": "Porto N", "sv": "Jag tar med N", "fi": "Tuon N", "ja": "Nを持ってくるよ", "zh-CN": "我带N来"}, "example": "음식이랑 음료수 가져올게.", "trans": {"en": "I'll bring food and drinks.", "de": "Ich bringe Essen und Getränke mit.", "fr": "J'apporterai de la nourriture et des boissons.", "es": "Traeré comida y bebidas.", "pl": "Przyniosę jedzenie i napoje.", "it": "Porto del cibo e delle bevande.", "sv": "Jag tar med mat och dryck.", "fi": "Tuon ruokaa ja juomia.", "ja": "食べ物と飲み物を持ってくるよ。", "zh-CN": "我带食物和饮料来。"}}], "quizzes": [{"id": 1, "type": "comprehension", "questionAudio": "두 사람은 어디에서 만나요?", "questionTrans": {"en": "Where are the two people meeting?", "de": "Wo treffen sich die beiden?", "fr": "Où se retrouvent les deux personnes?", "es": "¿Dónde se encuentran las dos personas?", "pl": "Gdzie spotykają się te dwie osoby?", "it": "Dove si incontrano le due persone?", "sv": "Var träffas de två personerna?", "fi": "Missä kaksi henkilöä tapaavat?", "ja": "二人はどこで会いますか？", "zh-CN": "两个人在哪里见面？"}, "options": [{"text": "1) 지하철역 앞", "trans": {"en": "In front of the subway station", "de": "Vor der U-Bahnstation", "fr": "Devant la station de métro", "es": "Delante de la estación de metro", "pl": "Przed stacją metra", "it": "Davanti alla stazione della metropolitana", "sv": "Framför tunnelbanestationen", "fi": "Metroaseman edessä", "ja": "地下鉄の駅の前", "zh-CN": "地铁站前"}}, {"text": "2) 한강 다리 위", "trans": {"en": "On the Han River bridge", "de": "Auf der Han-Flussbrücke", "fr": "Sur le pont de la rivière Han", "es": "Sobre el puente del río Han", "pl": "Na moście nad rzeką Han", "it": "Sul ponte del fiume Han", "sv": "På Hanflodens bro", "fi": "Han-joen sillalla", "ja": "漢江の橋の上", "zh-CN": "汉江桥上"}}, {"text": "3) 수미 집 앞", "trans": {"en": "In front of Sumi's house", "de": "Vor Sumis Haus", "fr": "Devant la maison de Sumi", "es": "Delante de la casa de Sumi", "pl": "Przed domem Sumi", "it": "Davanti alla casa di Sumi", "sv": "Framför Sumis hus", "fi": "Sumin talon edessä", "ja": "スミの家の前", "zh-CN": "수미家门前"}}, {"text": "4) 공원 입구", "trans": {"en": "At the park entrance", "de": "Am Parkeingang", "fr": "À l'entrée du parc", "es": "En la entrada del parque", "pl": "Przy wejściu do parku", "it": "All'ingresso del parco", "sv": "Vid parkens ingång", "fi": "Puiston sisäänkäynnillä", "ja": "公園の入り口", "zh-CN": "公园入口"}}], "answer": 0, "explanation": {"en": "Jimin said '지하철역 앞에서 만나자' (Let's meet in front of the subway station).", "de": "Jimin sagte '지하철역 앞에서 만나자' (Treffen wir uns vor der U-Bahnstation).", "fr": "Jimin a dit '지하철역 앞에서 만나자' (Retrouvons-nous devant la station de métro).", "es": "Jimin dijo '지하철역 앞에서 만나자' (Quedamos delante de la estación de metro).", "pl": "Jimin powiedział '지하철역 앞에서 만나자' (Spotkajmy się przed stacją metra).", "it": "Jimin ha detto '지하철역 앞에서 만나자' (Incontriamoci davanti alla stazione della metropolitana).", "sv": "Jimin sa '지하철역 앞에서 만나자' (Låt oss träffas framför tunnelbanestationen).", "fi": "Jimin sanoi '지하철역 앞에서 만나자' (Tavataan metroaseman edessä).", "ja": "지민は「지하철역 앞에서 만나자」（地下鉄の駅の前で会おう）と言いました。", "zh-CN": "지민说「지하철역 앞에서 만나자」（我们在地铁站前见吧）。"}}, {"id": 2, "type": "vocabulary", "questionAudio": "수미는 무엇을 가져와요?", "questionTrans": {"en": "What is Sumi bringing?", "de": "Was bringt Sumi mit?", "fr": "Qu'est-ce que Sumi apporte?", "es": "¿Qué trae Sumi?", "pl": "Co Sumi przynosi?", "it": "Cosa porta Sumi?", "sv": "Vad tar Sumi med sig?", "fi": "Mitä Sumi tuo?", "ja": "スミは何を持ってきますか？", "zh-CN": "수미带什么来？"}, "options": [{"text": "1) 돗자리랑 우산", "trans": {"en": "A mat and an umbrella", "de": "Eine Decke und einen Regenschirm", "fr": "Un tapis et un parapluie", "es": "Una estera y un paraguas", "pl": "Mata i parasol", "it": "Un tappetino e un ombrello", "sv": "En matta och ett paraply", "fi": "Matto ja sateenvarjo", "ja": "レジャーシートと傘", "zh-CN": "垫子和雨伞"}}, {"text": "2) 음식이랑 음료수", "trans": {"en": "Food and drinks", "de": "Essen und Getränke", "fr": "De la nourriture et des boissons", "es": "Comida y bebidas", "pl": "Jedzenie i napoje", "it": "Cibo e bevande", "sv": "Mat och dryck", "fi": "Ruokaa ja juomia", "ja": "食べ物と飲み物", "zh-CN": "食物和饮料"}}, {"text": "3) 공이랑 배드민턴", "trans": {"en": "A ball and badminton", "de": "Ein Ball und Badminton", "fr": "Un ballon et du badminton", "es": "Una pelota y bádminton", "pl": "Piłka i badminton", "it": "Una palla e il badminton", "sv": "En boll och badminton", "fi": "Pallo ja sulkapallo", "ja": "ボールとバドミントン", "zh-CN": "球和羽毛球"}}, {"text": "4) 카메라랑 담요", "trans": {"en": "A camera and a blanket", "de": "Eine Kamera und eine Decke", "fr": "Un appareil photo et une couverture", "es": "Una cámara y una manta", "pl": "Aparat i koc", "it": "Una fotocamera e una coperta", "sv": "En kamera och en filt", "fi": "Kamera ja peitto", "ja": "カメラと毛布", "zh-CN": "相机和毯子"}}], "answer": 1, "explanation": {"en": "Sumi said '음식이랑 음료수 가져올게' (I'll bring food and drinks).", "de": "Sumi sagte '음식이랑 음료수 가져올게' (Ich bringe Essen und Getränke mit).", "fr": "Sumi a dit '음식이랑 음료수 가져올게' (J'apporterai de la nourriture et des boissons).", "es": "Sumi dijo '음식이랑 음료수 가져올게' (Traeré comida y bebidas).", "pl": "Sumi powiedziała '음식이랑 음료수 가져올게' (Przyniosę jedzenie i napoje).", "it": "Sumi ha detto '음식이랑 음료수 가져올게' (Porto del cibo e delle bevande).", "sv": "Sumi sa '음식이랑 음료수 가져올게' (Jag tar med mat och dryck).", "fi": "Sumi sanoi '음식이랑 음료수 가져올게' (Tuon ruokaa ja juomia).", "ja": "スミは「음식이랑 음료수 가져올게」（食べ物と飲み物を持ってくるよ）と言いました。", "zh-CN": "수미说「음식이랑 음료수 가져올게」（我带食物和饮料来）。"}}, {"id": 3, "type": "detail", "questionAudio": "두 사람은 몇 시에 만나요?", "questionTrans": {"en": "What time are the two meeting?", "de": "Um wie viel Uhr treffen sie sich?", "fr": "À quelle heure se retrouvent-ils?", "es": "¿A qué hora se encuentran los dos?", "pl": "O której spotykają się oboje?", "it": "A che ora si incontrano i due?", "sv": "Vilken tid träffas de två?", "fi": "Mihin aikaan kaksi tapaavat?", "ja": "二人は何時に会いますか？", "zh-CN": "两个人几点见面？"}, "options": [{"text": "1) 오전 11시", "trans": {"en": "11 AM", "de": "11 Uhr", "fr": "11h", "es": "11 AM", "pl": "11:00", "it": "11", "sv": "Kl. 11", "fi": "Klo 11", "ja": "午前11時", "zh-CN": "上午11点"}}, {"text": "2) 오후 1시", "trans": {"en": "1 PM", "de": "13 Uhr", "fr": "13h", "es": "1 PM", "pl": "13:00", "it": "13", "sv": "Kl. 13", "fi": "Klo 13", "ja": "午後1時", "zh-CN": "下午1点"}}, {"text": "3) 오후 3시", "trans": {"en": "3 PM", "de": "15 Uhr", "fr": "15h", "es": "3 PM", "pl": "15:00", "it": "15", "sv": "Kl. 15", "fi": "Klo 15", "ja": "午後3時", "zh-CN": "下午3点"}}, {"text": "4) 오후 2시", "trans": {"en": "2 PM", "de": "14 Uhr", "fr": "14h", "es": "2 PM", "pl": "14:00", "it": "14", "sv": "Kl. 14", "fi": "Klo 14", "ja": "午後2時", "zh-CN": "下午2点"}}], "answer": 3, "explanation": {"en": "Jimin suggested '오후 2시' (2 PM) and Sumi agreed.", "de": "Jimin schlug '오후 2시' (14 Uhr) vor und Sumi stimmte zu.", "fr": "Jimin a suggéré '오후 2시' (14h) et Sumi a accepté.", "es": "Jimin sugirió '오후 2시' (2 PM) y Sumi aceptó.", "pl": "Jimin zaproponował '오후 2시' (14:00) i Sumi zgodziła się.", "it": "Jimin ha suggerito '오후 2시' (14) e Sumi ha accettato.", "sv": "Jimin föreslog '오후 2시' (kl. 14) och Sumi gick med på det.", "fi": "Jimin ehdotti '오후 2시' (klo 14) ja Sumi suostui.", "ja": "지민は「오후 2시」（午後2時）を提案し、수미が同意しました。", "zh-CN": "지민建议「오후 2시」（下午2点），수미同意了。"}}]},
  15: {"id": 15, "title": "15. 음식 배달 주문", "titleTrans": {"en": "15. Ordering Food Delivery", "de": "15. Essen bestellen (Lieferung)", "fr": "15. Commander une livraison de repas", "es": "15. Pedir comida a domicilio", "pl": "15. Zamawianie dostawy jedzenia", "it": "15. Ordinare il cibo a domicilio", "sv": "15. Beställa matleverans", "fi": "15. Ruokatoimituksen tilaaminen", "ja": "15. フードデリバリーの注文", "zh-CN": "15. 订外卖"}, "desc": "음식 배달을 주문하는 대화를 연습합니다. 메뉴 선택, 주소 확인, 배달 시간에 대한 표현을 배워 보세요.", "descTrans": {"en": "Practice conversations for ordering food delivery. Learn expressions for choosing a menu, confirming your address, and delivery time.", "de": "Üben Sie Gespräche für die Bestellung von Essenslieferungen.", "fr": "Entraînez-vous à commander une livraison de repas. Apprenez à choisir le menu, confirmer votre adresse et le délai de livraison.", "es": "Practica conversaciones para pedir comida a domicilio.", "pl": "Ćwicz rozmowy związane z zamawianiem dostawy jedzenia.", "it": "Esercitati nelle conversazioni per ordinare cibo a domicilio.", "sv": "Öva på samtal för att beställa matleverans.", "fi": "Harjoittele ruokatoimituksen tilaamista.", "ja": "フードデリバリーを注文する会話を練習します。", "zh-CN": "练习订外卖的对话，学习选菜单、确认地址、送餐时间的表达。"}, "dialogue": [{"speaker": "수미", "text": "여보세요, 거기 맛나 치킨이죠?", "trans": {"en": "Hello, is this Matna Chicken?", "de": "Hallo, sind Sie Matna Chicken?", "fr": "Allô, c'est bien Matna Chicken ?", "es": "Hola, ¿es Matna Chicken?", "pl": "Halo, to jest Matna Chicken?", "it": "Pronto, è Matna Chicken?", "sv": "Hej, är det Matna Chicken?", "fi": "Hei, onko se Matna Chicken?", "ja": "もしもし、マトナチキンですか？", "zh-CN": "你好，是马特纳炸鸡吗？"}}, {"speaker": "지민", "text": "네, 맞아요. 주문하시겠어요?", "trans": {"en": "Yes, that's right. Would you like to order?", "de": "Ja, richtig. Möchten Sie bestellen?", "fr": "Oui, c'est ça. Vous souhaitez commander ?", "es": "Sí, así es. ¿Le gustaría pedir?", "pl": "Tak, zgadza się. Chcieliby państwo zamówić?", "it": "Sì, esatto. Vuole ordinare?", "sv": "Ja, det stämmer. Vill du beställa?", "fi": "Kyllä, täsmälleen. Haluaisitko tilata?", "ja": "はい、そうです。ご注文はいかがですか？", "zh-CN": "是的，没错。您要点餐吗？"}}, {"speaker": "수미", "text": "치킨 1마리하고 감자튀김 주세요.", "trans": {"en": "Please give me one whole chicken and french fries.", "de": "Bitte ein ganzes Huhn und Pommes.", "fr": "Donnez-moi un poulet entier et des frites, s'il vous plaît.", "es": "Por favor, un pollo entero y patatas fritas.", "pl": "Proszę o jednego kurczaka i frytki.", "it": "Per favore, un pollo intero e patatine fritte.", "sv": "Ge mig en hel kyckling och pommes frites, tack.", "fi": "Annatko minulle yhden kokonaisen kanan ja ranskalaiset.", "ja": "チキン1羽とフライドポテトをください。", "zh-CN": "请给我一只炸鸡和薯条。"}}, {"speaker": "지민", "text": "알겠습니다. 주소가 어떻게 돼요?", "trans": {"en": "Understood. What is your address?", "de": "Verstanden. Wie ist Ihre Adresse?", "fr": "Très bien. Quelle est votre adresse ?", "es": "Entendido. ¿Cuál es su dirección?", "pl": "Rozumiem. Jaki jest pański adres?", "it": "Capito. Qual è il suo indirizzo?", "sv": "Förstått. Vad är din adress?", "fi": "Selvä. Mikä on osoitteesi?", "ja": "わかりました。住所はどちらになりますか？", "zh-CN": "好的。您的地址是什么？"}}, {"speaker": "수미", "text": "서울시 마포구 101동 302호요.", "trans": {"en": "It's 302, Building 101, Mapo-gu, Seoul.", "de": "Es ist Seoul, Mapo-gu, Gebäude 101, Zimmer 302.", "fr": "C'est le 302, Bâtiment 101, Mapo-gu, Séoul.", "es": "Es el 302, Edificio 101, Mapo-gu, Seúl.", "pl": "To jest Seul, Mapo-gu, budynek 101, mieszkanie 302.", "it": "È il 302, Edificio 101, Mapo-gu, Seoul.", "sv": "Det är 302, Byggnad 101, Mapo-gu, Seoul.", "fi": "Se on Seoul, Mapo-gu, rakennus 101, huone 302.", "ja": "ソウル市麻浦区101棟302号です。", "zh-CN": "首尔市麻浦区101栋302号。"}}, {"speaker": "지민", "text": "배달은 30분 정도 걸릴 거예요.", "trans": {"en": "Delivery will take about 30 minutes.", "de": "Die Lieferung dauert etwa 30 Minuten.", "fr": "La livraison prendra environ 30 minutes.", "es": "La entrega tardará unos 30 minutos.", "pl": "Dostawa zajmie około 30 minut.", "it": "La consegna richiederà circa 30 minuti.", "sv": "Leveransen tar ungefär 30 minuter.", "fi": "Toimitus kestää noin 30 minuuttia.", "ja": "配達は30分ほどかかります。", "zh-CN": "外卖大约需要30分钟。"}}, {"speaker": "수미", "text": "감사합니다. 기다릴게요.", "trans": {"en": "Thank you. I'll wait.", "de": "Danke. Ich werde warten.", "fr": "Merci. Je vais attendre.", "es": "Gracias. Esperaré.", "pl": "Dziękuję. Będę czekać.", "it": "Grazie. Aspetterò.", "sv": "Tack. Jag väntar.", "fi": "Kiitos. Odotan.", "ja": "ありがとうございます。待ちます。", "zh-CN": "谢谢。我等着。"}}], "vocab": [{"word": "배달", "trans": {"en": "delivery", "de": "Lieferung", "fr": "livraison", "es": "entrega / delivery", "pl": "dostawa", "it": "consegna", "sv": "leverans", "fi": "toimitus", "ja": "配達", "zh-CN": "外卖/配送"}}, {"word": "주문하다", "trans": {"en": "to order", "de": "bestellen", "fr": "commander", "es": "pedir / ordenar", "pl": "zamawiać", "it": "ordinare", "sv": "beställa", "fi": "tilata", "ja": "注文する", "zh-CN": "点餐/订购"}}, {"word": "치킨", "trans": {"en": "fried chicken", "de": "Brathähnchen", "fr": "poulet frit", "es": "pollo frito", "pl": "smażony kurczak", "it": "pollo fritto", "sv": "stekt kyckling", "fi": "paistettu kana", "ja": "フライドチキン", "zh-CN": "炸鸡"}}, {"word": "마리", "trans": {"en": "counter for animals/birds", "de": "Zählwort für Tiere/Vögel", "fr": "classificateur pour les animaux", "es": "clasificador para animales", "pl": "liczebnik dla zwierząt", "it": "classificatore per animali", "sv": "räkneord för djur/fåglar", "fi": "eläinten laskusana", "ja": "匹/羽（助数詞）", "zh-CN": "只（量词）"}}, {"word": "주소", "trans": {"en": "address", "de": "Adresse", "fr": "adresse", "es": "dirección", "pl": "adres", "it": "indirizzo", "sv": "adress", "fi": "osoite", "ja": "住所", "zh-CN": "地址"}}, {"word": "감자튀김", "trans": {"en": "french fries", "de": "Pommes frites", "fr": "frites", "es": "patatas fritas", "pl": "frytki", "it": "patatine fritte", "sv": "pommes frites", "fi": "ranskalaiset perunat", "ja": "フライドポテト", "zh-CN": "薯条"}}, {"word": "기다리다", "trans": {"en": "to wait", "de": "warten", "fr": "attendre", "es": "esperar", "pl": "czekać", "it": "aspettare", "sv": "vänta", "fi": "odottaa", "ja": "待つ", "zh-CN": "等待"}}, {"word": "정도", "trans": {"en": "about / approximately", "de": "etwa / ungefähr", "fr": "environ", "es": "aproximadamente", "pl": "około", "it": "circa", "sv": "ungefär", "fi": "noin / noin", "ja": "くらい/ほど", "zh-CN": "大约/左右"}}, {"word": "여보세요", "trans": {"en": "hello (on the phone)", "de": "Hallo (am Telefon)", "fr": "allô (au téléphone)", "es": "hola (por teléfono)", "pl": "halo (przez telefon)", "it": "pronto (al telefono)", "sv": "hej (i telefon)", "fi": "hei (puhelimessa)", "ja": "もしもし（電話で）", "zh-CN": "喂（打电话时）"}}, {"word": "알겠습니다", "trans": {"en": "I understand / Understood", "de": "Ich verstehe / Verstanden", "fr": "J'ai compris / D'accord", "es": "Entendido / De acuerdo", "pl": "Rozumiem / Zrozumiałem", "it": "Capito / Ho capito", "sv": "Jag förstår / Uppfattat", "fi": "Ymmärrän / Selvä", "ja": "わかりました", "zh-CN": "明白了/好的"}}], "patterns": [{"pattern": "~주세요", "patternTrans": {"en": "Please give me ~ / Please ~", "de": "Geben Sie mir bitte ~ / Bitte ~", "fr": "Donnez-moi ~ s'il vous plaît", "es": "Por favor, deme ~ / Por favor ~", "pl": "Proszę dać mi ~ / Proszę ~", "it": "Per favore, mi dia ~ / Per favore ~", "sv": "Ge mig ~, tack / Vänligen ~", "fi": "Anna minulle ~ / Ole hyvä ~", "ja": "～ください", "zh-CN": "请给我～"}, "example": "치킨 1마리하고 감자튀김 주세요.", "trans": {"en": "Please give me one chicken and french fries.", "de": "Bitte ein Hähnchen und Pommes.", "fr": "Donnez-moi un poulet et des frites.", "es": "Por favor, deme un pollo y patatas fritas.", "pl": "Proszę o jednego kurczaka i frytki.", "it": "Per favore, un pollo e patatine fritte.", "sv": "Ge mig en kyckling och pommes frites, tack.", "fi": "Anna minulle yksi kana ja ranskalaiset.", "ja": "チキン1羽とフライドポテトをください。", "zh-CN": "请给我一只炸鸡和薯条。"}}, {"pattern": "~가 어떻게 돼요?", "patternTrans": {"en": "What is your ~?", "de": "Wie ist Ihre ~?", "fr": "Quel est votre ~ ?", "es": "¿Cuál es su ~?", "pl": "Jaki jest pański ~?", "it": "Qual è il suo ~?", "sv": "Vad är din ~?", "fi": "Mikä sinun ~ on?", "ja": "～はどうなりますか？（どちらになりますか？）", "zh-CN": "您的～是什么？"}, "example": "주소가 어떻게 돼요?", "trans": {"en": "What is your address?", "de": "Wie ist Ihre Adresse?", "fr": "Quelle est votre adresse?", "es": "¿Cuál es su dirección?", "pl": "Jaki jest pański adres?", "it": "Qual è il suo indirizzo?", "sv": "Vad är din adress?", "fi": "Mikä osoitteesi on?", "ja": "住所はどちらになりますか？", "zh-CN": "您的地址是什么？"}}, {"pattern": "~분 정도 걸릴 거예요", "patternTrans": {"en": "It will take about ~ minutes", "de": "Es wird etwa ~ Minuten dauern", "fr": "Ça prendra environ ~ minutes", "es": "Tardará unos ~ minutos", "pl": "Zajmie około ~ minut", "it": "Ci vorranno circa ~ minuti", "sv": "Det kommer ta ungefär ~ minuter", "fi": "Se kestää noin ~ minuuttia", "ja": "～分くらいかかります", "zh-CN": "大约需要～分钟"}, "example": "배달은 30분 정도 걸릴 거예요.", "trans": {"en": "Delivery will take about 30 minutes.", "de": "Die Lieferung dauert etwa 30 Minuten.", "fr": "La livraison prendra environ 30 minutes.", "es": "La entrega tardará unos 30 minutos.", "pl": "Dostawa zajmie około 30 minut.", "it": "La consegna richiederà circa 30 minuti.", "sv": "Leveransen tar ungefär 30 minuter.", "fi": "Toimitus kestää noin 30 minuuttia.", "ja": "配達は30分ほどかかります。", "zh-CN": "外卖大约需要30分钟。"}}], "quizzes": [{"id": 1, "type": "comprehension", "questionAudio": "수미는 무엇을 주문했어요?", "questionTrans": {"en": "What did Sumi order?", "de": "Was hat Sumi bestellt?", "fr": "Qu'a commandé Sumi ?", "es": "¿Qué pidió Sumi?", "pl": "Co zamówiła Sumi?", "it": "Cosa ha ordinato Sumi?", "sv": "Vad beställde Sumi?", "fi": "Mitä Sumi tilasi?", "ja": "スミは何を注文しましたか？", "zh-CN": "秀美点了什么？"}, "options": [{"text": "1) 치킨과 피자", "trans": {"en": "chicken and pizza", "de": "Hähnchen und Pizza", "fr": "poulet et pizza", "es": "pollo y pizza", "pl": "kurczak i pizza", "it": "pollo e pizza", "sv": "kyckling och pizza", "fi": "kana ja pizza", "ja": "チキンとピザ", "zh-CN": "炸鸡和披萨"}}, {"text" \"是什么意思？"}, "options": [{"text": "1) 배달 — delivery", "trans": {"en": "delivery", "de": "Lieferung", "fr": "livraison", "es": "entrega", "pl": "dostawa", "it": "consegna", "sv": "leverans", "fi": "toimitus", "ja": "配達", "zh-CN": "外卖/配送"}}, {"text": "2) 주문", "trans": {"en": "order", "de": "Bestellung", "fr": "commande", "es": "pedido", "pl": "zamówienie", "it": "ordine", "sv": "beställning", "fi": "tilaus", "ja": "注文", "zh-CN": "点餐/订单"}}, {"text": "3) 가격", "trans": {"en": "price", "de": "Preis", "fr": "prix", "es": "precio", "pl": "cena", "it": "prezzo", "sv": "pris", "fi": "hinta", "ja": "価格", "zh-CN": "价格"}}, {"text": "4) 메뉴", "trans": {"en": "menu", "de": "Menü", "fr": "menu", "es": "menú", "pl": "menu", "it": "menu", "sv": "meny", "fi": "valikko", "ja": "メニュー", "zh-CN": "菜单"}}], "answer": 0, "explanation": {"en": "'배달' means 'delivery'. Sumi called to order food delivery.", "de": "'배달' bedeutet 'Lieferung'. Sumi hat angerufen, um eine Essenslieferung zu bestellen.", "fr": "'배달' signifie 'livraison'. Sumi a appelé pour commander une livraison de repas.", "es": "'배달' significa 'entrega'. Sumi llamó para pedir comida a domicilio.", "pl": "'배달' oznacza 'dostawa'. Sumi zadzwoniła, żeby zamówić dostawę jedzenia.", "it": "'배달' significa 'consegna'. Sumi ha chiamato per ordinare cibo a domicilio.", "sv": "'배달' betyder 'leverans'. Sumi ringde för att beställa matleverans.", "fi": "'배달' tarkoittaa 'toimitus'. Sumi soitti tilatakseen ruokatoimituksen.", "ja": "「배달」は「配達」という意味です。スミはフードデリバリーを注文するために電話しました。", "zh-CN": "배달\"是\"外卖/配送\"的意思。秀美打电话订外卖。\""}}, {"id": 3, "type": "comprehension", "questionAudio": "배달은 얼마나 걸려요?", "questionTrans": {"en": "How long does delivery take?", "de": "Wie lange dauert die Lieferung?", "fr": "Combien de temps prend la livraison ?", "es": "¿Cuánto tiempo tarda la entrega?", "pl": "Jak długo trwa dostawa?", "it": "Quanto tempo ci vuole per la consegna?", "sv": "Hur lång tid tar leveransen?", "fi": "Kuinka kauan toimitus kestää?", "ja": "配達はどのくらいかかりますか？   16: {"id": 16, "title": "16. 헬스장/운동", "titleTrans": {"en": "16. Gym / Exercise", "de": "16. Fitnessstudio / Sport", "fr": "16. Salle de sport / Exercice", "es": "16. Gimnasio / Ejercicio", "pl": "16. Siłownia / Ćwiczenia", "it": "16. Palestra / Esercizio", "sv": "16. Gym / Träning", "fi": "16. Kuntosali / Liikunta", "ja": "16. ジム・運動", "zh-CN": "16. 健身房/运动"}, "desc": "헬스장에서 등록하고 운동에 대해 이야기하는 방법을 연습합니다.", "descTrans": {"en": "Practice registering at a gym and talking about exercise.", "de": "Üben Sie, sich in einem Fitnessstudio anzumelden und über Sport zu sprechen.", "fr": "Entraînez-vous à vous inscrire dans une salle de sport et à parler d'exercice.", "es": "Practique registrarse en un gimnasio y hablar sobre el ejercicio.", "pl": "Ćwicz rejestrację na siłowni i rozmawianie o ćwiczeniach.", "it": "Esercitati a iscriverti in palestra e a parlare di esercizio fisico.", "sv": "Öva på att registrera dig på ett gym och prata om träning.", "fi": "Harjoittele kuntosalille rekisteröitymistä ja liikunnasta puhumista.", "ja": "ジムに登録し、運動について話す練習をします。", "zh-CN": "练习在健身房注册会员和谈论运动。"}, "dialogue": [{"speaker": "수미", "text": "안녕하세요. 헬스장에 등록하고 싶어요.", "trans": {"en": "Hello. I'd like to register at the gym.", "de": "Hallo. Ich möchte mich im Fitnessstudio anmelden.", "fr": "Bonjour. Je voudrais m'inscrire dans la salle de sport.", "es": "Hola. Me gustaría registrarme en el gimnasio.", "pl": "Dzień dobry. Chciałabym zarejestrować się na siłowni.", "it": "Buongiorno. Vorrei iscrivermi in palestra.", "sv": "Hej. Jag skulle vilja registrera mig på gymmet.", "fi": "Hei. Haluaisin rekisteröityä kuntosalille.", "ja": "こんにちは。ジムに登録したいのですが。", "zh-CN": "你好，我想办理健身房会员。"}}, {"speaker": "지민", "text": "어떤 회원권을 원하세요?", "trans": {"en": "What kind of membership do you want?", "de": "Welche Art von Mitgliedschaft möchten Sie?", "fr": "Quel type d'abonnement voulez-vous?", "es": "¿Qué tipo de membresía desea?", "pl": "Jaki rodzaj karnetu chce Pani?", "it": "Che tipo di abbonamento vuole?", "sv": "Vilken typ av medlemskap vill du ha?", "fi": "Minkälaisen jäsenyyden haluat?", "ja": "どんな会員権をご希望ですか？", "zh-CN": "您想办哪种会员卡？"}}, {"speaker": "수미", "text": "한 달짜리로 주세요. 얼마예요?", "trans": {"en": "Please give me a one-month one. How much is it?", "de": "Bitte ein Einmonats-Abo. Wie viel kostet es?", "fr": "Donnez-moi un abonnement d'un mois. Combien ça coûte?", "es": "Deme uno de un mes. ¿Cuánto cuesta?", "pl": "Poproszę na miesiąc. Ile to kosztuje?", "it": "Datemi uno da un mese. Quanto costa?", "sv": "Ge mig ett för en månad. Hur mycket kostar det?", "fi": "Anna minulle kuukauden jäsenyys. Paljonko se maksaa?", "ja": "1ヶ月のものをください。いくらですか？", "zh-CN": "请给我一个月的。多少钱？"}}, {"speaker": "지민", "text": "한 달에 50,000원이에요.", "trans": {"en": "It's 50,000 won per month.", "de": "Es kostet 50.000 Won pro Monat.", "fr": "C'est 50 000 won par mois.", "es": "Son 50,000 won al mes.", "pl": "To 50 000 wonów miesięcznie.", "it": "È 50.000 won al mese.", "sv": "Det är 50 000 won per månad.", "fi": "Se on 50 000 wonia kuukaudessa.", "ja": "月50,000ウォンです。", "zh-CN": "每月50,000韩元。"}}, {"speaker": "수미", "text": "운동 기구 사용법을 가르쳐 주실 수 있어요?", "trans": {"en": "Can you teach me how to use the equipment?", "de": "Können Sie mir zeigen, wie man die Geräte benutzt?", "fr": "Pouvez-vous m'apprendre à utiliser les équipements?", "es": "¿Puede enseñarme a usar los equipos?", "pl": "Czy może Pani/Pan nauczyć mnie obsługi sprzętu?", "it": "Può insegnarmi come usare le attrezzature?", "sv": "Kan du lära mig hur man använder utrustningen?", "fi": "Voitko opettaa minulle laitteiden käytön?", "ja": "運動器具の使い方を教えていただけますか？", "zh-CN": "您能教我怎么使用健身器材吗？"}}, {"speaker": "지민", "text": "네, 처음 오시는 분들께 무료로 설명해 드려요.", "trans": {"en": "Yes, we explain for free to first-time visitors.", "de": "Ja, wir erklären es Erstbesuchern kostenlos.", "fr": "Oui, nous expliquons gratuitement aux nouveaux membres.", "es": "Sí, explicamos gratis a quienes vienen por primera vez.", "pl": "Tak, wyjaśniamy bezpłatnie osobom, które przychodzą po raz pierwszy.", "it": "Sì, spieghiamo gratuitamente ai nuovi arrivati.", "sv": "Ja, vi förklarar gratis för förstagångsbesökare.", "fi": "Kyllä, selitämme ilmaiseksi ensikertalaisille.", "ja": "はい、初めて来られる方には無料でご説明します。", "zh-CN": "是的，我们免费为初次来访的会员讲解。"}}], "vocab": [{"word": "헬스장", "trans": {"en": "gym / fitness center", "de": "Fitnessstudio", "fr": "salle de sport / fitness", "es": "gimnasio", "pl": "siłownia", "it": "palestra", "sv": "gym", "fi": "kuntosali", "ja": "ジム", "zh-CN": "健身房"}}, {"word": "등록하다", "trans": {"en": "to register / sign up", "de": "sich anmelden / registrieren", "fr": "s'inscrire / s'enregistrer", "es": "registrarse / inscribirse", "pl": "rejestrować się / zapisywać się", "it": "registrarsi / iscriversi", "sv": "registrera sig / anmäla sig", "fi": "rekisteröityä / ilmoittautua", "ja": "登録する", "zh-CN": "注册/办理"}}, {"word": "회원권", "trans": {"en": "membership", "de": "Mitgliedschaft / Mitgliedskarte", "fr": "abonnement / carte de membre", "es": "membresía / carnet de socio", "pl": "karnet / karta członkowska", "it": "abbonamento", "sv": "medlemskap", "fi": "jäsenyys", "ja": "会員権", "zh-CN": "会员卡/会员资格"}}, {"word": "한 달", "trans": {"en": "one month", "de": "ein Monat", "fr": "un mois", "es": "un mes", "pl": "jeden miesiąc", "it": "un mese", "sv": "en månad", "fi": "yksi kuukausi", "ja": "1ヶ月", "zh-CN": "一个月"}}, {"word": "운동 기구", "trans": {"en": "exercise equipment", "de": "Trainingsgerät", "fr": "équipement d'exercice", "es": "equipo de ejercicio", "pl": "sprzęt do ćwiczeń", "it": "attrezzatura per l'esercizio", "sv": "träningsutrustning", "fi": "liikuntavälineet", "ja": "運動器具", "zh-CN": "健身器材"}}, {"word": "사용법", "trans": {"en": "how to use / usage instructions", "de": "Bedienungsanleitung / Gebrauchsanweisung", "fr": "mode d'emploi / instructions d'utilisation", "es": "instrucciones de uso / modo de empleo", "pl": "instrukcja obsługi / sposób użycia", "it": "istruzioni per l'uso", "sv": "bruksanvisning / användningsinstruktioner", "fi": "käyttöohjeet", "ja":   17: {"id": 17, "title": "17. 미용실에서", "titleTrans": {"en": "17. At the Hair Salon", "de": "17. Im Friseursalon", "fr": "17. Au salon de coiffure", "es": "17. En la peluquería", "pl": "17. W salonie fryzjerskim", "it": "17. Dal parrucchiere", "sv": "17. På frisören", "fi": "17. Kampaajalla", "ja": "17. 美容室で", "zh-CN": "17. 在美发店"}, "desc": "미용실에서 원하는 헤어스타일을 설명하고 주문하는 방법을 연습합니다.", "descTrans": {"en": "Practice describing and requesting your desired hairstyle at a hair salon.", "de": "Üben Sie, Ihren gewünschten Haarschnitt im Friseursalon zu beschreiben und zu bestellen.", "fr": "Entraînez-vous à décrire et demander la coiffure souhaitée dans un salon de coiffure.", "es": "Practique describir y solicitar el peinado deseado en una peluquería.", "pl": "Ćwicz opisywanie i zamawianie pożądanej fryzury w salonie fryzjerskim.", "it": "Esercitati a descrivere e richiedere l'acconciatura desiderata dal parrucchiere.", "sv": "Öva på att beskriva och beställa din önskade frisyr hos frisören.", "fi": "Harjoittele haluamasi hiustyylin kuvaamista ja tilaamista kampaajalla.", "ja": "美容室で希望のヘアスタイルを説明し、オーダーする練習をします。", "zh-CN": "练习在美发店描述并预约您想要的发型。"}, "dialogue": [{"speaker": "수미", "text": "안녕하세요. 머리 자르러 왔어요.", "trans": {"en": "Hello. I came to get a haircut.", "de": "Hallo. Ich bin zum Haareschneiden gekommen.", "fr": "Bonjour. Je suis venue me faire couper les cheveux.", "es": "Hola. Vine a cortarme el pelo.", "pl": "Dzień dobry. Przyszłam obciąć włosy.", "it": "Buongiorno. Sono venuta per tagliare i capelli.", "sv": "Hej. Jag kom för att klippa håret.", "fi": "Hei. Tulin leikkaamaan hiukset.", "ja": "こんにちは。髪を切りに来ました。", "zh-CN": "您好，我来剪头发。"}}, {"speaker": "지민", "text": "어떻게 해 드릴까요?", "trans": {"en": "How would you like it done?", "de": "Wie soll es gemacht werden?", "fr": "Comment voulez-vous que je le fasse?", "es": "¿Cómo le gustaría que se lo hiciera?", "pl": "Jak mam to zrobić?", "it": "Come lo vuole?", "sv": "Hur vill du ha det gjort?", "fi": "Miten haluat sen tehtävän?", "ja": "どのようにしましょうか？", "zh-CN": "您想怎么做？"}}, {"speaker": "수미", "text": "앞머리를 자르고 싶고, 전체적으로 조금만 다듬어 주세요.", "trans": {"en": "I want to cut my bangs, and please just trim a little overall.", "de": "Ich möchte meinen Pony schneiden lassen und insgesamt nur etwas nachschneiden.", "fr": "Je veux couper ma frange et tailler un peu l'ensemble.", "es": "Quiero cortar mi flequillo y recortar un poco en general.", "pl": "Chcę przyciąć grzywkę i trochę wyrównać całość.", "it": "Voglio tagliare la frangia e sistemare un po' in generale.", "sv": "Jag vill klippa luggen och bara trimma lite totalt sett.", "fi": "Haluan leikata otsatukan ja trimmata vähän kauttaaltaan.", "ja": "前髪を切りたいのと、全体的に少しだけ整えてください。", "zh-CN": "我想剪刘海，整体稍微修剪一下。"}}, {"speaker": "지민", "text": "얼마나 자를까요?", "trans": {"en": "How much do you want cut?", "de": "Wie viel soll abgeschnitten werden?", "fr": "Combien voulez-vous qu'on coupe?", "es": "¿Cuánto quiere que se corte?", "pl": "Ile chce Pani obciąć?", "it": "Quanto vuole che tagli?", "sv": "Hur mycket vill du klippa?", "fi": "Kuinka paljon haluat leikata?", "ja": "どのくらい切りますか？", "zh-CN": "想剪多少？"}}, {"speaker": "수미", "text": "3센티미터 정도요.", "trans": {"en": "About 3 centimeters.", "de": "Ungefähr 3 Zentimeter.", "fr": "Environ 3 centimètres.", "es": "Unos 3 centímetros.", "pl": "Około 3 centymetry.", "it": "Circa 3 centimetri.", "sv": "Ungefär 3 centimeter.", "fi": "Noin 3 senttiä.", "ja": "3センチくらいです。", "zh-CN": "大约3厘米。"}}, {"speaker": "지민", "text": "염색은 안 하세요?", "trans": {"en": "Are you not dyeing your hair?", "de": "Färben Sie Ihr Haar nicht?", "fr": "Vous ne colorez pas vos cheveux?", "es": "¿No va a teñirse el pelo?", "pl": "Nie farbuje Pani włosów?", "it": "Non vuole tingere i capelli?", "sv": "Färgar du inte håret?", "fi": "Etkö värjää hiuksia?", "ja": "染めはしませんか？", "zh-CN": "不染发吗？"}}, {"speaker": "수미", "text": "오늘은 괜찮아요. 다음에 할게요.", "trans": {"en": "Not today, thanks. I'll do it next time.", "de": "Heute nicht, danke. Ich mache es beim nächsten Mal.", "fr": "Pas aujourd ?", "fr": "Pourquoi Sumi est-elle venue au salon de coiffure?", "es": "¿Por qué vino Sumi a la peluquería?", "pl": "Dlaczego Sumi przyszła do salonu fryzjerskiego?", "it": "Perché Sumi è venuta dal parrucchiere?", "sv": "Varför kom Sumi till frisören?", "fi": "Miksi Sumi tuli kampaajalle?", "ja": "スミはなぜ美容室に来ましたか？", "zh-CN": "수미为什么来美发店？"}, "options": [{"text": "1) 염색하러", "trans": {"en": "To dye her hair", "de": "Um ihr Haar zu färben", "fr": "Pour teindre ses cheveux", "es": "Para teñirse el pelo", "pl": "Żeby ufarbować włosy", "it": "Per tingere i capelli", "sv": "För att färga håret", "fi": "Värjätäkseen hiuksensa", "ja": "染めるため", "zh-CN": "为了染发"}}, {"text": "2) 파마하러", "trans": {"en": "To get a perm", "de": "Um eine Dauerwelle zu machen", "fr": "Pour faire une permanente", "es": "Para hacerse una permanente", "pl": "Żeby zrobić trwałą", "it": "Per fare la permanente", "sv": "För att göra en permanent", "fi": "Saadakseen permanentin", "ja": "パーマをかけるため", "zh-CN": "为了烫发"}}, {"text": "3) 머리 자르러", "trans": {"en": "To get a haircut", "de": "Um die Haare zu schneiden", "fr": "Pour se faire couper les cheveux", "es": "Para cortarse el pelo", "pl": "Żeby obciąć włosy", "it": "Per tagliare i capelli", "sv": "För att klippa håret", "fi": "Leikatakseen hiukset", "ja": "髪を切るため", "zh-CN": "为了剪发"}}, {"text": "4) 머리 감으러", "trans": {"en": "To wash her hair", "de": "Um die Haare zu waschen", "fr": "Pour se laver les cheveux", "es": "Para lavarse el pelo", "pl": "Żeby umyć włosy", "it": "Per lavarsi i capelli", "sv": "För att tvätta håret", "fi": "Pestäkseen hiuksensa", "ja": "髪を洗うため", "zh-CN": "为了洗头"}}], "answer": 2, "explanation": {"en": "Sumi said '머리 자르러 왔어요' (I came to get a haircut).", "de": "Sumi sagte '머리 자르러 왔어요' (Ich bin zum Haareschneiden gekommen).", "fr": "Sumi a dit '머리 자르러 왔어요' (Je suis venue me faire couper les cheveux).", "es": "Sumi dijo '머리 자르러 왔어요' (Vine a cortarme el pelo).", "pl": "Sumi powiedziała '머리 자르러 왔어요' (Przyszłam obciąć włosy).", "it": "Sumi ha detto '머리 자르러 왔어요' (Sono venuta per tagliare i capelli).", "sv": "Sumi sa '머리 자르러 왔어요' (Jag kom för att klippa håret).", "fi": "Sumi sanoi '머리 자르러 왔어요' (Tulin leikkaamaan hiukset).", "ja": "스미는 '머리 자르러 왔어요'（髪を切りに来ました）と言いました。", "zh-CN": "수미说「머리 자르러 왔어요」（我来剪头发）。"}}, {"id": 2, "type": "detail", "questionAudio": "수미는 머리를 얼마나 자르고 싶어요?", "questionTrans": {"en": "How much does Sumi want to cut?", "de": "Wie viel möchte Sumi abschneiden?", "fr": "Combien Sumi veut-elle couper?", "es": "¿Cuánto quiere cortar Sumi?", "pl": "Ile Sumi chce obciąć?", "it": "Quanto vuole tagliare Sumi?", "sv": "Hur mycket vill Sumi klippa?", "fi": "Kuinka paljon Sumi haluaa leikata?", "ja": "スミはどのくらい髪を切りたいですか？", "zh-CN": "수미想剪多少头发？"}, "options": [{"text": "1) 1센티미터", "trans": {"en": "1 centimeter", "de": "1 Zentimeter", "fr": "1 centimètre", "es": "1 centímetro", "pl": "1 centymetr", "it": "1 centimetro", "sv": "1 centimeter", "fi": "1 senttimetri", "ja": "1センチ", "zh-CN": "1厘米"}}, {"text": "2) 5센티미터", "trans": {"en": "5 centimeters", "de": "5 Zentimeter", "fr": "5 centimètres", "es": "5 centímetros", "pl": "5 centymetrów", "it": "5 centimetri", "sv": "5 centimeter", "fi": "5 senttiä", "ja": "5センチ", "zh-CN": "5厘米"}}, {"text": "3) 3센티미터", "trans": {"en": "3 centimeters", "de": "3 Zentimeter", "fr": "3 centimètres", "es": "3 centímetros", "pl": "3 centymetry", "it": "3 centimetri", "sv": "3 centimeter", "fi": "3 senttiä", "ja": "3センチ", "zh-CN": "3厘米"}}, {"text": "4) 10센티미터", "trans": {"en": "10 centimeters", "de": "10 Zentimeter", "fr": "10 centimètres", "es": "10 centímetros", "pl": "10 centymetrów", "it": "10 centimetri", "sv": "10 centimeter", "fi": "10 senttiä", "ja": "10センチ", "zh-CN": "10厘米"}}], "answer": 2, "explanation": {"en": "Sumi said '3센티미터 정도요' (about 3 centimeters).", "de": "Sumi sagte '3센티미터 정도요' (ungefähr 3 Zentimeter).", "fr": "Sumi a dit '3센티미터 정도요' (environ 3 centimètres).", "es": "Sumi dijo '3센티미터 정도요' (unos 3 centímetros).", "pl": "Sumi powiedziała '3센티미터 정도요' (około 3 centymetry).", "it": "Sumi ha detto '3센티미터 정도요' (circa 3 centimetri).", "sv": "Sumi sa '3센티미터 정도요' (ungefär 3 centimeter).", "fi": "Sumi sanoi '3센티미터 정도요' (noin 3 senttiä).", "ja": "スミは「3센티미터 정도요」（3センチくらいです）と言いました。", "zh-CN": "수미说「3센티미터 정도요」（大约3厘米）。"}}, {"id": 3, "type": "comprehension", "questionAudio": "수미는 오늘 염색해요?", "questionTrans": {"en": "Does Sumi dye her hair today?", "de": "Färbt Sumi heute ihr Haar?", "fr": "Sumi teint-elle ses cheveux aujourd'hui?", "es": "¿Se tiñe Sumi el pelo hoy?", "pl": "Czy Sumi dzisiaj farbuje włosy?", "it": "Sumi si tinge i capelli oggi?", "sv": "Färgar Sumi håret idag?", "fi": "Värjääkö Sumi hiuksensa tänään?", "ja": "スミは今日髪を染めますか？", "zh-CN": "수미今天染发吗？"}, "options": [{"text": "1) 네, 오늘 염색해요", "trans": {"en": "Yes, she dyes it today", "de": "Ja, sie färbt es heute", "fr": "Oui, elle le fait aujourd'hui", "es": "Sí, se lo tiñe hoy", "pl": "Tak, dzisiaj farbuje", "it": "Sì, lo tinge oggi", "sv": "Ja, hon färgar det idag", "fi": "Kyllä, hän värjää sen tänään", "ja": "はい、今日染めます", "zh-CN": "是的，今天染发"}}, {"text": "2) 아니요, 다음에 할 거예요", "trans": {"en": "No, she'll do it next time", "de": "Nein, sie macht es beim nächsten Mal", "fr": "Non, elle le fera la prochaine fois", "es": "No, lo hará la próxima vez", "pl": "Nie, zrobi to następnym razem", "it": "No, lo farà la prossima volta", "sv": "Nej, hon gör det nästa gång", "fi": "Ei, hän tekee sen ensi kerralla", "ja": "いいえ、次にします", "zh-CN": "不，下次再说"}}, {"text": "3) 아직 모르겠어요", "trans": {"en": "She doesn't know yet", "de": "Sie weiß es noch nicht", "fr": "Elle ne sait pas encore", "es": "Todavía no sabe", "pl": "Jeszcze nie wiadomo", "it": "Non lo sa ancora", "sv": "Hon vet inte ännu", "fi": "Hän ei tiedä vielä", "ja": "まだわかりません", "zh-CN": "还不知道"}}, {"text": "4) 미용사에게 맡겼어요", "trans": {"en": "She left it to the hairdresser", "de": "Sie hat es dem Friseur überlassen", "fr": "Elle l'a laissé au coiffeur", "es": "Lo dejó en manos del peluquero", "pl": "Zostawiła to fryzjerce", "it": "Lo ha lasciato al parrucchiere", "sv": "Hon lät frisören bestämma", "fi": "Hän jätti sen kampaajan päätettäväksi", "ja": "美容師に任せました", "zh-CN": "交给美发师决定了"}}], "answer": 1, "explanation": {"en": "Sumi said '오늘은 괜찮아요. 다음에 할게요' (Not today. I'll do it next time).", "de": "Sumi sagte '오늘은 괜찮아요. 다음에 할게요' (Heute nicht. Ich mache es beim nächsten Mal).", "fr": "Sumi a dit '오늘은 괜찮아요. 다음에 할게요' (Pas aujourd'hui. Je le ferai la prochaine fois).", "es": "Sumi dijo '오늘은 괜찮아요. 다음에 할게요' (Hoy no. Lo haré la próxima vez).", "pl": "Sumi powiedziała '오늘은 괜찮아요. 다음에 할게요' (Dzisiaj nie. Zrobię to następnym razem).", "it": "Sumi ha detto '오늘은 괜찮아요. 다음에 할게요' (Oggi no. Lo farò la prossima volta).", "sv": "Sumi sa '오늘은 괜찮아요. 다음에 할게요' (Inte idag. Jag gör det nästa gång).", "fi": "Sumi sanoi '오늘은 괜찮아요. 다음에 할게요' (Tänään ei. Teen sen ensi kerralla).", "ja": "スミは「오늘은 괜찮아요. 다음에 할게요」（今日はいいです。次にします）と言いました。", "zh-CN": "수미说「오늘은 괜찮아요. 다음에 할게요」（今天不用了，下次再说）。"}}]},
  18: {"id": 18, "title": "18. 영화 예매하기", "titleTrans": {"en": "18. Booking Movie Tickets", "de": "18. Kinokarten reservieren", "fr": "18. Réserver des billets de cinéma", "es": "18. Reservar entradas de cine", "pl": "18. Rezerwowanie biletów do kina", "it": "18. Prenotare biglietti del cinema", "sv": "18. Boka biobiljetter", "fi": "18. Elokuvalippujen varaaminen", "ja": "18. 映画チケットを予約する", "zh-CN": "18. 预订电影票"}, "desc": "영화관에서 표를 예매하고 좌석을 선택하는 방법을 연습합니다.", "descTrans": {"en": "Practice booking movie tickets and choosing seats at the cinema.", "de": "Üben Sie, Kinokarten zu buchen und Sitzplätze im Kino auszuwählen.", "fr": "Entraînez-vous à réserver des billets de cinéma et à choisir des places.", "es": "Practique reservar entradas de cine y elegir asientos en el cine.", "pl": "Ćwicz rezerwowanie biletów do kina i wybieranie miejsc.", "it": "Esercitati a prenotare biglietti del cinema e scegliere i posti.", "sv": "Öva på att boka biobiljetter och välja platser på bio.", "fi": "Harjoittele elokuvalippujen varaamista ja paikkojen valitsemista elokuvateatterissa.", "ja": "映画館でチケットを予約し、座席を選ぶ練習をします。", "zh-CN": "练习在电影院预订电影票和选座位。"}, "dialogue": [{"speaker": "수미", "text": "안녕하세요. 오늘 저녁 7시 영화 두 장 주세요.", "trans": {"en": "Hello. Two tickets for tonight's 7 PM movie, please.", "de": "Hallo. Zwei Karten für den Film heute Abend um 19 Uhr, bitte.", "fr": "Bonjour. Deux billets pour le film ce soir à 19h, s'il vous plaît.", "es": "Hola. Dos entradas para la película de esta noche a las 7 PM, por favor.", "pl": "Dzień dobry. Dwa bilety na dzisiejszy wieczorny film o 19:00, proszę.", "it": "Buongiorno. Due biglietti per il film di stasera alle 19, per favore.", "sv": "Hej. Två biljetter till filmkvällen kl. 19 tack.", "fi": "Hei. Kaksi lippua tämän illan klo 19 elokuvaan kiitos.", "ja": "こんにちは。今夜7時の映画を2枚ください。", "zh-CN": "您好，请给我两张今晚7点的电影票。"}}, {"speaker": "지민", "text": "어떤 영화 보실 거예요?", "trans": {"en": "Which movie will you see?", "de": "Welchen Film werden Sie sehen?", "fr": "Quel film allez-vous voir?", "es": "¿Qué película va a ver?", "pl": "Jaki film zamierza Pan/Pani obejrzeć?", "it": "Quale film vedrà?", "sv": "Vilken film ska du se?", "fi": "Mitä elokuvaa aiot katsoa?", "ja": "どの映画をご覧になりますか？", "zh-CN": "您要看哪部电影？"}}, {"speaker": "수미", "text": "사랑의 계절이요.", "trans": {"en": "Season of Love.", "de": "Jahreszeit der Liebe.", "fr": "La saison de l'amour.", "es": "La estación del amor.", "pl": "Pora miłości.", "it": "La stagione dell'amore.", "sv": "Kärlekens säsong.", "fi": "Rakkauden kausi.", "ja": "「사랑의 계절」（愛の季節）です。", "zh-CN": "「사랑의 계절」（爱的季节）。"}}, {"speaker": "지민", "text": "좌석을 선택해 주세요. 어디가 좋아요?", "trans": {"en": "Please choose your seats. Where would you like?", "de": "Bitte wählen Sie Ihre Plätze aus. Wo möchten Sie sitzen?", "fr": "Veuillez choisir vos places. Où voulez-vous vous asseoir?", "es": "Por favor elija sus asientos. ¿Dónde le gustaría sentarse?", "pl": "Proszę wybrać miejsca. Gdzie chciałaby Pani usiąść?", "it": "Scelga i posti. Dove preferisce?", "sv": "Välj platser. Var vill du sitta?", "fi": "Valitse paikat. Missä haluaisit istua?", "ja": "座席をお選びください。どこがよいですか？", "zh-CN": "请选座位。您想坐哪里？"}}, {"speaker": "수미", "text": "가운데 자리가 좋아요. G열 12번, 13번 주세요.", "trans": {"en": "I prefer center seats. Please give me G row, seats 12 and 13.", "de": "Ich möchte lieber Plätze in der Mitte. Reihe G, Platz 12 und 13 bitte.", "fr": "Je préfère les sièges au centre. Donnez-moi la rangée G, places 12 et 13.", "es": "Prefiero los asientos del centro. Deme la fila G, asientos 12 y 13.", "pl": "Wolę miejsca pośrodku. Proszę o rząd G, miejsca 12 i 13.", "it": "Preferisco i posti centrali. Mi dia la fila G, posti 12 e 13.", "sv": "Jag föredrar platser i mitten. Ge mig rad G, plats 12 och 13.", "fi": "Pidän keskipaikkoja. Anna minulle rivi G, paikat 12 ja 13.", "ja": "真ん中の席がいいです。G列12番と13番をください。", "zh-CN": "我想要中间的座位。请给我G排12号和13号。"}}, {"speaker": "지민", "text": "총 22,000원이에요. 결제는 어떻게 하실 거예요?", "trans": {"en": "The total is 22,000 won. How will you pay?", "de": "Insgesamt sind es 22.000 Won. Wie möchten Sie bezahlen?", "fr": "Le total est de 22 000 won. Comment allez-vous payer?", "es": "El total es 22,000 won. ¿Cómo va a pagar?", "pl": "Łącznie to 22 000 wonów. Jak chciałaby Pani zapłacić?", "it": "Il totale è 22.000 won. Come pagherà?", "sv": "Totalt är det 22 000 won. Hur vill du betala?", "fi": "Yhteensä 22 000 wonia. Miten haluat maksaa?", "ja": "合計22,000ウォンです。お支払いはどうされますか？", "zh-CN": "总共22,000韩元。您怎么付款？"}}], "vocab": [{"word": "영화", "trans": {"en": "movie / film", "de": "Film", "fr": "film / cinéma", "es": "película / cine", "pl": "film", "it": "film / cinema", "sv": "film", "fi": "elokuva", "ja": "映画", "zh-CN": "电影"}}, {"word": "예매하다", "trans": {"en": "to book in advance", "de": "im Voraus buchen / reservieren", "fr": "réserver à l'avance", "es": "reservar con anticipación", "pl": "rezerwować z wyprzedzeniem", "it": "prenotare in anticipo", "sv": "förhandsreservera / boka i förväg", "fi": "varata ennakkoon", "ja": "前売り予約する", "zh-CN": "预订/提前买票"}}, {"word": "좌석", "trans": {"en": "seat", "de": "Sitz / Platz", "fr": "siège / place", "es": "asiento / butaca", "pl": "miejsce / siedzenie", "it": "posto / sedile", "sv": "plats / säte", "fi": "paikka / istuin", "ja": "座席", "zh-CN": "座位"}}, {"word": "선택하다", "trans": {"en": "to choose / select", "de": "wählen / auswählen", "fr": "choisir / sélectionner", "es": "elegir / seleccionar", "pl": "wybierać", "it": "scegliere / selezionare", "sv": "välja / selektera", "fi": "valita", "ja": "選択する", "zh-CN": "选择"}}, {"word": "가운데", "trans": {"en": "center / middle", "de": "Mitte", "fr": "centre / milieu", "es": "centro / medio", "pl": "środek", "it": "centro / mezzo", "sv": "mitten / centrum", "fi": "keskellä / keskusta", "ja": "真ん中・中央", "zh-CN": "中间/中央"}}, {"word": "열", "trans": {"en": "row (in a theater)", "de": "Reihe (im Theater)", "fr": "rangée (dans une salle)", "es": "fila (en un teatro)", "pl": "rząd (w kinie)", "it": "fila (in sala)", "sv": "rad (på bio)", "fi": "rivi (teatterissa)", "ja": "列（映画館の）", "zh-CN": "排（影院座位）"}}, {"word": "결제", "trans": {"en": "payment", "de": "Zahlung", "fr": "paiement", "es": "pago", "pl": "płatność", "it": "pagamento", "sv": "betalning", "fi": "maksu", "ja": "決済・支払い", "zh-CN": "付款/结算"}}, {"word": "총", "trans": {"en": "total", "de": "Gesamt", "fr": "total", "es": "total", "pl": "łącznie / razem", "it": "totale", "sv": "totalt", "fi": "yhteensä", "ja": "合計", "zh-CN": "总共/合计"}}, {"word": "카드", "trans": {"en": "card (credit/debit)", "de": "Karte (Kredit-/Debitkarte)", "fr": "carte (bancaire)", "es": "tarjeta (de crédito/débito)", "pl": "karta (kredytowa/debetowa)", "it": "carta (di credito/debito)", "sv": "kort (kredit-/betalkort)", "fi": "kortti (luotto-/pankkikortti)", "ja": "カード（クレジット/デビット）", "zh-CN": "卡（信用卡/借记卡）"}}, {"word": "현금", "trans": {"en": "cash", "de": "Bargeld", "fr": "espèces", "es": "efectivo", "pl": "gotówka", "it": "contanti", "sv": "kontanter", "fi": "käteinen", "ja": "現金", "zh-CN": "现金"}}], "patterns": [{"pattern": "N 두 장 주세요", "patternTrans": {"en": "Please give me two N", "de": "Bitte geben Sie mir zwei N", "fr": "Donnez-moi deux N s'il vous plaît", "es": "Déme dos N por favor", "pl": "Proszę dwa N", "it": "Per favore, datemi due N", "sv": "Ge mig två N tack", "fi": "Anna minulle kaksi N kiitos", "ja": "Nを2枚ください", "zh-CN": "请给我两张N"}, "example": "오늘 저녁 7시 영화 두 장 주세요.", "trans": {"en": "Two tickets for tonight's 7 PM movie, please.", "de": "Zwei Karten für den Film heute Abend um 19 Uhr, bitte.", "fr": "Deux billets pour le film ce soir à 19h, s'il vous plaît.", "es": "Dos entradas para la película de esta noche a las 7 PM.", "pl": "Proszę dwa bilety na dzisiejszy wieczorny film o 19:00.", "it": "Due biglietti per il film di stasera alle 19.", "sv": "Två biljetter till kvällens film kl. 19 tack.", "fi": "Kaksi lippua tämän illan klo 19 elokuvaan kiitos.", "ja": "今夜7時の映画を2枚ください。", "zh-CN": "请给我两张今晚7点的电影票。"}}, {"pattern": "N열 N번, N번 주세요", "patternTrans": {"en": "Please give me row N, seats N and N", "de": "Bitte geben Sie mir Reihe N, Platz N und N", "fr": "Donnez-moi la rangée N, places N et N", "es": "Deme la fila N, asientos N y N", "pl": "Proszę rząd N, miejsca N i N", "it": "Mi dia la fila N, posti N e N", "sv": "Ge mig rad N, plats N och N", "fi": "Anna minulle rivi N, paikat N ja N", "ja": "N列N番、N番をください", "zh-CN": "请给我N排N号和N号"}, "example": "G열 12번, 13번 주세요.", "trans": {"en": "Please give me G row, seats 12 and 13.", "de": "Bitte Reihe G, Platz 12 und 13.", "fr": "Donnez-moi la rangée G, places 12 et 13.", "es": "Deme la fila G, asientos 12 y 13.", "pl": "Proszę rząd G, miejsca 12 i 13.", "it": "Mi dia la fila G, posti 12 e 13.", "sv": "Ge mig rad G, plats 12 och 13.", "fi": "Anna minulle rivi G, paikat 12 ja 13.", "ja": "G列12番、13番をください。", "zh-CN": "请给我G排12号和13号。"}}, {"pattern": "결제는 어떻게 하실 거예요?", "patternTrans": {"en": "How will you pay?", "de": "Wie möchten Sie bezahlen?", "fr": "Comment allez-vous payer?", "es": "¿Cómo va a pagar?", "pl": "Jak chciałaby Pani zapłacić?", "it": "Come pagherà?", "sv": "Hur vill du betala?", "fi": "Miten haluat maksaa?", "ja": "お支払いはどうされますか？", "zh-CN": "您怎么付款？"}, "example": "결제는 어떻게 하실 거예요?", "trans": {"en": "How will you pay?", "de": "Wie möchten Sie bezahlen?", "fr": "Comment allez-vous payer?", "es": "¿Cómo va a pagar?", "pl": "Jak chciałaby Pani zapłacić?", "it": "Come pagherà?", "sv": "Hur vill du betala?", "fi": "Miten haluat maksaa?", "ja": "お支払いはどうされますか？", "zh-CN": "您怎么付款？"}}], "quizzes": [{"id": 1, "type": "detail", "questionAudio": "수미가 선택한 좌석은 어디예요?", "questionTrans": {"en": "Where are the seats Sumi chose?", "de": "Wo sind die Plätze, die Sumi gewählt hat?", "fr": "Où sont les places que Sumi a choisies?", "es": "¿Dónde están los asientos que eligió Sumi?", "pl": "Gdzie są miejsca, które wybrała Sumi?", "it": "Dove sono i posti che Sumi ha scelto?", "sv": "Var är platserna som Sumi valde?", "fi": "Missä ovat paikat, jotka Sumi valitsi?", "ja": "スミが選んだ座席はどこですか？", "zh-CN": "수미选的座位在哪里？"}, "options": [{"text": "1) A열 1번, 2번", "trans": {"en": "Row A, seats 1 and 2", "de": "Reihe A, Platz 1 und 2", "fr": "Rangée A, places 1 et 2", "es": "Fila A, asientos 1 y 2", "pl": "Rząd A, miejsca 1 i 2", "it": "Fila A, posti 1 e 2", "sv": "Rad A, plats 1 och 2", "fi": "Rivi A, paikat 1 ja 2", "ja": "A列1番、2番", "zh-CN": "A排1号和2号"}}, {"text": "2) F열 5번, 6번", "trans": {"en": "Row F, seats 5 and 6", "de": "Reihe F, Platz 5 und 6", "fr": "Rangée F, places 5 et 6", "es": "Fila F, asientos 5 y 6", "pl": "Rząd F, miejsca 5 i 6", "it": "Fila F, posti 5 e 6", "sv": "Rad F, plats 5 och 6", "fi": "Rivi F, paikat 5 ja 6", "ja": "F列5番、6番", "zh-CN": "F排5号和6号"}}, {"text": "3) H열 10번, 11번", "trans": {"en": "Row H, seats 10 and 11", "de": "Reihe H, Platz 10 und 11", "fr": "Rangée H, places 10 et 11", "es": "Fila H, asientos 10 y 11", "pl": "Rząd H, miejsca 10 i 11", "it": "Fila H, posti 10 e 11", "sv": "Rad H, plats 10 och 11", "fi": "Rivi H, paikat 10 ja 11", "ja": "H列10番、11番", "zh-CN": "H排10号和11号"}}, {"text": "4) G열 12번, 13번", "trans": {"en": "Row G, seats 12 and 13", "de": "Reihe G, Platz 12 und 13", "fr": "Rangée G, places 12 et 13", "es": "Fila G, asientos 12 y 13", "pl": "Rząd G, miejsca 12 i 13", "it": "Fila G, posti 12 e 13", "sv": "Rad G, plats 12 och 13", "fi": "Rivi G, paikat 12 ja 13", "ja": "G列12番、13番", "zh-CN": "G排12号和13号"}}], "answer": 3, "explanation": {"en": "Sumi said 'G열 12번, 13번 주세요' (Row G, seats 12 and 13).", "de": "Sumi sagte 'G열 12번, 13번 주세요' (Reihe G, Platz 12 und 13).", "fr": "Sumi a dit 'G열 12번, 13번 주세요' (Rangée G, places 12 et 13).", "es": "Sumi dijo 'G열 12번, 13번 주세요' (Fila G, asientos 12 y 13).", "pl": "Sumi powiedziała 'G열 12번, 13번 주세요' (Rząd G, miejsca 12 i 13).", "it": "Sumi ha detto 'G열 12번, 13번 주세요' (Fila G, posti 12 e 13).", "sv": "Sumi sa 'G열 12번, 13번 주세요' (Rad G, plats 12 och 13).", "fi": "Sumi sanoi 'G열 12번, 13번 주세요' (Rivi G, paikat 12 ja 13).", "ja": "スミは「G열 12번, 13번 주세요」（G列12番、13番をください）と言いました。", "zh-CN": "수미说「G열 12번, 13번 주세요」（请给我G排12号和13号）。"}}, {"id": 2, "type": "comprehension", "questionAudio": "영화 두 장의 총 가격은 얼마예요?", "questionTrans": {"en": "What is the total price for two movie tickets?", "de": "Was ist der Gesamtpreis für zwei Kinokarten?", "fr": "Quel est le prix total pour deux billets de cinéma?", "es": "¿Cuál es el precio total de dos entradas de cine?", "pl": "Jaka jest łączna cena dwóch biletów do kina?", "it": "Qual è il prezzo totale per due biglietti del cinema?", "sv": "Vad är det totala priset för två biobiljetter?", "fi": "Mikä on kahden elokuvalipun kokonaishinta?", "ja": "映画2枚の合計金額はいくらですか？", "zh-CN": "两张电影票总共多少钱？"}, "options": [{"text": "1) 18,000원", "trans": {"en": "18,000 won", "de": "18.000 Won", "fr": "18 000 won", "es": "18,000 won", "pl": "18 000 wonów", "it": "18.000 won", "sv": "18 000 won", "fi": "18 000 wonia", "ja": "18,000ウォン", "zh-CN": "18,000韩元"}}, {"text": "2) 22,000원", "trans": {"en": "22,000 won", "de": "22.000 Won", "fr": "22 000 won", "es": "22,000 won", "pl": "22 000 wonów", "it": "22.000 won", "sv": "22 000 won", "fi": "22 000 wonia", "ja": "22,000ウォン", "zh-CN": "22,000韩元"}}, {"text": "3) 25,000원", "trans": {"en": "25,000 won", "de": "25.000 Won", "fr": "25 000 won", "es": "25,000 won", "pl": "25 000 wonów", "it": "25.000 won", "sv": "25 000 won", "fi": "25 000 wonia", "ja": "25,000ウォン", "zh-CN": "25,000韩元"}}, {"text": "4) 28,000원", "trans": {"en": "28,000 won", "de": "28.000 Won", "fr": "28 000 won", "es": "28,000 won", "pl": "28 000 wonów", "it": "28.000 won", "sv": "28 000 won", "fi": "28 000 wonia", "ja": "28,000ウォン", "zh-CN": "28,000韩元"}}], "answer": 1, "explanation": {"en": "Jimin said '총 22,000원이에요' (The total is 22,000 won).", "de": "Jimin sagte '총 22,000원이에요' (Insgesamt sind es 22.000 Won).", "fr": "Jimin a dit '총 22,000원이에요' (Le total est de 22 000 won).", "es": "Jimin dijo '총 22,000원이에요' (El total es 22,000 won).", "pl": "Jimin powiedział '총 22,000원이에요' (Łącznie to 22 000 wonów).", "it": "Jimin ha detto '총 22,000원이에요' (Il totale è 22.000 won).", "sv": "Jimin sa '총 22,000원이에요' (Totalt är det 22 000 won).", "fi": "Jimin sanoi '총 22,000원이에요' (Yhteensä 22 000 wonia).", "ja": "지민は「총 22,000원이에요」（合計22,000ウォンです）と言いました。", "zh-CN": "지민说「총 22,000원이에요」（总共22,000韩元）。"}}, {"id": 3, "type": "vocabulary", "questionAudio": "'좌석'은 무슨 뜻이에요?", "questionTrans": {"en": "What does '좌석' mean?", "de": "Was bedeutet '좌석'?", "fr": "Que signifie '좌석'?", "es": "¿Qué significa '좌석'?", "pl": "Co oznacza '좌석'?", "it": "Cosa significa '좌석'?", "sv": "Vad betyder '좌석'?", "fi": "Mitä '좌석' tarkoittaa?", "ja": "「좌석」はどういう意味ですか？", "zh-CN": "「좌석」是什么意思？"}, "options": [{"text": "1) 화면", "trans": {"en": "Screen", "de": "Leinwand", "fr": "Écran", "es": "Pantalla", "pl": "Ekran", "it": "Schermo", "sv": "Skärm", "fi": "Näyttö", "ja": "スクリーン", "zh-CN": "屏幕"}}, {"text": "2) 입장권", "trans": {"en": "Admission ticket", "de": "Eintrittskarte", "fr": "Billet d'entrée", "es": "Entrada", "pl": "Bilet wstępu", "it": "Biglietto d'ingresso", "sv": "Inträdesbiljett", "fi": "Sisäänpääsylippu", "ja": "入場券", "zh-CN": "入场券"}}, {"text": "3) 자리 / 좌석", "trans": {"en": "Seat", "de": "Platz / Sitz", "fr": "Place / siège", "es": "Asiento / butaca", "pl": "Miejsce / siedzenie", "it": "Posto / sedile", "sv": "Plats / säte", "fi": "Paikka / istuin", "ja": "席・座席", "zh-CN": "座位"}}, {"text": "4) 음식", "trans": {"en": "Food", "de": "Essen", "fr": "Nourriture", "es": "Comida", "pl": "Jedzenie", "it": "Cibo", "sv": "Mat", "fi": "Ruoka", "ja": "食べ物", "zh-CN": "食物"}}], "answer": 2, "explanation": {"en": "'좌석' means seat — the place where you sit in a theater or cinema.", "de": "'좌석' bedeutet Sitzplatz — der Platz, auf dem man im Theater oder Kino sitzt.", "fr": "'좌석' signifie siège — la place où on s'assoit dans un théâtre ou un cinéma.", "es": "'좌석' significa asiento — el lugar donde uno se sienta en un teatro o cine.", "pl": "'좌석' oznacza miejsce siedzące — miejsce, gdzie się siada w teatrze lub kinie.", "it": "'좌석' significa posto — il posto dove ci si siede in un teatro o cinema.", "sv": "'좌석' betyder plats — platsen där man sitter i en teater eller bio.", "fi": "'좌석' tarkoittaa paikkaa — paikka, johon istutaan teatterissa tai elokuvateatterissa.", "ja": "「좌석」は座席のことで、映画館や劇場に座る場所です。", "zh-CN": "「좌석」是座位的意思，即在剧场或电影院中坐的地方。"}}]},
  19: {"id": 19, "title": "19. 집 구하기", "titleTrans": {"en": "19. Finding a House / Apartment", "de": "19. Eine Wohnung suchen", "fr": "19. Chercher un logement", "es": "19. Buscar vivienda", "pl": "19. Szukanie mieszkania", "it": "19. Cercare casa", "sv": "19. Hitta bostad", "fi": "19. Asunnon etsiminen", "ja": "19. 家を探す", "zh-CN": "19. 找房子"}, "desc": "부동산에서 집을 구하는 대화를 연습합니다. 월세, 위치, 방 조건 등을 물어보는 표현을 배워 보세요.", "descTrans": {"en": "Practice conversations for finding a house at a real estate agency. Learn expressions for asking about rent, location, and room conditions.", "de": "Üben Sie Gespräche für die Wohnungssuche beim Makler.", "fr": "Entraînez-vous à chercher un logement dans une agence immobilière.", "es": "Practica conversaciones para buscar vivienda en una inmobiliaria.", "pl": "Ćwicz rozmowy o szukaniu mieszkania w agencji nieruchomości.", "it": "Esercitati nelle conversazioni per trovare casa in un'agenzia immobiliare.", "sv": "Öva på samtal för att hitta bostad på en mäklarbyrå.", "fi": "Harjoittele asunnon etsimistä kiinteistövälittäjältä.", "ja": "不動産で家を探す会話を練習します。", "zh-CN": "练习在房产中介找房子的对话，学习询问房租、位置、房间条件的表达。"}, "dialogue": [{"speaker": "수미", "text": "안녕하세요, 근처에 원룸 있어요?", "trans": {"en": "Hello, do you have any studio apartments nearby?", "de": "Hallo, haben Sie in der Nähe Einzimmerwohnungen?", "fr": "Bonjour, avez-vous des studios à proximité ?", "es": "Hola, ¿tienen estudios cerca?", "pl": "Cześć, czy majeście kawalerki w pobliżu?", "it": "Buongiorno, avete monolocali nelle vicinanze?", "sv": "Hej, har ni studiolägenheter i närheten?", "fi": "Hei, onko teillä yksiöitä lähellä?", "ja": "こんにちは、近くにワンルームはありますか？", "zh-CN": "你好，附近有单间吗？"}}, {"speaker": "지민", "text": "네, 있어요. 보증금하고 월세가 얼마나 되면 좋겠어요?", "trans": {"en": "Yes, we do. How much would you like for the deposit and monthly rent?", "de": "Ja, haben wir. Wie hoch sollte die Kaution und die Monatsmiete sein?", "fr": "Oui, nous en avons. Quel est votre budget pour la caution et le loyer mensuel ?", "es": "Sí, los tenemos. ¿Cuánto tiene en mente para el depósito y el alquiler mensual?", "pl": "Tak, mamy. Ile ma pan/pani na myśli jako kaucję i miesięczny czynsz?", "it": "Sì, ce n'è. Quanto vorrebbe per il deposito e l'affitto mensile?", "sv": "Ja, vi har. Hur mycket vill du ha för depositionsavgiften och månadsavgiften?", "fi": "Kyllä, on. Kuinka paljon haluaisit vakuudesta ja kuukausivuokrasta?", "ja": "はい、あります。保証金と月家賃はどれくらいをご希望ですか？", "zh-CN": "有的。您希望押金和月租各是多少？"}}, {"speaker": "수미", "text": "보증금 500에 월세 40 정도면 좋겠어요.", "trans": {"en": "I'd like a deposit of around 500 and monthly rent of about 40 (10,000 won units).", "de": "Ich hätte gerne eine Kaution von etwa 500 und eine Monatsmiete von etwa 40 (in 10.000-Won-Einheiten).", "fr": "Je préfèrerais un dépôt d'environ 500 et un loyer mensuel d'environ 40 (en unités de 10 000 won).", "es": "Me gustaría un depósito de unos 500 y un alquiler mensual de unos 40 (en unidades de 10.000 wones).", "pl": "Chciałabym kaucję około 500 i miesięczny czynsz około 40 (w jednostkach 10 000 wonów).", "it": "Vorrei un deposito di circa 500 e un affitto mensile di circa 40 (in unità da 10.000 won).", "sv": "Jag skulle vilja ha en deposition på ungefär 500 och en månadshyra på ungefär 40 (i enheter om 10 000 won).", "fi": "Haluaisin vakuuden noin 500 ja kuukausivuokran noin 40 (10 000 wonin yksiköissä).", "ja": "保証金500に月家賃40くらいがいいです（1万ウォン単位）。", "zh-CN": "押金500、月租40左右就好（万韩元单位）。"}}, {"speaker": "지민", "text": "근처에 괜찮은 원룸이 있어요. 보러 가실래요?", "trans": {"en": "There's a nice studio apartment nearby. Would you like to go see it?", "de": "Es gibt eine nette Einzimmerwohnung in der Nähe. Möchten Sie sie besichtigen?", "fr": "Il y a un joli studio à proximité. Voulez-vous aller le voir ?", "es": "Hay un estudio agradable cerca. ¿Le gustaría ir a verlo?", "pl": "Jest niedaleko fajna kawalerka. Chciałaby pani ją zobaczyć?", "it": "C'è un bel monolocale nelle vicinanze. Vuole andare a vederlo?", "sv": "Det finns en fin studiolgenhet i närheten. Vill du gå och titta på den?", "fi": "Lähellä on kiva yksiö. Haluaisitko mennä katsomaan sitä?", "ja": "近くに良いワンルームがあります。見に行きますか？", "zh-CN": "附近有一间不错的单间。要去看看吗？"}}, {"speaker": "수미", "text": "네, 좋아요. 지하철역에서 가까워요?", "trans": {"en": "Yes, sounds good. Is it close to the subway station?", "de": "Ja, gerne. Ist es nah an der U-Bahn-Station?", "fr": "Oui, avec plaisir. C'est proche de la station de métro ?", "es": "Sí, me parece bien. ¿Está cerca de la estación de metro?", "pl": "Tak, dobrze. Czy jest blisko stacji metra?", "it": "Sì, bene. È vicino alla stazione della metropolitana?", "sv": "Ja, bra. Är det nära tunnelbanestationen?", "fi": "Kyllä, hyvä. Onko se lähellä metroasemaa?", "ja": "はい、いいですね。地下鉄の駅から近いですか？", "zh-CN": "好的。离地铁站近吗？"}}, {"speaker": "지민", "text": "걸어서 5분이에요. 풀옵션이라 편리해요.", "trans": {"en": "It's 5 minutes on foot. It's fully furnished so it's convenient.", "de": "Es sind 5 Minuten zu Fuß. Es ist komplett möbliert, also sehr praktisch.", "fr": "C'est à 5 minutes à pied. Entièrement meublé, c'est très pratique.", "es": "Está a 5 minutos a pie. Está completamente amueblado, así que es conveniente.", "pl": "5 minut pieszo. Jest w pełni umeblowane, więc wygodne.", "it": "Sono 5 minuti a piedi. È completamente arredato, quindi è comodo.", "sv": "Det är 5 minuter till fots. Det är fullt möblerat, så det är bekvämt.", "fi": "Se on 5 minuutin kävely. Se on täysin kalustettu, joten se on kätevä.", "ja": "歩いて5分です。フル装備なので便利です。", "zh-CN": "步行5分钟。全套设施，很方便。"}}, {"speaker": "수미", "text": "그럼 언제 볼 수 있어요?", "trans": {"en": "Then when can I see it?", "de": "Wann kann ich es dann besichtigen?", "fr": "Alors, quand puis-je le voir ?", "es": "Entonces, ¿cuándo puedo verlo?", "pl": "Kiedy więc mogę to zobaczyć?", "it": "Allora quando posso vederlo?", "sv": "Då, när kan jag se den?", "fi": "Milloin voin sitten katsoa sitä?", "ja": "では、いつ見られますか？", "zh-CN": "那什么时候可以看？"}}], "vocab": [{"word": "원룸", "trans": {"en": "studio apartment (one-room)", "de": "Einzimmerwohnung", "fr": "studio", "es   20: {"id": 20, "title": "20. 직업과 직장 소개", "titleTrans": {"en": "20. Introducing Your Job and Workplace", "de": "20. Beruf und Arbeitsplatz vorstellen", "fr": "20. Présenter son métier et son lieu de travail", "es": "20. Presentar tu trabajo y lugar de trabajo", "pl": "20. Przedstawianie swojej pracy i miejsca pracy", "it": "20. Presentare il proprio lavoro e posto di lavoro", "sv": "20. Presentera ditt jobb och arbetsplats", "fi": "20. Työn ja työpaikan esittely", "ja": "20. 職業と職場の紹介", "zh-CN": "20. 介绍职业和工作单位"}, "desc": "자신의 직업과 직장에 대해 간단히 소개하는 방법을 연습합니다.", "descTrans": {"en": "Practice briefly introducing your job and workplace.", "de": "Üben Sie, Ihren Beruf und Ihren Arbeitsplatz kurz vorzustellen.", "fr": "Entraînez-vous à présenter brièvement votre métier et votre lieu de travail.", "es": "Practique presentar brevemente su trabajo y lugar de trabajo.", "pl": "Ćwicz krótkie przedstawianie swojej pracy i miejsca pracy.", "it": "Esercitati a presentare brevemente il tuo lavoro e posto di lavoro.", "sv": "Öva på att kortfattat presentera ditt jobb och arbetsplats.", "fi": "Harjoittele lyhyttä työn ja työpaikan esittelyä.", "ja": "自分の職業と職場を簡単に紹介する練習をします。", "zh-CN": "练习简单介绍自己的职业和工作单位。"}, "dialogue": [{"speaker": "지민", "text": "수미 씨, 무슨 일 하세요?", "trans": {"en": "Sumi, what do you do for work?", "de": "Sumi, was machen Sie beruflich?", "fr": "Sumi, que faites-vous comme travail?", "es": "Sumi, ¿a qué se dedica?", "pl": "Sumi, czym się Pani zajmuje?", "it": "Sumi, che lavoro fa?", "sv": "Sumi, vad jobbar du med?", "fi": "Sumi, mitä teet työksesi?", "ja": "スミさん、お仕事は何ですか？", "zh-CN": "수미，您是做什么工作的？"}}, {"speaker": "수미", "text": "저는 선생님이에요. 초등학교에서 일해요.", "trans": {"en": "I'm a teacher. I work at an elementary school.", "de": "Ich bin Lehrerin. Ich arbeite an einer Grundschule.", "fr": "Je suis enseignante. Je travaille dans une école primaire.", "es": "Soy profesora. Trabajo en una escuela primaria.", "pl": "Jestem nauczycielką. Pracuję w szkole podstawowej.", "it": "Sono un'insegnante. Lavoro in una scuola elementare.", "sv": "Jag är lärare. Jag jobbar på en grundskola.", "fi": "Olen opettaja. Työskentelen alakoulussa.", "ja": "私は先生です。小学校で働いています。", "zh-CN": "我是老师，在小学工作。"}}, {"speaker": "지민", "text": "언제부터 선생님을 하셨어요?", "trans": {"en": "Since when have you been a teacher?", "de": "Seit wann sind Sie Lehrerin?", "fr": "Depuis quand êtes-vous enseignante?", "es": "¿Desde cuándo es profesora?", "pl": "Od kiedy jest Pani nauczycielką?", "it": "Da quando fa l'insegnante?", "sv": "Sedan när har du jobbat som lärare?", "fi": "Kuinka kauan olet ollut opettaja?", "ja": "いつから先生をされていますか？", "zh-CN": "您从什么时候开始做老师的？"}}, {"speaker": "수미", "text": "5년 됐어요. 정말 좋아해요.", "trans": {"en": "It's been 5 years. I really love it.", "de": "Es sind 5 Jahre. Ich liebe es wirklich.", "fr": "Ça fait 5 ans. J'adore vraiment.", "es": "Han pasado 5 años. Me encanta de verdad.", "pl": "Minęło 5 lat. Naprawdę to kocham.", "it": "Sono 5 anni. Mi piace davvero.", "sv": "Det har gått 5 år. Jag älskar det verkligen.", "fi": "5 vuotta on kulunut. Todella pidän siitä.", "ja": "5年になります。本当に好きです。", "zh-CN": "已经5年了。我真的很喜欢。"}}, {"speaker": "지민", "text": "그렇군요. 저는 회사원이에요. IT 회사에 다녀요.", "trans": {"en": "I see. I'm an office worker. I work at an IT company.", "de": "Ich verstehe. Ich bin Büroangestellter. Ich arbeite bei einem IT-Unternehmen.", "fr": "Je vois. Je suis employé de bureau. Je travaille dans une entreprise informatique.", "es": "Ya veo. Soy empleado de oficina. Trabajo en una empresa de TI.", "pl": "Rozumiem. Jestem pracownikiem biurowym. Pracuję w firmie IT.", "it": "Capisco. Sono un impiegato. Lavoro in un'azienda IT.", "sv": "Jag förstår. Jag är kontorsanställd. Jag jobbar på ett IT-företag.", "fi": "Ymmärrän. Olen toimistotyöntekijä. Työskentelen IT-yrityksessä.", "ja": "そうですか。私は会社員です。IT会社に通っています。", "zh-CN": "原来如此。我是公司职员，在一家IT公司上班。"}}, {"speaker": "수미", "text": "재미있겠어요! 언제부터 거기서 일했어요?", "trans": {"en": "That sounds interesting! Since when have you worked there?", "de": "Das klingt interessant! Seit wann arbeiten Sie dort?", "fr": "Ça a l'air intéressant! Depuis quand travaillez-vous là-bas?", "es": "¡Suena interesante! ¿Desde cuándo trabajas allí?", "pl": "Brzmi ciekawie! Od kiedy tam pracujesz?", "it": "Sembra interessante! Da quando lavori lì?", "sv": "Det låter intressant! Sedan när jobbar du där?", "fi": "Kuulostaa mielenkiintoiselta! Kuinka kauan olet työskennellyt siellä?", "ja": "面白そうですね！いつからそこで働いていますか？", "zh-CN": "听起来很有趣！您从什么时候开始在那里工作的？"}}, {"speaker": "지민", "text": "3년 전부터요. 일이 바쁘지만 좋아요.", "trans": {"en": "Since 3 years ago. The work is busy but I like it.", "de": "Seit 3 Jahren. Die Arbeit ist stressig, aber ich mag sie.", "fr": "Depuis 3 ans. Le travail est chargé mais j'aime ça.", "es": "Desde hace 3 años. El trabajo es agitado pero me gusta.", "pl": "Od 3 lat. Praca jest zajęta, ale lubię ją.", "it": "Da 3 anni fa. Il lavoro è impegnativo ma mi piace.", "sv": "Sedan 3 år tillbaka. Arbetet är hektiskt men jag gillar det.", "fi": "Kolme vuotta sitten. Työ on kiireistä mutta pidän siitä.", "ja": "3年前からです。仕事は忙しいですが好きです。", "zh-CN": "从3年前开始。工作很忙，但我喜欢。"}}], "vocab": [{"word": "직업", "trans": {"en": "job / occupation", "de": "Beruf", "fr": "métier / profession", "es": "trabajo / profesión", "pl": "zawód / praca", "it": "lavoro / professione", "sv": "yrke / jobb", "fi": "ammatti / työ", "ja": "職業", "zh-CN": "职业/工作"}}, {"word": "선생님", "trans": {"en": "teacher", "de": "Lehrer/in", "fr": "professeur / enseignant", "es": "profesor/a / maestro/a", "pl": "nauczyciel/ka", "it": "insegnante / professore", "sv": "lärare", "fi": "opettaja", "ja": "先生", "zh-CN": "老师"}}, {"word": "회사원", "trans": {"en": "office worker / company employee", "de": "Büroangestellter / Firmenangestellter", "fr": "employé de bureau / salarié d'entreprise", "es": "empleado de oficina / trabajador de empresa", "pl": "pracownik biurowy", "it": "impiegato / dipendente aziendale", "sv": "kontorsanställd / företagsanställd", "fi": "toimistotyöntekijä", "ja": "会社員", "
