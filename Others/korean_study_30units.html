 "Vem är '언니'?", "fi": "Kuka on '언니'?", "ja": "「언니」は誰ですか？", "zh-CN": "'언니'是谁？"}, "options": [{"text": "남동생 (younger brother)", "trans": {"en": "Younger brother", "de": "Jüngerer Bruder", "fr": "Petit frère", "es": "Hermano menor", "pl": "Młodszy brat", "it": "Fratello minore", "sv": "Yngre bror", "fi": "Nuorempi veli", "ja": "弟", "zh-CN": "弟弟"}}, {"text": "어머니 (mother)", "trans": {"en": "Mother", "de": "Mutter", "fr": "Mère", "es": "Madre", "pl": "Matka", "it": "Madre", "sv": "Mor", "fi": "Äiti", "ja": "お母さん", "zh-CN": "妈妈"}}, {"text": "아버지 (father)", "trans": {"en": "Father", "de": "Vater", "fr": "Père", "es": "Padre", "pl": "Ojciec", "it": "Padre", "sv": "Far", "fi": "Isä", "ja": "お父さん", "zh-CN": "爸爸"}}, {"text": "여자가 부르는 여자 형제 중 언니 (older sister, said by a female)", "trans": {"en": "Older sister (used by female speakers)", "de": "Ältere Schwester (von weiblichen Sprechern verwendet)", "fr": "Grande sœur (utilisé par les locutrices)", "es": "Hermana mayor (usado por hablantes femeninas)", "pl": "Starsza siostra (używana przez kobiety)", "it": "Sorella maggiore (usato da parlanti femminili)", "sv": "Äldre syster (används av kvinnliga talare)", "fi": "Isosisko (naispuhujien käyttämä)", "ja": "お姉さん（女性が使う）", "zh-CN": "姐姐（女性说话者使用）"}}], "answer": 3, "explanation": {"en": "'언니' is used by female speakers to refer to their older sister. Male speakers say '누나' for an older sister.", "de": "'언니' wird von weiblichen Sprechern verwendet, um ihre ältere Schwester zu bezeichnen. Männliche Sprecher sagen '누나'.", "fr": "'언니' est utilisé par les locutrices pour désigner leur grande sœur. Les locuteurs masculins disent '누나'.", "es": "'언니' es usado por hablantes femeninas para referirse a su hermana mayor. Los hablantes masculinos dicen '누나'.", "pl": "'언니' jest używane przez kobiety do odnoszenia się do starszej siostry. Mężczyźni mówią '누나'.", "it": "'언니' è usato dalle parlanti femminili per riferirsi alla propria sorella maggiore. I parlanti maschili dicono '누나'.", "sv": "'언니' används av kvinnliga talare för att hänvisa till sin äldre syster. Manliga talare säger '누나'.", "fi": "'언니' käytetään naispuhujien toimesta viittaamaan isosiskoonsa. Miespuhujat sanovat '누나'.", "ja": "「언니」は女性が自分の姉を指すために使います。男性は「누나」と言います。", "zh-CN": "'언니'是女性说话者称呼自己姐姐的词。男性说话者称呼姐姐为'누나'。"}}, {"id": 3, "type": "grammar", "questionAudio": "지민 씨는 어디에 살아요?", "questionTrans": {"en": "Where does Jimin live?", "de": "Wo wohnt Jimin?", "fr": "Où habite Jimin ?", "es": "¿Dónde vive Jimin?", "pl": "Gdzie mieszka Jimin?", "it": "Dove vive Jimin?", "sv": "Var bor Jimin?", "fi": "Missä Jimin asuu?", "ja": "ジミンさんはどこに住んでいますか？", "zh-CN": "智敏住在哪里？"}, "options": [{"text": "부산에 혼자 살아요.", "trans": {"en": "Lives alone in Busan.", "de": "Wohnt allein in Busan.", "fr": "Vit seul(e) à Busan.", "es": "Vive solo/a en Busan.", "pl": "Mieszka sam/sama w Busanie.", "it": "Vive da solo/a a Busan.", "sv": "Bor ensam i Busan.", "fi": "Asuu yksin Busanissa.", "ja": "釜山で一人暮らしです。", "zh-CN": "在釜山一个人住。"}}, {"text": "서울에 가족과 살아요.", "trans": {"en": "Lives with family in Seoul.", "de": "Wohnt mit der Familie in Seoul.", "fr": "Vit avec sa famille à Séoul.", "es": "Vive con la familia en Seúl.", "pl": "Mieszka z rodziną w Seulu.", "it": "Vive con la famiglia a Seul.", "sv": "Bor med familjen i Seoul.", "fi": "Asuu perheen kanssa Soulissa.", "ja": "ソウルで家族と住んでいます。", "zh-CN": "在首尔和家人一起住。"}}, {"text": "부산에 가족과 살아요.", "trans": {"en": "Lives with family in Busan.", "de": "Wohnt mit der Familie in Busan.", "fr": "Vit avec sa famille à Busan.", "es": "Vive con la familia en Busan.", "pl": "Mieszka z rodziną w Busanie.", "it": "Vive con la famiglia a Busan.", "sv": "Bor med familjen i Busan.", "fi": "Asuu perheen kanssa Busanissa.", "ja": "釜山で家族と住んでいます。", "zh-CN": "在釜山和家人一起住。"}}, {"text": "서울에 혼자 살아요.", "trans": {"en": "Lives alone in Seoul.", "de": "Wohnt allein in Seoul.", "fr": "Vit seul(e) à Séoul.", "es": "Vive solo/a en Seúl.", "pl": "Mieszka sam/sama w Seulu.", "it": "Vive da solo/a a Seul.", "sv": "Bor ensam i Seoul.", "fi": "Asuu yksin Soulissa.", "ja": "ソウルで一人暮らしです。", "zh-CN": "在首尔一个人住。"}}], "answer": 3, "explanation": {"en": "Jimin said '저는 서울에서 혼자 살아요', meaning he/she lives alone in Seoul.", "de": "Jimin sagte '저는 서울에서 혼자 살아요', was bedeutet, er/sie wohnt allein in Seoul.", "fr": "Jimin a dit '저는 서울에서 혼자 살아요', ce qui signifie qu'il/elle vit seul(e) à Séoul.", "es": "Jimin dijo '저는 서울에서 혼자 살아요', que significa que vive solo/a en Seúl.", "pl": "Jimin powiedział '저는 서울에서 혼자 살아요', co oznacza, że mieszka sam/sama w Seulu.", "it": "Jimin ha detto '저는 서울에서 혼자 살아요', che significa che vive da solo/a a Seul.", "sv": "Jimin sa '저는 서울에서 혼자 살아요', vilket betyder att han/hon bor ensam i Seoul.", "fi": "Jimin sanoi '저는 서울에서 혼자 살아요', mikä tarkoittaa, että hän asuu yksin Soulissa.", "ja": "ジミンさんは「저는 서울에서 혼자 살아요」と言い、ソウルで一人暮らしであることを意味します。", "zh-CN": "智敏说'저는 서울에서 혼자 살아요'，意思是他/她在首尔一个人住。"}}, {"type": "comprehension", "questionAudio": "지민 씨 언니는 어디서 일해요?", "questionTrans": {"en": "Where does Jimin's older sister work?", "de": "Wo arbeitet Jimins Schwester?", "fr": "Où travaille la sœur de Jimin ?", "es": "¿Dónde trabaja la hermana de Jimin?", "pl": "Gdzie pracuje siostra Jimina?", "it": "Dove lavora la sorella di Jimin?", "sv": "Var jobbar Jimins syster?", "fi": "Missä Jiminin sisko työskentelee?", "ja": "ジミンさんのお姉さんはどこで働いていますか？", "zh-CN": "智敏的姐姐在哪里工作？"}, "options": [{"text": "병원에서 일해요.", "trans": {"en": "At a hospital.", "de": "Im Krankenhaus.", "fr": "À l'hôpital.", "es": "En un hospital.", "pl": "W szpitalu.", "it": "In ospedale.", "sv": "På ett sjukhus.", "fi": "Sairaalassa.", "ja": "病院で。", "zh-CN": "在医院。"}}, {"text": "학교에서 일해요.", "trans": {"en": "At a school.", "de": "An einer Schule.", "fr": "Dans une école.", "es": "En una escuela.", "pl": "W szkole.", "it": "In una scuola.", "sv": "På en skola.", "fi": "Koulussa.", "ja": "学校で。", "zh-CN": "在学校。"}}, {"text": "회사에 다녀요.", "trans": {"en": "At a company.", "de": "In einem Unternehmen.", "fr": "Dans une entreprise.", "es": "En una empresa.", "pl": "W firmie.", "it": "In un'azienda.", "sv": "På ett företag.", "fi": "Yrityksessä.", "ja": "会社に。", "zh-CN": "在公司。"}}, {"text": "가게에서 일해요.", "trans": {"en": "At a store.", "de": "In einem Laden.", "fr": "Dans un magasin.", "es": "En una tienda.", "pl": "W sklepie.", "it": "In un negozio.", "sv": "I en butik.", "fi": "Kaupassa.", "ja": "お店で。", "zh-CN": "在店里。"}}], "answer": 2, "explanation": {"en": "Jimin says 지금 회사에 다녀요 (She works at a company now).", "de": "Jimin sagt 지금 회사에 다녀요.", "fr": "Jimin dit 지금 회사에 다녀요.", "es": "Jimin dice 지금 회사에 다녀요.", "pl": "Jimin mówi 지금 회사에 다녀요.", "it": "Jimin dice 지금 회사에 다녀요.", "sv": "Jimin säger 지금 회사에 다녀요.", "fi": "Jimin sanoo 지금 회사에 다녀요.", "ja": "ジミンは지금 회사에 다녀요と言います。", "zh-CN": "智敏说지금 회사에 다녀요。"}}]},
  7: {"id": 7, "title": "7. 전화 통화하기", "titleTrans": {"en": "7. Making a Phone Call", "de": "7. Telefonieren", "fr": "7. Passer un appel téléphonique", "es": "7. Hacer una llamada telefónica", "pl": "7. Rozmawianie przez telefon", "it": "7. Fare una telefonata", "sv": "7. Ringa ett samtal", "fi": "7. Puhelun soittaminen", "ja": "7. 電話する", "zh-CN": "7. 打电话"}, "desc": "전화로 용건을 말하고 메시지를 남기는 방법을 배웁니다.", "descTrans": {"en": "Learn how to state your purpose and leave a message on the phone.", "de": "Lernen Sie, wie man am Telefon sein Anliegen äußert und eine Nachricht hinterlässt.", "fr": "Apprenez à exprimer votre objet et à laisser un message au téléphone.", "es": "Aprende a expresar tu motivo y dejar un mensaje por teléfono.", "pl": "Naucz się jak podawać cel rozmowy i zostawiać wiadomości przez telefon.", "it": "Impara a esprimere il tuo scopo e lasciare un messaggio al telefono.", "sv": "Lär dig att ange ditt syfte och lämna ett meddelande i telefon.", "fi": "Opi ilmaisemaan tarkoituksesi ja jättämään viesti puhelimessa.", "ja": "電話で用件を伝えたりメッセージを残す方法を学びます。", "zh-CN": "学习如何在电话中说明来电原因和留言。"}, "dialogue": [{"speaker": "수미", "text": "여보세요?", "trans": {"en": "Hello?", "de": "Hallo?", "fr": "Allô ?", "es": "¿Aló?", "pl": "Halo?", "it": "Pronto?", "sv": "Hallå?", "fi": "Hei?", "ja": "もしもし？", "zh-CN": "喂？"}}, {"speaker": "지민", "text": "여보세요, 수미 씨? 저 지민이에요.", "trans": {"en": "Hello, Sumi? It's me, Jimin.", "de": "Hallo, Sumi? Ich bin Jimin.", "fr": "Allô, Sumi ? C'est moi, Jimin.", "es": "Hola, ¿Sumi? Soy yo, Jimin.", "pl": "Halo, Sumi? To ja, Jimin.", "it": "Pronto, Sumi? Sono io, Jimin.", "sv": "Hallå, Sumi? Det är jag, Jimin.", "fi": "Hei, Sumi? Minä olen Jimin.", "ja": "もしもし、スミさん？私、ジミンです。", "zh-CN": "喂，秀美吗？我是智敏。"}}, {"speaker": "수미", "text": "아, 지민 씨! 무슨 일이에요?", "trans": {"en": "Oh, Jimin! What's going on?", "de": "Oh, Jimin! Was ist los?", "fr": "Oh, Jimin ! Qu'est-ce qu'il y a ?", "es": "¡Oh, Jimin! ¿Qué pasa?", "pl": "Ach, Jimin! Co się stało?", "it": "Oh, Jimin! Cosa c'è?", "sv": "Å, Jimin! Vad är det?", "fi": "Voi, Jimin! Mitä tapahtui?", "ja": "あ、ジミンさん！どうしましたか？", "zh-CN": "哦，智敏！什么事？"}}, {"speaker": "지민", "text": "내일 같이 영화 보러 갈 수 있어요?", "trans": {"en": "Can we go see a movie together tomorrow?", "de": "Können wir morgen zusammen ins Kino gehen?", "fr": "Est-ce qu'on peut aller voir un film ensemble demain ?", "es": "¿Podemos ir a ver una película juntos mañana?", "pl": "Czy możemy jutro razem pójść na film?", "it": "Possiamo andare a vedere un film insieme domani?", "sv": "Kan vi gå och se en film tillsammans imorgon?", "fi": "Voimmeko mennä katsomaan elokuvaa yhdessä huomenna?", "ja": "明日一緒に映画を見に行けますか？", "zh-CN": "明天可以一起去看电影吗？"}}, {"speaker": "수미", "text": "좋아요! 몇 시에 만날까요?", "trans": {"en": "Sure! What time shall we meet?", "de": "Gerne! Um wie viel Uhr sollen wir uns treffen?", "fr": "Avec plaisir ! À quelle heure on se retrouve ?", "es": "¡De acuerdo! ¿A qué hora nos vemos?", "pl": "Chętnie! O której się spotkamy?", "it": "Va bene! A che ora ci incontriamo?", "sv": "Jättebra! Vilken tid ska vi träffas?", "fi": "Hienoa! Mihin aikaan tavataan?", "ja": "いいですよ！何時に会いましょうか？", "zh-CN": "好啊！几点见面？"}}, {"speaker": "지민", "text": "오후 두 시 어때요?", "trans": {"en": "How about 2 PM?", "de": "Wie wäre es mit 14 Uhr?", "fr": "Que diriez-vous de 14h ?", "es": "¿Qué tal a las 2 de la tarde?", "pl": "Co powiesz na godzinę 14:00?", "it": "Che ne dici delle 14?", "sv": "Hur är klockan 14?", "fi": "Entä kello 14?", "ja": "午後2時はどうですか？", "zh-CN": "下午两点怎么样？"}}, {"speaker": "수미", "text": "좋아요. 그럼 영화관 앞에서 봐요!", "trans": {"en": "Sounds good. Let's meet in front of the cinema!", "de": "Gut. Dann treffen wir uns vor dem Kino!", "fr": "Parfait. On se retrouve devant le cinéma !", "es": "¡Perfecto. Nos vemos enfrente del cine!", "pl": "Dobrze. To widzimy się przed kinem!", "it": "Perfetto. Allora ci vediamo davanti al cinema!", "sv": "Bra. Då ses vi framför biografen!", "fi": "Selvä. Tavataan elokuvateatterin edessä!", "ja": "いいですね。では映画館の前で会いましょう！", "zh-CN": "好的。那在电影院前面见！"}}], "vocab": [{"word": "여보세요", "trans": {"en": "Hello (on the phone)", "de": "Hallo (am Telefon)", "fr": "Allô (au téléphone)", "es": "Aló / Diga (al teléfono)", "pl": "Halo (przez telefon)", "it": "Pronto (al telefono)", "sv": "Hallå (i telefon)", "fi": "Hei (puhelimessa)", "ja": "もしもし（電話で）", "zh-CN": "喂（打电话）"}}, {"word": "전화", "trans": {"en": "Phone / telephone call", "de": "Telefon / Anruf", "fr": "Téléphone / appel", "es": "Teléfono / llamada", "pl": "Telefon / połączenie", "it": "Telefono / chiamata", "sv": "Telefon / samtal", "fi": "Puhelin / puhelu", "ja": "電話", "zh-CN": "电话"}}, {"word": "무슨 일이에요?", "trans": {"en": "What's the matter? / What's going on?", "de": "Was ist los?", "fr": "Qu'est-ce qu'il y a ?", "es": "¿Qué pasa?", "pl": "Co się stało?", "it": "Cosa c'è?", "sv": "Vad är det?", "fi": "Mitä tapahtui?", "ja": "どうしましたか？", "zh-CN": "什么事？"}}, {"word": "같이", "trans": {"en": "Together", "de": "Zusammen", "fr": "Ensemble", "es": "Juntos", "pl": "Razem", "it": "Insieme", "sv": "Tillsammans", "fi": "Yhdessä", "ja": "一緒に", "zh-CN": "一起"}}, {"word": "영화", "trans": {"en": "Movie / film", "de": "Film / Kino", "fr": "Film / cinéma", "es": "Película / cine", "pl": "Film", "it": "Film / cinema", "sv": "Film / bio", "fi": "Elokuva", "ja": "映画", "zh-CN": "电影"}}, {"word": "몇 시", "trans": {"en": "What time", "de": "Wie viel Uhr", "fr": "Quelle heure", "es": "Qué hora", "pl": "Która godzina", "it": "Che ora", "sv": "Vilken tid", "fi": "Mihin aikaan", "ja": "何時", "zh-CN": "几点"}}, {"word": "오후", "trans": {"en": "Afternoon / PM", "de": "Nachmittag / PM", "fr": "Après-midi / PM", "es": "Tarde / PM", "pl": "Popołudnie", "it": "Pomeriggio / PM", "sv": "Eftermiddag / PM", "fi": "Iltapäivä", "ja": "午後", "zh-CN": "下午/PM"}}, {"word": "영화관", "trans": {"en": "Cinema / movie theater", "de": "Kino", "fr": "Cinéma", "es": "Cine", "pl": "Kino", "it": "Cinema", "sv": "Biograf", "fi": "Elokuvateatteri", "ja": "映画館", "zh-CN": "电影院"}}, {"word": "앞에서", "trans": {"en": "In front of", "de": "Vor", "fr": "Devant", "es": "Delante de / en frente de", "pl": "Przed", "it": "Davanti a", "sv": "Framför", "fi": "Edessä", "ja": "の前で", "zh-CN": "在...前面"}}, {"word": "만나다", "trans": {"en": "To meet", "de": "Sich treffen", "fr": "Se rencontrer", "es": "Conocerse / encontrarse", "pl": "Spotykać się", "it": "Incontrarsi", "sv": "Träffas", "fi": "Tavata", "ja": "会う", "zh-CN": "见面"}}], "patterns": [{"pattern": "저 [이름]이에요/예요. (전화에서)", "patternTrans": {"en": "It's me, [name]. (on the phone)", "de": "Ich bin [Name]. (am Telefon)", "fr": "C'est moi, [prénom]. (au téléphone)", "es": "Soy yo, [nombre]. (por teléfono)", "pl": "To ja, [imię]. (przez telefon)", "it": "Sono io, [nome]. (al telefono)", "sv": "Det är jag, [namn]. (i telefon)", "fi": "Minä olen [nimi]. (puhelimessa)", "ja": "私、[名前]です。（電話で）", "zh-CN": "我是[名字]。（电话中）"}, "example": "저 지민이에요.", "trans": {"en": "It's me, Jimin.", "de": "Ich bin Jimin.", "fr": "C'est moi, Jimin.", "es": "Soy yo, Jimin.", "pl": "To ja, Jimin.", "it": "Sono io, Jimin.", "sv": "Det är jag, Jimin.", "fi": "Minä olen Jimin.", "ja": "私、ジミンです。", "zh-CN": "我是智敏。"}}, {"pattern": "[활동] 갈 수 있어요?", "patternTrans": {"en": "Can you go [activity]?", "de": "Können Sie [Aktivität] gehen?", "fr": "Vous pouvez aller [activité] ?", "es": "¿Puedes ir [actividad]?", "pl": "Czy możesz pójść [czynność]?", "it": "Puoi andare [attività]?", "sv": "Kan du gå [aktivitet]?", "fi": "Voitko mennä [aktiviteetti]?", "ja": "[活動]に行けますか？", "zh-CN": "可以去[活动]吗？"}, "example": "영화 보러 갈 수 있어요?", "trans": {"en": "Can you go see a movie?", "de": "Können Sie einen Film sehen gehen?", "fr": "Vous pouvez aller voir un film ?", "es": "¿Puedes ir a ver una película?", "pl": "Czy możesz pójść zobaczyć film?", "it": "Puoi andare a vedere un film?", "sv": "Kan du gå och se en film?", "fi": "Voitko mennä katsomaan elokuvaa?", "ja": "映画を見に行けますか？", "zh-CN": "可以去看电影吗？"}}, {"pattern": "[장소] 앞에서 봐요!", "patternTrans": {"en": "Let's meet in front of [place]!", "de": "Treffen wir uns vor [Ort]!", "fr": "On se retrouve devant [lieu] !", "es": "¡Nos vemos enfrente de [lugar]!", "pl": "Spotkajmy się przed [miejscem]!", "it": "Ci vediamo davanti a [luogo]!", "sv": "Vi ses framför [plats]!", "fi": "Tavataan [paikan] edessä!", "ja": "[場所]の前で会いましょう！", "zh-CN": "在[地方]前面见！"}, "example": "영화관 앞에서 봐요!", "trans": {"en": "Let's meet in front of the cinema!", "de": "Treffen wir uns vor dem Kino!", "fr": "On se retrouve devant le cinéma !", "es": "¡Nos vemos enfrente del cine!", "pl": "Spotkajmy się przed kinem!", "it": "Ci vediamo davanti al cinema!", "sv": "Vi ses framför biografen!", "fi": "Tavataan elokuvateatterin edessä!", "ja": "映画館の前で会いましょう！", "zh-CN": "在电影院前面见！"}}], "quizzes": [{"id": 1, "type": "comprehension", "questionAudio": "지민 씨는 왜 전화했어요?", "questionTrans": {"en": "Why did Jimin call?", "de": "Warum hat Jimin angerufen?", "fr": "Pourquoi Jimin a-t-il/elle appelé(e) ?", "es": "¿Por qué llamó Jimin?", "pl": "Dlaczego Jimin zadzwonił/a?", "it": "Perché Jimin ha chiamato?", "sv": "Varför ringde Jimin?", "fi": "Miksi Jimin soitti?", "ja": "ジミンさんはなぜ電話しましたか？", "zh-CN": "智敏为什么打电话？"}, "options": [{"text": "같이 밥 먹으러", "trans": {"en": "To eat together", "de": "Um zusammen zu essen", "fr": "Pour manger ensemble", "es": "Para comer juntos", "pl": "Żeby razem zjeść", "it": "Per mangiare insieme", "sv": "För att äta tillsammans", "fi": "Syödäkseen yhdessä", "ja": "一緒に食事をするため", "zh-CN": "一起吃饭"}}, {"text": "같이 영화 보러", "trans": {"en": "To see a movie together", "de": "Um zusammen einen Film zu sehen", "fr": "Pour voir un film ensemble", "es": "Para ver una película juntos", "pl": "Żeby razem obejrzeć film", "it": "Per vedere un film insieme", "sv": "För att se en film tillsammans", "fi": "Katsomaan elokuvaa yhdessä", "ja": "一緒に映画を見るため", "zh-CN": "一起看电影"}}, {"text": "도움을 요청하러", "trans": {"en": "To ask for help", "de": "Um um Hilfe zu bitten", "fr": "Pour demander de l'aide", "es": "Para pedir ayuda", "pl": "Żeby poprosić o pomoc", "it": "Per chiedere aiuto", "sv": "   8: {"id": 8, "title": "8. 약속 정하기", "titleTrans": {"en": "8. Making Plans", "de": "8. Verabredungen treffen", "fr": "8. Fixer un rendez-vous", "es": "8. Hacer planes", "pl": "8. Umawianie się", "it": "8. Fissare un appuntamento", "sv": "8. Boka en tid", "fi": "8. Sopimusten tekeminen", "ja": "8. 約束を決める", "zh-CN": "8. 约定时间"}, "desc": "날짜와 시간을 정해 약속하는 표현을 배웁니다.", "descTrans": {"en": "Learn expressions for setting dates and times for appointments.", "de": "Lernen Sie Ausdrücke zum Festlegen von Terminen.", "fr": "Apprenez des expressions pour fixer des rendez-vous.", "es": "Aprende expresiones para fijar fechas y horas de citas.", "pl": "Naucz się wyrażeń do ustalania spotkań.", "it": "Impara espressioni per fissare appuntamenti.", "sv": "Lär dig uttryck för att boka tider.", "fi": "Opi ilmaisuja tapaamisten sopimiseen.", "ja": "日付と時間を決めて約束する表現を学びます。", "zh-CN": "学习确定日期和时间的约定表达。"}, "dialogue": [{"speaker": "지민", "text": "수미 씨, 이번 주말에 시간 있어요?", "trans": {"en": "Sumi, do you have time this weekend?", "de": "Sumi, haben Sie dieses Wochenende Zeit?", "fr": "Sumi, vous avez du temps ce week-end ?", "es": "Sumi, ¿tienes tiempo este fin de semana?", "pl": "Sumi, czy masz czas w ten weekend?", "it": "Sumi, hai tempo questo fine settimana?", "sv": "Sumi, har du tid den här helgen?", "fi": "Sumi, onko sinulla aikaa tänä viikonloppuna?", "ja": "スミさん、今週末は時間ありますか？", "zh-CN": "秀美，这个周末有时间吗？"}}, {"speaker": "수미", "text": "토요일은 바빠요. 일요일은 괜찮아요.", "trans": {"en": "Saturday I'm busy. Sunday is fine.", "de": "Samstag bin ich beschäftigt. Sonntag ist in Ordnung.", "fr": "Samedi je suis occupé(e). Dimanche ça va.", "es": "El sábado estoy ocupado/a. El domingo está bien.", "pl": "W sobotę jestem zajęty/a. Niedziela jest w porządku.", "it": "Sabato sono occupato/a. Domenica va bene.", "sv": "Lördag är jag upptagen. Söndag är bra.", "fi": "Lauantaina olen kiireinen. Sunnuntai sopii.", "ja": "土曜日は忙しいです。日曜日は大丈夫です。", "zh-CN": "周六很忙。周日可以。"}}, {"speaker": "지민", "text": "그럼 일요일 오전 열 시 어때요?", "trans": {"en": "Then how about Sunday at 10 AM?", "de": "Dann wie wäre es mit Sonntag um 10 Uhr?", "fr": "Alors, que diriez-vous de dimanche à 10h ?", "es": "¿Entonces qué tal el domingo a las 10 de la mañana?", "pl": "To co powiesz na niedzielę o dziesiątej rano?", "it": "Allora che ne dici di domenica alle 10 di mattina?", "sv": "Då, hur är söndag klockan 10?", "fi": "Sitten kuinka on sunnuntai kello 10?", "ja": "では日曜日の午前10時はどうですか？", "zh-CN": "那周日上午十点怎么样？"}}, {"speaker": "수미", "text": "좋아요. 어디서 만나요?", "trans": {"en": "Sounds good. Where do we meet?", "de": "Gut. Wo treffen wir uns?", "fr": "D'accord. On se retrouve où ?", "es": "Bien. ¿Dónde nos vemos?", "pl": "Dobrze. Gdzie się spotykamy?", "it": "Va bene. Dove ci incontriamo?", "sv": "Bra. Var träffas vi?", "fi": "Selvä. Missä tavataan?", "ja": "いいですね。どこで会いますか？", "zh-CN": "好的。在哪里见面？"}}, {"speaker": "지민", "text": "홍대 입구역 1번 출구에서 만나요.", "trans": {"en": "Let's meet at Hongdae Station, Exit 1.", "de": "Treffen wir uns am Hongdae Bahnhof, Ausgang 1.", "fr": "On se retrouve à la station Hongdae, sortie 1.", "es": "Quedamos en la estación de Hongdae, salida 1.", "pl": "Spotkajmy się przy stacji Hongdae, wyjście 1.", "it": "Ci incontriamo alla stazione di Hongdae, uscita 1.", "sv": "Vi träffas vid Hongdae-stationen, utgång 1.", "fi": "Tavataan Hongdae-asemalla, uloskäynti 1.", "ja": "弘大入口駅の1番出口で会いましょう。", "zh-CN": "在弘大入口站1号出口见面。"}}, {"speaker": "수미", "text": "알겠어요. 그럼 일요일에 봐요!", "trans": {"en": "Got it. See you on Sunday!", "de": "Verstanden. Bis Sonntag!", "fr": "D'accord. À dimanche !", "es": "Entendido. ¡Nos vemos el domingo!", "pl": "Rozumiem. Do zobaczenia w niedzielę!", "it": "Capito. Ci vediamo domenica!", "sv": "Förstår. Vi ses på söndag!", "fi": "Selvä. Nähdään sunnuntaina!", "ja": "わかりました。では日曜日に！", "zh-CN": "好的。那周日见！"}}], "vocab": [{"word": "이번 주말", "trans": {"en": "This weekend", "de": "Dieses Wochenende", "fr": "Ce week-end", "es": "Este fin de semana", "pl": "Ten weekend", "it": "Questo fine settimana", "sv": "Den antai", "ja": "金曜日", "zh-CN": "周五"}}], "answer": 2, "explanation": {"en": "Sumi said '토요일은 바빠요. 일요일은 괜찮아요.' — Saturday is busy, Sunday is free.", "de": "Sumi sagte '토요일은 바빠요. 일요일은 괜찮아요.' — Samstag ist beschäftigt, Sonntag ist frei.", "fr": "Sumi a dit '토요일은 바빠요. 일요일은 괜찮아요.' — samedi est chargé, dimanche est libre.", "es": "Sumi dijo '토요일은 바빠요. 일요일은 괜찮아요.' — el sábado está ocupado, el domingo está libre.", "pl": "Sumi powiedział/a '토요일은 바빠요. 일요일은 괜찮아요.' — w sobotę jest zajęty/a, niedziela jest wolna.", "it": "Sumi ha detto '토요일은 바빠요. 일요일은 괜찮아요.' — sabato è impegnato/a, domenica è libero/a.", "sv": "Sumi sa '토요일은 바빠요. 일요일은 괜찮아요.' — lördag är upptagen, söndag är ledig.", "fi": "Sumi sanoi '토요일은 바빠요. 일요일은 괜찮아요.' — lauantai on kiireinen, sunnuntai on vapaa.", "ja": "スミさんは「토요일은 바빠요. 일요일은 괜찮아요.」と言いました。土曜日は忙しく、日曜日は空いています。", "zh-CN": "秀美说'토요일은 바빠요. 일요일은 괜찮아요.'——周六忙，周日有空。"}}, {"id": 2, "type": "grammar", "questionAudio": "'괜찮아요'는 무슨 뜻이에요?", "questionTrans": {"en": "What does '괜찮아요' mean?", "de": "Was bedeutet '괜찮아요'?", "fr": "Que signifie '괜찮아요' ?", "es": "¿Qué significa '괜찮아요'?", "pl": "Co oznacza '괜찮아요'?", "it": "Cosa significa '괜찮아요'?", "sv": "Vad betyder '괜찮아요'?", "fi": "Mitä '괜찮아요' tarkoittaa?", "ja": "「괜찮아요」はどういう意味ですか？", "zh-CN": "'괜찮아요'是什么意思？"}, "options": [{"text": "바빠요 (busy)", "trans": {"en": "Busy", "de": "Beschäftigt", "fr": "Occupé", "es": "Ocupado", "pl": "Zajęty", "it": "Occupato", "sv": "Upptagen", "fi": "Kiireinen", "ja": "忙しい", "zh-CN": "忙"}}, {"text": "피곤해요 (tired)", "trans": {"en": "Tired", "de": "Müde", "fr": "Fatigué", "es": "Cansado", "pl": "Zmęczony", "it": "Stanco", "sv": "Trött", "fi": "Väsynyt", "ja": "疲れている", "zh-CN": "累"}}, {"text": "괜찮아요 = 좋아요 / 문제없어요 (okay / no problem)", "trans": {"en": "Okay / no problem / fine", "de": "Okay / kein Problem / gut", "fr": "D'accord / pas de problème / bien", "es": "Bien / sin problema / de acuerdo", "pl": "Okay / bez problemu / w porządku", "it": "Okay / nessun problema / bene", "sv": "Okej / inga problem / bra", "fi": "Okei / ei ongelmaa / hyvin", "ja": "大丈夫/問題ない", "zh-CN": "可以/没问题/好的"}}, {"text": "모르겠어요 (I don't know)", "trans": {"en": "I don't know", "de": "Ich weiß nicht", "fr": "Je ne sais pas", "es": "No lo sé", "pl": "Nie wiem", "it": "Non lo so", "sv": "Jag vet inte", "fi": "En tiedä", "ja": "わかりません", "zh-CN": "我不知道"}}], "answer": 2, "explanation": {"en": "'괜찮아요' means okay, fine, or no problem. It can also mean 'Are you okay?' as a question.", "de": "'괜찮아요' bedeutet okay, gut oder kein Problem. Als Frage kann es auch 'Sind Sie in Ordnung?' bedeuten.", "fr": "'괜찮아요' signifie d'accord, bien ou pas de problème. En question, cela peut aussi signifier 'Vous allez bien ?'", "es": "'괜찮아요' significa bien, de acuerdo o sin problema. Como pregunta puede significar '¿Estás bien?'", "pl": "'괜찮아요' oznacza okay, dobrze lub bez problemu. Jako pytanie może też oznaczać 'Czy wszystko w porządku?'", "it": "'괜찮아요' significa okay, bene o nessun problema. Come domanda può anche significare 'Stai bene?'", "sv": "'괜찮아요' betyder okej, bra eller inga problem. Som fråga kan det också betyda 'Mår du bra?'", "fi": "'괜찮아요' tarkoittaa okei, hyvin tai ei ongelmaa. Kysymyksenä se voi myös tarkoittaa 'Oletko kunnossa?'", "ja": "「괜찮아요」は「大丈夫」「いい」「問題ない」を意味します。疑問文では「大丈夫ですか？」の意味にもなります。", "zh-CN": "'괜찮아요'意思是可以、好的或没问题。作为疑问句也可以表示'你还好吗？'"}}, {"id": 3, "type": "comprehension", "questionAudio": "두 사람은 몇 시에 만나요?", "questionTrans": {"en": "What time do the two people meet?", "de": "Um wie viel Uhr treffen sich die beiden?", "fr": "À quelle heure se retrouvent les deux personnes ?", "es": "¿A qué hora se encuentran las dos personas?", "pl": "O której spotykają się te dwie osoby?", "it": "A che ora si incontrano le due persone?", "sv": "Vilken tid träffas de två?", "fi": "Mihin aikaan he kaksi tapaavat?", "ja": "二人は何時に会いますか？", "zh-CN": "两人几点见面？"}, "options": [{"text": "오전 아홉 시", "trans": {"en": "9 AM", "de": "9 Uhr", "fr": "9h", "es": "9 AM", "pl": "9 rano", "it": "9 AM", "sv": "9 FM", "fi": "Kello 9", "ja": "午前9時", "zh-CN": "上午9点"}}, {"text": "오후 두 시", "trans": {"en": "2 PM", "de": "14 Uhr", "fr": "14h", "es": "2 PM", "pl": "14:00", "it": "2 PM", "sv": "14:00", "fi": "Kello 14", "ja": "午後2時", "zh-CN": "下午2点"}}, {"text": "오후 열두 시", "trans": {"en": "12 PM (noon)", "de": "12 Uhr (Mittag)", "fr": "12h (midi)", "es": "12 PM (mediodía)", "pl": "12:00 (południe)", "it": "12 PM (mezzogiorno)", "sv": "12:00 (middag)", "fi": "Kello 12 (puolipäivä)", "ja": "正午12時", "zh-CN": "中午12点"}}, {"text": "오전 열 시", "trans": {"en": "10 AM", "de": "10 Uhr", "fr": "10h", "es": "10 AM", "pl": "10 rano", "it": "10 AM", "sv": "10 FM", "fi": "Kello 10", "ja": "午前10時", "zh-CN": "上午10点"}}], "answer": 3, "explanation": {"en": "Jimin suggested '일요일 오전 열 시' which is 10 AM on Sunday.", "de": "Jimin schlug '일요일 오전 열 시' vor, also 10 Uhr am Sonntag.", "fr": "Jimin a suggéré '일요일 오전 열 시', soit 10h dimanche.", "es": "Jimin sugirió '일요일 오전 열 시', es decir las 10 AM del domingo.", "pl": "Jimin zaproponował/a '일요일 오전 열 시', czyli 10 rano w niedzielę.", "it": "Jimin ha suggerito '일요일 오전 열 시', ovvero le 10 di domenica mattina.", "sv": "Jimin föreslog '일요일 오전 열 시' vilket är klockan 10 på söndag.", "fi": "Jimin ehdotti '일요일 오전 열 시' eli kello 10 sunnuntaiaamuna.", "ja": "ジミンさんは「일요일 오전 열 시」つまり日曜日の午前10時を提案しました。", "zh-CN": "智敏提议'일요일 오전 열 시'，即周日上午10点。"}}]},
  9: {"id": 9, "title": "9. 길 묻기", "titleTrans": {"en": "9. Asking for Directions", "de": "9. Nach dem Weg fragen", "fr": "9. Demander son chemin", "es": "9. Pedir indicaciones", "pl": "9. Pytanie o drogę", "it": "9. Chiedere indicazioni", "sv": "9. Fråga om vägen", "fi": "9. Tien kysyminen", "ja": "9. 道を尋ねる", "zh-CN": "9. 问路"}, "desc": "모르는 길을 물어보고 안내하는 대화를 연습합니다. 위치와 방향을 나타내는 표현을 배워 보세요.", "descTrans": {"en": "Practice conversations for asking and giving directions. Learn expressions for location and directions.", "de": "Üben Sie Gespräche zum Fragen und Erklären von Wegen.", "fr": "Entraînez-vous à demander et donner des directions.", "es": "Practica pedir y dar indicaciones. Aprende expresiones de ubicación y dirección.", "pl": "Ćwicz rozmowy o pytaniu o drogę i wskazywaniu drogi.", "it": "Esercitati a chiedere e dare indicazioni stradali.", "sv": "Öva på att fråga om och ge vägbeskrivningar.", "fi": "Harjoittele tien kysymistä ja neuvomista.", "ja": "道を尋ねたり案内したりする会話を練習します。", "zh-CN": "练习问路和指路的对话，学习表示位置和方向的表达。"}, "dialogue": [{"speaker": "수미", "text": "저기요, 지하철역이 어디에 있어요?", "trans": {"en": "Excuse me, where is the subway station?", "de": "Entschuldigung, wo ist die U-Bahn-Station?", "fr": "Excusez-moi, où se trouve la station de métro ?", "es": "Perdone, ¿dónde está la estación de metro?", "pl": "Przepraszam, gdzie jest stacja metra?", "it": "Scusi, dov'è la stazione della metropolitana?", "sv": "Ursäkta, var är tunnelbanestationen?", "fi": "Anteeksi, missä metroasema on?", "ja": "すみません、地下鉄の駅はどこですか？", "zh-CN": "请问，地铁站在哪里？"}}, {"speaker": "지민", "text": "이 길로 쭉 가면 오른쪽에 있어요.", "trans": {"en": "If you go straight down this road, it's on the right.", "de": "Wenn Sie diese Straße geradeaus gehen, ist es auf der rechten Seite.", "fr": "Si vous continuez tout droit, c'est sur la droite.", "es": "Si sigue recto por esta calle, está a la derecha.", "pl": "Jeśli pójdziesz tą drogą prosto, będzie po prawej stronie.", "it": "Se vai dritto per questa strada, è sulla destra.", "sv": "Om du går rakt fram längs den här vägen, är det på höger sida.", "fi": "Jos menet suoraan tätä tietä, se on oikealla puolella.", "ja": "この道をまっすぐ行くと右側にあります。", "zh-CN": "沿这条路直走，在右边。"}}, {"speaker": "수미", "text": "얼마나 걸려요?", "trans": {"en": "How long does it take?", "de": "Wie lange dauert es?", "fr": "Combien de temps faut-il ?", "es": "¿Cuánto tiempo tarda?", "pl": "Jak długo to zajmuje?", "it": "Quanto tempo ci vuole?", "sv": "Hur lång tid tar det?", "fi": "Kuinka kauan se kestää?", "ja": "どのくらいかかりますか？", "zh-CN": "需要多长时间？"}}, {"speaker": "지민", "text": "걸어서 5분쯤 걸려요.", "trans": {"en": "It takes about 5 minutes on foot.", "de": "Es dauert etwa 5 Minuten zu Fuß.", "fr": "C'est environ 5 minutes à pied.", "es": "Se tarda unos 5 minutos a pie.", "pl": "Zajmuje około 5 minut pieszo.", "it": "Ci vogliono circa 5 minuti a piedi.", "sv": "Det tar ungefär 5 minuter till fots.", "fi": "Se kestää noin 5 minuuttia kävellen.", "ja": "歩いて5分くらいかかります。", "zh-CN": "步行大约需要5分钟。"}}, {"speaker": "수미", "text": "편의점을 지나서 왼쪽으로 가야 해요?", "trans": {"en": "Should I pass the convenience store and turn left?", "de": "Soll ich am Convenience-Store vorbeigehen und dann links?", "fr": "Dois-je passer devant le convenience store et tourner à gauche ?", "es": "¿Debo pasar el minimarket y girar a la izquierda?", "pl": "Czy mam minąć sklep i skręcić w lewo?", "it": "Devo passare il minimarket e girare a sinistra?", "sv": "Ska jag passera mataffären och sedan gå till vänster?", "fi": "Pitääkö minun mennä kaupan ohi ja kääntyä vasemmalle?", "ja": "コンビニを過ぎて左に行けばいいですか？", "zh-CN": "经过便利店后左转吗？"}}, {"speaker": "지민", "text": "아니요, 오른쪽이에요. 큰 건물 바로 옆에 있어요.", "trans": {"en": "No, it's on the right. It's right next to a big building.", "de": "Nein, es ist auf der rechten Seite. Es befindet sich direkt neben einem großen Gebäude.", "fr": "Non, c'est à droite. C'est juste à côté d'un grand bâtiment.", "es": "No, es a la derecha. Está justo al lado de un edificio grande.", "pl": "Nie, po prawej stronie. Jest tuż obok dużego budynku.", "it": "No, è a destra. È proprio accanto a un edificio grande.", "sv": "Nej, det är till höger. Det är precis bredvid ett stort byggnad.", "fi": "Ei, se on oikealla puolella. Se on aivan ison rakennuksen vieressä.", "ja": "いいえ、右側ですよ。大きな建物のすぐ隣にあります。", "zh-CN": "不，是右边。就在一栋大楼旁边。"}}, {"speaker": "수미", "text": "감사합니다! 도움이 됐어요.", "trans": {"en": "Thank you! That was helpful.", "de": "Danke! Das war hilfreich.", "fr": "Merci ! C'était utile.", "es": "¡Gracias! Fue de ayuda.", "pl": "Dziękuję! To było pomocne.", "it": "Grazie! È stato utile.", "sv": "Tack! Det var hjälpsamt.", "fi": "Kiitos! Se auttoi.", "ja": "ありがとうございます！助かりました。", "zh-CN": "谢谢！很有帮助。"}}], "vocab": [{"word": "길", "trans": {"en": "road / street / way", "de": "Straße / Weg", "fr": "rue / chemin", "es": "camino / calle", "pl": "droga / ulica", "it": "strada / via", "sv": "väg / gata", "fi": "tie / katu", "ja": "道", "zh-CN": "路"}}, {"word": "왼쪽", "trans": {"en": "left side", "de": "links", "fr": "à gauche", "es": "a la izquierda", "pl": "lewa strona", "it": "sinistra", "sv": "vänster sida", "fi": "vasen puoli", "ja": "左側", "zh-CN": "左边"}}, {"word": "오른쪽", "trans": {"en": "right side", "de": "rechts", "fr": "à droite", "es": "a la derecha", "pl": "prawa strona", "it": "destra", "sv": "höger sida", "fi": "oikea puoli", "ja": "右側", "zh-CN": "右边"}}, {"word": "쭉", "trans": {"en": "straight / all the way", "de": "geradeaus", "fr": "tout droit", "es": "recto / derecho", "pl": "prosto", "it": "dritto", "sv": "rakt fram", "fi": "suoraan", "ja": "まっすぐ", "zh-CN": "一直/笔直"}}, {"word": "지나다", "trans": {"en": "to pass / go by", "de": "vorbeigehen", "fr": "passer", "es": "pasar", "pl": "przechodzić", "it": "passare", "sv": "passera", "fi": "ohittaa", "ja": "通り過ぎる", "zh-CN": "经过"}}, {"word": "걸리다", "trans": {"en": "to take (time)", "de": "dauern", "fr": "prendre (du temps)", "es": "tardar", "pl": "zajmować (czas)", "it": "volerci (tempo)", "sv": "ta (tid)", "fi": "kestää (aikaa)", "ja": "かかる（時間）", "zh-CN" ？"}, "options": [{"text": "1) 왼쪽", "trans": {"en": "left", "de": "links", "fr": "à gauche", "es": "a la izquierda", "pl": "po lewej", "it": "sinistra", "sv": "vänster", "fi": "vasemmalla", "ja": "左", "zh-CN": "左边"}}, {"text": "2) 오른쪽", "trans": {"en": "right", "de": "rechts", "fr": "à droite", "es": "a la derecha", "pl": "po prawej", "it": "destra", "sv": "höger", "fi": "oikealla", "ja": "右", "zh-CN": "右边"}}, {"text": "3) 앞", "trans": {"en": "front", "de": "vorne", "fr": "devant", "es": "al frente", "pl": "z przodu", "it": "davanti", "sv": "framåt", "fi": "edessä", "ja": "前", "zh-CN": "前面"}}, {"text": "4) 뒤", "trans": {"en": "back", "de": "hinten", "fr": "derrière", "es": "atrás", "pl": "z tyłu", "it": "dietro", "sv": "bak", "fi": "takana", "ja": "後ろ", "zh-CN": "后面"}}], "answer": 1, "explanation": {"en": "Jimin said the station is on the right side next to a big building.", "de": "Jimin sagte, die Station ist auf der rechten Seite neben einem großen Gebäude.", "fr": "Jimin a dit que la station est à droite, à côté d'un grand bâtiment.", "es": "Jimin dijo que la estación está a la derecha, junto a un edificio grande.", "pl": "Jimin powiedział, że stacja jest po prawej stronie obok dużego budynku.", "it": "Jimin ha detto che la stazione è sulla destra vicino a un edificio grande.", "sv": "Jimin sa att stationen är på höger sida, bredvid ett stort bygge.", "fi": "Jimin sanoi aseman olevan oikealla puolella ison rakennuksen vieressä.", "ja": "ジミンは駅が大きな建物のすぐ隣の右側にあると言いました。", "zh-CN": "智敏说地铁站在右边，就在一栋大楼旁边。"}}, {"id": 2, "type": "vocabulary", "questionAudio": "'걸리다'는 무슨 뜻이에요?", "questionTrans": {"en": "What does '걸리다' mean?", "de": "Was bedeutet '걸리다'?", "fr": "Que signifie '걸리다' ?", "es": "¿Qué significa '걸리다'?", "pl": "Co znaczy '걸리다'?", "it": "Cosa significa '걸리다'?", "sv": "Vad betyder '걸리다'?", "fi": "Mitä '걸리다' tarkoittaa?", "ja": "「걸리다」はどういう意味ですか？", "zh-CN": "\"걸리다\"是什么意思？"}, "options": [{"text": "1) 걸리다 — to take (time)", "trans": {"en": "to take (time)", "de": "dauern   10: {"id": 10, "title": "10. 은행에서", "titleTrans": {"en": "10. At the Bank", "de": "10. Bei der Bank", "fr": "10. À la banque", "es": "10. En el banco", "pl": "10. W banku", "it": "10. In banca", "sv": "10. På banken", "fi": "10. Pankissa", "ja": "10. 銀行で", "zh-CN": "10. 在银行"}, "desc": "은행에서 돈을 찾고 보내는 방법을 배웁니다.", "descTrans": {"en": "Learn how to withdraw money and use banking services.", "de": "Lernen Sie, wie man Geld abhebt und Bankdienstleistungen nutzt.", "fr": "Apprenez à retirer de l'argent et à utiliser les services bancaires.", "es": "Aprende a retirar dinero y usar servicios bancarios.", "pl": "Naucz się wypłacać pieniądze i korzystać z usług bankowych.", "it": "Impara a prelevare denaro e usare i servizi bancari.", "sv": "Lär dig ta ut pengar och använda banktjänster.", "fi": "Opi nostamaan rahaa ja käyttämään pankkipalveluita.", "ja": "銀行でお金を引き出したりサービスを利用する方法を学びます。", "zh-CN": "学习如何在银行取款和使用银行服务。"}, "dialogue": [{"speaker": "수미", "text": "어서 오세요. 무엇을 도와드릴까요?", "trans": {"en": "Welcome. How can I help you?", "de": "Willkommen. Wie kann ich Ihnen helfen?", "fr": "Bienvenue. Comment puis-je vous aider ?", "es": "Bienvenido/a. ¿En qué le puedo ayudar?", "pl": "Witamy. W czym mogę pomóc?", "it": "Benvenuto/a. Come posso aiutarla?", "sv": "Välkommen. Hur kan jag hjälpa dig?", "fi": "Tervetuloa. Miten voin auttaa?", "ja": "いらっしゃいませ。何かご用でしょうか？", "zh-CN": "欢迎光临。有什么可以帮您？"}}, {"speaker": "지민", "text": "통장을 만들고 싶어요.", "trans": {"en": "I'd like to open a bank account.", "de": "Ich möchte ein Bankkonto eröffnen.", "fr": "Je voudrais ouvrir un compte bancaire.", "es": "Me gustaría abrir una cuenta bancaria.", "pl": "Chciałbym/Chciałabym otworzyć konto bankowe.", "it": "Vorrei aprire un conto bancario.", "sv": "Jag skulle vilja öppna ett bankkonto.", "fi": "Haluaisin avata pankkitilin.", "ja": "口座を作りたいです。", "zh-CN": "我想开个银行账户。"}}, {"speaker": "수미", "text": "신분증이 있으세요?", "trans": {"en": "Do you have an ID card?", "de": "Haben Sie einen Personalausweis?", "fr": "Avez-vous m/Chciałabym otworzyć konto bankowe.", "it": "Vorrei aprire un conto bancario.", "sv": "Jag skulle vilja öppna ett bankkonto.", "fi": "Haluaisin avata pankkitilin.", "ja": "口座を作りたいです。", "zh-CN": "我想开个银行账户。"}}, {"pattern": "[금액] 입금할게요.", "patternTrans": {"en": "I'll deposit [amount].", "de": "Ich zahle [Betrag] ein.", "fr": "Je vais déposer [montant].", "es": "Voy a depositar [cantidad].", "pl": "Wpłacę [kwota].", "it": "Depositerò [importo].", "sv": "Jag ska sätta in [belopp].", "fi": "Tallettan [summa].", "ja": "[金額]入金します。", "zh-CN": "我要存[金额]。"}, "example": "오만 원 입금할게요.", "trans": {"en": "I'll deposit 50,000 won.", "de": "Ich zahle 50.000 Won ein.", "fr": "Je vais déposer 50 000 wons.", "es": "Voy a depositar 50.000 wons.", "pl": "Wpłacę 50 000 wonów.", "it": "Depositerò 50.000 won.", "sv": "Jag ska sätta in 50 000 won.", "fi": "Tallettan 50 000 wonia.", "ja": "5万ウォン入金します。", "zh-CN": "我要存5万韩元。"}}, {"pattern": "무엇을 도와드릴까요?", "patternTrans": {"en": "How can I help you?", "de": "Wie kann ich Ihnen helfen?", "fr": "Comment puis-je vous aider ?", "es": "¿En qué le puedo ayudar?", "pl": "W czym mogę pomóc?", "it": "Come posso aiutarla?", "sv": "Hur kan jag hjälpa dig?", "fi": "Miten voin auttaa?", "ja": "何かご用でしょうか？", "zh-CN": "有什么可以帮您？"}, "example": "무엇을 도와드릴까요?", "trans": {"en": "How can I help you?", "de": "Wie kann ich Ihnen helfen?", "fr": "Comment puis-je vous aider ?", "es": "¿En qué le puedo ayudar?", "pl": "W czym mogę pomóc?", "it": "Come posso aiutarla?", "sv": "Hur kan jag hjälpa dig?", "fi": "Miten voin auttaa?", "ja": "何かご用でしょうか？", "zh-CN": "有什么可以帮您？"}}], "quizzes": [{"id": 1, "type": "comprehension", "questionAudio": "지민 씨는 은행에서 무엇을 하고 싶어요?", "questionTrans": {"en": "What does Jimin want to do at the bank?", "de": "Was möchte Jimin bei der Bank machen?", "fr": "Que veut faire Jimin à la banque ?", "es": "¿Qué quiere hacer Jimin en el banco?", "pl": "Co Jimin chce zrobić w banku?", "it": "Cosa vuole fare Jimin in banca?", "sv": "Vad vill Jimin göra på banken?", "fi": "Mitä Jimin haluaa tehdä pankissa?", "ja": "ジミンさんは銀行で何をしたいですか？", "zh-CN": "智敏在银行想做什么？"}, "options": [{"text": "돈을 빌리고 싶어요.", "trans": {"en": "Wants to borrow money.", "de": "Möchte Geld leihen.", "fr": "Veut emprunter de l'argent.", "es": "Quiere pedir dinero prestado.", "pl": "Chce pożyczyć pieniądze.", "it": "Vuole prendere in prestito denaro.", "sv": "Vill låna pengar.", "fi": "Haluaa lainata rahaa.", "ja": "お金を借りたい。", "zh-CN": "想借钱。"}}, {"text": "통장을 만들고 돈을 입금하고 싶어요.", "trans": {"en": "Wants to open an account and deposit money.", "de": "Möchte ein Konto eröffnen und Geld einzahlen.", "fr": "Veut ouvrir un compte et déposer de l'argent.", "es": "Quiere abrir una cuenta y depositar dinero.", "pl": "Chce otworzyć konto i wpłacić pieniądze.", "it": "Vuole aprire un conto e versare denaro.", "sv": "Vill öppna ett konto och sätta in pengar.", "fi": "Haluaa avata tilin ja tallettaa rahaa.", "ja": "口座を作ってお金を入金したい。", "zh-CN": "想开账户和存款。"}}, {"text": "돈을 환전하고 싶어요.", "trans": {"en": "Wants to exchange money.", "de": "Möchte Geld wechseln.", "fr": "Veut changer de l'argent.", "es": "Quiere cambiar dinero.", "pl": "Chce wymienić pieniądze.", "it": "Vuole cambiare denaro.", "sv": "Vill växla pengar.", "fi": "Haluaa vaihtaa rahaa.", "ja": "お金を両替したい。", "zh-CN": "想换钱。"}}, {"text": "카드를 만들고 싶어요.", "trans": {"en": "Wants to make a card.", "de": "Möchte eine Karte erstellen.", "fr": "Veut faire une carte.", "es": "Quiere hacer una tarjeta.", "pl": "Chce zrobić kartę.", "it": "Vuole fare una carta.", "sv": "Vill göra ett kort.", "fi": "Haluaa tehdä kortin.", "ja": "カードを作りたい。", "zh-CN": "想办卡。"}}], "answer": 1, "explanation": {"en": "Jimin said '통장을 만들고 싶어요' and '돈도 입금하고 싶어요' — wants to open an account AND deposit money.", "de": "Jimin sagte '통장을 만들고 싶어요' und '돈도 입금하고 싶어요' — möchte ein Konto eröffnen UND Geld einzahlen.", "fr": "Jimin a dit '통장을 만들고 싶어요' et '돈도 입금하고 싶어요' — veut ouvrir un compte ET déposer de l'argent.", "es": "Jimin dijo '통장을 만들고 싶어요' y '돈도 입금하고 싶어요' — quiere abrir una cuenta Y depositar dinero.", "pl": "Jimin powiedział/a '통장을 만들고 싶어요' i '돈도 입금하고 싶어요' — chce otworzyć konto I wpłacić pieniądze.", "it": "Jimin ha detto '통장을 만들고 싶어요' e '돈도 입금하고 싶어요' — vuole aprire un conto E versare denaro.", "sv": "Jimin sa '통장을 만들고 싶어요' och '돈도 입금하고 싶어요' — vill öppna ett konto OCH sätta in pengar.", "fi": "Jimin sanoi '통장을 만들고 싶어요' ja '돈도 입금하고 싶어요' — haluaa avata tilin JA tallettaa rahaa.", "ja": "ジミンさんは「통장을 만들고 싶어요」と「돈도 입금하고 싶어요」と言い、口座を作ってお金を入金したいことを意味します。", "zh-CN": "智敏说'통장을 만들고 싶어요'和'돈도 입금하고 싶어요'——想开账户并且存款。"}}, {"id": 2, "type": "vocabulary", "questionAudio": "'입금하다'의 반대말은 뭐예요?", "questionTrans": {"en": "What is the opposite of '입금하다' (to deposit)?", "de": "Was ist das Gegenteil von '입금하다' (einzahlen)?", "fr": "Quel est le contraire de '입금하다' (déposer) ?", "es": "¿Cuál es el opuesto de '입금하다' (depositar)?", "pl": "Co jest przeciwieństwem '입금하다' (wpłacać)?", "it": "Qual è il contrario di '입금하다' (depositare)?", "sv": "Vad är motsatsen till '입금하다' (sätta in)?", "fi": "Mikä on '입금하다' (tallettaa) vastakohta?", "ja": "「입금하다」（入金する）の反対は何ですか？", "zh-CN": "'입금하다'（存款）的反义词是什么？"}, "options": [{"text": "출금하다 (to withdraw)", "trans": {"en": "To withdraw", "de": "Geld abheben", "fr": "Retirer", "es": "Retirar", "pl": "Wypłacać", "it": "Prelevare", "sv": "Ta ut", "fi": "Nostaa", "ja": "出金する", "zh-CN": "取款"}}, {"text": "보내다 (to send)", "trans": {"en": "To send", "de": "Senden", "fr": "Envoyer", "es": "Enviar", "pl": "Wysyłać", "it": "Inviare", "sv": "Skicka", "fi": "Lähettää", "ja": "送る", "zh-CN": "发送"}}, {"text": "받다 (to receive)", "trans": {"en": "To receive", "de": "Empfangen", "fr": "Recevoir", "es": "Recibir", "pl": "Otrzymywać", "it": "Ricevere", "sv": "Ta emot", "fi": "Vastaanottaa", "ja": "受け取る", "zh-CN": "收到"}}, {"text": "저축하다 (to save)", "trans": {"en": "To save (money)", "de": "Geld sparen", "fr": "Épargner", "es": "Ahorrar", "pl": "Oszczędzać", "it": "Risparmiare", "sv": "Spara", "fi": "Säästää", "ja": "貯蓄する", "zh-CN": "储蓄"}}], "answer": 0, "explanation": {"en": "'출금하다' (to withdraw) is the direct opposite of '입금하다' (to deposit). 입금 = money in, 출금 = money out.", "de": "'출금하다' (Geld abheben) ist das direkte Gegenteil von '입금하다' (einzahlen). 입금 = Geld rein, 출금 = Geld raus.", "fr": "'출금하다' (retirer) est le contraire direct de '입금하다' (déposer). 입금 = argent entrant, 출금 = argent sortant.", "es": "'출금하다' (retirar) es el opuesto directo de '입금하다' (depositar). 입금 = dinero que entra, 출금 = dinero que sale.", "pl": "'출금하다' (wypłacać) jest bezpośrednim przeciwieństwem '입금하다' (wpłacać). 입금 = pieniądze wchodzą, 출금 = pieniądze wychodzą.", "it": "'출금하다' (prelevare) è il contrario diretto di '입금하다' (depositare). 입금 = denaro in entrata, 출금 = denaro in uscita.", "sv": "'출금하다' (ta ut) är den direkta motsatsen till '입금하다' (sätta in). 입금 = pengar in, 출금 = pengar ut.", "fi": "'출금하다' (nostaa) on suora vastakohta '입금하다' (tallettaa). 입금 = rahaa sisään, 출금 = rahaa ulos.", "ja": "「출금하다」（出金する）は「입금하다」（入金する）の直接の反対語です。입금＝お金が入る、출금＝お金が出る。", "zh-CN": "'출금하다'（取款）是'입금하다'（存款）的直接反义词。입금=钱进来，출금=钱出去。"}}, {"id": 3, "type": "comprehension", "questionAudio": "지민 씨는 얼마를 입금하고 싶어요?", "questionTrans": {"en": "How much does Jimin want to deposit?", "de": "Wie viel möchte Jimin einzahlen?", "fr": "Combien Jimin veut-il/elle déposer ?", "es": "¿Cuánto quiere depositar Jimin?", "pl": "Ile Jimin chce wpłacić?", "it": "Quanto vuole depositare Jimin?", "sv": "Hur mycket vill Jimin sätta in?", "fi": "Kuinka paljon Jimin haluaa tallettaa?", "ja": "ジミンさんはいくら入金したいですか？", "zh-CN": "智敏想存多少钱？"}, "options": [{"text": "삼만 원", "trans": {"en": "30,000 won", "de": "30.000 Won", "fr": "30 000 wons", "es": "30.000 wons", "pl": "30 000 wonów", "it": "30.000 won", "sv": "30 000 won", "fi": "30 000 wonia", "ja": "3万ウォン", "zh-CN": "三万韩元"}}, {"text": "십만 원", "trans": {"en": "100,000 won", "de": "100.000 Won", "fr": "100 000 wons", "es": "100.000 wons", "pl": "100 000 wonów", "it": "100.000 won", "sv": "100 000 won", "fi": "100 000 wonia", "ja": "10万ウォン", "zh-CN": "十万韩元"}}, {"text": "이만 원", "trans": {"en": "20,000 won", "de": "20.000 Won", "fr": "20 000 wons", "es": "20.000 wons", "pl": "20 000 wonów", "it": "20.000 won", "sv": "20 000 won", "fi": "20 000 wonia", "ja": "2万ウォン", "zh-CN": "两万韩元"}}, {"text": "오만 원", "trans": {"en": "50,000 won", "de": "50.000 Won", "fr": "50 000 wons", "es": "50.000 wons", "pl": "50 000 wonów", "it": "50.000 won", "sv": "50 000 won", "fi": "50 000 wonia", "ja": "5万ウォン", "zh-CN": "五万韩元"}}], "answer": 3, "explanation": {"en": "Jimin said '오만 원 입금할게요', which means 50,000 won. 오만 = 50,000 in Korean.", "de": "Jimin sagte '오만 원 입금할게요', was 50.000 Won bedeutet. 오만 = 50.000 auf Koreanisch.", "fr": "Jimin a dit '오만 원 입금할게요', ce qui signifie 50 000 wons. 오만 = 50 000 en coréen.", "es": "Jimin dijo '오만 원 입금할게요', que significa 50.000 wons. 오만 = 50.000 en coreano.", "pl": "Jimin powiedział/a '오만 원 입금할게요', co oznacza 50 000 wonów. 오만 = 50 000 po koreańsku.", "it": "Jimin ha detto '오만 원 입금할게요', che significa 50.000 won. 오만 = 50.000 in coreano.", "sv": "Jimin sa '오만 원 입금할게요', vilket betyder 50 000 won. 오만 = 50 000 på koreanska.", "fi": "Jimin sanoi '오만 원 입금할게요', mikä tarkoittaa 50 000 wonia. 오만 = 50 000 koreaksi.", "ja": "ジミンさんは「오만 원 입금할게요」と言い、5万ウォンを意味します。오만＝韓国語で50,000。", "zh-CN": "智敏说'오만 원 입금할게요'，即5万韩元。오만=韩语中的50,000。"}}]},
  11: {"id": 11, "title": "11. 병원 예약하기", "titleTrans": {"en": "11. Making a Doctor's Appointment", "de": "11. Einen Arzttermin vereinbaren", "fr": "11. Prendre un rendez-vous médical", "es": "11. Hacer una cita médica", "pl": "11. Umawianie wizyty u lekarza", "it": "11. Prendere un appuntamento dal medico", "sv": "11. Boka läkartid", "fi": "11. Lääkäriajan varaaminen", "ja": "11. 病院の予約をする", "zh-CN": "11. 预约医院"}, "desc": "병원에 전화해서 진료 예약하는 방법을 연습합니다.", "descTrans": {"en": "Practice calling a hospital to make a medical appointment.", "de": "Üben Sie, ein Krankenhaus anzurufen, um einen Arzttermin zu vereinbaren.", "fr": "Entraînez-vous à appeler un hôpital pour prendre un rendez-vous médical.", "es": "Practique llamar a un hospital para hacer una cita médica.", "pl": "Ćwicz dzwonienie do szpitala w celu umówienia wizyty lekarskiej.", "it": "Esercitati a chiamare un ospedale per prendere un appuntamento medico.", "sv": "Öva på att ringa ett sjukhus för att boka en läkartid.", "fi": "Harjoittele sairaalan soittamista lääkäriajan varaamiseksi.", "ja": "病院に電話して診察の予約をする練習をします。", "zh-CN": "练习给医院打电话预约就诊。"}, "dialogue": [{"speaker": "수미", "text": "안녕하세요. 진료 예약을 하고 싶어요.", "trans": {"en": "Hello. I'd like to make a medical appointment.", "de": "Hallo. Ich möchte einen Arzttermin vereinbaren.", "fr": "Bonjour. Je voudrais prendre un rendez-vous médical.", "es": "Hola. Me gustaría hacer una cita médica.", "pl": "Dzień dobry. Chciałabym umówić wizytę lekarską.", "it": "Buongiorno. Vorrei prendere un appuntamento medico.", "sv": "Hej. Jag skulle vilja boka en läkartid.", "fi": "Hei. Haluaisin varata lääkäriajan.", "ja": "こんにちは。診察の予約をしたいのですが。", "zh-CN": "您好，我想预约就诊。"}}, {"speaker": "지민", "text": "네, 어디가 불편하세요?", "trans": {"en": "Sure, what's bothering you?", "de": "Natürlich, was fehlt Ihnen?", "fr": "Bien sûr, qu'est-ce qui ne va pas?", "es": "Claro, ¿qué le molesta?", "pl": "Oczywiście, co Panią boli?", "it": "Certo, cosa la disturba?", "sv": "Visst, vad är det som är fel?", "fi": "Toki, mikä vaivaa?", "ja": "はい、どこが具合が悪いですか？", "zh-CN": "好的，您哪里不舒服？"}}, {"speaker": "수미", "text": "목이 아프고 열이 좀 있어요.", "trans": {"en": "My throat hurts and I have a slight fever.", "de": "Mein Hals tut weh und ich habe leichtes Fieber.", "fr": "J'ai mal à la gorge et un peu de fièvre.", "es": "Me duele la garganta y tengo un poco de fiebre.", "pl": "Boli mnie gardło i mam lekką gorączkę.", "it": "Ho mal di gola e un po' di febbre.", "sv": "Min hals gör ont och jag har lite feber.", "fi": "Kurkkuni kipeä ja minulla on hieman kuumetta.", "ja": "喉が痛くて少し熱があります。", "zh-CN": "我喉咙痛，有点发烧。"}}, {"speaker": "지민", "text": "언제 오실 수 있어요?", "trans": {"en": "When can you come in?", "de": "Wann können Sie kommen?", "fr": "Quand pouvez-vous venir?", "es": "¿Cuándo puede venir?", "pl": "Kiedy może Pani przyjść?", "it": "Quando può venire?", "sv": "När kan du komma?", "fi": "Milloin voit tulla?", "ja": "いつ来られますか？", "zh-CN": "您什么时候可以来？"}}, {"speaker": "수미", "text": "내일 오전에 가능해요?", "trans": {"en": "Is tomorrow morning possible?", "de": "Ist morgen Vormittag möglich?", "fr": "Est-ce possible demain matin?", "es": "¿Es posible mañana por la mañana?", "pl": "Czy jutro rano jest możliwe?", "it": "È possibile domani mattina?", "sv": "Är det möjligt imorgon förmiddag?", "fi": "Onko huomenna aamupäivällä mahdollista?", "ja": "明日の午前中は可能ですか？", "zh-CN": "明天上午可以吗？"}}, {"speaker": "지민", "text": "네, 내일 오전 10시 어떠세요?", "trans": {"en": "Yes, how about tomorrow at 10 AM?", "de": "Ja, wie wäre es morgen um 10 Uhr?", "fr": "Oui, que diriez-vous de demain à 10 heures?", "es": "Sí, ¿qué tal mañana a las 10 AM?", "pl": "Tak, co powiedziałaby Pani na jutro o 10:00?", "it": "Sì, che ne dice di domani alle 10?", "sv": "Ja, hur är det med imorgon kl. 10?", "fi": "Kyllä, entä huomenna kello 10?", "ja": "はい、明日の午前10時はいかがですか？", "zh-CN": "好的，明天上午10点怎么样？"}}, {"speaker": "수미", "text": "좋아요. 예약할게요. 감사합니다.", "trans": {"en": "Great. I'll make that reservation. Thank you.", "de": "Gut. Ich buche den Termin. Danke.", "fr": "Parfait. Je vais réserver. Merci.", "es": "Genial. Haré esa reserva. Gracias.", "pl": "Świetnie. Zarezerwuję. Dziękuję.", "it": "Perfetto. Prenoto. Grazie.", "sv": "Bra. Jag bokar det. Tack.", "fi": "Hyvä. Teen varauksen. Kiitos.", "ja": "いいですね。予約します。ありがとうございます。", "zh-CN": "好的，我预约这个时间。谢谢。"}}], "vocab": [{"word": "진료", "trans": {"en": "medical treatment / consultation", "de": "ärztliche Behandlung", "fr": "consultation médicale", "es": "consulta médica", "pl": "leczenie / wizyta lekarska", "it": "visita medica", "sv": "medicinsk behandling", "fi": "lääkärikonsultaatio", "ja": "診療", "zh-CN": "诊疗"}}, {"word": "예약", "trans": {"en": "reservation / appointment", "de": "Reservierung / Termin", "fr": "réservation / rendez-vous", "es": "reserva / cita", "pl": "rezerwacja / wizyta", "it": "prenotazione / appuntamento", "sv": "bokning", "fi": "varaus", "ja": "予約", "zh-CN": "预约"}}, {"word": "불편하다", "trans": {"en": "to feel uncomfortable / unwell", "de": "sich unwohl fühlen", "fr": "se sentir mal à l'aise / mal", "es": "sentirse incómodo / mal", "pl": "czuć się niekomfortowo / źle", "it": "sentirsi a disagio / male", "sv": "känna sig obekväm / dålig", "fi": "tuntea olonsa epämukavaksi", "ja": "不便だ・具合が悪い", "zh-CN": "不舒服"}}, {"word": "목", "trans": {"en": "throat / neck", "de": "Hals", "fr": "gorge / cou", "es": "garganta / cuello", "pl": "gardło / szyja", "it": "gola / collo", "sv": "hals", "fi": "kurkku / kaula", "ja": "喉・首", "zh-CN": "喉咙/脖子"}}, {"word": "열", "trans": {"en": "fever", "de": "Fieber", "fr": "fièvre", "es": "fiebre", "pl": "gorączka", "it": "febbre", "sv": "feber", "fi": "kuume", "ja": "熱", "zh-CN": "发烧/发热"}}, {"word": "아프다", "trans": {"en": "to hurt / be sick", "de": "wehtun / krank sein", "fr": "avoir mal / être malade", "es": "doler / estar enfermo", "pl": "boleć / być chorym", "it": "fare male / essere malato", "sv": "göra ont / vara sjuk", "fi": "sattua / olla sairas", "ja": "痛い・病気だ", "zh-CN": "疼痛/生病"}}, {"word": "오전", "trans": {"en": "morning (AM)", "de": "Vormittag", "fr": "matin (AM)", "es": "mañana (AM)", "pl": "przedpołudnie", "it": "mattina (AM)", "sv": "förmiddag", "fi": "aamupäivä", "ja": "午前", "zh-CN": "上午"}}, {"word": "가능하다", "trans": {"en": "to be possible", "de": "möglich sein", "fr": "être possible", "es": "ser posible", "pl": "być możliwym", "it": "essere possibile", "sv": "vara möjlig", "fi": "olla mahdollinen", "ja": "可能だ", "zh-CN": "可能/可以"}}, {"word": "내일", "trans": {"en": "tomorrow", "de": "morgen", "fr": "demain", "es": "mañana", "pl": "jutro", "it": "domani", "sv": "imorgon", "fi": "huomenna", "ja": "明日", "zh-CN": "明天"}}, {"word": "병원", "trans": {"en": "hospital / clinic", "de": "Krankenhaus / Klinik", "fr": "hôpital / clinique", "es": "hospital / clínica", "pl": "szpital / klinika", "it": "ospedale / clinica", "sv": "sjukhus / klinik", "fi": "sairaala / klinikka", "ja": "病院", "zh-CN": "医院"}}], "patterns": [{"pattern": "V + 고 싶어요", "patternTrans": {"en": "I want to V", "de": "Ich möchte V", "fr": "Je veux V", "es": "Quiero V", "pl": "Chcę V", "it": "Voglio V", "sv": "Jag vill V", "fi": "Haluan V", "ja": "Vたいです", "zh-CN": "想要做V"}, "example": "예약을 하고 싶어요.", "trans": {"en": "I want to make a reservation.", "de": "Ich möchte eine Reservierung machen.", "fr": "Je veux faire une réservation.", "es": "Quiero hacer una reserva.", "pl": "Chcę dokonać rezerwacji.", "it": "Voglio fare una prenotazione.", "sv": "Jag vill göra en bokning.", "fi": "Haluan tehdä varauksen.", "ja": "予約をしたいです。", "zh-CN": "我想预约。"}}, {"pattern": "N이/가 아파요", "patternTrans": {"en": "N hurts / N is painful", "de": "N tut weh", "fr": "N fait mal", "es": "N duele", "pl": "N boli", "it": "N fa male", "sv": "N gör ont", "fi": "N sattuu", "ja": "Nが痛いです", "zh-CN": "N 疼"}, "example": "목이 아파요.", "trans": {"en": "My throat hurts.", "de": "Mein Hals tut weh.", "fr": "J'ai mal à la gorge.", "es": "Me duele la garganta.", "pl": "Boli mnie gardło.", "it": "Ho mal di gola.", "sv": "Min hals gör ont.", "fi": "Kurkkuni sattuu.", "ja": "喉が痛いです。", "zh-CN": "我喉咙疼。"}}, {"pattern": "N 어떠세요?", "patternTrans": {"en": "How about N? / What do you think of N?", "de": "Wie wäre es mit N?", "fr": "Que pensez-vous de N?", "es": "¿Qué tal N?", "pl": "Co powiedziałby Pan/Pani na N?", "it": "Che ne dice di N?", "sv": "Hur är det med N?", "fi": "Entä N?", "ja": "Nはいかがですか？", "zh-CN": "N怎么样？"}, "example": "내일 오전 10시 어떠세요?", "trans": {"en": "How about tomorrow at 10 AM?", "de": "Wie wäre es morgen um 10 Uhr?", "fr": "Que pensez-vous de demain à 10h?", "es": "¿Qué tal mañana a las 10 AM?", "pl": "Co powiedziałby Pan/Pani na jutro o 10:00?", "it": "Che ne dice di domani alle 10?", "sv": "Hur är det med imorgon kl. 10?", "fi": "Entä huomenna kello 10?", "ja": "明日の午前10時はいかがですか？", "zh-CN": "明天上午10点怎么样？"}}], "quizzes": [{"id": 1, "type": "comprehension", "questionAudio": "수미는 왜 병원에 전화했어요?", "questionTrans": {"en": "Why did Sumi call the hospital?", "de": "Warum hat Sumi das Krankenhaus angerufen?", "fr": "Pourquoi Sumi a-t-elle appelé l'hôpital?", "es": "¿Por qué llamó Sumi al hospital?", "pl": "Dlaczego Sumi zadzwoniła do szpitala?", "it": "Perché Sumi ha chiamato l'ospedale?", "sv": "Varför ringde Sumi sjukhuset?", "fi": "Miksi Sumi soitti sairaalaan?", "ja": "スミはなぜ病院に電話しましたか？", "zh-CN": "수미为什么打电话给医院？"}, "options": [{"text": "1) 진료 예약을 하려고", "trans": {"en": "To make a medical appointment", "de": "Um einen Arzttermin zu vereinbaren", "fr": "Pour prendre un rendez-vous médical", "es": "Para hacer una cita médica", "pl": "Żeby umówić wizytę lekarską", "it": "Per prendere un appuntamento medico", "sv": "För att boka en läkartid", "fi": "Varatakseen lääkäriajan", "ja": "診察の予約をするため", "zh-CN": "为了预约就诊"}}, {"text": "2) 약을 주문하려고", "trans": {"en": "To order medicine", "de": "Um Medikamente zu bestellen", "fr": "Pour commander des médicaments", "es": "Para pedir medicina", "pl": "Żeby zamówić leki", "it": "Per ordinare medicine", "sv": "För att beställa medicin", "fi": "Tilatakseen lääkkeitä", "ja": "薬を注文するため", "zh-CN": "为了订药"}}, {"text": "3) 의사에게 질문하려고"   13: {"id": 13, "title": "13. 옷 사기", "titleTrans": {"en": "13. Buying Clothes", "de": "13. Kleidung kaufen", "fr": "13. Acheter des vêtements", "es": "13. Comprar ropa", "pl": "13. Kupowanie ubrań", "it": "13. Comprare vestiti", "sv": "13. Köpa kläder", "fi": "13. Vaatteiden ostaminen", "ja": "13. 服を買う", "zh-CN": "13. 买衣服"}, "desc": "옷 가게에서 옷을 고르고 구매하는 방법을 연습합니다.", "descTrans": {"en": "Practice choosing and buying clothes at a clothing store.", "de": "Üben Sie, Kleidung in einem Bekleidungsgeschäft auszuwählen und zu kaufen.", "fr": "Entraînez-vous à choisir et acheter des vêtements dans un magasin de vêtements.", "es": "Practique elegir y comprar ropa en una tienda de ropa.", "pl": "Ćwicz wybieranie i kupowanie ubrań w sklepie odzieżowym.", "it": "Esercitati a scegliere e comprare vestiti in un negozio di abbigliamento.", "sv": "Öva på att välja och köpa kläder i en klädbutik.", "fi": "Harjoittele vaatteiden valitsemista ja ostamista vaatekaupassa.", "ja": "洋服店で服を選んで購入する練習をします。", "zh-CN": "练习在服装店选购和购买衣服。"}, "dialogue": [{"speaker": "지민", "text": "어서 오세요! 뭘 찾으세요?", "trans": {"en": "Welcome! What are you looking for?", "de": "Willkommen! Was suchen Sie?", "fr": "Bienvenue! Que cherchez-vous?", "es": "¡Bienvenido/a! ¿Qué busca?", "pl": "Witamy! Czego szuka Pan/Pani?", "it": "Benvenuto! Cosa cerca?", "sv": "Välkommen! Vad letar du efter?", "fi": "Tervetuloa! Mitä etsit?", "ja": "いらっしゃいませ！何をお探しですか？", "zh-CN": "欢迎光临！您在找什么？"}}, {"speaker": "수미", "text": "청바지를 찾고 있어요.", "trans": {"en": "I'm looking for jeans.", "de": "Ich suche Jeans.", "fr": "Je cherche un jean.", "es": "Estoy buscando unos vaqueros.", "pl": "Szukam dżinsów.", "it": "Sto cercando dei jeans.", "sv": "Jag letar efter jeans.", "fi": "Etsin farkkuja.", "ja": "ジーンズを探しています。", "zh-CN": "我在找牛仔裤。"}}, {"speaker": "지민", "text": "사이즈가 어떻게 돼요?", "trans": {"en": "What size are you?", "de": "Welche Größe haben Sie?", "fr": "Quelle est votre taille?", "es": "¿Qué talla tiene?", "pl": "Jaki ma Pan/Pani rozmiar?", "it": " ": "好的，给您S码。"}}], "vocab": [{"word": "청바지", "trans": {"en": "jeans", "de": "Jeans", "fr": "jean", "es": "vaqueros / jeans", "pl": "dżinsy", "it": "jeans", "sv": "jeans", "fi": "farkut", "ja": "ジーンズ", "zh-CN": "牛仔裤"}}, {"word": "사이즈", "trans": {"en": "size", "de": "Größe", "fr": "taille / taille", "es": "talla / tamaño", "pl": "rozmiar", "it": "taglia", "sv": "storlek", "fi": "koko", "ja": "サイズ", "zh-CN": "尺码/码数"}}, {"word": "입어보다", "trans": {"en": "to try on (clothes)", "de": "anprobieren", "fr": "essayer (des vêtements)", "es": "probarse (ropa)", "pl": "przymierzać", "it": "provare (vestiti)", "sv": "prova (kläder)", "fi": "sovittaa (vaatteita)", "ja": "試着する", "zh-CN": "试穿"}}, {"word": "탈의실", "trans": {"en": "fitting room / changing room", "de": "Umkleidekabine", "fr": "cabine d'essayage", "es": "probador / camerino", "pl": "przymierzalnia", "it": "camerino", "sv": "provrum / omklädningsrum", "fi": "sovitushuone", "ja": "試着室", "zh-CN": "试衣间"}}, {"word": "크다", "trans": {"en": "to be big / large", "de": "groß sein", "fr": "être grand", "es": "ser grande", "pl": "być dużym", "it": "essere grande", "sv": "vara stor", "fi": "olla iso", "ja": "大きい", "zh-CN": "大"}}, {"word": "작다", "trans": {"en": "to be small", "de": "klein sein", "fr": "être petit", "es": "ser pequeño", "pl": "być małym", "it": "essere piccolo", "sv": "vara liten", "fi": "olla pieni", "ja": "小さい", "zh-CN": "小"}}, {"word": "색깔", "trans": {"en": "color", "de": "Farbe", "fr": "couleur", "es": "color", "pl": "kolor", "it": "colore", "sv": "färg", "fi": "väri", "ja": "色", "zh-CN": "颜色"}}, {"word": "가격", "trans": {"en": "price", "de": "Preis", "fr": "prix", "es": "precio", "pl": "cena", "it": "prezzo", "sv": "pris", "fi": "hinta", "ja": "価格", "zh-CN": "价格"}}, {"word": "교환하다", "trans": {"en": "to exchange", "de": "tauschen / umtauschen", "fr": "échanger", "es": "cambiar / intercambiar", "pl": "wymienić", "it": "cambiare / scambiare", "sv": "byta", "fi": "vaihtaa", "ja": "交換する", "zh-CN": "换货/交换"}}, {"word": "할인" estionTrans": {"en": "What does Sumi want to buy?", "de": "Was möchte Sumi kaufen?", "fr": "Que veut acheter Sumi?", "es": "¿Qué quiere comprar Sumi?", "pl": "Co chce kupić Sumi?", "it": "Cosa vuole comprare Sumi?", "sv": "Vad vill Sumi köpa?", "fi": "Mitä Sumi haluaa ostaa?", "ja": "スミは何を買いたいですか？", "zh-CN": "수미想买什么？"}, "options": [{"text": "1) 티셔츠", "trans": {"en": "T-shirt", "de": "T-Shirt", "fr": "T-shirt", "es": "Camiseta", "pl": "Koszulka", "it": "T-shirt", "sv": "T-shirt", "fi": "T-paita", "ja": "Tシャツ", "zh-CN": "T恤"}}, {"text": "2) 원피스", "trans": {"en": "Dress", "de": "Kleid", "fr": "Robe", "es": "Vestido", "pl": "Sukienka", "it": "Vestito", "sv": "Klänning", "fi": "Mekko", "ja": "ワンピース", "zh-CN": "连衣裙"}}, {"text": "3) 청바지", "trans": {"en": "Jeans", "de": "Jeans", "fr": "Jean", "es": "Vaqueros", "pl": "Dżinsy", "it": "Jeans", "sv": "Jeans", "fi": "Farkut", "ja": "ジーンズ", "zh-CN": "牛仔裤"}}, {"text": "4) 코트", "trans": {"en": "Coat", "de": "Mantel", "fr": "Manteau", "es": "Abrigo", "pl": "Płaszcz", "it": "Cappotto", "sv": "Kappa", "fi": "Takki", "ja": "コート", "zh-CN": "大衣"}}], "answer": 2, "explanation": {"en": "Sumi said '청바지를 찾고 있어요' (I'm looking for jeans).", "de": "Sumi sagte '청바지를 찾고 있어요' (Ich suche Jeans).", "fr": "Sumi a dit '청바지를 찾고 있어요' (Je cherche un jean).", "es": "Sumi dijo '청바지를 찾고 있어요' (Estoy buscando vaqueros).", "pl": "Sumi powiedziała '청바지를 찾고 있어요' (Szukam dżinsów).", "it": "Sumi ha detto '청바지를 찾고 있어요' (Sto cercando dei jeans).", "sv": "Sumi sa '청바지를 찾고 있어요' (Jag letar efter jeans).", "fi": "Sumi sanoi '청바지를 찾고 있어요' (Etsin farkkuja).", "ja": "スミは「청바지를 찾고 있어요」（ジーンズを探しています）と言いました。", "zh-CN": "수미说「청바지를 찾고 있어요」（我在找牛仔裤）。"}}, {"id": 2, "type": "vocabulary", "questionAudio": "수미가 처음에 입어본 옷은 어때요?", "questionTrans": {"en": "How was the first item Sumi tried on?", "de": "Wie war das erste Teil, das Sumi anprobiert hat?", "fr": "Comment était le premier vêtement que Sumi a essayé?", "es": "¿Cómo era la primera prenda que Sumi se probó?", "pl": "Jakie było pierwsze ubranie, które Sumi przymierzyła?", "it": "Com'era il primo capo che Sumi ha provato?", "sv": "Hur var det första plagget Sumi provade?", "fi": "Millainen oli ensimmäinen vaate, jonka Sumi sovitti?", "ja": "スミが最初に試着した服はどうでしたか？", "zh-CN": "수미第一件试穿的衣服怎么样？"}, "options": [{"text": "1) 딱 맞아요", "trans": {"en": "It fits perfectly", "de": "Es passt perfekt", "fr": "Ça va parfaitement", "es": "Le queda perfecto", "pl": "Pasuje idealnie", "it": "Va benissimo", "sv": "Det passar perfekt", "fi": "Se sopii täydellisesti", "ja": "ぴったりです", "zh-CN": "刚好合适"}}, {"text": "2) 좀 작아요", "trans": {"en": "It's a bit small", "de": "Es ist etwas klein", "fr": "C'est un peu petit", "es": "Es un poco pequeño", "pl": "Jest trochę za małe", "it": "È un po' piccolo", "sv": "Det är lite litet", "fi": "Se on vähän pieni", "ja": "少し小さいです", "zh-CN": "有点小"}}, {"text": "3) 좀 커요", "trans": {"en": "It's a bit big", "de": "Es ist etwas groß", "fr": "C'est un peu grand", "es": "Es un poco grande", "pl": "Jest trochę za duże", "it": "È un po' grande", "sv": "Det är lite stort", "fi": "Se on vähän iso", "ja": "少し大きいです", "zh-CN": "有点大"}}, {"text": "4) 색깔이 이상해요", "trans": {"en": "The color is strange", "de": "Die Farbe ist seltsam", "fr": "La couleur est étrange", "es": "El color es raro", "pl": "Kolor jest dziwny", "it": "Il colore è strano", "sv": "Färgen är konstig", "fi": "Väri on outo", "ja": "色がおかしいです", "zh-CN": "颜色很奇怪"}}], "answer": 2, "explanation": {"en": "Sumi said '좀 커요' (It's a bit big), so she asked for a smaller size.", "de": "Sumi sagte '좀 커요' (Es ist etwas groß) und bat um eine kleinere Größe.", "fr": "Sumi a dit '좀 커요' (C'est un peu grand) et a demandé une taille plus petite.", "es": "Sumi dijo '좀 커요' (Es un poco grande) y pidió una talla más pequeña.", "pl": "Sumi powiedziała '좀 커요' (Jest trochę za duże) i poprosiła o mniejszy rozmiar.", "it": "Sumi ha detto '좀 커요' (È un po' grande) e ha chiesto una taglia più piccola.", "sv": "Sumi sa '좀 커요' (Det är lite stort) och bad om en mindre storlek.", "fi": "Sumi sanoi '좀 커요' (Se on vähän iso) ja pyysi pienempää kokoa.", "ja": "スミは「좀 커요」（少し大きいです）と言い、小さいサイズを求めました。", "zh-CN": "수미说「좀 커요」（有点大），所以要了小一码的。"}}, {"id": 3, "type": "detail", "questionAudio": "탈의실은 어디에 있어요?", "questionTrans": {"en": "Where is the fitting room?", "de": "Wo ist die Umkleidekabine?", "fr": "Où est la cabine d'essayage?", "es": "¿Dónde está el probador?", "pl": "Gdzie jest przymierzalnia?", "it": "Dov'è il camerino?", "sv": "Var är provrummet?", "fi": "Missä sovitushuone on?", "ja": "試着室はどこにありますか？", "zh-CN": "试衣间在哪里？"}, "options": [{"text": "1) 이쪽", "trans": {"en": "This way", "de": "Diese Seite", "fr": "Par ici", "es": "Por aquí", "pl": "W tę stronę", "it": "Da questa parte", "sv": "Åt det här hållet", "fi": "Tänne päin", "ja": "こちら", "zh-CN": "这边"}}, {"text": "2) 저쪽", "trans": {"en": "Over there", "de": "Dort drüben", "fr": "Par là", "es": "Por allá", "pl": "Tamtędy", "it": "Là", "sv": "Där borta", "fi": "Tuolla", "ja": "あちら", "zh-CN": "那边"}}, {"text": "3) 지하", "trans": {"en": "Basement", "de": "Untergeschoss", "fr": "Sous-sol", "es": "Sótano", "pl": "Piwnica", "it": "Seminterrato", "sv": "Källare", "fi": "Kellari", "ja": "地下", "zh-CN": "地下"}}, {"text": "4) 2층", "trans": {"en": "2nd floor", "de": "2. Etage", "fr": "2ème étage", "es": "2do piso", "pl": "2. piętro", "it": "2° piano", "sv": "2:a våningen", "fi": "2. kerros", "ja": "2階", "zh-CN": "2楼"}}], "answer": 1, "explanation": {"en": "Jimin said '탈의실은 저쪽이에요' (The fitting room is over there).", "de": "Jimin sagte '탈의실은 저쪽이에요' (Die Umkleidekabine ist dort drüben).", "fr": "Jimin a dit '탈의실은 저쪽이에요' (La cabine d'essayage est par là).", "es": "Jimin dijo '탈의실은 저쪽이에요' (El probador está por allá).", "pl": "Jimin powiedział '탈의실은 저쪽이에요' (Przymierzalnia jest tam).", "it": "Jimin ha detto '탈의실은 저쪽이에요' (Il camerino è là).", "sv": "Jimin sa '탈의실은 저쪽이에요' (Provrummet är där borta).", "fi": "Jimin sanoi '탈의실은 저쪽이에요' (Sovitushuone on tuolla).", "ja": "지민は「탈의실은 저쪽이에요」（試着室はあちらです）と言いました。", "zh-CN": "지민说「탈의실은 저쪽이에요」（试衣间在那边）。"}}]},
  14: {"id": 14, "title": "14. 주말 계획 세우기", "titleTrans": {"en": "14. Making Weekend Plans", "de": "14. Wochenendpläne machen", "fr": "14. Faire des projets pour le week-end", "es": "14. Hacer planes para el fin de semana", "pl": "14. Planowanie weekendu", "it": "14. Fare piani per il fine settimana", "sv": "14. Planera helgen", "fi": "14. Viikonloppusuunnitelmien tekeminen", "ja": "14. 週末の計画を立てる", "zh-CN": "14. 制定周末计划"}, "desc": "친구와 주말 계획을 세우고 약속을 잡는 방법을 연습합니다.", "descTrans": {"en": "Practice making weekend plans and setting up appointments with a friend.", "de": "Üben Sie, Wochenendpläne zu machen und Verabredungen mit einem Freund zu treffen.", "fr": "Entraînez-vous à faire des projets pour le week-end et à fixer des rendez-vous avec un ami.", "es": "Practique hacer planes para el fin de semana y establecer citas con un amigo.", "pl": "Ćwicz planowanie weekendu i umawianie się z przyjacielem.", "it": "Esercitati a fare piani per il fine settimana e a fissare appuntamenti con un amico.", "sv": "Öva på att planera helgen och boka möten med en vän.", "fi": "Harjoittele viikonloppusuunnitelmien tekemistä ja tapaamisten sopimista ystävän kanssa.", "ja": "友達と週末の計画を立て、約束をする練習をします。", "zh-CN": "练习和朋友制定周末计划并约定见面。"}, "dialogue": [{"speaker": "지민", "text": "이번 주말에 뭐 할 거야?", "trans": {"en": "What are you going to do this weekend?", "de": "Was machst du dieses Wochenende?", "fr": "Qu'est-ce que tu vas faire ce week-end?", "es": "¿Qué vas a hacer este fin de semana?", "pl": "Co będziesz robić w ten weekend?", "it": "Cosa farai questo fine settimana?", "sv": "Vad ska du göra den här helgen?", "fi": "Mitä aiot tehdä tänä viikonloppuna?", "ja": "今週末は何するの？", "zh-CN": "这个周末你打算做什么？"}}, {"speaker": "수미", "text": "아직 계획 없어. 같이 뭐 할까?", "trans": {"en": "No plans yet. What should we do together?", "de": "Noch keine Pläne. Was sollen wir zusammen machen?", "fr": "Pas encore de projets. Qu'est-ce qu'on pourrait faire ensemble?", "es": "Todavía no tengo planes. ¿Qué hacemos juntos?", "pl": "Jeszcze nie mam planów. Co możemy razem zrobić?", "it": "Non ho ancora piani. Cosa potremmo fare insieme?", "sv": "Inga planer ännu. Vad ska vi göra tillsammans?", "fi": "Ei vielä suunnitelmia. Mitä tehdään yhdessä?", "ja": "まだ計画ないよ。一緒に何しようか？", "zh-CN": "还没有计划。我们一起做什么吧？"}}, {"speaker": "지민", "text": "한강에 가서 피크닉 어때?", "trans": {"en": "How about going to the Han River for a picnic?", "de": "Wie wäre ein Picknick am Han-Fluss?", "fr": "Et si on allait faire un pique-nique au bord de la rivière Han?", "es": "¿Qué tal ir al río Han para un picnic?", "pl": "Co powiesz na piknik nad rzeką Han?", "it": "Che ne dici di un picnic al fiume Han?", "sv": "Vad sägs om en picknick vid Hanfloden?", "fi": "Entä piknik Han-joella?", "ja": "漢江に行ってピクニックはどう？", "zh-CN": "去汉江野餐怎么样？"}}, {"speaker": "수미", "text": "좋아! 몇 시에 만날까?", "trans": {"en": "Sounds good! What time should we meet?", "de": "Gut! Um wie viel Uhr treffen wir uns?", "fr": "Super! À quelle heure on se retrouve?", "es": "¡Genial! ¿A qué hora nos encontramos?", "pl": "Świetnie! O której się spotykamy?", "it": "Ottimo! A che ora ci incontriamo?", "sv": "Bra! Vilken tid ska vi träffas?", "fi": "Hyvä! Mihin aikaan tavataan?", "ja": "いいね！何時に会う？", "zh-CN": "好啊！几点见面？"}}, {"speaker": "지민", "text": "오후 2시 어때? 지하철역 앞에서 만나자.", "trans": {"en": "How about 2 PM? Let's meet in front of the subway station.", "de": "Wie wäre 14 Uhr? Treffen wir uns vor der U-Bahnstation.", "fr": "Et si c'était à 14h? Retrouvons-nous devant la station de métro.", "es": "¿Qué tal las 2 PM? Quedamos delante de la estación de metro.", "pl": "Co powiesz na 14:00? Spotkajmy się przed stacją metra.", "it": "Che ne dici delle 14? Incontriamoci davanti alla stazione della metropolitana.", "sv": "Vad sägs om kl. 14? Låt oss träffas framför tunnelbanestationen.", "fi": "Entä kello 14? Tavataan metroaseman edessä.", "ja": "午後2時はどう？地下鉄の駅の前で会おう。", "zh-CN": "下午2点怎么样？我们在地铁站前见吧。"}}, {"speaker": "수미", "text": "좋아. 음식이랑 음료수 가져올게.", "trans": {"en": "Okay. I'll bring food and drinks.", "de": "Okay. Ich bringe Essen und Getränke mit.", "fr": "D'accord. J'apporterai de la nourriture et des boissons.", "es": "De acuerdo. Traeré comida y bebidas.", "pl": "Dobrze. Przyniosę jedzenie i napoje.", "it": "Va bene. Porto del cibo e delle bevande.", "sv": "Okej. Jag tar med mat och dryck.", "fi": "Ok. Tuon ruokaa ja juomia.", "ja": "わかった。食べ物と飲み物を持ってくるよ。", "zh-CN": "好的。我带食物和饮料过来。"}}], "vocab": [{"word": "주말", "trans": {"en": "weekend", "de": "Wochenende", "fr": "week-end", "es": "fin de semana", "pl": "weekend", "it": "fine settimana", "sv": "helg / veckoslut", "fi": "viikonloppu", "ja": "週末", "zh-CN": "周末"}}, {"word": "계획", "trans": {"en": "plan", "de": "Plan", "fr": "plan / projet", "es": "plan", "pl": "plan", "it": "piano / progetto", "sv": "plan", "fi": "suunnitelma", "ja": "計画", "zh-CN": "计划"}}, {"word": "피크닉", "trans": {"en": "picnic", "de": "Picknick", "fr": "pique-nique", "es": "picnic", "pl": "piknik", "it": "picnic", "sv": "picknick", "fi": "piknik", "ja": "ピクニック", "zh-CN": "野餐"}}, {"word": "한강", "trans": {"en": "Han River", "de": "Han-Fluss", "fr": "rivière Han", "es": "río Han", "pl": "rzeka Han", "it": "fiume Han", "sv": "Hanfloden", "fi": "Han-joki", "ja": "漢江", "zh-CN": "汉江"}}, {"word": "만나다", "trans": {"en": "to meet", "de": "treffen", "fr": "rencontrer / se retrouver", "es": "encontrarse / reunirse", "pl": "spotykać się", "it": "incontrarsi", "sv": "träffa / möta", "fi": "tavata", "ja": "会う", "zh-CN": "见面/相遇"}}, {"word": "가져오다", "trans": {"en": "to bring", "de": "mitbringen", "fr": "apporter", "es": "traer", "pl": "przynosić", "it": "portare", "sv": "ta med", "fi": "tuoda", "ja": "持ってくる", "zh-CN": "带来"}}, {"word": "음료수", "trans": {"en": "drinks / beverages", "de": "Getränke", "fr": "boissons", "es": "bebidas", "pl": "napoje", "it": "bevande", "sv": "drycker", "fi": "juomat", "ja": "飲み物", "zh-CN": "饮料"}}, {"word": "약속", "trans": {"en": "promise / appointment / plans", "de": "Versprechen / Verabredung", "fr": "promesse / rendez-vous", "e
