<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한국어 듣기 공부</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        .book-shadow { box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08), 0 8px 10px -6px rgba(0,0,0,0.05); }
        .blur-text { filter: blur(6px); user-select: none; transition: all 0.3s ease; }
        .blur-text:hover { filter: blur(0); }
        .hide-translation { display: none !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        #unit-menu-dropdown { max-height: 70vh; overflow-y: auto; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-2">
            <div class="flex items-center space-x-3">
                <!-- Burger Menu -->
                <div class="relative">
                    <button id="unit-burger-btn" onclick="toggleUnitMenu()" class="p-2 bg-indigo-800 hover:bg-indigo-600 rounded-lg text-white transition flex items-center justify-center focus:outline-none" title="단원 선택 (Select Unit)">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                    <div id="unit-menu-dropdown" class="hidden absolute left-0 mt-2 w-72 bg-white rounded-xl shadow-xl border border-slate-200 z-50 p-3 space-y-1 text-slate-800 custom-scrollbar">
                        <div class="text-xs font-bold text-slate-400 px-2 py-1 border-b border-slate-100 mb-1 flex items-center justify-between sticky top-0 bg-white">
                            <span id="ui-burger-unit-title">단원 선택 <span class="unit-menu-sub font-normal text-slate-400">(Select Unit)</span></span>
                            <button onclick="toggleUnitMenu()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div id="unit-btn-list"><!-- Dynamic unit buttons --></div>
                    </div>
                </div>

                <i class="fa-solid fa-book-open text-2xl text-amber-300"></i>
                <div>
                    <h1 id="ui-main-title" class="text-xl md:text-2xl font-bold tracking-tight inline">한국어 듣기 공부</h1>
                    <span class="text-xs font-normal text-indigo-200 block sm:inline ml-0 sm:ml-2" id="ui-sub-title">(Korean Listening Study)</span>
                </div>
            </div>

            <!-- Language Selector -->
            <div class="flex items-center space-x-2 bg-indigo-800 px-3 py-1.5 rounded-lg text-sm border border-indigo-600">
                <i class="fa-solid fa-globe text-amber-300"></i>
                <span id="ui-lang-label" class="text-xs font-medium text-indigo-200 hidden sm:inline">번역 언어 (Language):</span>
                <label for="global-lang" class="sr-only">번역 언어 선택</label>
                <select id="global-lang" onchange="changeLanguage(this.value)" class="bg-transparent text-white font-semibold focus:outline-none cursor-pointer">
                    <option value="en" class="text-slate-800">English (영어)</option>
                    <option value="de" class="text-slate-800">Deutsch (독일어)</option>
                    <option value="fr" class="text-slate-800">Français (프랑스어)</option>
                    <option value="es" class="text-slate-800">Español (스페인어)</option>
                    <option value="pl" class="text-slate-800">Polski (폴란드어)</option>
                    <option value="it" class="text-slate-800">Italiano (이탈리아어)</option>
                    <option value="sv" class="text-slate-800">Svenska (스웨덴어)</option>
                    <option value="fi" class="text-slate-800">Suomi (핀란드어)</option>
                    <option value="ja" class="text-slate-800">日本語 (일본어)</option>
                    <option value="zh-CN" class="text-slate-800">中文简体 (중국어 간체)</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="flex-grow max-w-5xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">

        <!-- Sidebar -->
        <aside class="lg:col-span-1 space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-4">
                <h2 id="ui-audio-settings-title" class="font-bold text-slate-700 flex items-center gap-2 text-base border-b pb-2">
                    <i class="fa-solid fa-sliders text-indigo-600"></i> 오디오 &amp; 학습 설정
                </h2>

                <!-- Speed Controls -->
                <div>
                    <label id="ui-speed-label" class="text-xs text-slate-500 font-medium block mb-1.5">듣기 속도 (Playback Speed)</label>
                    <div class="grid grid-cols-5 gap-1 bg-slate-100 p-1 rounded-lg text-center font-medium text-[11px]">
                        <button onclick="setSpeed(0.5)" id="speed-0.5" class="speed-btn py-1.5 rounded hover:bg-white transition">0.5x</button>
                        <button onclick="setSpeed(0.75)" id="speed-0.75" class="speed-btn py-1.5 rounded hover:bg-white transition">0.75x</button>
                        <button onclick="setSpeed(1.0)" id="speed-1.0" class="speed-btn py-1.5 rounded bg-white shadow-sm text-indigo-600 font-bold transition">1.0x</button>
                        <button onclick="setSpeed(1.25)" id="speed-1.25" class="speed-btn py-1.5 rounded hover:bg-white transition">1.25x</button>
                        <button onclick="setSpeed(1.5)" id="speed-1.5" class="speed-btn py-1.5 rounded hover:bg-white transition">1.5x</button>
                    </div>
                </div>

                <!-- Visibility Toggles -->
                <div class="space-y-2">
                    <label id="ui-display-label" class="text-xs text-slate-500 font-medium block">텍스트 표시 설정 (Visibility)</label>
                    <button id="toggle-hide-all" onclick="toggleHideAll()" class="w-full py-2.5 px-3 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-semibold text-slate-700 flex items-center justify-between transition text-left">
                        <span id="hide-all-text">모든 대화 가리기<br><span class="text-[11px] font-normal text-slate-500">(Hide Scripts)</span></span>
                        <i id="hide-all-icon" class="fa-solid fa-eye-slash text-slate-500 ml-2"></i>
                    </button>
                    <button id="toggle-hide-trans" onclick="toggleHideTrans()" class="w-full py-2.5 px-3 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-semibold text-slate-700 flex items-center justify-between transition text-left">
                        <span id="hide-trans-text">모든 번역문 가리기<br><span class="text-[11px] font-normal text-slate-500">(Hide Translations)</span></span>
                        <i id="hide-trans-icon" class="fa-solid fa-language text-slate-500 ml-2"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <section class="lg:col-span-3 space-y-6">
            <div class="bg-white rounded-2xl p-5 md:p-8 book-shadow border border-slate-200 relative">

                <!-- Unit Header -->
                <div class="border-b border-slate-200 pb-5 mb-6">
                    <div class="flex items-center gap-2 mb-2">
                        <span id="unit-badge" class="px-3 py-1 bg-indigo-600 text-white text-xs font-bold rounded-full">Unit 1</span>
                        <span id="ui-subtitle-desc" class="text-xs text-slate-500 font-medium">듣기 심화 학습 (Intensive Listening)</span>
                    </div>
                    <h2 id="unit-title" class="text-2xl md:text-3xl font-extrabold text-slate-800"></h2>
                    <p id="unit-title-trans" class="text-sm md:text-base font-semibold text-indigo-600 mt-0.5 translation-text"></p>
                    <p id="unit-desc" class="text-xs md:text-sm text-slate-600 mt-2 font-medium"></p>
                    <p id="unit-desc-trans" class="text-xs md:text-sm text-slate-400 mt-0.5 translation-text"></p>
                </div>

                <!-- Step 1: Dialogue -->
                <div id="section-dialogue" class="mb-10 scroll-mt-20">
                    <div class="flex flex-wrap justify-between items-center gap-2 mb-4 border-l-4 border-indigo-600 pl-3">
                        <h3 id="ui-step1-title" class="text-lg font-bold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-comments text-indigo-600"></i> [Step 1] 대화 듣기 (Dialogue)
                        </h3>
                        <button onclick="playFullDialogue()" id="ui-play-all-btn" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-sm font-semibold text-xs flex items-center gap-2 transition active:scale-95">
                            <i class="fa-solid fa-play"></i> <span id="ui-play-all-span">전체 대화 연속 듣기 (Play All)</span>
                        </button>
                    </div>
                    <div id="dialogue-container" class="space-y-3"></div>
                </div>

                <!-- Step 2: Vocabulary -->
                <div id="section-vocab" class="mb-10 scroll-mt-20 pt-4 border-t border-slate-100">
                    <h3 id="ui-step2-title" class="text-lg font-bold text-slate-800 mb-1 border-l-4 border-emerald-500 pl-3 flex items-center gap-2">
                        <i class="fa-solid fa-spell-check text-emerald-600"></i> [Step 2] 필수 어휘 (Vocabulary)
                    </h3>
                    <p id="ui-vocab-guide" class="text-xs text-slate-500 mb-3 pl-4">단어를 클릭하면 발음을 들을 수 있습니다. (Click word to listen)</p>
                    <div id="vocab-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3"></div>
                </div>

                <!-- Step 3: Key Patterns -->
                <div id="section-patterns" class="mb-10 scroll-mt-20 pt-4 border-t border-slate-100">
                    <h3 id="ui-step3-title" class="text-lg font-bold text-slate-800 mb-4 border-l-4 border-amber-500 pl-3 flex items-center gap-2">
                        <i class="fa-solid fa-lightbulb text-amber-500"></i> [Step 3] 핵심 문형 (Key Patterns)
                    </h3>
                    <div id="patterns-container" class="space-y-3"></div>
                </div>

                <!-- Step 4: Quiz -->
                <div id="section-quiz" class="scroll-mt-20 pt-4 border-t border-slate-100">
                    <h3 id="ui-step4-title" class="text-lg font-bold text-slate-800 mb-4 border-l-4 border-rose-500 pl-3 flex items-center gap-2">
                        <i class="fa-solid fa-circle-question text-rose-500"></i> [Step 4] 실전 듣기 평가 (Quizzes)
                    </h3>
                    <div id="quiz-list" class="space-y-6"></div>
                </div>

                <!-- Unit Navigation -->
                <div class="mt-10 pt-6 border-t border-slate-200 flex flex-wrap justify-between items-center gap-3">
                    <button id="prev-unit-btn" onclick="goToPrevUnit()" class="px-4 py-2.5 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-700 hover:border-indigo-200 border border-slate-200 rounded-xl text-xs md:text-sm font-semibold text-slate-700 transition flex items-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed">
                        <i class="fa-solid fa-chevron-left"></i>
                        <div class="text-left">
                            <span id="ui-prev-unit-text" class="block font-bold">이전 단원으로 가기</span>
                            <span id="ui-prev-unit-sub" class="text-[11px] font-normal text-slate-400 block translation-text">(Previous Unit)</span>
                        </div>
                    </button>
                    <button id="next-unit-btn" onclick="goToNextUnit()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs md:text-sm font-semibold transition flex items-center gap-2 shadow-sm disabled:opacity-40 disabled:cursor-not-allowed">
                        <div class="text-right">
                            <span id="ui-next-unit-text" class="block font-bold">다음 단원으로 가기</span>
                            <span id="ui-next-unit-sub" class="text-[11px] font-normal text-indigo-200 block translation-text">(Next Unit)</span>
                        </div>
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </section>
    </main>

?", "ja": "[名詞]は？", "zh-CN": "[名词]呢？"}, "example": "수미 씨는요?", "trans": {"en": "What about you, Sumi?", "de": "Und Sie, Sumi?", "fr": "Et vous, Sumi ?", "es": "¿Y tú, Sumi?", "pl": "A ty, Sumi?", "it": "E tu, Sumi?", "sv": "Och du, Sumi?", "fi": "Entä sinä, Sumi?", "ja": "スミさんは？", "zh-CN": "秀美呢？"}}], "quizzes": [{"id": 1, "type": "comprehension", "questionAudio": "지민 씨는 몇 살이에요?", "questionTrans": {"en": "How old is Jimin?", "de": "Wie alt ist Jimin?", "fr": "Quel âge a Jimin ?", "es": "¿Cuántos años tiene Jimin?", "pl": "Ile lat ma Jimin?", "it": "Quanti anni ha Jimin?", "sv": "Hur gammal är Jimin?", "fi": "Kuinka vanha Jimin on?", "ja": "ジミンさんは何歳ですか？", "zh-CN": "智敏多大了？"}, "options": [{"text": "스물다섯 살이에요.", "trans": {"en": "25 years old.", "de": "25 Jahre alt.", "fr": "25 ans.", "es": "25 años.", "pl": "25 lat.", "it": "25 anni.", "sv": "25 år gammal.", "fi": "25-vuotias.", "ja": "25歳です。", "zh-CN": "25岁。"}}, {"text": "스물 살이에요.", "trans": {"en": "20 years old.", "de": "20 Jahre alt.", "fr": "20 ans.", "es": "20 años.", "pl": "20 lat.", "it": "20 anni.", "sv": "20 år gammal.", "fi": "20-vuotias.", "ja": "20歳です。", "zh-CN": "20岁。"}}, {"text": "서른 살이에요.", "trans": {"en": "30 years old.", "de": "30 Jahre alt.", "fr": "30 ans.", "es": "30 años.", "pl": "30 lat.", "it": "30 anni.", "sv": "30 år gammal.", "fi": "30-vuotias.", "ja": "30歳です。", "zh-CN": "30岁。"}}, {"text": "스물셋 살이에요.", "trans": {"en": "23 years old.", "de": "23 Jahre alt.", "fr": "23 ans.", "es": "23 años.", "pl": "23 lata.", "it": "23 anni.", "sv": "23 år gammal.", "fi": "23-vuotias.", "ja": "23歳です。", "zh-CN": "23岁。"}}], "answer": 0, "explanation": {"en": "Jimin said '저는 스물다섯 살이에요' meaning he is 25 years old.", "de": "Jimin sagte '저는 스물다섯 살이에요', was bedeutet, er ist 25 Jahre alt.", "fr": "Jimin a dit '저는 스물다섯 살이에요', ce qui signifie qu'il a 25 ans.", "es": "Jimin dijo '저는 스물다섯 살이에요', que significa que tiene 25 años.", "pl": "Jimin powiedział '저는 스물다섯 살이에요', co oznacza, że ma 25 lat.", "it": "Jimin ha detto '저는 스물다섯 살이에요', che significa che ha 25 anni.", "sv": "Jimin sa '저는 스물다섯 살이에요', vilket betyder att han är 25 år gammal.", "fi": "Jimin sanoi '저는 스물다섯 살이에요', mikä tarkoittaa, että hän on 25-vuotias.", "ja": "ジミンさんは「저는 스물다섯 살이에요」と言い、25歳であることを意味します。", "zh-CN": "智敏说'저는 스물다섯 살이에요'，意思是他25岁。"}}, {"id": 2, "type": "vocabulary", "questionAudio": "'반가워요'는 무슨 뜻이에요?", "questionTrans": {"en": "What does '반가워요' mean?", "de": "Was bedeutet '반가워요'?", "fr": "Que signifie '반가워요' ?", "es": "¿Qué significa '반가워요'?", "pl": "Co oznacza '반가워요'?", "it": "Cosa significa '반가워요'?", "sv": "Vad betyder '반가워요'?", "fi": "Mitä '반가워요' tarkoittaa?", "ja": "「반가워요」はどういう意味ですか？", "zh-CN": "'반가워요'是什么意思？"}, "options": [{"text": "안녕히 가세요", "trans": {"en": "Goodbye", "de": "Auf Wiedersehen", "fr": "Au revoir", "es": "Adiós", "pl": "Do widzenia", "it": "Arrivederci", "sv": "Hejdå", "fi": "Näkemiin", "ja": "さようなら", "zh-CN": "再见"}}, {"text": "감사합니다", "trans": {"en": "Thank you", "de": "Danke", "fr": "Merci", "es": "Gracias", "pl": "Dziękuję", "it": "Grazie", "sv": "Tack", "fi": "Kiitos", "ja": "ありがとうございます", "zh-CN": "谢谢"}}, {"text": "반갑습니다 / 만나서 반가워요", "trans": {"en": "Nice to meet you", "de": "Schön, Sie kennenzulernen", "fr": "Enchanté(e)", "es": "Mucho gusto", "pl": "Miło mi cię poznać", "it": "Piacere di conoscerti", "sv": "Trevligt att träffas", "fi": "Hauska tavata", "ja": "はじめまして", "zh-CN": "很高兴认识你"}}, {"text": "죄송합니다", "trans": {"en": "I'm sorry", "de": "Es tut mir leid", "fr": "Je suis désolé(e)", "es": "Lo siento", "pl": "Przepraszam", "it": "Mi dispiace", "sv": "Förlåt", "fi": "Olen pahoillani", "ja": "すみません", "zh-CN": "对不起"}}], "answer": 2, "explanation": {"en": "'반가워요' is used when you meet someone for the first time, meaning 'Nice to meet you'.", "de": "'반가워요' wird verwendet, wenn man jemanden zum ersten Mal trifft, und bedeutet 'Schön, Sie kennenzulernen'.", "fr": "'반가워요' est utilisé quand on rencontre quelqu'un pour la première fois, signifiant 'Enchanté(e)'.", "es": "'반가워요' se usa cuando conoces a alguien por primera vez, significando 'Mucho gusto'.", "pl": "'반가워요' jest używane, gdy spotykasz kogoś po raz pierwszy, co oznacza 'Miło mi cię poznać'.", "it": "'반가워요' si usa quando si incontra qualcuno per la prima volta, significando 'Piacere di conoscerti'.", "sv": "'반가워요' används när man träffar någon för första gången, och betyder 'Trevligt att träffas'.", "fi": "'반가워요' käytetään kun tapaat jonkun ensimmäistä kertaa, tarkoittaen 'Hauska tavata'.", "ja": "「반가워요」は初めて会う人に使い、「はじめまして」を意味します。", "zh-CN": "'반가워요'用于初次见面时，意思是'很高兴认识你'。"}}, {"id": 3, "type": "grammar", "questionAudio": "빈칸에 알맞은 것은? '저는 미국 ___ 이에요.'", "questionTrans": {"en": "What fits in the blank? 'I am ___ American.'", "de": "Was passt in die Lücke? 'Ich bin ___ Amerikaner.'", "fr": "Que met-on dans le blanc ? 'Je suis ___ américain(e).'", "es": "¿Qué va en el espacio en blanco? 'Soy ___ americano/a.'", "pl": "Co pasuje do luki? 'Jestem ___ Amerykaninem/Amerykanką.'", "it": "Cosa va nello spazio? 'Sono ___ americano/a.'", "sv": "Vad passar i tomrummet? 'Jag är ___ amerikan.'", "fi": "Mikä sopii aukkoon? 'Olen ___ amerikkalainen.'", "ja": "空欄に入るのは？「私はアメリカ___です。」", "zh-CN": "空格中应填什么？'我是美国___。'"}, "options": [{"text": "것", "trans": {"en": "thing", "de": "Sache", "fr": "chose", "es": "cosa", "pl": "rzecz", "it": "cosa", "sv": "sak", "fi": "asia", "ja": "もの", "zh-CN": "东西"}}, {"text": "때", "trans": {"en": "time/when", "de": "Zeit/wann", "fr": "temps/quand", "es": "tiempo/cuando", "pl": "czas/kiedy", "it": "tempo/quando", "sv": "tid/när", "fi": "aika/kun", "ja": "とき", "zh-CN": "时候/当"}}, {"text": "도", "trans": {"en": "also/too", "de": "auch", "fr": "aussi", "es": "también", "pl": "też", "it": "anche", "sv": "också", "fi": "myös", "ja": "も", "zh-CN": "也"}}, {"text": "사람", "trans": {"en": "person", "de": "Person", "fr": "personne", "es": "persona", "pl": "osoba", "it": "persona", "sv": "person", "fi": "henkilö", "ja": "人", "zh-CN": "人"}}], "answer": 3, "explanation": {"en": "'사람' means 'person'. The pattern '[country] 사람이에요' means 'I am a person from [country]'.", "de": "'사람' bedeutet 'Person'. Das Muster '[Land] 사람이에요' bedeutet 'Ich bin eine Person aus [Land]'.", "fr": "'사람' signifie 'personne'. Le modèle '[pays] 사람이에요' signifie 'Je suis une personne de [pays]'.", "es": "'사람' significa 'persona'. El patrón '[país] 사람이에요' significa 'Soy una persona de [país]'.", "pl": "'사람' oznacza 'osoba'. Wzorzec '[kraj] 사람이에요' oznacza 'Jestem osobą z [kraju]'.", "it": "'사람' significa 'persona'. Il modello '[paese] 사람이에요' significa 'Sono una persona di [paese]'.", "sv": "'사람' betyder 'person'. Mönstret '[land] 사람이에요' betyder 'Jag är en person från [land]'.", "fi": "'사람' tarkoittaa 'henkilö'. Kaava '[maa] 사람이에요' tarkoittaa 'Olen henkilö [maasta]'.", "ja": "「사람」は「人」を意味します。「[国] 사람이에요」というパターンは「[国]の人です」を意味します。", "zh-CN": "'사람'意思是'人'。模式'[国家] 사람이에요'意思是'我是[国家]人'。"}}, {"type": "comprehension", "questionAudio": "수미 씨는 어느 나라 사람이에요?", "questionTrans": {"en": "What country is Sumi from?", "de": "Aus welchem Land kommt Sumi?", "fr": "De quel pays vient Sumi ?", "es": "¿De qué país es Sumi?", "pl": "Z jakiego kraju pochodzi Sumi?", "it": "Da quale paese viene Sumi?", "sv": "Vilket land kommer Sumi från?", "fi": "Mistä maasta Sumi on kotoisin?", "ja": "スミさんはどの国の人ですか？", "zh-CN": "秀美是哪国人？"}, "options": [{"text": "미국 사람이에요.", "trans": {"en": "She's American.", "de": "Sie ist Amerikanerin.", "fr": "Elle est américaine.", "es": "Es americana.", "pl": "Jest Amerykanką.", "it": "È americana.", "sv": "Hon är amerikan.", "fi": "Hän on amerikkalainen.", "ja": "アメリカ人です。", "zh-CN": "她是美国人。"}}, {"text": "한국 사람이에요.", "trans": {"en": "She's Korean.", "de": "Sie ist Koreanerin.", "fr": "Elle est coréenne.", "es": "Es coreana.", "pl": "Jest Koreanką.", "it": "È coreana.", "sv": "Hon är korean.", "fi": "Hän on korealainen.", "ja": "韓国人です。", "zh-CN": "她是韩国人。"}}, {"text": "중국 사람이에요.", "trans": {"en": "She's Chinese.", "de": "Sie ist Chinesin.", "fr": "Elle est chinoise.", "es": "Es china.", "pl": "Jest Chinką.", "it": "È cinese.", "sv": "Hon är kines.", "fi": "Hän on kiinalainen.", "ja": "中国人です。", "zh-CN": "她是中国人。"}}, {"text": "일본 사람이에요.", "trans": {"en": "She's Japanese.", "de": "Sie ist Japanerin.", "fr": "Elle est japonaise.", "es": "Es japonesa.", "pl": "Jest Japonką.", "it": "È giapponese.", "sv": "Hon är japan.", "fi": "Hän on japanilainen.", "ja": "日本人です。", "zh-CN": "她是日本人。"}}], "answer": 1, "explanation": {"en": "In the dialogue, Sumi says 저도 한국 사람이에요 (I'm also Korean).", "de": "Im Dialog sagt Sumi 저도 한국 사람이에요.", "fr": "Dans le dialogue, Sumi dit 저도 한국 사람이에요.", "es": "En el diálogo, Sumi dice 저도 한국 사람이에요.", "pl": "W dialogu Sumi mówi 저도 한국 사람이에요.", "it": "Nel dialogo, Sumi dice 저도 한국 사람이에요.", "sv": "I dialogen säger Sumi 저도 한국 사람이에요.", "fi": "Dialogissa Sumi sanoo 저도 한국 사람이에요.", "ja": "スミは저도 한국 사람이에요と言います。", "zh-CN": "对话中秀美说저도 한국 사람이에요。"}}]},
  2: {"id": 2, "title": "2. 카페에서 주문하기", "titleTrans": {"en": "2. Ordering at a Café", "de": "2. Im Café bestellen", "fr": "2. Commander dans un café", "es": "2. Pedir en una cafetería", "pl": "2. Zamawianie w kawiarni", "it": "2. Ordinare in un caffè", "sv": "2. Beställa på ett café", "fi": "2. Tilaaminen kahvilassa", "ja": "2. カフェで注文する", "zh-CN": "2. 在咖啡馆点单"}, "desc": "카페에서 음료와 음식을 주문하는 방법을 배웁니다.", "descTrans": {"en": "Learn how to order drinks and food at a café.", "de": "Lernen Sie, wie man in einem Café Getränke und Essen bestellt.", "fr": "Apprenez à commander des boissons et de la nourriture dans un café.", "es": "Aprende a pedir bebidas y comida en una cafetería.", "pl": "Naucz się zamawiać napoje i jedzenie w kawiarni.", "it": "Impara come ordinare bevande e cibo in un caffè.", "sv": "Lär dig hur du beställer drycker och mat på ett café.", "fi": "Opi tilaamaan juomia ja ruokaa kahvilassa.", "ja": "カフェで飲み物と食べ物を注文する方法を学びます。", "zh-CN": "学习如何在咖啡馆点饮料和食物。"}, "dialogue": [{"speaker": "수미", "text": "어서 오세요! 주문하시겠어요?", "trans": {"en": "Welcome! Are you ready to order?", "de": "Willkommen! Möchten Sie bestellen?", "fr": "Bienvenue ! Vous désirez commander ?", "es": "¡Bienvenido/a! ¿Quiere pedir?", "pl": "Witamy! Czy chce pan/pani zamówić?", "it": "Benvenuto/a! Vuole ordinare?", "sv": "Välkommen! Vill du beställa?", "fi": "Tervetuloa! Haluatteko tilata?", "ja": "いらっしゃいませ！ご注文はよろしいですか？", "zh-CN": "欢迎光临！请问要点单吗？"}}, {"speaker": "지민", "text": "네, 아메리카노 한 잔 주세요.", "trans": {"en": "Yes, one Americano please.", "de": "Ja, einen Americano bitte.", "fr": "Oui, un americano s'il vous plaît.", "es": "Sí, un americano por favor.", "pl": "Tak, proszę jeden americano.", "it": "Sì, un americano per favore.", "sv": "Ja, en americano tack.", "fi": "Kyllä, yksi americano kiitos.", "ja": "はい、アメリカーノを一杯ください。", "zh-CN": "好的，请给我一杯美式咖啡。"}}, {"speaker": "수미", "text": "뜨겁게 드릴까요, 차갑게 드릴까요?", "trans": {"en": "Would you like it hot or cold?", "de": "Möchten Sie es heiß oder kalt?", "fr": "Vous le voulez chaud ou froid ?", "es": "¿Lo quiere caliente o frío?", "pl": "Czy chce pan/pani na gorąco czy na zimno?", "it": "Lo vuole caldo o freddo?", "sv": "Vill du ha det varmt eller kallt?", "fi": "Haluatteko sen kuumana vai kylmänä?", "ja": "ホットにしますか、アイスにしますか？", "zh-CN": "要热的还是冷的？"}}, {"speaker": "지민", "text": "차갑게 주세요. 얼마예요?", "trans": {"en": "Cold please. How much is it?", "de": "Kalt bitte. Wie viel kostet es?", "fr": "Froid s'il vous plaît. Combien ça coûte ?", "es": "Frío por favor. ¿Cuánto cuesta?", "pl": "Na zimno proszę. Ile to kosztuje?", "it": "Freddo per favore. Quanto costa?", "sv": "Kallt tack. Hur mycket kostar det?", "fi": "Kylmänä kiitos. Paljonko se maksaa?", "ja": "アイスでお願いします。いくらですか？", "zh-CN": "冰的请。多少钱？"}}, {"speaker": "수미", "text": "사천오백 원이에요.", "trans": {"en": "It's 4,500 won.", "de": "Es kostet 4.500 Won.", "fr": "C'est 4 500 wons.", "es": "Son 4.500 wons.", "pl": "To 4 500 wonów.", "it": "Sono 4.500 won.", "sv": "Det är 4 500 won.", "fi": "Se on 4 500 wonia.", "ja": "4,500ウォンです。", "zh-CN": "4500韩元。"}}, {"speaker": "지민", "text": "여기요, 카드로 계산할게요.", "trans": {"en": "Here, I'll pay by card.", "de": "Hier, ich zahle mit Karte.", "fr": "Voilà, je vais payer par carte.", "es": "Aquí, voy a pagar con tarjeta.", "pl": "Tutaj, zapłacę kartą.", "it": "Ecco, pagherò con carta.", "sv": "Här, jag betalar med kort.", "fi": "Tässä, maksan kortilla.", "ja": "カードで支払います。", "zh-CN": "这里，我用卡付款。"}}], "vocab": [{"word": "주문하다", "trans": {"en": "To order", "de": "Bestellen", "fr": "Commander", "es": "Pedir/Ordenar", "pl": "Zamawiać", "it": "Ordinare", "sv": "Beställa", "fi": "Tilata", "ja": "注文する", "zh-CN": "点单"}}, {"word": "아메리카노", "trans": {"en": "Americano (coffee)", "de": "Americano (Kaffee)", "fr": "Americano (café)", "es": "Americano (café)", "pl": "Americano (kawa)", "it": "Americano (caffè)", "sv": "Americano (kaffe)", "fi": "Americano (kahvi)", "ja": "アメリカーノ", "zh-CN": "美式咖啡"}}, {"word": "한 잔", "trans": {"en": "One cup/glass", "de": "Ein Glas/Tasse", "fr": "Un verre/tasse", "es": "Un vaso/taza", "pl": "Jedna szklanka/filiżanka", "it": "Un bicchiere/tazza", "sv": "Ett glas/kopp", "fi": "Yksi lasi/kuppi", "ja": "一杯", "zh-CN": "一杯"}}, {"word": "뜨겁다", "trans": {"en": "Hot", "de": "Heiß", "fr": "Chaud", "es": "Caliente", "pl": "Gorący", "it": "Caldo", "sv": "Varm", "fi": "Kuuma", "ja": "熱い", "zh-CN": "热的"}}, {"word": "차갑다", "trans": {"en": "Cold", "de": "Kalt", "fr": "Froid", "es": "Frío", "pl": "Zimny", "it": "Freddo", "sv": "Kall", "fi": "Kylmä", "ja": "冷たい", "zh-CN": "冷的"}}, {"word": "얼마예요?", "trans": {"en": "How much is it?", "de": "Wie viel kostet es?", "fr": "Combien ça coûte ?", "es": "¿Cuánto cuesta?", "pl": "Ile to kosztuje?", "it": "Quanto costa?", "sv": "Hur mycket kostar det?", "fi": "Paljonko se maksaa?", "ja": "いくらですか？", "zh-CN": "多少钱？"}}, {"word": "카드", "trans": {"en": "Card (credit/debit)", "de": "Karte (Kredit-/Debitkarte)", "fr": "Carte (crédit/débit)", "es": "Tarjeta (crédito/débito)", "pl": "Karta (kredytowa/debetowa)", "it": "Carta (credito/debito)", "sv": "Kort (kredit/debet)", "fi": "Kortti (luotto/debet)", "ja": "カード（クレジット/デビット）", "zh-CN": "卡（信用/借记）"}}, {"word": "계산하다", "trans": {"en": "To pay / to calculate", "de": "Bezahlen / berechnen", "fr": "Payer / calculer", "es": "Pagar / calcular", "pl": "Płacić / obliczać", "it": "Pagare / calcolare", "sv": "Betala / beräkna", "fi": "Maksaa / laskea", "ja": "支払う/計算する", "zh-CN": "结账/计算"}}, {"word": "주세요", "trans": {"en": "Please give me", "de": "Bitte geben Sie mir", "fr": "Donnez-moi s'il vous plaît", "es": "Por favor dame", "pl": "Proszę mi dać", "it": "Per favore datemi", "sv": "Ge mig tack", "fi": "Anna minulle kiitos", "ja": "ください", "zh-CN": "请给我"}}, {"word": "원", "trans": {"en": "Won (Korean currency)", "de": "Won (Koreanische Währung)", "fr": "Won (monnaie coréenne)", "es": "Won (moneda coreana)", "pl": "Won (koreańska waluta)", "it": "Won (valuta coreana)", "sv": "Won (koreansk valuta)", "fi": "Won (Korean valuutta)", "ja": "ウォン（韓国通貨）", "zh-CN": "韩元（ : "Shall I give it to you hot?", "de": "Soll ich es Ihnen heiß geben?", "fr": "Voulez-vous que je vous le donne chaud ?", "es": "¿Se lo doy caliente?", "pl": "Czy mam ci to podać na gorąco?", "it": "Glielo do caldo?", "sv": "Ska jag ge det till dig varmt?", "fi": "Annanko sen sinulle kuumana?", "ja": "ホットにしますか？", "zh-CN": "给您热的吗？"}}], "quizzes": [{"id": 1, "type": "comprehension", "questionAudio": "지민 씨는 무엇을 주문했어요?", "questionTrans": {"en": "What did Jimin order?", "de": "Was hat Jimin bestellt?", "fr": "Qu'est-ce que Jimin a commandé ?", "es": "¿Qué pidió Jimin?", "pl": "Co zamówił Jimin?", "it": "Cosa ha ordinato Jimin?", "sv": "Vad beställde Jimin?", "fi": "Mitä Jimin tilasi?", "ja": "ジミンさんは何を注文しましたか？", "zh-CN": "智敏点了什么？"}, "options": [{"text": "따뜻한 라떼", "trans": {"en": "Hot latte", "de": "Warmer Latte", "fr": "Latte chaud", "es": "Latte caliente", "pl": "Ciepłe latte", "it": "Latte caldo", "sv": "Varm latte", "fi": "Lämmin latte", "ja": "温かいラテ", "zh-CN": "热拿铁"}}, {"text": "차가운 아메리카노", "trans": {"en": "Iced Americano", "de": "Eiskalter Americano", "fr": "Americano glacé", "es": "Americano frío", "pl": "Zimny americano", "it": "Americano freddo", "sv": "Iskallt americano", "fi": "Kylmä americano", "ja": "アイスアメリカーノ", "zh-CN": "冰美式咖啡"}}, {"text": "따뜻한 아메리카노", "trans": {"en": "Hot Americano", "de": "Heißer Americano", "fr": "Americano chaud", "es": "Americano caliente", "pl": "Ciepły americano", "it": "Americano caldo", "sv": "Varmt americano", "fi": "Lämmin americano", "ja": "ホットアメリカーノ", "zh-CN": "热美式咖啡"}}, {"text": "차가운 라떼", "trans": {"en": "Iced latte", "de": "Eiskalter Latte", "fr": "Latte glacé", "es": "Latte frío", "pl": "Zimne latte", "it": "Latte freddo", "sv": "Iskallt latte", "fi": "Kylmä latte", "ja": "アイスラテ", "zh-CN": "冰拿铁"}}], "answer": 1, "explanation": {"en": "Jimin ordered an Americano ('아메리카노') and asked for it cold ('차갑게').", "de": "Jimin bestellte einen Americano ('아메리카노') und bat darum, ihn kalt ('차갑게') zu bekommen.", "fr": "Jimin a commandé un Americano ('아메리카노') et a demandé qu'il soit froid ('차갑게').", "es": "Jimin pidió un Americano ('아메리카노') y lo quería frío ('차갑게').", "pl": "Jimin zamówił Americano ('아메리카노') i poprosił o zimne ('차갑게').", "it": "Jimin ha ordinato un Americano ('아메리카노') e lo ha chiesto freddo ('차갑게').", "sv": "Jimin beställde en Americano ('아메리카노') och ville ha den kall ('차갑게').", "fi": "Jimin tilasi Americano ('아메리카노') ja halusi sen kylmänä ('차갑게').", "ja": "ジミンさんはアメリカーノ（아메리카노）を注文し、冷たく（차갑게）してもらいました。", "zh-CN": "智敏点了美式咖啡（아메리카노），并要求冷的（차갑게）。"}}, {"id": 2, "type": "vocabulary", "questionAudio": "'얼마예요?'는 무슨 뜻이에요?", "questionTrans": {"en": "What does '얼마예요?' mean?", "de": "Was bedeutet '얼마예요?'?", "fr": "Que signifie '얼마예요?' ?", "es": "¿Qué significa '얼마예요?'?", "pl": "Co oznacza '얼마예요?'?", "it": "Cosa significa '얼마예요?'?", "sv": "Vad betyder '얼마예요?'?", "fi": "Mitä '얼마예요?' tarkoittaa?", "ja": "「얼마예요?」はどういう意味ですか？", "zh-CN": "'얼마예요?'是什么意思？"}, "options": [{"text": "어디에 있어요?", "trans": {"en": "Where is it?", "de": "Wo ist es?", "fr": "Où est-il ?", "es": "¿Dónde está?", "pl": "Gdzie to jest?", "it": "Dov'è?", "sv": "Var är det?", "fi": "Missä se on?", "ja": "どこにありますか？", "zh-CN": "在哪里？"}}, {"text": "뭐예요?", "trans": {"en": "What is it?", "de": "Was ist das?", "fr": "Qu'est-ce que c'est ?", "es": "¿Qué es eso?", "pl": "Co to jest?", "it": "Cos'è?", "sv": "Vad är det?", "fi": "Mikä se on?", "ja": "何ですか？", "zh-CN": "是什么？"}}, {"text": "맛있어요?", "trans": {"en": "Is it delicious?", "de": "Ist es lecker?", "fr": "Est-ce délicieux ?", "es": "¿Está delicioso?", "pl": "Czy to jest smaczne?", "it": "È delizioso?", "sv": "Är det gott?", "fi": "Onko se hyvää?", "ja": "おいしいですか？", "zh-CN": "好吃吗？"}}, {"text": "얼마예요? = 가격이 얼마예요?", "trans": {"en": "How much is it?", "de": "Wie viel kostet es?", "fr": "Combien ça coûte ?", "es": "¿Cuánto cuesta?", "pl": "Ile to kosztuje?", "it": "Quanto costa?", "sv": "Hur mycket kostar det?", "fi": "Paljonko se maksaa?", "ja": "いくらですか？", "zh-CN": "多少钱？"}}], "answer": 3, "explanation": {"en": "'얼마예요?' is used to ask the price of something, meaning 'How much is it?'", "de": "'얼마예요?' wird verwendet, um nach dem Preis zu fragen, und bedeutet 'Wie viel kostet es?'", "fr": "'얼마예요?' est utilisé pour demander le prix de quelque chose, signifiant 'Combien ça coûte ?'", "es": "'얼마예요?' se usa para preguntar el precio de algo, significando '¿Cuánto cuesta?'", "pl": "'얼마예요?' jest używane do pytania o cenę czegoś, co oznacza 'Ile to kosztuje?'", "it": "'얼마예요?' viene usato per chiedere il prezzo di qualcosa, significando 'Quanto costa?'", "sv": "'얼마예요?' används för att fråga priset på något, och betyder 'Hur mycket kostar det?'", "fi": "'얼마예요?' käytetään jonkin hinnan kysymiseen, tarkoittaen 'Paljonko se maksaa?'", "ja": "「얼마예요?」は何かの値段を聞くために使い、「いくらですか？」を意味します。", "zh-CN": "'얼마예요?'用于询问某物的价格，意思是'多少钱？'"}}, {"id": 3, "type": "grammar", "questionAudio": "맞는 문장을 고르세요: 카페에서 어떻게 주문해요?", "questionTrans": {"en": "Choose the correct sentence: How do you order at a café?", "de": "Wählen Sie den richtigen Satz: Wie bestellt man in einem Café?", "fr": "Choisissez la bonne phrase : Comment commande-t-on dans un café ?", "es": "Elige la frase correcta: ¿Cómo se pide en una cafetería?", "pl": "Wybierz poprawne zdanie: Jak się zamawia w kawiarni?", "it": "Scegli la frase corretta: Come si ordina in un caffè?", "sv": "Välj den korrekta meningen: Hur beställer man på ett café?", "fi": "Valitse oikea lause: Miten tilataan kahvilassa?", "ja": "正しい文を選んでください：カフェでどうやって注文しますか？", "zh-CN": "选择正确的句子：在咖啡馆怎么点单？"}, "options": [{"text": "아메리카노 주세요.", "trans": {"en": "Americano please.", "de": "Einen Americano bitte.", "fr": "Un americano s'il vous plaît.", "es": "Un americano por favor.", "pl": "Proszę americano.", "it": "Un americano per favore.", "sv": "En americano tack.", "fi": "Americano kiitos.", "ja": "アメリカーノをください。", "zh-CN": "请给我美式咖啡。"}}, {"text": "아메리카노 먹어요.", "trans": {"en": "I eat an Americano.", "de": "Ich esse einen Americano.", "fr": "Je mange un americano.", "es": "Me como un americano.", "pl": "Jem americano.", "it": "Mangio un americano.", "sv": "Jag äter en americano.", "fi": "Syön americanon.", "ja": "アメリカーノを食べます。", "zh-CN": "我吃美式咖啡。"}}, {"text": "아메리카노 봐요.", "trans": {"en": "I see an Americano.", "de": "Ich sehe einen Americano.", "fr": "Je vois un americano.", "es": "Veo un americano.", "pl": "Widzę americano.", "it": "Vedo un americano.", "sv": "Jag ser en americano.", "fi": "Näen americanon.", "ja": "アメリカーノを見ます。", "zh-CN": "我看到美式咖啡。"}}, {"text": "아메리카노 가요.", "trans": {"en": "I go to Americano.", "de": "Ich gehe zum Americano.", "fr": "Je vais à l'americano.", "es": "Voy al americano.", "pl": "Idę do americano.", "it": "Vado all'americano.", "sv": "Jag går till americano.", "fi": "Menen americanoon.", "ja": "アメリカーノに行きます。", "zh-CN": "我去美式咖啡。"}}], "answer": 0, "explanation": {"en": "'주세요' is the polite way to ask for something ('please give me'). It's the standard phrase when ordering.", "de": "'주세요' ist die höfliche Art, um etwas zu bitten ('bitte geben Sie mir'). Es ist der Standardausdruck beim Bestellen.", "fr": "'주세요' est la façon polie de demander quelque chose ('donnez-moi s'il vous plaît'). C'est la formule standard pour commander.", "es": "'주세요' es la forma cortés de pedir algo ('por favor dame'). Es la frase estándar al pedir.", "pl": "'주세요' to grzeczny sposób na prośbę o coś ('proszę mi dać'). To standardowe wyrażenie przy zamawianiu.", "it": "'주세요' è il modo educato per chiedere qualcosa ('per favore datemi'). È la frase standard quando si ordina.", "sv": "'주세요' är det artiga sättet att be om något ('ge mig tack'). Det är standardfrasen när man beställer.", "fi": "'주세요' on kohtelias tapa pyytää jotakin ('anna minulle kiitos'). Se on vakiofraasi tilattaessa.", "ja": "「주세요」は何かを丁寧に頼む方法（「ください」）で、注文するときの標準的なフレーズです。", "zh-CN": "'주세요'是礼貌地要求某物的方式（'请给我'），是点单时的标准用语。"}}, {"type": "comprehension", "questionAudio": "커피 값이 얼마예요?", "questionTrans": {"en": "How much does the coffee cost?", "de": "Wie viel kostet der Kaffee?", "fr": "Combien   3: {"id": 3, "title": "3. 교통수단 이용하기", "titleTrans": {"en": "3. Using Public Transport", "de": "3. Öffentliche Verkehrsmittel nutzen", "fr": "3. Utiliser les transports en commun", "es": "3. Usar el transporte público", "pl": "3. Korzystanie z transportu publicznego", "it": "3. Usare i trasporti pubblici", "sv": "3. Använda kollektivtrafik", "fi": "3. Julkisen liikenteen käyttäminen", "ja": "3. 公共交通機関の利用", "zh-CN": "3. 使用公共交通"}, "desc": "버스와 지하철을 이용하는 방법을 배웁니다.", "descTrans": {"en": "Learn how to use buses and the subway.", "de": "Lernen Sie, wie man Busse und die U-Bahn benutzt.", "fr": "Apprenez à utiliser les bus et le métro.", "es": "Aprende a usar los autobuses y el metro.", "pl": "Naucz się korzystać z autobusów i metra.", "it": "Impara come usare gli autobus e la metropolitana.", "sv": "Lär dig hur du använder bussar och tunnelbanan.", "fi": "Opi käyttämään busseja ja metroa.", "ja": "バスと地下鉄の使い方を学びます。", "zh-CN": "学习如何乘坐公交车和地铁。"}, "dialogue": [{"speaker": "지민", "text": "저기요, 시청역에 가려면 어떻게 해요?", "trans": {"en": "Excuse me, how do I get to City Hall station?", "de": "Entschuldigung, wie komme ich zur Station City Hall?", "fr": "Excusez-moi, comment puis-je aller à la station Mairie ?", "es": "Perdone, ¿cómo puedo ir a la estación del Ayuntamiento?", "pl": "Przepraszam, jak dostać się do stacji Ratusz?", "it": "Scusi, come posso arrivare alla stazione del Municipio?", "sv": "Ursäkta, hur tar jag mig till Stadshuset-stationen?", "fi": "Anteeksi, miten pääsen Kaupungintalo-asemalle?", "ja": "すみません、市庁駅にはどうやって行きますか？", "zh-CN": "请问，去市厅站怎么走？"}}, {"speaker": "수미", "text": "지하철 1호선을 타세요.", "trans": {"en": "Take subway Line 1.", "de": "Nehmen Sie die U-Bahn-Linie 1.", "fr": "Prenez la ligne 1 du métro.", "es": "Tome la línea 1 del metro.", "pl": "Proszę wsiąść w metro linia 1.", "it": "Prenda la linea 1 della metropolitana.", "sv": "Ta tunnelbanelinje 1.", "fi": "Ota metrolin 1.", "ja": "地下鉄1号線に乗ってください。", "zh-CN": "乘地铁1号线。"}}, {"speaker": "지민", "text": "어디서 타요?", "trans": {"en": "Where do I get on?", "de": "Wo steige ich ein?", "fr": "Où est-ce que je monte ?", "es": "¿Dónde me subo?", "pl": "Gdzie wsiadać?", "it": "Dove salgo?", "sv": "Var stiger jag på?", "fi": "Mistä nousen?", "ja": "どこで乗りますか？", "zh-CN": "在哪里上车？"}}, {"speaker": "수미", "text": "저기 지하철 입구에서 타세요. 두 정거장이에요.", "trans": {"en": "Take it at the subway entrance over there. It's two stops.", "de": "Steigen Sie dort am U-Bahn-Eingang ein. Es sind zwei Stationen.", "fr": "Montez à l'entrée du métro là-bas. C'est deux arrêts.", "es": "Súbase en la entrada del metro de allí. Son dos paradas.", "pl": "Proszę wsiąść przy wejściu do metra tam. To dwa przystanki.", "it": "Salga all'ingresso della metropolitana lì. Sono due fermate.", "sv": "Ta den vid tunnelbaneingången däröver. Det är två hållplatser.", "fi": "Ota se siellä metron sisäänkäynnistä. Se on kaksi pysäkkiä.", "ja": "あそこの地下鉄の入口で乗ってください。2駅です。", "zh-CN": "在那边地铁入口乘坐。两站路。"}}, {"speaker": "지민", "text": "버스도 있어요?", "trans": {"en": "Is there also a bus?", "de": "Gibt es auch einen Bus?", "fr": "Y a-t-il aussi un bus ?", "es": "¿También hay un autobús?", "pl": "Czy jest też autobus?", "it": "C'è anche un autobus?", "sv": "Finns det också en buss?", "fi": "Onko myös bussi?", "ja": "バスもありますか？", "zh-CN": "也有公交车吗？"}}, {"speaker": "수미", "text": "네, 302번 버스를 타면 돼요.", "trans": {"en": "Yes, you can take bus number 302.", "de": "Ja, Sie können den Bus Nummer 302 nehmen.", "fr": "Oui, vous pouvez prendre le bus numéro 302.", "es": "Sí, puede tomar el autobús número 302.", "pl": "Tak, można wsiąść w autobus numer 302.", "it": "Sì, può prendere l'autobus numero 302.", "sv": "Ja, du kan ta buss nummer 302.", "fi": "Kyllä, voit ottaa bussin numero 302.", "ja": "はい、302番のバスに乗れます。", "zh-CN": "是的，坐302路公交车就行。"}}, {"speaker": "지민", "text": "감사합니다!", "trans": {"en": "Thank you!", "de": "Danke schön!", "fr": "Merci !", "es": "¡Gracias!", "pl": "Dziękuję!", "it": "Grazie!", "sv": "Tack!", "fi": "Kiitos!", "ja": "ありがとうございます！", "zh-CN": "谢谢！"}}], "voca   4: {"id": 4, "title": "4. 슈퍼마켓에서 쇼핑하기", "titleTrans": {"en": "4. Shopping at a Supermarket", "de": "4. Im Supermarkt einkaufen", "fr": "4. Faire les courses au supermarché", "es": "4. Comprar en el supermercado", "pl": "4. Zakupy w supermarkecie", "it": "4. Fare la spesa al supermercato", "sv": "4. Handla i en livsmedelsbutik", "fi": "4. Ostoksilla supermarketissa", "ja": "4. スーパーマーケットでの買い物", "zh-CN": "4. 在超市购物"}, "desc": "슈퍼마켓에서 물건을 찾고 계산하는 방법을 배웁니다.", "descTrans": {"en": "Learn how to find items and check out at a supermarket.", "de": "Lernen Sie, wie man Waren findet und an der Kasse zahlt.", "fr": "Apprenez à trouver des articles et à passer en caisse au supermarché.", "es": "Aprende a encontrar artículos y pagar en el supermercado.", "pl": "Naucz się znajdować produkty i płacić w kasie supermarketu.", "it": "Impara a trovare articoli e pagare alla cassa del supermercato.", "sv": "Lär dig hitta varor och betala i kassan på en livsmedelsbutik.", "fi": "Opi löytämään tuotteita ja kassalla maksaminen supermarketissa.", "ja": "スーパーマーケットで商品を探して会計する方法を学びます。", "zh-CN": "学习在超市找商品和结账的方法。"}, "dialogue": [{"speaker": "지민", "text": "저기요, 우유가 어디에 있어요?", "trans": {"en": "Excuse me, where is the milk?", "de": "Entschuldigung, wo ist die Milch?", "fr": "Excusez-moi, où est le lait ?", "es": "Perdone, ¿dónde está la leche?", "pl": "Przepraszam, gdzie jest mleko?", "it": "Scusi, dov'è il latte?", "sv": "Ursäkta, var är mjölken?", "fi": "Anteeksi, missä on maito?", "ja": "すみません、牛乳はどこにありますか？", "zh-CN": "请问，牛奶在哪里？"}}, {"speaker": "수미", "text": "저쪽 냉장고 옆에 있어요.", "trans": {"en": "It's over there, next to the refrigerator.", "de": "Es ist dort drüben, neben dem Kühlschrank.", "fr": "C'est là-bas, à côté du réfrigérateur.", "es": "Está por allá, al lado del refrigerador.", "pl": "Jest tam, obok lodówki.", "it": "È là, accanto al frigorifero.", "sv": "Det är där borta, bredvid kylskåpet.", "fi": "Se on tuolla, jääkaapin vieressä.", "ja": "あちらの冷蔵庫の隣にあります。", "zh-CN": "在那边冰箱旁边。"}}, {"speaker": "지민", "text": "감사해요. 이 사과는 얼마예요?", "trans": {"en": "Thank you. How much are these apples?", "de": "Danke. Wie viel kosten diese Äpfel?", "fr": "Merci. Combien coûtent ces pommes ?", "es": "Gracias. ¿Cuánto cuestan estas manzanas?", "pl": "Dziękuję. Ile kosztują te jabłka?", "it": "Grazie. Quanto costano queste mele?", "sv": "Tack. Hur mycket kostar dessa äpplen?", "fi": "Kiitos. Paljonko nämä omenat maksavat?", "ja": "ありがとう。このリンゴはいくらですか？", "zh-CN": "谢谢。这些苹果多少钱？"}}, {"speaker": "수미", "text": "세 개에 오천 원이에요.", "trans": {"en": "Three for 5,000 won.", "de": "Drei für 5.000 Won.", "fr": "Trois pour 5 000 wons.", "es": "Tres por 5.000 wons.", "pl": "Trzy za 5 000 wonów.", "it": "Tre per 5.000 won.", "sv": "Tre för 5 000 won.", "fi": "Kolme kappaletta 5 000 wonilla.", "ja": "3個で5,000ウォンです。", "zh-CN": "三个5000韩元。"}}, {"speaker": "지민", "text": "그럼 다섯 개 주세요. 봉투도 주세요.", "trans": {"en": "Then give me five please. A bag too please.", "de": "Dann geben Sie mir bitte fünf. Auch eine Tüte bitte.", "fr": "Alors donnez-m'en cinq s'il vous plaît. Un sac aussi s'il vous plaît.", "es": "Entonces deme cinco por favor. También una bolsa por favor.", "pl": "To proszę pięć. Proszę też torbę.", "it": "Allora me ne dia cinque per favore. Anche un sacchetto per favore.", "sv": "Ge mig då fem tack. En påse också tack.", "fi": "Anna minulle sitten viisi kiitos. Myös pussi kiitos.", "ja": "では5個ください。袋もください。", "zh-CN": "那给我五个。还要一个袋子。"}}, {"speaker": "수미", "text": "알겠어요. 총 팔천삼백 원이에요.", "trans": {"en": "Understood. The total is 8,300 won.", "de": "Verstanden. Der Gesamtbetrag ist 8.300 Won.", "fr": "D'accord. Le total est de 8 300 wons.", "es": "Entendido. El total es 8.300 wons.", "pl": "Rozumiem. Łącznie to 8 300 wonów.", "it": "Capito. Il totale è 8.300 won.", "sv": "Förstår. Totalt är det 8 300 won.", "fi": "Selvä. Yhteensä 8 300 wonia.", "ja": "わかりました。合計8,300ウォンです。", "zh-CN": "好的。总共8300韩元。"}}], "vocab": [{"word": "슈퍼마켓", "trans": {"en": "Supermarket", "de": "Supermarkt", "fr": "Supermarché", "es": "Supermercado", "pl": "Supermarket", "it": "Supermercato", "sv": "Livsmedelsbutik", "fi": "Supermarket", "ja": "スーパーマーケット", "zh-CN": "超市"}}, {"word": "우유", "trans": {"en": "Milk", "de": "Milch", "fr": "Lait", "es": "Leche", "pl": "Mleko", "it": "Latte", "sv": "Mjölk", "fi": "Maito", "ja": "牛乳", "zh-CN": "牛奶"}}, {"word": "사과", "trans": {"en": "Apple", "de": "Apfel", "fr": "Pomme", "es": "Manzana", "pl": "Jabłko", "it": "Mela", "sv": "Äpple", "fi": "Omena", "ja": "りんご", "zh-CN": "苹果"}}, {"word": "냉장고", "trans": {"en": "Refrigerator", "de": "Kühlschrank", "fr": "Réfrigérateur", "es": "Refrigerador", "pl": "Lodówka", "it": "Frigorifero", "sv": "Kylskåp", "fi": "Jääkaappi", "ja": "冷蔵庫", "zh-CN": "冰箱"}}, {"word": "봉투", "trans": {"en": "Bag / envelope", "de": "Tüte / Umschlag", "fr": "Sac / enveloppe", "es": "Bolsa / sobre", "pl": "Torba / koperta", "it": "Sacchetto / busta", "sv": "Påse / kuvert", "fi": "Pussi / kirjekuori", "ja": "袋/封筒", "zh-CN": "袋子/信封"}}, {"word": "총", "trans": {"en": "Total / altogether", "de": "Gesamt / insgesamt", "fr": "Total / en tout", "es": "Total / en total", "pl": "Łącznie / razem", "it": "Totale / in tutto", "sv": "Totalt / sammanlagt", "fi": "Yhteensä / kaikkiaan", "ja": "合計/全部で", "zh-CN": "总共/合计"}}, {"word": "옆에", "trans": {"en": "Next to / beside", "de": "Neben", "fr": "À côté de", "es": "Al lado de", "pl": "Obok", "it": "Accanto a", "sv": "Bredvid", "fi": "Vieressä", "ja": "隣に", "zh-CN": "旁边"}}, {"word": "개", "trans": {"en": "Piece / item (counter)", "de": "Stück (Zähler)", "fr": "Pièce (compteur)", "es": "Pieza (contador)", "pl": "Sztuka (licznik)", "it": "Pezzo (contatore)", "sv": "Stycke (räknare)", "fi": "Kappale (laskuri)", "ja": "個（助数詞）", "zh-CN": "个（量词）"}}, {"word": "알겠어요", "trans": {"en": "I understand / Got it", "de": "Ich verstehe / Alles klar", "fr": "Je comprends / D'accord", "es": "Entiendo / De acuerdo", "pl": "Rozumiem / Dobrze", "it": "Capisco / Ho capito", "sv": "Jag förstår / Okej", "fi": "Ymmärrän / Selvä", "ja": "わかりました", "zh-CN": "我明白了/好的"}}, {"word": "저쪽", "trans": {"en": "Over there / that side", "de": "Dort drüben / diese Seite", "fr": "Là-bas / de ce côté", "es": "Por allá / ese lado", "pl": "Tam / ta strona", "it": "Là / da quella parte", "sv": "Där borta / den sidan", "fi": "Tuolla / se puoli", "ja": "あちら", "zh-CN": "那边"}}], "patterns": [{"pattern": "[물건]이/가 어디에 있어요?", "patternTrans": {"en": "Where is the [item]?", "de": "Wo ist das [Objekt]?", "fr": "Où est [l'article] ?", "es": "¿Dónde está [el artículo]?", "pl": "Gdzie jest [przedmiot]?", "it": "Dov'è [l'articolo]?", "sv": "Var är [föremålet]?", "fi": "Missä on [esine]?", "ja": "[物]はどこにありますか？", "zh-CN": "[物品]在哪里？"}, "example": "우유가 어디에 있어요?", "trans": {"en": "Where is the milk?", "de": "Wo ist die Milch?", "fr": "Où est le lait ?", "es": "¿Dónde está la leche?", "pl": "Gdzie jest mleko?", "it": "Dov'è il latte?", "sv": "Var är mjölken?", "fi": "Missä on maito?", "ja": "牛乳はどこにありますか？", "zh-CN": "牛奶在哪里？"}}, {"pattern": "[숫자] 개에 [가격]이에요.", "patternTrans": {"en": "[Number] for [price].", "de": "[Zahl] für [Preis].", "fr": "[Nombre] pour [prix].", "es": "[Número] por [precio].", "pl": "[Liczba] za [cenę].", "it": "[Numero] per [prezzo].", "sv": "[Antal] för [pris].", "fi": "[Numero] kappaletta [hinnalla].", "ja": "[数]個で[値段]です。", "zh-CN": "[数字]个[价格]。"}, "example": "세 개에 오천 원이에요.", "trans": {"en": "Three for 5,000 won.", "de": "Drei für 5.000 Won.", "fr": "Trois pour 5 000 wons.", "es": "Tres por 5.000 wons.", "pl": "Trzy za 5 000 wonów.", "it": "Tre per 5.000 won.", "sv": "Tre för 5 000 won.", "fi": "Kolme kappaletta 5 000 wonilla.", "ja": "3個で5,000ウォンです。", "zh-CN": "三个5000韩元。"}}, {"pattern": "[장소] 옆에 있어요.", "patternTrans": {"en": "It's next to [place].", "de": "Es ist neben [Ort].", "fr": "C'est à côté de [lieu].", "es": "Está al lado de [lugar].", "pl": "Jest obok [miejsca].", "it": "È accanto a [luogo].", "sv": "Det är bredvid [plats].", "fi": "Se on [paikan] vieressä.", "ja": "[場所]の隣にあります。", "zh-CN": "在[地方]旁边。"}, "example": "냉장고 옆에 있어요.", "trans": {"en": "It's next to the refrigerator.", "de": "Es ist neben dem Kühlschrank.", "fr": "C'est à côté du réfrigérateur.", "es": "Está al lado del refrigerador.", "pl": "Jest obok lodówki.", "it": "È accanto al frigorifero.", "sv": "Det är bredvid kylskåpet.", "fi": "Se on jääkaapin vieressä.", "ja": "冷蔵庫の隣にあります。", "zh-CN": "在冰箱旁边。"}}], "quizzes": [{"id": 1, "type": "comprehension", "questionAudio": "우유는 어디에 있어요?", "questionTrans": {"en": "Where is the milk?", "de": "Wo ist die Milch?", "fr": "Où est le lait ?", "es": "¿Dónde está la leche?", "pl": "Gdzie jest mleko?", "it": "Dov'è il latte?", "sv": "Var är mjölken?", "fi": "Missä on maito?", "ja": "牛乳はどこにありますか？", "zh-CN": "牛奶在哪里？"}, "options": [{"text": "계산대 옆에 있어요.", "trans": {"en": "Next to the checkout counter.", "de": "Neben der Kasse.", "fr": "À côté de la caisse.", "es": "Al lado de la caja.", "pl": "Obok kasy.", "it": "Accanto alla cassa.", "sv": "Bredvid kassan.", "fi": "Kassatiskin vieressä.", "ja": "レジの隣にあります。", "zh-CN": "在收银台旁边。"}}, {"text": "입구 옆에 있어요.", "trans": {"en": "Next to the entrance.", "de": "Neben dem Eingang.", "fr": "À côté de l'entrée.", "es": "Al lado de la entrada.", "pl": "Obok wejścia.", "it": "Accanto all'ingresso.", "sv": "Bredvid ingången.", "fi": "Sisäänkäynnin vieressä.", "ja": "入口の隣にあります。", "zh-CN": "在入口旁边。"}}, {"text": "냉장고 옆에 있어요.", "trans": {"en": "Next to the refrigerator.", "de": "Neben dem Kühlschrank.", "fr": "À côté du réfrigérateur.", "es": "Al lado del refrigerador.", "pl": "Obok lodówki.", "it": "Accanto al frigorifero.", "sv": "Bredvid kylskåpet.", "fi": "Jääkaapin vieressä.", "ja": "冷蔵庫の隣にあります。", "zh-CN": "在冰箱旁边。"}}, {"text": "계산대 앞에 있어요.", "trans": {"en": "In front of the checkout.", "de": "Vor der Kasse.", "fr": "Devant la caisse.", "es": "Frente a la caja.", "pl": "Przed kasą.", "it": "Davanti alla cassa.", "sv": "Framför kassan.", "fi": "Kassan edessä.", "ja": "レジの前にあります。", "zh-CN": "在收银台前面。"}}], "answer": 2, "explanation": {"en": "Sumi said the milk is '저쪽 냉장고 옆에 있어요', meaning next to the refrigerator over there.", "de": "Sumi sagte, die Milch ist '저쪽 냉장고 옆에 있어요', was bedeutet, neben dem Kühlschrank dort drüben.", "fr": "Sumi a dit que le lait est '저쪽 냉장고 옆에 있어요', ce qui signifie à côté du réfrigérateur là-bas.", "es": "Sumi dijo que la leche está '저쪽 냉장고 옆에 있어요', que significa al lado del refrigerador de allá.", "pl": "Sumi powiedział, że mleko jest '저쪽 냉장고 옆에 있어요', co oznacza obok lodówki tam.", "it": "Sumi ha detto che il latte è '저쪽 냉장고 옆에 있어요', che significa accanto al frigorifero là.", "sv": "Sumi sa att mjölken är '저쪽 냉장고 옆에 있어요', vilket betyder bredvid kylskåpet där borta.", "fi": "Sumi sanoi maidon olevan '저쪽 냉장고 옆에 있어요', mikä tarkoittaa tuolla jääkaapin vieressä.", "ja": "スミさんは「저쪽 냉장고 옆에 있어요」と言い、あちらの冷蔵庫の隣にあることを意味します。", "zh-CN": "秀美说牛奶'저쪽 냉장고 옆에 있어요'，意思是在那边冰箱旁边。"}}, {"id": 2, "type": "vocabulary", "questionAudio": "'총'은 무슨 뜻이에요?", "questionTrans": {"en": "What does '총' mean here?", "de": "Was bedeutet '총' hier?", "fr": "Que signifie '총' ici ?", "es": "¿Qué significa '총' aquí?", "pl": "Co oznacza tu '총'?", "it": "Cosa significa '총' qui?", "sv": "Vad betyder '총' här?", "fi": "Mitä '총' tarkoittaa tässä?", "ja": "ここで「총」はどういう意味ですか？", "zh-CN": "这里'총'是什么意思？"}, "options": [{"text": "총 = 합계 (total)", "trans": {"en": "Total / sum", "de": "Gesamt / Summe", "fr": "Total / somme", "es": "Total / suma", "pl": "Łącznie / suma", "it": "Totale / somma", "sv": "Totalt / summa", "fi": "Yhteensä / summa", "ja": "合計", "zh-CN": "总计/合计"}}, {"text": "총 = 빠른 (fast)", "trans": {"en": "Fast / quick", "de": "Schnell", "fr": "Rapide", "es": "Rápido", "pl": "Szybki", "it": "Veloce", "sv": "Snabb", "fi": "Nopea", "ja": "速い", "zh-CN": "快速"}}, {"text": "총 = 무기 (gun)", "trans": {"en": "Gun / weapon", "de": "Waffe / Gewehr", "fr": "Arme / pistolet", "es": "Arma / pistola", "pl": "Broń / pistolet", "it": "Arma / pistola", "sv": "Vapen / pistol", "fi": "Ase / pistooli", "ja": "銃", "zh-CN": "枪/武器"}}, {"text": "총 = 다시 (again)", "trans": {"en": "Again", "de": "Wieder", "fr": "Encore", "es": "De nuevo", "pl": "Znowu", "it": "Di nuovo", "sv": "Igen", "fi": "Taas", "ja": "また", "zh-CN": "再次"}}], "answer": 0, "explanation": {"en": "In this shopping context, '총' means 'total' as in the total price of all items.", "de": "In diesem Einkaufskontext bedeutet '총' 'Gesamt' wie im Gesamtpreis aller Artikel.", "fr": "Dans ce contexte commercial, '총' signifie 'total' comme dans le prix total de tous les articles.", "es": "En este contexto de compras, '총' significa 'total' como en el precio total de todos los artículos.", "pl": "W tym kontekście zakupowym '총' oznacza 'łącznie' jak w całkowitej cenie wszystkich artykułów.", "it": "In questo contesto di acquisto, '총' significa 'totale' come nel prezzo totale di tutti gli articoli.", "sv": "I detta shoppingsammanhang betyder '총' 'totalt' som i totalpriset för alla varor.", "fi": "Tässä ostoskontekstissa '총' tarkoittaa 'yhteensä' kuten kaikkien tuotteiden kokonaishinnassa.", "ja": "このショッピングの文脈では、「총」は全商品の合計価格を意味する「合計」を意味します。", "zh-CN": "在这个购物语境中，'총'意思是'总共'，指所有商品的总价。"}}, {"id": 3, "type": "grammar", "questionAudio": "사과 다섯 개는 얼마예요?", "questionTrans": {"en": "How much are five apples?", "de": "Wie viel kosten fünf Äpfel?", "fr": "Combien coûtent cinq pommes ?", "es": "¿Cuánto cuestan cinco manzanas?", "pl": "Ile kosztuje pięć jabłek?", "it": "Quanto costano cinque mele?", "sv": "Hur mycket kostar fem äpplen?", "fi": "Paljonko viisi omenaa maksaa?", "ja": "リンゴ5個はいくらですか？", "zh-CN": "五个苹果多少钱？"}, "options": [{"text": "오천 원이에요.", "trans": {"en": "5,000 won.", "de": "5.000 Won.", "fr": "5 000 wons.", "es": "5.000 wons.", "pl": "5 000 wonów.", "it": "5.000 won.", "sv": "5 000 won.", "fi": "5 000 wonia.", "ja": "5,000ウォンです。", "zh-CN": "5000韩元。"}}, {"text": "칠천 원이에요.", "trans": {"en": "7,000 won.", "de": "7.000 Won.", "fr": "7 000 wons.", "es": "7.000 wons.", "pl": "7 000 wonów.", "it": "7.000 won.", "sv": "7 000 won.", "fi": "7 000 wonia.", "ja": "7,000ウォンです。", "zh-CN": "7000韩元。"}}, {"text": "만 원이에요.", "trans": {"en": "10,000 won.", "de": "10.000 Won.", "fr": "10 000 wons.", "es": "10.000 wons.", "pl": "10 000 wonów.", "it": "10.000 won.", "sv": "10 000 won.", "fi": "10 000 wonia.", "ja": "10,000ウォンです。", "zh-CN": "10000韩元。"}}, {"text": "팔천삼백 원이에요.", "trans": {"en": "8,300 won.", "de": "8.300 Won.", "fr": "8 300 wons.", "es": "8.300 wons.", "pl": "8 300 wonów.", "it": "8.300 won.", "sv": "8 300 won.", "fi": "8 300 wonia.", "ja": "8,300ウォンです。", "zh-CN": "8300韩元。"}}], "answer": 3, "explanation": {"en": "Three apples cost 5,000 won, so five apples cost 8,300 won. Sumi said '총 팔천삼백 원이에요'.", "de": "Drei Äpfel kosten 5.000 Won, also kosten fünf Äpfel 8.300 Won. Sumi sagte '총 팔천삼백 원이에요'.", "fr": "Trois pommes coûtent 5 000 wons, donc cinq pommes coûtent 8 300 wons. Sumi a dit '총 팔천삼백 원이에요'.", "es": "Tres manzanas cuestan 5.000 wons, así que cinco manzanas cuestan 8.300 wons. Sumi dijo '총 팔천삼백 원이에요'.", "pl": "Trzy jabłka kosztują 5 000 wonów, więc pięć jabłek kosztuje 8 300 wonów. Sumi powiedział '총 팔천삼백 원이에요'.", "it": "Tre mele costano 5.000 won, quindi cinque mele costano 8.300 won. Sumi ha detto '총 팔천삼백 원이에요'.", "sv": "Tre äpplen kostar 5 000 won, så fem äpplen kostar 8 300 won. Sumi sa '총 팔천삼백 원이에요'.", "fi": "Kolme omenaa maksaa 5 000 wonia, joten viisi omenaa maksaa 8 300 wonia. Sumi sanoi '총 팔천삼백 원이에요'.", "ja": "リンゴ3個で5,000ウォンなので、5個だと8,300ウォンです。スミさんは「총 팔천삼백 원이에요」と言いました。", "zh-CN": "三个苹果5000韩元，所以五个苹果加上袋子共8300韩元。秀美说'총 팔천삼백 원이에요'。"}}, {"type": "comprehension", "questionAudio": "지민 씨는 사과를 몇 개 샀어요?", "questionTrans": {"en": "How many apples did Jimin buy?", "de": "Wie viele Äpfel hat Jimin gekauft?", "fr": "Combien de pommes Jimin a-t-il acheté ?", "es": "¿Cuántas manzanas compró Jimin?", "pl": "Ile jabłek kupił Jimin?", "it": "Quante mele ha comprato Jimin?", "sv": "Hur många äpplen köpte Jimin?", "fi": "Kuinka monta omenaa Jimin osti?", "ja": "ジミンさんはリンゴを何個買いましたか？", "zh-CN": "智敏买了几个苹果？"}, "options": [{"text": "세 개 샀어요.", "trans": {"en": "Three.", "de": "Drei.", "fr": "Trois.", "es": "Tres.", "pl": "Trzy.", "it": "Tre.", "sv": "Tre.", "fi": "Kolme.", "ja": "3個。", "zh-CN": "三个。"}}, {"text": "네 개 샀어요.", "trans": {"en": "Four.", "de": "Vier.", "fr": "Quatre.", "es": "Cuatro.", "pl": "Cztery.", "it": "Quattro.", "sv": "Fyra.", "fi": "Neljä.", "ja": "4個。", "zh-CN": "四个。"}}, {"text": "다섯 개 샀어요.", "trans": {"en": "Five.", "de": "Fünf.", "fr": "Cinq.", "es": "Cinco.", "pl": "Pięć.", "it": "Cinque.", "sv": "Fem.", "fi": "Viisi.", "ja": "5個。", "zh-CN": "五个。"}}, {"text": "여섯 개 샀어요.", "trans": {"en": "Six.", "de": "Sechs.", "fr": "Six.", "es": "Seis.", "pl": "Sześć.", "it": "Sei.", "sv": "Sex.", "fi": "Kuusi.", "ja": "6個。", "zh-CN": "六个。"}}], "answer": 2, "explanation": {"en": "Jimin says 다섯 개 주세요 (Give me five).", "de": "Jimin sagt 다섯 개 주세요.", "fr": "Jimin dit 다섯 개 주세요.", "es": "Jimin dice 다섯 개 주세요.", "pl": "Jimin mówi 다섯 개 주세요.", "it": "Jimin dice 다섯 개 주세요.", "sv": "Jimin säger 다섯 개 주세요.", "fi": "Jimin sanoo 다섯 개 주세요.", "ja": "ジミンは다섯 개 주세요と言います。", "zh-CN": "智敏说다섯 개 주세요。"}}]},
  5: {"id": 5, "title": "5. 날씨 이야기", "titleTrans": {"en": "5. Talking About the Weather", "de": "5. Über das Wetter sprechen", "fr": "5. Parler de la météo", "es": "5. Hablar del tiempo", "pl": "5. Rozmawianie o pogodzie", "it": "5. Parlare del tempo", "sv": "5. Prata om vädret", "fi": "5. Säästä puhuminen", "ja": "5. 天気の話", "zh-CN": "5. 谈论天气"}, "desc": "날씨를 묻고 이야기하는 표현을 배웁니다.", "descTrans": {"en": "Learn expressions for asking about and describing the weather.", "de": "Lernen Sie Ausdrücke, um nach dem Wetter zu fragen.", "fr": "Apprenez des expressions pour parler de la météo.", "es": "Aprende expresiones para hablar del tiempo.", "pl": "Naucz się wyrażeń do mówienia o pogodzie.", "it": "Impara espressioni per parlare del tempo.", "sv": "Lär dig uttryck för att prata om vädret.", "fi": "Opi ilmaisuja säästä puhumiseen.", "ja": "天気について質問したり話したりする表現を学びます。", "zh-CN": "学习询问和描述天气的表达方式。"}, "dialogue": [{"speaker": "수미", "text": "오늘 날씨가 어때요?", "trans": {"en": "How is the weather today?", "de": "Wie ist das Wetter heute?", "fr": "Comment est le temps aujourd'hui ?", "es": "¿Cómo está el tiempo hoy?", "pl": "Jaka jest dzisiaj pogoda?", "it": "Com'è il tempo oggi?", "sv": "Hur är vädret idag?", "fi": "Millainen sää tänään on?", "ja": "今日の天気はどうですか？", "zh-CN": "今天天气怎么样？"}}, {"speaker": "지민", "text": "많이 더워요. 오늘 기온이 32도예요.", "trans": {"en": "It's very hot. The temperature today is 32 degrees.", "de": "Es ist sehr heiß. Die Temperatur heute ist 32 Grad.", "fr": "Il fait très chaud. La température aujourd'hui est de 32 degrés.", "es": "Hace mucho calor. La temperatura hoy es de 32 grados.", "pl": "Jest bardzo gorąco. Temperatura dzisiaj wynosi 32 stopnie.", "it": "Fa molto caldo. La temperatura oggi è di 32 gradi.", "sv": "Det är mycket varmt. Temperaturen idag är 32 grader.", "fi": "On todella kuuma. Tänään on 32 astetta.", "ja": "とても暑いです。今日の気温は32度です。", "zh-CN": "很热。今天气温32度。"}}, {"speaker": "수미", "text": "그래요? 비는 안 와요?", "trans": {"en": "Really? It's not raining?", "de": "Wirklich? Regnet es nicht?", "fr": "Vraiment ? Il ne pleut pas ?", "es": "¿De verdad? ¿No llueve?", "pl": "Naprawdę? Nie pada?", "it": "Davvero? Non piove?", "sv": "Verkligen? Regnar det inte?", "fi": "Oikeasti? Eikö sada?", "ja": "そうですか？雨は降っていませんか？", "zh-CN": "是吗？不下雨吗？"}}, {"speaker": "지민", "text": "지금은 맑아요. 하지만 내일은 비가 올 것 같아요.", "trans": {"en": "Right now it's clear. But it looks like it'll rain tomorrow.", "de": "Gerade ist es klar. Aber morgen wird es wahrscheinlich regnen.", "fr": "En ce moment c'est dégagé. Mais il semble qu'il pleuvra demain.", "es": "Ahora mismo está despejado. Pero parece que mañana lloverá.", "pl": "Teraz jest jasno. Ale jutro chyba będzie padać.", "it": "Adesso è sereno. Ma sembra che domani pioverà.", "sv": "Just nu är det klart. Men det verkar som att det regnar imorgon.", "fi": "Nyt on selkeää. Mutta huomenna näyttää satavan.", "ja": "今は晴れています。でも明日は雨が降りそうです。", "zh-CN": "现在是晴天。但明天好像会下雨。"}}, {"speaker": "수미", "text": "우산을 가져가야겠네요.", "trans": {"en": "I should bring an umbrella then.", "de": "Dann sollte ich einen Regenschirm mitnehmen.", "fr": "Je devrais prendre un parapluie alors.", "es": "Entonces debería llevar un paraguas.", "pl": "Muszę zabrać parasol.", "it": "Allora dovrei portare un ombrello.", "sv": "Då borde jag ta med ett paraply.", "fi": "Minun pitäisi ottaa sateenvarjo.", "ja": "傘を持っていかなければなりませんね。", "zh-CN": "那我应该带把伞。"}}, {"speaker": "지민", "text": "네, 그리고 바람도 좀 불 것 같아요.", "trans": {"en": "Yes, and it seems like there will be some wind too.", "de": "Ja, und es scheint auch etwas Wind zu geben.", "fr": "Oui, et il semble qu'il y aura aussi du vent.", "es": "Sí, y parece que también habrá algo de viento.", "pl": "Tak, i wydaje się, że będzie też trochę wiatru.", "it": "Sì, e sembra che ci sarà anche un po' di vento.", "sv": "Ja, och det verkar bli lite vind också.", "fi": "Kyllä, ja näyttää olevan myös hieman tuulista.", "ja": "はい、それに少し風も吹きそうです。", "zh-CN": "是的，而且好像也会有风。"}}], "vocab": [{"word": "날씨", "trans": {"en": "Weather", "de": "Wetter", "fr": "Météo / temps", "es": "Tiempo / clima", "pl": "Pogoda", "it": "Tempo / meteo", "sv": "Väder", "fi": "Sää", "ja": "天気", "zh-CN": "天气"}}, {"word": "덥다", "trans": {"en": "Hot (weather)", "de": "Heiß (Wetter)", "fr": "Chaud (temps)", "es": "Caluroso (tiempo)", "pl": "Gorący (pogoda)", "it": "Caldo (tempo)", "sv": "Varm (väder)", "fi": "Kuuma (sää)", "ja": "暑い（天気）", "zh-CN": "热（天气）"}}, {"word": "기온", "trans": {"en": "Temperature", "de": "Temperatur", "fr": "Température", "es": "Temperatura", "pl": "Temperatura", "it": "Temperatura", "sv": "Temperatur", "fi": "Lämpötila", "ja": "気温", "zh-CN": "气温"}}, {"word": "비가 오다", "trans": {"en": "To rain", "de": "Regnen", "fr": "Pleuvoir", "es": "Llover", "pl": "Padać (deszcz)", "it": "Piovere", "sv": "Regna", "fi": "Sataa", "ja": "雨が降る", "zh-CN": "下雨"}}, {"word": "맑다", "trans": {"en": "Clear / sunny", "de": "Klar / sonnig", "fr": "Clair / ensoleillé", "es": "Despejado / soleado", "pl": "Bezchmurnie / słonecznie", "it": "Sereno / soleggiato", "sv": "Klart / soligt", "fi": "Selkeä / aurinkoinen", "ja": "晴れている", "zh-CN": "晴朗"}}, {"word": "내일", "trans": {"en": "Tomorrow", "de": "Morgen", "fr": "Demain", "es": "Mañana", "pl": "Jutro", "it": "Domani", "sv": "Imorgon", "fi": "Huomenna", "ja": "明日", "zh-CN": "明天"}}, {"word": "우산", "trans": {"en": "Umbrella", "de": "Regenschirm", "fr": "Parapluie", "es": "Paraguas", "pl": "Parasol", "it": "Ombrello", "sv": "Paraply", "fi": "Sateenvarjo", "ja": "傘", "zh-CN": "雨伞"}}, {"word": "바람이 불다", "trans": {"en": "Wind blows", "de": "Wind weht", "fr": "Le vent souffle", "es": "El viento sopla", "pl": "Wieje wiatr", "it": "Il vento soffia", "sv": "Vinden blåser", "fi": "Tuulee", "ja": "風が吹く", "zh-CN": "刮风"}}, {"word": "오늘", "trans": {"en": "Today", "de": "Heute", "fr": "Aujourd'hui", "es": "Hoy", "pl": "Dzisiaj", "it": "Oggi", "sv": "Idag", "fi": "Tänään", "ja": "今日", "zh-CN": "今天"}}, {"word": "도", "trans": {"en": "Degree (temperature)", "de": "Grad (Temperatur)", "fr": "Degré (température)", "es": "Grado (temperatura)", "pl": "Stopień (temperatura)", "it": "Grado (temperatura)", "sv": "Grad (temperatur)", "fi": "Aste (lämpötila)", "ja": "度（温度）", "zh-CN": "度（温度）"}}], "patterns": [{"pattern": "날씨가 [형용사]요.", "patternTrans": {"en": "The weather is [adjective].", "de": "Das Wetter ist [Adjektiv].", "fr": "Le temps est [adjectif].", "es": "El tiempo está [adjetivo].", "pl": "Pogoda jest [przymiotnik].", "it": "Il tempo è [aggettivo].", "sv": "Vädret är [adjektiv].", "fi": "Sää on [adjektiivi].", "ja": "天気が[形容詞]です。", "zh-CN": "天气[形容词]。"}, "example": "날씨가 더워요.", "trans": {"en": "The weather is hot.", "de": "Das Wetter ist heiß.", "fr": "Le temps est chaud.", "es": "El tiempo está caluroso.", "pl": "Pogoda jest gorąca.", "it": "Il tempo è caldo.", "sv": "Vädret är varmt.", "fi": "Sää on kuuma.", "ja": "天気が暑いです。", "zh-CN": "天气很热。"}}, {"pattern": "[날씨]가 올 것 같아요.", "patternTrans": {"en": "It looks like [weather] will come.", "de": "Es sieht aus, als ob [Wetter] kommen wird.", "fr": "Il semble que [temps] arrivera.", "es": "Parece que [tiempo] vendrá.", "pl": "Wygląda na to, że będzie [pogoda].", "it": "Sembra che arriverà [tempo].", "sv": "Det verkar som att [väder] kommer.", "fi": "Näyttää siltä, että [sää] tulee.", "ja": "[天気]になりそうです。", "zh-CN": "看起来会[天气]。"}, "example": "비가 올 것 같아요.", "trans": {"en": "It looks like it will rain.", "de": "Es sieht aus, als ob es regnen wird.", "fr": "Il semble qu'il va pleuvoir.", "es": "Parece que va a llover.", "pl": "Wygląda na to, że będzie padać.", "it": "Sembra che pioverà.", "sv": "Det verkar som att det kommer att regna.", "fi": "Näyttää siltä, että sataa.", "ja": "雨が降りそうです。", "zh-CN": "看起来要下雨了。"}}, {"pattern": "[물건]을/를 가져가야겠어요.", "patternTrans": {"en": "I should bring [item].", "de": "Ich sollte [Gegenstand] mitnehmen.", "fr": "Je devrais apporter [objet].", "es": "Debería llevar [artículo].", "pl": "Powinienem/powinnam zabrać [przedmiot].", "it": "Dovrei portare [oggetto].", "sv": "Jag borde ta med [föremål].", "fi": on viento", "pl": "Wietrzno", "it": "Ventoso", "sv": "Blåsigt", "fi": "Tuulinen", "ja": "風が吹く", "zh-CN": "刮风"}}], "answer": 1, "explanation": {"en": "'흐리다' means cloudy and is the most direct opposite of '맑다' (clear/sunny).", "de": "'흐리다' bedeutet bewölkt und ist das direkteste Gegenteil von '맑다' (klar/sonnig).", "fr": "'흐리다' signifie nuageux et est le contraire le plus direct de '맑다' (clair/ensoleillé).", "es": "'흐리다' significa nublado y es el opuesto más directo de '맑다' (despejado/soleado).", "pl": "'흐리다' oznacza pochmurno i jest bezpośrednim przeciwieństwem '맑다' (jasno/słonecznie).", "it": "'흐리다' significa nuvoloso ed è il contrario più diretto di '맑다' (sereno/soleggiato).", "sv": "'흐리다' betyder molnigt och är den mest direkta motsatsen till '맑다' (klart/soligt).", "fi": "'흐리다' tarkoittaa pilvistä ja on suorin vastakohta '맑다' (selkeä/aurinkoinen).", "ja": "「흐리다」は「曇っている」を意味し、「맑다」（晴れている）の最も直接的な反対語です。", "zh-CN": "'흐리다'意思是多云，是'맑다'（晴朗）最直接的反义词。"}}, {"id": 3, "type": "grammar", "questionAudio": "내일 날씨가 어떨 것 같아요?", "questionTrans": {"en": "What will the weather be like tomorrow?", "de": "Wie wird das Wetter morgen sein?", "fr": "Quel temps fera-t-il demain ?", "es": "¿Cómo estará el tiempo mañana?", "pl": "Jaka będzie pogoda jutro?", "it": "Che tempo farà domani?", "sv": "Hur kommer vädret att vara imorgon?", "fi": "Millainen sää on huomenna?", "ja": "明日の天気はどうなりそうですか？", "zh-CN": "明天天气会怎样？"}, "options": [{"text": "맑을 것 같아요.", "trans": {"en": "It looks like it will be clear.", "de": "Es sieht aus, als ob es klar sein wird.", "fr": "Il semble qu'il fera beau.", "es": "Parece que estará despejado.", "pl": "Wygląda na to, że będzie jasno.", "it": "Sembra che sarà sereno.", "sv": "Det verkar bli klart.", "fi": "Näyttää olevan selkeää.", "ja": "晴れそうです。", "zh-CN": "看起来会是晴天。"}}, {"text": "눈이 올 것 같아요.", "trans": {"en": "It looks like it will snow.", "de": "Es sieht aus, als ob es schneien wird.", "fr": "Il semble qu'il neigera.", "es": "Parece que nevará.", "pl": "Wygląda na to, że  불 것 같아요）。"}}, {"type": "comprehension", "questionAudio": "내일 날씨가 어떨 것 같아요?", "questionTrans": {"en": "What will tomorrow's weather probably be like?", "de": "Wie wird das Wetter morgen?", "fr": "Quel temps fera-t-il demain ?", "es": "¿Cómo estará el tiempo mañana?", "pl": "Jaka będzie jutro pogoda?", "it": "Com'è il tempo domani?", "sv": "Hur är vädret imorgon?", "fi": "Minkälainen sää on huomenna?", "ja": "明日の天気はどうなりそうですか？", "zh-CN": "明天天气可能怎么样？"}, "options": [{"text": "맑을 것 같아요.", "trans": {"en": "Probably clear.", "de": "Wahrscheinlich klar.", "fr": "Probablement ensoleillé.", "es": "Probablemente despejado.", "pl": "Prawdopodobnie pogodnie.", "it": "Probabilmente sereno.", "sv": "Förmodligen klart.", "fi": "Todennäköisesti selkeää.", "ja": "晴れそう。", "zh-CN": "可能晴天。"}}, {"text": "눈이 올 것 같아요.", "trans": {"en": "Probably snow.", "de": "Wahrscheinlich Schnee.", "fr": "Probablement de la neige.", "es": "Probablemente nieve.", "pl": "Prawdopodobnie śnieg.", "it": "Probabilmente neve.", "sv": "Förmodligen snö.", "fi": "Todennäköisesti lunta.", "ja": "雪が降りそう。", "zh-CN": "可能下雪。"}}, {"text": "비가 올 것 같아요.", "trans": {"en": "Probably rain.", "de": "Wahrscheinlich Regen.", "fr": "Probablement de la pluie.", "es": "Probablemente lluvia.", "pl": "Prawdopodobnie deszcz.", "it": "Probabilmente pioggia.", "sv": "Förmodligen regn.", "fi": "Todennäköisesti sadetta.", "ja": "雨が降りそう。", "zh-CN": "可能下雨。"}}, {"text": "흐릴 것 같아요.", "trans": {"en": "Probably cloudy.", "de": "Wahrscheinlich bewölkt.", "fr": "Probablement nuageux.", "es": "Probablemente nublado.", "pl": "Prawdopodobnie pochmurno.", "it": "Probabilmente nuvoloso.", "sv": "Förmodligen molnigt.", "fi": "Todennäköisesti pilvistä.", "ja": "曇りそう。", "zh-CN": "可能多云。"}}], "answer": 2, "explanation": {"en": "Jimin says 내일은 비가 올 것 같아요 (It will probably rain tomorrow).", "de": "Jimin sagt 내일은 비가 올 것 같아요.", "fr": "Jimin dit 내일은 비가 올 것 같아요.", "es": "Jimin dice 내일은 비가 올 것 같아요.", "pl": "Jimin mówi 내일은 비가 올 것 같아요.", "it": "Jimin dice 내일은 비가 올 것 같아요.", "sv": "Jimin säger 내일은 비가 올 것 같아요.", "fi": "Jimin sanoo 내일은 비가 올 것 같아요.", "ja": "ジミンは내일은 비가 올 것 같아요と言います。", "zh-CN": "智敏说내일은 비가 올 것 같아요。"}}]},
  6: {"id": 6, "title": "6. 가족 소개", "titleTrans": {"en": "6. Introducing Family", "de": "6. Familie vorstellen", "fr": "6. Présenter sa famille", "es": "6. Presentar a la familia", "pl": "6. Przedstawianie rodziny", "it": "6. Presentare la famiglia", "sv": "6. Presentera familjen", "fi": "6. Perheen esittely", "ja": "6. 家族紹介", "zh-CN": "6. 介绍家人"}, "desc": "가족을 소개하는 방법을 배웁니다.", "descTrans": {"en": "Learn how to introduce and talk about family members.", "de": "Lernen Sie, Familienmitglieder vorzustellen.", "fr": "Apprenez à présenter des membres de la famille.", "es": "Aprende a presentar y hablar de los miembros de la familia.", "pl": "Naucz się jak przedstawiać członków rodziny.", "it": "Impara come presentare i membri della famiglia.", "sv": "Lär dig presentera familjemedlemmar.", "fi": "Opi esittelemään perheenjäseniä.", "ja": "家族を紹介する方法を学びます。", "zh-CN": "学习介绍和谈论家庭成员的方法。"}, "dialogue": [{"speaker": "수미", "text": "가족이 몇 명이에요?", "trans": {"en": "How many people are in your family?", "de": "Wie viele Personen sind in Ihrer Familie?", "fr": "Combien de personnes y a-t-il dans votre famille ?", "es": "¿Cuántas personas hay en tu familia?", "pl": "Ile osób jest w twojej rodzinie?", "it": "Quante persone ci sono nella tua famiglia?", "sv": "Hur många är ni i familjen?", "fi": "Kuinka monta perhettäsi on?", "ja": "家族は何人ですか？", "zh-CN": "你家有几个人？"}}, {"speaker": "지민", "text": "네 명이에요. 부모님, 언니, 그리고 저예요.", "trans": {"en": "Four people. My parents, my older sister, and me.", "de": "Vier Personen. Meine Eltern, meine ältere Schwester und ich.", "fr": "Quatre personnes. Mes parents, ma grande sœur et moi.", "es": "Cuatro personas. Mis padres, mi hermana mayor y yo.", "pl": "Cztery osoby. Rodzice, starsza siostra i ja.", "it": "Quattro persone. I miei genitori, la mia sorella maggiore e io.", "sv": "Fyra personer. Mina föräldrar, min äldre syster och jag.", "fi": "Neljä henkilöä. Vanhempani, isosiskoni ja minä.", "ja": "4人です。両親、お姉さん、そして私です。", "zh-CN": "四个人。父母、姐姐和我。"}}, {"speaker": "수미", "text": "언니는 나이가 어떻게 돼요?", "trans": {"en": "How old is your older sister?", "de": "Wie alt ist Ihre ältere Schwester?", "fr": "Quel âge a votre grande sœur ?", "es": "¿Cuántos años tiene tu hermana mayor?", "pl": "Ile ma lat twoja starsza siostra?", "it": "Quanti anni ha la tua sorella maggiore?", "sv": "Hur gammal är din äldre syster?", "fi": "Kuinka vanha isosiskosi on?", "ja": "お姉さんは何歳ですか？", "zh-CN": "你姐姐多大了？"}}, {"speaker": "지민", "text": "스물여덟 살이에요. 지금 회사에 다녀요.", "trans": {"en": "She's 28 years old. She works at a company now.", "de": "Sie ist 28 Jahre alt. Sie arbeitet jetzt in einem Unternehmen.", "fr": "Elle a 28 ans. Elle travaille dans une entreprise maintenant.", "es": "Tiene 28 años. Ahora trabaja en una empresa.", "pl": "Ma 28 lat. Teraz pracuje w firmie.", "it": "Ha 28 anni. Adesso lavora in un'azienda.", "sv": "Hon är 28 år gammal. Hon jobbar på ett företag nu.", "fi": "Hän on 28-vuotias. Hän työskentelee nyt yrityksessä.", "ja": "28歳です。今会社に勤めています。", "zh-CN": "28岁。现在在公司上班。"}}, {"speaker": "수미", "text": "부모님은 어디에 사세요?", "trans": {"en": "Where do your parents live?", "de": "Wo wohnen Ihre Eltern?", "fr": "Où habitent vos parents ?", "es": "¿Dónde viven tus padres?", "pl": "Gdzie mieszkają twoi rodzice?", "it": "Dove vivono i tuoi genitori?", "sv": "Var bor dina föräldrar?", "fi": "Missä vanhempasi asuvat?", "ja": "ご両親はどこに住んでいますか？", "zh-CN": "你父母住在哪里？"}}, {"speaker": "지민", "text": "부산에 사세요. 저는 서울에서 혼자 살아요.", "trans": {"en": "They live in Busan. I live alone in Seoul.", "de": "Sie leben in Busan. Ich lebe allein in Seoul.", "fr": "Ils habitent à Busan. Je vis seul(e) à Séoul.", "es": "Viven en Busan. Yo vivo solo/a en Seúl.", "pl": "Mieszkają w Busanie. Ja mieszkam sam/sama w Seulu.", "it": "Vivono a Busan. Io vivo da solo/a a Seul.", "sv": "De bor i Busan. Jag bor ensam i Seoul.", "fi": "He asuvat Busanissa. Minä asun yksin Soulissa.", "ja": "釜山に住んでいます。私はソウルで一人暮らしです。", "zh-CN": "住在釜山。我在首尔一个人住。"}}, {"speaker": "수미", "text": "그렇군요. 외롭지 않아요?", "trans
