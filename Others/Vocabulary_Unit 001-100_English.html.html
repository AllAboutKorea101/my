<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TOPIK I 필수 단어장 · Essential Vocabulary</title>
<style>
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --ink:#1D1D1F; --ink2:#6E6E73; --ink3:#999999;
  --line:#E5E5EA; --line2:#F0F0F3; --soft:#FBFBFD; --fill:#F5F5F7;
  --blue:#0071E3; --blue-soft:#E8F1FC; --green:#1E8E3E; --green-soft:#E6F4EA; --red:#D93025; --red-soft:#FCE8E6;
  --radius:16px; --side:300px;
  --sans:"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.45}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:18px;height:18px;flex:none}
svg.i.s{width:15px;height:15px}

/* ---------- Layout ---------- */
.app{min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:min(86vw,var(--side));background:var(--card);border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:40;transform:translateX(-102%);transition:transform .25s ease}
.sidebar.open{transform:none;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
.backdrop.show{opacity:1;pointer-events:auto}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 12px;
  background:rgba(245,245,247,.86);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line)}
.topbar .title{font-weight:700;font-size:15px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;border:0;background:transparent}
.iconbtn:hover{background:var(--line2)}
.main{padding:16px 16px 48px;max-width:920px;margin:0 auto}
@media (min-width:1024px){
  .sidebar{transform:none;width:var(--side);position:fixed}
  .backdrop,.topbar{display:none}
  .main{margin-left:var(--side);max-width:none;padding:32px 40px 64px}
  .main>*{max-width:880px;margin-left:auto;margin-right:auto}
}

/* ---------- Sidebar ---------- */
.side-head{padding:18px 16px 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;letter-spacing:-.5px}
.brand b{display:block;font-size:15px;letter-spacing:-.2px}
.brand small{display:block;font-size:11.5px;color:var(--ink2)}
.search{position:relative;margin-top:14px}
.search input{width:100%;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--fill);padding:0 34px 0 34px;font-size:14px;outline:none}
.search input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px var(--blue-soft)}
.search .mag{position:absolute;left:10px;top:10px;color:var(--ink3)}
.search .clr{position:absolute;right:4px;top:4px;width:30px;height:30px;border:0;background:transparent;border-radius:8px;color:var(--ink3);display:none}
.search.has .clr{display:block}
.side-scroll{flex:1;overflow-y:auto;padding:8px 8px 24px;overscroll-behavior:contain}
.nav-cat{margin-top:10px}
.nav-cat h4{margin:0;padding:8px 10px 4px;font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.3px;text-transform:uppercase;display:flex;gap:6px;align-items:center}
.nav-cat h4 .dot{width:7px;height:7px;border-radius:50%}
.nav-u{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;font-size:14px}
.nav-u:hover{background:var(--fill)}
.nav-u .n{font-family:var(--mono);font-size:11px;color:var(--ink3);width:22px;flex:none}
.nav-u .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-u .t small{color:var(--ink3);font-size:11.5px;margin-left:4px}
.nav-u.active{background:var(--ink);color:#fff}
.nav-u.active .n,.nav-u.active .t small{color:rgba(255,255,255,.65)}

/* ---------- Search results ---------- */
.results{display:flex;flex-direction:column;gap:2px}
.results .rh{font-size:11px;font-weight:700;color:var(--ink3);padding:10px 10px 4px;text-transform:uppercase;letter-spacing:.3px}
.res{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px}
.res:hover{background:var(--fill)}
.res .k{font-weight:700;font-size:15px}
.res .r{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.res .e{font-size:13px;color:var(--ink2);flex:1;text-align:right;min-width:0}
.res .u{font-size:11px;color:var(--ink3);white-space:nowrap}
.res mark{background:#FFF3B0;color:inherit;border-radius:3px;padding:0 1px}
.empty{padding:20px 12px;color:var(--ink2);font-size:14px;text-align:center}
.home .results-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:6px;margin-top:10px}

/* ---------- Home ---------- */
.hero{padding:14px 2px 6px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.8px;color:var(--ink3);text-transform:uppercase}
.hero h1{font-size:28px;letter-spacing:-.6px;margin:6px 0 4px;line-height:1.2}
.hero p{margin:0;color:var(--ink2);font-size:14.5px}
.stats{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600}
.home .search{margin-top:18px}
.home .search input{height:46px;font-size:15px;background:var(--card);border-radius:12px}
.home .search .mag{top:14px}.home .search .clr{top:8px}
.cat-sec{margin-top:28px}
.cat-sec h2{font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:8px;letter-spacing:-.2px}
.cat-sec h2 small{font-size:12.5px;color:var(--ink2);font-weight:500}
.cat-sec h2 .dot{width:10px;height:10px;border-radius:50%}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1280px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ucard{position:relative;display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 13px;transition:transform .15s,box-shadow .15s,border-color .15s;min-height:84px}
.ucard:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.06);border-color:var(--line)}
.ucard:active{transform:scale(.98)}
.ucard .n{font-family:var(--mono);font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;align-self:flex-start;margin-bottom:6px}
.ucard b{font-size:16px;letter-spacing:-.3px;line-height:1.25}
.ucard small{font-size:12px;color:var(--ink2);line-height:1.3}

/* ---------- Unit ---------- */
.back{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;color:var(--blue);font-weight:600;padding:4px 0;margin-bottom:6px}
@media (min-width:1024px){.back{display:none}}
.uhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-bottom:14px}
.crumb{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px;font-weight:600}
.crumb .dot{width:8px;height:8px;border-radius:50%}
.uhead .label{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:1px;color:var(--ink3);margin-top:8px}
.uhead h1{margin:2px 0 0;font-size:26px;letter-spacing:-.6px;line-height:1.2}
.uhead h1 span{font-weight:500;color:var(--ink2);font-size:.72em;letter-spacing:-.2px}
@media (min-width:1024px){.uhead h1{font-size:32px}}
.pn{display:flex;gap:6px;flex:none}
.pn a,.pn span{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center}
.pn a:hover{background:var(--fill)}
.pn span{opacity:.35}

.tabs{display:flex;background:#E8E8ED;border-radius:12px;padding:3px;gap:2px}
.tab{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-size:13.5px;font-weight:600;color:var(--ink2);display:flex;flex-direction:column;align-items:center;line-height:1.15}
.tab small{font-size:10.5px;font-weight:500;opacity:.8}
.tab[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
@media (min-width:600px){.tab{flex-direction:row;justify-content:center;gap:6px;font-size:14px}.tab small{font-size:12px}}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 12px}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:600;white-space:nowrap}
.pill:hover{background:var(--fill)}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pill.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.pill.primary:hover{background:#0062c4}
.pill label{color:var(--ink2);font-weight:600;font-size:11.5px}
.pill select{border:0;background:transparent;font-weight:600;font-size:12.5px;outline:none;cursor:pointer;max-width:170px;min-width:0}
.pill .l2{display:inline}
.pill .l2 small{font-size:inherit;font-weight:inherit}
@media (max-width:719px){
  .toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .toolbar .grow{display:none}
  .pill{height:auto;min-height:40px;padding:6px 10px;justify-content:center;white-space:normal}
  .pill.sel{flex-direction:column;align-items:stretch;gap:0;padding:5px 10px}
  .pill.sel label{font-size:10.5px}
  .pill.sel select{max-width:none;width:100%;font-size:13px}
  .pill .l2{display:flex;flex-direction:column;line-height:1.15;text-align:left}
  .pill .l2 small{font-size:10.5px;font-weight:500;opacity:.8}
}
.toolbar .grow{flex:1}

/* ---------- Word list ---------- */
.sheet{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:6px 6px;box-shadow:0 10px 30px rgba(0,0,0,.04)}
.thead,.wrow{display:grid;grid-template-columns:26px minmax(0,1fr) auto;grid-template-areas:"num ko en" "num ro en";column-gap:10px;padding:0 10px}
.thead{display:none}
.wrow{padding:12px 10px;align-items:center;transition:background .2s}
.wrow+.wrow{border-top:1px solid var(--line2)}
.wrow:hover{background:var(--soft)}
.wrow.playing{background:var(--blue-soft)}
.wrow.flash{animation:flash 2s ease}
@keyframes flash{0%,40%{background:#FFF3B0}100%{background:transparent}}
.c-num{grid-area:num;font-family:var(--mono);font-size:11.5px;color:var(--ink3);align-self:center}
.c-ko{grid-area:ko;display:flex;align-items:center;gap:4px;min-width:0}
.c-ko b{font-size:19px;letter-spacing:-.3px}
.c-ro{grid-area:ro;font-family:var(--mono);font-size:13px;color:var(--ink2)}
.c-en{grid-area:en;text-align:right;font-size:14px;font-weight:600;max-width:46vw}
.c-en .note{display:block;font-size:11px;color:var(--ink3);font-weight:500;margin-top:1px}
.spk{width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--ink3);display:inline-flex;align-items:center;justify-content:center;flex:none}
.spk:hover{color:var(--blue);background:var(--blue-soft)}
@media (min-width:720px){
  .thead,.wrow{grid-template-columns:40px 1.25fr 1.25fr 1fr;grid-template-areas:"num ko ro en"}
  .thead{display:grid;font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.4px;padding:12px 10px 10px;border-bottom:1px solid var(--line)}
  .thead span:last-child{text-align:right}
  .c-en{max-width:none}
  .wrow{padding:13px 10px}
}
.hide-ro .c-ro .v,.hide-en .c-en .v{filter:blur(6px);user-select:none;cursor:pointer;transition:filter .2s}
.hide-ro .c-ro .v.reveal,.hide-en .c-en .v.reveal{filter:none}
@media (hover:hover){.hide-ro .c-ro .v:hover,.hide-en .c-en .v:hover{filter:none}}
.tip{font-size:12px;color:var(--ink3);margin:10px 4px 0;text-align:center}

/* ---------- Flashcards ---------- */
.fc-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:16px}
.fc-count{font-family:var(--mono);font-size:12.5px;color:var(--ink2)}
.fc-bar{width:100%;max-width:520px;height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.fc-bar i{display:block;height:100%;background:var(--ink);border-radius:4px;transition:width .25s}
.card3d{outline:none;color:var(--ink);width:100%;max-width:520px;aspect-ratio:1.45/1;perspective:1200px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
@media (max-width:480px){.card3d{aspect-ratio:1/1.05}}
.card3d .inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.card3d.flipped .inner{transform:rotateY(180deg)}
.face{color:var(--ink);position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:22px;
  box-shadow:0 18px 40px rgba(0,0,0,.07);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.face.back{transform:rotateY(180deg)}
.face .big{font-size:44px;font-weight:800;letter-spacing:-1px;line-height:1.15}
.face .big.en{font-size:30px;letter-spacing:-.4px}
.face .ro{font-family:var(--mono);color:var(--ink2);font-size:16px;margin-top:10px}
.face .mid{font-size:24px;font-weight:700;margin-top:14px;letter-spacing:-.3px}
.face .note{font-size:13px;color:var(--ink3);margin-top:6px}
.face .hint{position:absolute;bottom:14px;font-size:11.5px;color:var(--ink3)}
.face .side-tag{position:absolute;top:14px;left:16px;font-size:10.5px;font-weight:700;letter-spacing:.6px;color:var(--ink3);text-transform:uppercase}
.fc-ctrl{display:flex;gap:10px;align-items:center}
.round{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center}
.round:hover{background:var(--fill)}
.round.main-btn{width:60px;height:60px;background:var(--ink);color:#fff;border-color:var(--ink)}
.round.main-btn:hover{background:#000}
.round:disabled{opacity:.3;cursor:default}
.fc-opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* ---------- Quiz ---------- */
.qz-start{display:grid;gap:10px;margin-top:16px}
@media (min-width:720px){.qz-start{grid-template-columns:repeat(3,1fr)}}
.qtype{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,box-shadow .15s}
.qtype:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.07)}
.qtype .ic{width:40px;height:40px;border-radius:12px;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;margin-bottom:6px}
.qtype b{font-size:15.5px}
.qtype small{color:var(--ink2);font-size:12.5px}
.qz-intro{margin-top:16px;color:var(--ink2);font-size:13.5px}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 18px;margin-top:16px;box-shadow:0 10px 30px rgba(0,0,0,.04)}
.qtop{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink2);font-weight:600}
.qtop .qt{font-family:var(--mono)}
.qprompt{text-align:center;padding:26px 0 22px}
.qprompt .ask{font-size:12.5px;color:var(--ink3);font-weight:600;margin-bottom:10px}
.qprompt .word{font-size:40px;font-weight:800;letter-spacing:-.8px;line-height:1.2}
.qprompt .word.en{font-size:28px;letter-spacing:-.3px}
.qprompt .sub{font-size:13px;color:var(--ink3);margin-top:4px}
.listen-btn{width:92px;height:92px;border-radius:50%;border:0;background:var(--blue);color:#fff;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(0,113,227,.3)}
.listen-btn svg{width:38px;height:38px}
.listen-btn:active{transform:scale(.96)}
.opts{display:grid;gap:8px}
@media (min-width:600px){.opts{grid-template-columns:1fr 1fr}}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:14px 16px;text-align:left;font-size:16px;font-weight:600;display:flex;align-items:center;gap:12px;min-height:56px}
.opt .k{font-family:var(--mono);font-size:11px;color:var(--ink3);width:18px;height:18px;border:1px solid var(--line);border-radius:5px;display:flex;align-items:center;justify-content:center;flex:none}
.opt:hover:not(:disabled){border-color:var(--ink3);background:var(--soft)}
.opt.ko{font-size:19px}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.opt.dim{opacity:.45}
.feedback{margin-top:14px;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:14px}
.feedback.ok{background:var(--green-soft);color:var(--green)}
.feedback.no{background:var(--red-soft);color:var(--red)}
.feedback .fx{flex:1;color:var(--ink)}
.feedback .fx b{font-size:16px}
.feedback .fx .r{font-family:var(--mono);color:var(--ink2);font-size:12.5px;margin:0 4px}
.qnext{display:flex;justify-content:flex-end;margin-top:14px}
.btn{height:44px;padding:0 18px;border-radius:12px;border:0;background:var(--ink);color:#fff;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#000}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--fill)}
.btn.blue{background:var(--blue)}
.result{text-align:center;padding:10px 0 4px}
.ring{width:128px;height:128px;margin:6px auto 12px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .sc b{font-size:32px;letter-spacing:-1px}
.ring .sc small{font-size:12px;color:var(--ink2)}
.result h3{margin:0;font-size:20px}
.result p{margin:4px 0 0;color:var(--ink2);font-size:14px}
.wronglist{margin-top:18px;text-align:left}
.wronglist h4{font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.4px;margin:0 0 6px}
.wronglist .wl{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line2)}
.wronglist .wl b{font-size:16px}
.wronglist .wl .r{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.wronglist .wl .e{flex:1;text-align:right;font-size:13.5px;font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}

/* ---------- Bottom nav ---------- */
.bnav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.bnav a,.bnav .ph{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.bnav a:hover{background:var(--soft)}
.bnav .ph{visibility:hidden}
.bnav .d{font-size:11.5px;color:var(--ink3);font-weight:600}
.bnav .t{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bnav .nx{text-align:right;align-items:flex-end}
.foot{margin-top:28px;text-align:center;font-size:13px;color:var(--ink2)}
.foot a{color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.foot a:hover{color:#0062c4}

/* ---------- Print (A4, same look as the reference sheet) ---------- */
#print-sheet{display:none}
@media print{
  @page{size:A4 portrait;margin:0}
  body{background:#fff!important}
  .app{display:none!important}
  #print-sheet{display:block;padding:15mm 15mm;font-family:var(--sans);color:#1D1D1F}
  .ps-head{border-bottom:1px solid #E5E5EA;padding-bottom:5mm;margin-bottom:6mm}
  .ps-head span{font-size:9pt;font-weight:700;letter-spacing:1px;color:#999;text-transform:uppercase}
  .ps-head h1{font-size:22pt;margin:2mm 0 0;letter-spacing:-.5px}
  .ps-head h1 small{font-size:.6em;color:#6E6E73;font-weight:500}
  .ps-row{display:grid;grid-template-columns:10mm 1.3fr 1.3fr 1fr;align-items:center;padding:3.6mm 2mm;border-bottom:1px solid #F0F0F3;break-inside:avoid}
  .ps-row.h{font-size:8pt;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #E5E5EA;padding-top:0}
  .ps-row .n{font-family:var(--mono);font-size:8.5pt;color:#999}
  .ps-row .k{font-size:15pt;font-weight:800}
  .ps-row .r{font-family:var(--mono);font-size:10.5pt;color:#6E6E73}
  .ps-row .e{text-align:right;font-size:10.5pt;font-weight:600}
  .ps-row .e small{display:block;font-size:8pt;color:#999;font-weight:500}
  .ps-row .blank{display:inline-block;min-width:32mm;border-bottom:1px solid #C7C7CC;height:5mm}
  .ps-foot{margin-top:8mm;padding-top:4mm;border-top:1px solid #F0F0F3;display:flex;justify-content:space-between;font-family:var(--mono);font-size:8pt;color:#999}
}

/* ---------- Language selector ---------- */
.langsel{position:relative;display:flex;align-items:center;gap:6px;margin-top:10px;height:36px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--card)}
.langsel svg{color:var(--ink2);flex:none}
.langsel label{font-size:11.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
.langsel select{flex:1;min-width:0;border:0;background:transparent;font-weight:700;font-size:13.5px;outline:none;cursor:pointer;height:100%}
.topbar .langsel{margin:0;height:34px;padding:0 6px 0 8px;max-width:128px}
.topbar .langsel label{display:none}
.topbar .langsel select{font-size:13px}
.home .langsel{display:inline-flex;margin-top:14px;min-width:230px}
@media (min-width:1024px){.home .langsel{display:none}}
[lang=ja]{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Noto Sans CJK JP",var(--sans)}
[lang=zh]{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",var(--sans)}
</style>

function applyLang(code){
  state.lang = TR[code] || code==='en' ? code : 'en';
  const tr = TR[state.lang];
  CATS.forEach(c=>{ c.t = tr ? tr.cats[c.id] : c.en; });
  UNITS.forEach((u,ui)=>{
    u.t = tr ? tr.units[ui] : u.en;
    u.w.forEach((w,i)=>{ const x = tr ? tr.words[ui*10+i] : [w.en, w.note||'']; w.m = x[0]; w.nt = w.homo ? '' : (x[1]||''); });
  });
  UNITS.forEach(u=>u.w.forEach(w=>{ if(w.homo){ const o=UNITS[w.homo[0]-1].w[w.homo[1]]; w.nt = `${w.ko} = ${o.m} (Unit ${w.homo[0]})`; } }));
  buildIndex();
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  $('#side-search').placeholder = '단어 검색 '+t('search');
  document.querySelectorAll('[data-langsel] select').forEach(s=>s.value=state.lang);
  try{ localStorage.setItem('topik1-lang', state.lang); }catch(e){}
}

const speech = { rate:0.85, voices:[], names:[], idx:0 };
function loadVoices(){
  if(!('speechSynthesis' in window)) return;
  const ko = speechSynthesis.getVoices().filter(v=>/ko/i.test(v.lang));
  const list=[];
  if(ko.length){
    const mina = ko.find(v=>v.name.includes('한국의')) || ko[0];
    const yuna = ko.find(v=>/Yuna|유나/.test(v.name)) || (ko.length>1 ? ko.find(v=>v!==mina) : null);
    list.push({v:mina,n:'Mina'});
    if(yuna && yuna!==mina) list.push({v:yuna,n:'Yuna'});
    ko.forEach(v=>{ if(v!==mina && v!==yuna) list.push({v, n:v.name.replace(/Google|Microsoft|Online|\(Natural\)/g,'').replace(/-.*$/,'').trim()||v.name}); });
  }
  speech.voices=list.map(x=>x.v); speech.names=list.map(x=>x.n);
  if(speech.idx>=list.length) speech.idx=0;
  document.querySelectorAll('.voice-select').forEach(fillVoiceSelect);
}
function fillVoiceSelect(sel){
  const names = speech.names.length ? speech.names : ['Default'];
  sel.innerHTML = names.map((n,i)=>`<option value="${i}" ${i===speech.idx?'selected':''}>${esc(n)}</option>`).join('');
}
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged = loadVoices; loadVoices(); }
function speak(text, onend){
  if(!('speechSynthesis' in window)){ onend && onend(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='ko-KR'; u.rate=speech.rate;
  if(speech.voices[speech.idx]) u.voice = speech.voices[speech.idx];
  if(onend){ u.onend=onend; u.onerror=onend; }
  speechSynthesis.speak(u);
}

/* ================= Search ================= */
let INDEX = [];
function buildIndex(){
  INDEX=[];
  UNITS.forEach(u=>u.w.forEach((w,i)=>INDEX.push({u,i,w,
    k:w.ko.replace(/\s/g,''), r:w.ro.replace(/\s/g,'').toLowerCase(),
    e:(w.m+' '+(w.homo?'':w.nt)).toLowerCase(), en:(w.en+' '+(w.note&&!w.homo?w.note:'')).toLowerCase()})));
}
function hl(text,q){
  if(!q) return esc(text);
  const i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));
}
function searchHTML(raw){
  const q=raw.trim(); if(!q) return '';
  const ql=q.toLowerCase(), qn=ql.replace(/\s/g,'');
  const units=UNITS.filter(u=>u.ko.replace(/\s/g,'').includes(qn)||u.t.toLowerCase().includes(ql)||u.en.toLowerCase().includes(ql)).slice(0,6);
  const hits=[];
  INDEX.forEach(x=>{
    let s=0;
    if(x.k===qn) s=100; else if(x.k.startsWith(qn)) s=80; else if(x.k.includes(qn)) s=60;
    else if(x.e.split(/[;,()\s/]+/).includes(ql)) s=55; else if(x.e.includes(ql)) s=40;
    else if(x.en.split(/[;,()\s/]+/).includes(ql)) s=35; else if(x.en.includes(ql)) s=25;
    else if(x.r.startsWith(qn)) s=30; else if(x.r.includes(qn)) s=20;
    if(s) hits.push([s,x]);
  });
  hits.sort((a,b)=>b[0]-a[0]||a[1].u.n-b[1].u.n);
  let h='';
  if(units.length){
    h+=`<div class="rh">유닛 ${esc(t('units'))}</div>`+units.map(u=>`<a class="res" href="#/unit/${u.n}"><span class="u" style="font-family:var(--mono)">UNIT ${pad(u.n)}</span><span class="k">${hl(u.ko,q)}</span><span class="e"${LA()}>${hl(u.t,q)}</span></a>`).join('');
  }
  if(hits.length){
    h+=`<div class="rh">단어 ${esc(t('words'))} · ${hits.length}</div>`+hits.slice(0,60).map(([,x])=>
      `<a class="res" href="#/unit/${x.u.n}/list/${x.i}"><div style="min-width:0"><div class="k">${hl(x.w.ko,q)}</div><div class="r">[${esc(x.w.ro)}]</div></div><div class="e"><span${LA()}>${hl(x.w.m,q)}</span>${state.lang!=='en'&&x.en.includes(ql)&&!x.e.includes(ql)?`<div class="u">${hl(x.w.en,q)}</div>`:''}<div class="u">Unit ${pad(x.u.n)} · ${esc(x.u.ko)}</div></div></a>`).join('');
  }
  if(!h) h=`<div class="empty">검색 결과가 없습니다<br><small${LA()}>${esc(t('noResults'))} “${esc(q)}”</small></div>`;
  return '<div class="results">'+h+'</div>';
}
function bindSearch(input, target, onActive){
  const box=input.closest('.search');
  const run=()=>{ const v=input.value; box.classList.toggle('has',!!v); target().innerHTML=searchHTML(v); onActive && onActive(!!v.trim()); };
  input.addEventListener('input',run);
  box.querySelector('.clr').onclick=()=>{ input.value=''; run(); input.focus(); };
  return run;
}
bindSearch($('#side-search'), ()=>$('#side-results'), on=>{ $('#side-nav').style.display = on?'none':''; });

    h+=`<span class="grow"></span>
      <button class="pill ${state.hideRo?'on':''}" id="t-ro" aria-pressed="${state.hideRo}">${IC.eye} <span class="l2">발음 가리기 <small${LA()}>${esc(t('hideRo'))}</small></span></button>
      <button class="pill ${state.hideEn?'on':''}" id="t-en" aria-pressed="${state.hideEn}">${IC.eye} <span class="l2">${LK()} 가리기 <small${LA()}>${esc(t('hideTr'))}</small></span></button>
      <button class="pill" id="t-play">${playLabel(false)}</button>
      <button class="pill primary" id="t-print">${IC.print} <span class="l2">인쇄 <small${LA()}>${esc(t('print'))}</small></span></button>`;
  }
  $('#toolbar').innerHTML=h;
  fillVoiceSelect($('#vsel'));
  $('#vsel').onchange=e=>{ speech.idx=+e.target.value; };
  $('#rsel').onchange=e=>{ speech.rate=parseFloat(e.target.value); };
  if(state.tab==='list'){
    $('#t-ro').onclick=()=>{ state.hideRo=!state.hideRo; applyMask(); };
    $('#t-en').onclick=()=>{ state.hideEn=!state.hideEn; applyMask(); };
    $('#t-play').onclick=()=>playAll(u);
    $('#t-print').onclick=()=>{ renderPrint(u); window.print(); };
  }
}
const playLabel = on => on ? `${IC.stop} <span class="l2">멈추기 <small${LA()}>${esc(t('stop'))}</small></span>` : `${IC.play} <span class="l2">전체 듣기 <small${LA()}>${esc(t('playAll'))}</small></span>`;
function applyMask(){
  const s=$('#sheet'); if(!s) return;
  s.classList.toggle('hide-ro',state.hideRo); s.classList.toggle('hide-en',state.hideEn);
  s.querySelectorAll('.v.reveal').forEach(x=>x.classList.remove('reveal'));
  const r=$('#t-ro'), e=$('#t-en');
  r.classList.toggle('on',state.hideRo); r.setAttribute('aria-pressed',state.hideRo);
  e.classList.toggle('on',state.hideEn); e.setAttribute('aria-pressed',state.hideEn);
  const tip=$('#mask-tip'); if(tip) tip.style.display=(state.hideRo||state.hideEn)?'':'none';
  if(state.unit) renderPrint(UNITS[state.unit-1]);
}

  u.w.forEach((w,i)=>{
    h+=`<div class="wrow" id="w${i}">
      <span class="c-num">${pad(i+1)}</span>
      <div class="c-ko"><b>${esc(w.ko)}</b><button class="spk" data-say="${esc(w.ko)}" aria-label="Listen ${esc(w.ko)}" title="듣기 Listen">${IC.spk}</button></div>
      <span class="c-ro"><span class="v">[${esc(w.ro)}]</span></span>
      <span class="c-en"><span class="v"${LA()}>${esc(w.m)}${w.nt?`<span class="note">(${esc(noteText(w))})</span>`:''}</span></span>
    </div>`;
  });
  h+=`</div><p class="tip" id="mask-tip" style="display:none">가려진 부분을 눌러 확인하세요 · <span${LA()}>${esc(t('reveal'))}</span></p>`;
  $('#tabbody').innerHTML=h;
  applyMask();
  $('#sheet').addEventListener('click',e=>{
    const b=e.target.closest('.spk'); if(b){ speak(b.dataset.say); return; }
    const v=e.target.closest('.v'); if(v && (state.hideRo||state.hideEn)) v.classList.toggle('reveal');
  });
  if(focus!=null){
    const row=$('#w'+focus);
    if(row){ requestAnimationFrame(()=>{ row.scrollIntoView({block:'center',behavior:'smooth'}); row.classList.add('flash'); speak(u.w[focus].ko); }); }
  }
}
function playAll(u){
  if(state.playing){ stopAll(); return; }
  state.playing=true;
  const btn=$('#t-play'); btn.classList.add('on'); btn.innerHTML=playLabel(true);
  let i=0;
  const step=()=>{
    document.querySelectorAll('.wrow.playing').forEach(r=>r.classList.remove('playing'));
    if(!state.playing || i>=u.w.length){ stopAll(); return; }
    const row=$('#w'+i); if(row){ row.classList.add('playing'); row.scrollIntoView({block:'nearest',behavior:'smooth'}); }
    const cur=i++;
    speak(u.w[cur].ko, ()=>{ if(state.playing) setTimeout(step,700); });
  };
  step();
}
function stopAll(){
  const was=state.playing; state.playing=false;
  if('speechSynthesis' in window && was) speechSynthesis.cancel();
  document.querySelectorAll('.wrow.playing').forEach(r=>r.classList.remove('playing'));
  const btn=$('#t-play'); if(btn){ btn.classList.remove('on'); btn.innerHTML=playLabel(false); }
}

/* ---------- Flashcards ---------- */
function renderCards(u){
  if(!state.fc) state.fc={order:u.w.map((_,i)=>i), i:0, flipped:false, dir:'ko'};
  const f=state.fc, w=u.w[f.order[f.i]], total=u.w.length;
  const nt = w.nt && !w.homo ? `<div class="note"${LA()}>(${esc(w.nt)})</div>` : '';
  const front = f.dir==='ko'
    ? `<div class="side-tag">한국어 ${esc(t('korean'))}</div><div class="big">${esc(w.ko)}</div><div class="hint">탭하여 뒤집기 · <span${LA()}>${esc(t('tapFlip'))}</span></div>`
    : `<div class="side-tag">${LK()} ${esc(LANGS.find(l=>l[0]===state.lang)[1])}</div><div class="big en"${LA()}>${esc(w.m)}</div>${nt}<div class="hint">탭하여 뒤집기 · <span${LA()}>${esc(t('tapFlip'))}</span></div>`;
  const back = `<div class="side-tag">정답 <span${LA()}>${esc(t('answer'))}</span></div>` + (f.dir==='ko'
    ? `<div class="big en"${LA()}>${esc(w.m)}</div>${w.nt?`<div class="note"${LA()}>(${esc(noteText(w))})</div>`:''}<div class="mid">${esc(w.ko)}</div><div class="ro">[${esc(w.ro)}]</div>`
    : `<div class="big">${esc(w.ko)}</div><div class="ro">[${esc(w.ro)}]</div><div class="note" style="margin-top:12px"${LA()}>${esc(w.m)}${w.nt?' ('+esc(noteText(w))+')':''}</div>`);
  $('#tabbody').innerHTML=`
  <div class="fc-wrap">
    <div class="fc-count">${f.i+1} / ${total}</div>
    <div class="fc-bar"><i style="width:${(f.i+1)/total*100}%"></i></div>
    <div class="card3d ${f.flipped?'flipped':''}" id="card" role="button" tabindex="0" aria-label="Flashcard. Press to flip">
      <div class="inner"><div class="face front">${front}</div><div class="face back">${back}</div></div>
    </div>
    <div class="fc-ctrl">
      <button class="round" id="fc-prev" aria-label="Previous card" ${f.i===0?'disabled':''}>${IC.left}</button>
      <button class="round" id="fc-say" aria-label="Listen">${IC.spkL}</button>
      <button class="round main-btn" id="fc-flip" aria-label="Flip">${IC.flip}</button>
      <button class="round" id="fc-next" aria-label="Next card" ${f.i===total-1?'disabled':''}>${IC.right}</button>
    </div>
    <div class="fc-opts">
      <button class="pill" id="fc-dir">${f.dir==='ko'?`한국어 → ${LK()} · KO → ${CODE()}`:`${LK()} → 한국어 · ${CODE()} → KO`}</button>
      <button class="pill" id="fc-shuf">${IC.shuf} 섞기 <span${LA()}>${esc(t('shuffle'))}</span></button>
      <button class="pill" id="fc-reset">${IC.restart} 처음부터 <span${LA()}>${esc(t('restart'))}</span></button>
    </div>
    <p class="tip">키보드: ← → 이동, Space 뒤집기 · <span${LA()}>${esc(t('kbCards'))}</span></p>
  </div>`;
  const card=$('#card');
  const flip=()=>{ f.flipped=!f.flipped; card.classList.toggle('flipped',f.flipped); if(f.flipped && f.dir==='en') speak(w.ko); };
  const go=d=>{ const ni=f.i+d; if(ni<0||ni>=total) return; f.i=ni; f.flipped=false; renderCards(u); if(f.dir==='ko') speak(u.w[f.order[f.i]].ko); };
  card.onclick=flip; $('#fc-flip').onclick=flip;
  $('#fc-prev').onclick=()=>go(-1); $('#fc-next').onclick=()=>go(1);
  $('#fc-say').onclick=()=>speak(w.ko);
  $('#fc-dir').onclick=()=>{ f.dir=f.dir==='ko'?'en':'ko'; f.flipped=false; renderCards(u); };
  $('#fc-shuf').onclick=()=>{ f.order=shuffle(f.order); f.i=0; f.flipped=false; renderCards(u); };
  $('#fc-reset').onclick=()=>{ f.order=u.w.map((_,i)=>i); f.i=0; f.flipped=false; renderCards(u); };
  let sx=null;
  card.addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; },{passive:true});
  card.addEventListener('touchend',e=>{ if(sx==null) return; const dx=e.changedTouches[0].clientX-sx; sx=null; if(Math.abs(dx)>50){ e.preventDefault(); go(dx<0?1:-1); } });
  state.fcKeys={flip,go};
}

/* ---------- Quiz ---------- */
const QTYPES = () => ({
  ko2en:{ic:'가',ko:`한국어 → ${LK()}`,tr:t('q1'),d:`${LK()} 뜻을 고르세요`,dt:t('d1')},
  en2ko:{ic:'A',ko:`${LK()} → 한국어`,tr:t('q2'),d:'한국어 단어를 고르세요',dt:t('d2')},
  listen:{ic:'🔊',ko:'듣고 고르기',tr:t('q3'),d:'듣고 알맞은 한국어를 고르세요',dt:t('d3')}
});
function buildQuiz(u,type){
  return shuffle(u.w).map(w=>{
    const key = type==='ko2en' ? label : x=>x.ko;
    const pool = shuffle(u.w.filter(x=>x!==w && key(x)!==key(w)));
    const seen=new Set([key(w)]), opts=[w];
    for(const x of pool){ if(opts.length>=4) break; if(!seen.has(key(x))){ seen.add(key(x)); opts.push(x); } }
    return {w, opts:shuffle(opts), picked:null};
  });
}
function renderQuiz(u){
  const q=state.qz, QT=QTYPES();
  if(!q || !q.type){
    $('#tabbody').innerHTML=`<p class="qz-intro">퀴즈 유형을 선택하세요 (10문제) · <span${LA()}>${esc(t('qIntro'))}</span></p>
      <div class="qz-start">${Object.entries(QT).map(([k,x])=>`<button class="qtype" data-t="${k}"><span class="ic">${x.ic}</span><b>${esc(x.ko)}</b><small style="font-weight:600;color:var(--ink)"${LA()}>${esc(x.tr)}</small><small>${esc(x.d)}</small><small${LA()}>${esc(x.dt)}</small></button>`).join('')}</div>`;
    document.querySelectorAll('.qtype').forEach(b=>b.onclick=()=>{ state.qz={type:b.dataset.t, qs:buildQuiz(u,b.dataset.t), i:0, score:0}; renderQuiz(u); });
    return;
  }
  if(q.i>=q.qs.length) return renderResult(u);
  const cur=q.qs[q.i], w=cur.w, x=QT[q.type], total=q.qs.length;
  let prompt;
  if(q.type==='ko2en') prompt=`<div class="ask">이 단어의 뜻은? · <span${LA()}>${esc(t('ask1'))}</span></div><div class="word">${esc(w.ko)}</div>`;
  else if(q.type==='en2ko') prompt=`<div class="ask">한국어로 무엇일까요? · <span${LA()}>${esc(t('ask2'))}</span></div><div class="word en"${LA()}>${esc(w.m)}</div>${w.nt&&!w.homo?`<div class="sub"${LA()}>(${esc(w.nt)})</div>`:''}`;
  else prompt=`<div class="ask">듣고 고르세요 · <span${LA()}>${esc(t('ask3'))}</span></div><button class="listen-btn" id="q-listen" aria-label="Play word">${IC.spkL}</button><div class="sub" style="margin-top:12px">다시 듣기 · <span${LA()}>${esc(t('replay'))}</span></div>`;
  const optTxt = o => q.type==='ko2en' ? `<span${LA()}>${esc(o.m)}${o.nt&&!o.homo?` <small style="font-weight:500;color:var(--ink2)">(${esc(o.nt)})</small>`:''}</span>` : esc(o.ko);
  const answered = cur.picked!=null;
  const opts = cur.opts.map((o,i)=>{
    let cls='opt'+(q.type!=='ko2en'?' ko':'');
    if(answered){ if(o===w) cls+=' correct'; else if(i===cur.picked) cls+=' wrong'; else cls+=' dim'; }
    return `<button class="${cls}" data-i="${i}" ${answered?'disabled':''}><span class="k">${i+1}</span>${optTxt(o)}</button>`;
  }).join('');
  let fb='';
  if(answered){
    const ok=cur.opts[cur.picked]===w;
    fb=`<div class="feedback ${ok?'ok':'no'}"><strong>${ok?'정답!':'오답'} <span${LA()}>${esc(t(ok?'correct':'incorrect'))}</span></strong>
      <div class="fx"><b>${esc(w.ko)}</b><span class="r">[${esc(w.ro)}]</span> <span${LA()}>${esc(w.m)}</span></div>
      <button class="spk" data-say="${esc(w.ko)}" aria-label="Listen">${IC.spk}</button></div>
      <div class="qnext"><button class="btn" id="q-next">${q.i===total-1?'결과 보기 ':'다음 '}<span${LA()}>${esc(t(q.i===total-1?'results':'nextQ'))}</span> ${IC.right}</button></div>`;
  }
  $('#tabbody').innerHTML=`
    <div class="qbox">
      <div class="qtop"><span>${esc(x.ko)} · <span${LA()}>${esc(x.tr)}</span></span><span class="qt">${q.i+1} / ${total} · ✓ ${q.score}</span></div>
      <div class="fc-bar" style="max-width:none;margin-top:10px"><i style="width:${(q.i+(answered?1:0))/total*100}%"></i></div>
      <div class="qprompt">${prompt}</div>
      <div class="opts">${opts}</div>
      ${fb}
    </div>
    <div class="actions" style="justify-content:flex-start"><button class="pill" id="q-quit">${IC.restart} 유형 다시 선택 <span${LA()}>${esc(t('changeType'))}</span></button></div>`;
  if(q.type==='listen'){ $('#q-listen').onclick=()=>speak(w.ko); if(!answered && !cur.played){ cur.played=true; setTimeout(()=>speak(w.ko),250); } }
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(u,+b.dataset.i));
  const sp=document.querySelector('.feedback .spk'); if(sp) sp.onclick=()=>speak(w.ko);
  const nx=$('#q-next'); if(nx){ nx.onclick=()=>{ q.i++; renderQuiz(u); }; nx.focus({preventScroll:true}); }
  $('#q-quit').onclick=()=>{ state.qz=null; renderQuiz(u); };
}
function answer(u,i){
  const q=state.qz, cur=q.qs[q.i]; if(cur.picked!=null) return;
  cur.picked=i;
  if(cur.opts[i]===cur.w) q.score++;
  if(q.type!=='listen') speak(cur.w.ko);
  renderQuiz(u);
}
function renderResult(u){
  const q=state.qz, total=q.qs.length, pct=q.score/total, C=2*Math.PI*54, x=QTYPES()[q.type];
  const wrong=q.qs.filter(z=>z.opts[z.picked]!==z.w).map(z=>z.w);
  const msg = pct===1?['완벽해요! 🎉','r1'] : pct>=.8?['아주 잘했어요!','r2'] : pct>=.5?['좋아요, 조금만 더!','r3'] : ['다시 한번 해 봐요','r4'];
  const next=UNITS[u.n];
  $('#tabbody').innerHTML=`
    <div class="qbox"><div class="result">
      <div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="#E5E5EA" stroke-width="10"/>
        <circle cx="60" cy="60" r="54" fill="none" stroke="${pct>=.8?'#1E8E3E':pct>=.5?'#0071E3':'#D93025'}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"/></svg>
        <div class="sc"><b>${q.score}/${total}</b><small>${Math.round(pct*100)}%</small></div></div>
      <h3>${msg[0]}</h3><p><span${LA()}>${esc(t(msg[1]))}</span> · ${esc(x.ko)} · <span${LA()}>${esc(x.tr)}</span></p>
      ${wrong.length?`<div class="wronglist"><h4>틀린 단어 <span${LA()}>${esc(t('review'))}</span> · ${wrong.length}</h4>${wrong.map(w=>`<div class="wl"><button class="spk" data-say="${esc(w.ko)}" aria-label="Listen">${IC.spk}</button><b>${esc(w.ko)}</b><span class="r">[${esc(w.ro)}]</span><span class="e"${LA()}>${esc(label(w))}</span></div>`).join('')}</div>`:''}
      <div class="actions">
        <button class="btn" id="r-retry">${IC.restart} 다시 풀기 <span${LA()}>${esc(t('retry'))}</span></button>
        <button class="btn ghost" id="r-type">다른 유형 <span${LA()}>${esc(t('otherType'))}</span></button>
        ${next?`<a class="btn blue" href="#/unit/${u.n+1}/quiz">다음 유닛 <span${LA()}>${esc(t('nextUnit'))}</span> ${IC.right}</a>`:''}
      </div>
    </div></div>`;
  document.querySelectorAll('.wronglist .spk').forEach(b=>b.onclick=()=>speak(b.dataset.say));
  $('#r-retry').onclick=()=>{ state.qz={type:q.type, qs:buildQuiz(u,q.type), i:0, score:0}; renderQuiz(u); };
  $('#r-type').onclick=()=>{ state.qz=null; renderQuiz(u); };
}

/* ================= Keyboard ================= */
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,select,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  if(state.unit && state.tab==='cards' && state.fcKeys){
    if(e.key==='ArrowRight'){ state.fcKeys.go(1); e.preventDefault(); }
    else if(e.key==='ArrowLeft'){ state.fcKeys.go(-1); e.preventDefault(); }
    else if(e.key===' '||e.key==='Enter'){ state.fcKeys.flip(); e.preventDefault(); }
  } else if(state.unit && state.tab==='quiz' && state.qz && state.qz.type && state.qz.i<state.qz.qs.length){
    const cur=state.qz.qs[state.qz.i];
    if(cur.picked==null && /^[1-4]$/.test(e.key) && +e.key<=cur.opts.length){ answer(UNITS[state.unit-1], +e.key-1); e.preventDefault(); }
  }
});

/* ================= Router ================= */
function route(keep){
  if(!isDesktop()) openDrawer(false);
  const m=location.hash.match(/^#\/unit\/(\d+)(?:\/(list|cards|quiz))?(?:\/(\d+))?/);
  const prevUnit=state.unit;
  if(m){
    const n=Math.min(100,Math.max(1,+m[1]));
    renderUnit(n, m[2]||'list', keep===true?null:(m[3]!=null?+m[3]:null));
    if(keep!==true && prevUnit!==n && m[3]==null) window.scrollTo(0,0);
  } else if(!location.hash || location.hash==='#' ){
    if(isDesktop()){ history.replaceState(null,'','#/unit/1'); renderUnit(1,'list'); }
    else renderHome();
  } else { renderHome(); if(keep!==true) window.scrollTo(0,0); }
}
(function init(){
  let saved='en'; try{ saved=localStorage.getItem('topik1-lang')||'en'; }catch(e){}
  if(!LANGS.some(l=>l[0]===saved)) saved='en';
  applyLang(saved);
  document.querySelectorAll('[data-langsel]').forEach((el,i)=>initLangSel(el,'lang-sel-'+i));
  renderNav();
  window.addEventListener('hashchange',()=>route());
  route();
})();
</script>
