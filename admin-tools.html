<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 도구 – All About Korea</title>
<meta name="robots" content="noindex, nofollow">
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;background:#f7f7f7;color:#222}
  .card{max-width:560px;margin:48px auto;background:#fff;border:1px solid #e8e8e8;border-radius:16px;padding:28px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
  h1{font-size:20px;margin:0 0 6px} p{font-size:14px;line-height:1.6;color:#555}
  button{width:100%;padding:13px;border:none;border-radius:10px;background:#3d5afe;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  pre{background:#f1f5f9;border-radius:10px;padding:14px;font-size:12.5px;white-space:pre-wrap;word-break:break-all;min-height:40px}
  .warn{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:12px 14px;font-size:13px;color:#9a3412;margin:14px 0}
</style>
</head>
<body>
<div class="card">
  <h1>보안 이전 작업 (1회 실행)</h1>
  <p>eBook 파일 주소와 Masterclass 강의 HTML을 공개 위치에서 비공개 위치로 옮기고, 이미 퍼졌을 수 있는 예전 다운로드 링크를 무효화합니다.</p>
  <div class="warn">새 Cloud Functions 배포와 새 bookstore·masterclass 페이지 업로드를 <b>먼저</b> 끝낸 뒤 실행하세요. 여러 번 눌러도 안전합니다.</div>
  <p id="who">로그인 확인 중…</p>
  <button id="run" disabled>이전 작업 실행</button>
  <pre id="out"></pre>
</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-functions.js";
  const app = initializeApp({ apiKey: "AIzaSyA-qZfGlrEEAQRpl4KQzJmU7f4j1R0Usl8", authDomain: "all-about-korea-login.firebaseapp.com",
    projectId: "all-about-korea-login", storageBucket: "all-about-korea-login.firebasestorage.app",
    messagingSenderId: "20771155142", appId: "1:20771155142:web:bbfeb19541625e750cbbc7" });
  const fns = getFunctions(app, "asia-northeast3");
  const who = document.getElementById('who'), btn = document.getElementById('run'), out = document.getElementById('out');
  onAuthStateChanged(getAuth(app), (u) => {
    if (!u) { location.href = "https://www.businesskorean.com/login.html?redirect=admin-tools.html"; return; }
    who.textContent = "로그인: " + u.email + " (관리자만 실행됩니다)";
    btn.disabled = false;
  });
  btn.onclick = async () => {
    btn.disabled = true; out.textContent = "실행 중… (최대 몇 분 걸릴 수 있습니다)";
    try {
      const r = await httpsCallable(fns, "migrateSecureContent", { timeout: 540000 })();
      const d = r.data;
      out.textContent = `완료!\n책 처리: ${d.books}\n비공개 파일 목록 생성: ${d.bookFiles}\n구매 기록 정리: ${d.purchases}\n강의 이전: ${d.lessons}\n무효화한 예전 링크: ${d.tokensRevoked}`
        + (d.errors && d.errors.length ? `\n\n확인 필요:\n- ${d.errors.join('\n- ')}` : '');
    } catch (e) { out.textContent = "실패: " + (e.message || e.code); }
    btn.disabled = false;
  };
</script>
</body>
</html>
