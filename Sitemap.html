const PAGE_DESC = {"en": "All About Korea at a glance: learn Korean with a native Korean teacher (1:1 tutor, masterclass, books, blog), a women-only Seoul homestay and Seoul guided tours.", "es": "Todo All About Korea de un vistazo: aprende coreano con un profesor nativo (tutor 1:1, masterclass, libros, blog), homestay en Seúl para mujeres y tours guiados por Seúl.", "zh": "一目了然 All About Korea：跟韩国母语老师学韩语（一对一家教、大师课、书籍、博客）、首尔女性专属寄宿家庭和首尔导览。", "ja": "All About Korea のすべてを一目で：ネイティブ講師と学ぶ韓国語（マンツーマン・マスタークラス・本・ブログ）、ソウルの女性専用ホームステイ、ソウルのガイドツアー。", "fr": "All About Korea en un coup d'œil : apprenez le coréen avec un professeur natif (tuteur 1:1, masterclass, livres, blog), homestay à Séoul pour femmes et visites guidées de Séoul.", "de": "All About Korea auf einen Blick: Koreanisch lernen mit Muttersprachler (1:1-Tutor, Masterclass, Bücher, Blog), Homestay in Seoul nur für Frauen und geführte Touren in Seoul.", "pl": "All About Korea w jednym miejscu: nauka koreańskiego z native speakerem (korepetytor 1:1, masterclass, książki, blog), homestay w Seulu dla kobiet i wycieczki po Seulu."};
const t = key => (I18N[currentLang][key] !== undefined ? I18N[currentLang][key] : I18N.en[key]);

// ---- Links (사이트 메뉴 = menu.js 와 같은 주소, 외부 링크 = index 상단 아이콘과 같은 주소) ----

const SITEMAP = [

const BOTTOM_NAV = [
  { icon:"home", key:"bn_home", href:"https://www.businesskorean.com/", active:false },

  { icon:"search", key:"bn_search", action:"toggleSearch" },

];

// ---- Render ----
function renderAll(){
  document.documentElement.lang = currentLang;
  document.getElementById("langCode").textContent = currentLang.toUpperCase();
  document.getElementById("pageH1").textContent = t("page_title");
  document.getElementById("pageSub").textContent = t("page_sub");
  document.getElementById("searchInput").placeholder = t("search_ph");
  document.getElementById("emptyMsg").textContent = t("empty");
  document.getElementById("footerCopy").textContent = t("footer_copy");
  document.getElementById("pageTitleTag").textContent = t("page_title") + " | All About Korea";
  var _d = document.querySelector('meta[name="description"]'); if (_d && PAGE_DESC[currentLang]) _d.setAttribute("content", PAGE_DESC[currentLang]);

  document.getElementById("langMenu").innerHTML = LANGS.map(l =>
    `<button class="lang-item${l.code===currentLang?" sel":""}" data-lang="${l.code}">${l.label}</button>`
  ).join("");

  document.getElementById("bottomNav").innerHTML = BOTTOM_NAV.map(i => {
    const tag = i.href ? "a" : "button";
    const hrefAttr = i.href ? `href="${i.href}"` : "";
    const actionAttr = i.action ? `data-action="${i.action}"` : "";
    const iconHtml = i.active ? `<span class="pill">${svg(i.icon)}</span>` : svg(i.icon);
    return `<${tag} class="bn-item${i.active?" active":""}" ${hrefAttr} ${actionAttr}>${iconHtml}<span>${t(i.key)}</span></${tag}>`;
  }).join("");

  renderCards(document.getElementById("searchInput").value);
}

function renderCards(filter=""){
  const q = filter.trim().toLowerCase();
  const area = document.getElementById("cardArea");
  let visibleCount = 0;
  area.innerHTML = SITEMAP.map(card => {
    const title = t(card.titleKey), desc = t(card.descKey);
    const linkData = card.links.map(l => {
      const [label, subLabel=""] = t(l.key).split("||");
      return { label, subLabel, href:l.href, ext:l.ext };
    });
    const matched = q ? linkData.filter(l => title.toLowerCase().includes(q) || l.label.toLowerCase().includes(q) || l.subLabel.toLowerCase().includes(q)) : linkData;
    if(q && !title.toLowerCase().includes(q) && matched.length===0) return "";
    if(matched.length===0) return "";
    visibleCount++;
    return `
    <div class="card">
      <div class="card-head">
        <div class="card-icon">${svg(card.icon)}</div>
        <div>
          <div class="card-title">${title}</div>
          <div class="card-desc">${desc}</div>
        </div>
      </div>
      <div class="link-list">
        ${matched.map(l => `
          <a class="link-row${l.ext?' ext':''}" href="${l.href}"${l.ext?' target="_blank" rel="noopener"':''}>
            <span class="label">${l.label}<small>${l.subLabel}</small></span>
            ${svg(l.ext ? "ext" : "chevron", "icon chev")}
          </a>`).join("")}
      </div>
    </div>`;
  }).join("");
  document.getElementById("emptyMsg").style.display = visibleCount===0 ? "block" : "none";
}

renderAll();

// ---- Interactions ----

const langBtn = document.getElementById("langBtn"), langMenu = document.getElementById("langMenu");
langBtn.addEventListener("click", e => { e.stopPropagation(); langMenu.classList.toggle("open"); });
document.addEventListener("click", e => { if(!langMenu.contains(e.target) && e.target!==langBtn) langMenu.classList.remove("open"); });
langMenu.addEventListener("click", e => {
  const btn = e.target.closest("[data-lang]");
  if(!btn) return;
  currentLang = btn.dataset.lang;
  langMenu.classList.remove("open");
  renderAll();
});

document.getElementById("bottomNav").addEventListener("click", e => {
  const btn = e.target.closest("[data-action='toggleSearch']");
  if(!btn) return;
  e.preventDefault();
  const wrap = document.getElementById("searchWrap");
  wrap.classList.toggle("open");
  const input = document.getElementById("searchInput");
  if(wrap.classList.contains("open")) input.focus();
  else { input.value=""; renderCards(); }
});
document.getElementById("searchInput").addEventListener("input", e => renderCards(e.target.value));
</script>
