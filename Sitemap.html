<style>
  :root{
    --pink:#db2777; --pink-light:#fdf2f8; --pink-soft:#fce7f3;
    --indigo:#4f46e5; --indigo-light:#eef2ff;
    --ink:#1f2430; --gray:#6b7280; --line:#eceef1; --bg:#fef8fa;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",sans-serif;
    background:var(--bg); color:var(--ink); max-width:1040px; margin:0 auto;
    min-height:100vh; padding-bottom:76px; position:relative;
  }
  .icon{width:20px; height:20px; stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0;}

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px; background:#fff; border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20; gap:8px;
  }
  header .left{display:flex; align-items:center; gap:14px; min-width:0;}
  #menuBtn{background:none; border:none; padding:4px; color:var(--ink); cursor:pointer;}
  #menuBtn .icon{width:26px; height:26px;}
  .brand{font-size:21px; font-weight:800; white-space:nowrap;}
  .brand span{color:var(--pink);}

  /* Language switcher */
  .lang-wrap{position:relative; flex-shrink:0;}
  #langBtn{display:flex; align-items:center; gap:6px; background:var(--pink-light); color:var(--pink);
    border:none; border-radius:20px; padding:8px 14px; font-size:14px; font-weight:700; cursor:pointer;}
  #langBtn .icon{width:17px; height:17px;}
  #langMenu{position:absolute; top:calc(100% + 8px); right:0; background:#fff; border-radius:12px;
    box-shadow:0 8px 24px rgba(20,20,30,.15); min-width:160px; padding:6px; display:none; z-index:25;}
  #langMenu.open{display:block;}
  .lang-item{display:flex; align-items:center; justify-content:space-between; width:100%; padding:10px 12px;
    border:none; background:none; border-radius:8px; font-size:15px; font-weight:600; color:var(--ink);
    cursor:pointer; text-align:left;}
  .lang-item:hover{background:var(--pink-light);}
  .lang-item.sel{color:var(--pink);}

  #overlay{position:fixed; inset:0; background:rgba(20,20,30,.45); opacity:0; pointer-events:none;
    transition:opacity .25s ease; z-index:30;}
  #overlay.open{opacity:1; pointer-events:auto;}
  #drawer{position:fixed; top:0; left:0; height:100%; width:78%; max-width:300px; background:#fff;
    transform:translateX(-100%); transition:transform .28s ease; z-index:31; padding:20px 14px;
    box-shadow:2px 0 16px rgba(0,0,0,.08);}
  #drawer.open{transform:translateX(0);}
  .drawer-head{display:flex; justify-content:space-between; align-items:center; padding:4px 8px 18px;}
  .drawer-head .brand{font-size:19px;}
  #closeBtn{background:none; border:none; color:var(--gray); cursor:pointer;}
  .nav-item{display:flex; align-items:center; gap:12px; padding:13px 10px; border-radius:10px;
    color:var(--ink); text-decoration:none; font-size:16px; font-weight:600; margin-bottom:2px;}
  .nav-item.active{background:var(--indigo-light); color:var(--indigo);}

  main{padding:28px 28px 8px;}
  h1{font-size:30px; font-weight:800; margin-bottom:8px;}
  .sub{color:var(--gray); font-size:15px; line-height:1.5; margin-bottom:22px;}

  .search-wrap{display:none; margin-bottom:18px;}
  .search-wrap.open{display:block;}
  .search-box{display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line);
    border-radius:12px; padding:11px 16px; max-width:420px;}
  .search-box input{border:none; outline:none; flex:1; font-size:15px; font-family:inherit; background:transparent;}
  .search-box .icon{color:var(--gray);}

  #cardArea{display:grid; grid-template-columns:repeat(2, 1fr); gap:16px;}
  .card{background:#fff; border-radius:16px; padding:22px; margin-bottom:0; box-shadow:0 1px 3px rgba(20,20,30,.05);}
  .card-head{display:flex; align-items:flex-start; gap:14px; margin-bottom:16px;}
  .card-icon{width:46px; height:46px; border-radius:12px; background:var(--pink-light); color:var(--pink);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .card-title{font-size:18px; font-weight:800;}
  .card-desc{font-size:14px; color:var(--gray); line-height:1.5; margin-top:3px;}
  .link-list{border-top:1px solid var(--line);}
  .link-row{display:flex; align-items:center; justify-content:space-between; padding:13px 2px;
    border-bottom:1px solid var(--line); text-decoration:none; color:var(--ink);}
  .link-row:last-child{border-bottom:none;}
  .link-row .label{font-size:15px; font-weight:600;}
  .link-row .label small{display:block; font-size:12.5px; color:var(--gray); font-weight:500; margin-top:1px;}
  .link-row .chev{color:#c9ccd3;}
  .link-row.ext .chev{color:var(--pink);}
  .empty{display:none; text-align:center; color:var(--gray); font-size:15px; padding:30px 0; grid-column:1/-1;}

  footer{padding:26px 18px 10px; text-align:center;}
  footer .fbrand{color:var(--pink); font-weight:800; font-size:15px; margin-bottom:6px;}
  footer .fcopy{font-size:12.5px; color:#a9adb5;}

  .bottom-nav{position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:1040px;
    background:#fff; border-top:1px solid var(--line); display:flex; z-index:20;}
  .bn-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:11px 0 9px;
    background:none; border:none; color:var(--gray); font-size:12.5px; font-weight:600; cursor:pointer; text-decoration:none;}
  .bn-item.active{color:var(--pink);}
  .bn-item.active .pill{background:var(--pink); color:#fff; border-radius:14px; padding:3px 12px; margin-bottom:1px;}
  .bn-item .pill .icon{width:19px; height:19px;}
  .bn-item .icon{width:21px; height:21px;}

  @media(max-width:700px){
    #cardArea{grid-template-columns:1fr;}
    header{padding:16px 18px;}
    main{padding:20px 18px 8px;}
  }
</style>
</head>

  { icon:"home", key:"bn_home", href:"https://www.businesskorean.com", active:false },

  { icon:"search", key:"bn_search", action:"toggleSearch" },

];

// ---- Render ----
function renderAll(){
  document.documentElement.lang = currentLang;
  document.getElementById("langCode").textContent = currentLang.toUpperCase();
  document.getElementById("pageH1").textContent = t("page_title");
  document.getElementById("pageSub").textContent = t("page_sub");
  document.getElementById("searchInput").placeholder = t("search_ph");
  document.getElementById("emptyMsg").textContent = t("empty");
  document.getElementById("footerCopy").textContent = t("footer_copy");
  document.getElementById("pageTitleTag").textContent = t("page_title") + " | All About Korea";

  document.getElementById("navList").innerHTML = SITE_NAV.map(i =>
    `<a class="nav-item${i.active?" active":""}" href="${i.href}">${svg(i.icon)}<span>${t(i.key)}</span></a>`
  ).join("");

  document.getElementById("langMenu").innerHTML = LANGS.map(l =>
    `<button class="lang-item${l.code===currentLang?" sel":""}" data-lang="${l.code}">${l.label}</button>`
  ).join("");

  document.getElementById("bottomNav").innerHTML = BOTTOM_NAV.map(i => {
    const tag = i.href ? "a" : "button";
    const hrefAttr = i.href ? `href="${i.href}"` : "";
    const actionAttr = i.action ? `data-action="${i.action}"` : "";
    const iconHtml = i.active ? `<span class="pill">${svg(i.icon)}</span>` : svg(i.icon);
    return `<${tag} class="bn-item${i.active?" active":""}" ${hrefAttr} ${actionAttr}>${iconHtml}<span>${t(i.key)}</span></${tag}>`;
  }).join("");

  renderCards(document.getElementById("searchInput").value);
}

function renderCards(filter=""){
  const q = filter.trim().toLowerCase();
  const area = document.getElementById("cardArea");
  let visibleCount = 0;
  area.innerHTML = SITEMAP.map(card => {
    const title = t(card.titleKey), desc = t(card.descKey);
    const linkData = card.links.map(l => {
      const [label, subLabel] = t(l.key).split("||");
      return { label, subLabel, href:l.href, ext:l.ext };
    });
    const matched = q ? linkData.filter(l => title.toLowerCase().includes(q) || l.label.toLowerCase().includes(q) || l.subLabel.toLowerCase().includes(q)) : linkData;
    if(q && !title.toLowerCase().includes(q) && matched.length===0) return "";
    if(matched.length===0) return "";
    visibleCount++;
    return `
    <div class="card">
      <div class="card-head">
        <div class="card-icon">${svg(card.icon)}</div>
        <div>
          <div class="card-title">${title}</div>
          <div class="card-desc">${desc}</div>
        </div>
      </div>
      <div class="link-list">
        ${matched.map(l => `
          <a class="link-row${l.ext?' ext':''}" href="${l.href}" target="_blank" rel="noopener">
            <span class="label">${l.label}<small>${l.subLabel}</small></span>
            ${svg(l.ext ? "ext" : "chevron", "icon chev")}
          </a>`).join("")}
      </div>
    </div>`;
  }).join("");
  document.getElementById("emptyMsg").style.display = visibleCount===0 ? "block" : "none";
}

renderAll();

// ---- Interactions ----
const drawer = document.getElementById("drawer"), overlay = document.getElementById("overlay");
document.getElementById("menuBtn").addEventListener("click", () => { drawer.classList.add("open"); overlay.classList.add("open"); });
document.getElementById("closeBtn").addEventListener("click", () => { drawer.classList.remove("open"); overlay.classList.remove("open"); });
overlay.addEventListener("click", () => { drawer.classList.remove("open"); overlay.classList.remove("open"); langMenu.classList.remove("open"); });

const langBtn = document.getElementById("langBtn"), langMenu = document.getElementById("langMenu");
langBtn.addEventListener("click", e => { e.stopPropagation(); langMenu.classList.toggle("open"); });
document.addEventListener("click", e => { if(!langMenu.contains(e.target) && e.target!==langBtn) langMenu.classList.remove("open"); });
langMenu.addEventListener("click", e => {
  const btn = e.target.closest("[data-lang]");
  if(!btn) return;
  currentLang = btn.dataset.lang;
  langMenu.classList.remove("open");
  renderAll();
});

document.getElementById("bottomNav").addEventListener("click", e => {
  const btn = e.target.closest("[data-action='toggleSearch']");
  if(!btn) return;
  e.preventDefault();
  const wrap = document.getElementById("searchWrap");
  wrap.classList.toggle("open");
  const input = document.getElementById("searchInput");
  if(wrap.classList.contains("open")) input.focus();
  else { input.value=""; renderCards(); }
});
document.getElementById("searchInput").addEventListener("input", e => renderCards(e.target.value));
</script>
