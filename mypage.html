<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account – All About Korea</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-functions.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA-qZfGlrEEAQRpl4KQzJmU7f4j1R0Usl8",
    authDomain: "all-about-korea-login.firebaseapp.com",
    projectId: "all-about-korea-login",
    storageBucket: "all-about-korea-login.firebasestorage.app",
    messagingSenderId: "20771155142",
    appId: "1:20771155142:web:bbfeb19541625e750cbbc7"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const functions = getFunctions(app);
  const cancelSubscription = httpsCallable(functions, "cancelSubscription");

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      location.href = "https://www.businesskorean.com/login.html?redirect=mypage.html";
      return;
    }

    document.getElementById('userEmail').textContent = user.email || '';

    const snap = await getDoc(doc(db, "users", user.uid));
    const data = snap.exists() ? snap.data() : {};
    renderStatus(data.subscriptionActive === true);

    document.getElementById('gate-loading').style.display = 'none';
    document.getElementById('gate-content').style.display = 'flex';

    document.getElementById('signOutBtn').addEventListener('click', async () => {
      await signOut(auth);
      location.href = "https://www.businesskorean.com/";
    });
  });

  function renderStatus(isActive) {
    const badge = document.getElementById('statusBadge');
    const cancelSection = document.getElementById('cancelSection');
    const subscribeSection = document.getElementById('subscribeSection');

    if (isActive) {
      badge.textContent = 'Active';
      badge.className = 'badge badge-active';
      cancelSection.style.display = 'block';
      subscribeSection.style.display = 'none';
    } else {
      badge.textContent = 'Not subscribed';
      badge.className = 'badge badge-inactive';
      cancelSection.style.display = 'none';
      subscribeSection.style.display = 'block';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    const cancelBtn = document.getElementById('cancelBtn');
    const confirmBox = document.getElementById('confirmBox');
    const confirmYes = document.getElementById('confirmYes');
    const confirmNo = document.getElementById('confirmNo');
    const cancelMsg = document.getElementById('cancelMsg');

    cancelBtn.addEventListener('click', () => {
      confirmBox.style.display = 'block';
      cancelBtn.style.display = 'none';
    });

    confirmNo.addEventListener('click', () => {
      confirmBox.style.display = 'none';
      cancelBtn.style.display = 'inline-flex';
    });

    confirmYes.addEventListener('click', async () => {
      confirmYes.disabled = true;
      confirmYes.textContent = 'Cancelling…';
      cancelMsg.style.display = 'none';
      try {
        await cancelSubscription();
        renderStatus(false);
        cancelMsg.textContent = 'Your subscription has been cancelled. You\u2019ll keep access until the current billing period ends.';
        cancelMsg.style.color = 'var(--gray)';
        cancelMsg.style.display = 'block';
        confirmBox.style.display = 'none';
      } catch (err) {
        console.error(err);
        cancelMsg.textContent = 'Something went wrong. Please try again or contact support.';
        cancelMsg.style.color = 'var(--coral)';
        cancelMsg.style.display = 'block';
        confirmYes.disabled = false;
        confirmYes.textContent = 'Yes, cancel';
      }
    });
  });
</script>

<style>
  :root{
    --ink:#222222; --gray:#6b6b6b; --gray-soft:#f7f7f7; --border:#e8e8e8;
    --blue:#3d5afe; --coral:#ff385c; --green:#1aa568; --green-soft:#e7f7ef; --coral-soft:#ffeef1;
    --white:#ffffff; --radius:16px; --radius-sm:10px;
    --shadow:0 6px 20px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;color:var(--ink);background:var(--gray-soft);}
  h1{font-family:'Poppins',sans-serif;margin:0;letter-spacing:-.01em;}
  a{color:inherit;text-decoration:none;}
  button{font:inherit;cursor:pointer;}

  .topbar{background:var(--white);border-bottom:1px solid var(--border);}
  .topbar-inner{max-width:1120px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;}
  .logo{font-family:'Poppins',sans-serif;font-weight:700;font-size:19px;color:var(--ink);}
  .logo span{color:var(--blue);}
  .signout{font-size:13px;font-weight:600;color:var(--gray);background:none;border:none;}
  .signout:hover{color:var(--ink);}

  #gate-loading{min-height:calc(100vh - 65px);display:flex;align-items:center;justify-content:center;color:var(--gray);font-size:14px;}
  #gate-content{display:none;min-height:calc(100vh - 65px);align-items:center;justify-content:center;padding:40px 20px;}

  .card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
        width:100%;max-width:440px;padding:36px 32px;}
  .card h1{font-size:20px;margin-bottom:4px;}
  .email{color:var(--gray);font-size:13px;margin:0 0 24px;}

  .status-row{display:flex;align-items:center;justify-content:space-between;background:var(--gray-soft);
        border-radius:var(--radius-sm);padding:16px 18px;margin-bottom:20px;}
  .status-label{font-size:13px;color:var(--gray);font-weight:600;}
  .badge{font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px;}
  .badge-active{background:var(--green-soft);color:var(--green);}
  .badge-inactive{background:var(--coral-soft);color:var(--coral);}

  .plan-name{font-size:14px;color:var(--ink);margin:0 0 20px;}
  .plan-name b{font-weight:700;}

  .btn{width:100%;padding:12px 16px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;border:none;}
  .btn-outline{background:var(--white);border:1px solid var(--border);color:var(--coral);}
  .btn-outline:hover{background:var(--coral-soft);}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:hover{opacity:.9;}

  #confirmBox{display:none;background:var(--coral-soft);border-radius:var(--radius-sm);padding:16px;margin-top:12px;}
  #confirmBox p{font-size:13px;color:var(--ink);margin:0 0 14px;line-height:1.5;}
  .confirm-actions{display:flex;gap:8px;}
  .confirm-actions button{flex:1;padding:10px;font-size:13px;font-weight:600;border-radius:8px;border:none;}
  #confirmYes{background:var(--coral);color:#fff;}
  #confirmYes:disabled{opacity:.6;}
  #confirmNo{background:var(--white);border:1px solid var(--border);color:var(--ink);}

  #cancelMsg{font-size:13px;margin-top:14px;display:none;line-height:1.5;}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="https://www.businesskorean.com/" class="logo">All About <span>Korea</span></a>
    <button class="signout" id="signOutBtn">Sign out</button>
  </div>
</header>

<div id="gate-loading">Loading…</div>

<div id="gate-content">
  <div class="card">
    <h1>My Account</h1>
    <p class="email" id="userEmail"></p>

    <div class="status-row">
      <span class="status-label">Subscription status</span>
      <span class="badge" id="statusBadge">—</span>
    </div>

    <div id="cancelSection">
      <p class="plan-name">Plan: <b>All About Korea Premium – $4.99/month</b></p>
      <button class="btn btn-outline" id="cancelBtn">Cancel Subscription</button>
      <div id="confirmBox">
        <p>Are you sure? You'll keep access until the end of your current billing period, then it won't renew.</p>
        <div class="confirm-actions">
          <button id="confirmNo">Keep my subscription</button>
          <button id="confirmYes">Yes, cancel</button>
        </div>
      </div>
    </div>

    <div id="subscribeSection" style="display:none;">
      <p class="plan-name">You don't have an active subscription.</p>
      <a href="https://www.businesskorean.com/payment.html"><button class="btn btn-primary">Subscribe – $4.99/month</button></a>
    </div>

    <p id="cancelMsg"></p>
  </div>
</div>


</body>
</html>
