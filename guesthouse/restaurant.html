<style>
  :root{
    --paper:#F7F1E4;
    --paper-card:#FFFDF7;
    --ink:#20281F;
    --ink-soft:#5B6156;
    --celadon:#5D7F63;
    --celadon-dark:#3F5A45;
    --ochre:#B5502E;
    --ochre-soft:#E9C7A9;
    --line:#DED2B4;
    --shadow: 2px 3px 0 rgba(32,40,31,0.06);
    --radius: 3px;
    --font-display: 'Fraunces', 'Noto Serif KR', ui-serif, Georgia, serif;
    --font-body: 'Inter', -apple-system, 'Noto Sans KR', 'Malgun Gothic', 'Hiragino Sans', 'Noto Sans SC', 'Noto Sans JP', sans-serif;
  }
  :root:not([data-theme="light"]){
    /* keep a single warm paper theme regardless of system scheme -- this is an editorial guide, not a UI surface */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--ochre-soft);}

  .wrap{
    max-width:920px;
    margin:0 auto;
    padding:0 24px 80px;
  }

  /* ---- Header ---- */
  header{
    padding:28px 0 20px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .mark{
    display:flex;
    align-items:baseline;
    gap:12px;
  }
  .mark svg{width:34px;height:34px;flex:none;transform:translateY(4px);}
  .titles h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:clamp(28px,4.4vw,40px);
    margin:0;
    letter-spacing:-0.01em;
    line-height:1.05;
  }
  .titles p{
    margin:6px 0 0;
    color:var(--ink-soft);
    font-size:14.5px;
    max-width:46ch;
  }
  .header-actions{
    display:flex;
    align-items:center;
    gap:10px;
    flex:none;
  }

  /* language select */
  .lang-select{
    position:relative;
  }
  .lang-select select{
    appearance:none;
    -webkit-appearance:none;
    font-family:var(--font-body);
    font-weight:600;
    font-size:13.5px;
    background:var(--paper-card);
    border:1px solid var(--ink);
    color:var(--ink);
    padding:9px 30px 9px 14px;
    border-radius:20px;
    cursor:pointer;
  }
  .lang-select::after{
    content:"";
    position:absolute;
    right:13px;
    top:50%;
    width:7px;height:7px;
    border-right:1.5px solid var(--ink);
    border-bottom:1.5px solid var(--ink);
    transform:translateY(-65%) rotate(45deg);
    pointer-events:none;
  }
  select:focus-visible, button:focus-visible, a:focus-visible{
    outline:2px solid var(--celadon-dark);
    outline-offset:2px;
  }

  /* ---- District sections ---- */
  .district{
    margin-top:36px;
  }
  main{display:block;margin-top:28px;}
  .district-head{
    display:flex;
    align-items:baseline;
    gap:14px;
    border-bottom:2px solid var(--ink);
    padding-bottom:10px;
    margin-bottom:20px;
  }
  .district-head h2{
    font-family:var(--font-display);
    font-weight:600;
    font-size:23px;
    margin:0;
  }
  .district-count{
    color:var(--ink-soft);
    font-size:13px;
    white-space:nowrap;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
  }
  @media (max-width:640px){
    .grid{grid-template-columns:1fr;}
  }

  .card{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 18px 16px;
    box-shadow:var(--shadow);
  }
  .card-top{
    display:flex;
    gap:10px;
    align-items:flex-start;
  }
  .stamp{
    flex:none;
    width:30px;height:30px;
    border-radius:50%;
    border:1.5px solid var(--ochre);
    color:var(--ochre);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);
    font-size:13px;
    font-weight:600;
    transform:rotate(-6deg);
  }
  .card h3{
    font-family:var(--font-display);
    font-size:18px;
    font-weight:600;
    margin:0;
    line-height:1.25;
  }
  .card .dishes{
    margin:10px 0 12px;
    font-size:14px;
    color:var(--ink);
  }
  .card-bottom{
    display:flex;
    flex-direction:column;
    gap:4px;
    border-top:1px dashed var(--line);
    padding-top:10px;
  }
  .price{
    font-size:13px;
    font-weight:600;
    color:var(--celadon-dark);
  }
  .address{
    font-size:12px;
    color:var(--ink-soft);
    text-align:left;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>

let currentLang = "en";

function render(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  const t = i18n[lang];

  document.getElementById("t-title").textContent = t.title;
  document.getElementById("t-subtitle").textContent = t.subtitle;
  document.title = t.title;

  const districtsEl = document.getElementById("districts");
  districtsEl.innerHTML = "";

  for(let d=1; d<=5; d++){
    const items = restaurants.filter(r => r.d === d);
    const section = document.createElement("section");
    section.className = "district";

    const head = document.createElement("div");
    head.className = "district-head";
    head.innerHTML = `<h2>${districtNames[lang][d-1]}</h2><span class="district-count">${t.count(items.length)}</span>`;
    section.appendChild(head);

    const grid = document.createElement("div");
    grid.className = "grid";

    items.forEach(r => {
      const card = document.createElement("article");
      card.className = "card";
      const initial = r.name.trim().charAt(0);
      card.innerHTML = `
        <div class="card-top">
          <div class="stamp" aria-hidden="true">${initial}</div>
          <h3>${r.name}</h3>
        </div>
        <div class="dishes">${r.dishes[lang]}</div>
        <div class="card-bottom">
          <span class="price">${t.priceLabel}: ${r.price}</span>
          <span class="address">${t.addrLabel}: ${r.addr}</span>
        </div>`;
      grid.appendChild(card);
    });

    section.appendChild(grid);
    districtsEl.appendChild(section);
  }
}

function buildLangPicker(){
  const sel = document.getElementById("langPicker");
  Object.keys(i18n).forEach(code=>{
    const opt = document.createElement("option");
    opt.value = code;
    opt.textContent = i18n[code].langName;
    sel.appendChild(opt);
  });
  sel.value = currentLang;
  sel.addEventListener("change", e => render(e.target.value));
}

buildLangPicker();
render(currentLang);
