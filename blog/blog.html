ehe im Park in der Nähe meines Hauses etwa 30 Minuten joggen. Es kostet nichts und die frische Luft macht mich erfrischt.","fr":"Non, je vais courir environ 30 minutes dans le parc près de chez moi. C'est gratuit et l'air frais me donne une sensation de fraîcheur.","es":"No, voy a correr unos 30 minutos al parque cerca de mi casa. No cuesta nada y el aire fresco me hace sentir renovada.","pl":"Nie, biegnę około 30 minut w parku niedaleko mojego domu. To bezpłatne, a świeże powietrze sprawia, że czuję się odświeżona.","it":"No, vado a fare jogging per circa 30 minuti nel parco vicino a casa mia. Non costa niente e l'aria fresca mi fa sentire rinfrescata.","sv":"Nej, jag joggar i ungefär 30 minuter i parken nära mitt hus. Det kostar inget och den friska luften gör att jag känner mig uppfräschad.","fi":"Ei, juoksen noin 30 minuuttia kodin lähellä olevassa puistossa. Se ei maksa mitään ja raitis ilma saa minut tuntumaan virkeältä.","ja":"ううん、家の近くの公園で30分くらいジョギングをしているよ。お金もかからないし空気もいいから気分が爽やかになるんだ。","zh-CN":"不，我在家附近的公园慢跑大约30分钟。不用花钱，而且新鲜空气让我感觉神清气爽。"}},{"speaker":"지원","text":"식단도 신경 써? 요즘 다이어트 때문에 고민이 많거든.","trans":{"en":"Do you also watch your diet? I've been worrying a lot about my weight lately.","de":"Achtest du auch auf deine Ernährung? Ich mache mir in letzter Zeit wegen meiner Figur viele Gedanken.","fr":"Tu fais aussi attention à ton alimentation ? Ces derniers temps, je me préoccupe beaucoup de mon poids.","es":"¿También cuidas tu dieta? Últimamente me preocupo mucho por mi peso.","pl":"Czy też dbasz o dietę? Ostatnio bardzo martwię się o swoją wagę.","it":"Ti preoccupi anche dell'alimentazione? Ultimamente mi preoccupo molto per il mio peso.","sv":"Tänker du också på kosten? Jag har oroat mig mycket för min vikt på sistone.","fi":"Huolehditko myös ruokavaliosta? Olen viime aikoina ollut paljon huolissani painostani.","ja":"食事も気をつけているの？最近ダイエットのことで悩みが多いんだけど。","zh-CN":"你也注意饮食吗？我最近为减肥烦恼了很多。"}},{"speaker":"수민","text":"응, 인스턴트 음식은 줄이고 채소랑 과일을 많이 먹으려고 노력해. 그리고 물을 하루에 2리터 이상 마시는 게 정말 도움이 돼.","trans":{"en":"Yes, I try to cut down on instant food and eat more vegetables and fruit. And drinking at least 2 liters of water a day really helps.","de":"Ja, ich versuche, Fertiggerichte zu reduzieren und mehr Gemüse und Obst zu essen. Und mindestens 2 Liter Wasser pro Tag zu trinken hilft wirklich sehr.","fr":"Oui, j'essaie de réduire les aliments instantanés et de manger plus de légumes et de fruits. Et boire au moins 2 litres d'eau par jour aide vraiment beaucoup.","es":"Sí, intento reducir la comida instantánea y comer más verduras y frutas. Y beber al menos 2 litros de agua al día realmente ayuda.","pl":"Tak, staram się ograniczać jedzenie instant i jeść więcej warzyw i owoców. I picie co najmniej 2 litrów wody dziennie naprawdę pomaga.","it":"Sì, cerco di ridurre i cibi istantanei e di mangiare più verdure e frutta. E bere almeno 2 litri d'acqua al giorno aiuta davvero molto.","sv":"Ja, jag försöker minska på snabbmat och äta mer grönsaker och frukt. Och att dricka minst 2 liter vatten om dagen hjälper verkligen.","fi":"Kyllä, yritän vähentää pikaruokaa ja syödä enemmän vihanneksia ja hedelmiä. Ja vähintään 2 litran vesimäärä päivässä auttaa todella paljon.","ja":"うん、インスタント食品を減らして野菜と果物をたくさん食べるように頑張っているよ。それと1日2リットル以上水を飲むのが本当に助けになるよ。","zh-CN":"是的，我尽量减少速食，多吃蔬菜和水果。另外，每天喝至少2升水真的很有帮助。"}},{"speaker":"지원","text":"좋은 팁이다! 나도 작은 것부터 시작해 봐야겠어. 스트레스 관리는 어떻게 해?","trans":{"en":"Great tips! I should try starting with small things too. How do you manage stress?","de":"Tolle Tipps! Ich sollte auch mit kleinen Dingen anfangen. Wie gehst du mit Stress um?","fr":"Super conseils ! Je devrais aussi commencer par de petites choses. Comment gères-tu le stress ?","es":"¡Buenos consejos! Yo también debería empezar por pequeñas cosas. ¿Cómo manejas el estrés?","pl":"Świetne wskazówki! Też powinnam zacząć od małych rzeczy. Jak radzisz sobie ze stresem?","it":"Ottimi consigli! Dovrei anch'io provare a iniziare con le piccole cose. Come gestisci lo stress?","sv":"Bra tips! Jag borde också försöka börja med de små sakerna. Hur hanterar du stress?","fi":"Hienoja vinkkejä! Minunkin pitäisi aloittaa pienistä asioista. Miten hallitset stressiä?","ja":"いいヒントだね！私も小さなことから始めてみないとね。ストレス管理はどうしているの？","zh-CN":"好建议！我也应该从小事开始尝试。你如何管理压力？"}},{"speaker":"수민","text":"자기 전에 10분 정도 명상을 하거나 일기를 써. 그러면 머리가 맑아지고 잠도 잘 자게 되더라고.","trans":{"en":"Before going to sleep, I meditate for about 10 minutes or write in my journal. That clears my head and helps me sleep well.","de":"Vor dem Schlafen meditiere ich etwa 10 Minuten oder schreibe Tagebuch. Das klärt meinen Kopf und hilft mir, gut zu schlafen.","fr":"Avant de dormir, je médite environ 10 minutes ou j'écris dans mon journal. Ça éclaircit mon esprit et m'aide à bien dormir.","es":"Antes de dormir, medito unos 10 minutos o escribo en mi diario. Eso despeja mi mente y me ayuda a dormir bien.","pl":"Przed snem medytuję około 10 minut lub piszę w dzienniku. To oczyszcza moją głowę i pomaga mi dobrze spać.","it":"Prima di dormire, medito per circa 10 minuti o scrivo nel mio diario. Questo schiarisce la mia mente e mi aiuta a dormire bene.","sv":"Innan jag sover mediterar jag i ungefär 10 minuter eller skriver dagbok. Det rensar mitt huvud och hjälper mig att sova bra.","fi":"Ennen nukkumaanmenoa meditoin noin 10 minuuttia tai kirjoitan päiväkirjaa. Se selkeyttää pääni ja auttaa minua nukkumaan hyvin.","ja":"寝る前に10分くらい瞑想をするか日記を書くよ。そうすると頭がすっきりして、よく眠れるようになるんだ。","zh-CN":"睡前我会冥想大约10分钟或写日记。这样头脑会变得清晰，睡眠也会变好。"}}],"vocab":[{"word":"생활 습관","trans":{"en":"lifestyle habit","de":"Lebensgewohnheit","fr":"habitude de vie","es":"hábito de vida","pl":"nawyk życiowy","it":"abitudine di vita","sv":"levnadsvana","fi":"elämäntapa","ja":"生活習慣","zh-CN":"生活习惯"}},{"word":"규칙적인","trans":{"en":"regular / consistent","de":"regelmäßig","fr":"régulier","es":"regular","pl":"regularny","it":"regolare","sv":"regelbunden","fi":"säännöllinen","ja":"規則正しい","zh-CN":"规律的"}},{"word":"조깅","trans":{"en":"jogging","de":"Joggen","fr":"jogging","es":"trotar / hacer jogging","pl":"jogging","it":"jogging","sv":"jogging","fi":"lenkkeily","ja":"ジョギング","zh-CN":"慢跑"}},{"word":"상쾌하다","trans":{"en":"to feel refreshed","de":"erfrischend sein","fr":"se sentir rafraîchi","es":"sentirse fresco / renovado","pl":"czuć się odświeżonym","it":"sentirsi rinfrescato","sv":"känna sig uppfräschad","fi":"tuntua virkeältä","ja":"爽やかだ","zh-CN":"神清气爽"}},{"word":"인스턴트 음식","trans":{"en":"instant food / processed food","de":"Fertiggerichte / Instantnahrung","fr":"aliments instantanés","es":"comida instantánea","pl":"jedzenie instant","it":"cibi istantanei","sv":"snabbmat","fi":"pikaruoka","ja":"インスタント食品","zh-CN":"速食食品"}},{"word":"명상","trans":{"en":"meditation","de":"Meditation","fr":"méditation","es":"meditación","pl":"medytacja","it":"meditazione","sv":"meditation","fi":"meditaatio","ja":"瞑想","zh-CN":"冥想"}},{"word":"스트레스 관리","trans":{"en":"stress management","de":"Stressbewältigung","fr":"gestion du stress","es":"manejo del estrés","pl":"zarządzanie stresem","it":"gestione dello stress","sv":"stresshantering","fi":"stressinhallinta","ja":"ストレス管理","zh-CN":"压力管理"}},{"word":"채소","trans":{"en":"vegetables","de":"Gemüse","fr":"légumes","es":"verduras","pl":"warzywa","it":"verdure","sv":"grönsaker","fi":"vihannekset","ja":"野菜","zh-CN":"蔬菜"}}],"patterns":[{"pattern":"-으려고 노력하다","patternTrans":{"en":"to try/make an effort to do something","de":"sich bemühen, etwas zu tun","fr":"essayer / faire des efforts pour faire quelque chose","es":"esforzarse por hacer algo","pl":"starać się coś zrobić","it":"cercare di fare qualcosa / sforzarsi di fare qualcosa","sv":"försöka göra något / anstränga sig för att göra något","fi":"yrittää / nähdä vaivaa tehdäkseen jotain","ja":"〜しようと努力する","zh-CN":"努力做某事"},"example":"채소랑 과일을 많이 먹으려고 노력해.","trans":{"en":"I try to eat a lot of vegetables and fruit.","de":"Ich bemühe mich, viel Gemüse und Obst zu essen.","fr":"J'essaie de manger beaucoup de légumes et de fruits.","es":"Me esfuerzo por comer muchas verduras y frutas.","pl":"Staram się jeść dużo warzyw i owoców.","it":"Cerco di mangiare molte verdure e frutta.","sv":"Jag försöker äta mycket grönsaker och frukt.","fi":"Yritän syödä paljon vihanneksia ja hedelmiä.","ja":"野菜と果物をたくさん食べるように努力しているよ。","zh-CN":"我努力多吃蔬菜和水果。"}},{"pattern":"-는 게 도움이 되다","patternTrans":{"en":"doing (something) is helpful","de":"etwas zu tun, ist hilfreich","fr":"faire (quelque chose) est utile / aide","es":"hacer (algo) ayuda / es útil","pl":"robienie (czegoś) jest pomocne","it":"fare (qualcosa) è utile","sv":"att göra (något) är till hjälp","fi":"jonkin tekeminen on avuksi","ja":"〜することが助けになる","zh-CN":"做（某事）是有帮助的"},"example":"물을 하루에 2리터 이상 마시는 게 정말 도움이 돼.","trans":{"en":"Drinking more than 2 liters of water a day really helps.","de":"Es hilft wirklich, täglich mehr als 2 Liter Wasser zu trinken.","fr":"Boire plus de 2 litres d'eau par jour aide vraiment.","es":"Beber más de 2 litros de agua al día realmente ayuda.","pl":"Picie ponad 2 litrów wody dziennie naprawdę pomaga.","it":"Bere più di 2 litri d'acqua al giorno aiuta davvero.","sv":"Att dricka mer än 2 liter vatten om dagen hjälper verkligen.","fi":"Yli 2 litran juominen päivässä todella auttaa.","ja":"1日2リットル以上水を飲むのが本当に助けになるよ。","zh-CN":"每天喝超过2升水真的很有帮助。"}},{"pattern":"-(으)면 -아/어지다","patternTrans":{"en":"if you do X, Y becomes/gets (a state change result)","de":"wenn man X tut, wird Y (Zustandsveränderung)","fr":"si on fait X, Y devient (résultat de changement d'état)","es":"si haces X, Y se vuelve (resultado de cambio de estado)","pl":"jeśli zrobisz X, Y staje się (wynik zmiany stanu)","it":"se fai X, Y diventa (risultato di un cambiamento di stato)","sv":"om du gör X, blir Y (tillståndsändring)","fi":"jos teet X:n, Y:stä tulee (tilamuutos)","ja":"〜すると、〜になる（状態変化の結果）","zh-CN":"如果做X，Y就会变得（状态变化结果）"},"example":"명상을 하면 머리가 맑아지고 잠도 잘 자게 되더라고.","trans":{"en":"If you meditate, your mind becomes clear and you sleep better.","de":"Wenn man meditiert, wird der Kopf klar und man schläft besser.","fr":"Si tu médites, ton esprit s'éclaircit et tu dors mieux.","es":"Si meditas, tu mente se aclara y duermes mejor.","pl":"Jeśli medytujesz, twój umysł się oczyszcza i śpisz lepiej.","it":"Se mediti, la mente si schiarisce e dormi meglio.","sv":"Om du mediterar, klarnar ditt sinne och du sover bättre.","fi":"Jos meditoit, pääsi selkenee ja nukut paremmin.","ja":"瞑想をすると、頭が澄んでよく眠れるようになるよ。","zh-CN":"如果冥想，头脑会变得清晰，睡眠也会变好。"}}],"quizzes":[{"type":"이해","questionAudio":"수민은 매일 아침 몇 시에 일어납니까?","questionTrans":{"en":"What time does Sumin wake up every morning?","de":"Um wie viel Uhr steht Sumin jeden Morgen auf?","fr":"À quelle heure Sumin se lève-t-elle chaque matin ?","es":"¿A qué hora se despierta Sumin cada mañana?","pl":"O której godzinie Sumin wstaje każdego ranka?","it":"A che ora si sveglia Sumin ogni mattina?","sv":"Hur dags vaknar Sumin varje morgon?","fi":"Mihin aikaan Sumin herää joka aamu?","ja":"スミンは毎朝何時に起きますか？","zh-CN":"秀敏每天早上几点起床？"},"options":[{"text":"5시","trans":{"en":"5 o'clock","de":"5 Uhr","fr":"5 heures","es":"las 5","pl":"5 rano","it":"le 5","sv":"klockan 5","fi":"kello 5","ja":"5時","zh-CN":"5点"}},{"text":"6시","trans":{"en":"6 o'clock","de":"6 Uhr","fr":"6 heures","es":"las 6","pl":"6 rano","it":"le 6","sv":"klockan 6","fi":"kello 6","ja":"6時","zh-CN":"6点"}},{"text":"7시","trans":{"en":"7 o'clock","de":"7 Uhr","fr":"7 heures","es":"las 7","pl":"7 rano","it":"le 7","sv":"klockan 7","fi":"kello 7","ja":"7時","zh-CN":"7点"}},{"text":"8시","trans":{"en":"8 o'clock","de":"8 Uhr","fr":"8 heures","es":"las 8","pl":"8 rano","it":"le 8","sv":"klockan 8","fi":"kello 8","ja":"8時","zh-CN":"8点"}}],"answer":1,"explanation":"수민은 매일 아침 6시에 일어나서 운동을 한다고 했습니다."},{"type":"이해","questionAudio":"수민이 주로 하는 운동은 무엇입니까?","questionTrans":{"en":"What exercise does Sumin mainly do?","de":"Welchen Sport macht Sumin hauptsächlich?","fr":"Quel exercice Sumin fait-elle principalement ?","es":"¿Qué ejercicio hace principalmente Sumin?","pl":"Jakie ćwiczenia głównie wykonuje Sumin?","it":"Quale esercizio fa principalmente Sumin?","sv":"Vad tränar Sumin mest?","fi":"Mitä liikuntaa Sumin harrastaa pääasiassa?","ja":"スミンが主にしている運動は何ですか？","zh-CN":"秀敏主要做什么运动？"},"options":[{"text":"헬스장에서 운동","trans":{"en":"Working out at the gym","de":"Training im Fitnessstudio","fr":"Faire de l'exercice en salle de sport","es":"Ejercitarse en el gimnasio","pl":"Ćwiczenia na siłowni","it":"Allenarsi in palestra","sv":"Träna på gymmet","fi":"Harjoittelu kuntosalilla","ja":"ジムでのトレーニング","zh-CN":"在健身房锻炼"}},{"text":"수영","trans":{"en":"Swimming","de":"Schwimmen","fr":"Natation","es":"Natación","pl":"Pływanie","it":"Nuoto","sv":"Simning","fi":"Uinti","ja":"水泳","zh-CN":"游泳"}},{"text":"공원에서 조깅","trans":{"en":"Jogging at the park","de":"Joggen im Park","fr":"Courir dans le parc","es":"Trotar en el parque","pl":"Jogging w parku","it":"Jogging nel parco","sv":"Jogga i parken","fi":"Lenkkeily puistossa","ja":"公園でのジョギング","zh-CN":"在公园慢跑"}},{"text":"자전거 타기","trans":{"en":"Cycling","de":"Radfahren","fr":"Faire du vélo","es":"Andar en bicicleta","pl":"Jazda na rowerze","it":"Andare in bicicletta","sv":"Cykla","fi":"Pyöräily","ja":"自転車に乗る","zh-CN":"骑自行车"}}],"answer":2,"explanation":"수민은 집 근처 공원에서 30분 정도 조깅을 한다고 했습니다."},{"type":"이해","questionAudio":"수민은 잠자기 전에 무엇을 합니까?","questionTrans":{"en":"What does Sumin do before going to sleep?","de":"Was macht Sumin vor dem Schlafen?","fr":"Qu'est-ce que Sumin fait avant de dormir ?","es":"¿Qué hace Sumin antes de dormir?","pl":"Co Sumin robi przed snem?","it":"Cosa fa Sumin prima di dormire?","sv":"Vad gör Sumin innan hon sover?","fi":"Mitä Sumin tekee ennen nukkumaanmenoa?","ja":"スミンは寝る前に何をしますか？","zh-CN":"秀敏睡前做什么？"},"options":[{"text":"TV를 본다","trans":{"en":"Watches TV","de":"Schaut fern","fr":"Regarde la télé","es":"Ve la televisión","pl":"Ogląda telewizję","it":"Guarda la TV","sv":"Tittar på TV","fi":"Katsoo televisiota","ja":"テレビを観る","zh-CN":"看电视"}},{"text":"스트레칭을 한다","trans":{"en":"Does stretching","de":"Macht Dehnübungen","fr":"Fait des étirements","es":"Hace estiramientos","pl":"Robi rozciąganie","it":"Fa stretching","sv":"Stretchar","fi":"Venyttelee","ja":"ストレッチをする","zh-CN":"做伸展运动"}},{"text":"명상이나 일기 쓰기","trans":{"en":"Meditation or writing in a journal","de":"Meditation oder Tagebuch schreiben","fr":"Méditation ou écriture dans un journal","es":"Meditación o escritura en un diario","pl":"Medytacja lub pisanie w dzienniku","it":"Meditazione o scrittura nel diario","sv":"Meditation eller dagboksskrivande","fi":"Meditaatio tai päiväkirjan kirjoittaminen","ja":"瞑想または日記を書く","zh-CN":"冥想或写日记"}},{"text":"독서를 한다","trans":{"en":"Reads a book","de":"Liest ein Buch","fr":"Lit un livre","es":"Lee un libro","pl":"Czyta książkę","it":"Legge un libro","sv":"Läser en bok","fi":"Lukee kirjaa","ja":"読書をする","zh-CN":"读书"}}],"answer":2,"explanation":"수민은 자기 전에 10분 정도 명상을 하거나 일기를 쓴다고 했습니다."}]},
  26: {"id":26,"title":"취업 준비","titleTrans":{"en":"Job Preparation","de":"Jobvorbereitung","fr":"Préparation à l'emploi","es":"Preparación para el empleo","pl":"Przygotowanie do pracy","it":"Preparazione al lavoro","sv":"Jobbförberedelse","fi":"Työnhakuvalmistelu","ja":"就職準備","zh-CN":"求职准备"},"desc":"이력서 작성과 면접 준비에 대해 이야기하는 대화","descTrans":{"en":"Talk about writing a resume and preparing for an interview","de":"Über das Schreiben eines Lebenslaufs und die Vorbereitung auf ein Vorstellungsgespräch sprechen","fr":"Parler de la rédaction d'un CV et de la préparation à un entretien","es":"Hablar sobre cómo redactar un currículum y prepararse para una entrevista","pl":"Rozmawianie o pisaniu CV i przygotowaniu do rozmowy kwalifikacyjnej","it":"Parlare di come scrivere un curriculum e prepararsi per un colloquio","sv":"Prata om att skriva ett CV och förbereda sig för en jobbintervju","fi":"Puhua ansioluettelon kirjoittamisesta ja haastatteluun valmistautumisesta","ja":"履歴書の書き方と面接の準備について話す","zh-CN":"谈论写简历和准备面试的方法"},"dialogue":[{"speaker":"태준","text":"민지야, 요즘 취업 준비는 어떻게 되고 있어? 많이 힘들지?","trans":{"en":"Minji, how is your job search preparation going these days? Is it hard?","de":"Minji, wie läuft deine Jobsuche zurzeit? Ist es schwer?","fr":"Minji, comment se passe ta préparation à la recherche d'emploi ces derniers temps ? C'est difficile ?","es":"Minji, ¿cómo va tu preparación para la búsqueda de empleo últimamente? ¿Es difícil?","pl":"Minji, jak idzie przygotowanie do szukania pracy? Czy jest trudno?","it":"Minji, come sta andando la tua preparazione per la ricerca di lavoro? È difficile?","sv":"Minji, hur går det med din jobbsökning på sistone? Är det svårt?","fi":"Minji, miten työnhakuvalmistelusi edistyy viime aikoina? Onko se vaikeaa?","ja":"ミンジ、最近就職準備はどうなっている？大変じゃない？","zh-CN":"敏智，你最近求职准备进展怎么样？很辛苦吧？"}},{"speaker":"민지","text":"응, 생각보다 할 게 너무 많아. 이력서도 써야 하고 자기소개서도 준비해야 하고.","trans":{"en":"Yes, there's so much more to do than I expected. I have to write a resume and also prepare a cover letter.","de":"Ja, es ist viel mehr zu tun als ich erwartet hatte. Ich muss einen Lebenslauf und auch ein Anschreiben vorbereiten.","fr":"Oui, il y a beaucoup plus à faire que ce que j'espérais. Je dois rédiger un CV et aussi préparer une lettre de motivation.","es":"Sí, hay mucho más que hacer de lo que esperaba. Tengo que escribir un currículum y también preparar una carta de presentación.","pl":"Tak, jest o wiele więcej do zrobienia niż myślałam. Muszę napisać CV, a także przygotować list motywacyjny.","it":"Sì, c'è molto più da fare di quanto pensassi. Devo scrivere un curriculum e preparare anche una lettera di presentazione.","sv":"Ja, det är mycket mer att göra än jag förväntade mig. Jag måste skriva ett CV och också förbereda ett personligt brev.","fi":"Kyllä, on paljon enemmän tehtävää kuin odotin. Minun täytyy kirjoittaa ansioluettelo ja valmistella myös saatekirje.","ja":"うん、思ったよりやることがたくさんあって。履歴書も書かないといけないし、自己紹介書も準備しないといけないし。","zh-CN":"是的，要做的事情比我想象的多得多。要写简历，还要准备自我介绍信。"}},{"speaker":"태준","text":"이력서는 어느 정도 됐어? 취업 포털 사이트에 올려봤어?","trans":{"en":"How far along is your resume? Have you uploaded it to a job portal website?","de":"Wie weit ist dein Lebenslauf? Hast du ihn schon auf ein Jobportal hochgeladen?","fr":"Ton CV est prêt dans quelle mesure ? Tu l'as mis en ligne sur un site de recrutement ?","es":"¿Qué tan avanzado está tu currículum? ¿Lo has subido a un portal de empleo?","pl":"Jak daleko jest twoje CV? Czy wgrałaś je na portal pracy?","it":"Quanto è avanzato il tuo curriculum? L'hai già caricato su un portale di lavoro?","sv":"Hur långt kommen är ditt CV? Har du laddat upp det på en jobbportal?","fi":"Kuinka pitkällä ansioluettelosi on? Oletko ladannut sen työnhakuportaaliin?","ja":"履歴書はどのくらいできている？就活ポータルサイトにアップロードしてみた？","zh-CN":"简历写到什么程度了？你有没有上传到招聘网站？"}},{"speaker":"민지","text":"이력서는 거의 다 썼는데 자기소개서가 문제야. 어떻게 써야 할지 잘 모르겠어.","trans":{"en":"I've almost finished the resume, but the cover letter is the problem. I'm not sure how to write it.","de":"Den Lebenslauf habe ich fast fertig, aber das Anschreiben ist das Problem. Ich weiß nicht, wie ich es schreiben soll.","fr":"J'ai presque terminé mon CV, mais la lettre de motivation est le problème. Je ne sais pas trop comment la rédiger.","es":"El currículum ya casi está listo, pero la carta de presentación es el problema. No sé bien cómo escribirla.","pl":"Prawie skończyłam CV, ale list motywacyjny jest problemem. Nie wiem, jak go napisać.","it":"Ho quasi finito il curriculum, ma la lettera di presentazione è il problema. Non so bene come scriverla.","sv":"Jag har nästan avslutat mitt CV, men det personliga brevet är problemet. Jag vet inte riktigt hur jag ska skriva det.","fi":"Ansioluettelo on melkein valmis, mutta saatekirje on ongelma. En oikein tiedä miten kirjoittaa sen.","ja":"履歴書はほぼ書き終えたけど、自己紹介書が問題なんだ。どうやって書けばいいかよくわからなくて。","zh-CN":"简历已经快写完了，但自我介绍信是个问题。我不太知道怎么写。"}},{"speaker":"태준","text":"자기소개서는 자신의 경험과 강점을 구체적으로 쓰는 게 중요해. 그냥 막연하게 쓰면 안 돼.","trans":{"en":"For the cover letter, it's important to write about your experiences and strengths specifically. You shouldn't write it vaguely.","de":"Beim Anschreiben ist es wichtig, konkret über deine Erfahrungen und Stärken zu schreiben. Du solltest nicht vage schreiben.","fr":"Pour la lettre de motivation, il est important d'écrire concrètement sur tes expériences et tes points forts. Tu ne dois pas écrire de manière vague.","es":"Para la carta de presentación, es importante escribir de manera concreta sobre tus experiencias y fortalezas. No debes escribir de forma vaga.","pl":"W liście motywacyjnym ważne jest konkretne pisanie o swoich doświadczeniach i mocnych stronach. Nie powinna pisać go ogólnikowo.","it":"Per la lettera di presentazione, è importante scrivere in modo concreto sulle proprie esperienze e punti di forza. Non bisogna scriverla in modo vago.","sv":"I det personliga brevet är det viktigt att skriva konkret om dina erfarenheter och styrkor. Du bör inte skriva det vagt.","fi":"Saatekirjeessä on tärkeää kirjoittaa konkreettisesti kokemuksistasi ja vahvuuksistasi. Sinun ei pidä kirjoittaa sitä epämääräisesti.","ja":"自己紹介書は自分の経験と強みを具体的に書くことが大切だよ。漠然と書いてはいけないよ。","zh-CN":"自我介绍信重要的是具体写出自己的经历和优势。不能写得模糊不清。"}},{"speaker":"민지","text":"그렇구나. 그러면 면접 준비는 어떻게 해야 할까? 면접이 제일 긴장돼.","trans":{"en":"I see. Then how should I prepare for the interview? I'm most nervous about the interview.","de":"Ich verstehe. Wie soll ich mich dann auf das Vorstellungsgespräch vorbereiten? Das Interview ist das, worüber ich am nervösesten bin.","fr":"Je vois. Alors, comment me préparer pour l'entretien ? C'est l'entretien qui me rend le plus nerveux.","es":"Ya veo. Entonces, ¿cómo debería prepararme para la entrevista? La entrevista es lo que más me pone nervioso.","pl":"Rozumiem. To jak mam się przygotować do rozmowy kwalifikacyjnej? Rozmowa jest tym, co najbardziej mnie denerwuje.","it":"Capisco. Allora come dovrei prepararmi per il colloquio? Il colloquio è quello che mi mette più in ansia.","sv":"Jag förstår. Hur ska jag då förbereda mig för intervjun? Det är intervjun jag är mest nervös inför.","fi":"Ymmärrän. Miten sitten pitäisi valmistautua haastatteluun? Haastattelu jännittää eniten.","ja":"そうなんだ。じゃあ面接の準備はどうすればいいの？面接が一番緊張するんだけど。","zh-CN":"原来如此。那么面试应该怎么准备呢？面试是最让我紧张的。"}},{"speaker":"태준","text":"먼저 지원하는 회사에 대해 충분히 조사하는 게 필요해. 회사의 비전이나 최근 뉴스를 파악해 둬.","trans":{"en":"First, you need to thoroughly research the company you're applying to. Get to know the company's vision and recent news.","de":"Zunächst musst du das Unternehmen, bei dem du dich bewirbst, gründlich recherchieren. Mach dich mit der Vision und den aktuellen Nachrichten des Unternehmens vertraut.","fr":"D'abord, tu dois faire des recherches approfondies sur l'entreprise à laquelle tu postules. Informe-toi sur la vision de l'entreprise et ses actualités récentes.","es":"Primero, necesitas investigar a fondo la empresa a la que te postulas. Familiarízate con la visión de la empresa y sus noticias recientes.","pl":"Po pierwsze, musisz dokładnie zbadać firmę, do której aplikujesz. Zapoznaj się z wizją firmy i najnowszymi wiadomościami.","it":"Prima di tutto, devi fare ricerche approfondite sull'azienda a cui ti candidi. Devi conoscere la visione aziendale e le notizie recenti.","sv":"Först och främst måste du göra grundlig research om företaget du söker till. Bekanta dig med företagets vision och senaste nyheter.","fi":"Ensinnäkin sinun täytyy tutkia huolellisesti yritystä, johon haet töitä. Ota selvää yrityksen visiosta ja viimeisimmistä uutisista.","ja":"まず、応募する会社について十分に調べることが必要だよ。会社のビジョンや最近のニュースを把握しておいてね。","zh-CN":"首先，需要充分了解你要申请的公司。了解公司的愿景和最近的新闻。"}},{"speaker":"민지","text":"예상 질문에 대한 답변도 미리 준비해야겠지?","trans":{"en":"I should also prepare answers to expected questions in advance, right?","de":"Ich sollte auch im Voraus Antworten auf zu erwartende Fragen vorbereiten, oder?","fr":"Je devrais aussi préparer des réponses aux questions attendues à l'avance, non ?","es":"También debería preparar respuestas a las preguntas esperadas con anticipación, ¿verdad?","pl":"Powinam też z wyprzedzeniem przygotować odpowiedzi na oczekiwane pytania, prawda?","it":"Dovrei anche preparare in anticipo le risposte alle domande attese, vero?","sv":"Jag borde också förbereda svar på förväntade frågor i förväg, eller hur?","fi":"Minun pitäisi myös valmistella vastauksia odotettavissa oleviin kysymyksiin etukäteen, eikö niin?","ja":"予想される質問への回答も事前に準備しておかないといけないよね？","zh-CN":"我也应该提前准备预期问题的答案，对吧？"}},{"speaker":"태준","text":"물론이지. 특히 '지원 동기'나 '입사 후 포부' 같은 질문은 꼭 미리 연습해 봐. 그리고 친구한테 모의 면접을 부탁해도 좋아.","trans":{"en":"Of course. Especially practice in advance for questions like 'Why do you want to join us?' or 'What are your goals after joining?' And you can also ask a friend for a mock interview.","de":"Natürlich. Übe vor allem im Voraus Fragen wie 'Warum möchtest du bei uns arbeiten?' oder 'Was sind deine Ziele nach dem Einstieg?' Und du kannst auch einen Freund um ein Vorstellungsgesprächs-Rollenspiel bitten.","fr":"Bien sûr. Entraîne-toi surtout à l'avance pour des questions comme 'Pourquoi voulez-vous nous rejoindre ?' ou 'Quels sont vos objectifs après votre intégration ?' Tu peux aussi demander à un ami un entretien simulé.","es":"Por supuesto. Especialmente practica con anticipación preguntas como '¿Por qué quieres unirte a nosotros?' o '¿Cuáles son tus metas después de unirte?' Y también puedes pedirle a un amigo una entrevista de práctica.","pl":"Oczywiście. Zwłaszcza ćwicz z wyprzedzeniem pytania takie jak 'Dlaczego chcesz do nas dołączyć?' lub 'Jakie są twoje cele po dołączeniu?' Możesz też poprosić przyjaciela o próbną rozmowę kwalifikacyjną.","it":"Certo. Soprattutto esercitati in anticipo su domande come 'Perché vuoi unirti a noi?' o 'Quali sono i tuoi obiettivi dopo l'ingresso?' Puoi anche chiedere a un amico un colloquio simulato.","sv":"Naturligtvis. Öva speciellt i förväg på frågor som 'Varför vill du ansluta till oss?' eller 'Vilka är dina mål efter att du börjat?' Du kan också be en vän om en övningsintervju.","fi":"Tietenkin. Harjoittele erityisesti etukäteen kysymyksiä kuten 'Miksi haluat liittyä meille?' tai 'Mitkä ovat tavoitteesi liittymisen jälkeen?' Voit myös pyytää ystävää harjoitushaastatteluun.","ja":"もちろん。特に「志望動機」や「入社後の抱負」のような質問は必ず事前に練習してみてね。友達にモックインタビューをお願いするのもいいよ。","zh-CN":"当然。特别是'申请动机'和'入职后的抱负'之类的问题，一定要提前练习。也可以请朋友帮你做模拟面试。"}},{"speaker":"민지","text":"고마워, 태준아. 덕분에 뭘 해야 할지 좀 더 명확해진 것 같아. 열심히 준비해 볼게.","trans":{"en":"Thank you, Taejun. Thanks to you, I feel a bit clearer about what I need to do. I'll do my best to prepare.","de":"Danke, Taejun. Dank dir bin ich mir klarer darüber, was ich tun muss. Ich werde mich bestmöglich vorbereiten.","fr":"Merci, Taejun. Grâce à toi, je me sens un peu plus claire sur ce que je dois faire. Je vais faire de mon mieux pour me préparer.","es":"Gracias, Taejun. Gracias a ti, estoy un poco más clara sobre lo que debo hacer. Haré mi mejor esfuerzo para prepararme.","pl":"Dziękuję, Taejun. Dzięki tobie mam trochę jaśniejszy obraz tego, co muszę zrobić. Zrobię co w mojej mocy, żeby się przygotować.","it":"Grazie, Taejun. Grazie a te, mi è un po' più chiaro cosa devo fare. Farò del mio meglio per prepararmi.","sv":"Tack, Taejun. Tack vare dig känner jag mig lite tydligare om vad jag behöver göra. Jag gör mitt bästa för att förbereda mig.","fi":"Kiitos, Taejun. Sinun ansiostasi minulla on hieman selkeämpi kuva siitä, mitä pitää tehdä. Teen parhaani valmistautuakseni.","ja":"ありがとう、テジュン。おかげで何をすべきかが少し明確になった気がするよ。頑張って準備してみるね。","zh-CN":"谢谢你，泰俊。多亏了你，我对该做什么有了更清晰的认识。我会努力准备的。"}}],"vocab":[{"word":"이력서","trans":{"en":"resume / CV","de":"Lebenslauf","fr":"CV / curriculum vitae","es":"currículum vitae","pl":"CV / życiorys zawodowy","it":"curriculum vitae","sv":"CV / meritförteckning","fi":"ansioluettelo / CV","ja":"履歴書","zh-CN":"简历"}},{"word":"자기소개서","trans":{"en":"cover letter / personal statement","de":"Anschreiben / Selbstvorstellung","fr":"lettre de motivation / lettre de présentation","es":"carta de presentación","pl":"list motywacyjny","it":"lettera di presentazione / lettera motivazionale","sv":"personligt brev / motivationsbrev","fi":"saatekirje / henkilökohtainen esittely","ja":"自己紹介書","zh-CN":"自我介绍信"}},{"word":"지원 동기","trans":{"en":"motivation for applying / reason for applying","de":"Bewerbungsmotivation / Bewerbungsgrund","fr":"motivation pour postuler / raison de candidature","es":"motivación para postularse","pl":"motywacja do aplikowania","it":"motivazione per candidarsi","sv":"motivation till ansökan","fi":"hakumotivaatio / syy hakea","ja":"志望動機","zh-CN":"申请动机"}},{"word":"모의 면접","trans":{"en":"mock interview","de":"Probevorstellungsgespräch / Mock-Interview","fr":"entretien simulé / entretien d'entraînement","es":"entrevista de práctica / simulacro de entrevista","pl":"próbna rozmowa kwalifikacyjna","it":"colloquio simulato","sv":"övningsintervju / simulerad intervju","fi":"harjoitushaastattelu","ja":"模擬面接","zh-CN":"模拟面试"}},{"word":"포부","trans":{"en":"ambition / aspiration / goal","de":"Ehrgeiz / Ziel / Aspiration","fr":"ambition / aspiration","es":"ambición / aspiración","pl":"ambicja / aspiracje","it":"ambizione / aspirazione","sv":"ambition / strävan","fi":"kunnianhimo / tavoite","ja":"抱負","zh-CN":"抱负 / 志向"}},{"word":"강점","trans":{"en":"strength / strong point","de":"Stärke","fr":"point fort / force","es":"fortaleza / punto fuerte","pl":"mocna strona","it":"punto di forza","sv":"styrka","fi":"vahvuus","ja":"強み","zh-CN":"优势 / 长处"}},{"word":"취업 포털","trans":{"en":"job portal / employment website","de":"Jobportal","fr":"portail emploi / site de recrutement","es":"portal de empleo","pl":"portal pracy","it":"portale del lavoro","sv":"jobbportal","fi":"työnhakuportaali","ja":"就活ポータル","zh-CN":"招聘网站"}},{"word":"구체적으로","trans":{"en":"specifically / concretely","de":"konkret / spezifisch","fr":"concrètement / spécifiquement","es":"concretamente / específicamente","pl":"konkretnie / szczegółowo","it":"concretamente / specificatamente","sv":"konkret / specifikt","fi":"konkreettisesti / tarkasti","ja":"具体的に","zh-CN":"具体地"}}],"patterns":[{"pattern":"-아/어야 하고 -아/어야 하다","patternTrans":{"en":"have to do X and also have to do Y (listing multiple obligations)","de":"X tun müssen und auch Y tun müssen (mehrere Pflichten auflisten)","fr":"devoir faire X et aussi devoir faire Y (énumérer plusieurs obligations)","es":"tener que hacer X y también tener que hacer Y (listar varias obligaciones)","pl":"musieć zrobić X i musieć zrobić Y (wymienienie kilku obowiązków)","it":"dover fare X e dover fare anche Y (elenco di obblighi multipli)","sv":"behöva göra X och också behöva göra Y (lista flera skyldigheter)","fi":"täytyy tehdä X ja täytyy myös tehdä Y (useiden velvoitteiden luettelo)","ja":"〜しなければならないし、〜もしなければならない（複数の義務を列挙）","zh-CN":"必须做X，还必须做Y（列举多个义务）"},"example":"이력서도 써야 하고 자기소개서도 준비해야 해.","trans":{"en":"I have to write a resume and also have to prepare a cover letter.","de":"Ich muss einen Lebenslauf schreiben und auch ein Anschreiben vorbereiten.","fr":"Je dois rédiger un CV et aussi préparer une lettre de motivation.","es":"Tengo que escribir un currículum y también preparar una carta de presentación.","pl":"Muszę napisać CV i muszę też przygotować list motywacyjny.","it":"Devo scrivere un curriculum e devo anche preparare una lettera di presentazione.","sv":"Jag måste skriva ett CV och måste också förbereda ett personligt brev.","fi":"Minun täytyy kirjoittaa ansioluettelo ja myös valmistella saatekirje.","ja":"履歴書も書かないといけないし、自己紹介書も準備しないといけない。","zh-CN":"要写简历，还要准备自我介绍信。"}},{"pattern":"-는 게 중요하다","patternTrans":{"en":"it is important to do something","de":"es ist wichtig, etwas zu tun","fr":"il est important de faire quelque chose","es":"es importante hacer algo","pl":"ważne jest, żeby coś zrobić","it":"è importante fare qualcosa","sv":"det är viktigt att göra något","fi":"on tärkeää tehdä jotain","ja":"〜することが重要だ","zh-CN":"做某事很重要"},"example":"자신의 경험과 강점을 구체적으로 쓰는 게 중요해.","trans":{"en":"It's important to write specifically about your experiences and strengths.","de":"Es ist wichtig, konkret über deine Erfahrungen und Stärken zu schreiben.","fr":"Il est important d'écrire concrètement sur vos expériences et vos points forts.","es":"Es importante escribir de manera concreta sobre tus experiencias y fortalezas.","pl":"Ważne jest pisanie konkretnie o swoich doświadczeniach i mocnych stronach.","it":"È importante scrivere in modo concreto delle proprie esperienze e punti di forza.","sv":"Det är viktigt att skriva konkret om dina erfarenheter och styrkor.","fi":"On tärkeää kirjoittaa konkreettisesti kokemuksistasi ja vahvuuksistasi.","ja":"自分の経験と強みを具体的に書くことが重要だよ。","zh-CN":"具体写出自己的经历和优势很重要。"}},{"pattern":"-도 좋다","patternTrans":{"en":"it is also good to do (something) / you can also do (something)","de":"es ist auch gut, etwas zu tun / man kann auch etwas tun","fr":"c'est aussi bien de faire (quelque chose) / on peut aussi faire (quelque chose)","es":"también está bien hacer (algo) / también puedes hacer (algo)","pl":"też dobrze jest coś zrobić / możesz też coś zrobić","it":"è anche bene fare (qualcosa) / puoi anche fare (qualcosa)","sv":"det är också bra att göra (något) / du kan också göra (något)","fi":"on myös hyvä tehdä jotain / voit myös tehdä jotain","ja":"〜してもいい（提案・許可・追加オプション）","zh-CN":"做（某事）也很好 / 也可以做（某事）"},"example":"친구한테 모의 면접을 부탁해도 좋아.","trans":{"en":"You can also ask a friend for a mock interview.","de":"Du kannst auch einen Freund um ein Vorstellungsgesprächs-Rollenspiel bitten.","fr":"Tu peux aussi demander à un ami un entretien simulé.","es":"También puedes pedirle a un amigo una entrevista de práctica.","pl":"Możesz też poprosić przyjaciela o próbną rozmowę kwalifikacyjną.","it":"Puoi anche chiedere a un amico un colloquio simulato.","sv":"Du kan också be en vän om en övningsintervju.","fi":"Voit myös pyytää ystävää harjoitushaastatteluun.","ja":"友達にモックインタビューをお願いしてもいいよ。","zh-CN":"也可以请朋友帮你做模拟面试。"}}],"quizzes":[{"type":"이해","questionAudio":"민지는 자기소개서에 대해 어떻게 생각하고 있습니까?","questionTrans":{"en":"What does Minji think about writing her cover letter?","de":"Was denkt Minji über das Schreiben ihres Anschreibens?","fr":"Que pense Minji de la rédaction de sa lettre de motivation ?","es":"¿Qué piensa Minji sobre escribir su carta de presentación?","pl":"Co Minji myśli o pisaniu swojego listu motywacyjnego?","it":"Cosa pensa Minji di scrivere la sua lettera di presentazione?","sv":"Vad tycker Minji om att skriva sitt personliga brev?","fi":"Mitä Minji ajattelee saatekirjeensä kirjoittamisesta?","ja":"ミンジは自己紹介書についてどう思っていますか？","zh-CN":"敏智对写自我介绍信有什么看法？"},"options":[{"text":"이미 잘 써서 완성했다","trans":{"en":"She has already written it well and finished it","de":"Sie hat es bereits gut geschrieben und fertiggestellt","fr":"Elle l'a déjà bien rédigée et terminée","es":"Ya la escribió bien y la terminó","pl":"Już dobrze napisała i skończyła","it":"L'ha già scritta bene e terminata","sv":"Hon har redan skrivit det bra och avslutat det","fi":"Hän on jo kirjoittanut sen hyvin ja saanut sen valmiiksi","ja":"すでにうまく書いて完成させた","zh-CN":"已经写好并完成了"}},{"text":"어떻게 써야 할지 몰라서 어렵다","trans":{"en":"It's difficult because she doesn't know how to write it","de":"Es ist schwierig, weil sie nicht weiß, wie sie es schreiben soll","fr":"C'est difficile parce qu'elle ne sait pas comment le rédiger","es":"Es difícil porque no sabe cómo escribirla","pl":"Jest trudny, bo nie wie jak go napisać","it":"È difficile perché non sa come scriverla","sv":"Det är svårt eftersom hon inte vet hur man skriver det","fi":"Se on vaikeaa, koska hän ei tiedä miten kirjoittaa sen","ja":"どうやって書けばいいかわからなくて難しい","zh-CN":"因为不知道怎么写所以很困难"}},{"text":"쓸 내용이 너무 많다","trans":{"en":"There is too much content to write","de":"Es gibt zu viel Inhalt zu schreiben","fr":"Il y a trop de contenu à écrire","es":"Hay demasiado contenido para escribir","pl":"Jest zbyt dużo treści do napisania","it":"C'è troppo contenuto da scrivere","sv":"Det finns för mycket innehåll att skriva","fi":"Kirjoitettavaa sisältöä on liikaa","ja":"書く内容が多すぎる","zh-CN":"要写的内容太多了"}},{"text":"도움이 필요 없다","trans":{"en":"She doesn't need help","de":"Sie braucht keine Hilfe","fr":"Elle n'a pas besoin d'aide","es":"No necesita ayuda","pl":"Nie potrzebuje pomocy","it":"Non ha bisogno di aiuto","sv":"Hon behöver inte hjälp","fi":"Hän ei tarvitse apua","ja":"助けは必要ない","zh-CN":"不需要帮助"}}],"answer":1,"explanation":"민지는 '자기소개서가 문제야, 어떻게 써야 할지 잘 모르겠어'라고 했으므로, 어떻게 써야 할지 몰라서 어렵다고 생각하고 있습니다."},{"type":"이해","questionAudio":"태준은 면접 준비를 위해 어떤 것을 먼저 해야 한다고 했습니까?","questionTrans":{"en":"What did Taejun say you should do first to prepare for an interview?","de":"Was hat Taejun gesagt, was man zuerst tun sollte, um sich auf ein Vorstellungsgespräch vorzubereiten?","fr":"Que dit Taejun qu'il faut faire en premier pour se préparer à un entretien ?","es":"¿Qué dijo Taejun que se debe hacer primero para prepararse para una entrevista?","pl":"Co Taejun powiedział, że należy zrobić najpierw, aby przygotować się do rozmowy kwalifikacyjnej?","it":"Cosa ha detto Taejun che bisogna fare prima per prepararsi a un colloquio?","sv":"Vad sa Taejun att man ska göra först för att förbereda sig för en intervju?","fi":"Mitä Taejun sanoi, että pitää tehdä ensin valmistautuakseen haastatteluun?","ja":"テジュンは面接準備のために最初に何をすべきだと言いましたか？","zh-CN":"泰俊说为了准备面试应该先做什么？"},"options":[{"text":"모의 면접 연습하기","trans":{"en":"Practice a mock interview","de":"Ein Vorstellungsgesprächs-Rollenspiel üben","fr":"S'entraîner à un entretien simulé","es":"Practicar una entrevista de práctica","pl":"Ćwiczenie próbnej rozmowy kwalifikacyjnej","it":"Fare pratica con un colloquio simulato","sv":"Öva med en övningsintervju","fi":"Harjoitella harjoitushaastattelua","ja":"模擬面接を練習する","zh-CN":"练习模拟面试"}},{"text":"지원 동기 쓰기","trans":{"en":"Write a motivation for applying","de":"Bewerbungsmotivation schreiben","fr":"Rédiger une motivation de candidature","es":"Escribir una motivación para postularse","pl":"Pisanie motywacji do aplikowania","it":"Scrivere una motivazione per candidarsi","sv":"Skriva en ansökningsmotivation","fi":"Kirjoittaa hakumotivaatio","ja":"志望動機を書く","zh-CN":"写申请动机"}},{"text":"지원하는 회사 충분히 조사하기","trans":{"en":"Thoroughly research the company you're applying to","de":"Das Unternehmen, bei dem man sich bewirbt, gründlich recherchieren","fr":"Faire des recherches approfondies sur l'entreprise à laquelle on postule","es":"Investigar a fondo la empresa a la que se postula","pl":"Dokładne zbadanie firmy, do której się aplikuje","it":"Fare ricerche approfondite sull'azienda a cui ci si candida","sv":"Grundligt undersöka företaget man söker till","fi":"Tutkia huolellisesti yritystä, johon hakee","ja":"応募する会社を十分に調べる","zh-CN":"充分调查要申请的公司"}},{"text":"이력서 완성하기","trans":{"en":"Complete the resume","de":"Den Lebenslauf fertigstellen","fr":"Terminer le CV","es":"Completar el currículum","pl":"Ukończenie CV","it":"Completare il curriculum","sv":"Slutföra CV","fi":"Viimeistellä ansioluettelo","ja":"履歴書を完成させる","zh-CN":"完成简历"}}],"answer":2,"explanation":"태준은 '먼저 지원하는 회사에 대해 충분히 조사하는 게 필요해'라고 했으므로, 회사를 조사하는 것이 먼저입니다."},{"type":"이해","questionAudio":"대화 내용에 따르면 자기소개서는 어떻게 써야 합니까?","questionTrans":{"en":"According to the conversation, how should you write a cover letter?","de":"Wie soll man laut dem Gespräch ein Anschreiben verfassen?","fr":"D'après la conversation, comment doit-on rédiger une lettre de motivation ?","es":"Según la conversación, ¿cómo se debe escribir una carta de presentación?","pl":"Według rozmowy, jak należy pisać list motywacyjny?","it":"Secondo la conversazione, come si dovrebbe scrivere una lettera di presentazione?","sv":"Enligt konversationen, hur ska man skriva ett personligt brev?","fi":"Keskustelun mukaan miten saatekirje tulisi kirjoittaa?","ja":"会話の内容によると、自己紹介書はどのように書くべきですか？","zh-CN":"根据对话内容，自我介绍信应该怎么写？"},"options":[{"text":"최대한 간단하게 쓴다","trans":{"en":"Write it as simply as possible","de":"So einfach wie möglich schreiben","fr":"L'écrire de la manière la plus simple possible","es":"Escribirla de la manera más simple posible","pl":"Pisać jak najprościej","it":"Scriverla nel modo più semplice possibile","sv":"Skriva det så enkelt som möjligt","fi":"Kirjoittaa se mahdollisimman yksinkertaisesti","ja":"できるだけ簡単に書く","zh-CN":"尽可能简单地写"}},{"text":"경험과 강점을 구체적으로 쓴다","trans":{"en":"Write specifically about your experiences and strengths","de":"Konkret über Erfahrungen und Stärken schreiben","fr":"Écrire concrètement sur ses expériences et ses points forts","es":"Escribir de manera concreta sobre las experiencias y fortalezas","pl":"Pisać konkretnie o swoich doświadczeniach i mocnych stronach","it":"Scrivere in modo concreto delle proprie esperienze e punti di forza","sv":"Skriva konkret om sina erfarenheter och styrkor","fi":"Kirjoittaa konkreettisesti kokemuksista ja vahvuuksista","ja":"経験と強みを具体的に書く","zh-CN":"具体写出经历和优势"}},{"text":"회사 비전을 중심으로 쓴다","trans":{"en":"Write focusing on the company's vision","de":"Mit Fokus auf die Vision des Unternehmens schreiben","fr":"Écrire en se concentrant sur la vision de l'entreprise","es":"Escribir enfocándose en la visión de la empresa","pl":"Pisać skupiając się na wizji firmy","it":"Scrivere concentrandosi sulla visione aziendale","sv":"Skriva med fokus på företagets vision","fi":"Kirjoittaa keskittyen yrityksen visioon","ja":"会社のビジョンを中心に書く","zh-CN":"以公司愿景为中心来写"}},{"text":"막연하고 추상적으로 쓴다","trans":{"en":"Write it vaguely and abstractly","de":"Vage und abstrakt schreiben","fr":"L'écrire de façon vague et abstraite","es":"Escribirla de forma vaga y abstracta","pl":"Pisać mgliście i abstrakcyjnie","it":"Scriverla in modo vago e astratto","sv":"Skriva det vagt och abstrakt","fi":"Kirjoittaa se epämääräisesti ja abstraktisti","ja":"漠然と抽象的に書く","zh-CN":"模糊抽象地写"}}],"answer":1,"explanation":"태준은 '자신의 경험과 강점을 구체적으로 쓰는 게 중요해. 그냥 막연하게 쓰면 안 돼'라고 했습니다."}]},
  27: {"id":27,"title":"문화 차이","titleTrans":{"en":"Cultural Differences","de":"Kulturelle Unterschiede","fr":"Différences culturelles","es":"Diferencias culturales","pl":"Różnice kulturowe","it":"Differenze culturali","sv":"Kulturella skillnader","fi":"Kulttuurierot","ja":"文化の違い","zh-CN":"文化差异"},"desc":"한국 문화와 외국 문화를 비교하는 대화","descTrans":{"en":"Comparing Korean culture with foreign cultures","de":"Vergleich der koreanischen Kultur mit ausländischen Kulturen","fr":"Comparer la culture coréenne avec les cultures étrangères","es":"Comparar la cultura coreana con culturas extranjeras","pl":"Porównanie kultury koreańskiej z kulturami zagranicznymi","it":"Confronto tra la cultura coreana e le culture straniere","sv":"Jämföra koreansk kultur med utländska kulturer","fi":"Korean kulttuurin ja ulkomaisten kulttuurien vertailu","ja":"韓国の文化と外国の文化を比較する","zh-CN":"比较韩国文化与外国文化"},"dialogue":[{"speaker":"지수","text":"민준 씨, 외국에서 살아본 적 있어요? 문화 차이가 많이 느껴지던가요?","trans":{"en":"Minjun, have you ever lived abroad? Did you feel a lot of cultural differences?","de":"Minjun, haben Sie jemals im Ausland gelebt? Haben Sie viele kulturelle Unterschiede gespürt?","fr":"Minjun, avez-vous déjà vécu à l'étranger ? Avez-vous ressenti beaucoup de différences culturelles ?","es":"Minjun, ¿alguna vez has vivido en el extranjero? ¿Sentiste muchas diferencias culturales?","pl":"Minjun, czy kiedykolwiek mieszkałeś za granicą? Czy czułeś dużo różnic kulturowych?","it":"Minjun, hai mai vissuto all'estero? Hai sentito molte differenze culturali?","sv":"Minjun, har du någonsin bott utomlands? Kände du av många kulturella skillnader?","fi":"Minjun, oletko koskaan asunut ulkomailla? Tunsitko paljon kulttuurieroja?","ja":"ミンジュンさん、海外に住んだことがありますか？文化の違いをたくさん感じましたか？","zh-CN":"民准，你曾经在国外生活过吗？感觉文化差异很大吗？"}},{"speaker":"민준","text":"네, 캐나다에서 2년 정도 살았어요. 처음에는 너무 낯설어서 당황했어요.","trans":{"en":"Yes, I lived in Canada for about two years. At first, I was flustered because everything was so unfamiliar.","de":"Ja, ich habe etwa zwei Jahre in Kanada gelebt. Am Anfang war ich verwirrt, weil alles so ungewohnt war.","fr":"Oui, j'ai vécu au Canada pendant environ deux ans. Au début, j'étais déconcerté car tout était si inconnu.","es":"Sí, viví en Canadá durante unos dos años. Al principio estaba desconcertado porque todo era tan desconocido.","pl":"Tak, mieszkałem w Kanadzie przez około dwa lata. Na początku byłem zdezorientowany, bo wszystko było tak nieznane.","it":"Sì, ho vissuto in Canada per circa due anni. All'inizio ero confuso perché tutto era così insolito.","sv":"Ja, jag bodde i Kanada i ungefär två år. I början var jag förvirrad eftersom allt var så ovant.","fi":"Kyllä, asuin Kanadassa noin kaksi vuotta. Aluksi olin hämmentynyt, koska kaikki oli niin outoa.","ja":"はい、カナダに2年ほど住んでいました。最初はあまりにも慣れなくて戸惑いました。","zh-CN":"是的，我在加拿大住了大约两年。一开始因为太陌生而感到慌张。"}},{"speaker":"지수","text":"어떤 점이 가장 달랐어요? 식사 문화 같은 건요?","trans":{"en":"What was the most different? Things like dining culture?","de":"Was war am unterschiedlichsten? Zum Beispiel die Esskultur?","fr":"Qu'est-ce qui était le plus différent ? Des choses comme la culture culinaire ?","es":"¿Qué fue lo más diferente? ¿Cosas como la cultura gastronómica?","pl":"Co było najbardziej inne? Rzeczy takie jak kultura jedzenia?","it":"Cosa era più diverso? Cose come la cultura culinaria?","sv":"Vad var mest annorlunda? Saker som matkultur?","fi":"Mikä oli eniten erilaista? Esimerkiksi ruokakulttuuri?","ja":"何が一番違いましたか？食事文化のようなものは？","zh-CN":"哪方面差异最大？比如饮食文化之类的？"}},{"speaker":"민준","text":"맞아요. 한국에서는 다 같이 음식을 나눠 먹잖아요. 그런데 캐나다에서는 각자 자기 음식을 주문하고 따로 먹더라고요.","trans":{"en":"That's right. In Korea, we share food together. But in Canada, everyone orders their own food and eats separately.","de":"Genau. In Korea teilen wir Essen miteinander. Aber in Kanada bestellt jeder sein eigenes Essen und isst getrennt.","fr":"C'est ça. En Corée, on partage la nourriture ensemble. Mais au Canada, chacun commande sa propre nourriture et mange séparément.","es":"Exacto. En Corea compartimos la comida juntos. Pero en Canadá, cada uno pide su propia comida y come por separado.","pl":"Zgadza się. W Korei dzielimy jedzenie razem. Ale w Kanadzie każdy zamawia własne jedzenie i je osobno.","it":"Esatto. In Corea condividiamo il cibo insieme. Ma in Canada ognuno ordina il proprio cibo e mangia separatamente.","sv":"Precis. I Korea delar vi mat tillsammans. Men i Kanada beställer alla sin egen mat och äter separat.","fi":"Juuri niin. Koreassa jaamme ruokaa yhdessä. Mutta Kanadassa jokainen tilaa oman ruokansa ja syö erikseen.","ja":"そうです。韓国ではみんなで食べ物を分け合いますよね。でもカナダではそれぞれが自分の料理を注文して別々に食べていました。","zh-CN":"对。在韩国，大家一起分享食物。但在加拿大，每个人都各自点自己的食物，分开吃。"}},{"speaker":"지수","text":"그게 처음에는 좀 서운하게 느껴지지 않았나요?","trans":{"en":"Didn't that feel a little hurtful at first?","de":"Fühlte sich das anfangs nicht ein bisschen verletzend an?","fr":"Ça ne vous a pas semblé un peu blessant au début ?","es":"¿No te pareció un poco hiriente al principio?","pl":"Czy to nie było trochę przykre na początku?","it":"Non ti ha fatto sentire un po' male all'inizio?","sv":"Kändes det inte lite sårande i början?","fi":"Eikö se tuntunut hieman loukkaavalta aluksi?","ja":"最初はちょっと寂しく感じませんでしたか？","zh-CN":"一开始不会感到有点失落吗？"}},{"speaker":"민준","text":"솔직히 그랬어요. 하지만 시간이 지나면서 개인 공간을 존중하는 문화라는 걸 이해하게 됐어요.","trans":{"en":"Honestly, I did. But as time passed, I came to understand it as a culture that respects personal space.","de":"Ehrlich gesagt ja. Aber mit der Zeit verstand ich, dass es eine Kultur ist, die den persönlichen Raum respektiert.","fr":"Honnêtement, oui. Mais avec le temps, j'ai compris que c'était une culture qui respecte l'espace personnel.","es":"Honestamente, sí. Pero con el tiempo llegué a entenderlo como una cultura que respeta el espacio personal.","pl":"Szczerze, tak. Ale z czasem zrozumiałem, że to kultura, która szanuje przestrzeń osobistą.","it":"Onestamente sì. Ma col tempo ho capito che è una cultura che rispetta lo spazio personale.","sv":"Ärligt talat, ja. Men med tiden förstod jag att det är en kultur som respekterar personligt utrymme.","fi":"Rehellisesti sanottuna kyllä. Mutta ajan myötä ymmärsin, että se on kulttuuri, joka kunnioittaa henkilökohtaista tilaa.","ja":"正直そうでした。でも時間が経つにつれて、個人の空間を尊重する文化だということが理解できるようになりました。","zh-CN":"说实话，确实如此。但随着时间的推移，我开始理解这是一种尊重个人空间的文化。"}},{"speaker":"지수","text":"맞아요. 한국은 집단주의 문화가 강하죠. 나이나 직위에 따른 예절도 복잡하고요.","trans":{"en":"That's true. Korea has a strong collectivist culture. Etiquette based on age and position is also complex.","de":"Das stimmt. Korea hat eine starke kollektivistische Kultur. Die Etikette basierend auf Alter und Position ist auch komplex.","fr":"C'est vrai. La Corée a une forte culture collectiviste. L'étiquette basée sur l'âge et le rang est aussi complexe.","es":"Es cierto. Corea tiene una fuerte cultura colectivista. La etiqueta basada en la edad y el cargo también es compleja.","pl":"To prawda. Korea ma silną kulturę kolektywistyczną. Etykieta oparta na wieku i stanowisku jest również złożona.","it":"È vero. La Corea ha una forte cultura collettivistica. L'etichetta basata sull'età e sul rango è anche complessa.","sv":"Det stämmer. Korea har en stark kollektivistisk kultur. Etiketten baserad på ålder och position är också komplex.","fi":"Se on totta. Korealla on vahva kollektivistinen kulttuuri. Ikään ja asemaan perustuva etiketti on myös monimutkainen.","ja":"そうですね。韓国は集団主義文化が強いですね。年齢や職位に基づくマナーも複雑ですし。","zh-CN":"没错。韩国的集体主义文化很强。基于年龄和职位的礼节也很复杂。"}},{"speaker":"민준","text":"외국 친구들이 한국에 오면 그 부분을 가장 어려워하더라고요. 어른한테 두 손으로 물건 받는 것도 신기하게 보고요.","trans":{"en":"When foreign friends come to Korea, they find that part the hardest. They also find it interesting to receive things from elders with both hands.","de":"Wenn ausländische Freunde nach Korea kommen, finden sie diesen Teil am schwierigsten. Sie finden es auch interessant, Dinge von Älteren mit beiden Händen entgegenzunehmen.","fr":"Quand les amis étrangers viennent en Corée, c'est la partie qu'ils trouvent la plus difficile. Ils trouvent aussi intéressant de recevoir des objets des anciens à deux mains.","es":"Cuando los amigos extranjeros vienen a Corea, esa parte les resulta la más difícil. También les parece interesante recibir cosas de los mayores con ambas manos.","pl":"Kiedy zagraniczni przyjaciele przyjeżdżają do Korei, ta część jest dla nich najtrudniejsza. Interesujące jest też dla nich przyjmowanie rzeczy od starszych obiema rękami.","it":"Quando gli amici stranieri vengono in Corea, trovano quella parte la più difficile. Trovano anche interessante ricevere oggetti dagli anziani con entrambe le mani.","sv":"När utländska vänner kommer till Korea tycker de att den delen är svårast. De tycker också att det är intressant att ta emot saker från äldre med båda händerna.","fi":"Kun ulkomaalaiset ystävät tulevat Koreaan, he kokevat sen osan vaikeimmaksi. He pitävät myös mielenkiintoisena vastaanottaa tavaroita vanhemmilta molemmilla käsillä.","ja":"外国の友人が韓国に来ると、その部分が一番難しいと感じるようです。目上の人から両手で物を受け取るのも不思議に見えるようで。","zh-CN":"外国朋友来韩国时，那部分是他们觉得最难的。用双手从长辈那里接东西也让他们觉得很神奇。"}},{"speaker":"지수","text":"문화는 옳고 그름이 없는 것 같아요. 서로 다를 뿐이죠.","trans":{"en":"I think culture has no right or wrong. It's just different from each other.","de":"Ich glaube, Kultur hat kein Richtig oder Falsch. Es ist einfach unterschiedlich.","fr":"Je pense que la culture n'a pas de bien ou de mal. C'est juste différent l'un de l'autre.","es":"Creo que la cultura no tiene bien ni mal. Simplemente son diferentes entre sí.","pl":"Myślę, że kultura nie ma dobra ani zła. Po prostu jest inna.","it":"Penso che la cultura non abbia giusto o sbagliato. È solo diversa l'una dall'altra.","sv":"Jag tror att kulturen inte har rätt eller fel. Det är bara annorlunda från varandra.","fi":"Luulen, että kulttuurilla ei ole oikeaa tai väärää. Se on vain erilainen toisistaan.","ja":"文化には正しいも間違いもないと思います。ただ違うだけですよね。","zh-CN":"我觉得文化没有对错之分。只是彼此不同而已。"}},{"speaker":"민준","text":"정말 그래요. 그 경험 덕분에 저는 다양한 문화를 더 열린 마음으로 받아들이게 된 것 같아요.","trans":{"en":"Absolutely. Thanks to that experience, I think I've come to accept various cultures with a more open mind.","de":"Absolut. Dank dieser Erfahrung glaube ich, dass ich verschiedene Kulturen mit einem offeneren Geist akzeptiert habe.","fr":"Absolument. Grâce à cette expérience, je pense que j'ai appris à accepter diverses cultures avec un esprit plus ouvert.","es":"Absolutamente. Gracias a esa experiencia, creo que he llegado a aceptar diversas culturas con una mente más abierta.","pl":"Absolutnie. Dzięki temu doświadczeniu myślę, że nauczyłem się akceptować różne kultury z bardziej otwartym umysłem.","it":"Assolutamente. Grazie a quell'esperienza, penso di aver imparato ad accettare varie culture con una mente più aperta.","sv":"Absolut. Tack vare den erfarenheten tror jag att jag har lärt mig att acceptera olika kulturer med ett mer öppet sinne.","fi":"Ehdottomasti. Sen kokemuksen ansiosta luulen, että olen oppinut hyväksymään erilaisia kulttuureja avoimemmalla mielellä.","ja":"本当にそうですね。その経験のおかげで、様々な文化をより開かれた心で受け入れられるようになったと思います。","zh-CN":"确实如此。多亏了那段经历，我觉得我变得能以更开放的心态接受各种文化了。"}}],"vocab":[{"word":"문화 차이","trans":{"en":"cultural difference","de":"kultureller Unterschied","fr":"différence culturelle","es":"diferencia cultural","pl":"różnica kulturowa","it":"differenza culturale","sv":"kulturell skillnad","fi":"kulttuuriero","ja":"文化の違い","zh-CN":"文化差异"}},{"word":"낯설다","trans":{"en":"to be unfamiliar / strange","de":"unbekannt / fremd sein","fr":"être inconnu / étrange","es":"ser desconocido / extraño","pl":"być nieznajomym / obcym","it":"essere sconosciuto / strano","sv":"vara okänd / konstig","fi":"olla vieras / outo","ja":"なじみがない／見知らぬ","zh-CN":"陌生／不熟悉"}},{"word":"집단주의","trans":{"en":"collectivism","de":"Kollektivismus","fr":"collectivisme","es":"colectivismo","pl":"kolektywizm","it":"collettivismo","sv":"kollektivism","fi":"kollektivismi","ja":"集団主義","zh-CN":"集体主义"}},{"word":"개인 공간","trans":{"en":"personal space","de":"persönlicher Raum","fr":"espace personnel","es":"espacio personal","pl":"przestrzeń osobista","it":"spazio personale","sv":"personligt utrymme","fi":"henkilökohtainen tila","ja":"個人の空間","zh-CN":"个人空间"}},{"word":"예절","trans":{"en":"etiquette / manners","de":"Etikette / Manieren","fr":"étiquette / bonnes manières","es":"etiqueta / modales","pl":"etykieta / maniery","it":"etichetta / buone maniere","sv":"etikett / uppförande","fi":"etiketti / tavat","ja":"礼節／マナー","zh-CN":"礼节／礼仪"}},{"word":"열린 마음","trans":{"en":"open mind","de":"offener Geist","fr":"esprit ouvert","es":"mente abierta","pl":"otwarty umysł","it":"mente aperta","sv":"öppet sinne","fi":"avoin mieli","ja":"開かれた心","zh-CN":"开放的心态"}},{"word":"당황하다","trans":{"en":"to be flustered / embarrassed","de":"verwirrt / verlegen sein","fr":"être déconcerté / embarrassé","es":"estar desconcertado / avergonzado","pl":"być zmieszanym / zawstydzonym","it":"essere confuso / imbarazzato","sv":"vara förvirrad / generad","fi":"olla hämmentynyt / nolo","ja":"戸惑う／当惑する","zh-CN":"慌张／不知所措"}},{"word":"나눠 먹다","trans":{"en":"to share food","de":"Essen teilen","fr":"partager la nourriture","es":"compartir comida","pl":"dzielić się jedzeniem","it":"condividere il cibo","sv":"dela mat","fi":"jakaa ruokaa","ja":"食べ物を分け合う","zh-CN":"分享食物"}}],"patterns":[{"pattern":"-아/어 본 적 있다","patternTrans":{"en":"to have experienced doing something","de":"etwas erfahren haben","fr":"avoir eu l'expérience de faire quelque chose","es":"haber experimentado hacer algo","pl":"mieć doświadczenie robienia czegoś","it":"aver avuto l'esperienza di fare qualcosa","sv":"ha upplevt att göra något","fi":"olla kokenut tekemästä jotain","ja":"〜したことがある","zh-CN":"有过做某事的经历"},"example":"외국에서 살아본 적 있어요?","trans":{"en":"Have you ever lived abroad?","de":"Haben Sie jemals im Ausland gelebt?","fr":"Avez-vous déjà vécu à l'étranger ?","es":"¿Alguna vez has vivido en el extranjero?","pl":"Czy kiedykolwiek mieszkałeś za granicą?","it":"Hai mai vissuto all'estero?","sv":"Har du någonsin bott utomlands?","fi":"Oletko koskaan asunut ulkomailla?","ja":"海外に住んだことがありますか？","zh-CN":"你曾经在国外生活过吗？"}},{"pattern":"-면서","patternTrans":{"en":"while doing / as (simultaneous action or process)","de":"während (gleichzeitige Handlung oder Prozess)","fr":"en faisant / tandis que (action simultanée ou processus)","es":"mientras (acción simultánea o proceso)","pl":"podczas gdy (jednoczesna czynność lub proces)","it":"mentre (azione simultanea o processo)","sv":"medan (samtidig handling eller process)","fi":"samalla kun (samanaikainen toiminta tai prosessi)","ja":"〜しながら／〜するにつれて","zh-CN":"一边…一边…／随着"},"example":"시간이 지나면서 이해하게 됐어요.","trans":{"en":"As time passed, I came to understand.","de":"Mit der Zeit verstand ich es.","fr":"Avec le temps, j'ai compris.","es":"A medida que pasó el tiempo, llegué a entender.","pl":"Z biegiem czasu zrozumiałem.","it":"Col passare del tempo, ho capito.","sv":"Med tiden förstod jag.","fi":"Ajan myötä ymmärsin.","ja":"時間が経つにつれて、理解できるようになりました。","zh-CN":"随着时间的推移，我逐渐理解了。"}},{"pattern":"-는 것 같다","patternTrans":{"en":"it seems like / I think that","de":"es scheint / ich denke, dass","fr":"il semble que / je pense que","es":"parece que / creo que","pl":"wydaje się, że / myślę, że","it":"sembra che / penso che","sv":"det verkar som / jag tror att","fi":"näyttää siltä / luulen, että","ja":"〜のようだ／〜と思う","zh-CN":"好像是…／我觉得…"},"example":"문화는 옳고 그름이 없는 것 같아요.","trans":{"en":"It seems like culture has no right or wrong.","de":"Es scheint, dass Kultur kein Richtig oder Falsch hat.","fr":"Il semble que la culture n'a pas de bien ou de mal.","es":"Parece que la cultura no tiene bien ni mal.","pl":"Wydaje się, że kultura nie ma dobra ani zła.","it":"Sembra che la cultura non abbia giusto o sbagliato.","sv":"Det verkar som att kulturen inte har rätt eller fel.","fi":"Näyttää siltä, että kulttuurilla ei ole oikeaa tai väärää.","ja":"文化には正しいも間違いもないようです。","zh-CN":"文化好像没有对错之分。"}}],"quizzes":[{"type":"이해","questionAudio":"민준 씨는 어느 나라에서 살아본 적이 있어요?","questionTrans":{"en":"Which country has Minjun lived in?","de":"In welchem Land hat Minjun gelebt?","fr":"Dans quel pays Minjun a-t-il vécu ?","es":"¿En qué país ha vivido Minjun?","pl":"W jakim kraju mieszkał Minjun?","it":"In quale paese ha vissuto Minjun?","sv":"I vilket land har Minjun bott?","fi":"Missä maassa Minjun on asunut?","ja":"ミンジュンさんはどの国に住んでいたことがありますか？","zh-CN":"民准曾在哪个国家生活过？"},"options":[{"text":"미국","trans":{"en":"The United States","de":"Die Vereinigten Staaten","fr":"Les États-Unis","es":"Estados Unidos","pl":"Stany Zjednoczone","it":"Gli Stati Uniti","sv":"USA","fi":"Yhdysvallat","ja":"アメリカ","zh-CN":"美国"}},{"text":"캐나다","trans":{"en":"Canada","de":"Kanada","fr":"Le Canada","es":"Canadá","pl":"Kanada","it":"Il Canada","sv":"Kanada","fi":"Kanada","ja":"カナダ","zh-CN":"加拿大"}},{"text":"영국","trans":{"en":"The United Kingdom","de":"Das Vereinigte Königreich","fr":"Le Royaume-Uni","es":"El Reino Unido","pl":"Wielka Brytania","it":"Il Regno Unito","sv":"Storbritannien","fi":"Iso-Britannia","ja":"イギリス","zh-CN":"英国"}},{"text":"호주","trans":{"en":"Australia","de":"Australien","fr":"L'Australie","es":"Australia","pl":"Australia","it":"L'Australia","sv":"Australien","fi":"Australia","ja":"オーストラリア","zh-CN":"澳大利亚"}}],"answer":1,"explanation":"민준 씨는 캐나다에서 2년 정도 살았다고 했습니다."},{"type":"이해","questionAudio":"캐나다에서 식사 문화는 어떻다고 했나요?","questionTrans":{"en":"What did they say about the dining culture in Canada?","de":"Was sagten sie über die Esskultur in Kanada?","fr":"Qu'ont-ils dit sur la culture culinaire au Canada ?","es":"¿Qué dijeron sobre la cultura gastronómica en Canadá?","pl":"Co powiedzieli o kulturze jedzenia w Kanadzie?","it":"Cosa hanno detto sulla cultura culinaria in Canada?","sv":"Vad sa de om matkulturen i Kanada?","fi":"Mitä he sanoivat Kanadan ruokakulttuurista?","ja":"カナダの食事文化についてどう言っていましたか？","zh-CN":"他们说加拿大的饮食文化是怎样的？"},"options":[{"text":"한국처럼 음식을 나눠 먹는다","trans":{"en":"They share food like in Korea","de":"Sie teilen Essen wie in Korea","fr":"Ils partagent la nourriture comme en Corée","es":"Comparten comida como en Corea","pl":"Dzielą się jedzeniem jak w Korei","it":"Condividono il cibo come in Corea","sv":"De delar mat som i Korea","fi":"He jakavat ruokaa kuten Koreassa","ja":"韓国のように食べ物を分け合う","zh-CN":"像韩国一样分享食物"}},{"text":"각자 자기 음식을 주문하고 따로 먹는다","trans":{"en":"Everyone orders their own food and eats separately","de":"Jeder bestellt sein eigenes Essen und isst getrennt","fr":"Chacun commande sa propre nourriture et mange séparément","es":"Cada uno pide su propia comida y come por separado","pl":"Każdy zamawia własne jedzenie i je osobno","it":"Ognuno ordina il proprio cibo e mangia separatamente","sv":"Alla beställer sin egen mat och äter separat","fi":"Jokainen tilaa oman ruokansa ja syö erikseen","ja":"それぞれが自分の料理を注文して別々に食べる","zh-CN":"各自点自己的食物，分开吃"}},{"text":"음식 값을 더치페이로 낸다","trans":{"en":"They split the food bill Dutch style","de":"Sie teilen die Rechnung Dutch-style","fr":"Ils font \"chacun paie pour soi\"","es":"Pagan la cuenta a escote","pl":"Płacą rachunek po holendersku","it":"Dividono il conto alla romana","sv":"De delar notan Dutch-stil","fi":"He jakavat laskun hollantilaisittain","ja":"割り勘で払う","zh-CN":"AA制付账"}},{"text":"식사 중에 대화를 하지 않는다","trans":{"en":"They don't talk during meals","de":"Sie reden während des Essens nicht","fr":"Ils ne parlent pas pendant les repas","es":"No hablan durante las comidas","pl":"Nie rozmawiają podczas posiłków","it":"Non parlano durante i pasti","sv":"De pratar inte under måltiderna","fi":"He eivät puhu aterioiden aikana","ja":"食事中は話さない","zh-CN":"吃饭时不说话"}}],"answer":1,"explanation":"민준 씨는 캐나다에서 각자 자기 음식을 주문하고 따로 먹는다고 했습니다."},{"type":"이해","questionAudio":"두 사람은 문화 차이에 대해 어떤 결론을 내렸나요?","questionTrans":{"en":"What conclusion did the two people reach about cultural differences?","de":"Zu welchem Schluss kamen die beiden Menschen über kulturelle Unterschiede?","fr":"Quelle conclusion les deux personnes ont-elles tirée sur les différences culturelles ?","es":"¿Qué conclusión sacaron las dos personas sobre las diferencias culturales?","pl":"Jaki wniosek wyciągnęły dwie osoby na temat różnic kulturowych?","it":"Quale conclusione hanno tratto le due persone sulle differenze culturali?","sv":"Vilken slutsats drog de två personerna om kulturella skillnader?","fi":"Minkä johtopäätöksen kaksi ihmistä teki kulttuurieroista?","ja":"二人は文化の違いについてどのような結論を出しましたか？","zh-CN":"两人对文化差异得出了什么结论？"},"options":[{"text":"한국 문화가 더 우월하다","trans":{"en":"Korean culture is superior","de":"Die koreanische Kultur ist überlegen","fr":"La culture coréenne est supérieure","es":"La cultura coreana es superior","pl":"Kultura koreańska jest lepsza","it":"La cultura coreana è superiore","sv":"Koreansk kultur är överlägsen","fi":"Korean kulttuuri on ylivoimainen","ja":"韓国の文化の方が優れている","zh-CN":"韩国文化更优越"}},{"text":"외국 문화를 배우는 것은 어렵다","trans":{"en":"Learning foreign cultures is difficult","de":"Ausländische Kulturen zu lernen ist schwierig","fr":"Apprendre les cultures étrangères est difficile","es":"Aprender culturas extranjeras es difícil","pl":"Nauka obcych kultur jest trudna","it":"Imparare le culture straniere è difficile","sv":"Att lära sig utländska kulturer är svårt","fi":"Ulkomaisten kulttuurien oppiminen on vaikeaa","ja":"外国の文化を学ぶことは難しい","zh-CN":"学习外国文化很困难"}},{"text":"문화에는 옳고 그름이 없고 서로 다를 뿐이다","trans":{"en":"Culture has no right or wrong; it's just different","de":"Kultur hat kein Richtig oder Falsch; es ist nur unterschiedlich","fr":"La culture n'a pas de bien ou de mal ; c'est juste différent","es":"La cultura no tiene bien ni mal; simplemente son diferentes","pl":"Kultura nie ma dobra ani zła; po prostu jest inna","it":"La cultura non ha giusto o sbagliato; è solo diversa","sv":"Kulturen har inget rätt eller fel; det är bara annorlunda","fi":"Kulttuurilla ei ole oikeaa tai väärää; se on vain erilaista","ja":"文化には正しいも間違いもなく、ただ違うだけだ","zh-CN":"文化没有对错，只是彼此不同"}},{"text":"한국의 집단주의 문화는 없애야 한다","trans":{"en":"Korea's collectivist culture should be eliminated","de":"Koreas kollektivistische Kultur sollte abgeschafft werden","fr":"La culture collectiviste de la Corée devrait être éliminée","es":"La cultura colectivista de Corea debería eliminarse","pl":"Kolektywistyczna kultura Korei powinna zostać wyeliminowana","it":"La cultura collettivistica della Corea dovrebbe essere eliminata","sv":"Koreas kollektivistiska kultur bör elimineras","fi":"Korean kollektivistinen kulttuuri pitäisi poistaa","ja":"韓国の集団主義文化はなくすべきだ","zh-CN":"应该消除韩国的集体主义文化"}}],"answer":2,"explanation":"지수 씨가 '문화는 옳고 그름이 없는 것 같아요, 서로 다를 뿐이죠'라고 했고, 민준 씨도 동의했습니다."}]},
  28: {"id":28,"title":"경제와 소비","titleTrans":{"en":"Economy and Consumption","de":"Wirtschaft und Konsum","fr":"Économie et consommation","es":"Economía y consumo","pl":"Gospodarka i konsumpcja","it":"Economia e consumo","sv":"Ekonomi och konsumtion","fi":"Talous ja kulutus","ja":"経済と消費","zh-CN":"经济与消费"},"desc":"물가 상승과 달라진 소비 습관에 대한 대화","descTrans":{"en":"Talking about rising prices and changed spending habits","de":"Über steigende Preise und veränderte Konsumgewohnheiten sprechen","fr":"Parler de la hausse des prix et des habitudes de consommation modifiées","es":"Hablar sobre el aumento de precios y los hábitos de consumo cambiados","pl":"Rozmawianie o rosnących cenach i zmienionych nawykach konsumpcyjnych","it":"Parlare dell'aumento dei prezzi e delle abitudini di consumo cambiate","sv":"Prata om stigande priser och förändrade konsumtionsvanor","fi":"Puhua nousevista hinnoista ja muuttuneista kulutustottumuksista","ja":"物価上昇と変化した消費習慣について話す","zh-CN":"谈论物价上涨和改变了的消费习惯"},"dialogue":[{"speaker":"수진","text":"요즘 물가가 너무 올라서 장보기가 겁나요. 지난달보다 채소가 거의 두 배가 된 것 같아요.","trans":{"en":"Prices have risen so much lately that I'm scared to go grocery shopping. Vegetables seem to have almost doubled compared to last month.","de":"Die Preise sind in letzter Zeit so stark gestiegen, dass ich Angst vor dem Einkaufen habe. Gemüse scheint sich im Vergleich zum letzten Monat fast verdoppelt zu haben.","fr":"Les prix ont tellement augmenté dernièrement que j'ai peur de faire les courses. Les légumes semblent avoir presque doublé par rapport au mois dernier.","es":"Los precios han subido tanto últimamente que tengo miedo de ir al supermercado. Las verduras parecen haberse casi duplicado en comparación con el mes pasado.","pl":"Ceny ostatnio tak bardzo wzrosły, że boję się iść na zakupy. Warzywa wydają się prawie podwoiły się w porównaniu z zeszłym miesiącem.","it":"I prezzi sono aumentati così tanto ultimamente che ho paura di fare la spesa. Le verdure sembrano essersi quasi raddoppiate rispetto al mese scorso.","sv":"Priserna har stigit så mycket på sistone att jag är rädd för att handla mat. Grönsaker verkar ha nästan fördubblats jämfört med förra månaden.","fi":"Hinnat ovat nousseet niin paljon viime aikoina, että pelkäämme käydä ruokakaupassa. Vihannekset näyttävät lähes kaksinkertaistuneen viime kuuhun verrattuna.","ja":"最近物価が上がりすぎて、買い物が怖いです。先月より野菜がほぼ2倍になったようです。","zh-CN":"最近物价涨得太厉害了，让我都不敢去买菜。蔬菜好像比上个月涨了将近一倍。"}},{"speaker":"현우","text":"저도 느껴요. 특히 외식비가 많이 올랐잖아요. 점심 한 끼에 만 원이 넘는 게 이제 당연해졌어요.","trans":{"en":"I feel it too. Especially the cost of eating out has gone up a lot. It's become normal for a single lunch to cost over 10,000 won.","de":"Das spüre ich auch. Besonders die Kosten für auswärts essen sind stark gestiegen. Es ist normal geworden, dass ein Mittagessen über 10.000 Won kostet.","fr":"Je le ressens aussi. Surtout le coût des repas au restaurant a beaucoup augmenté. Il est devenu normal qu'un seul déjeuner coûte plus de 10 000 wons.","es":"Yo también lo siento. Especialmente el costo de comer fuera ha aumentado mucho. Se ha vuelto normal que un solo almuerzo cueste más de 10,000 wones.","pl":"Ja też to czuję. Szczególnie koszty jedzenia na mieście bardzo wzrosły. Stało się normalne, że jeden obiad kosztuje ponad 10 000 wonów.","it":"Anch'io lo sento. Soprattutto il costo di mangiare fuori è aumentato molto. È diventato normale che un solo pranzo costi più di 10.000 won.","sv":"Jag känner det också. Speciellt kostnaden för att äta ute har ökat mycket. Det har blivit normalt att en enda lunch kostar mer än 10 000 won.","fi":"Minäkin tunnen sen. Etenkin ravintoloissa syömisen kustannukset ovat nousseet paljon. On tullut normaaliksi, että yksi lounas maksaa yli 10 000 wonia.","ja":"私もそう感じます。特に外食費が大きく上がりましたよね。ランチ一食に1万ウォンを超えるのが当たり前になりました。","zh-CN":"我也有感觉。尤其是外出吃饭的费用涨了很多。一顿午饭超过一万韩元已经变得理所当然了。"}},{"speaker":"수진","text":"그래서 저는 요즘 외식을 줄이고 집에서 요리하는 횟수를 늘렸어요. 밀키트도 자주 사용하고요.","trans":{"en":"So lately I've been cutting back on eating out and increasing how often I cook at home. I also use meal kits often.","de":"Deshalb habe ich in letzter Zeit auswärts Essen reduziert und häufiger zu Hause gekocht. Ich benutze auch oft Meal Kits.","fr":"Donc ces derniers temps, j'ai réduit les repas au restaurant et augmenté la fréquence de cuisine à la maison. J'utilise aussi souvent des kits repas.","es":"Así que últimamente he reducido comer fuera y he aumentado la frecuencia con la que cocino en casa. También uso kits de comida a menudo.","pl":"Więc ostatnio ograniczam jedzenie na mieście i zwiększam częstotliwość gotowania w domu. Często używam też zestawów posiłkowych.","it":"Quindi ultimamente ho ridotto i pasti fuori e aumentato la frequenza con cui cucino a casa. Uso spesso anche i kit pasto.","sv":"Så på sistone har jag minskat ätandet ute och ökat hur ofta jag lagar mat hemma. Jag använder också ofta matkitsar.","fi":"Joten viime aikoina olen vähentänyt ulkona syömistä ja lisännyt kotona ruoanlaiton tiheyttä. Käytän myös usein ateriasetjä.","ja":"だから最近は外食を減らして、家で料理する回数を増やしました。ミールキットもよく使っています。","zh-CN":"所以我最近减少了外出就餐，增加了在家做饭的次数。也经常使用料理包。"}},{"speaker":"현우","text":"저는 쇼핑할 때 꼭 필요한 것만 사게 되더라고요. 예전에는 충동구매를 자주 했는데 이제는 그러기가 어려워요.","trans":{"en":"When I shop, I end up only buying what I really need. I used to make impulse purchases often, but now it's hard to do that.","de":"Wenn ich einkaufe, kaufe ich am Ende nur das, was ich wirklich brauche. Früher habe ich oft Impulskäufe gemacht, aber jetzt ist das schwierig.","fr":"Quand je fais du shopping, je finis par n'acheter que ce dont j'ai vraiment besoin. Avant, je faisais souvent des achats impulsifs, mais maintenant c'est difficile.","es":"Cuando hago compras, termino comprando solo lo que realmente necesito. Antes hacía compras impulsivas con frecuencia, pero ahora es difícil hacerlo.","pl":"Kiedy robię zakupy, kupuję tylko to, czego naprawdę potrzebuję. Kiedyś często robiłem impulsywne zakupy, ale teraz jest to trudne.","it":"Quando faccio acquisti, finisco per comprare solo quello di cui ho veramente bisogno. Prima facevo spesso acquisti impulsivi, ma ora è difficile.","sv":"När jag handlar köper jag bara det jag verkligen behöver. Förut köpte jag ofta impulsivt, men nu är det svårt.","fi":"Kun käyn ostoksilla, ostan vain sen mitä todella tarvitsen. Ennen tein usein heräteostoksia, mutta nyt se on vaikeaa.","ja":"買い物するとき、本当に必要なものだけ買うようになりました。以前は衝動買いをよくしていましたが、今はそれが難しいです。","zh-CN":"我购物时只买真正需要的东西。以前经常冲动消费，现在这样做很难了。"}},{"speaker":"수진","text":"맞아요. 저도 소비 습관이 많이 바뀌었어요. 중고 물건을 사거나 할인 앱을 적극적으로 활용하게 됐어요.","trans":{"en":"I agree. My spending habits have changed a lot too. I've started buying second-hand items or actively using discount apps.","de":"Ich stimme zu. Meine Ausgabegewohnheiten haben sich auch sehr verändert. Ich habe angefangen, gebrauchte Artikel zu kaufen oder Rabatt-Apps aktiv zu nutzen.","fr":"Je suis d'accord. Mes habitudes de dépenses ont beaucoup changé aussi. J'ai commencé à acheter des articles d'occasion ou à utiliser activement des applications de réduction.","es":"Estoy de acuerdo. Mis hábitos de gasto también han cambiado mucho. He empezado a comprar artículos de segunda mano o a usar activamente aplicaciones de descuento.","pl":"Zgadzam się. Moje nawyki wydawania pieniędzy też bardzo się zmieniły. Zacząłem kupować używane przedmioty lub aktywnie korzystać z aplikacji rabatowych.","it":"Sono d'accordo. Anche le mie abitudini di spesa sono cambiate molto. Ho iniziato ad acquistare articoli di seconda mano o a utilizzare attivamente app di sconti.","sv":"Jag håller med. Mina konsumtionsvanor har förändrats mycket också. Jag har börjat köpa begagnade varor eller använda rabattappar aktivt.","fi":"Olen samaa mieltä. Myös kulutustottumukseni ovat muuttuneet paljon. Olen alkanut ostaa käytettyjä tavaroita tai käyttää aktiivisesti alennussovelluksia.","ja":"そうですね。私も消費習慣がかなり変わりました。中古品を買ったり、割引アプリを積極的に活用するようになりました。","zh-CN":"没错。我的消费习惯也改变了很多。开始购买二手物品或积极使用折扣应用程序。"}},{"speaker":"현우","text":"저는 구독 서비스를 많이 정리했어요. 쓰지도 않는 것들에 돈이 나가고 있었더라고요.","trans":{"en":"I cleared out a lot of subscription services. I realized money was going out for things I wasn't even using.","de":"Ich habe viele Abonnementdienste aufgeräumt. Mir wurde klar, dass Geld für Dinge ausging, die ich nicht einmal nutzte.","fr":"J'ai nettoyé beaucoup de services d'abonnement. J'ai réalisé que l'argent partait pour des choses que je n'utilisais même pas.","es":"Limpié muchos servicios de suscripción. Me di cuenta de que el dinero se iba por cosas que ni siquiera usaba.","pl":"Wyczyściłem wiele usług subskrypcyjnych. Zdałem sobie sprawę, że pieniądze uciekały na rzeczy, których nawet nie używałem.","it":"Ho eliminato molti servizi in abbonamento. Mi sono reso conto che i soldi uscivano per cose che non usavo nemmeno.","sv":"Jag rensade upp många prenumerationstjänster. Jag insåg att pengar gick ut för saker jag inte ens använde.","fi":"Siivoutin paljon tilauspalveluita. Huomasin, että rahaa meni asioihin, joita en edes käyttänyt.","ja":"サブスクリプションサービスをたくさん整理しました。使ってもいないものにお金が出ていっていたんです。","zh-CN":"我整理了很多订阅服务。发现有些根本没在用的东西在一直扣钱。"}},{"speaker":"수진","text":"그거 좋은 방법이네요. 그런데 이렇게 절약하면서도 생활 수준을 유지하는 게 쉽지는 않더라고요.","trans":{"en":"That's a good approach. But it's not easy to maintain your standard of living while saving like this.","de":"Das ist ein guter Ansatz. Aber es ist nicht einfach, den Lebensstandard aufrechtzuerhalten, während man so spart.","fr":"C'est une bonne approche. Mais maintenir son niveau de vie tout en économisant ainsi n'est pas facile.","es":"Ese es un buen enfoque. Pero no es fácil mantener tu nivel de vida mientras ahorras así.","pl":"To dobry sposób. Ale utrzymanie standardu życia podczas oszczędzania w ten sposób nie jest łatwe.","it":"È un buon approccio. Ma non è facile mantenere il proprio tenore di vita mentre si risparmia così.","sv":"Det är ett bra tillvägagångssätt. Men det är inte lätt att upprätthålla sin levnadsstandard medan man sparar så här.","fi":"Se on hyvä lähestymistapa. Mutta ei ole helppoa ylläpitää elintasoaan säästäessä näin.","ja":"それは良い方法ですね。でも、こうして節約しながらも生活水準を維持するのはやはり簡単ではないですよね。","zh-CN":"这个方法不错。但是一边节约一边维持生活水准确实不容易。"}},{"speaker":"현우","text":"그렇죠. 하지만 이번 기회에 필요한 것과 원하는 것을 구별하는 법을 배운 것 같아요.","trans":{"en":"True. But I feel like this has been an opportunity to learn how to distinguish between what we need and what we want.","de":"Stimmt. Aber ich glaube, diese Gelegenheit hat mir beigebracht, zwischen dem, was wir brauchen, und dem, was wir wollen, zu unterscheiden.","fr":"C'est vrai. Mais je pense que cette opportunité m'a appris à distinguer ce dont on a besoin de ce qu'on veut.","es":"Es verdad. Pero creo que esta oportunidad me enseñó a distinguir entre lo que necesitamos y lo que queremos.","pl":"Prawda. Ale myślę, że ta okazja nauczyła mnie odróżniać to, czego potrzebujemy, od tego, czego chcemy.","it":"È vero. Ma penso che questa opportunità mi abbia insegnato come distinguere tra ciò di cui abbiamo bisogno e ciò che vogliamo.","sv":"Sant. Men jag tycker att denna möjlighet lärde mig att skilja mellan vad vi behöver och vad vi vill ha.","fi":"Totta. Mutta luulen, että tämä tilaisuus opetti minulle erottamaan sen, mitä tarvitsemme, siitä, mitä haluamme.","ja":"そうですね。でも今回の機会に、必要なものと欲しいものを区別する方法を学んだような気がします。","zh-CN":"是啊。但感觉这次也是一个学会区分需要和想要的机会。"}},{"speaker":"수진","text":"맞아요. 소비에 대해 더 신중하게 생각하게 됐어요. 나중에 경제 상황이 나아지면 좋겠어요.","trans":{"en":"Right. I've become more careful in thinking about spending. I hope the economic situation improves later.","de":"Richtig. Ich bin vorsichtiger geworden, wenn es ums Ausgeben geht. Ich hoffe, die wirtschaftliche Lage verbessert sich später.","fr":"C'est juste. Je suis devenu plus prudent dans ma réflexion sur les dépenses. J'espère que la situation économique s'améliore par la suite.","es":"Cierto. Me he vuelto más cuidadoso al pensar en el gasto. Espero que la situación económica mejore después.","pl":"Racja. Stałem się bardziej ostrożny w myśleniu o wydatkach. Mam nadzieję, że sytuacja gospodarcza poprawi się później.","it":"Giusto. Sono diventato più attento nel pensare alle spese. Spero che la situazione economica migliori in seguito.","sv":"Rätt. Jag har blivit mer försiktig i mitt tänkande om utgifter. Jag hoppas att den ekonomiska situationen förbättras senare.","fi":"Oikein. Minusta on tullut varovaisempi ajatellessani kulutusta. Toivon, että taloudellinen tilanne paranee myöhemmin.","ja":"そうですね。消費についてより慎重に考えるようになりました。後で経済状況が改善されればいいですね。","zh-CN":"没错。在消费方面变得更加慎重了。希望以后经济形势能好转。"}}],"vocab":[{"word":"물가 상승","trans":{"en":"price increase / inflation","de":"Preisanstieg / Inflation","fr":"hausse des prix / inflation","es":"aumento de precios / inflación","pl":"wzrost cen / inflacja","it":"aumento dei prezzi / inflazione","sv":"prisökning / inflation","fi":"hintojen nousu / inflaatio","ja":"物価上昇／インフレ","zh-CN":"物价上涨／通货膨胀"}},{"word":"외식비","trans":{"en":"dining out expenses","de":"Ausgaben für auswärts essen","fr":"frais de repas au restaurant","es":"gastos de comer fuera","pl":"koszty jedzenia na mieście","it":"spese per mangiare fuori","sv":"kostnader för att äta ute","fi":"ulkona syömisen kulut","ja":"外食費","zh-CN":"外出就餐费用"}},{"word":"충동구매","trans":{"en":"impulse purchase","de":"Impulskauf","fr":"achat impulsif","es":"compra impulsiva","pl":"zakup impulsowy","it":"acquisto impulsivo","sv":"impulsköp","fi":"heräteostos","ja":"衝動買い","zh-CN":"冲动消费"}},{"word":"소비 습관","trans":{"en":"spending habits / consumption habits","de":"Ausgabegewohnheiten / Konsumgewohnheiten","fr":"habitudes de dépenses / habitudes de consommation","es":"hábitos de gasto / hábitos de consumo","pl":"nawyki wydawania / nawyki konsumpcyjne","it":"abitudini di spesa / abitudini di consumo","sv":"utgiftsvanor / konsumtionsvanor","fi":"kulutustottumukset","ja":"消費習慣","zh-CN":"消费习惯"}},{"word":"절약하다","trans":{"en":"to save / to economize","de":"sparen / wirtschaften","fr":"économiser","es":"ahorrar / economizar","pl":"oszczędzać","it":"risparmiare / economizzare","sv":"spara / hushålla","fi":"säästää","ja":"節約する","zh-CN":"节
