。红叶正是最美的时候，落叶也堆了很多。"}},{"speaker":"민준","text":"그러게요. 이번 주말에 단풍 구경하러 산에 가려고 하는데 같이 갈래요?","trans":{"en":"Yeah. I'm planning to go to the mountains this weekend to see the fall foliage. Want to come?","de":"Stimmt. Ich plane, dieses Wochenende in die Berge zu fahren, um die Herbstfarben zu sehen. Möchtest du mitkommen?","fr":"Oui. Je prévois d'aller à la montagne ce week-end pour voir le feuillage d'automne. Tu veux venir?","es":"Sí. Planeo ir a las montañas este fin de semana para ver el follaje otoñal. ¿Quieres venir?","pl":"No właśnie. Planuję pojechać w góry w ten weekend, żeby zobaczyć jesienne kolory. Chcesz iść?","it":"Già. Ho intenzione di andare in montagna questo fine settimana per vedere il fogliame autunnale. Vuoi venire?","sv":"Ja precis. Jag planerar att åka till bergen i helgen för att se höstfärgerna. Vill du följa med?","fi":"Niin. Suunnittelen menoa vuorille tänä viikonloppuna katsomaan syysvärejä. Haluatko tulla?","ja":"そうですね。今週末、紅葉を見に山に行こうと思っているのですが、一緒に行きませんか？","zh-CN":"是啊。这个周末我打算去山里看红叶，要一起去吗？"}},{"speaker":"지수","text":"좋아요! 그런데 날씨가 또 변할 수도 있으니까 따뜻하게 입고 가야겠어요.","trans":{"en":"Sounds good! But since the weather might change again, we should dress warmly.","de":"Toll! Aber da sich das Wetter wieder ändern könnte, sollten wir uns warm anziehen.","fr":"Super! Mais comme le temps pourrait encore changer, nous devrions nous habiller chaudement.","es":"¡Genial! Pero como el tiempo podría cambiar de nuevo, debemos vestirnos abrigados.","pl":"Świetnie! Ale skoro pogoda może znowu się zmienić, powinniśmy się ciepło ubrać.","it":"Ottimo! Ma dato che il tempo potrebbe cambiare di nuovo, dovremmo vestirci calorosamente.","sv":"Låter bra! Men eftersom vädret kan förändras igen borde vi klä oss varmt.","fi":"Kuulostaa hyvältä! Mutta koska sää saattaa muuttua taas, meidän pitäisi pukeutua lämpimästi.","ja":"いいですね！でも天気がまた変わるかもしれないので、暖かくして行かなければなりませんね。","zh-CN":"好啊！但是天气可能又会变，所以要穿暖和一点去。"}},{"speaker":"민준","text":"당연하죠. 그리고 비 소식도 있다고 하니까 우산도 챙겨야 할 것 같아요.","trans":{"en":"Of course. And since there's a chance of rain, I think we should bring umbrellas too.","de":"Natürlich. Und da es Regenaussichten gibt, denke ich, wir sollten auch Regenschirme mitnehmen.","fr":"Bien sûr. Et comme il y a des risques de pluie, je pense que nous devrions aussi apporter des parapluies.","es":"Por supuesto. Y como hay probabilidad de lluvia, creo que también deberíamos llevar paraguas.","pl":"Oczywiście. I ponieważ są prognozy deszczu, myślę, że powinniśmy zabrać ze sobą parasole.","it":"Certo. E poiché ci sono previsioni di pioggia, penso che dovremmo portare anche degli ombrelli.","sv":"Självklart. Och eftersom det finns risk för regn tror jag att vi borde ta med paraplyer också.","fi":"Tietenkin. Ja koska sateen mahdollisuus on olemassa, meidän pitäisi ottaa sateenvarjot mukaan.","ja":"もちろん。それと雨の予報もあるらしいので、傘も持っていかないといけなそうですね。","zh-CN":"当然。而且听说有雨，所以好像也要带伞。"}},{"speaker":"지수","text":"겨울이 오면 스키장도 개장하겠죠? 올 겨울에는 스키 배워보고 싶어요.","trans":{"en":"When winter comes, the ski resorts will open too, right? I want to try learning to ski this winter.","de":"Wenn der Winter kommt, werden auch die Skigebiete öffnen, oder? Ich möchte diesen Winter das Skifahren lernen.","fr":"Quand l'hiver arrivera, les stations de ski ouvriront aussi, non? Je veux essayer d'apprendre à skier cet hiver.","es":"Cuando llegue el invierno, también abrirán las estaciones de esquí, ¿verdad? Quiero intentar aprender a esquiar este invierno.","pl":"Gdy nadejdzie zima, stoki narciarskie też się otworzą, prawda? Chcę spróbować nauczyć się jeździć na nartach tej zimy.","it":"Quando arriverà l'inverno, apriranno anche le stazioni sciistiche, giusto? Voglio provare a imparare a sciare quest'inverno.","sv":"När vintern kommer öppnar skidanläggningarna också, eller hur? Jag vill försöka lära mig åka skidor i vinter.","fi":"Kun talvi tulee, hiihtokeskuksetkin aukeavat, eikö vain? Haluan yrittää oppia hiihtämään tänä talvena.","ja":"冬になったらスキー場もオープンしますよね？今年の冬はスキーを習ってみたいです。","zh-CN":"冬天来了滑雪场也会开放吧？今年冬天想试着学滑雪。"}},{"speaker":"민준","text":"저도 스키를 좋아하는데 같이 배워요! 한국 겨울은 건조하고 눈이 많이 오니까 스키 타기 딱 좋아요.","trans":{"en":"I like skiing too — let's learn together! Korean winters are dry and have a lot of snow, so it's perfect for skiing.","de":"Ich mag Skifahren auch — lass uns zusammen lernen! Der koreanische Winter ist trocken und hat viel Schnee, also ist er perfekt zum Skifahren.","fr":"J'aime aussi le ski — apprenons ensemble! Les hivers coréens sont secs et enneigés, c'est donc parfait pour faire du ski.","es":"A mí también me gusta esquiar — ¡aprendamos juntos! Los inviernos coreanos son secos y con mucha nieve, así que es perfecto para esquiar.","pl":"Ja też lubię narciarstwo — uczmy się razem! Koreańskie zimy są suche i śnieżne, więc to idealne warunki do narciarstwa.","it":"Anch'io amo lo sci — impariamo insieme! Gli inverni coreani sono secchi e nevosi, quindi è perfetto per sciare.","sv":"Jag gillar också skidåkning — låt oss lära oss tillsammans! Koreanska vintrar är torra och snörika, så det är perfekt för skidåkning.","fi":"Minäkin pidän hiihtämisestä — opitaan yhdessä! Korean talvet ovat kuivia ja lumisia, joten se on täydellinen hiihtämiseen.","ja":"私もスキーが好きなので一緒に習いましょう！韓国の冬は乾燥していて雪がたくさん降るのでスキーにぴったりですよ。","zh-CN":"我也喜欢滑雪，一起学吧！韩国冬天干燥雪多，非常适合滑雪。"}},{"speaker":"지수","text":"그럼 이번 주말 단풍 구경이 첫 번째 계절 활동이 되겠네요. 정말 기대돼요!","trans":{"en":"Then this weekend's leaf-peeping will be our first seasonal activity. I'm really looking forward to it!","de":"Dann wird der Laubgucken dieses Wochenende unsere erste saisonale Aktivität sein. Ich freue mich wirklich darauf!","fr":"Alors l'observation des feuilles ce week-end sera notre première activité saisonnière. J'ai vraiment hâte!","es":"Entonces la contemplación de las hojas este fin de semana será nuestra primera actividad estacional. ¡Tengo muchas ganas!","pl":"Więc obserwowanie liści w ten weekend będzie naszą pierwszą sezonową aktywnością. Naprawdę się na to cieszę!","it":"Allora guardare le foglie questo fine settimana sarà la nostra prima attività stagionale. Non vedo davvero l'ora!","sv":"Då blir bladspanandet i helgen vår första säsongsaktivitet. Jag ser verkligen fram emot det!","fi":"Sitten tämän viikonlopun lehtien katselu on ensimmäinen kausiluonteinen aktiviteettimme. Odotan sitä todella!","ja":"それなら今週末の紅葉狩りが最初の季節のアクティビティになりますね。本当に楽しみです！","zh-CN":"那么这个周末看红叶就是第一个季节活动了。真的很期待！"}},{"speaker":"민준","text":"저도요. 출발 시간은 이른 아침이 좋을 것 같아요. 주말에는 사람이 많이 몰리거든요.","trans":{"en":"Me too. I think early morning would be a good time to leave. Weekends get very crowded.","de":"Ich auch. Ich denke, der frühe Morgen wäre eine gute Abfahrtszeit. An Wochenenden wird es sehr voll.","fr":"Moi aussi. Je pense que partir tôt le matin serait bien. Les week-ends sont très fréquentés.","es":"Yo también. Creo que salir temprano por la mañana sería buena idea. Los fines de semana hay mucha gente.","pl":"Ja też. Myślę, że wczesny ranek byłby dobrą godziną wyjazdu. W weekendy jest bardzo tłoczno.","it":"Anch'io. Penso che la mattina presto sarebbe un buon orario di partenza. I fine settimana diventano molto affollati.","sv":"Jag med. Jag tror att tidig morgon skulle vara en bra avgångstid. Det blir väldigt trångt på helger.","fi":"Minäkin. Luulen, että aikainen aamu olisi hyvä lähtöaika. Viikonloppuisin on paljon väkeä.","ja":"私もです。出発は早朝がいいと思います。週末は人が多く集まりますから。","zh-CN":"我也是。我觉得出发时间最好是一大早。周末人很多。"}}],"vocab":[{"word":"변덕스럽다","trans":{"en":"to be unpredictable / fickle","de":"unbeständig / launisch sein","fr":"être imprévisible / capricieux","es":"ser impredecible / caprichoso","pl":"być nieprzewidywalnym / zmiennym","it":"essere imprevedibile / capriccioso","sv":"vara oförutsägbar / nyckfull","fi":"olla arvaamaton / oikukas","ja":"気まぐれだ / 変わりやすい","zh-CN":"多变的 / 反复无常的"}},{"word":"일교차","trans":{"en":"daily temperature range","de":"tägliche Temperaturschwankung","fr":"amplitude thermique diurne","es":"diferencia de temperatura diaria","pl":"dobowa amplituda temperatury","it":"escursione termica giornaliera","sv":"daglig temperaturskillnad","fi":"vuorokautinen lämpötilanvaihtelu","ja":"日較差","zh-CN":"日温差"}},{"word":"단풍","trans":{"en":"autumn foliage / fall colors","de":"Herbstlaub / Herbstfarben","fr":"feuillage d'automne / couleurs d'automne","es":"follaje otoñal / colores otoñales","pl":"jesienne liście / jesienne kolory","it":"fogliame autunnale / colori autunnali","sv":"höstlöv / höstfärger","fi":"syysvärit / lehtien ruska","ja":"紅葉","zh-CN":"红叶 / 秋叶"}},{"word":"절정","trans":{"en":"peak / climax","de":"Höhepunkt / Gipfelpunkt","fr":"apogée / point culminant","es":"punto álgido / apogeo","pl":"szczyt / punkt kulminacyjny","it":"apice / culmine","sv":"topp / kulmen","fi":"huippu / kulminaatiopiste","ja":"絶頂 / ピーク","zh-CN":"顶峰 / 高潮"}},{"word":"낙엽","trans":{"en":"fallen leaves","de":"gefallenes Laub","fr":"feuilles mortes / feuilles tombées","es":"hojas caídas","pl":"opadłe liście","it":"foglie cadute","sv":"fallna löv","fi":"pudonneet lehdet","ja":"落ち葉","zh-CN":"落叶"}},{"word":"예보","trans":{"en":"forecast","de":"Vorhersage","fr":"prévisions","es":"pronóstico","pl":"prognoza","it":"previsione","sv":"prognos","fi":"ennuste","ja":"予報","zh-CN":"预报"}},{"word":"개장하다","trans":{"en":"to open (a facility) for the season","de":"(eine Einrichtung) für die Saison öffnen","fr":"ouvrir (un établissement) pour la saison","es":"abrir (una instalación) para la temporada","pl":"otwierać (obiekt) na sezon","it":"aprire (una struttura) per la stagione","sv":"öppna (en anläggning) för säsongen","fi":"avata (laitos) kaudeksi","ja":"(施設が)開場する","zh-CN":"（设施）开业 / 开放"}},{"word":"몰리다","trans":{"en":"to crowd / to flock (to a place)","de":"sich drängen / strömen (zu einem Ort)","fr":"affluer / se presser (vers un endroit)","es":"aglomerarse / afluir (a un lugar)","pl":"tłoczyć się / gromadzić się (w miejscu)","it":"affollarsi / accalcarsi (in un posto)","sv":"trängas / strömma (till en plats)","fi":"tungeksia / virrata (paikkaan)","ja":"集まる / 殺到する","zh-CN":"聚集 / 涌向（某处）"}}],"patterns":[{"pattern":"-(으)ㄹ 수도 있으니까","patternTrans":{"en":"since it might / because there's a possibility that","de":"da es möglicherweise … könnte / weil die Möglichkeit besteht, dass","fr":"puisque cela pourrait / parce qu'il y a une possibilité que","es":"ya que podría / porque existe la posibilidad de que","pl":"ponieważ może / bo istnieje możliwość, że","it":"poiché potrebbe / perché c'è la possibilità che","sv":"eftersom det kanske / eftersom det finns en möjlighet att","fi":"koska saattaa / koska on mahdollisuus että","ja":"〜かもしれないから","zh-CN":"因为可能会…（表示原因）"},"example":"날씨가 또 변할 수도 있으니까 따뜻하게 입고 가야겠어요.","trans":{"en":"Since the weather might change again, we should dress warmly.","de":"Da sich das Wetter wieder ändern könnte, sollten wir uns warm anziehen.","fr":"Puisque le temps pourrait changer à nouveau, nous devrions nous habiller chaudement.","es":"Ya que el tiempo podría cambiar de nuevo, deberíamos vestirnos abrigados.","pl":"Ponieważ pogoda może znowu się zmienić, powinniśmy się ciepło ubrać.","it":"Poiché il tempo potrebbe cambiare di nuovo, dovremmo vestirci calorosamente.","sv":"Eftersom vädret kan förändras igen borde vi klä oss varmt.","fi":"Koska sää saattaa muuttua taas, meidän pitäisi pukeutua lämpimästi.","ja":"天気がまた変わるかもしれないので、暖かくして行かなければなりません。","zh-CN":"因为天气可能又会变，所以要穿暖和一点去。"}},{"pattern":"-아/어 버리다","patternTrans":{"en":"to do something completely / to end up doing (with a sense of completion or regret)","de":"etwas vollständig tun / es tun (mit einem Gefühl der Vollständigkeit oder des Bedauerns)","fr":"faire quelque chose complètement / finir par faire (avec un sens d'achèvement ou de regret)","es":"hacer algo completamente / terminar haciendo (con sentido de finalización o arrepentimiento)","pl":"zrobić coś całkowicie / skończyć robiąc (z poczuciem zakończenia lub żalu)","it":"fare qualcosa completamente / finire per fare (con senso di completamento o rimpianto)","sv":"göra något helt / sluta med att göra (med en känsla av fullbordande eller ånger)","fi":"tehdä jotain täysin / päätyä tekemään (täydellisyyden tai katumuksen tunteella)","ja":"〜してしまう（完了・残念の気持ちを込めて）","zh-CN":"（彻底地）做了…（表示完成或遗憾）"},"example":"오늘 날씨가 갑자기 많이 추워져 버렸어요.","trans":{"en":"The weather suddenly got really cold today (and now it's like this).","de":"Das Wetter wurde heute plötzlich richtig kalt (und jetzt ist es so).","fr":"Il fait soudainement très froid aujourd'hui (et maintenant c'est comme ça).","es":"Hoy el tiempo se puso de repente muy frío (y ahora es así).","pl":"Dziś pogoda nagle stała się bardzo zimna (i teraz tak jest).","it":"Oggi il tempo è diventato improvvisamente molto freddo (e ora è così).","sv":"Vädret blev plötsligt riktigt kallt idag (och nu är det så här).","fi":"Sää muuttui tänään yhtäkkiä todella kylmäksi (ja nyt se on näin).","ja":"今日は天気が急にとても寒くなってしまいました。","zh-CN":"今天天气突然变得很冷了（就变成这样了）。"}},{"pattern":"-(으)면 좋을 것 같다","patternTrans":{"en":"I think it would be good if / it seems like it would be better to","de":"Ich denke, es wäre gut, wenn / es scheint, als wäre es besser,","fr":"Je pense que ce serait bien si / il me semble que ce serait mieux de","es":"Creo que sería bueno si / parece que sería mejor","pl":"Myślę, że byłoby dobrze, gdyby / wydaje się, że byłoby lepiej","it":"Penso che sarebbe bene se / sembra che sarebbe meglio","sv":"Jag tror att det vore bra om / det verkar som om det vore bättre att","fi":"Luulen, että olisi hyvä jos / näyttää siltä, että olisi parempi","ja":"〜したら（すれば）いいと思う / 〜の方がよさそう","zh-CN":"我觉得如果…就好了 / 感觉…会更好"},"example":"출발 시간은 이른 아침이 좋을 것 같아요.","trans":{"en":"I think early morning would be a good time to leave.","de":"Ich denke, der frühe Morgen wäre eine gute Abfahrtszeit.","fr":"Je pense que partir tôt le matin serait une bonne idée.","es":"Creo que salir temprano por la mañana sería una buena hora para partir.","pl":"Myślę, że wczesny ranek byłby dobrą godziną wyjazdu.","it":"Penso che la mattina presto sarebbe un buon orario di partenza.","sv":"Jag tror att tidig morgon skulle vara en bra avgångstid.","fi":"Luulen, että aikainen aamu olisi hyvä lähtöaika.","ja":"出発時間は早朝がいいと思います。","zh-CN":"我觉得出发时间最好是一大早。"}}],"quizzes":[{"type":"이해","questionAudio":"두 사람은 이번 주말에 무엇을 할 계획인가요?","questionTrans":{"en":"What are the two people planning to do this weekend?","de":"Was planen die beiden Personen für dieses Wochenende?","fr":"Que prévoient les deux personnes pour ce week-end?","es":"¿Qué planean hacer las dos personas este fin de semana?","pl":"Co planują robić te dwie osoby w ten weekend?","it":"Cosa pianificano di fare le due persone questo fine settimana?","sv":"Vad planerar de två personerna att göra i helgen?","fi":"Mitä kaksi henkilöä suunnittelee tekevänsä tänä viikonloppuna?","ja":"二人は今週末何をする予定ですか？","zh-CN":"两人计划这个周末做什么？"},"options":[{"text":"스키장에 가기","trans":{"en":"Going to a ski resort","de":"In ein Skigebiet fahren","fr":"Aller dans une station de ski","es":"Ir a una estación de esquí","pl":"Pojechać na stok narciarski","it":"Andare in una stazione sciistica","sv":"Åka till ett skiidresort","fi":"Mennä hiihtokeskukseen","ja":"スキー場に行く","zh-CN":"去滑雪场"}},{"text":"산에 단풍 구경하러 가기","trans":{"en":"Going to the mountains to see fall foliage","de":"In die Berge fahren, um Herbstlaub zu sehen","fr":"Aller à la montagne voir le feuillage d'automne","es":"Ir a las montañas a ver el follaje otoñal","pl":"Pojechać w góry zobaczyć jesienne liście","it":"Andare in montagna a vedere le foglie autunnali","sv":"Åka till bergen för att se höstlöven","fi":"Mennä vuorille katsomaan syysvärejä","ja":"山に紅葉を見に行く","zh-CN":"去山里看红叶"}},{"text":"집에서 날씨 예보 보기","trans":{"en":"Watching weather forecasts at home","de":"Zu Hause Wettervorhersagen ansehen","fr":"Regarder les prévisions météo à la maison","es":"Ver pronósticos del tiempo en casa","pl":"Oglądać prognozy pogody w domu","it":"Guardare le previsioni del tempo a casa","sv":"Titta på väderprognoser hemma","fi":"Katsoa säänennusteita kotona","ja":"家で天気予報を見る","zh-CN":"在家看天气预报"}},{"text":"공원에서 낙엽 줍기","trans":{"en":"Picking up fallen leaves in the park","de":"Gefallenes Laub im Park aufsammeln","fr":"Ramasser des feuilles mortes dans le parc","es":"Recoger hojas caídas en el parque","pl":"Zbierać opadłe liście w parku","it":"Raccogliere foglie cadute nel parco","sv":"Plocka upp fallna löv i parken","fi":"Poimia pudonneita lehtiä puistossa","ja":"公園で落ち葉を拾う","zh-CN":"在公园捡落叶"}}],"answer":1,"explanation":"민준이 이번 주말에 단풍 구경하러 산에 가자고 제안했고, 지수가 동의했습니다."},{"type":"이해","questionAudio":"두 사람이 출발 시간으로 이른 아침을 선택한 이유는 무엇인가요?","questionTrans":{"en":"Why did the two people choose early morning as their departure time?","de":"Warum haben die beiden Personen den frühen Morgen als Abfahrtszeit gewählt?","fr":"Pourquoi les deux personnes ont-elles choisi tôt le matin comme heure de départ?","es":"¿Por qué las dos personas eligieron la madrugada como hora de salida?","pl":"Dlaczego te dwie osoby wybrały wczesny ranek jako godzinę wyjazdu?","it":"Perché le due persone hanno scelto la mattina presto come orario di partenza?","sv":"Varför valde de två personerna tidig morgon som avgångstid?","fi":"Miksi kaksi henkilöä valitsi aikaisen aamun lähtöajaksi?","ja":"二人が出発時間に早朝を選んだ理由は何ですか？","zh-CN":"两人为什么选择一大早出发？"},"options":[{"text":"아침에 단풍이 더 예쁘기 때문에","trans":{"en":"Because the fall colors are prettier in the morning","de":"Weil das Herbstlaub morgens schöner ist","fr":"Parce que les couleurs d'automne sont plus belles le matin","es":"Porque los colores otoñales son más bonitos por la mañana","pl":"Bo jesienne kolory są ładniejsze rano","it":"Perché i colori autunnali sono più belli al mattino","sv":"Eftersom höstfärgerna är vackrare på morgonen","fi":"Koska syysvärit ovat kauniimpia aamulla","ja":"朝の方が紅葉がきれいだから","zh-CN":"因为早上红叶更好看"}},{"text":"교통이 막히지 않도록","trans":{"en":"To avoid traffic jams","de":"Um Verkehrsstaus zu vermeiden","fr":"Pour éviter les embouteillages","es":"Para evitar atascos de tráfico","pl":"Żeby uniknąć korków","it":"Per evitare ingorghi stradali","sv":"För att undvika trafikstockning","fi":"Välttääkseen ruuhkan","ja":"交通渋滞を避けるために","zh-CN":"为了避免堵车"}},{"text":"주말에 사람이 많이 몰리기 때문에","trans":{"en":"Because a lot of people crowd in on weekends","de":"Weil an Wochenenden viele Menschen strömen","fr":"Parce que beaucoup de gens affluent le week-end","es":"Porque mucha gente se amontona los fines de semana","pl":"Bo w weekendy tłoczy się dużo ludzi","it":"Perché molte persone affluiscono nei fine settimana","sv":"Eftersom många människor trängs på helger","fi":"Koska viikonloppuisin on paljon ihmisiä tungoksessa","ja":"週末は人が多く集まるから","zh-CN":"因为周末人很多"}},{"text":"날씨가 오후에 나빠지기 때문에","trans":{"en":"Because the weather gets bad in the afternoon","de":"Weil das Wetter am Nachmittag schlecht wird","fr":"Parce que le temps devient mauvais l'après-midi","es":"Porque el tiempo empeora por la tarde","pl":"Bo pogoda pogarsza się po południu","it":"Perché il tempo peggiora nel pomeriggio","sv":"Eftersom vädret blir dåligt på eftermiddagen","fi":"Koska sää huononee iltapäivällä","ja":"午後に天気が悪くなるから","zh-CN":"因为下午天气会变差"}}],"answer":2,"explanation":"민준은 주말에는 사람이 많이 몰리기 때문에 이른 아침에 출발하는 것이 좋겠다고 했습니다."},{"type":"이해","questionAudio":"두 사람의 겨울 계획은 무엇인가요?","questionTrans":{"en":"What are the two people's winter plans?","de":"Was sind die Winterpläne der beiden Personen?","fr":"Quels sont les plans hivernaux des deux personnes?","es":"¿Cuáles son los planes invernales de las dos personas?","pl":"Jakie są zimowe plany tych dwóch osób?","it":"Quali sono i piani invernali delle due persone?","sv":"Vad är de två personernas vinterplaner?","fi":"Mitkä ovat kahden henkilön talvisuunnitelmat?","ja":"二人の冬の計画は何ですか？","zh-CN":"两人有什么冬天计划？"},"options":[{"text":"겨울 날씨를 피해서 해외여행 가기","trans":{"en":"Going abroad to escape the winter weather","de":"Ins Ausland reisen, um dem Winterwetter zu entfliehen","fr":"Partir à l'étranger pour fuir le temps hivernal","es":"Viajar al extranjero para escapar del tiempo invernal","pl":"Wyjechać za granicę, żeby uciec od zimowej pogody","it":"Andare all'estero per fuggire dal tempo invernale","sv":"Resa utomlands för att fly vintervädret","fi":"Matkustaa ulkomaille paetakseen talvisäätä","ja":"冬の天気を避けて海外旅行に行く","zh-CN":"为了躲避冬天的天气去海外旅行"}},{"text":"스키를 함께 배우기","trans":{"en":"Learning to ski together","de":"Gemeinsam Skifahren lernen","fr":"Apprendre à skier ensemble","es":"Aprender a esquiar juntos","pl":"Uczyć się razem jeździć na nartach","it":"Imparare a sciare insieme","sv":"Lära sig åka skidor tillsammans","fi":"Oppia hiihtämään yhdessä","ja":"一緒にスキーを習う","zh-CN":"一起学滑雪"}},{"text":"집에서 겨울을 따뜻하게 보내기","trans":{"en":"Spending the winter warmly at home","de":"Den Winter warm zu Hause verbringen","fr":"Passer l'hiver au chaud à la maison","es":"Pasar el invierno calurosamente en casa","pl":"Ciepło spędzić zimę w domu","it":"Trascorrere l'inverno calorosamente a casa","sv":"Tillbringa vintern varmt hemma","fi":"Viettää talvi lämpimästi kotona","ja":"家で暖かく冬を過ごす","zh-CN":"在家温暖地度过冬天"}},{"text":"눈 사진 찍으러 산에 가기","trans":{"en":"Going to the mountains to photograph snow","de":"In die Berge fahren, um Schnee zu fotografieren","fr":"Aller à la montagne pour photographier la neige","es":"Ir a las montañas a fotografiar la nieve","pl":"Pojechać w góry fotografować śnieg","it":"Andare in montagna a fotografare la neve","sv":"Åka till bergen för att fotografera snö","fi":"Mennä vuorille kuvaamaan lunta","ja":"山に雪の写真を撮りに行く","zh-CN":"去山里拍雪景"}}],"answer":1,"explanation":"지수는 올 겨울에 스키를 배우고 싶다고 했고, 민준도 스키를 좋아한다며 함께 배우자고 했습니다."}]},
  22: {"id":22,"title":"뉴스와 사회 이슈","titleTrans":{"en":"News and Social Issues","de":"Nachrichten und gesellschaftliche Themen","fr":"Actualités et problèmes sociaux","es":"Noticias y problemas sociales","pl":"Wiadomości i kwestie społeczne","it":"Notizie e questioni sociali","sv":"Nyheter och sociala frågor","fi":"Uutiset ja yhteiskunnalliset asiat","ja":"ニュースと社会問題","zh-CN":"新闻与社会议题"},"desc":"최근 뉴스를 보고 의견 나누기","descTrans":{"en":"Watching recent news and sharing opinions","de":"Aktuelle Nachrichten ansehen und Meinungen austauschen","fr":"Regarder les actualités récentes et partager des opinions","es":"Ver noticias recientes y compartir opiniones","pl":"Oglądanie najnowszych wiadomości i wymiana opinii","it":"Guardare le ultime notizie e condividere opinioni","sv":"Titta på senaste nyheterna och dela åsikter","fi":"Katsoa tuoreimpia uutisia ja jakaa mielipiteitä","ja":"最近のニュースを見て意見を交わす","zh-CN":"看最近的新闻并交换意见"},"dialogue":[{"speaker":"수진","text":"아, 오늘 뉴스 봤어요? 환경 오염 문제가 정말 심각해지고 있대요.","trans":{"en":"Oh, did you see the news today? They say the environmental pollution problem is getting really serious.","de":"Oh, haben Sie heute die Nachrichten gesehen? Es heißt, das Umweltverschmutzungsproblem wird wirklich ernst.","fr":"Oh, vous avez regardé les nouvelles aujourd'hui? Ils disent que le problème de pollution environnementale devient vraiment grave.","es":"Oh, ¿viste las noticias hoy? Dicen que el problema de la contaminación ambiental se está volviendo muy serio.","pl":"Oh, widziałeś/aś dziś wiadomości? Mówią, że problem zanieczyszczenia środowiska staje się naprawdę poważny.","it":"Oh, hai visto il telegiornale oggi? Dicono che il problema dell'inquinamento ambientale sta diventando davvero serio.","sv":"Åh, såg du nyheterna idag? De säger att miljöföroreningsproblemet blir verkligen allvarligt.","fi":"Ai, näitkö uutiset tänään? Sanotaan, että ympäristön saastumisen ongelma on tulossa todella vakavaksi.","ja":"あ、今日のニュース見ましたか？環境汚染問題が本当に深刻になってきているそうですよ。","zh-CN":"啊，今天看新闻了吗？说环境污染问题正在变得越来越严重。"}},{"speaker":"태양","text":"네, 저도 봤어요. 특히 미세먼지 수치가 매년 높아지고 있다는 보도가 충격적이었어요.","trans":{"en":"Yes, I saw it too. The report that fine dust levels are rising every year was particularly shocking.","de":"Ja, ich habe es auch gesehen. Besonders der Bericht, dass die Feinstaubwerte jedes Jahr steigen, war schockierend.","fr":"Oui, je l'ai vu aussi. Le rapport indiquant que les niveaux de particules fines augmentent chaque année était particulièrement choquant.","es":"Sí, yo también lo vi. El informe de que los niveles de partículas finas aumentan cada año fue particularmente impactante.","pl":"Tak, ja też widziałem/am. Szczególnie szokujący był raport o tym, że poziomy pyłu drobnego rosną z roku na rok.","it":"Sì, l'ho visto anch'io. Il rapporto che i livelli di polvere fine stanno aumentando ogni anno era particolarmente scioccante.","sv":"Ja, jag såg det också. Rapporten om att nivåerna av finpartiklar stiger varje år var särskilt chockerande.","fi":"Kyllä, näin senkin. Erityisesti raportti siitä, että hienopölytasot nousevat joka vuosi, oli järkyttävä.","ja":"はい、私も見ました。特に微細粉塵の数値が毎年上昇しているという報道が衝撃的でした。","zh-CN":"是的，我也看了。尤其是关于细颗粒物浓度每年都在升高的报道，真的很震惊。"}},{"speaker":"수진","text":"맞아요. 정부에서 대책을 세우고 있다고는 하지만 실질적인 변화가 느껴지지 않아요.","trans":{"en":"That's right. They say the government is working on countermeasures, but I don't feel any real change.","de":"Stimmt. Sie sagen, die Regierung arbeitet an Gegenmaßnahmen, aber ich spüre keine wirkliche Veränderung.","fr":"C'est vrai. Ils disent que le gouvernement travaille sur des contre-mesures, mais je ne ressens aucun changement réel.","es":"Es verdad. Dicen que el gobierno está trabajando en contramedidas, pero no siento ningún cambio real.","pl":"Zgadza się. Mówią, że rząd pracuje nad środkami zaradczymi, ale nie odczuwam żadnej realnej zmiany.","it":"Esatto. Dicono che il governo sta lavorando a contromisure, ma non sento alcun cambiamento reale.","sv":"Just det. De säger att regeringen arbetar med motåtgärder, men jag känner ingen verklig förändring.","fi":"Juuri niin. Sanotaan, että hallitus työskentelee vastatoimien parissa, mutta en tunne mitään todellista muutosta.","ja":"そうですね。政府が対策を立てているとは言いますが、実質的な変化は感じられません。","zh-CN":"对。虽然说政府在制定对策，但感觉不到实质性的变化。"}},{"speaker":"태양","text":"저도 그렇게 생각해요. 개인이 노력하는 것만으로는 한계가 있고 기업이나 국가 차원의 정책이 필요하죠.","trans":{"en":"I think so too. Individual effort alone has its limits, and we need policies at the corporate or national level.","de":"Das denke ich auch. Individuelle Anstrengungen allein haben ihre Grenzen, und wir brauchen Maßnahmen auf Unternehmens- oder nationaler Ebene.","fr":"Je pense pareil. Les efforts individuels à eux seuls ont leurs limites, et nous avons besoin de politiques au niveau des entreprises ou national.","es":"Yo también lo pienso. Los esfuerzos individuales por sí solos tienen sus límites, y necesitamos políticas a nivel corporativo o nacional.","pl":"Też tak myślę. Indywidualne wysiłki mają swoje granice i potrzebne są polityki na poziomie korporacyjnym lub krajowym.","it":"Anch'io la penso così. Gli sforzi individuali da soli hanno i loro limiti, e abbiamo bisogno di politiche a livello aziendale o nazionale.","sv":"Jag håller med. Individuella ansträngningar ensamt har sina begränsningar, och vi behöver policyer på företags- eller nationell nivå.","fi":"Minäkin ajattelen niin. Yksilön ponnistelut yksinään ovat rajalliset, ja tarvitsemme käytäntöjä yritysten tai kansallisella tasolla.","ja":"私もそう思います。個人が努力するだけでは限界があり、企業や国家レベルの政策が必要ですよね。","zh-CN":"我也这么想。只靠个人努力有限，需要企业或国家层面的政策。"}},{"speaker":"수진","text":"그런데 뉴스를 보다 보면 부정적인 내용이 너무 많아서 가끔 보기가 싫어질 때도 있어요.","trans":{"en":"But when you keep watching the news, there's so much negative content that sometimes you don't want to watch it.","de":"Aber wenn man die Nachrichten weiter schaut, gibt es so viele negative Inhalte, dass man sie manchmal nicht mehr sehen möchte.","fr":"Mais quand on continue de regarder les nouvelles, il y a tellement de contenu négatif qu'on ne veut parfois plus les regarder.","es":"Pero cuando sigues viendo las noticias, hay tanto contenido negativo que a veces no quieres verlas.","pl":"Ale kiedy oglądasz wiadomości, jest tyle negatywnych treści, że czasem nie chce się ich oglądać.","it":"Ma quando continui a guardare le notizie, c'è così tanto contenuto negativo che a volte non vuoi guardarle.","sv":"Men när man fortsätter att titta på nyheterna är det så mycket negativt innehåll att man ibland inte vill titta.","fi":"Mutta kun katselee uutisia jatkuvasti, siellä on niin paljon negatiivista sisältöä, että joskus ei haluaisi katsoa.","ja":"でも、ニュースを見続けると、ネガティブな内容が多すぎて、時々見たくなくなることもありますよね。","zh-CN":"但是一直看新闻的话，负面内容太多，有时候会不想看。"}},{"speaker":"태양","text":"그 마음 이해해요. 하지만 사회 이슈에 관심을 갖는 것이 시민으로서 중요한 태도라고 생각해요.","trans":{"en":"I understand that feeling. But I think showing interest in social issues is an important attitude as a citizen.","de":"Das verstehe ich. Aber ich denke, Interesse an sozialen Themen zu zeigen ist eine wichtige Haltung als Bürger.","fr":"Je comprends ce sentiment. Mais je pense que s'intéresser aux questions sociales est une attitude importante en tant que citoyen.","es":"Entiendo ese sentimiento. Pero creo que mostrar interés en los problemas sociales es una actitud importante como ciudadano.","pl":"Rozumiem to uczucie. Ale myślę, że interesowanie się kwestiami społecznymi jest ważną postawą jako obywatel.","it":"Capisco quella sensazione. Ma penso che mostrare interesse per le questioni sociali sia un atteggiamento importante come cittadino.","sv":"Jag förstår den känslan. Men jag tror att visa intresse för sociala frågor är en viktig inställning som medborgare.","fi":"Ymmärrän sen tunteen. Mutta mielestäni kiinnostuksen osoittaminen yhteiskunnallisia asioita kohtaan on tärkeä asenne kansalaisena.","ja":"その気持ちわかります。でも、社会問題に関心を持つことは市民として大切な態度だと思います。","zh-CN":"我理解这种感觉。但我认为，作为公民，关注社会议题是一种重要的态度。"}},{"speaker":"수진","text":"맞아요. 그래서 저는 요즘 신뢰할 수 있는 언론사의 기사만 골라서 읽으려고 노력해요.","trans":{"en":"Right. So lately I've been trying to selectively read only articles from reliable news outlets.","de":"Stimmt. Deshalb versuche ich neuerdings, nur Artikel von zuverlässigen Nachrichtenmedien auszuwählen und zu lesen.","fr":"C'est vrai. C'est pourquoi ces derniers temps, j'essaie de sélectionner et lire uniquement des articles de médias fiables.","es":"Exacto. Por eso últimamente intento seleccionar y leer solo artículos de medios de comunicación confiables.","pl":"Racja. Dlatego ostatnio staram się wybierać i czytać tylko artykuły z wiarygodnych mediów.","it":"Giusto. Ecco perché ultimamente cerco di selezionare e leggere solo articoli da fonti di notizie affidabili.","sv":"Just det. Därför försöker jag nuförtiden selektivt läsa endast artiklar från pålitliga nyhetsmedier.","fi":"Aivan. Siksi olen viime aikoina yrittänyt lukea valikoivasti vain artikkeleita luotettavista uutislähteistä.","ja":"そうですね。だから最近は、信頼できるメディアの記事だけを選んで読むように心がけています。","zh-CN":"对。所以我最近努力只选择阅读可信媒体的文章。"}},{"speaker":"태양","text":"좋은 방법이에요. 요즘은 가짜 뉴스도 많으니까 정보를 비판적으로 받아들이는 능력이 중요하죠.","trans":{"en":"That's a good approach. There's a lot of fake news these days, so the ability to receive information critically is important.","de":"Das ist ein guter Ansatz. Es gibt heutzutage viele Fake News, daher ist die Fähigkeit, Informationen kritisch aufzunehmen, wichtig.","fr":"C'est une bonne approche. Il y a beaucoup de fausses nouvelles de nos jours, donc la capacité à recevoir l'information de manière critique est importante.","es":"Es un buen enfoque. Hay mucha desinformación hoy en día, por lo que la capacidad de recibir información críticamente es importante.","pl":"To dobre podejście. Dziś jest dużo fałszywych wiadomości, więc ważna jest zdolność do krytycznego odbioru informacji.","it":"È un buon approccio. Ci sono molte notizie false oggi, quindi la capacità di ricevere le informazioni in modo critico è importante.","sv":"Det är ett bra tillvägagångssätt. Det finns mycket falska nyheter nuförtiden, så förmågan att ta emot information kritiskt är viktig.","fi":"Se on hyvä lähestymistapa. Nykyään on paljon valeuutisia, joten kyky vastaanottaa tietoa kriittisesti on tärkeää.","ja":"それはいい方法ですね。最近はフェイクニュースも多いので、情報を批判的に受け取る能力が大切ですよね。","zh-CN":"这是个好方法。现在假新闻也很多，所以批判性地接收信息的能力很重要。"}},{"speaker":"수진","text":"환경 문제 외에도 고령화 사회 문제도 심각하던데, 태양 씨는 어떻게 생각해요?","trans":{"en":"Besides environmental issues, the aging society problem also seems serious — what do you think about it, Taeyang?","de":"Neben Umweltproblemen scheint auch das Problem der alternden Gesellschaft ernst zu sein — was denken Sie darüber, Taeyang?","fr":"En plus des problèmes environnementaux, le problème du vieillissement de la société semble également sérieux — qu'en pensez-vous, Taeyang?","es":"Además de los problemas ambientales, el problema del envejecimiento de la sociedad también parece serio — ¿qué piensas, Taeyang?","pl":"Oprócz problemów środowiskowych, problem starzejącego się społeczeństwa też wydaje się poważny — co o tym myślisz, Taeyang?","it":"Oltre ai problemi ambientali, anche il problema dell'invecchiamento della società sembra serio — cosa ne pensi, Taeyang?","sv":"Förutom miljöproblem verkar åldringssamhällets problem också vara allvarligt — vad tycker du om det, Taeyang?","fi":"Ympäristöongelmien lisäksi ikääntyvän yhteiskunnan ongelma vaikuttaa myös vakavalta — mitä mieltä olet, Taeyang?","ja":"環境問題のほかにも、高齢化社会の問題も深刻みたいですが、テヤンさんはどう思いますか？","zh-CN":"除了环境问题，老龄化社会问题也很严重，太阳你怎么看？"}},{"speaker":"태양","text":"고령화 문제는 복지 예산이나 젊은 세대 부담과도 연결되어 있어서 사회 전체가 함께 해결해야 할 과제라고 생각해요.","trans":{"en":"The aging problem is connected to welfare budgets and the burden on younger generations, so I think it's a challenge the whole society needs to solve together.","de":"Das Alterungsproblem ist mit Sozialbudgets und der Belastung jüngerer Generationen verbunden, daher denke ich, es ist eine Herausforderung, die die gesamte Gesellschaft gemeinsam lösen muss.","fr":"Le problème du vieillissement est lié aux budgets de protection sociale et au fardeau des jeunes générations, donc je pense que c'est un défi que toute la société doit résoudre ensemble.","es":"El problema del envejecimiento está relacionado con los presupuestos de bienestar y la carga de las generaciones más jóvenes, por lo que creo que es un desafío que toda la sociedad debe resolver juntos.","pl":"Problem starzenia się jest powiązany z budżetami opieki społecznej i obciążeniem młodszych pokoleń, więc myślę, że jest to wyzwanie, które całe społeczeństwo musi wspólnie rozwiązać.","it":"Il problema dell'invecchiamento è collegato ai budget del welfare e al peso sulle generazioni più giovani, quindi penso che sia una sfida che tutta la società deve risolvere insieme.","sv":"Åldringsproblemet är kopplat till välfärdsbudgetar och bördan för yngre generationer, så jag tror att det är en utmaning som hela samhället måste lösa tillsammans.","fi":"Ikääntymisen ongelma on yhteydessä hyvinvointibudjetteihin ja nuorten sukupolvien taakkaan, joten mielestäni se on haaste, jonka koko yhteiskunnan täytyy ratkaista yhdessä.","ja":"高齢化問題は福祉予算や若い世代の負担とも結びついているので、社会全体が一緒に解決しなければならない課題だと思います。","zh-CN":"老龄化问题与福利预算和年轻一代的负担有关，我认为这是需要整个社会共同解决的课题。"}}],"vocab":[{"word":"환경 오염","trans":{"en":"environmental pollution","de":"Umweltverschmutzung","fr":"pollution environnementale","es":"contaminación ambiental","pl":"zanieczyszczenie środowiska","it":"inquinamento ambientale","sv":"miljöförorening","fi":"ympäristön saastuminen","ja":"環境汚染","zh-CN":"环境污染"}},{"word":"미세먼지","trans":{"en":"fine dust / particulate matter (PM2.5)","de":"Feinstaub","fr":"particules fines / poussière fine","es":"polvo fino / partículas finas","pl":"pył drobny / cząsteczki stałe","it":"polvere fine / particolato","sv":"finpartiklar / finDust","fi":"hienopöly / pienhiukkaset","ja":"微細粉塵 / PM2.5","zh-CN":"细颗粒物 / PM2.5"}},{"word":"대책","trans":{"en":"countermeasure / measures","de":"Gegenmaßnahme / Maßnahmen","fr":"contre-mesure / mesures","es":"contramedida / medidas","pl":"środek zaradczy / środki","it":"contromisura / misure","sv":"motåtgärd / åtgärder","fi":"vastatoimi / toimenpiteet","ja":"対策","zh-CN":"对策 / 措施"}},{"word":"비판적","trans":{"en":"critical (thinking)","de":"kritisch (Denken)","fr":"critique (pensée)","es":"crítico (pensamiento)","pl":"krytyczny (myślenie)","it":"critico (pensiero)","sv":"kritisk (tänkande)","fi":"kriittinen (ajattelu)","ja":"批判的（思考）","zh-CN":"批判性的（思维）"}},{"word":"가짜 뉴스","trans":{"en":"fake news","de":"Falschmeldungen / Fake News","fr":"fausses nouvelles / fake news","es":"noticias falsas / fake news","pl":"fałszywe wiadomości / fake news","it":"notizie false / fake news","sv":"falska nyheter / fake news","fi":"valeuutiset / fake news","ja":"フェイクニュース","zh-CN":"假新闻"}},{"word":"고령화 사회","trans":{"en":"aging society","de":"alternde Gesellschaft","fr":"société vieillissante","es":"sociedad envejeciente","pl":"starzejące się społeczeństwo","it":"società che invecchia","sv":"åldrande samhälle","fi":"ikääntyvä yhteiskunta","ja":"高齢化社会","zh-CN":"老龄化社会"}},{"word":"언론사","trans":{"en":"news outlet / media organization","de":"Nachrichtenmedium / Medienorganisation","fr":"organe de presse / organisation médiatique","es":"medio de comunicación / organización de medios","pl":"organ prasowy / organizacja medialna","it":"organo di stampa / organizzazione mediatica","sv":"nyhetsmedium / medieorganisation","fi":"uutismedia / mediaorganisaatio","ja":"メディア / 報道機関","zh-CN":"媒体 / 新闻机构"}},{"word":"복지","trans":{"en":"welfare / well-being","de":"Wohlfahrt / Wohlbefinden","fr":"bien-être / aide sociale","es":"bienestar / asistencia social","pl":"dobrobyt / opieka społeczna","it":"benessere / assistenza sociale","sv":"välfärd / välmående","fi":"hyvinvointi / sosiaaliturva","ja":"福祉","zh-CN":"福利 / 福祉"}}],"patterns":[{"pattern":"-다고는 하지만","patternTrans":{"en":"they say that … but / although it is said that","de":"Sie sagen zwar, dass … aber / obwohl es heißt, dass","fr":"on dit que … mais / bien qu'il soit dit que","es":"dicen que … pero / aunque se dice que","pl":"mówią, że … ale / chociaż mówi się, że","it":"dicono che … ma / sebbene si dica che","sv":"de säger att … men / fastän det sägs att","fi":"sanotaan, että … mutta / vaikka sanotaan, että","ja":"〜とは言いますが / 〜と言われていますが","zh-CN":"虽然说…但是（表示转折）"},"example":"정부에서 대책을 세우고 있다고는 하지만 실질적인 변화가 느껴지지 않아요.","trans":{"en":"They say the government is working on countermeasures, but I don't feel any real change.","de":"Sie sagen, die Regierung arbeitet an Gegenmaßnahmen, aber ich spüre keine wirkliche Veränderung.","fr":"On dit que le gouvernement travaille sur des contre-mesures, mais je ne ressens aucun changement réel.","es":"Dicen que el gobierno está trabajando en contramedidas, pero no siento ningún cambio real.","pl":"Mówią, że rząd pracuje nad środkami zaradczymi, ale nie odczuwam żadnej realnej zmiany.","it":"Dicono che il governo sta lavorando a contromisure, ma non sento alcun cambiamento reale.","sv":"De säger att regeringen arbetar med motåtgärder, men jag känner ingen verklig förändring.","fi":"Sanotaan, että hallitus työskentelee vastatoimien parissa, mutta en tunne mitään todellista muutosta.","ja":"政府が対策を立てているとは言いますが、実質的な変化は感じられません。","zh-CN":"虽然说政府在制定对策，但感觉不到实质性的变化。"}},{"pattern":"-(으)ㄹ 뿐만 아니라","patternTrans":{"en":"not only … but also","de":"nicht nur … sondern auch","fr":"non seulement … mais aussi","es":"no solo … sino también","pl":"nie tylko … ale także","it":"non solo … ma anche","sv":"inte bara … utan också","fi":"ei vain … vaan myös","ja":"〜だけでなく、〜も","zh-CN":"不仅…而且…"},"example":"환경 문제는 개인의 건강에 영향을 줄 뿐만 아니라 경제에도 큰 영향을 미칩니다.","trans":{"en":"Environmental problems not only affect individual health but also have a big impact on the economy.","de":"Umweltprobleme beeinflussen nicht nur die individuelle Gesundheit, sondern haben auch große Auswirkungen auf die Wirtschaft.","fr":"Les problèmes environnementaux n'affectent pas seulement la santé individuelle mais ont aussi un grand impact sur l'économie.","es":"Los problemas ambientales no solo afectan la salud individual sino que también tienen un gran impacto en la economía.","pl":"Problemy środowiskowe nie tylko wpływają na zdrowie jednostki, ale mają też duży wpływ na gospodarkę.","it":"I problemi ambientali non solo influenzano la salute individuale ma hanno anche un grande impatto sull'economia.","sv":"Miljöproblem påverkar inte bara individuell hälsa utan har också stor inverkan på ekonomin.","fi":"Ympäristöongelmat eivät vain vaikuta yksilön terveyteen vaan vaikuttavat myös suuresti talouteen.","ja":"環境問題は個人の健康に影響するだけでなく、経済にも大きな影響を与えます。","zh-CN":"环境问题不仅影响个人健康，也对经济产生重大影响。"}},{"pattern":"-와/과도 연결되어 있다","patternTrans":{"en":"is also connected to / is also linked to","de":"ist auch verbunden mit / ist auch verknüpft mit","fr":"est aussi lié à / est aussi connecté à","es":"también está conectado a / también está vinculado a","pl":"jest też połączone z / jest też powiązane z","it":"è anche collegato a / è anche legato a","sv":"är också kopplat till / är också länkat till","fi":"on myös yhteydessä / on myös kytketty","ja":"〜とも繋がっている / 〜とも関係している","zh-CN":"也与…有关联 / 也与…相连"},"example":"고령화 문제는 복지 예산이나 젊은 세대 부담과도 연결되어 있어요.","trans":{"en":"The aging problem is also connected to welfare budgets and the burden on younger generations.","de":"Das Alterungsproblem ist auch mit Sozialbudgets und der Belastung jüngerer Generationen verbunden.","fr":"Le problème du vieillissement est aussi lié aux budgets de protection sociale et au fardeau des jeunes générations.","es":"El problema del envejecimiento también está vinculado a los presupuestos de bienestar y la carga de las generaciones más jóvenes.","pl":"Problem starzenia się jest też powiązany z budżetami opieki społecznej i obciążeniem młodszych pokoleń.","it":"Il problema dell'invecchiamento è anche collegato ai budget del welfare e al peso sulle generazioni più giovani.","sv":"Åldringsproblemet är också kopplat till välfärdsbudgetar och bördan för yngre generationer.","fi":"Ikääntymisen ongelma on myös yhteydessä hyvinvointibudjetteihin ja nuorten sukupolvien taakkaan.","ja":"高齢化問題は福祉予算や若い世代の負担とも連結しています。","zh-CN":"老龄化问题也与福利预算和年轻一代的负担有关联。"}}],"quizzes":[{"type":"이해","questionAudio":"수진과 태양이 주로 이야기하는 뉴스 주제는 무엇인가요?","questionTrans":{"en":"What is the main news topic that Sujin and Taeyang are talking about?","de":"Was ist das Hauptnachrichtenthema, über das Sujin und Taeyang sprechen?","fr":"Quel est le principal sujet d'actualité dont parlent Sujin et Taeyang?","es":"¿Cuál es el tema de noticias principal del que hablan Sujin y Taeyang?","pl":"Jaki jest główny temat wiadomości, o którym rozmawiają Sujin i Taeyang?","it":"Qual è il principale argomento di notizie di cui parlano Sujin e Taeyang?","sv":"Vilket är det huvudsakliga nyhetstema som Sujin och Taeyang pratar om?","fi":"Mikä on pääasiallinen uutisteema, josta Sujin ja Taeyang puhuvat?","ja":"スジンとテヤンが主に話しているニュースのトピックは何ですか？","zh-CN":"秀珍和太阳主要聊的新闻话题是什么？"},"options":[{"text":"경제 성장","trans":{"en":"Economic growth","de":"Wirtschaftswachstum","fr":"Croissance économique","es":"Crecimiento económico","pl":"Wzrost gospodarczy","it":"Crescita economica","sv":"Ekonomisk tillväxt","fi":"Taloudellinen kasvu","ja":"経済成長","zh-CN":"经济增长"}},{"text":"환경 오염과 사회 이슈","trans":{"en":"Environmental pollution and social issues","de":"Umweltverschmutzung und gesellschaftliche Themen","fr":"Pollution environnementale et problèmes sociaux","es":"Contaminación ambiental y problemas sociales","pl":"Zanieczyszczenie środowiska i kwestie społeczne","it":"Inquinamento ambientale e questioni sociali","sv":"Miljöförorening och sociala frågor","fi":"Ympäristön saastuminen ja yhteiskunnalliset asiat","ja":"環境汚染と社会問題","zh-CN":"环境污染与社会议题"}},{"text":"스포츠 소식","trans":{"en":"Sports news","de":"Sportnachrichten","fr":"Actualités sportives","es":"Noticias deportivas","pl":"Wiadomości sportowe","it":"Notizie sportive","sv":"Sportnyheter","fi":"Urheiluurutiset","ja":"スポーツニュース","zh-CN":"体育新闻"}},{"text":"문화 예술 행사","trans":{"en":"Cultural and art events","de":"Kultur- und Kunstveranstaltungen","fr":"Événements culturels et artistiques","es":"Eventos culturales y artísticos","pl":"Wydarzenie kulturalne i artystyczne","it":"Eventi culturali e artistici","sv":"Kulturella och konstnärliga evenemang","fi":"Kulttuuri- ja taidetapahtumat","ja":"文化芸術イベント","zh-CN":"文化艺术活动"}}],"answer":1,"explanation":"두 사람은 주로 환경 오염(미세먼지, 환경 대책)과 고령화 사회 문제 등 사회 이슈에 대해 이야기했습니다."},{"type":"이해","questionAudio":"수진이 뉴스를 볼 때 어떤 방식을 선택했나요?","questionTrans":{"en":"What approach did Sujin choose when watching the news?","de":"Welchen Ansatz hat Sujin beim Nachrichtenansehen gewählt?","fr":"Quelle approche Sujin a-t-elle choisie pour regarder les nouvelles?","es":"¿Qué enfoque eligió Sujin al ver las noticias?","pl":"Jakie podejście wybrała Sujin podczas oglądania wiadomości?","it":"Quale approccio ha scelto Sujin nel guardare le notizie?","sv":"Vilket tillvägagångssätt valde Sujin när hon tittade på nyheterna?","fi":"Minkä lähestymistavan Sujin valitsi uutisia katsoessaan?","ja":"スジンはニュースを見るときどんな方法を選びましたか？","zh-CN":"秀珍选择了什么方式来看新闻？"},"options":[{"text":"SNS에서 뉴스를 공유한다","trans":{"en":"Shares news on social media","de":"Teilt Nachrichten in sozialen Medien","fr":"Partage des nouvelles sur les réseaux sociaux","es":"Comparte noticias en redes sociales","pl":"Udostępnia wiadomości w mediach społecznościowych","it":"Condivide notizie sui social media","sv":"Delar nyheter i sociala medier","fi":"Jakaa uutisia sosiaalisessa mediassa","ja":"SNSでニュースをシェアする","zh-CN":"在社交媒体上分享新闻"}},{"text":"신뢰할 수 있는 언론사의 기사만 읽는다","trans":{"en":"Reads only articles from reliable news outlets","de":"Liest nur Artikel von zuverlässigen Nachrichtenmedien","fr":"Lit uniquement des articles de sources d'information fiables","es":"Lee solo artículos de medios de comunicación confiables","pl":"Czyta tylko artykuły z wiarygodnych mediów","it":"Legge solo articoli da fonti di notizie affidabili","sv":"Läser endast artiklar från pålitliga nyhetsmedier","fi":"Lukee vain artikkeleita luotettavista uutislähteistä","ja":"信頼できるメディアの記事だけを読む","zh-CN":"只读可信媒体的文章"}},{"text":"뉴스를 전혀 보지 않는다","trans":{"en":"Doesn't watch the news at all","de":"Schaut sich überhaupt keine Nachrichten an","fr":"Ne regarde pas du tout les informations","es":"No ve las noticias en absoluto","pl":"W ogóle nie ogląda wiadomości","it":"Non guarda affatto le notizie","sv":"Tittar inte på nyheterna alls","fi":"Ei katso uutisia lainkaan","ja":"ニュースを全く見ない","zh-CN":"完全不看新闻"}},{"text":"매일 모든 뉴스를 다 읽는다","trans":{"en":"Reads all news every day","de":"Liest täglich alle Nachrichten","fr":"Lit toutes les nouvelles tous les jours","es":"Lee todas las noticias todos los días","pl":"Czyta wszystkie wiadomości codziennie","it":"Legge tutte le notizie ogni giorno","sv":"Läser alla nyheter varje dag","fi":"Lukee kaikki uutiset joka päivä","ja":"毎日すべてのニュースを読む","zh-CN":"每天读所有新闻"}}],"answer":1,"explanation":"수진은 부정적인 뉴스가 너무 많다고 느끼고, 신뢰할 수 있는 언론사의 기사만 골라서 읽으려고 노력한다고 했습니다."},{"type":"이해","questionAudio":"태양은 사회 이슈에 관심을 갖는 것이 왜 중요하다고 했나요?","questionTrans":{"en":"Why did Taeyang say it's important to be interested in social issues?","de":"Warum sagte Taeyang, dass es wichtig ist, sich für gesellschaftliche Themen zu interessieren?","fr":"Pourquoi Taeyang a-t-il dit qu'il est important de s'intéresser aux questions sociales?","es":"¿Por qué dijo Taeyang que es importante interesarse en los problemas sociales?","pl":"Dlaczego Taeyang powiedział, że ważne jest interesowanie się kwestiami społecznymi?","it":"Perché Taeyang ha detto che è importante interessarsi alle questioni sociali?","sv":"Varför sa Taeyang att det är viktigt att vara intresserad av sociala frågor?","fi":"Miksi Taeyang sanoi, että on tärkeää olla kiinnostunut yhteiskunnallisista asioista?","ja":"テヤンはなぜ社会問題に関心を持つことが大切だと言いましたか？","zh-CN":"太阳为什么说关注社会议题很重要？"},"options":[{"text":"뉴스를 많이 보면 공부가 되기 때문에","trans":{"en":"Because watching a lot of news is educational","de":"Weil viele Nachrichten zu sehen lehrreich ist","fr":"Parce que regarder beaucoup de nouvelles est éducatif","es":"Porque ver muchas noticias es educativo","pl":"Bo oglądanie dużo wiadomości jest edukacyjne","it":"Perché guardare molte notizie è educativo","sv":"Eftersom att titta på mycket nyheter är lärorikt","fi":"Koska paljon uutisten katsominen on opettavaista","ja":"ニュースをたくさん見ると勉強になるから","zh-CN":"因为多看新闻有教育意义"}},{"text":"직업을 얻는 데 도움이 되기 때문에","trans":{"en":"Because it helps in getting a job","de":"Weil es bei der Jobsuche hilft","fr":"Parce que cela aide à trouver un emploi","es":"Porque ayuda a conseguir empleo","pl":"Bo pomaga w znalezieniu pracy","it":"Perché aiuta a trovare un lavoro","sv":"Eftersom det hjälper att få ett jobb","fi":"Koska se auttaa saamaan työn","ja":"仕事を得るのに役立つから","zh-CN":"因为有助于找工作"}},{"text":"시민으로서 중요한 태도이기 때문에","trans":{"en":"Because it is an important attitude as a citizen","de":"Weil es eine wichtige Haltung als Bürger ist","fr":"Parce que c'est une attitude importante en tant que citoyen","es":"Porque es una actitud importante como ciudadano","pl":"Bo jest to ważna postawa jako obywatel","it":"Perché è un atteggiamento importante come cittadino","sv":"Eftersom det är en viktig inställning som medborgare","fi":"Koska se on tärkeä asenne kansalaisena","ja":"市民として大切な態度だから","zh-CN":"因为作为公民这是重要的态度"}},{"text":"뉴스가 재미있기 때문에","trans":{"en":"Because the news is interesting","de":"Weil die Nachrichten interessant sind","fr":"Parce que les nouvelles sont intéressantes","es":"Porque las noticias son interesantes","pl":"Bo wiadomości są interesujące","it":"Perché le notizie sono interessanti","sv":"Eftersom nyheterna är intressanta","fi":"Koska uutiset ovat mielenkiintoisia","ja":"ニュースが面白いから","zh-CN":"因为新闻有趣"}}],"answer":2,"explanation":"태양은 수진이 뉴스 보기 싫다고 했을 때, 사회 이슈에 관심을 갖는 것이 시민으로서 중요한 태도라고 말했습니다."}]},
  23: {"id":23,"title":"직장 회의","titleTrans":{"en":"Work Meeting","de":"Arbeitsbesprechung","fr":"Réunion de travail","es":"Reunión de trabajo","pl":"Spotkanie w pracy","it":"Riunione di lavoro","sv":"Arbetsmöte","fi":"Työpalaveri","ja":"職場の会議","zh-CN":"职场会议"},"desc":"회의에서 의견 제시하고 결정 내리기","descTrans":{"en":"Presenting opinions and making decisions in a meeting","de":"Meinungen äußern und Entscheidungen in einer Besprechung treffen","fr":"Présenter des opinions et prendre des décisions lors d'une réunion","es":"Presentar opiniones y tomar decisiones en una reunión","pl":"Przedstawianie opinii i podejmowanie decyzji na spotkaniu","it":"Presentare opinioni e prendere decisioni in una riunione","sv":"Presentera åsikter och fatta beslut på ett möte","fi":"Mielipiteiden esittäminen ja päätösten tekeminen kokouksessa","ja":"会議で意見を述べ、決定を下す","zh-CN":"在会议中提出意见并做出决策"},"dialogue":[{"speaker":"지훈","text":"오늘 회의를 시작하겠습니다. 먼저 지난주 판매 실적을 검토해 봅시다.","trans":{"en":"Let's start today's meeting. First, let's review last week's sales performance.","de":"Lassen Sie uns die heutige Besprechung beginnen. Zunächst überprüfen wir die Verkaufszahlen der letzten Woche.","fr":"Commençons la réunion d'aujourd'hui. D'abord, passons en revue les résultats des ventes de la semaine dernière.","es":"Comencemos la reunión de hoy. Primero, revisemos el desempeño de ventas de la semana pasada.","pl":"Zacznijmy dzisiejsze spotkanie. Najpierw przejrzyjmy wyniki sprzedaży z zeszłego tygodnia.","it":"Iniziamo la riunione di oggi. Prima di tutto, esaminiamo i risultati delle vendite della settimana scorsa.","sv":"Låt oss börja dagens möte. Först granskar vi förra veckans försäljningsresultat.","fi":"Aloitetaan tämän päivän kokous. Katsotaan ensin viime viikon myyntitulokset.","ja":"今日の会議を始めましょう。まず先週の販売実績を確認しましょう。","zh-CN":"我们开始今天的会议。首先来回顾一下上周的销售业绩。"}},{"speaker":"수연","text":"지난주 목표 대비 85%를 달성했습니다. 예상보다 낮은 수치입니다.","trans":{"en":"We achieved 85% of last week's target. This is lower than expected.","de":"Wir haben 85% des Ziels der letzten Woche erreicht. Das ist niedriger als erwartet.","fr":"Nous avons atteint 85% de l'objectif de la semaine dernière. C'est inférieur aux prévisions.","es":"Alcanzamos el 85% del objetivo de la semana pasada. Esto es más bajo de lo esperado.","pl":"Osiągnęliśmy 85% celu z zeszłego tygodnia. To niżej niż oczekiwano.","it":"Abbiamo raggiunto l'85% dell'obiettivo della settimana scorsa. È inferiore al previsto.","sv":"Vi uppnådde 85% av förra veckans mål. Det är lägre än förväntat.","fi":"Saavutimme 85% viime viikon tavoitteesta. Se on odotettua alhaisempi.","ja":"先週の目標の85%を達成しました。予想より低い数値です。","zh-CN":"上周完成了目标的85%。这比预期低。"}},{"speaker":"지훈","text":"원인이 무엇이라고 생각하십니까? 수연 씨 의견을 말씀해 주세요.","trans":{"en":"What do you think is the cause? Please share your opinion, Suyeon.","de":"Was denken Sie, was die Ursache ist? Bitte teilen Sie Ihre Meinung, Suyeon.","fr":"Quelle en est la cause selon vous ? Veuillez partager votre opinion, Suyeon.","es":"¿Cuál cree que es la causa? Por favor comparta su opinión, Suyeon.","pl":"Jaki jest powód według pani? Proszę podzielić się opinią, Suyeon.","it":"Qual è secondo lei la causa? Condivida la sua opinione, Suyeon.","sv":"Vad tror du är orsaken? Dela din åsikt, Suyeon.","fi":"Mikä on mielestäsi syy? Kerro mielipiteesi, Suyeon.","ja":"原因は何だと思いますか？スヨンさん、ご意見をお聞かせください。","zh-CN":"您认为原因是什么？请分享您的看法，秀妍。"}},{"speaker":"수연","text":"제 생각에는 경쟁사의 할인 행사가 영향을 미친 것 같습니다. 대책이 필요합니다.","trans":{"en":"I think the competitor's discount event had an impact. We need countermeasures.","de":"Ich denke, die Rabattaktion des Wettbewerbers hat Auswirkungen gehabt. Wir brauchen Gegenmaßnahmen.","fr":"Je pense que la promotion de remise du concurrent a eu un impact. Nous avons besoin de contre-mesures.","es":"Creo que el evento de descuento del competidor tuvo un impacto. Necesitamos contramedidas.","pl":"Myślę, że promocja rabatowa konkurencji miała wpływ. Potrzebujemy działań zaradczych.","it":"Penso che l'evento di sconti del concorrente abbia avuto un impatto. Abbiamo bisogno di contromisure.","sv":"Jag tror att konkurrentens rabattaktion hade en påverkan. Vi behöver motåtgärder.","fi":"Mielestäni kilpailijan alennustapahtuma vaikutti asiaan. Tarvitsemme vastatoimia.","ja":"競合他社の値引きセールが影響したと思います。対策が必要です。","zh-CN":"我认为竞争对手的折扣活动产生了影响。我们需要对策。"}},{"speaker":"지훈","text":"좋은 지적입니다. 구체적으로 어떤 방법을 제안하시겠습니까?","trans":{"en":"That's a good point. What specific methods would you suggest?","de":"Das ist ein guter Punkt. Welche konkreten Methoden würden Sie vorschlagen?","fr":"C'est un bon point. Quelles méthodes concrètes suggéreriez-vous ?","es":"Es un buen punto. ¿Qué métodos específicos sugeriría?","pl":"To dobra uwaga. Jakie konkretne metody by pani zaproponowała?","it":"È un buon punto. Quali metodi specifici suggerirebbe?","sv":"Det är en bra poäng. Vilka specifika metoder skulle du föreslå?","fi":"Hyvä huomio. Mitä erityisiä menetelmiä ehdottaisit?","ja":"良い指摘です。具体的にどんな方法を提案されますか？","zh-CN":"说得很好。您具体建议什么方法？"}},{"speaker":"수연","text":"우선 기존 고객에게 로열티 혜택을 강화하는 게 효과적일 것 같습니다.","trans":{"en":"First, I think strengthening loyalty benefits for existing customers would be effective.","de":"Zunächst denke ich, dass die Stärkung von Treuevorteilen für Bestandskunden effektiv wäre.","fr":"D'abord, je pense que renforcer les avantages de fidélité pour les clients existants serait efficace.","es":"Primero, creo que fortalecer los beneficios de lealtad para los clientes existentes sería efectivo.","pl":"Przede wszystkim myślę, że wzmocnienie korzyści lojalnościowych dla istniejących klientów byłoby skuteczne.","it":"Prima di tutto, penso che rafforzare i vantaggi di fedeltà per i clienti esistenti sarebbe efficace.","sv":"Först tror jag att det skulle vara effektivt att stärka lojalitetsförmånerna för befintliga kunder.","fi":"Ensiksi mielestäni olemassa olevien asiakkaiden lojaliteettietujen vahvistaminen olisi tehokasta.","ja":"まず、既存顧客へのロイヤルティ特典を強化するのが効果的だと思います。","zh-CN":"首先，我认为加强现有客户的忠诚度福利会很有效。"}},{"speaker":"지훈","text":"그 방안은 검토해 볼 만합니다. 다른 의견은 없으신가요?","trans":{"en":"That plan is worth considering. Are there any other opinions?","de":"Dieser Plan ist es wert, in Betracht gezogen zu werden. Gibt es andere Meinungen?","fr":"Ce plan mérite d'être considéré. Y a-t-il d'autres opinions?","es":"Ese plan vale la pena considerar. ¿Hay otras opiniones?","pl":"Ten plan warto rozważyć. Czy są inne opinie?","it":"Questo piano vale la pena di essere considerato. Ci sono altre opinioni?","sv":"Den planen är värd att överväga. Finns det andra åsikter?","fi":"Se suunnitelma on harkitsemisen arvoinen. Onko muita mielipiteitä?","ja":"そのプランは検討する価値があります。他にご意見はありませんか？","zh-CN":"那个方案值得考虑。还有其他意见吗？"}},{"speaker":"수연","text":"추가로 SNS 마케팅을 활용하면 젊은 고객층을 더 끌어올 수 있을 것입니다.","trans":{"en":"Additionally, using SNS marketing could attract more young customers.","de":"Zusätzlich könnte die Nutzung von SNS-Marketing mehr junge Kunden anziehen.","fr":"De plus, l'utilisation du marketing sur les réseaux sociaux pourrait attirer plus de jeunes clients.","es":"Además, usar marketing en redes sociales podría atraer más clientes jóvenes.","pl":"Dodatkowo, korzystanie z marketingu w mediach społecznościowych mogłoby przyciągnąć więcej młodych klientów.","it":"Inoltre, l'utilizzo del marketing sui social media potrebbe attrarre più giovani clienti.","sv":"Dessutom skulle användning av SNS-marknadsföring kunna locka fler unga kunder.","fi":"Lisäksi sosiaalisen median markkinoinnin hyödyntäminen voisi houkutella enemmän nuoria asiakkaita.","ja":"さらにSNSマーケティングを活用すれば若い顧客層をより引き付けられるでしょう。","zh-CN":"另外，利用社交媒体营销可以吸引更多年轻客户。"}},{"speaker":"지훈","text":"두 가지 제안을 모두 채택하기로 결정하겠습니다. 다음 주까지 실행 계획을 작성해 주세요.","trans":{"en":"We will decide to adopt both proposals. Please prepare an action plan by next week.","de":"Wir entscheiden, beide Vorschläge anzunehmen. Bitte erstellen Sie bis nächste Woche einen Aktionsplan.","fr":"Nous décidons d'adopter les deux propositions. Veuillez préparer un plan d'action d'ici la semaine prochaine.","es":"Decid s food.","de":"Jeju Island ist heutzutage sehr beliebt. Die Naturlandschaft ist wunderschön und es gibt viel leckeres Essen.","fr":"L'île de Jeju est très populaire de nos jours. Le paysage naturel est magnifique et il y a beaucoup de bonne nourriture.","es":"La isla Jeju es muy popular estos días. El paisaje natural es hermoso y hay mucha comida deliciosa.","pl":"Wyspa Jeju jest ostatnio bardzo popularna. Krajobraz naturalny jest piękny i jest dużo pysznego jedzenia.","it":"L'isola di Jeju è molto popolare al giorno d'oggi. Il paesaggio naturale è bellissimo e c'è molta cibo delizioso.","sv":"Jeju Island är mycket populärt nuförtiden. Det naturliga landskapet är vackert och det finns massor av god mat.","fi":"Jejun saari on nykyään hyvin suosittu. Luonnonmaisemat ovat kauniita ja siellä on paljon hyvää ruokaa.","ja":"最近、済州島が人気です。自然景観も美しくて美味しい食べ物もたくさんありますよ。","zh-CN":"最近济州岛很受欢迎。自然风光美丽，美食也很多。"}},{"speaker":"민서","text":"제주도 좋겠네요. 몇 박 며칠 정도 여행하는 게 적당할까요?","trans":{"en":"Jeju Island sounds good. How many nights and days would be appropriate?","de":"Jeju Island klingt gut. Wie viele Nächte und Tage wären angemessen?","fr":"L'île de Jeju semble bien. Combien de nuits et de jours seraient appropriés?","es":"Jeju Island suena bien. ¿Cuántas noches y días serían apropiados?","pl":"Wyspa Jeju brzmi dobrze. Ile nocy i dni byłoby odpowiednie?","it":"L'isola di Jeju sembra buona. Quante notti e giorni sarebbero appropriati?","sv":"Jeju Island låter bra. Hur många nätter och dagar vore lämpligt?","fi":"Jejun saari kuulostaa hyvältä. Kuinka monta yötä ja päivää olisi sopivaa?","ja":"済州島いいですね。何泊何日ぐらいの旅行が適当でしょうか？","zh-CN":"济州岛不错。旅行几晚几天比较合适呢？"}},{"speaker":"태양","text":"3박 4일이면 주요 관광지를 충분히 둘러볼 수 있을 거예요.","trans":{"en":"3 nights and 4 days should be enough to explore the main tourist attractions.","de":"3 Nächte und 4 Tage sollten ausreichen, um die wichtigsten Sehenswürdigkeiten zu erkunden.","fr":"3 nuits et 4 jours devraient suffire pour explorer les principales attractions touristiques.","es":"3 noches y 4 días deberían ser suficientes para explorar las principales atracciones turísticas.","pl":"3 noce i 4 dni powinny wystarczyć, aby zobaczyć główne atrakcje turystyczne.","it":"3 notti e 4 giorni dovrebbero essere sufficienti per esplorare le principali attrazioni turistiche.","sv":"3 nätter och 4 dagar borde räcka för att utforska de viktigaste turistattraktionerna.","fi":"3 yötä ja 4 päivää riittäisi tutustumaan tärkeimpiin nähtävyyksiin.","ja":"3泊4日あれば主要な観光地を十分に回れるでしょう。","zh-CN":"3晚4天应该足够游览主要景点了。"}},{"speaker":"민서","text":"첫째 날에는 뭘 하는 게 좋을까요? 일정을 어떻게 짜야 할지 모르겠어요.","trans":{"en":"What should I do on the first day? I'm not sure how to plan the schedule.","de":"Was sollte ich am ersten Tag machen? Ich weiß nicht, wie ich den Zeitplan planen soll.","fr":"Que devrais-je faire le premier jour? Je ne sais pas comment planifier l'horaire.","es":"¿Qué debería hacer el primer día? No sé cómo planificar el horario.","pl":"Co powinienem zrobić pierwszego dnia? Nie wiem, jak zaplanować harmonogram.","it":"Cosa dovrei fare il primo giorno? Non so come pianificare l'orario.","sv":"Vad ska jag göra på första dagen? Jag vet inte hur jag ska planera schemat.","fi":"Mitä pitäisi tehdä ensimmäisenä päivänä? En tiedä miten suunnitella aikataulu.","ja":"1日目は何をするといいですか？日程をどう組めばいいか分からなくて。","zh-CN":"第一天做什么好呢？我不知道怎么安排行程。"}},{"speaker":"태양","text":"첫째 날에는 성산일출봉에 올라가 보세요. 경치가 정말 장관이에요.","trans":{"en":"On the first day, go up Seongsan Ilchulbong. The view is truly spectacular.","de":"Am ersten Tag steigen Sie den Seongsan Ilchulbong hinauf. Die Aussicht ist wirklich spektakulär.","fr":"Le premier jour, montez au Seongsan Ilchulbong. La vue est vraiment spectaculaire.","es":"El primer día, suba al Seongsan Ilchulbong. La vista es verdaderamente espectacular.","pl":"Pierwszego dnia wejdź na Seongsan Ilchulbong. Widok jest naprawdę spektakularny.","it":"Il primo giorno, salite sul Seongsan Ilchulbong. Il panorama è davvero spettacolare.","sv":"På första dagen, gå upp till Seongsan Ilchulbong. Utsikten är verkligt spektakulär.","fi":"Ensimmäisenä päivänä käy Seongsan Ilchulbongilla. Näkymä on todella upea.","ja":"1日目は城山日出峰に登ってみてください。景色が本当に壮観です。","zh-CN":"第一天去爬城山日出峰。景色真的很壮观。"}},{"speaker":"민서","text":"숙소는 어느 지역에 잡는 게 좋을까요? 교통이 편한 곳이면 좋겠어요.","trans":{"en":"Which area would be good to stay in? I'd prefer somewhere with convenient transportation.","de":"In welchem Bereich wäre es gut zu wohnen? Ich würde einen Ort mit bequemen Verkehrsmitteln bevorzugen.","fr":"Dans quelle zone serait-il bon de séjourner? Je préférerais un endroit avec des transports pratiques.","es":"¿En qué área sería bueno alojarse? Preferiría un lugar con transporte conveniente.","pl":"W której okolicy dobrze byłoby się zatrzymać? Wolałbym miejsce z wygodnym transportem.","it":"In quale area sarebbe bene soggiornare? Preferirei un posto con trasporti comodi.","sv":"I vilket område vore det bra att bo? Jag skulle föredra ett ställe med bekväma transporter.","fi":"Missä alueella olisi hyvä majoittua? Pitäisi olla hyvät yhteydet.","ja":"宿泊はどの地域に取るといいですか？交通が便利な場所がいいです。","zh-CN":"住宿选在哪个区域比较好？最好是交通方便的地方。"}},{"speaker":"태양","text":"제주시 중심가에 묵으면 관광지 접근성이 좋아요. 렌터카를 빌리면 더 편리할 거예요.","trans":{"en":"Staying in the center of Jeju City has good access to tourist spots. Renting a car would be even more convenient.","de":"Im Zentrum von Jeju City zu wohnen bietet guten Zugang zu Sehenswürdigkeiten. Ein Mietwagen wäre noch praktischer.","fr":"Séjourner dans le centre de Jeju City offre un bon accès aux sites touristiques. Louer une voiture serait encore plus pratique.","es":"Quedarse en el centro de Jeju City tiene buen acceso a los sitios turísticos. Alquilar un coche sería aún más conveniente.","pl":"Pobyt w centrum Jeju City zapewnia dobry dostęp do atrakcji turystycznych. Wynajęcie samochodu byłoby jeszcze wygodniejsze.","it":"Soggiornare nel centro di Jeju City offre buon accesso ai siti turistici. Noleggiare un'auto sarebbe ancora più conveniente.","sv":"Att bo i centrum av Jeju City ger bra tillgång till turistattraktioner. Att hyra en bil skulle vara ännu bekvämare.","fi":"Jeju Cityn keskustassa majoittuminen tarjoaa hyvät yhteydet nähtävyyksiin. Auton vuokraaminen olisi vielä kätevämpää.","ja":"済州市の中心部に泊まると観光地へのアクセスが良いです。レンタカーを借りるともっと便利です。","zh-CN":"住在济州市中心区域对景点的可达性很好。租车会更方便。"}},{"speaker":"민서","text":"좋은 조언 감사해요. 이번 여행이 정말 기대되네요!","trans":{"en":"Thank you for the great advice. I'm really looking forward to this trip!","de":"Danke für den tollen Rat. Ich freue mich wirklich auf diese Reise!","fr":"Merci pour le bon conseil. J'ai vraiment hâte pour ce voyage!","es":"Gracias por el buen consejo. ¡Realmente espero este viaje!","pl":"Dziękuję za dobre rady. Naprawdę czekam na tę podróż!","it":"Grazie per l'ottimo consiglio. Non vedo l'ora per questo viaggio!","sv":"Tack för det goda rådet. Jag ser verkligen fram emot denna resa!","fi":"Kiitos hyvistä neuvoista. Odotan tätä matkaa todella innolla!","ja":"良いアドバイスありがとうございます。今回の旅行がとても楽しみです！","zh-CN":"感谢好建议。真的很期待这次旅行！"}}],"vocab":[{"word":"관광지","trans":{"en":"tourist attraction / tourist spot","de":"Sehenswürdigkeit / Touristenort","fr":"attraction touristique / site touristique","es":"atracción turística / lugar turístico","pl":"atrakcja turystyczna / miejsce turystyczne","it":"attrazione turistica / luogo turistico","sv":"turistattraktion / turistplats","fi":"nähtävyys / turistikohde","ja":"観光地","zh-CN":"旅游景点"}},{"word":"일정","trans":{"en":"schedule / itinerary","de":"Zeitplan / Reiseroute","fr":"programme / itinéraire","es":"horario / itinerario","pl":"harmonogram / trasa","it":"programma / itinerario","sv":"schema / resplan","fi":"aikataulu / matkasuunnitelma","ja":"日程","zh-CN":"行程/日程"}},{"word":"자연경관","trans":{"en":"natural scenery / natural landscape","de":"Naturlandschaft / Naturkulisse","fr":"paysage naturel","es":"paisaje natural","pl":"krajobraz naturalny","it":"paesaggio naturale","sv":"naturlandskap","fi":"luonnonmaisema","ja":"自然景観","zh-CN":"自然风光"}},{"word":"숙소","trans":{"en":"accommodation / lodging","de":"Unterkunft","fr":"hébergement / logement","es":"alojamiento","pl":"zakwaterowanie / noclegi","it":"alloggio / sistemazione","sv":"boende / logi","fi":"majoitus","ja":"宿泊施設","zh-CN":"住宿"}},{"word":"렌터카","trans":{"en":"rental car","de":"Mietwagen","fr":"voiture de location","es":"coche de alquiler","pl":"samochód do wynajęcia","it":"auto a noleggio","sv":"hyrbil","fi":"vuokra-auto","ja":"レンタカー","zh-CN":"租车"}},{"word":"접근성","trans":{"en":"accessibility","de":"Zugänglichkeit / Erreichbarkeit","fr":"accessibilité","es":"accesibilidad","pl":"dostępność","it":"accessibilità","sv":"tillgänglighet","fi":"saavutettavuus","ja":"アクセス性","zh-CN":"可达性/便利性"}},{"word":"장관","trans":{"en":"spectacular sight / grand view","de":"spektakulärer Anblick / großartige Aussicht","fr":"spectacle magnifique / vue grandiose","es":"vista espectacular / escena magnífica","pl":"spektakularny widok / wspaniały widok","it":"spettacolo mozzafiato / vista grandiosa","sv":"spektakulär syn / storartad utsikt","fi":"upea näkymä / mahtava maisema","ja":"壮観","zh-CN":"壮观/壮丽景色"}},{"word":"둘러보다","trans":{"en":"to look around / to explore","de":"sich umsehen / erkunden","fr":"regarder autour / explorer","es":"mirar alrededor / explorar","pl":"rozglądać się / eksplorować","it":"guardarsi intorno / esplorare","sv":"titta runt / utforska","fi":"katsella ympäriinsä / tutkia","ja":"見て回る","zh-CN":"四处看看/游览"}}],"patterns":[{"pattern":"~(으)면 좋겠어요","patternTrans":{"en":"I hope ~ / It would be nice if ~","de":"Ich hoffe, ~ / Es wäre schön, wenn ~","fr":"J'espère que ~ / Ce serait bien si ~","es":"Espero que ~ / Sería bueno si ~","pl":"Mam nadzieję, że ~ / Byłoby miło, gdyby ~","it":"Spero che ~ / Sarebbe bello se ~","sv":"Jag hoppas ~ / Det vore trevligt om ~","fi":"Toivottavasti ~ / Olisi mukavaa jos ~","ja":"〜ならいいですね","zh-CN":"希望～就好了"},"example":"날씨가 맑으면 좋겠어요.","trans":{"en":"I hope the weather is clear.","de":"Ich hoffe, das Wetter ist klar.","fr":"J'espère que le temps sera clair.","es":"Espero que el clima esté despejado.","pl":"Mam nadzieję, że pogoda będzie ładna.","it":"Spero che il tempo sia sereno.","sv":"Jag hoppas att vädret är klart.","fi":"Toivottavasti sää on kirkas.","ja":"天気が晴れるといいですね。","zh-CN":"希望天气晴朗就好了。"}},{"pattern":"~(으)면 더 편리할 거예요","patternTrans":{"en":"It will be more convenient if ~","de":"Es wird bequemer sein, wenn ~","fr":"Ce sera plus pratique si ~","es":"Será más conveniente si ~","pl":"Będzie wygodniej, jeśli ~","it":"Sarà più comodo se ~","sv":"Det kommer att vara bekvämare om ~","fi":"Se on kätevämpää jos ~","ja":"〜すればもっと便利でしょう","zh-CN":"如果～会更方便"},"example":"지도 앱을 사용하면 더 편리할 거예요.","trans":{"en":"It will be more convenient if you use a map app.","de":"Es wird bequemer sein, wenn Sie eine Karten-App verwenden.","fr":"Ce sera plus pratique si vous utilisez une application de carte.","es":"Será más conveniente si usas una aplicación de mapas.","pl":"Będzie wygodniej, jeśli skorzystasz z aplikacji mapowej.","it":"Sarà più comodo se usi un'app di mappe.","sv":"Det kommer att vara bekvämare om du använder en kartapp.","fi":"Se on kätevämpää jos käytät karttasovellusta.","ja":"地図アプリを使えばもっと便利でしょう。","zh-CN":"如果使用地图应用会更方便。"}},{"pattern":"~아/어 보세요","patternTrans":{"en":"Try ~ing / Please try ~","de":"Versuchen Sie, ~ zu tun / Probieren Sie ~","fr":"Essayez de ~ / Veuillez essayer ~","es":"Intente ~ / Pruebe ~","pl":"Spróbuj ~ / Proszę spróbować ~","it":"Provate a ~ / Per favore provate ~","sv":"Prova att ~ / Försök ~","fi":"Kokeile ~ / Yritä ~","ja":"〜してみてください","zh-CN":"试试～吧"},"example":"한라산에도 꼭 올라가 보세요.","trans":{"en":"Be sure to try climbing Hallasan too.","de":"Versuchen Sie unbedingt, auch den Hallasan zu besteigen.","fr":"Assurez-vous d'essayer de grimper le Hallasan aussi.","es":"Asegúrese de intentar subir el Hallasan también.","pl":"Koniecznie spróbuj też wejść na Hallasan.","it":"Assicuratevi di provare a scalare anche il Hallasan.","sv":"Se till att prova att klättra upp för Hallasan också.","fi":"Muista kokeilla myös Hallasanin kiipeämistä.","ja":"漢拏山にもぜひ登ってみてください。","zh-CN":"汉拿山也一定要去爬爬看。"}}],"quizzes":[{"type":"이해","questionAudio":"태양 씨가 추천한 여행지는 어디입니까?","questionTrans":{"en":"What travel destination did Taeyang recommend?","de":"Welches Reiseziel hat Taeyang empfohlen?","fr":"Quelle destination de voyage Taeyang a-t-il recommandé?","es":"¿Qué destino de viaje recomendó Taeyang?","pl":"Jakie miejsce podróży zarekomendował Taeyang?","it":"Quale destinazione di viaggio ha raccomandato Taeyang?","sv":"Vilket resmål rekommenderade Taeyang?","fi":"Minkä matkakohteen Taeyang suositteli?","ja":"テヤンさんが勧めた旅行先はどこですか？","zh-CN":"泰阳推荐的旅游目的地是哪里？"},"options":[{"text":"부산","trans":{"en":"Busan","de":"Busan","fr":"Busan","es":"Busan","pl":"Busan","it":"Busan","sv":"Busan","fi":"Busan","ja":"釜山","zh-CN":"釜山"}},{"text":"제주도","trans":{"en":"Jeju Island","de":"Jeju Island","fr":"Île de Jeju","es":"Isla Jeju","pl":"Wyspa Jeju","it":"Isola di Jeju","sv":"Jeju Island","fi":"Jejun saari","ja":"済州島","zh-CN":"济州岛"}},{"text":"경주","trans":{"en":"Gyeongju","de":"Gyeongju","fr":"Gyeongju","es":"Gyeongju","pl":"Gyeongju","it":"Gyeongju","sv":"Gyeongju","fi":"Gyeongju","ja":"慶州","zh-CN":"庆州"}},{"text":"강릉","trans":{"en":"Gangneung","de":"Gangneung","fr":"Gangneung","es":"Gangneung","pl":"Gangneung","it":"Gangneung","sv":"Gangneung","fi":"Gangneung","ja":"江陵","zh-CN":"江陵"}}],"answer":1,"explanation":"태양 씨는 '요즘 제주도가 인기가 많아요'라며 제주도를 추천했습니다."},{"type":"이해","questionAudio":"태양 씨는 여행 일정을 몇 박 며칠로 추천했습니까?","questionTrans":{"en":"How many nights and days did Taeyang recommend for the trip?","de":"Wie viele Nächte und Tage hat Taeyang für die Reise empfohlen?","fr":"Combien de nuits et de jours Taeyang a-t-il recommandé pour le voyage?","es":"¿Cuántas noches y días recomendó Taeyang para el viaje?","pl":"Ile nocy i dni Taeyang zarekomendował na podróż?","it":"Quante notti e giorni ha raccomandato Taeyang per il viaggio?","sv":"Hur många nätter och dagar rekommenderade Taeyang för resan?","fi":"Kuinka monta yötä ja päivää Taeyang suositteli matkalle?","ja":"テヤンさんは旅行の日程を何泊何日に勧めましたか？","zh-CN":"泰阳推荐旅行几晚几天？"},"options":[{"text":"1박 2일","trans":{"en":"1 night 2 days","de":"1 Nacht 2 Tage","fr":"1 nuit 2 jours","es":"1 noche 2 días","pl":"1 noc 2 dni","it":"1 notte 2 giorni","sv":"1 natt 2 dagar","fi":"1 yö 2 päivää","ja":"1泊2日","zh-CN":"1晚2天"}},{"text":"2박 3일","trans":{"en":"2 nights 3 days","de":"2 Nächte 3 Tage","fr":"2 nuits 3 jours","es":"2 noches 3 días","pl":"2 noce 3 dni","it":"2 notti 3 giorni","sv":"2 nätter 3 dagar","fi":"2 yötä 3 päivää","ja":"2泊3日","zh-CN":"2晚3天"}},{"text":"3박 4일","trans":{"en":"3 nights 4 days","de":"3 Nächte 4 Tage","fr":"3 nuits 4 jours","es":"3 noches 4 días","pl":"3 noce 4 dni","it":"3 notti 4 giorni","sv":"3 nätter 4 dagar","fi":"3 yötä 4 päivää","ja":"3泊4日","zh-CN":"3晚4天"}},{"text":"4박 5일","trans":{"en":"4 nights 5 days","de":"4 Nächte 5 Tage","fr":"4 nuits 5 jours","es":"4 noches 5 días","pl":"4 noce 5 dni","it":"4 notti 5 giorni","sv":"4 nätter 5 dagar","fi":"4 yötä 5 päivää","ja":"4泊5日","zh-CN":"4晚5天"}}],"answer":2,"explanation":"태양 씨는 '3박 4일이면 주요 관광지를 충분히 둘러볼 수 있을 거예요'라고 했습니다."},{"type":"이해","questionAudio":"태양 씨는 첫째 날에 어디를 방문하라고 추천했습니까?","questionTrans":{"en":"Where did Taeyang recommend visiting on the first day?","de":"Wohin hat Taeyang empfohlen, am ersten Tag zu gehen?","fr":"Où Taeyang a-t-il recommandé de visiter le premier jour?","es":"¿Dónde recomendó Taeyang visitar el primer día?","pl":"Gdzie Taeyang zarekomendował wizytę pierwszego dnia?","it":"Dove ha raccomandato Taeyang di visitare il primo giorno?","sv":"Var rekommenderade Taeyang att besöka på första dagen?","fi":"Minne Taeyang suositteli menemistä ensimmäisenä päivänä?","ja":"テヤンさんは1日目にどこを訪問することを勧めましたか？","zh-CN":"泰阳推荐第一天去哪里参观？"},"options":[{"text":"한라산","trans":{"en":"Hallasan","de":"Hallasan","fr":"Hallasan","es":"Hallasan","pl":"Hallasan","it":"Hallasan","sv":"Hallasan","fi":"Hallasan","ja":"漢拏山","zh-CN":"汉拿山"}},{"text":"성산일출봉","trans":{"en":"Seongsan Ilchulbong","de":"Seongsan Ilchulbong","fr":"Seongsan Ilchulbong","es":"Seongsan Ilchulbong","pl":"Seongsan Ilchulbong","it":"Seongsan Ilchulbong","sv":"Seongsan Ilchulbong","fi":"Seongsan Ilchulbong","ja":"城山日出峰","zh-CN":"城山日出峰"}},{"text":"우도","trans":{"en":"Udo Island","de":"Udo Island","fr":"Île Udo","es":"Isla Udo","pl":"Wyspa Udo","it":"Isola Udo","sv":"Udo Island","fi":"Udon saari","ja":"牛島","zh-CN":"牛岛"}},{"text":"협재 해수욕장","trans":{"en":"Hyeopjae Beach","de":"Hyeopjae Strand","fr":"Plage de Hyeopjae","es":"Playa Hyeopjae","pl":"Plaża Hyeopjae","it":"Spiaggia di Hyeopjae","sv":"Hyeopjae strand","fi":"Hyeopjae ranta","ja":"挾才海水浴場","zh-CN":"协才海水浴场"}}],"answer":1,"explanation":"태양 씨는 '첫째 날에는 성산일출봉에 올라가 보세요'라고 추천했습니다."}]},
  25: {"id":25,"title":"건강한 생활 습관","titleTrans":{"en":"Healthy Habits","de":"Gesunde Gewohnheiten","fr":"Habitudes saines","es":"Hábitos saludables","pl":"Zdrowe nawyki","it":"Abitudini sane","sv":"Hälsosamma vanor","fi":"Terveet tavat","ja":"健康的な習慣","zh-CN":"健康习惯"},"desc":"건강한 생활 습관에 대해 이야기하고 조언을 구하는 대화","descTrans":{"en":"Talk about healthy lifestyle habits and ask for advice","de":"Über gesunde Lebensgewohnheiten sprechen und Rat einholen","fr":"Parler des habitudes de vie saines et demander des conseils","es":"Hablar sobre hábitos de vida saludables y pedir consejos","pl":"Rozmawianie o zdrowych nawykach życiowych i proszenie o radę","it":"Parlare delle abitudini di vita sane e chiedere consigli","sv":"Prata om hälsosamma levnadsvanor och be om råd","fi":"Puhua terveellisistä elämäntavoista ja pyytää neuvoja","ja":"健康的な生活習慣について話し、アドバイスを求める","zh-CN":"谈论健康生活习惯并寻求建议"},"dialogue":[{"speaker":"지원","text":"수민아, 요즘 얼굴이 많이 좋아 보이는데 무슨 비결이 있어?","trans":{"en":"Sumin, you look much better lately. Do you have a secret?","de":"Sumin, du siehst in letzter Zeit viel besser aus. Hast du ein Geheimnis?","fr":"Sumin, tu as l'air beaucoup mieux ces derniers temps. Tu as un secret ?","es":"Sumin, últimamente te ves mucho mejor. ¿Tienes algún secreto?","pl":"Sumin, ostatnio wyglądasz o wiele lepiej. Masz jakiś sekret?","it":"Sumin, ultimamente hai un aspetto molto migliore. Hai un segreto?","sv":"Sumin, du ser mycket bättre ut på sistone. Har du ett hemlighet?","fi":"Sumin, näytät viime aikoina paljon paremmalta. Onko sinulla jokin salaisuus?","ja":"スミン、最近顔色がとてもいいね。何かコツがあるの？","zh-CN":"秀敏，你最近看起来好多了，有什么秘诀吗？"}},{"speaker":"수민","text":"아, 요즘 생활 습관을 좀 바꿨거든. 매일 아침 6시에 일어나서 운동을 시작했어.","trans":{"en":"Oh, I've changed my lifestyle a bit lately. I started exercising every morning at 6.","de":"Oh, ich habe meinen Lebensstil kürzlich etwas geändert. Ich habe angefangen, jeden Morgen um 6 Uhr Sport zu treiben.","fr":"Oh, j'ai un peu changé mon mode de vie récemment. J'ai commencé à faire de l'exercice chaque matin à 6 heures.","es":"Oh, he cambiado un poco mi estilo de vida últimamente. Empecé a hacer ejercicio todas las mañanas a las 6.","pl":"Och, ostatnio trochę zmieniłam swój styl życia. Zaczęłam ćwiczyć każdego ranka o 6.","it":"Oh, ultimamente ho cambiato un po' il mio stile di vita. Ho iniziato a fare esercizio ogni mattina alle 6.","sv":"Oh, jag har ändrat min livsstil lite på sistone. Jag började träna varje morgon klockan 6.","fi":"Olen muuttanut elämäntapaani viime aikoina hieman. Aloin liikkua joka aamu kello 6.","ja":"ああ、最近少し生活習慣を変えたの。毎朝6時に起きて運動を始めたよ。","zh-CN":"哦，我最近改变了一些生活习惯。我开始每天早上6点起床锻炼。"}},{"speaker":"지원","text":"와, 대단하다! 나는 아침에 일어나는 것도 힘든데. 어떻게 그렇게 일찍 일어날 수 있어?","trans":{"en":"Wow, that's impressive! I find it hard just to get up in the morning. How can you wake up so early?","de":"Wow, beeindruckend! Ich finde es schon schwer, morgens aufzustehen. Wie kannst du so früh aufwachen?","fr":"Wow, c'est impressionnant ! J'ai du mal à me lever le matin. Comment peux-tu te réveiller si tôt ?","es":"¡Vaya, es impresionante! A mí me cuesta levantarme por la mañana. ¿Cómo puedes despertarte tan temprano?","pl":"Wow, to imponujące! Mnie trudno jest wstać rano. Jak możesz wstawać tak wcześnie?","it":"Wow, è impressionante! Fatico persino ad alzarmi la mattina. Come riesci a svegliarti così presto?","sv":"Wow, det är imponerande! Jag har svårt att ens stiga upp på morgonen. Hur kan du vakna så tidigt?","fi":"Vau, se on vaikuttavaa! Minulle on jo vaikea nousta aamulla ylös. Miten voit herätä niin aikaisin?","ja":"わあ、すごいね！私は朝起きるだけでも大変なのに。どうしてそんなに早く起きられるの？","zh-CN":"哇，太厉害了！我早上起床都很困难。你怎么能起那么早？"}},{"speaker":"수민","text":"처음에는 나도 힘들었어. 그런데 매일 같은 시간에 자고 일어나는 규칙적인 생활이 중요하더라고.","trans":{"en":"At first it was hard for me too. But I found that a regular schedule — sleeping and waking at the same time every day — is really important.","de":"Am Anfang war es auch für mich schwer. Aber ich habe gemerkt, dass ein regelmäßiger Schlafrhythmus – immer zur gleichen Zeit ins Bett gehen und aufstehen – wirklich wichtig ist.","fr":"Au début, c'était difficile pour moi aussi. Mais j'ai découvert qu'un horaire régulier — se coucher et se lever à la même heure chaque jour — est vraiment important.","es":"Al principio también me costaba. Pero descubrí que tener un horario regular — dormir y despertar a la misma hora cada día — es realmente importante.","pl":"Na początku też mi było trudno. Ale odkryłam, że regularny rytm — chodzenie spać i wstawanie o tej samej porze każdego dnia — jest naprawdę ważny.","it":"All'inizio era difficile anche per me. Ma ho scoperto che avere un orario regolare — andare a letto e svegliarsi alla stessa ora ogni giorno — è davvero importante.","sv":"Först var det svårt för mig också. Men jag upptäckte att en regelbunden rutin — sova och vakna vid samma tid varje dag — verkligen är viktig.","fi":"Aluksi sekin oli minulle vaikeaa. Mutta huomasin, että säännöllinen rytmi — nukkumaan ja heräämään samaan aikaan joka päivä — on todella tärkeää.","ja":"最初は私も辛かったよ。でも毎日同じ時間に寝て起きる規則正しい生活が大切だとわかったの。","zh-CN":"一开始我也觉得很难。但我发现每天在同一时间睡觉和起床的规律生活真的很重要。"}},{"speaker":"지원","text":"운동은 주로 어떤 걸 해? 헬스장에 가는 거야?","trans":{"en":"What kind of exercise do you mainly do? Do you go to the gym?","de":"Was für Sport machst du hauptsächlich? Gehst du ins Fitnessstudio?","fr":"Quel type d'exercice fais-tu principalement ? Tu vas à la salle de sport ?","es":"¿Qué tipo de ejercicio haces principalmente? ¿Vas al gimnasio?","pl":"Jaki rodzaj ćwiczeń głównie wykonujesz? Chodzisz na siłownię?","it":"Che tipo di esercizio fai principalmente? Vai in palestra?","sv":"Vad tränar du mest? Går du på gymmet?","fi":"Mitä liikuntaa harrastat pääasiassa? Käytkö kuntosalilla?","ja":"主にどんな運動をしているの？ジムに行くの？","zh-CN":"你主要做什么运动？去健身房吗？"}},{"speaker":"수민","text":"아니, 집 근처 공원에서 30분 정도 조깅을 해. 돈도 안 들고 공기도 좋아서 기분이 상쾌해져.","trans":{"en":"No, I go jogging for about 30 minutes at the park near my house. It's free and the fresh air makes me feel refreshed.","de":"Nein, ich g
