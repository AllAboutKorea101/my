<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한국어 중급 듣기 공부</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        .book-shadow { box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08), 0 8px 10px -6px rgba(0,0,0,0.05); }
        .blur-text { filter: blur(6px); user-select: none; transition: all 0.3s ease; }
        .blur-text:hover { filter: blur(0); }
        .hide-translation { display: none !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        #unit-menu-dropdown { max-height: 70vh; overflow-y: auto; }
        /* Language dropdown: always opens downward, never off-screen */
        #lang-wrapper { position: relative; }
        #lang-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            width: 15rem;
            max-height: min(60vh, calc(100vh - 100px));
            overflow-y: auto;
            z-index: 60;
        }
        #lang-menu.hidden, #unit-menu-dropdown.hidden { display: none; }
        /* Dialogue list style (image 2) */
        .dialogue-row { display: flex; align-items: flex-start; gap: 12px; padding: 14px 0; border-bottom: 1px solid #f1f5f9; }
        .dialogue-row:last-child { border-bottom: none; }
        .dialogue-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; margin-top: 2px; }
        .dialogue-body { flex: 1; min-width: 0; }
        .dialogue-speaker-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .dialogue-speaker-name { font-size: 12px; font-weight: 700; }
        .dialogue-listen-btn { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; border: 1px solid; cursor: pointer; transition: all 0.15s; }
        .dialogue-korean { font-size: 15px; font-weight: 500; color: #1e293b; line-height: 1.6; }
        .dialogue-trans { font-size: 12px; color: #64748b; margin-top: 3px; line-height: 1.5; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-2">
            <div class="flex items-center space-x-3">
                <!-- Burger Menu -->
                <div class="relative">
                    <button id="unit-burger-btn" onclick="toggleUnitMenu()" class="p-2 bg-indigo-800 hover:bg-indigo-600 rounded-lg text-white transition flex items-center justify-center focus:outline-none" title="단원 선택">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                    <div id="unit-menu-dropdown" class="hidden absolute left-0 mt-2 w-72 bg-white rounded-xl shadow-xl border border-slate-200 z-50 p-3 space-y-1 text-slate-800 custom-scrollbar">
                        <div class="text-xs font-bold text-slate-400 px-2 py-1 border-b border-slate-100 mb-1 flex items-center justify-between sticky top-0 bg-white">
                            <span>단원 선택 <span class="font-normal text-slate-400">(Select Unit)</span></span>
                            <button onclick="toggleUnitMenu()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div id="unit-btn-list"></div>
                    </div>
                </div>
                <i class="fa-solid fa-book-open text-2xl text-amber-300"></i>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold tracking-tight inline">한국어 중급 듣기 공부</h1>
                    <span class="text-xs font-normal text-indigo-200 block sm:inline ml-0 sm:ml-2">(Korean Intermediate Listening)</span>
                </div>
            </div>
            <!-- Language Selector (custom dropdown: always opens downward) -->
            <div id="lang-wrapper" class="relative">
                <button id="lang-btn" onclick="toggleLangMenu(event)" class="flex items-center space-x-2 bg-indigo-800 hover:bg-indigo-600 px-3 py-1.5 rounded-lg text-sm border border-indigo-600 text-white font-semibold transition focus:outline-none">
                    <i class="fa-solid fa-globe text-amber-300"></i>
                    <span id="lang-current-label">English (영어)</span>
                    <i class="fa-solid fa-chevron-down text-[10px] text-indigo-200"></i>
                </button>
                <div id="lang-menu" class="hidden absolute right-0 top-full mt-2 w-56 bg-white rounded-xl shadow-xl border border-slate-200 z-50 p-1.5 custom-scrollbar" style="max-height: 60vh; overflow-y: auto;"></div>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="flex-grow max-w-5xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">

        <!-- Sidebar -->
        <aside class="lg:col-span-1 space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-4">
                <h2 class="font-bold text-slate-700 flex items-center gap-2 text-base border-b pb-2">
                    <i class="fa-solid fa-sliders text-indigo-600"></i> 오디오 &amp; 학습 설정
                </h2>
                <!-- Speed Controls -->
                <div>
                    <label class="text-xs text-slate-500 font-medium block mb-1.5">듣기 속도 (Playback Speed)</label>
                    <div class="grid grid-cols-5 gap-1 bg-slate-100 p-1 rounded-lg text-center font-medium text-[11px]">
                        <button onclick="setSpeed(0.5)" id="speed-0.5" class="speed-btn py-1.5 rounded hover:bg-white transition">0.5x</button>
                        <button onclick="setSpeed(0.75)" id="speed-0.75" class="speed-btn py-1.5 rounded hover:bg-white transition">0.75x</button>
                        <button onclick="setSpeed(1.0)" id="speed-1.0" class="speed-btn py-1.5 rounded bg-white shadow-sm text-indigo-600 font-bold transition">1.0x</button>
                        <button onclick="setSpeed(1.25)" id="speed-1.25" class="speed-btn py-1.5 rounded hover:bg-white transition">1.25x</button>
                        <button onclick="setSpeed(1.5)" id="speed-1.5" class="speed-btn py-1.5 rounded hover:bg-white transition">1.5x</button>
                    </div>
                </div>
                <!-- Visibility Toggles -->
                <div class="space-y-2">
                    <label class="text-xs text-slate-500 font-medium block">텍스트 표시 설정</label>
                    <button id="toggle-hide-all" onclick="toggleHideAll()" class="w-full py-2.5 px-3 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-semibold text-slate-700 flex items-center justify-between transition">
                        <span>모든 대화 가리기<br><span class="text-[11px] font-normal text-slate-500">(Hide Scripts)</span></span>
                        <i id="hide-all-icon" class="fa-solid fa-eye-slash text-slate-500 ml-2"></i>
                    </button>
                    <button id="toggle-hide-trans" onclick="toggleHideTrans()" class="w-full py-2.5 px-3 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-semibold text-slate-700 flex items-center justify-between transition">
                        <span>모든 번역문 가리기<br><span class="text-[11px] font-normal text-slate-500">(Hide Translations)</span></span>
                        <i id="hide-trans-icon" class="fa-solid fa-language text-slate-500 ml-2"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <section class="lg:col-span-3 space-y-6">
            <div class="bg-white rounded-2xl p-5 md:p-8 book-shadow border border-slate-200 relative">

                <!-- Unit Header -->
                <div class="border-b border-slate-200 pb-5 mb-6">
                    <div class="flex items-center gap-2 mb-2">
                        <span id="unit-badge" class="px-3 py-1 bg-indigo-600 text-white text-xs font-bold rounded-full">Unit 1</span>
                        <span class="text-xs text-slate-500 font-medium">중급 듣기 심화 학습 (TOPIK 3급)</span>
                    </div>
                    <h2 id="unit-title" class="text-2xl md:text-3xl font-extrabold text-slate-800"></h2>
                    <p id="unit-title-trans" class="text-sm md:text-base font-semibold text-indigo-600 mt-0.5 translation-text"></p>
                    <p id="unit-desc" class="text-xs md:text-sm text-slate-600 mt-2 font-medium"></p>
                    <p id="unit-desc-trans" class="text-xs md:text-sm text-slate-400 mt-0.5 translation-text"></p>
                </div>

                <!-- Step 1: Dialogue -->
                <div id="section-dialogue" class="mb-10 scroll-mt-20 pt-2">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-bold text-slate-700 flex items-center gap-2 text-base">
                            <i class="fa-solid fa-headphones text-indigo-600"></i> [Step 1] 대화 듣기 (Dialogue)
                        </h3>
                        <button id="play-all-btn" onclick="playFullDialogue()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-lg flex items-center gap-2 transition shadow-sm">
                            <i class="fa-solid fa-play text-[10px]"></i> 전체 듣기 (Play All)
                        </button>
                    </div>
                    <div id="dialogue-container" class="divide-y divide-slate-100"></div>
                </div>

                <!-- Step 2: Vocabulary -->
                <div id="section-vocab" class="mb-10 scroll-mt-20 pt-4 border-t border-slate-100">
                    <h3 class="font-bold text-slate-700 flex items-center gap-2 text-base mb-1">
                        <i class="fa-solid fa-spell-check text-emerald-600"></i> [Step 2] 필수 어휘 (Vocabulary)
                    </h3>
                    <p class="text-xs text-slate-500 mb-3 pl-1">단어를 클릭하면 발음을 들을 수 있습니다.</p>
                    <div id="vocab-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3"></div>
                </div>

                <!-- Step 3: Key Patterns -->
                <div id="section-patterns" class="mb-10 scroll-mt-20 pt-4 border-t border-slate-100">
                    <h3 class="font-bold text-slate-700 flex items-center gap-2 text-base mb-4">
                        <i class="fa-solid fa-lightbulb text-amber-500"></i> [Step 3] 핵심 문형 (Key Patterns)
                    </h3>
                    <div id="patterns-container" class="space-y-3"></div>
                </div>

                <!-- Step 4: Quiz -->
                <div id="section-quiz" class="mb-4 scroll-mt-20 pt-4 border-t border-slate-100">
                    <h3 class="font-bold text-slate-700 flex items-center gap-2 text-base mb-4">
                        <i class="fa-solid fa-circle-question text-rose-500"></i> [Step 4] 실전 듣기 평가 (Quizzes)
                    </h3>
                    <div id="quiz-list" class="space-y-4"></div>
                </div>

                <!-- Navigation -->
                <div class="flex items-center justify-between pt-6 border-t border-slate-100 mt-6">
                    <button id="prev-btn" onclick="goToPrevUnit()" class="flex items-center gap-2 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-xl transition disabled:opacity-40" disabled>
                        <i class="fa-solid fa-chevron-left text-xs"></i> 이전 단원
                    </button>
                    <span id="unit-progress" class="text-xs text-slate-400 font-medium">1 / 30</span>
                    <button id="next-btn" onclick="goToNextUnit()" class="flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-xl transition">
                        다음 단원 <i class="fa-solid fa-chevron-right text-xs"></i>
                    </button>
                </div>
            </div>
        </section>
    </main>

<script>
// ============================================================
// UNITS DATA
// ============================================================
const unitsData = {
  1: {"id":1,"title":"약속 잡기","titleTrans":{"en":"Making Plans","de":"Verabredung treffen","fr":"Prendre rendez-vous","es":"Hacer planes","pl":"Umawianie się","it":"Prendere appuntamento","sv":"Boka möte","fi":"Tapaamisen sopiminen","ja":"約束を取り決める","zh-CN":"约定计划"},"desc":"주말 만남을 계획하는 대화","descTrans":{"en":"A conversation planning a weekend meetup","de":"Ein Gespräch zur Planung eines Wochendtreffens","fr":"Une conversation pour planifier une rencontre le week-end","es":"Una conversación para planificar un encuentro de fin de semana","pl":"Rozmowa planująca spotkanie w weekend","it":"Una conversazione per pianificare un incontro nel fine settimana","sv":"Ett samtal om att planera ett helgmöte","fi":"Keskustelu viikonlopputapaamisen suunnittelusta","ja":"週末の集まりを計画する会話","zh-CN":"计划周末见面的对话"},"dialogue":[{"speaker":"지민","text":"수미야, 이번 주말에 시간 있어?","trans":{"en":"Sumi, are you free this weekend?","de":"Sumi, hast du dieses Wochenende Zeit?","fr":"Sumi, tu es libre ce week-end ?","es":"Sumi, ¿tienes tiempo este fin de semana?","pl":"Sumi, masz czas w ten weekend?","it":"Sumi, sei libera questo fine settimana?","sv":"Sumi, har du tid i helgen?","fi":"Sumi, onko sinulla aikaa tänä viikonloppuna?","ja":"スミ、今週末時間ある?","zh-CN":"秀美，这个周末有时间吗？"}},{"speaker":"수미","text":"응, 특별한 계획은 없어. 왜?","trans":{"en":"Yes, I don't have any special plans. Why?","de":"Ja, ich habe keine besonderen Pläne. Warum?","fr":"Oui, je n'ai pas de plans particuliers. Pourquoi ?","es":"Sí, no tengo planes especiales. ¿Por qué?","pl":"Tak, nie mam żadnych szczególnych planów. Dlaczego?","it":"Sì, non ho piani particolari. Perché?","sv":"Ja, jag har inga speciella planer. Varför?","fi":"Kyllä, minulla ei ole erityisiä suunnitelmia. Miksi?","ja":"うん、特別な予定はないよ。なぜ?","zh-CN":"嗯，没有特别的计划。怎么了？"}},{"speaker":"지민","text":"같이 영화 보러 가지 않을래? 새로 나온 한국 영화가 있거든.","trans":{"en":"Do you want to go see a movie together? There's a new Korean movie out.","de":"Wollen wir zusammen ins Kino gehen? Es gibt einen neuen koreanischen Film.","fr":"Tu veux aller voir un film ensemble ? Il y a un nouveau film coréen.","es":"¿Quieres ir al cine juntos? Hay una nueva película coreana.","pl":"Chcesz iść razem do kina? Wyszedł nowy koreański film.","it":"Vuoi andare al cinema insieme? C'è un nuovo film coreano.","sv":"Vill du gå på bio tillsammans? Det finns en ny koreansk film.","fi":"Haluatko mennä elokuviin yhdessä? Siellä on uusi korealainen elokuva.","ja":"一緒に映画見に行かない? 新しい韓国映画があるんだけど。","zh-CN":"要不要一起去看电影？有一部新出的韩国电影。"}},{"speaker":"수미","text":"좋아! 언제가 좋아?","trans":{"en":"Sounds good! When is good for you?","de":"Gut! Wann passt es dir?","fr":"Super ! Quand est-ce qui te convient ?","es":"¡Bien! ¿Cuándo te viene bien?","pl":"Świetnie! Kiedy ci odpowiada?","it":"Ottimo! Quando ti fa comodo?","sv":"Bra! När passar det dig?","fi":"Hienoa! Milloin sopii sinulle?","ja":"いいね！いつがいい?","zh-CN":"好的！你什么时候方便？"}},{"speaker":"지민","text":"토요일 오후 어때? 2시쯤 만나서 밥도 먹고 영화도 보자.","trans":{"en":"How about Saturday afternoon? Let's meet around 2 and eat and watch a movie.","de":"Wie wäre es am Samstagnochmittag? Treffen wir uns gegen 2 Uhr, essen und schauen einen Film.","fr":"Que dirais-tu de samedi après-midi ? Retrouvons-nous vers 2h, mangeons et regardons un film.","es":"¿Qué tal el sábado por la tarde? Quedamos sobre las 2, comemos y vemos una película.","pl":"Co powiesz na sobotnie popołudnie? Spotkajmy się około 2, zjemy i obejrzymy film.","it":"Che ne dici del sabato pomeriggio? Incontriamoci verso le 2, mangiamo e guardiamo un film.","sv":"Vad sägs om lördagseftermiddagen? Låt oss träffas runt kl. 2, äta och se en film.","fi":"Mitä sanot lauantai-iltapäivästä? Tavataan noin kello 2, syödään ja katsotaan elokuva.","ja":"土曜日の午後はどう? 2時頃会って、ご飯食べて映画も見よう。","zh-CN":"周六下午怎么样？大约2点见面，吃饭再看电影吧。"}},{"speaker":"수미","text":"좋아. 그런데 어디서 만날까?","trans":{"en":"Okay. But where should we meet?","de":"Okay. Aber wo sollen wir uns treffen?","fr":"D'accord. Mais où on se retrouve ?","es":"De acuerdo. Pero, ¿dónde quedamos?","pl":"Dobrze. Ale gdzie się spotkamy?","it":"Va bene. Ma dove ci incontriamo?","sv":"Okej. Men var ska vi träffas?","fi":"Selvä. Mutta missä tavataan?","ja":"いいよ。でも、どこで会おうか?","zh-CN":"好的。但是在哪里见面呢？"}},{"speaker":"지민","text":"홍대 앞 카페에서 만나자. 거기서 점심 먹고 근처 영화관에 가면 어때?","trans":{"en":"Let's meet at the café in front of Hongdae. How about we eat lunch there and go to the nearby cinema?","de":"Treffen wir uns im Café vor Hongdae. Was hältst du davon, dort Mittagessen und dann ins nahe Kino zu gehen?","fr":"Retrouvons-nous au café devant Hongdae. On pourrait déjeuner là-bas et aller au cinéma tout près ?","es":"Quedemos en el café frente a Hongdae. ¿Qué tal si almorzamos allí y vamos al cine cercano?","pl":"Spotkajmy się w kawiarni przed Hongdae. Co powiesz na zjedzenie lunchu tam i pójście do pobliskiego kina?","it":"Incontriamoci al caffè davanti a Hongdae. Che ne dici di pranzare lì e andare al cinema vicino?","sv":"Låt oss träffas på caféet framför Hongdae. Hur låter det att äta lunch där och gå till det närliggande biografen?","fi":"Tavataan kahvilassa Hongdaen edessä. Mitä sanot, että syömme siellä lounaan ja menemme lähellä olevaan elokuvateatteriin?","ja":"弘大の前のカフェで会おう。そこでランチ食べて、近くの映画館に行くのはどう?","zh-CN":"在弘大前面的咖啡厅见面吧。在那里吃完午饭，去附近的电影院怎么样？"}},{"speaker":"수미","text":"완벽해! 그럼 토요일 오후 2시에 홍대 카페에서 보자.","trans":{"en":"Perfect! Then let's meet at the Hongdae café at 2 PM on Saturday.","de":"Perfekt! Dann treffen wir uns am Samstag um 14 Uhr im Hongdae-Café.","fr":"Parfait ! Alors on se retrouve au café de Hongdae à 14h samedi.","es":"¡Perfecto! Entonces quedamos en el café de Hongdae el sábado a las 2 PM.","pl":"Idealnie! Spotykamy się więc w sobotę o 14:00 w kawiarni Hongdae.","it":"Perfetto! Allora ci vediamo al caffè di Hongdae sabato alle 14.","sv":"Perfekt! Vi ses då på caféet i Hongdae kl. 14 på lördag.","fi":"Täydellinen! Tavataan siis Hongdaen kahvilassa lauantaina kello 14.","ja":"完璧！じゃあ、土曜日午後2時に弘大のカフェで会おう。","zh-CN":"太好了！那么周六下午2点在弘大咖啡厅见。"}},{"speaker":"지민","text":"응, 기대된다! 혹시 늦으면 미리 연락해 줘.","trans":{"en":"Yes, I'm excited! If you're going to be late, let me know in advance.","de":"Ja, ich freue mich! Falls du zu spät kommst, sag mir vorher Bescheid.","fr":"Oui, j'ai hâte ! Si tu es en retard, préviens-moi à l'avance.","es":"¡Sí, estoy emocionada! Si vas a llegar tarde, avísame con antelación.","pl":"Tak, nie mogę się doczekać! Jeśli się spóźnisz, daj mi znać wcześniej.","it":"Sì, non vedo l'ora! Se sei in ritardo, avvisami in anticipo.","sv":"Ja, jag ser fram emot det! Om du blir sen, meddela mig i förväg.","fi":"Kyllä, odotan innolla! Jos myöhästyt, ilmoita minulle etukäteen.","ja":"うん、楽しみ！もし遅れたら事前に連絡して。","zh-CN":"嗯，好期待！如果你要迟到的话，提前联系我。"}},{"speaker":"수미","text":"알겠어. 나도 정말 기대돼. 그럼 토요일에 봐!","trans":{"en":"Okay. I'm really looking forward to it too. See you Saturday!","de":"Alright. Ich freue mich auch wirklich. Bis Samstag!","fr":"D'accord. J'ai vraiment hâte aussi. À samedi !","es":"De acuerdo. Yo también tengo muchas ganas. ¡Hasta el sábado!","pl":"Dobrze. Ja też naprawdę się cieszę. Do zobaczenia w sobotę!","it":"Va bene. Anch'io non vedo l'ora. A sabato!","sv":"Okej. Jag ser också verkligen fram emot det. Vi ses på lördag!","fi":"Selvä. Minäkin odotan innolla. Nähdään lauantaina!","ja":"わかった。私も楽しみ。じゃあ、土曜日に!","zh-CN":"好的。我也很期待。那周六见！"}}],"vocab":[{"word":"약속","trans":{"en":"appointment/promise","de":"Verabredung","fr":"rendez-vous","es":"cita/promesa","pl":"spotkanie/obietnica","it":"appuntamento","sv":"möte/löfte","fi":"tapaaminen/lupaus","ja":"約束","zh-CN":"约定/承诺"}},{"word":"계획","trans":{"en":"plan","de":"Plan","fr":"plan","es":"plan","pl":"plan","it":"piano","sv":"plan","fi":"suunnitelma","ja":"計画","zh-CN":"计划"}},{"word":"시간","trans":{"en":"time","de":"Zeit","fr":"temps","es":"tiempo","pl":"czas","it":"tempo","sv":"tid","fi":"aika","ja":"時間","zh-CN":"时间"}},{"word":"영화관","trans":{"en":"movie theater","de":"Kino","fr":"cinéma","es":"cine","pl":"kino","it":"cinema","sv":"biograf","fi":"elokuvateatteri","ja":"映画館","zh-CN":"电影院"}},{"word":"만나다","trans":{"en":"to meet","de":"treffen","fr":"rencontrer","es":"encontrarse","pl":"spotykać się","it":"incontrare","sv":"träffas","fi":"tavata","ja":"会う","zh-CN":"见面"}},{"word":"연락하다","trans":{"en":"to contact","de":"kontaktieren","fr":"contacter","es":"contactar","pl":"kontaktować się","it":"contattare","sv":"kontakta","fi":"ottaa yhteyttä","ja":"連絡する","zh-CN":"联系"}},{"word":"기대되다","trans":{"en":"to look forward to","de":"sich freuen auf","fr":"avoir hâte","es":"tener ilusión","pl":"cieszyć się na","it":"non vedere l'ora","sv":"se fram emot","fi":"odottaa innolla","ja":"楽しみにする","zh-CN":"期待"}}],"patterns":[{"pattern":"-기로 하다","patternTrans":{"en":"to decide/plan to do","de":"beschließen zu tun","fr":"décider de faire","es":"decidir hacer","pl":"postanowić zrobić","it":"decidere di fare","sv":"bestämma sig för att göra","fi":"päättää tehdä","ja":"〜することにする","zh-CN":"决定做某事"},"example":"이번 주말에 영화 보기로 했어.","trans":{"en":"We decided to watch a movie this weekend.","de":"Wir haben beschlossen, dieses Wochenende einen Film zu schauen.","fr":"On a décidé de regarder un film ce week-end.","es":"Decidimos ver una película este fin de semana.","pl":"Postanowiliśmy obejrzeć film w ten weekend.","it":"Abbiamo deciso di guardare un film questo fine settimana.","sv":"Vi bestämde oss för att se en film i helgen.","fi":"Päätimme katsoa elokuvan tänä viikonloppuna.","ja":"今週末に映画を見ることにした。","zh-CN":"我们决定这个周末去看电影。"}},{"pattern":"-지 않을래?","patternTrans":{"en":"Won't you...? / Do you want to...?","de":"Willst du nicht...?","fr":"Tu ne veux pas... ?","es":"¿No quieres...?","pl":"Czy nie chciałbyś...?","it":"Non vuoi...?","sv":"Vill du inte...?","fi":"Etkö haluaisi...?","ja":"〜しない？","zh-CN":"要不要...？"},"example":"같이 영화 보러 가지 않을래?","trans":{"en":"Do you want to go see a movie together?","de":"Willst du nicht zusammen ins Kino gehen?","fr":"Tu ne veux pas aller voir un film ensemble ?","es":"¿No quieres ir al cine juntos?","pl":"Czy nie chciałabyś pójść razem na film?","it":"Non vuoi andare a vedere un film insieme?","sv":"Vill du inte gå och se en film tillsammans?","fi":"Etkö haluaisi mennä katsomaan elokuvaa yhdessä?","ja":"一緒に映画見に行かない？","zh-CN":"要不要一起去看电影？"}},{"pattern":"-면 어때?","patternTrans":{"en":"How about if...? / What if...?","de":"Wie wäre es, wenn...?","fr":"Et si...?","es":"¿Qué tal si...?","pl":"Co powiesz na to, żeby...?","it":"Come sarebbe se...?","sv":"Hur vore det om...?","fi":"Mitä jos...?","ja":"〜すればどう？","zh-CN":"...怎么样？"},"example":"거기서 점심 먹고 근처 영화관에 가면 어때?","trans":{"en":"How about eating lunch there and going to the nearby cinema?","de":"Wie wäre es, dort Mittagessen und dann ins nahe Kino zu gehen?","fr":"Et si on déjeunait là-bas et qu'on allait au cinéma à côté ?","es":"¿Qué tal si almorzamos allí y vamos al cine cercano?","pl":"Co powiesz na zjedzenie lunchu tam i pójście do pobliskiego kina?","it":"Come sarebbe pranzare lì e andare al cinema vicino?","sv":"Hur vore det om vi åt lunch där och gick till det närliggande biografen?","fi":"Mitä jos söisimme siellä lounaan ja menisimme lähellä olevaan elokuvateatteriin?","ja":"そこでランチ食べて、近くの映画館に行けばどう？","zh-CN":"在那里吃完午饭，去附近的电影院怎么样？"}}],"quizzes":[{"type":"이해","questionAudio":"두 사람은 언제 만나기로 했습니까?","questionTrans":{"en":"When did the two decide to meet?","de":"Wann haben die beiden beschlossen, sich zu treffen?","fr":"Quand ont-ils décidé de se retrouver ?","es":"¿Cuándo decidieron encontrarse los dos?","pl":"Kiedy obydwoje postanowili się spotkać?","it":"Quando hanno deciso di incontrarsi i due?","sv":"När bestämde de sig för att träffas?","fi":"Milloin he kaksi päättivät tavata?","ja":"二人はいつ会うことにしましたか？","zh-CN":"两人决定什么时候见面？"},"options":[{"text":"금요일 오후","trans":{"en":"Friday afternoon","de":"Freitagnahmittag","fr":"Vendredi après-midi","es":"Viernes por la tarde","pl":"Piątek po południu","it":"Venerdì pomeriggio","sv":"Fredagseftermiddag","fi":"Perjantai-iltapäivä","ja":"金曜日の午後","zh-CN":"周五下午"}},{"text":"토요일 오전","trans":{"en":"Saturday morning","de":"Samstagmorgen","fr":"Samedi matin","es":"Sábado por la mañana","pl":"Sobota rano","it":"Sabato mattina","sv":"Lördagsmorgon","fi":"Lauantaiaamu","ja":"土曜日の午前","zh-CN":"周六上午"}},{"text":"토요일 오후","trans":{"en":"Saturday afternoon","de":"Samstagnachmittag","fr":"Samedi après-midi","es":"Sábado por la tarde","pl":"Sobota po południu","it":"Sabato pomeriggio","sv":"Lördagseftermiddag","fi":"Lauantai-iltapäivä","ja":"土曜日の午後","zh-CN":"周六下午"}},{"text":"일요일 오전","trans":{"en":"Sunday morning","de":"Sonntagmorgen","fr":"Dimanche matin","es":"Domingo por la mañana","pl":"Niedziela rano","it":"Domenica mattina","sv":"Söndagsmorgon","fi":"Sunnuntaiaamu","ja":"日曜日の午前","zh-CN":"周日上午"}}],"answer":2,"explanation":"대화에서 두 사람은 토요일 오후 2시에 만나기로 했습니다."},{"type":"이해","questionAudio":"두 사람은 어디에서 만나기로 했습니까?","questionTrans":{"en":"Where did the two decide to meet?","de":"Wo haben die beiden beschlossen, sich zu treffen?","fr":"Où ont-ils décidé de se retrouver ?","es":"¿Dónde decidieron encontrarse?","pl":"Gdzie postanowili się spotkać?","it":"Dove hanno deciso di incontrarsi?","sv":"Var bestämde de sig för att träffas?","fi":"Missä he päättivät tavata?","ja":"二人はどこで会うことにしましたか？","zh-CN":"两人决定在哪里见面？"},"options":[{"text":"지하철역 앞","trans":{"en":"In front of the subway station","de":"Vor der U-Bahnstation","fr":"Devant la station de métro","es":"Frente a la estación de metro","pl":"Przed stacją metra","it":"Davanti alla stazione della metropolitana","sv":"Framför tunnelbanestationen","fi":"Metroaseman edessä","ja":"地下鉄駅の前","zh-CN":"地铁站前面"}},{"text":"홍대 앞 카페","trans":{"en":"Café in front of Hongdae","de":"Café vor Hongdae","fr":"Café devant Hongdae","es":"Café frente a Hongdae","pl":"Kawiarnia przed Hongdae","it":"Caffè davanti a Hongdae","sv":"Caféet framför Hongdae","fi":"Kahvila Hongdaen edessä","ja":"弘大の前のカフェ","zh-CN":"弘大前面的咖啡厅"}},{"text":"영화관 앞","trans":{"en":"In front of the cinema","de":"Vor dem Kino","fr":"Devant le cinéma","es":"Frente al cine","pl":"Przed kinem","it":"Davanti al cinema","sv":"Framför biografen","fi":"Elokuvateatterin edessä","ja":"映画館の前","zh-CN":"电影院前面"}},{"text":"식당 앞","trans":{"en":"In front of the restaurant","de":"Vor dem Restaurant","fr":"Devant le restaurant","es":"Frente al restaurante","pl":"Przed restauracją","it":"Davanti al ristorante","sv":"Framför restaurangen","fi":"Ravintolan edessä","ja":"食堂の前","zh-CN":"餐厅前面"}}],"answer":1,"explanation":"지민은 홍대 앞 카페에서 만나자고 제안했고 수미도 동의했습니다."},{"type":"이해","questionAudio":"두 사람은 영화를 보기 전에 무엇을 하기로 했습니까?","questionTrans":{"en":"What did the two plan to do before watching the movie?","de":"Was planten die beiden zu tun, bevor sie den Film schauten?","fr":"Qu'ont-ils prévu de faire avant de voir le film ?","es":"¿Qué planearon hacer antes de ver la película?","pl":"Co postanowili zrobić przed obejrzeniem filmu?","it":"Cosa hanno pianificato di fare prima di guardare il film?","sv":"Vad planerade de att göra innan de såg filmen?","fi":"Mitä he suunnittelivat tekevänsä ennen elokuvan katsomista?","ja":"二人は映画を見る前に何をすることにしましたか？","zh-CN":"两人决定在看电影之前做什么？"},"options":[{"text":"커피 마시기","trans":{"en":"Drink coffee","de":"Kaffee trinken","fr":"Boire un café","es":"Tomar café","pl":"Pić kawę","it":"Bere un caffè","sv":"Dricka kaffe","fi":"Juoda kahvia","ja":"コーヒーを飲む","zh-CN":"喝咖啡"}},{"text":"점심 먹기","trans":{"en":"Eat lunch","de":"Mittagessen","fr":"Déjeuner","es":"Almorzar","pl":"Zjeść obiad","it":"Pranzare","sv":"Äta lunch","fi":"Syödä lounas","ja":"昼食を食べる","zh-CN":"吃午饭"}},{"text":"쇼핑하기","trans":{"en":"Go shopping","de":"Einkaufen gehen","fr":"Faire du shopping","es":"Ir de compras","pl":"Robić zakupy","it":"Fare shopping","sv":"Shoppa","fi":"Tehdä ostoksia","ja":"ショッピングする","zh-CN":"购物"}},{"text":"공원 산책하기","trans":{"en":"Walk in the park","de":"Im Park spazieren gehen","fr":"Se promener dans le parc","es":"Pasear por el parque","pl":"Spacerować w parku","it":"Passeggiare nel parco","sv":"Promenera i parken","fi":"Kävellä puistossa","ja":"公園を散歩する","zh-CN":"在公园散步"}}],"answer":1,"explanation":"지민은 홍대 카페에서 만나서 점심을 먹고 영화관에 가자고 했습니다."}]},
  2: {"id":2,"title":"직장 업무 보고","titleTrans":{"en":"Work Report","de":"Arbeitsbericht","fr":"Rapport de travail","es":"Informe de trabajo","pl":"Raport z pracy","it":"Rapporto di lavoro","sv":"Arbetsrapport","fi":"Työraportti","ja":"業務報告","zh-CN":"工作汇报"},"desc":"업무 진행 상황을 보고하는 대화","descTrans":{"en":"A conversation reporting on work progress","de":"Ein Gespräch über den Fortschritt bei der Arbeit","fr":"Une conversation sur l'avancement du travail","es":"Una conversación sobre el progreso del trabajo","pl":"Rozmowa na temat postępu prac","it":"Una conversazione sull'avanzamento del lavoro","sv":"Ett samtal om arbetsframsteg","fi":"Työn edistymisestä kertova keskustelu","ja":"業務の進捗を報告する会話","zh-CN":"汇报工作进展的对话"},"dialogue":[{"speaker":"민준","text":"팀장님, 이번 프로젝트 진행 상황 보고드리겠습니다.","trans":{"en":"Team leader, I'd like to report on the progress of this project.","de":"Teamleiter, ich möchte über den Fortschritt dieses Projekts berichten.","fr":"Chef d'équipe, je voudrais faire un rapport sur l'avancement de ce projet.","es":"Jefe de equipo, me gustaría informar sobre el progreso de este proyecto.","pl":"Kierowniku zespołu, chciałbym złożyć raport z postępu tego projektu.","it":"Capo team, vorrei riferire sui progressi di questo progetto.","sv":"Teamledare, jag skulle vilja rapportera om framstegen i det här projektet.","fi":"Tiimin johtaja, haluaisin raportoida tämän projektin edistymisestä.","ja":"チームリーダー、今回のプロジェクトの進捗状況をご報告します。","zh-CN":"组长，我来汇报一下这个项目的进展情况。"}},{"speaker":"지수","text":"네, 말씀해 보세요. 현재 어느 단계까지 왔나요?","trans":{"en":"Yes, please go ahead. What stage are you at currently?","de":"Ja, bitte erzählen Sie. In welchem Stadium befinden Sie sich derzeit?","fr":"Oui, allez-y. À quelle étape en êtes-vous actuellement ?","es":"Sí, por favor. ¿En qué etapa están actualmente?","pl":"Tak, proszę mówić. Na jakim etapie jesteście teraz?","it":"Sì, prego. A che fase siete attualmente?","sv":"Ja, varsågod. Var befinner ni er för tillfället?","fi":"Kyllä, kerro. Missä vaiheessa olette tällä hetkellä?","ja":"はい、おっしゃってください。今どの段階まで来ましたか？","zh-CN":"好的，请说。现在到哪个阶段了？"}},{"speaker":"민준","text":"현재 1단계 조사 작업은 완료했습니다. 전체 일정의 40%가 완료된 상태입니다.","trans":{"en":"The phase 1 survey work is currently complete. 40% of the overall schedule is done.","de":"Die Phase-1-Forschungsarbeit ist derzeit abgeschlossen. 40% des Gesamtzeitplans sind erledigt.","fr":"Le travail d'enquête de la phase 1 est actuellement terminé. 40% du calendrier global est accompli.","es":"El trabajo de investigación de la fase 1 está actualmente completado. El 40% del cronograma general está terminado.","pl":"Praca badawcza w fazie 1 jest obecnie ukończona. 40% całego harmonogramu jest gotowe.","it":"Il lavoro di ricerca della fase 1 è attualmente completato. Il 40% del programma complessivo è terminato.","sv":"Fas 1 undersökningsarbete är för tillfället slutfört. 40% av det totala schemat är klart.","fi":"Vaiheen 1 tutkimustyö on tällä hetkellä valmis. 40% kokonaisaikataulusta on tehty.","ja":"現在、第1段階の調査作業は完了しました。全体スケジュールの40%が完了した状態です。","zh-CN":"目前第一阶段的调查工作已经完成。整体进度完成了40%。"}},{"speaker":"지수","text":"생각보다 빠르게 진행되고 있군요. 다음 단계는 무엇인가요?","trans":{"en":"It's progressing faster than expected. What's the next step?","de":"Es schreitet schneller voran als erwartet. Was ist der nächste Schritt?","fr":"Ça avance plus vite que prévu. Quelle est la prochaine étape ?","es":"Está avanzando más rápido de lo esperado. ¿Cuál es el próximo paso?","pl":"Postępuje szybciej niż się spodziewano. Jaki jest następny krok?","it":"Sta procedendo più velocemente del previsto. Qual è il passo successivo?","sv":"Det går fortare än förväntat. Vad är nästa steg?","fi":"Se etenee odotettua nopeammin. Mikä on seuraava vaihe?","ja":"予想より早く進んでいますね。次のステップは何ですか？","zh-CN":"进展比预期的要快。下一步是什么？"}},{"speaker":"민준","text":"다음 주부터 2단계 분석 작업을 시작할 예정입니다. 약 2주가 걸릴 것 같습니다.","trans":{"en":"We plan to start phase 2 analysis work from next week. It will probably take about 2 weeks.","de":"Wir planen, nächste Woche mit der Phase-2-Analyse zu beginnen. Es wird wahrscheinlich etwa 2 Wochen dauern.","fr":"Nous prévoyons de commencer le travail d'analyse de la phase 2 la semaine prochaine. Ça prendra probablement environ 2 semaines.","es":"Planeamos comenzar el trabajo de análisis de la fase 2 la próxima semana. Probablemente tomará unas 2 semanas.","pl":"Planujemy rozpocząć pracę analityczną fazy 2 od przyszłego tygodnia. Zajmie to prawdopodobnie około 2 tygodni.","it":"Prevediamo di iniziare il lavoro di analisi della fase 2 dalla prossima settimana. Probabilmente ci vorranno circa 2 settimane.","sv":"Vi planerar att börja fas 2 analysarbete från nästa vecka. Det kommer förmodligen att ta ungefär 2 veckor.","fi":"Suunnittelemme aloittavamme vaiheen 2 analyysityön ensi viikolta. Se vie todennäköisesti noin 2 viikkoa.","ja":"来週から第2段階の分析作業を開始する予定です。約2週間かかると思います。","zh-CN":"计划从下周开始第二阶段的分析工作。大概需要两周时间。"}},{"speaker":"지수","text":"알겠습니다. 혹시 어려운 점이나 문제점은 없나요?","trans":{"en":"I see. Are there any difficulties or issues?","de":"Ich verstehe. Gibt es irgendwelche Schwierigkeiten oder Probleme?","fr":"Je vois. Y a-t-il des difficultés ou des problèmes ?","es":"Entiendo. ¿Hay alguna dificultad o problema?","pl":"Rozumiem. Czy są jakieś trudności lub problemy?","it":"Capisco. Ci sono difficoltà o problemi?","sv":"Jag förstår. Finns det några svårigheter eller problem?","fi":"Ymmärrän. Onko mitään vaikeuksia tai ongelmia?","ja":"わかりました。何か困っていることや問題はありますか？","zh-CN":"明白了。有没有什么困难或问题？"}},{"speaker":"민준","text":"네, 데이터 수집에서 예상보다 시간이 더 걸리고 있습니다. 외부 협력사의 자료 제공이 늦어지고 있어서요.","trans":{"en":"Yes, data collection is taking longer than expected. The external partner's data provision is delayed.","de":"Ja, die Datenerhebung dauert länger als erwartet. Die Datenbereitstellung des externen Partners verzögert sich.","fr":"Oui, la collecte de données prend plus de temps que prévu. La fourniture de données du partenaire externe est en retard.","es":"Sí, la recopilación de datos está tomando más tiempo de lo esperado. La provisión de datos del socio externo se está retrasando.","pl":"Tak, zbieranie danych trwa dłużej niż oczekiwano. Dostarczenie danych przez zewnętrznego partnera się opóźnia.","it":"Sì, la raccolta dati sta richiedendo più tempo del previsto. La fornitura di dati del partner esterno è in ritardo.","sv":"Ja, datainsamlingen tar längre tid än förväntat. Den externa partnerns dataleverans är försenad.","fi":"Kyllä, tiedonkeruu kestää odotettua kauemmin. Ulkoisen kumppanin tietojen toimittaminen viivästyy.","ja":"はい、データ収集で予想より時間がかかっています。外部協力会社からの資料提供が遅れているためです。","zh-CN":"是的，数据收集比预期花费更多时间。外部合作方的资料提供有所延迟。"}},{"speaker":"지수","text":"그렇군요. 제가 협력사에 직접 연락해 드릴까요?","trans":{"en":"I see. Would you like me to contact the partner company directly?","de":"Ich verstehe. Soll ich direkt mit dem Partnerunternehmen Kontakt aufnehmen?","fr":"Je vois. Voulez-vous que je contacte directement le partenaire ?","es":"Ya veo. ¿Quiere que contacte directamente con la empresa colaboradora?","pl":"Rozumiem. Czy chciałby Pan, żebym bezpośrednio skontaktował się z firmą partnerską?","it":"Capisco. Vuole che contatti direttamente l'azienda partner?","sv":"Jag förstår. Vill du att jag kontaktar partnerföretaget direkt?","fi":"Ymmärrän. Haluatko, että otan suoraan yhteyttä yhteistyöyritykseen?","ja":"そうですか。私が直接協力会社に連絡しましょうか？","zh-CN":"这样啊。我来直接联系合作方好吗？"}},{"speaker":"민준","text":"감사합니다. 팀장님이 직접 연락해 주시면 더 빨리 해결될 것 같습니다.","trans":{"en":"Thank you. It seems like it will be resolved faster if you contact them directly.","de":"Danke. Wenn Sie direkt Kontakt aufnehmen, wird es wahrscheinlich schneller gelöst.","fr":"Merci. Je pense que ce sera résolu plus rapidement si vous les contactez directement.","es":"Gracias. Parece que se resolverá más rápido si usted los contacta directamente.","pl":"Dziękuję. Wydaje się, że zostanie to rozwiązane szybciej, jeśli skontaktuje się Pan bezpośrednio.","it":"Grazie. Sembra che si risolverà più velocemente se lei li contatta direttamente.","sv":"Tack. Det verkar som att det löser sig snabbare om du kontaktar dem direkt.","fi":"Kiitos. Vaikuttaa siltä, että se ratkeaa nopeammin, jos ottaisit suoraan yhteyttä.","ja":"ありがとうございます。チームリーダーが直接連絡してくださると、より早く解決できそうです。","zh-CN":"谢谢。如果组长您直接联系的话，应该会更快解决。"}}],"vocab":[{"word":"보고","trans":{"en":"report","de":"Bericht","fr":"rapport","es":"informe","pl":"raport","it":"rapporto","sv":"rapport","fi":"raportti","ja":"報告","zh-CN":"汇报"}},{"word":"진행 상황","trans":{"en":"progress status","de":"Fortschrittsstatus","fr":"état d'avancement","es":"estado de progreso","pl":"status postępu","it":"stato di avanzamento","sv":"framstegsstatus","fi":"edistymistilanne","ja":"進捗状況","zh-CN":"进展情况"}},{"word":"완료하다","trans":{"en":"to complete","de":"abschließen","fr":"achever","es":"completar","pl":"ukończyć","it":"completare","sv":"slutföra","fi":"viimeistellä","ja":"完了する","zh-CN":"完成"}},{"word":"분석","trans":{"en":"analysis","de":"Analyse","fr":"analyse","es":"análisis","pl":"analiza","it":"analisi","sv":"analys","fi":"analyysi","ja":"分析","zh-CN":"分析"}},{"word":"협력사","trans":{"en":"partner company","de":"Partnerunternehmen","fr":"entreprise partenaire","es":"empresa colaboradora","pl":"firma partnerska","it":"azienda partner","sv":"partnerföretag","fi":"yhteistyöyritys","ja":"協力会社","zh-CN":"合作方"}},{"word":"예상","trans":{"en":"expectation/estimate","de":"Erwartung","fr":"prévision","es":"estimación","pl":"oczekiwanie","it":"previsione","sv":"förväntan","fi":"odotus","ja":"予想","zh-CN":"预计"}},{"word":"해결하다","trans":{"en":"to resolve/solve","de":"lösen","fr":"résoudre","es":"resolver","pl":"rozwiązywać","it":"risolvere","sv":"lösa","fi":"ratkaista","ja":"解決する","zh-CN":"解决"}}],"patterns":[{"pattern":"-드리겠습니다","patternTrans":{"en":"I will (humble/polite form)","de":"Ich werde (höfliche Form)","fr":"Je vais (forme humble)","es":"Voy a (forma humilde)","pl":"Będę (forma grzecznościowa)","it":"Farò (forma umile)","sv":"Jag ska (ödmjuk form)","fi":"Tulen tekemään (nöyrä muoto)","ja":"〜いたします（謙遜表現）","zh-CN":"我将...（谦逊表达）"},"example":"진행 상황 보고드리겠습니다.","tr   3: {"id":3,"title":"병원 예약","titleTrans":{"en":"Hospital Appointment","de":"Arzttermin","fr":"Rendez-vous médical","es":"Cita médica","pl":"Wizyta lekarska","it":"Appuntamento medico","sv":"Sjukhusbesök","fi":"Lääkäriajan varaus","ja":"病院予約","zh-CN":"医院预约"},"desc":"진료 예약과 증상을 설명하는 대화","descTrans":{"en":"A conversation about making a medical appointment and describing symptoms","de":"Ein Gespräch über die Vereinbarung eines Arzttermins und die Beschreibung von Symptomen","fr":"Une conversation sur la prise de rendez-vous médical et la description des symptômes","es":"Una conversación sobre hacer una cita médica y describir síntomas","pl":"Rozmowa o umówieniu wizyty lekarskiej i opisaniu objawów","it":"Una conversazione sulla prenotazione di un appuntamento medico e la descrizione dei sintomi","sv":"Ett samtal om att boka ett läkarbesök och beskriva symtom","fi":"Keskustelu lääkäriajan varaamisesta ja oireiden kuvaamisesta","ja":"診察予約と症状を説明する会話","zh-CN":"预约就诊并描述症状的对话"},"dialogue":[{"speaker":"지수","text":"안녕하세요. 진료 예약을 하고 싶은데요.","trans":{"en":"Hello. I'd like to make a medical appointment.","de":"Hallo. Ich möchte einen Arzttermin vereinbaren.","fr":"Bonjour. Je voudrais prendre un rendez-vous médical.","es":"Hola. Me gustaría concertar una cita médica.","pl":"Dzień dobry. Chciałabym umówić wizytę lekarską.","it":"Salve. Vorrei prenotare un appuntamento medico.","sv":"Hej. Jag skulle vilja boka ett läkarbesök.","fi":"Hei. Haluaisin varata lääkäriajan.","ja":"こんにちは。診察の予約をしたいのですが。","zh-CN":"你好，我想预约就诊。"}},{"speaker":"민준","text":"네, 어떤 과 진료를 원하십니까?","trans":{"en":"Yes, which department would you like to see?","de":"Ja, welche Abteilung möchten Sie aufsuchen?","fr":"Oui, quel département souhaitez-vous consulter ?","es":"Sí, ¿qué departamento desea consultar?","pl":"Tak, jakie oddziałanie chciałaby Pani skonsultować?","it":"Sì, quale reparto desidera consultare?","sv":"Ja, vilken avdelning vill du besöka?","fi":"Kyllä, minkä osaston vastaanottoa haluatte?","ja":"はい、どちらの科の診察をご希望ですか？","zh-CN":"好的，您想挂哪个科？"}},{"speaker":"지수","text":"내과를 예약하고 싶습니다. 며칠 전부터 배가 많이 아파서요.","trans":{"en":"I'd like to book internal medicine. I've had severe stomach pain for a few days.","de":"Ich möchte die Innere Medizin buchen. Ich habe seit einigen Tagen starke Bauchschmerzen.","fr":"Je voudrais réserver la médecine interne. J'ai de fortes douleurs abdominales depuis quelques jours.","es":"Me gustaría reservar medicina interna. He tenido fuertes dolores de estómago durante unos días.","pl":"Chciałabym zarezerwować wizytę w internie. Mam silne bóle brzucha od kilku dni.","it":"Vorrei prenotare medicina interna. Ho forti dolori addominali da qualche giorno.","sv":"Jag skulle vilja boka internmedicin. Jag har haft svår magvärk i några dagar.","fi":"Haluaisin varata sisätauteihin. Minulla on ollut kova vatsakipu muutaman päivän ajan.","ja":"内科を予約したいです。数日前からお腹がとても痛くて。","zh-CN":"我想预约内科。我几天前就开始肚子很疼。"}},{"speaker":"민준","text":"언제부터 증상이 있으셨나요? 그리고 다른 증상은 없으신가요?","trans":{"en":"When did the symptoms start? And do you have any other symptoms?","de":"Wann haben die Symptome begonnen? Und haben Sie andere Symptome?","fr":"Depuis quand avez-vous ces symptômes ? Et avez-vous d'autres symptômes ?","es":"¿Desde cuándo tiene los síntomas? ¿Y tiene otros síntomas?","pl":"Od kiedy ma Pani objawy? I czy ma Pani inne objawy?","it":"Da quando ha i sintomi? E ha altri sintomi?","sv":"Sedan när har du haft symptomen? Och har du några andra symptom?","fi":"Milloin oireet alkoivat? Ja onko teillä muita oireita?","ja":"いつから症状がありましたか？また、他に症状はありますか？","zh-CN":"什么时候开始有症状的？还有其他症状吗？"}},{"speaker":"지수","text":"3일 전부터 아팠고요, 열도 조금 있고 밥을 잘 못 먹겠어요.","trans":{"en":"I've been in pain for 3 days, and I have a slight fever and can't eat well.","de":"Ich habe seit 3 Tagen Schmerzen, habe ein leichtes Fieber und kann nicht gut essen.","fr":"J'ai mal depuis 3 jours, j'ai une légère fièvre et je n'arrive pas à bien manger.","es":"He tenido dolor durante 3 días, tengo un poco de fiebre y no puedo comer bien.","pl":"Boli mnie od 3 dni, mam lekką gorączkę i nie mogę dobrze jeść.","it":"Ho dolore da 3 giorni, ho un po' di febbre e non riesco a mangiare bene.","sv":"Jag har haft ont i 3 dagar, har lite feber och kan inte äta ordentligt.","fi":"Minulla on ollut kipu 3 päivää, minulla on hieman kuumetta enkä pysty syömään kunnolla.","ja":"3日前から痛くて、少し熱もあって、ご飯もあまり食べられません。","zh-CN":"三天前开始痛，还有点发烧，吃不下饭。"}},{"speaker":"민준","text":"네, 알겠습니다. 가장 가까운 예약 가능한 시간이 내일 오전 10시인데요, 괜찮으신가요?","trans":{"en":"I see. The earliest available appointment is tomorrow at 10 AM. Is that okay?","de":"Ich verstehe. Der frühestmögliche Termin ist morgen um 10 Uhr. Ist das in Ordnung?","fr":"Je vois. Le prochain créneau disponible est demain à 10h. Est-ce que ça vous convient ?","es":"Ya veo. La cita disponible más cercana es mañana a las 10 AM. ¿Está bien?","pl":"Rozumiem. Najbliższy dostępny termin to jutro o godzinie 10. Czy to odpowiada?","it":"Capisco. Il prossimo appuntamento disponibile è domani alle 10. Va bene?","sv":"Jag förstår. Den närmaste tillgängliga tiden är i morgon kl. 10. Är det okej?","fi":"Ymmärrän. Lähin saatavilla oleva aika on huomenna kello 10. Käykö se?","ja":"わかりました。一番近い予約可能な時間が明日の午前10時ですが、よろしいですか？","zh-CN":"好的。最近可预约的时间是明天上午10点，可以吗？"}},{"speaker":"지수","text":"네, 그 시간 좋습니다. 예약할게요.","trans":{"en":"Yes, that time is fine. I'll make the appointment.","de":"Ja, diese Zeit ist gut. Ich buche es.","fr":"Oui, cette heure convient. Je vais prendre le rendez-vous.","es":"Sí, esa hora está bien. Haré la reserva.","pl":"Tak, ta godzina mi odpowiada. Zarezerwuję.","it":"Sì, quell'orario va bene. Prenoto.","sv":"Ja, den tiden passar. Jag bokar.","fi":"Kyllä, se sopii. Varaan ajan.","ja":"はい、その時間でいいです。予約します。","zh-CN":"好的，那个时间可以。我来预约。"}},{"speaker":"민준","text":"성함과 전화번호를 알려 주세요.","trans":{"en":"Please let me know your name and phone number.","de":"Bitte nennen Sie mir Ihren Namen und Ihre Telefonnummer.","fr":"Veuillez me donner votre nom et votre numéro de téléphone.","es":"Por favor, dígame su nombre y número de teléfono.","pl":"Proszę podać imię i numer telefonu.","it":"Per favore, mi dica il suo nome e numero di telefono.","sv":"Vänligen uppge ditt namn och telefonnummer.","fi":"Kertokaa nimenne ja puhelinnumeronne.","ja":"お名前と電話番号を教えてください。","zh-CN":"请告诉我您的姓名和电话号码。"}},{"speaker":"지수","text":"이지수이고요, 전화번호는 010-1234-5678입니다.","trans":{"en":"It's Lee Jisoo, and the phone number is 010-1234-5678.","de":"Es ist Lee Jisoo und die Telefonnummer ist 010-1234-5678.","fr":"C'est Lee Jisoo, et le numéro de téléphone est le 010-1234-5678.","es":"Es Lee Jisoo y el número de teléfono es 010-1234-5678.","pl":"To Lee Jisoo i numer telefonu to 010-1234-5678.","it":"È Lee Jisoo e il numero di telefono è 010-1234-5678.","sv":"Det är Lee Jisoo och telefonnumret är 010-1234-5678.","fi":"Se on Lee Jisoo ja puhelinnumero on 010-1234-5678.","ja":"イ・ジスと申します。電話番号は010-1234-5678です。","zh-CN":"我叫李智秀，电话号码是010-1234-5678。"}},{"speaker":"민준","text":"감사합니다. 내일 오전 10시에 내과 예약 확인되었습니다. 10분 전에 오셔서 접수해 주세요.","trans":{"en":"Thank you. The internal medicine appointment for tomorrow at 10 AM is confirmed. Please come 10 minutes early to register.","de":"Danke. Der Termin für die Innere Medizin morgen um 10 Uhr ist bestätigt. Bitte kommen Sie 10 Minuten früher zur Anmeldung.","fr":"Merci. Le rendez-vous en médecine interne pour demain à 10h est confirmé. Veuillez venir 10 minutes à l'avance pour vous enregistrer.","es":"Gracias. La cita de medicina interna para mañana a las 10 AM está confirmada. Por favor, venga 10 minutos antes para registrarse.","pl":"Dziękuję. Wizyta w internie na jutro o godzinie 10 jest potwierdzona. Proszę przyjść 10 minut wcześniej na rejestrację.","it":"Grazie. L'appuntamento di medicina interna per domani alle 10 è confermato. Venga 10 minuti prima per la registrazione.","sv":"Tack. Internmedicinska tidsbokningen för imorgon kl. 10 är bekräftad. Kom 10 minuter tidigt för registrering.","fi":"Kiitos. Sisätautien aika huomenna kello 10 on vahvistettu. Tulkaa 10 minuuttia aikaisemmin ilmoittautumaan.","ja":"ありがとうございます。明日午前10時の内科予約が確認されました。10分前にお越しになって受付をしてください。","zh-CN":"谢谢。明天上午10点内科预约已确认。请提前10分钟来办理挂号手续。"}}],"vocab":[{"word":"진료","trans":{"en":"medical treatment/consultation","de":"ärztliche Behandlung","fr":"consultation médicale","es":"consulta médica","pl":"konsultacja lekarska","it":"visita medica","sv":"läkarundersökning","fi":"lääkärin vastaanotto","ja":"診療","zh-CN":"就诊"}},{"word":"증상","trans":{"en":"symptom","de":"Symptom","fr":"symptôme","es":"síntoma","pl":"objaw","it":"sintomo","sv":"symptom","fi":"oire","ja":"症状","zh-CN":"症状"}},{"word":"내과","trans":{"en":"internal medicine department","de":"Innere Medizin","fr":"médecine interne","es":"medicina interna","pl":"oddział wewnętrzny","it":"medicina interna","sv":"internmedicin","fi":"sisätaudit","ja":"内科","zh-CN":"内科"}},{"word":"열","trans":{"en":"fever","de":"Fieber","fr":"fièvre","es":"fiebre","pl":"gorączka","it":"febbre","sv":"feber","fi":"kuume","ja":"熱","zh-CN":"发烧"}},{"word":"예약하다","trans":{"en":"to book/reserve","de":"buchen/reservieren","fr":"réserver","es":"reservar","pl":"rezerwować","it":"prenotare","sv":"boka","fi":"varata","ja":"予約する","zh-CN":"预约"}},{"word":"접수하다","trans":{"en":"to register/check in","de":"sich anmelden","fr":"s'enregistrer","es":"registrarse","pl":"rejestrować się","it":"registrarsi","sv":"registrera sig","fi":"ilmoittautua","ja":"受付をする","zh-CN":"挂号/登记"}},{"word":"아프다","trans":{"en":"to be sick/hurt","de":"krank sein/wehtun","fr":"être malade/avoir mal","es":"estar enfermo/doler","pl":"być chorym/boleć","it":"essere malato/fare male","sv":"vara sjuk/göra ont","fi":"olla sairas/sattua","ja":"痛い/具合が悪い","zh-CN":"生病/疼痛"}}],"patterns":[{"pattern":"-고 싶은데요","patternTrans":{"en":"I would like to... (polite, soft request)","de":"Ich möchte... (höflich)","fr":"Je voudrais... (poli)","es":"Me gustaría... (cortés)","pl":"Chciałabym... (grzecznie)","it":"Vorrei... (educato)","sv":"Jag skulle vilja... (artigt)","fi":"Haluaisin... (kohteliaan pehmeä pyyntö)   4: {"id":4,"title":"은행 업무","titleTrans":{"en":"Banking","de":"Bankgeschäfte","fr":"Services bancaires","es":"Servicios bancarios","pl":"Usługi bankowe","it":"Servizi bancari","sv":"Banktjänster","fi":"Pankkiasiointi","ja":"銀行業務","zh-CN":"银行业务"},"desc":"통장 개설과 송금을 처리하는 대화","descTrans":{"en":"A conversation about opening a bank account and transferring money","de":"Ein Gespräch über die Kontoeröffnung und Geldüberweisung","fr":"Une conversation sur l'ouverture d'un compte bancaire et le virement d'argent","es":"Una conversación sobre cómo abrir una cuenta bancaria y transferir dinero","pl":"Rozmowa o otwarciu konta bankowego i przelewie pieniędzy","it":"Una conversazione sull'apertura di un conto bancario e il trasferimento di denaro","sv":"Ett samtal om att öppna ett bankkonto och överföra pengar","fi":"Keskustelu pankkitilin avaamisesta ja rahansiirroista","ja":"口座開設と送金を処理する会話","zh-CN":"处理开户和汇款的对话"},"dialogue":[{"speaker":"지민","text":"안녕하세요. 통장을 새로 만들고 싶은데요.","trans":{"en":"Hello. I'd like to open a new bank account.","de":"Hallo. Ich möchte ein neues Konto eröffnen.","fr":"Bonjour. Je voudrais ouvrir un nouveau compte bancaire.","es":"Hola. Me gustaría abrir una nueva cuenta bancaria.","pl":"Dzień dobry. Chciałbym otworzyć nowe konto bankowe.","it":"Salve. Vorrei aprire un nuovo conto bancario.","sv":"Hej. Jag skulle vilja öppna ett nytt bankkonto.","fi":"Hei. Haluaisin avata uuden pankkitilin.","ja":"こんにちは。通帳を新しく作りたいのですが。","zh-CN":"你好，我想开一个新的银行账户。"}},{"speaker":"수미","text":"네, 어떤 종류의 통장을 원하십니까? 입출금 통장과 저축 통장이 있습니다.","trans":{"en":"Yes, what kind of account would you like? We have a checking account and a savings account.","de":"Ja, welche Art von Konto möchten Sie? Wir haben ein Girokonto und ein Sparkonto.","fr":"Oui, quel type de compte souhaitez-vous ? Nous avons un compte courant et un compte épargne.","es":"Sí, ¿qué tipo de cuenta desea? Tenemos cuenta corriente y cuenta de ahorro.","pl":"Tak, jakiego rodzaju konto chciałby Pan? Mamy konto bieżące i konto oszczędnościowe.","it":"Sì, che tipo di conto desidera? Abbiamo un conto corrente e un conto di risparmio.","sv":"Ja, vilken typ av konto vill du ha? Vi har ett transaktionskonto och ett sparkonto.","fi":"Kyllä, minkä tyyppisen tilin haluatte? Meillä on käyttötili ja säästötili.","ja":"はい、どのような種類の通帳をご希望ですか？普通預金口座と貯蓄口座がございます。","zh-CN":"好的，您想要哪种账户？我们有活期存款账户和储蓄账户。"}},{"speaker":"지민","text":"입출금 통장으로 만들고 싶어요. 인터넷 뱅킹도 함께 신청하고 싶습니다.","trans":{"en":"I'd like a checking account. I'd also like to apply for internet banking at the same time.","de":"Ich möchte ein Girokonto. Ich möchte auch gleichzeitig Internet-Banking beantragen.","fr":"Je voudrais un compte courant. Je voudrais aussi faire une demande de banque en ligne en même temps.","es":"Me gustaría una cuenta corriente. También me gustaría solicitar banca por internet al mismo tiempo.","pl":"Chciałbym konto bieżące. Chciałbym też jednocześnie złożyć wniosek o bankowość internetową.","it":"Vorrei un conto corrente. Vorrei anche richiedere contemporaneamente la banca online.","sv":"Jag skulle vilja ha ett transaktionskonto. Jag skulle också vilja ansöka om internetbanken samtidigt.","fi":"Haluaisin käyttötilin. Haluaisin myös hakea verkkopankkipalvelua samalla.","ja":"普通預金口座を作りたいです。インターネットバンキングも一緒に申し込みたいです。","zh-CN":"我想开活期存款账户。同时也想申请网上银行。"}},{"speaker":"수미","text":"알겠습니다. 신분증을 가지고 오셨나요?","trans":{"en":"I see. Did you bring your ID?","de":"Ich verstehe. Haben Sie Ihren Ausweis mitgebracht?","fr":"Je vois. Avez-vous apporté votre pièce d'identité ?","es":"Entiendo. ¿Trajo su documento de identidad?","pl":"Rozumiem. Czy przyniósł Pan dowód tożsamości?","it":"Capisco. Ha portato il documento d'identità?","sv":"Jag förstår. Tog du med din legitimation?","fi":"Ymmärrän. Toitteko henkilöllisyystodistuksen?","ja":"わかりました。身分証明書はお持ちですか？","zh-CN":"明白了。您带身份证了吗？"}},{"speaker":"지민","text":"네, 여기 있습니다. 그리고 오늘 바로 카드도 발급받을 수 있나요?","trans":{"en":"Yes, here it is. And can I also get a card issued today?","de":"Ja, hier ist er. Und kann ich heute auch sofort eine Karte bekommen?","fr":"Oui, la voilà. Et puis-je aussi obtenir une carte émise aujourd'hui ?","es":"Sí, aquí está. ¿Y puedo también obtener una tarjeta emitida hoy?","pl":"Tak, proszę. I czy mogę też dzisiaj od razu dostać kartę?","it":"Sì, eccolo. E posso anche ottenere una carta emessa oggi?","sv":"Ja, här är den. Och kan jag också få ett kort utfärdat idag?","fi":"Kyllä, tässä se on. Ja voinko myös saada kortin myönnettynä tänään?","ja":"はい、こちらです。今日すぐにカードも発行してもらえますか？","zh-CN":"是的，在这里。今天可以马上办理卡片吗？"}},{"speaker":"수미","text":"카드는 신청 후 5-7 영업일 내에 등록하신 주소로 발송됩니다.","trans":{"en":"The card will be sent to your registered address within 5-7 business days after application.","de":"Die Karte wird innerhalb von 5-7 Werktagen nach der Beantragung an Ihre hinterlegte Adresse versandt.","fr":"La carte sera envoyée à votre adresse enregistrée dans les 5 à 7 jours ouvrables suivant la demande.","es":"La tarjeta se enviará a su dirección registrada dentro de 5 a 7 días hábiles después de la solicitud.","pl":"Karta zostanie wysłana na zarejestrowany adres w ciągu 5-7 dni roboczych po złożeniu wniosku.","it":"La carta verrà inviata all'indirizzo registrato entro 5-7 giorni lavorativi dopo la richiesta.","sv":"Kortet skickas till din registrerade adress inom 5-7 arbetsdagar efter ansökan.","fi":"Kortti lähetetään rekisteröityyn osoitteeseenne 5-7 arkipäivän kuluessa hakemuksesta.","ja":"カードは申請後5〜7営業日以内に登録住所へ発送されます。","zh-CN":"卡片申请后将在5-7个工作日内寄送至您注册的地址。"}},{"speaker":"지민","text":"알겠습니다. 그리고 오늘 해외 송금도 하고 싶은데요, 수수료가 얼마예요?","trans":{"en":"I see. And I'd also like to make an international transfer today. How much is the fee?","de":"Ich verstehe. Und ich möchte heute auch eine Auslandsüberweisung machen. Wie hoch ist die Gebühr?","fr":"Je vois. Et je voudrais aussi effectuer un virement international aujourd'hui. Quels sont les frais ?","es":"Entiendo. Y también me gustaría hacer una transferencia internacional hoy. ¿Cuánto es la tarifa?","pl":"Rozumiem. I chciałbym też dziś zrobić przelew zagraniczny. Ile wynosi opłata?","it":"Capisco. E oggi vorrei anche fare un bonifico internazionale. Quanto è la commissione?","sv":"Jag förstår. Och jag skulle också vilja göra en internationell överföring idag. Hur mycket är avgiften?","fi":"Ymmärrän. Ja haluaisin myös tehdä kansainvälisen siirron tänään. Paljonko on maksu?","ja":"わかりました。今日、海外送金もしたいのですが、手数料はいくらですか？","zh-CN":"明白了。我今天还想汇款到海外，手续费是多少？"}},{"speaker":"수미","text":"송금 금액과 나라에 따라 다릅니다. 일반적으로 5,000원에서 15,000원 사이입니다.","trans":{"en":"It varies depending on the transfer amount and country. Generally, it's between 5,000 and 15,000 won.","de":"Das variiert je nach Überweisungsbetrag und Land. Im Allgemeinen liegt es zwischen 5.000 und 15.000 Won.","fr":"Ça varie selon le montant du virement et le pays. En général, c'est entre 5 000 et 15 000 wons.","es":"Varía según el monto de la transferencia y el país. En general, está entre 5.000 y 15.000 won.","pl":"Zależy to od kwoty przelewu i kraju. Ogólnie wynosi od 5000 do 15000 wonów.","it":"Varia a seconda dell'importo del trasferimento e del paese. In genere è tra i 5.000 e i 15.000 won.","sv":"Det varierar beroende på överföringsbelopp och land. Generellt är det mellan 5 000 och 15 000 won.","fi":"Se vaihtelee siirrettävän summan ja maan mukaan. Yleensä se on 5 000–15 000 wonia.","ja":"送金額と国によって異なります。一般的に5,000ウォンから15,000ウォンの間です。","zh-CN":"根据汇款金额和目的地国家不同而异。一般在5000韩元到15000韩元之间。"}},{"speaker":"지민","text":"감사합니다. 그럼 통장 개설 먼저 하고 나서 송금도 처리해 주세요.","trans":{"en":"Thank you. Then please process the account opening first and then the transfer.","de":"Danke. Bitte erledigen Sie zuerst die Kontoeröffnung und dann die Überweisung.","fr":"Merci. Alors veuillez d'abord traiter l'ouverture du compte, puis le virement.","es":"Gracias. Entonces, por favor procese primero la apertura de la cuenta y luego la transferencia.","pl":"Dziękuję. To proszę najpierw przetworzyć otwarcie konta, a potem przelew.","it":"Grazie. Allora la prego di elaborare prima l'apertura del conto e poi il bonifico.","sv":"Tack. Vänligen behandla kontoöppningen först och sedan överföringen.","fi":"Kiitos. Käsitelkää sitten ensin tilin avaaminen ja sitten siirto.","ja":"ありがとうございます。それでは、口座開設を先にしてから送金も処理してください。","zh-CN":"谢谢。那请先办理开户，再处理汇款。"}}],"vocab":[{"word":"통장","trans":{"en":"bank account/passbook","de":"Sparbuch/Konto","fr":"livret bancaire/compte","es":"libreta bancaria/cuenta","pl":"książeczka bankowa/konto","it":"libretto bancario/conto","sv":"bankbok/konto","fi":"pankkikirja/tili","ja":"通帳","zh-CN":"存折/账户"}},{"word":"개설","trans":{"en":"opening (of account)","de":"Eröffnung","fr":"ouverture","es":"apertura","pl":"otwarcie","it":"apertura","sv":"öppning","fi":"avaaminen","ja":"開設","zh-CN":"开户"}},{"word":"송금","trans":{"en":"money transfer","de":"Geldüberweisung","fr":"virement","es":"transferencia","pl":"przelew","it":"bonifico","sv":"pengaöverföring","fi":"rahansiirto","ja":"送金","zh-CN":"汇款"}},{"word":"수수료","trans":{"en":"fee/commission","de":"Gebühr","fr":"frais","es":"comisión","pl":"opłata","it":"commissione","sv":"avgift","fi":"maksu","ja":"手数料","zh-CN":"手续费"}},{"word":"신분증","trans":{"en":"ID card","de":"Ausweis","fr":"pièce d'identité","es":"documento de identidad","pl":"dowód tożsamości","it":"documento d'identità","sv":"legitimation","fi":"henkilötodistus","ja":"身分証明書","zh-CN":"身份证"}},{"word":"발급","trans":{"en":"issuance","de":"Ausstellung","fr":"émission","es":"emisión","pl":"wydanie","it":"emissione","sv":"utfärdande","fi":"myöntäminen","ja":"発給","zh-CN":"发放/签发"}},{"word":"영업일","trans":{"en":"business day","de":"Werktag","fr":"jour ouvrable","es":"día hábil","pl":"dzień roboczy","it":"giorno lavorativo","sv":"arbetsdag","fi":"arkipäivä","ja":"営業日","zh-CN":"工作日"}}],"patterns":[{"pattern":"-을/를 원하십니까?","patternTrans":{"en":"What would you like? / Which do you want? (polite)","de":"Was möchten Sie? (höflich)","fr":"Que souhaitez-vous ? (poli)","es":"¿Qué desea? (cortés)","pl":"Czego Pan/Pani chce? (grzecznie)","it":"Cosa desidera? (educato)","sv":"Vad vill du ha? (artigt)","fi":"Mitä haluatte? (kohteliaan)","ja":"〜をご希望ですか？（丁寧語）","zh-CN":"您想要...吗？（敬语）"},"example":"어떤 종류의 통장을 원하십니까?","trans":{"en":"What kind of account would you like?","de":"Welche Art von Konto möchten Sie?","fr":"Quel type de compte souhaitez-vous ?","es":"¿Qué tipo de cuenta desea?","pl":"Jakiego rodzaju konta Pan/Pani chce?","it":"Che tipo di conto desidera?","sv":"Vilken typ av konto vill du ha?","fi":"Minkä tyyppisen tilin haluatte?","ja":"どのような種類の通帳をご希望ですか？","zh-CN":"您想要哪种账户？"}},{"pattern":"-에 따라 다르다","patternTrans":{"en":"to vary depending on","de":"variieren je nach","fr":"varier selon","es":"variar según","pl":"różnić się w zależności od","it":"variare a seconda di","sv":"variera beroende på","fi":"vaihdella riippuen","ja":"〜によって異なる","zh-CN":"根据...而有所不同"},"example":"송금 금액과 나라에 따라 다릅니다.","trans":{"en":"It varies depending on the transfer amount and country.","de":"Es variiert je nach Überweisungsbetrag und Land.","fr":"Ça varie selon le montant du virement et le pays.","es":"Varía según el monto de la transferencia y el país.","pl":"Różni się w zależności od kwoty przelewu i kraju.","it":"Varia a seconda dell'importo del trasferimento e del paese.","sv":"Det varierar beroende på överföringsbelopp och land.","fi":"Se vaihtelee siirrettävän summan ja maan mukaan.","ja":"送金額と国によって異なります。","zh-CN":"根据汇款金额和目的地国家而有所不同。"}},{"pattern":"-고 나서","patternTrans":{"en":"after doing (first)","de":"nachdem man (zuerst) gemacht hat","fr":"après avoir fait","es":"después de haber hecho","pl":"po zrobieniu czegoś","it":"dopo aver fatto","sv":"efter att ha gjort","fi":"tehtyään ensin","ja":"〜してから","zh-CN":"...之后（先做某事）"},"example":"통장 개설하고 나서 송금도 처리해 주세요.","trans":{"en":"After opening the account, please also process the transfer.","de":"Nachdem Sie das Konto eröffnet haben, verarbeiten Sie bitte auch die Überweisung.","fr":"Après avoir ouvert le compte, veuillez également traiter le virement.","es":"Después de abrir la cuenta, por favor también pr
