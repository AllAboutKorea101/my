?","questionTrans":{"en":"When can you receive the card?","de":"Wann kann man die Karte erhalten?","fr":"Quand peut-on recevoir la carte ?","es":"¿Cuándo puede recibir la tarjeta?","pl":"Kiedy można otrzymać kartę?","it":"Quando si può ricevere la carta?","sv":"När kan man få kortet?","fi":"Milloin voit saada kortin?","ja":"カードはいつもらえますか？","zh-CN":"什么时候可以收到卡片？"},"options":[{"text":"당일 바로","trans":{"en":"Same day immediately","de":"Am selben Tag sofort","fr":"Le jour même immédiatement","es":"El mismo día inmediatamente","pl":"Tego samego dnia od razu","it":"Lo stesso giorno immediatamente","sv":"Samma dag direkt","fi":"Samana päivänä heti","ja":"当日すぐに","zh-CN":"当天即可"}},{"text":"1-2 영업일 후","trans":{"en":"1-2 business days later","de":"1-2 Werktage später","fr":"1 à 2 jours ouvrables plus tard","es":"1-2 días hábiles después","pl":"1-2 dni robocze później","it":"1-2 giorni lavorativi dopo","sv":"1-2 arbetsdagar senare","fi":"1-2 arkipäivää myöhemmin","ja":"1〜2営業日後","zh-CN":"1-2个工作日后"}},{"text":"5-7 영업일 후","trans":{"en":"5-7 business days later","de":"5-7 Werktage später","fr":"5 à 7 jours ouvrables plus tard","es":"5-7 días hábiles después","pl":"5-7 dni roboczych później","it":"5-7 giorni lavorativi dopo","sv":"5-7 arbetsdagar senare","fi":"5-7 arkipäivää myöhemmin","ja":"5〜7営業日後","zh-CN":"5-7个工作日后"}},{"text":"2주 후","trans":{"en":"2 weeks later","de":"2 Wochen später","fr":"2 semaines plus tard","es":"2 semanas después","pl":"2 tygodnie później","it":"2 settimane dopo","sv":"2 veckor senare","fi":"2 viikon kuluttua","ja":"2週間後","zh-CN":"2周后"}}],"answer":2,"explanation":"직원이 카드는 신청 후 5-7 영업일 내에 주소로 발송된다고 했습니다."},{"type":"이해","questionAudio":"해외 송금 수수료는 얼마라고 했습니까?","questionTrans":{"en":"How much did they say the international transfer fee is?","de":"Wie hoch sagten sie, ist die Auslandsüberweisungsgebühr?","fr":"Combien ont-ils dit que les frais de virement international sont ?","es":"¿Cuánto dijeron que era la tarifa de transferencia internacional?","pl":"Ile powiedzieli, że wynosi opłata za przelew zagraniczny?","it":"Quanto hanno detto che è la commissione per il bonifico internazionale?","sv":"Hur mycket sa de att avgiften för internationell överföring är?","fi":"Kuinka paljon he sanoivat kansainvälisen siirron maksun olevan?","ja":"海外送金手数料はいくらと言いましたか？","zh-CN":"他们说海外汇款手续费是多少？"},"options":[{"text":"1,000원에서 5,000원","trans":{"en":"1,000 to 5,000 won","de":"1.000 bis 5.000 Won","fr":"1 000 à 5 000 wons","es":"1.000 a 5.000 won","pl":"1000 do 5000 wonów","it":"Da 1.000 a 5.000 won","sv":"1 000 till 5 000 won","fi":"1 000–5 000 wonia","ja":"1,000〜5,000ウォン","zh-CN":"1000到5000韩元"}},{"text":"5,000원에서 15,000원","trans":{"en":"5,000 to 15,000 won","de":"5.000 bis 15.000 Won","fr":"5 000 à 15 000 wons","es":"5.000 a 15.000 won","pl":"5000 do 15000 wonów","it":"Da 5.000 a 15.000 won","sv":"5 000 till 15 000 won","fi":"5 000–15 000 wonia","ja":"5,000〜15,000ウォン","zh-CN":"5000到15000韩元"}},{"text":"10,000원에서 20,000원","trans":{"en":"10,000 to 20,000 won","de":"10.000 bis 20.000 Won","fr":"10 000 à 20 000 wons","es":"10.000 a 20.000 won","pl":"10000 do 20000 wonów","it":"Da 10.000 a 20.000 won","sv":"10 000 till 20 000 won","fi":"10 000–20 000 wonia","ja":"10,000〜20,000ウォン","zh-CN":"10000到20000韩元"}},{"text":"항상 무료","trans":{"en":"Always free","de":"Immer kostenlos","fr":"Toujours gratuit","es":"Siempre gratis","pl":"Zawsze bezpłatnie","it":"Sempre gratis","sv":"Alltid gratis","fi":"Aina ilmainen","ja":"常に無料","zh-CN":"始终免费"}}],"answer":1,"explanation":"직원 수미는 해외 송금 수수료가 일반적으로 5,000원에서 15,000원 사이라고 했습니다."}]},
  5: {"id":5,"title":"집 구하기","titleTrans":{"en":"Finding a Home","de":"Eine Wohnung suchen","fr":"Chercher un logement","es":"Buscar vivienda","pl":"Szukanie mieszkania","it":"Cercare casa","sv":"Hitta bostad","fi":"Asunnon etsiminen","ja":"住まい探し","zh-CN":"找房子"},"desc":"부동산에서 방을 구하는 대화","descTrans":{"en":"A conversation about finding a room at a real estate agency","de":"Ein Gespräch über die Wohnungssuche bei einem Immobilienmakler","fr":"Une conversation pour trouver un logement dans une agence immobilière","es":"Una conversación sobre buscar habitación en una agencia inmobiliaria","pl":"Rozmowa o szukaniu pokoju w agencji nieruchomości","it":"Una conversazione per trovare un alloggio in un'agenzia immobiliare","sv":"Ett samtal om att hitta ett rum hos en fastighetsbyråa","fi":"Keskustelu huoneen etsimisestä kiinteistönvälittäjällä","ja":"不動産屋で部屋を探す会話","zh-CN":"在房产中介找房子的对话"},"dialogue":[{"speaker":"지수","text":"안녕하세요. 전세나 월세로 방을 구하고 있어요.","trans":{"en":"Hello. I'm looking for a room for jeonse or monthly rent.","de":"Hallo. Ich suche ein Zimmer zur Miete oder mit Kaution.","fr":"Bonjour. Je cherche un appartement en jeonse ou en loyer mensuel.","es":"Hola. Estoy buscando una habitación en jeonse o alquiler mensual.","pl":"Dzień dobry. Szukam pokoju w systemie jeonse lub miesięcznym.","it":"Salve. Sto cercando una stanza in affitto mensile o con deposito cauzionale.","sv":"Hej. Jag letar efter ett rum med jeonse eller månadsvis hyra.","fi":"Hei. Etsin huonetta jeonse- tai kuukausivuokrajärjestelmällä.","ja":"こんにちは。チョンセか月払いで部屋を探しています。","zh-CN":"你好，我在找全税或月租的房子。"}},{"speaker":"민준","text":"네, 어느 지역을 원하십니까? 그리고 예산은 얼마나 생각하고 계신가요?","trans":{"en":"Yes, which area are you looking for? And what is your budget?","de":"Ja, welche Gegend suchen Sie? Und was ist Ihr Budget?","fr":"Oui, quelle zone cherchez-vous ? Et quel est votre budget ?","es":"Sí, ¿qué zona busca? ¿Y cuál es su presupuesto?","pl":"Tak, jakiej okolicy szuka Pani? I jaki jest Pani budżet?","it":"Sì, quale zona sta cercando? E qual è il suo budget?","sv":"Ja, vilket område letar du efter? Och vad är din budget?","fi":"Kyllä, mitä aluetta etsitte? Ja mikä on budjettinne?","ja":"はい、どの地域をご希望ですか？また、予算はどのくらいお考えですか？","zh-CN":"好的，您想找哪个地区？预算大概是多少？"}},{"speaker":"지수","text":"홍대나 합정 근처가 좋겠어요. 월세로는 60만 원에서 80만 원 정도 생각하고 있어요.","trans":{"en":"Near Hongdae or Hapjeong would be nice. For monthly rent, I'm thinking around 600,000 to 800,000 won.","de":"In der Nähe von Hongdae oder Hapjeong wäre schön. Für monatliche Miete denke ich an etwa 600.000 bis 800.000 Won.","fr":"Près de Hongdae ou Hapjeong serait bien. Pour le loyer mensuel, je pense à environ 600 000 à 800 000 wons.","es":"Cerca de Hongdae o Hapjeong estaría bien. Para alquiler mensual, estoy pensando en alrededor de 600.000 a 800.000 won.","pl":"Blisko Hongdae lub Hapjeong byłoby dobrze. Na miesięczny czynsz myślę o około 600 000 do 800 000 wonów.","it":"Vicino a Hongdae o Hapjeong sarebbe bello. Per l'affitto mensile penso a circa 600.000-800.000 won.","sv":"Nära Hongdae eller Hapjeong vore bra. För månadshyra tänker jag på ungefär 600 000 till 800 000 won.","fi":"Lähellä Hongdaeta tai Hapjeonggia olisi hyvä. Kuukausivuokraksi ajattelin noin 600 000–800 000 wonia.","ja":"弘大か合井の近くがいいです。月払いは60〜80万ウォンくらいを考えています。","zh-CN":"弘大或合井附近比较好。月租我考虑在60万到80万韩元左右。"}},{"speaker":"민준","text":"원하시는 방 크기는 어느 정도 되나요? 원룸인가요, 아니면 좀 더 큰 방을 원하시나요?","trans":{"en":"What size room do you want? Is it a studio, or do you want a bigger room?","de":"Welche Raumgröße möchten Sie? Ein Studio oder ein größeres Zimmer?","fr":"Quelle taille de chambre voulez-vous ? Un studio ou une chambre plus grande ?","es":"¿Qué tamaño de habitación quiere? ¿Un estudio o una habitación más grande?","pl":"Jakiego rozmiaru pokój Pani chce? Studio czy większy pokój?","it":"Che dimensione vuole la stanza? Un monolocale o una stanza più grande?","sv":"Vilken storlek på rum vill du ha? Ett studio eller ett större rum?","fi":"Minkä kokoisen huoneen haluatte? Studio vai isompi huone?","ja":"ご希望の部屋のサイズはどのくらいですか？ワンルームですか、それとも大きめの部屋をご希望ですか？","zh-CN":"您想要多大的房间？是单间，还是想要大一点的？"}},{"speaker":"지수","text":"원룸도 괜찮은데 가능하면 작은 원베드룸도 보고 싶어요.","trans":{"en":"A studio is fine, but I'd also like to see a small one-bedroom if possible.","de":"Ein Studio ist in Ordnung, aber ich würde auch gerne ein kleines Einzimmerapartment sehen, wenn möglich.","fr":"Un studio c'est bien, mais j'aimerais aussi voir un petit appartement avec une chambre si possible.","es":"Un estudio está bien, pero también me gustaría ver un pequeño piso con un dormitorio si es posible.","pl":"Studio jest w porządku, ale chciałabym też zobaczyć małe mieszkanie z jedną sypialnią, jeśli to możliwe.","it":"Un monolocale va bene, ma se possibile vorrei vedere anche un piccolo appartamento con una camera.","sv":"En studio är okej, men jag skulle gärna se en liten ettrumslägenhet om möjligt.","fi":"Studio on OK, mutta haluaisin myös nähdä pienen yksiön jos mahdollista.","ja":"ワンルームでもいいですが、できれば小さな1ベッドルームも見たいです。","zh-CN":"单间也可以，如果可以的话也想看看小的一居室。"}},{"speaker":"민준","text":"네, 그러면 제가 몇 가지 매물을 소개해 드릴게요. 먼저 합정역 근처 원룸인데요, 보증금 500만 원에 월세 65만 원입니다.","trans":{"en":"Yes, then I'll introduce you to a few properties. First, a studio near Hapjeong station, with a deposit of 5 million won and monthly rent of 650,000 won.","de":"Ja, dann werde ich Ihnen einige Immobilien vorstellen. Zunächst ein Studio in der Nähe der Hapjeong-Station mit einer Kaution von 5 Millionen Won und monatlicher Miete von 650.000 Won.","fr":"Oui, alors je vais vous présenter quelques biens. D'abord, un studio près de la station Hapjeong, avec un dépôt de 5 millions de wons et un loyer mensuel de 650 000 wons.","es":"Sí, entonces le presentaré algunas propiedades. Primero, un estudio cerca de la estación Hapjeong, con un depósito de 5 millones de won y alquiler mensual de 650.000 won.","pl":"Tak, to przedstawię Pani kilka nieruchomości. Najpierw studio w pobliżu stacji Hapjeong, kaucja 5 milionów wonów, miesięczny czynsz 650 000 wonów.","it":"Sì, allora le presenterò alcune proprietà. Prima di tutto, un monolocale vicino alla stazione Hapjeong, con deposito di 5 milioni di won e affitto mensile di 650.000 won.","sv":"Ja, då ska jag presentera några fastigheter för dig. Först ett studio nära Hapjeong-stationen med en deposition på 5 miljoner won och månadshyra på 650 000 won.","fi":"Kyllä, esittelen teille sitten muutaman kohteen. Ensinnäkin studio lähellä Hapjeongin asemaa, takuuvuokra 5 miljoonaa wonia ja kuukausivuokra 650 000 wonia.","ja":"はい、それではいくつか物件をご紹介しましょう。まず合井駅近くのワンルームです。保証金500万ウォンで月払い65万ウォンです。","zh-CN":"好的，那我来介绍几套房源。首先是合井站附近的单间，押金500万韩元，月租65万韩元。"}},{"speaker":"지수","text":"그 방 좀 더 자세히 알려 주세요. 교통은 어때요?","trans":{"en":"Please tell me more about that room. How is the transportation?","de":"Bitte sagen Sie mir mehr über dieses Zimmer. Wie ist die Verkehrsanbindung?","fr":"Veuillez me donner plus de détails sur cette chambre. Comment sont les transports ?","es":"Por favor dígame más sobre esa habitación. ¿Cómo es el transporte?","pl":"Proszę powiedzieć mi więcej o tym pokoju. Jak jest komunikacja?","it":"Per favore mi dica di più su quella stanza. Come sono i trasporti?","sv":"Berätta mer om det rummet. Hur är kommunikationerna?","fi":"Kertokaa lisää siitä huoneesta. Miten liikenneyhteydet ovat?","ja":"その部屋についてもっと詳しく教えてください。交通の便はどうですか？","zh-CN":"请告诉我更多关于那套房子的情况。交通怎么样？"}},{"speaker":"민준","text":"합정역에서 걸어서 5분 거리입니다. 지하철 2호선과 6호선이 다 있어서 교통이 매우 편리합니다.","trans":{"en":"It's a 5-minute walk from Hapjeong station. Both subway line 2 and 6 are available, so transportation is very convenient.","de":"Es ist 5 Minuten zu Fuß von der Hapjeong-Station entfernt. Sowohl die U-Bahn-Linie 2 als auch Linie 6 sind verfügbar, daher ist die Verkehrsanbindung sehr bequem.","fr":"C'est à 5 minutes à pied de la station Hapjeong. Les lignes de métro 2 et 6 sont disponibles, donc les transports sont très pratiques.","es":"Está a 5 minutos a pie de la estación Hapjeong. Tanto la línea de metro 2 como la 6 están disponibles, por lo que el transporte es muy conveniente.","pl":"To 5 minut pieszo od stacji Hapjeong. Dostępne są zarówno linia 2, jak i linia 6, więc komunikacja jest bardzo wygodna.","it":"È a 5 minuti a piedi dalla stazione Hapjeong. Le linee della metropolitana 2 e 6 sono entrambe disponibili, quindi i trasporti sono molto convenienti.","sv":"Det är 5 minuters promenad från Hapjeong-stationen. Både tunnelbanelinje 2 och 6 finns tillgängliga, så kommunikationerna är väldigt bekväma.","fi":"Se on 5 minuutin kävelymatkan päässä Hapjeongin asemalta. Sekä metrolinja 2 että 6 ovat käytettävissä, joten liikenneyhteydet ovat erittäin hyvät.","ja":"合井駅から歩いて5分の距離です。地下鉄2号線と6号線の両方があるので交通がとても便利です。","zh-CN":"距离合井站步行5分钟。有地铁2号线和6号线，交通非常方便。"}},{"speaker":"지수","text":"좋네요. 직접 방을 보러 갈 수 있을까요? 이번 주말에 시간이 있어요.","trans":{"en":"Sounds great. Can I go see the room in person? I'm free this weekend.","de":"Klingt gut. Kann ich das Zimmer persönlich besichtigen? Ich habe dieses Wochenende Zeit.","fr":"C'est bien. Puis-je aller voir la chambre en personne ? J'ai le temps ce week-end.","es":"Suena bien. ¿Puedo ir a ver la habitación en persona? Tengo tiempo este fin de semana.","pl":"Brzmi dobrze. Czy mogę osobiście obejrzeć pokój? Mam czas w ten weekend.","it":"Sembra ottimo. Posso andare a vedere la stanza di persona? Ho tempo questo fine settimana.","sv":"Låter bra. Kan jag gå och se rummet personligen? Jag har tid i helgen.","fi":"Kuulostaa hyvältä. Voinko mennä katsomaan huonetta henkilökohtaisesti? Minulla on aikaa tänä viikonloppuna.","ja":"いいですね。直接部屋を見に行けますか？今週末に時間があります。","zh-CN":"不错。可以亲自去看房吗？我这个周末有时间。"}},{"speaker":"민준","text":"물론이죠. 토요일 오후에 오시면 제가 직접 안내해 드리겠습니다.","trans":{"en":"Of course. If you come on Saturday afternoon, I will personally guide you.","de":"Natürlich. Wenn Sie am Samstagnahmittag kommen, werde ich Sie persönlich begleiten.","fr":"Bien sûr. Si vous venez samedi après-midi, je vous guiderai personnellement.","es":"Por supuesto. Si viene el sábado por la tarde, yo mismo le haré la visita.","pl":"Oczywiście. Jeśli przyjdzie Pani w sobotnie popołudnie, osobiście Panią oprowadzę.","it":"Certo. Se viene sabato pomeriggio, la guiderò personalmente.","sv":"Naturligtvis. Om du kommer på lördagseftermiddagen ska jag personligen guida dig.","fi":"Tietysti. Jos tulette lauantai-iltapäivänä, opasteen teidät henkilökohtaisesti.","ja":"もちろんです。土曜日の午後においでになれば、私が直接ご案内いたします。","zh-CN":"当然可以。如果您周六下午来，我来亲自带您参观。"}}],"vocab":[{"word":"전세","trans":{"en":"jeonse (lump-sum deposit rental)","de":"Jeonse (Pauschalmiete)","fr":"jeonse (location à dépôt forfaitaire)","es":"jeonse (alquiler con depósito global)","pl":"jeonse (wynajem z kaucją ryczałtową)","it":"jeonse (affitto con deposito forfettario)","sv":"jeonse (klumpsummainlåning)","fi":"jeonse (kertasuoritteinen vuokrakaupoitus)","ja":"チョンセ（一括保証金賃貸）","zh-CN":"全税（一次性押金租赁）"}},{"word":"월세","trans":{"en":"monthly rent","de":"monatliche Miete","fr":"loyer mensuel","es":"alquiler mensual","pl":"miesięczny czynsz","it":"affitto mensile","sv":"månadshyra","fi":"kuukausivuokra","ja":"月払い家賃","zh-CN":"月租"}},{"word":"보증금","trans":{"en":"deposit/security deposit","de":"Kaution","fr":"dépôt de garantie","es":"depósito de seguridad","pl":"kaucja","it":"deposito cauzionale","sv":"deposition","fi":"takuuvuokra","ja":"保証金","zh-CN":"押金"}},{"word":"매물","trans":{"en":"property for sale/rent","de":"Immobilienangebot","fr":"bien immobilier","es":"propiedad disponible","pl":"nieruchomość na sprzedaż","it":"proprietà in vendita","sv":"fastighetsannons","fi":"myytävä/vuokrattava kohde","ja":"物件","zh-CN":"房源"}},{"word":"원룸","trans":{"en":"studio apartment","de":"Einzimmerwohnung","fr":"studio","es":"estudio","pl":"kawalerka","it":"monolocale","sv":"ettrumslägenhet","fi":"yksiö","ja":"ワンルーム","zh-CN":"单间"}},{"word":"교통","trans":{"en":"transportation","de":"Verkehr","fr":"transports","es":"transporte","pl":"komunikacja","it":"trasporti","sv":"kommunikationer","fi":"liikenneyhteydet","ja":"交通","zh-CN":"交通"}},{"word":"안내하다","trans":{"en":"to guide/show around","de":"führen","fr":"guider","es":"guiar","pl":"prowadzić","it":"guidare","sv":"guida","fi":"opastaa","ja":"案内する","zh-CN":"引导/带领参观"}}],"patterns":[{"pattern":"-을/를 구하고 있다","patternTrans":{"en":"to be looking for / to be searching for","de":"suchen nach","fr":"chercher","es":"estar buscando","pl":"szukać","it":"stare cercando","sv":"letar efter","fi":"etsiä","ja":"〜を探している","zh-CN":"正在找..."},"example":"전세나 월세로 방을 구하고 있어요.","trans":{"en":"I'm looking for a room for jeonse or monthly rent.","de":"Ich suche ein Zimmer zur Pauschalmiete oder monatlichen Miete.","fr":"Je cherche une chambre en jeonse ou en loyer mensuel.","es":"Estoy buscando una habitación en jeonse o alquiler mensual.","pl":"Szukam pokoju w systemie jeonse lub miesięcznym.","it":"Sto cercando una stanza in jeonse o affitto mensile.","sv":"Jag letar efter ett rum med jeonse eller månadshyra.","fi":"Etsin huonetta jeonse- tai kuukausivuokrajärjestelmällä.","ja":"チョンセか月払いで部屋を探しています。","zh-CN":"我在找全税或月租的房子。"}},{"pattern":"-가능하면 -도","patternTrans":{"en":"if possible, also...","de":"wenn möglich, auch...","fr":"si possible, aussi...","es":"si es posible, también...","pl":"jeśli możliwe, też...","it":"se possibile, anche...","sv":"om möjligt, också...","fi":"jos mahdollista, myös...","ja":"できれば〜も","zh-CN":"如果可以的话，也..."},"example":"가능하면 작은 원베드룸도 보고 싶어요.","trans":{"en":"If possible, I'd also like to see a small one-bedroom.","de":"Wenn möglich, würde ich auch ein kleines Einzimmerapartment sehen wollen.","fr":"Si possible, j'aimerais aussi voir un petit appartement avec une chambre.","es":"Si es posible, también me gustaría ver un pequeño piso con un dormitorio.","pl":"Jeśli możliwe, chciałabym też zobaczyć małe mieszkanie z jedną sypialnią.","it":"Se possibile, vorrei anche vedere un piccolo appartamento con una camera.","sv":"Om möjligt skulle jag också vilja se en liten ettrumslägenhet.","fi":"Jos mahdollista, haluaisin myös nähdä pienen yksiön.","ja":"できれば小さな1ベッドルームも見たいです。","zh-CN":"如果可以的话，也想看看小的一居室。"}},{"pattern":"-아/어서 -이/가 -하다","patternTrans":{"en":"Because of..., ... is... (cause-result)","de":"Wegen... ist... (Ursache-Wirkung)","fr":"Parce que... c'est... (cause-résultat)","es":"Debido a... ... es... (causa-resultado)","pl":"Przez... ... jest... (przyczyna-skutek)","it":"A causa di... ... è... (causa-risultato)","sv":"På grund av... ... är... (orsak-effekt)","fi":"Koska... ... on... (syy-seuraus)","ja":"〜なので、〜が〜だ（原因・結果）","zh-CN":"因为...所以...（原因-结果）"},"example":"지하철 2호선과 6호선이 다 있어서 교통이 매우 편리합니다.","trans":{"en":"Because both subway line 2 and 6 are available, transportation is very convenient.","de":"Da sowohl die U-Bahn-Linie 2 als auch Linie 6 verfügbar sind, ist die Verkehrsanbindung sehr bequem.","fr":"Comme les lignes de métro 2 et 6 sont toutes deux disponibles, les transports sont très pratiques.","es":"Dado que las líneas de metro 2 y 6 están disponibles, el transporte es muy conveniente.","pl":"Ponieważ dostępne są zarówno linia metra 2, jak i linia 6, komunikacja jest bardzo wygodna.","it":"Poiché le linee della metropolitana 2 e 6 sono entrambe disponibili, i trasporti sono molto convenienti.","sv":"Eftersom både tunnelbanelinje 2 och 6 finns tillgängliga är kommunikationerna väldigt bekväma.","fi":"Koska sekä metrolinja 2 että 6 ovat käytettävissä, liikenneyhteydet ovat erittäin hyvät.","ja":"地下鉄2号線と6号線の両方があるので、交通がとても便利です。","zh-CN":"因为有地铁2号线和6号线，所以交通非常方便。"}}],"quizzes":[{"type":"이해","questionAudio":"지수가 원하는 지역은 어디입니까?","questionTrans":{"en":"What area does Jisoo want?","de":"Welche Gegend möchte Jisoo?","fr":"Quelle zone Jisoo veut-elle ?","es":"¿Qué zona quiere Jisoo?","pl":"Jakiej okolicy chce Jisoo?","it":"Quale zona vuole Jisoo?","sv":"Vilket område vill Jisoo ha?","fi":"Mitä aluetta Jisoo haluaa?","ja":"ジスが希望する地域はどこですか？","zh-CN":"智秀想要哪个地区？"},"options":[{"text":"강남역 근처","trans":{"en":"Near Gangnam station","de":"In der Nähe der Gangnam-Station","fr":"Près de la station Gangnam","es":"Cerca de la estación Gangnam","pl":"Blisko stacji Gangnam","it":"Vicino alla stazione Gangnam","sv":"Nära Gangnam-stationen","fi":"Lähellä Gangnam-asemaa","ja":"江南駅近く","zh-CN":"江南站附近"}},{"text":"홍대나 합정 근처","trans":{"en":"Near Hongdae or Hapjeong","de":"In der Nähe von Hongdae oder Hapjeong","fr":"Près de Hongdae ou Hapjeong","es":"Cerca de Hongdae o Hapjeong","pl":"Blisko Hongdae lub Hapjeong","it":"Vicino a Hongdae o Hapjeong","sv":"Nära Hongdae eller Hapjeong","fi":"Lähellä Hongdaeta tai Hapjeonggia","ja":"弘大か合井の近く","zh-CN":"弘大或合井附近"}},{"text":"이태원 근처","trans":{"en":"Near Itaewon","de":"In der Nähe von Itaewon","fr":"Près d'Itaewon","es":"Cerca de Itaewon","pl":"Blisko Itaewon","it":"Vicino a Itaewon","sv":"Nära Itaewon","fi":"Lähellä Itaewonia","ja":"梨泰院近く","zh-CN":"梨泰院附近"}},{"text":"신촌 근처","trans":{"en":"Near Sinchon","de":"In der Nähe von Sinchon","fr":"Près de Sinchon","es":"Cerca de Sinchon","pl":"Blisko Sinchon","it":"Vicino a Sinchon","sv":"Nära Sinchon","fi":"Lähellä Sinchoonia","ja":"新村近く","zh-CN":"新村附近"}}],"answer":1,"explanation":"지수는 홍대나 합정 근처를 원한다고 했습니다."},{"type":"이해","questionAudio":"소개된 원룸의 월세는 얼마입니까?","questionTrans":{"en":"How much is the monthly rent for the introduced studio?","de":"Wie hoch ist die monatliche Miete für das vorgestellte Studio?","fr":"Quel est le loyer mensuel du studio présenté ?","es":"¿Cuánto es el alquiler mensual del estudio presentado?","pl":"Ile wynosi miesięczny czynsz za przedstawione studio?","it":"Quanto è l'affitto mensile per il monolocale presentato?","sv":"Hur mycket är månadshyran för det presenterade studiot?","fi":"Kuinka paljon on esitellyn studion kuukausivuokra?","ja":"紹介されたワンルームの月払いはいくらですか？","zh-CN":"介绍的单间月租是多少？"},"options":[{"text":"50만 원","trans":{"en":"500,000 won","de":"500.000 Won","fr":"500 000 wons","es":"500.000 won","pl":"500 000 wonów","it":"500.000 won","sv":"500 000 won","fi":"500 000 wonia","ja":"50万ウォン","zh-CN":"50万韩元"}},{"text":"60만 원","trans":{"en":"600,000 won","de":"600.000 Won","fr":"600 000 wons","es":"600.000 won","pl":"600 000 wonów","it":"600.000 won","sv":"600 000 won","fi":"600 000 wonia","ja":"60万ウォン","zh-CN":"60万韩元"}},{"text":"65만 원","trans":{"en":"650,000 won","de":"650.000 Won","fr":"650 000 wons","es":"650.000 won","pl":"650 000 wonów","it":"650.000 won","sv":"650 000 won","fi":"650 000 wonia","ja":"65万ウォン","zh-CN":"65万韩元"}},{"text":"80만 원","trans":{"en":"800,000 won","de":"800.000 Won","fr":"800 000 wons","es":"800.000 won","pl":"800 000 wonów","it":"800.000 won","sv":"800 000 won","fi":"800 000 wonia","ja":"80万ウォン","zh-CN":"80万韩元"}}],"answer":2,"explanation":"직원 민준은 합정역 근처 원룸의 월세가 65만 원이라고 소개했습니다."},{"type":"이해","questionAudio":"소개된 원룸에서 지하철역까지 얼마나 걸립니까?","questionTrans":{"en":"How far is the introduced studio from the subway station?","de":"Wie weit ist das vorgestellte Studio von der U-Bahnstation entfernt?","fr":"Quelle est la distance entre le studio présenté et la station de métro ?","es":"¿A qué distancia está el estudio presentado de la estación de metro?","pl":"Jak daleko jest od przedstawionego studia do stacji metra?","it":"Quanto dista il monolocale presentato dalla stazione della metropolitana?","sv":"Hur långt är det från det presenterade studiot till tunnelbanestationen?","fi":"Kuinka kaukana esitelty studio on metroasemalta?","ja":"紹介されたワンルームから地下鉄駅まではどのくらいかかりますか？","zh-CN":"介绍的单间距离地铁站有多远？"},"options":[{"text":"걸어서 2분","trans":{"en":"2 minutes on foot","de":"2 Minuten zu Fuß","fr":"2 minutes à pied","es":"2 minutos a pie","pl":"2 minuty pieszo","it":"2 minuti a piedi","sv":"2 minuter till fots","fi":"2 minuuttia kävellen","ja":"歩いて2分","zh-CN":"步行2分钟"}},{"text":"걸어서 5분","trans":{"en":"5 minutes on foot","de":"5 Minuten zu Fuß","fr":"5 minutes à pied","es":"5 minutos a pie","pl":"5 minut pieszo","it":"5 minuti a piedi","sv":"5 minuter till fots","fi":"5 minuuttia kävellen","ja":"歩いて5分","zh-CN":"步行5分钟"}},{"text":"걸어서 10분","trans":{"en":"10 minutes on foot","de":"10 Minuten zu Fuß","fr":"10 minutes à pied","es":"10 minutos a pie","pl":"10 minut pieszo","it":"10 minuti a piedi","s   6: {"id":6,"title":"음식 주문과 식당","titleTrans":{"en":"Ordering Food at a Restaurant","de":"Essen bestellen und Restaurant","fr":"Commander de la nourriture au restaurant","es":"Pedir comida en un restaurante","pl":"Zamawianie jedzenia w restauracji","it":"Ordinare cibo al ristorante","sv":"Beställa mat på restaurang","fi":"Ruoan tilaaminen ravintolassa","ja":"レストランでの食事の注文","zh-CN":"在餐厅点餐"},"desc":"식당에서 주문하고 불편사항 말하기","descTrans":{"en":"Ordering and expressing complaints at a restaurant","de":"Bestellen und Beschwerden in einem Restaurant äußern","fr":"Commander et exprimer des plaintes dans un restaurant","es":"Pedir y expresar quejas en un restaurante","pl":"Zamawianie i wyrażanie skarg w restauracji","it":"Ordinare ed esprimere lamentele in un ristorante","sv":"Beställa och uttrycka klagomål på en restaurang","fi":"Tilaaminen ja valitusten ilmaiseminen ravintolassa","ja":"レストランで注文して不満を伝える","zh-CN":"在餐厅点餐并表达不满"},"dialogue":[{"speaker":"지민","text":"저기요, 주문해도 될까요?","trans":{"en":"Excuse me, may I order?","de":"Entschuldigung, darf ich bestellen?","fr":"Excusez-moi, puis-je commander?","es":"Disculpe, ¿puedo pedir?","pl":"Przepraszam, czy mogę zamówić?","it":"Scusi, posso ordinare?","sv":"Ursäkta, får jag beställa?","fi":"Anteeksi, voinko tilata?","ja":"すみません、注文してもいいですか？","zh-CN":"不好意思，可以点餐了吗？"}},{"speaker":"수미","text":"네, 무엇을 드시겠어요?","trans":{"en":"Yes, what would you like?","de":"Ja, was möchten Sie haben?","fr":"Oui, que souhaitez-vous?","es":"Sí, ¿qué desea?","pl":"Tak, co sobie życzy?","it":"Sì, cosa desidera?","sv":"Ja, vad önskar du?","fi":"Kyllä, mitä haluaisitte?","ja":"はい、何になさいますか？","zh-CN":"好的，请问您要点什么？"}},{"speaker":"지민","text":"김치찌개 하나랑 공기밥 하나 주세요.","trans":{"en":"Please give me one kimchi stew and one bowl of rice.","de":"Bitte ein Kimchi-Eintopf und eine Portion Reis.","fr":"Un kimchi jjigae et un bol de riz, s'il vous plaît.","es":"Un kimchi jjigae y un bol de arroz, por favor.","pl":"Poproszę jedno kimchi jjigae i jedną porcję ryżu.","it":"Un kimchi jji lle couleur voulez-vous?","es":"Sí, tenemos negro y beige. ¿Qué color prefiere?","pl":"Tak, mamy czarny i beżowy. Jaki kolor chce?","it":"Sì, abbiamo nero e beige. Che colore desidera?","sv":"Ja, vi har svart och beige. Vilken färg vill du ha?","fi":"Kyllä, meillä on musta ja beige. Minkä värin haluatte?","ja":"はい、黒とベージュがあります。どの色がよろしいですか？","zh-CN":"有黑色和米色。您想要哪个颜色？"}},{"speaker":"지수","text":"검정색으로 주세요. 입어봐도 될까요?","trans":{"en":"Black, please. May I try it on?","de":"Schwarz, bitte. Darf ich es anprobieren?","fr":"Du noir, s'il vous plaît. Puis-je l'essayer?","es":"Negro, por favor. ¿Puedo probármelo?","pl":"Poproszę czarny. Czy mogę przymierzyć?","it":"Nero, per favore. Posso provarlo?","sv":"Svart, tack. Får jag prova det?","fi":"Musta, kiitos. Saanko sovittaa?","ja":"黒をください。試着してもいいですか？","zh-CN":"请给我黑色的。可以试穿吗？"}},{"speaker":"민준","text":"물론이죠. 탈의실은 저쪽에 있어요.","trans":{"en":"Of course. The fitting room is over there.","de":"Natürlich. Die Umkleidekabine ist dort drüben.","fr":"Bien sûr. La cabine d'essayage est par là.","es":"Por supuesto. El probador está por allá.","pl":"Oczywiście. Przymierzalnia jest tam.","it":"Certo. Il camerino è laggiù.","sv":"Självklart. Provrummet är där borta.","fi":"Tietenkin. Sovitushuone on tuolla.","ja":"もちろんです。試着室はあちらにあります。","zh-CN":"当然可以。试衣间在那边。"}},{"speaker":"지수","text":"좀 작은 것 같아요. 큰 사이즈로 바꿔 주실 수 있나요?","trans":{"en":"It seems a bit small. Could you exchange it for a bigger size?","de":"Es scheint etwas zu klein zu sein. Könnten Sie es in eine größere Größe umtauschen?","fr":"Il semble un peu petit. Pourriez-vous l'échanger contre une taille plus grande?","es":"Parece un poco pequeño. ¿Podría cambiarlo por una talla más grande?","pl":"Wydaje się trochę za małe. Czy mógłby pan zamienić na większy rozmiar?","it":"Sembra un po' piccolo. Potrebbe cambiarlo con una taglia più grande?","sv":"Det verkar lite litet. Kan du byta det mot en större storlek?","fi":"Se tuntuu hieman pieneltä. Voisitteko vaihtaa sen isompaan kokoon?","ja":"少し小さいようです。大きいサイズに替えてもらえますか？","zh-CN":"好像有点小。可以换大一码吗？"}},{"speaker":"민준","text":"죄송한데, 큰 사이즈는 지금 재고가 없어요. 환불도 가능합니다.","trans":{"en":"I'm sorry, but we don't have the larger size in stock. We can also give you a refund.","de":"Es tut mir leid, aber die größere Größe ist nicht vorrätig. Wir können auch eine Rückerstattung geben.","fr":"Désolé, mais nous n'avons pas la taille plus grande en stock. Nous pouvons aussi rembourser.","es":"Lo siento, pero no tenemos la talla más grande en inventario. También podemos reembolsarle.","pl":"Przepraszam, ale większy rozmiar nie jest dostępny. Możemy też zwrócić pieniądze.","it":"Mi dispiace, ma non abbiamo la taglia più grande in magazzino. Possiamo anche rimborsarla.","sv":"Förlåt, men vi har inte den större storleken i lager. Vi kan också ge återbetalning.","fi":"Anteeksi, mutta meillä ei ole isompaa kokoa varastossa. Voimme myös hyvittää.","ja":"申し訳ありませんが、大きいサイズは在庫がありません。返金も可能です。","zh-CN":"抱歉，大码现在没有库存。我们也可以退款。"}},{"speaker":"지수","text":"그럼 환불해 주세요. 영수증은 여기 있어요.","trans":{"en":"Then please give me a refund. Here's the receipt.","de":"Dann erstatten Sie mir bitte das Geld zurück. Hier ist der Kassenbon.","fr":"Alors remboursez-moi. Voici le reçu.","es":"Entonces, reembolso por favor. Aquí está el recibo.","pl":"W takim razie proszę o zwrot. Oto paragon.","it":"Allora, rimborso per favore. Ecco lo scontrino.","sv":"Då vill jag ha återbetalning. Här är kvittot.","fi":"Silloin palautus, kiitos. Tässä on kuitti.","ja":"では返金してください。レシートはここにあります。","zh-CN":"那就退款吧。收据在这里。"}},{"speaker":"민준","text":"확인해 볼게요. 구매하신 지 얼마나 됐나요?","trans":{"en":"Let me check. How long ago did you purchase this?","de":"Ich schaue mal nach. Wie lange ist es her, dass Sie das gekauft haben?","fr":"Je vais vérifier. Il y a combien de temps avez-vous acheté cela?","es":"Déjeme verificar. ¿Hace cuánto tiempo compró esto?","pl":"Sprawdzę. Jak dawno to kupił?","it":"Verifico. Quanto tempo fa ha acquistato questo?","sv":"Låt mig kontrollera. Hur länge sedan köpte du det?","fi":"   8: {"id":8,"title":"취미 생활","titleTrans":{"en":"Hobbies and Leisure","de":"Hobbys und Freizeit","fr":"Loisirs et hobbies","es":"Pasatiempos y ocio","pl":"Hobby i czas wolny","it":"Hobby e tempo libero","sv":"Hobby och fritid","fi":"Harrastukset ja vapaa-aika","ja":"趣味と余暇活動","zh-CN":"兴趣爱好与休闲活动"},"desc":"취미 활동 소개와 계획","descTrans":{"en":"Introducing hobbies and making plans","de":"Hobbys vorstellen und Pläne machen","fr":"Présenter des hobbies et faire des projets","es":"Presentar pasatiempos y hacer planes","pl":"Przedstawianie hobby i planowanie","it":"Presentare hobby e fare piani","sv":"Presentera hobbies och göra planer","fi":"Harrastusten esittely ja suunnitelmat","ja":"趣味の紹介と計画を立てる","zh-CN":"介绍兴趣爱好并制定计划"},"dialogue":[{"speaker":"유진","text":"현우 씨, 요즘 뭐 하면서 시간 보내요?","trans":{"en":"Hyunwoo, what do you do with your free time these days?","de":"Hyunwoo, womit verbringen Sie heutzutage Ihre Zeit?","fr":"Hyunwoo, que faites-vous de votre temps libre ces jours-ci?","es":"Hyunwoo, ¿cómo pasa el tiempo libre últimamente?","pl":"Hyunwoo, jak spędza teraz wolny czas?","it":"Hyunwoo, come trascorre il tempo libero di questi tempi?","sv":"Hyunwoo, vad gör du på din fritid nuförtiden?","fi":"Hyunwoo, miten vietät aikaasi nykyään?","ja":"ヒョヌさん、最近どんなことをして過ごしていますか？","zh-CN":"贤宇，最近在做什么消磨时间？"}},{"speaker":"현우","text":"저는 요즘 사진 찍기에 빠져 있어요. 주말마다 카메라 들고 나가거든요.","trans":{"en":"I'm really into photography these days. I go out with my camera every weekend.","de":"Ich bin derzeit begeistert von der Fotografie. Ich gehe jeden Wochenende mit meiner Kamera raus.","fr":"Je suis passionné de photographie ces jours-ci. Je sors avec mon appareil photo chaque week-end.","es":"Últimamente estoy muy metido en la fotografía. Salgo con mi cámara cada fin de semana.","pl":"Ostatnio pochłonęła mnie fotografia. Co weekend wychodzę z aparatem.","it":"Ultimamente sono appassionato di fotografia. Esco con la macchina fotografica ogni fine settimana.","sv":"Jag är verkligen inne på fotografering nuförtiden. Jag går ut med kameran varje helg.","fi":"Olen tällä hetkellä innostunut valokuvauksesta. Lähden kameran kanssa ulos joka viikonloppu.","ja":"最近、写真撮影にはまっています。毎週末カメラを持って出かけるんです。","zh-CN":"我最近迷上了摄影。每个周末都会拿着相机出去拍照。"}},{"speaker":"유진","text":"오, 멋있네요! 주로 어떤 사진 찍어요?","trans":{"en":"Oh, that's cool! What kind of photos do you mainly take?","de":"Oh, das ist toll! Was für Fotos machst du hauptsächlich?","fr":"Oh, c'est génial! Quel genre de photos prenez-vous principalement?","es":"¡Oh, qué genial! ¿Qué tipo de fotos toma principalmente?","pl":"Oh, super! Jakie zdjęcia głównie robi?","it":"Oh, che bello! Che tipo di foto fa principalmente?","sv":"Oh, det är häftigt! Vilken sorts foton tar du främst?","fi":"Vau, hienoa! Minkälaisia kuvia pääasiassa otat?","ja":"おー、かっこいいですね！主にどんな写真を撮るんですか？","zh-CN":"哦，真酷！主要拍什么类型的照片？"}},{"speaker":"현우","text":"풍경 사진을 좋아해요. 특히 일출이나 일몰 사진 찍는 걸 즐겨요.","trans":{"en":"I like landscape photos. I especially enjoy taking sunrise and sunset photos.","de":"Ich mag Landschaftsfotos. Ich fotografiere besonders gerne Sonnenauf- und -untergänge.","fr":"J'aime les photos de paysage. J'aime particulièrement prendre des photos de levers et couchers de soleil.","es":"Me gustan las fotos de paisajes. Especialmente disfruto fotografiando amaneceres y atardeceres.","pl":"Lubię zdjęcia krajobrazowe. Szczególnie lubię fotografować wschody i zachody słońca.","it":"Mi piacciono le foto di paesaggi. Adoro in particolare scattare foto all'alba e al tramonto.","sv":"Jag gillar landskapsfoton. Jag tycker särskilt om att ta foton av soluppgångar och solnedgångar.","fi":"Pidän maisemakuvista. Erityisesti nautin auringonnousu- ja auringonlaskukuvien ottamisesta.","ja":"風景写真が好きです。特に日の出や日の入りの写真を撮るのが好きです。","zh-CN":"我喜欢风景照。特别喜欢拍日出和日落。"}},{"speaker":"유진","text":"저도 취미를 새로 시작해 보고 싶은데, 뭐가 좋을까요?","trans":{"en":"I want to start a new hobby too. What do you think would be good?","de":"Ich möchte auch ein neues Hobby beginnen. Was würden Sie empfehlen?","fr":"Je voudrais aussi commencer un nouveau hobby. Qu'est-ce qui serait bien?","es":"Yo también quiero empezar un nuevo hobby. ¿Qué cree que sería bueno?","pl":"Ja też chcę zacząć nowe hobby. Co myślisz, co byłoby dobre?","it":"Voglio anche iniziare un nuovo hobby. Cosa potrebbe andare bene?","sv":"Jag vill också börja med en ny hobby. Vad tror du vore bra?","fi":"Haluaisin myös aloittaa uuden harrastuksen. Mitä luulet, mikä olisi hyvä?","ja":"私も新しい趣味を始めてみたいんですが、何がいいでしょう？","zh-CN":"我也想开始一个新爱好，您觉得什么好呢？"}},{"speaker":"현우","text":"유진 씨는 어떤 걸 좋아해요? 야외 활동을 좋아하면 등산도 좋아요.","trans":{"en":"What do you like, Yujin? If you like outdoor activities, hiking is also good.","de":"Was mögen Sie, Yujin? Wenn Sie Outdoor-Aktivitäten mögen, ist Wandern auch gut.","fr":"Qu'est-ce que vous aimez, Yujin? Si vous aimez les activités de plein air, la randonnée est bien aussi.","es":"¿Qué te gusta, Yujin? Si te gustan las actividades al aire libre, hacer senderismo también es bueno.","pl":"Co lubisz, Yujin? Jeśli lubisz aktywności na świeżym powietrzu, wspinaczka górska też jest dobra.","it":"Cosa le piace, Yujin? Se le piacciono le attività all'aperto, anche l'escursionismo è una buona idea.","sv":"Vad gillar du, Yujin? Om du gillar utomhusaktiviteter är vandring också bra.","fi":"Mistä pidät, Yujin? Jos pidät ulkoilma-aktiviteeteistä, vaeltaminen on myös hyvä.","ja":"ユジンさんは何が好きですか？アウトドア活動が好きなら登山もいいですよ。","zh-CN":"柔珍你喜欢什么？如果喜欢户外活动，爬山也很不错。"}},{"speaker":"유진","text":"등산은 좀 힘들 것 같아요. 실내에서 할 수 있는 게 뭐가 있을까요?","trans":{"en":"Hiking seems a bit hard. What can I do indoors?","de":"Wandern scheint etwas anstrengend zu sein. Was kann ich drinnen machen?","fr":"La randonnée semble un peu difficile. Qu'est-ce que je peux faire à l'intérieur?","es":"El senderismo parece un poco difícil. ¿Qué puedo hacer en interiores?","pl":"Wspinaczka górska wydaje się trochę za trudna. Co mogę robić w pomieszczeniach?","it":"L'escursionismo sembra un po' faticoso. Cosa posso fare al chiuso?","sv":"Vandring verkar lite ansträngande. Vad kan jag göra inomhus?","fi":"Vaeltaminen tuntuu hieman raskaalta. Mitä voin tehdä sisätiloissa?","ja":"登山はちょっときつそうです。室内でできることは何がありますか？","zh-CN":"爬山好像有点累。室内可以做什么呢？"}},{"speaker":"현우","text":"요리나 그림 그리기는 어때요? 집에서도 할 수 있어서 편하거든요.","trans":{"en":"How about cooking or drawing? You can do them at home too, so it's convenient.","de":"Wie wäre es mit Kochen oder Zeichnen? Das kann man auch zu Hause machen, also ist es bequem.","fr":"Que pensez-vous de la cuisine ou du dessin? Vous pouvez le faire à la maison aussi, c'est pratique.","es":"¿Qué tal cocinar o dibujar? También puedes hacerlo en casa, así que es conveniente.","pl":"Co powiesz na gotowanie lub rysowanie? Możesz to robić też w domu, więc jest wygodnie.","it":"Che ne dici di cucinare o disegnare? Puoi farlo anche a casa, quindi è comodo.","sv":"Vad sägs om matlagning eller teckning? Du kan göra det hemma också, så det är bekvämt.","fi":"Entä ruoanlaitto tai piirtäminen? Voit tehdä niitä kotona myös, joten se on kätevää.","ja":"料理や絵を描くのはどうですか？家でもできるので便利ですよ。","zh-CN":"做饭或画画怎么样？在家也可以做，很方便。"}},{"speaker":"유진","text":"그림 그리기 재미있을 것 같아요. 어디서 배울 수 있나요?","trans":{"en":"Drawing sounds fun. Where can I learn it?","de":"Zeichnen klingt Spaß. Wo kann ich es lernen?","fr":"Dessiner semble amusant. Où puis-je l'apprendre?","es":"Dibujar suena divertido. ¿Dónde puedo aprenderlo?","pl":"Rysowanie brzmi ciekawie. Gdzie mogę się tego nauczyć?","it":"Disegnare sembra divertente. Dove posso impararlo?","sv":"Att rita låter roligt. Var kan jag lära mig det?","fi":"Piirtäminen kuulostaa hauskalta. Missä voin oppia sen?","ja":"絵を描くのは楽しそうです。どこで学べますか？","zh-CN":"画画听起来很有趣。在哪里可以学呢？"}},{"speaker":"현우","text":"요즘엔 유튜브에 좋은 강의가 많아요. 아니면 동네 문화센터도 있고요.","trans":{"en":"These days there are many good lectures on YouTube. Or there's the local community center too.","de":"Heutzutage gibt es viele gute Vorlesungen auf YouTube. Oder es gibt auch das örtliche Gemeinschaftszentrum.","fr":"De nos jours, il y a beaucoup de bons cours sur YouTube. Ou il y a aussi le ce   9: {"id":9,"title":"건강검진 결과","titleTrans":{"en":"Health Checkup Results","de":"Ergebnisse der Gesundheitsuntersuchung","fr":"Résultats du bilan de santé","es":"Resultados del examen médico","pl":"Wyniki badań zdrowotnych","it":"Risultati della visita medica","sv":"Resultat av hälsoundersökning","fi":"Terveystarkastuksen tulokset","ja":"健康診断の結果","zh-CN":"健康检查结果"},"desc":"건강검진 결과 듣고 생활습관 조언","descTrans":{"en":"Hearing health checkup results and receiving lifestyle advice","de":"Ergebnisse der Gesundheitsuntersuchung hören und Ratschläge zum Lebensstil erhalten","fr":"Écouter les résultats du bilan de santé et recevoir des conseils sur le mode de vie","es":"Escuchar los resultados del examen médico y recibir consejos de estilo de vida","pl":"Słuchanie wyników badań zdrowotnych i otrzymywanie porad dotyczących stylu życia","it":"Ascoltare i risultati della visita medica e ricevere consigli sullo stile di vita","sv":"Höra resultaten av hälsoundersökning och få råd om livsstil","fi":"Terveystarkastuksen tulosten kuuleminen ja elämäntapaneuvot","ja":"健康診断の結果を聞き、生活習慣についてアドバイスを受ける","zh-CN":"听取健康检查结果并获得生活习惯建议"},"dialogue":[{"speaker":"수미","text":"안녕하세요, 김수미 씨. 건강검진 결과 나왔어요. 앉으세요.","trans":{"en":"Hello, Ms. Kim Sumi. Your health checkup results are in. Please have a seat.","de":"Hallo, Frau Kim Sumi. Die Ergebnisse Ihrer Gesundheitsuntersuchung sind da. Bitte setzen Sie sich.","fr":"Bonjour, Madame Kim Sumi. Les résultats de votre bilan de santé sont arrivés. Asseyez-vous.","es":"Hola, señora Kim Sumi. Los resultados de su examen médico han llegado. Por favor, siéntese.","pl":"Dzień dobry, pani Kim Sumi. Wyniki badań zdrowotnych są gotowe. Proszę usiąść.","it":"Buongiorno, signora Kim Sumi. I risultati della sua visita medica sono arrivati. Si accomodi.","sv":"Hej, fru Kim Sumi. Dina hälsoundersökningsresultat har kommit. Var god sitt ner.","fi":"Hyvää päivää, neiti Kim Sumi. Terveystarkastuksenne tulokset ovat saapuneet. Istuutukaa.","ja":"こんにちは、キム・スミさん。健康診断の結果が出ました。座ってください。","zh-CN":"您好，金秀美女士。健康检查结果出来了。请坐。"}},{"speaker":"지민","text":"감사합니다. 결과가 어떻게 됐나요?","trans":{"en":"Thank you. How did the results turn out?","de":"Danke. Wie sind die Ergebnisse?","fr":"Merci. Comment sont les résultats?","es":"Gracias. ¿Cómo salieron los resultados?","pl":"Dziękuję. Jakie są wyniki?","it":"Grazie. Come sono i risultati?","sv":"Tack. Hur blev resultaten?","fi":"Kiitos. Miten tulokset menivät?","ja":"ありがとうございます。結果はどうでしたか？","zh-CN":"谢谢。结果怎么样？"}},{"speaker":"수미","text":"혈압이 좀 높고, 콜레스테롤 수치도 정상보다 높아요.","trans":{"en":"Your blood pressure is a bit high, and your cholesterol level is also higher than normal.","de":"Ihr Blutdruck ist etwas hoch, und auch Ihr Cholesterinwert ist höher als normal.","fr":"Votre tension artérielle est un peu élevée, et votre taux de cholestérol est également supérieur à la normale.","es":"Su presión arterial es un poco alta, y su nivel de colesterol también es más alto de lo normal.","pl":"Ciśnienie krwi jest trochę wysokie, a poziom cholesterolu też jest wyższy od normy.","it":"La pressione sanguigna è un po' alta, e anche il livello di colesterolo è più alto del normale.","sv":"Ditt blodtryck är lite högt, och ditt kolesterolvärde är också högre än normalt.","fi":"Verenpaineenne on hieman korkea, ja kolesterolitasonne on myös normaalia korkeampi.","ja":"血圧が少し高く、コレステロール値も正常より高いです。","zh-CN":"血压有点高，胆固醇水平也比正常值高。"}},{"speaker":"지민","text":"심각한가요? 많이 걱정돼요.","trans":{"en":"Is it serious? I'm very worried.","de":"Ist es ernst? Ich mache mir große Sorgen.","fr":"C'est grave? Je suis très inquiète.","es":"¿Es grave? Estoy muy preocupada.","pl":"Czy to poważne? Bardzo się martwię.","it":"È grave? Sono molto preoccupata.","sv":"Är det allvarligt? Jag är väldigt orolig.","fi":"Onko se vakavaa? Olen hyvin huolissani.","ja":"深刻ですか？とても心配です。","zh-CN":"严重吗？我很担心。"}},{"speaker":"수미","text":"지금 당장 심각하진 않지만, 생활습관을 바꾸지 않으면 위험할 수 있어요.","trans":{"en":"It's not immediately serious, but it could be dangerous if you don't change your lifestyle.","de":"Es ist nicht sofort ernst, aber es könnte gefährlich werden, wenn Sie Ihren Lebensstil nicht ändern.","fr":"Ce n'est pas immédiatement grave, mais cela pourrait devenir dangereux si vous ne changez pas votre mode de vie.","es":"No es inmediatamente grave, pero podría ser peligroso si no cambia su estilo de vida.","pl":"Na razie nie jest to poważne, ale może być niebezpieczne, jeśli nie zmienisz stylu życia.","it":"Non è immediatamente grave, ma potrebbe essere pericoloso se non cambia stile di vita.","sv":"Det är inte omedelbart allvarligt, men det kan bli farligt om du inte ändrar din livsstil.","fi":"Se ei ole välittömästi vakavaa, mutta se voi olla vaarallista, jos et muuta elämäntapojasi.","ja":"今すぐ深刻ではありませんが、生活習慣を変えなければ危険になる可能性があります。","zh-CN":"目前还不严重，但如果不改变生活习惯，可能会有危险。"}},{"speaker":"지민","text":"어떻게 바꿔야 할까요?","trans":{"en":"What should I change?","de":"Was sollte ich ändern?","fr":"Que devrais-je changer?","es":"¿Qué debería cambiar?","pl":"Co powinienem zmienić?","it":"Cosa dovrei cambiare?","sv":"Vad ska jag ändra?","fi":"Mitä minun pitäisi muuttaa?","ja":"どう変えればいいですか？","zh-CN":"应该怎么改变呢？"}},{"speaker":"수미","text":"우선 짠 음식과 기름진 음식을 줄이고, 규칙적으로 운동하셔야 해요.","trans":{"en":"First, you need to reduce salty and greasy foods, and exercise regularly.","de":"Zunächst müssen Sie salzige und fettige Speisen reduzieren und regelmäßig Sport treiben.","fr":"D'abord, vous devez réduire les aliments salés et gras, et faire de l'exercice régulièrement.","es":"Primero, necesita reducir los alimentos salados y grasos, y hacer ejercicio regularmente.","pl":"Przede wszystkim należy ograniczyć słone i tłuste potrawy i regularnie ćwiczyć.","it":"Prima di tutto, deve ridurre i cibi salati e grassi, e fare esercizio regolarmente.","sv":"Först måste du minska saltat och fettig mat, och motionera regelbundet.","fi":"Ensinnäkin sinun täytyy vähentää suolaista ja rasvaista ruokaa ja liikkua säännöllisesti.","ja":"まず塩辛い食べ物と脂っこい食べ物を減らして、定期的に運動してください。","zh-CN":"首先要减少咸食和油腻食物，并定期运动。"}},{"speaker":"지민","text":"운동은 얼마나 해야 하나요?","trans":{"en":"How much should I exercise?","de":"Wie viel sollte ich Sport treiben?","fr":"Combien d'exercice devrais-je faire?","es":"¿Cuánto ejercicio debo hacer?","pl":"Ile ćwiczeń powinienem robić?","it":"Quanto esercizio dovrei fare?","sv":"Hur mycket ska jag motionera?","fi":"Kuinka paljon minun pitäisi liikkua?","ja":"運動はどのくらいすればいいですか？","zh-CN":"应该运动多少？"}},{"speaker":"수미","text":"하루 30분 이상, 일주일에 적어도 3번은 하시는 게 좋아요.","trans":{"en":"It's good to do at least 30 minutes a day, at least 3 times a week.","de":"Es ist gut, mindestens 30 Minuten pro Tag, mindestens 3 Mal pro Woche zu machen.","fr":"Il est bon de faire au moins 30 minutes par jour, au moins 3 fois par semaine.","es":"Es bueno hacer al menos 30 minutos al día, al menos 3 veces a la semana.","pl":"Dobrze jest ćwiczyć co najmniej 30 minut dziennie, przynajmniej 3 razy w tygodniu.","it":"È bene fare almeno 30 minuti al giorno, almeno 3 volte alla settimana.","sv":"Det är bra att göra minst 30 minuter om dagen, minst 3 gånger i veckan.","fi":"On hyvä liikkua vähintään 30 minuuttia päivässä, vähintään 3 kertaa viikossa.","ja":"一日30分以上、週に少なくとも3回するのが良いです。","zh-CN":"最好每天30分钟以上，每周至少3次。"}},{"speaker":"지민","text":"알겠어요. 열심히 노력해 볼게요. 다음 검진은 언제 받아야 하나요?","trans":{"en":"I understand. I'll try hard. When should I get the next checkup?","de":"Ich verstehe. Ich werde mein Bestes tun. Wann sollte ich die nächste Untersuchung bekommen?","fr":"Je comprends. Je vais faire de mon mieux. Quand devrais-je faire le prochain bilan?","es":"Entiendo. Voy a esforzarme. ¿Cuándo debo tener el próximo chequeo?","pl":"Rozumiem. Postaram się. Kiedy powinienem mieć następne badanie?","it":"Capisco. Cercherò di impegnarmi. Quando dovrei fare il prossimo controllo?","sv":"Jag förstår. Jag ska anstränga mig. När ska jag ha nästa undersökning?","fi":"Ymmärrän. Yritän kovasti. Milloin minun pitäisi saada seuraava tarkastus?","ja":"わかりました。頑張ってみます。次の検診はいつ受ければいいですか？","zh-CN":"明白了。我会努力的。下次检查是什么时候？"}}],"vocab":[{"word ":"最好每周至少做3次。"}}],"quizzes":[{"type":"이해","questionAudio":"지민의 건강검진에서 문제가 된 것은 무엇입니까?","questionTrans":{"en":"What were the problems found in Jimin's health checkup?","de":"Was waren die Probleme bei Jimins Gesundheitsuntersuchung?","fr":"Quels étaient les problèmes trouvés dans le bilan de santé de Jimin?","es":"¿Cuáles fueron los problemas encontrados en el examen médico de Jimin?","pl":"Jakie problemy znaleziono podczas badania zdrowotnego Jimina?","it":"Quali sono stati i problemi trovati nella visita medica di Jimin?","sv":"Vilka problem hittades i Jimins hälsoundersökning?","fi":"Mitä ongelmia löydettiin Jimin terveystarkastuksessa?","ja":"ジミンの健康診断で問題になったのは何ですか？","zh-CN":"智敏的健康检查发现了什么问题？"},"options":[{"text":"혈당과 콜레스테롤","trans":{"en":"Blood sugar and cholesterol","de":"Blutzucker und Cholesterin","fr":"Glycémie et cholestérol","es":"Azúcar en sangre y colesterol","pl":"Cukier we krwi i cholesterol","it":"Zucchero nel sangue e colesterolo","sv":"Blodsocker och kolesterol","fi":"Verensokeri ja kolesteroli","ja":"血糖値とコレステロール","zh-CN":"血糖和胆固醇"}},{"text":"혈압과 콜레스테롤","trans":{"en":"Blood pressure and cholesterol","de":"Blutdruck und Cholesterin","fr":"Tension artérielle et cholestérol","es":"Presión arterial y colesterol","pl":"Ciśnienie krwi i cholesterol","it":"Pressione sanguigna e colesterolo","sv":"Blodtryck och kolesterol","fi":"Verenpaine ja kolesteroli","ja":"血圧とコレステロール","zh-CN":"血压和胆固醇"}},{"text":"체중과 혈압","trans":{"en":"Weight and blood pressure","de":"Gewicht und Blutdruck","fr":"Poids et tension artérielle","es":"Peso y presión arterial","pl":"Waga i ciśnienie krwi","it":"Peso e pressione sanguigna","sv":"Vikt och blodtryck","fi":"Paino ja verenpaine","ja":"体重と血圧","zh-CN":"体重和血压"}},{"text":"간 수치와 혈당","trans":{"en":"Liver level and blood sugar","de":"Leberwert und Blutzucker","fr":"Taux hépatique et glycémie","es":"Nivel hepático y azúcar en sangre","pl":"Poziom wątroby i cukier we krwi","it":"Livello del fegato e glicemia","sv":"Levervärde och blodsocker","fi":"Maksa-arvo ja verensokeri","ja":"肝臓数値と血糖値","zh-CN":"肝脏指标和血糖"}}],"answer":1,"explanation":"수미는 '혈압이 좀 높고, 콜레스테롤 수치도 정상보다 높아요'라고 했습니다."},{"type":"이해","questionAudio":"의사가 권장한 운동 빈도는 얼마입니까?","questionTrans":{"en":"What exercise frequency did the doctor recommend?","de":"Welche Übungsfrequenz empfahl der Arzt?","fr":"Quelle fréquence d'exercice le médecin a-t-il recommandée?","es":"¿Qué frecuencia de ejercicio recomendó el médico?","pl":"Jaką częstotliwość ćwiczeń zalecił lekarz?","it":"Quale frequenza di esercizio ha raccomandato il medico?","sv":"Vilken träningsfrekvens rekommenderade läkaren?","fi":"Minkä harjoitustaajuuden lääkäri suositteli?","ja":"医師が勧めた運動の頻度は何ですか？","zh-CN":"医生推荐的运动频率是多少？"},"options":[{"text":"일주일에 1번, 1시간","trans":{"en":"Once a week, 1 hour","de":"Einmal pro Woche, 1 Stunde","fr":"Une fois par semaine, 1 heure","es":"Una vez a la semana, 1 hora","pl":"Raz w tygodniu, 1 godzina","it":"Una volta alla settimana, 1 ora","sv":"En gång i veckan, 1 timme","fi":"Kerran viikossa, 1 tunti","ja":"週1回、1時間","zh-CN":"每周1次，1小时"}},{"text":"매일 1시간","trans":{"en":"Every day, 1 hour","de":"Täglich 1 Stunde","fr":"Tous les jours, 1 heure","es":"Cada día, 1 hora","pl":"Codziennie 1 godzina","it":"Ogni giorno, 1 ora","sv":"Varje dag, 1 timme","fi":"Joka päivä, 1 tunti","ja":"毎日1時間","zh-CN":"每天1小时"}},{"text":"일주일에 3번 이상, 30분 이상","trans":{"en":"At least 3 times a week, at least 30 minutes","de":"Mindestens 3 Mal pro Woche, mindestens 30 Minuten","fr":"Au moins 3 fois par semaine, au moins 30 minutes","es":"Al menos 3 veces a la semana, al menos 30 minutos","pl":"Przynajmniej 3 razy w tygodniu, co najmniej 30 minut","it":"Almeno 3 volte alla settimana, almeno 30 minuti","sv":"Minst 3 gånger i veckan, minst 30 minuter","fi":"Vähintään 3 kertaa viikossa, vähintään 30 minuuttia","ja":"週3回以上、30分以上","zh-CN":"每周至少3次，每次至少30分钟"}},{"text":"일주일에 5번, 20분","trans":{"en":"5 times a week, 20 minutes","de":"5 Mal pro Woche, 20 Minuten","fr":"5 fois par semaine, 20 minutes","es":"5 veces a la semana, 20 minutos","pl":"5 razy w tygodniu, 20 minut","it":"5 volte alla settimana, 20 minuti","sv":"5 gånger i veckan, 20 minuter","fi":"5 kertaa viikossa, 20 minuuttia","ja":"週5回、20分","zh-CN":"每周5次，20分钟"}}],"answer":2,"explanation":"수미는 '하루 30분 이상, 일주일에 적어도 3번은 하시는 게 좋아요'라고 했습니다."},{"type":"이해","questionAudio":"의사가 줄이라고 한 음식은 무엇입니까?","questionTrans":{"en":"What foods did the doctor say to reduce?","de":"Welche Speisen empfahl der Arzt zu reduzieren?","fr":"Quels aliments le médecin a-t-il dit de réduire?","es":"¿Qué alimentos dijo el médico que debía reducir?","pl":"Jakie potrawy lekarz kazał ograniczyć?","it":"Quali cibi il medico ha detto di ridurre?","sv":"Vilken mat sa läkaren att minska?","fi":"Mitä ruokia lääkäri sanoi vähentää?","ja":"医師が減らすように言った食べ物は何ですか？","zh-CN":"医生说要减少什么食物？"},"options":[{"text":"단 음식과 밀가루 음식","trans":{"en":"Sweet foods and flour-based foods","de":"Süße Speisen und mehlbasierte Speisen","fr":"Aliments sucrés et aliments à base de farine","es":"Alimentos dulces y alimentos de harina","pl":"Słodkie potrawy i potrawy z mąki","it":"Cibi dolci e cibi a base di farina","sv":"Söt mat och mjölbaserad mat","fi":"Makeat ruoat ja jauhoperustaiset ruoat","ja":"甘い食べ物と小麦粉食品","zh-CN":"甜食和面食"}},{"text":"짠 음식과 기름진 음식","trans":{"en":"Salty and greasy foods","de":"Salzige und fettige Speisen","fr":"Aliments salés et gras","es":"Alimentos salados y grasos","pl":"Słone i tłuste potrawy","it":"Cibi salati e grassi","sv":"Saltad och fettig mat","fi":"Suolainen ja rasvainen ruoka","ja":"塩辛い食べ物と脂っこい食べ物","zh-CN":"咸食和油腻食物"}},{"text":"매운 음식과 짠 음식","trans":{"en":"Spicy and salty foods","de":"Scharfe und salzige Speisen","fr":"Aliments épicés et salés","es":"Alimentos picantes y salados","pl":"Ostre i słone potrawy","it":"Cibi piccanti e salati","sv":"Kryddig och saltad mat","fi":"Mausteinen ja suolainen ruoka","ja":"辛い食べ物と塩辛い食べ物","zh-CN":"辣食和咸食"}},{"text":"단 음식과 기름진 음식","trans":{"en":"Sweet and greasy foods","de":"Süße und fettige Speisen","fr":"Aliments sucrés et gras","es":"Alimentos dulces y grasos","pl":"Słodkie i tłuste potrawy","it":"Cibi dolci e grassi","sv":"Söt och fettig mat","fi":"Makea ja rasvainen ruoka","ja":"甘い食べ物と脂っこい食べ物","zh-CN":"甜食和油腻食物"}}],"answer":1,"explanation":"수미는 '짠 음식과 기름진 음식을 줄이고'라고 했습니다."}]},
  10: {"id":10,"title":"집 수리 요청","titleTrans":{"en":"Home Repair Request","de":"Anfrage zur Hausreparatur","fr":"Demande de réparation domicile","es":"Solicitud de reparación del hogar","pl":"Prośba o naprawę domu","it":"Richiesta di riparazione domestica","sv":"Begäran om husreparation","fi":"Kotiremonttipyyntö","ja":"自宅の修理依頼","zh-CN":"家庭维修申请"},"desc":"집 문제를 집주인에게 신고","descTrans":{"en":"Reporting home issues to the landlord","de":"Haushaltsschäden dem Vermieter melden","fr":"Signaler des problèmes de logement au propriétaire","es":"Reportar problemas del hogar al propietario","pl":"Zgłaszanie problemów z domem właścicielowi","it":"Segnalare problemi domestici al proprietario","sv":"Rapportera husproblem till hyresvärden","fi":"Kotiongelmien ilmoittaminen vuokranantajalle","ja":"家の問題を家主に報告する","zh-CN":"向房东报告家里的问题"},"dialogue":[{"speaker":"현우","text":"안녕하세요, 박 씨. 집에 문제가 생겨서 연락드렸어요.","trans":{"en":"Hello, Mr. Park. I'm calling because there's a problem at home.","de":"Hallo, Herr Park. Ich melde mich, weil es ein Problem zu Hause gibt.","fr":"Bonjour, Monsieur Park. Je vous contacte parce qu'il y a un problème à la maison.","es":"Hola, señor Park. Le llamo porque hay un problema en casa.","pl":"Dzień dobry, panie Park. Dzwonię, bo w domu jest problem.","it":"Buongiorno, signor Park. La contatto perché c'è un problema a casa.","sv":"Hej, herr Park. Jag hör av mig för att det är ett problem hemma.","fi":"Hei, herra Park. Otan yhteyttä, koska kotona on ongelma.","ja":"こんにちは、パクさん。家に問題が起きたので連絡しました。","zh-CN":"您好，朴先生。家里出了问题，所以联系您。"}},{"speaker":"지민","text":"어, 현우 씨. 무슨 일이에요?","trans":{"en":"Oh, Hyunwoo. What's the matter?","de":"Oh, Hyunwoo. Was ist passiert?","fr":"Oh, Hyunwoo. Qu'est-ce qu'il se passe?","es":"Oh, Hyunwoo. ¿Qué pasa?","pl":"Och, Hyunwoo. Co się stało?","it":"Oh, Hyunwoo. Cosa è successo?","sv":"Å, Hyunwoo. Vad har hänt?","fi":"Oi, Hyunwoo. Mitä on tapahtunut?","ja":"ヒョヌさん、どうしましたか？","zh-CN":"哦，贤宇。怎么了？"}},{"speaker":"현우","text":"부엌 수도꼭지에서 물이 새고 있어요. 어제부터 계속 떨어지고 있거든요.","trans":{"en":"The kitchen faucet is leaking. It's been dripping since yesterday.","de":"Der Küchenhahn leckt. Er tropft seit gestern.","fr":"Le robinet de cuisine fuit. Ça coule depuis hier.","es":"El grifo de la cocina está goteando. Lleva goteando desde ayer.","pl":"Kran w kuchni przecieka. Kapie od wczoraj.","it":"Il rubinetto della cucina perde. Sta gocciolando da ieri.","sv":"Köksekranen läcker. Det har droppat sedan igår.","fi":"Keittiön hana vuotaa. Se on tippunut eilisestä lähtien.","ja":"台所の蛇口から水が漏れています。昨日からずっと垂れているんです。","zh-CN":"厨房的水龙头在漏水。从昨天开始一直在滴。"}},{"speaker":"지민","text":"아, 그래요? 많이 새요?","trans":{"en":"Oh really? Is it leaking a lot?","de":"Oh wirklich? Leckt es stark?","fr":"Oh vraiment? Ça fuit beaucoup?","es":"¿En serio? ¿Está goteando mucho?","pl":"Naprawdę? Dużo przecieka?","it":"Davvero? Perde molto?","sv":"Verkligen? Läcker det mycket?","fi":"Vai niin? Vuotaako se paljon?","ja":"そうですか。たくさん漏れていますか？","zh-CN":"是吗？漏得多吗？"}},{"speaker":"현우","text":"많이 새지는 않는데, 계속 이러면 수도세가 걱정돼요. 그리고 바닥도 젖고 있고요.","trans":{"en":"It's not leaking a lot, but I'm worried about the water bill if it continues. And the floor is getting wet too.","de":"Es leckt nicht viel, aber ich mache mir Sorgen um die Wasserrechnung, wenn es so weitergeht. Und der Boden wird auch nass.","fr":"Ça ne fuit pas beaucoup, mais je m'inquiète de la facture d'eau si ça continue. Et le sol se mouille aussi.","es":"No gotea mucho, pero me preocupa la factura del agua si continúa. Y el suelo también se está mojando.","pl":"Nie przecieka dużo, ale martwię się o rachunek za wodę, jeśli tak będzie. I podłoga też moknieje.","it":"Non perde molto, ma mi preoccupa la bolletta dell'acqua se continua così. E anche il pavimento si sta bagnando.","sv":"Det läcker inte mycket, men jag är orolig för vattenfakturan om det fortsätter. Och golvet blir också blött.","fi":"Se ei vuoda paljoa, mutta olen huolissani vesilaskusta, jos se jatkuu. Ja lattia kastuu myös.","ja":"そんなにたくさんは漏れていませんが、このまま続くと水道代が心配です。床も濡れてきています。","zh-CN":"漏的不多，但如果继续这样我担心水费。而且地板也在变湿。"}},{"speaker":"지민","text":"알겠어요. 빨리 고쳐 드려야겠네요. 수리기사를 언제 보내 드릴까요?","trans":{"en":"I understand. I need to fix it quickly. When shall I send the repairman?","de":"Ich verstehe. Ich muss es schnell reparieren. Wann soll ich den Reparateur schicken?","fr":"Je comprends. Il faut réparer ça rapidement. Quand dois-je envoyer le réparateur?","es":"Entiendo. Necesito arreglarlo rápido. ¿Cuándo debo enviar al técnico?","pl":"Rozumiem. Muszę to szybko naprawić. Kiedy mam przysłać technika?","it":"Capisco. Devo ripararlo velocemente. Quando mando il tecnico?","sv":"Jag förstår. Jag måste laga det snabbt. När ska jag skicka reparatören?","fi":"Ymmärrän. Täytyy korjata nopeasti. Milloin lähetan korjaajan?","ja":"わかりました。早く直してあげないといけませんね。修理屋はいつ送りましょうか？","zh-CN":"明白了。要尽快修好。什么时候派维修工来？"}},{"speaker":"현우","text":"내일 오전에 가능할까요? 오전 10시 이후면 좋겠어요.","trans":{"en":"Is tomorrow morning possible? After 10 AM would be good.","de":"Ist morgen Vormittag möglich? Nach 10 Uhr wäre gut.","fr":"Est-ce possible demain matin? Après 10h du matin serait bien.","es":"¿Es posible mañana por la mañana? Después de las 10 am sería bien.","pl":"Czy jutro rano jest możliwe? Po godzinie 10 rano byłoby dobrze.","it":"È possibile domani mattina? Dopo le 10 del mattino andrebbe bene.","sv":"Är det möjligt imorgon morgon? Efter klockan 10 på morgonen vore bra.","fi":"Onko huomenna aamulla mahdollista? Klo 10 jälkeen aamupäivällä olisi hyvä.","ja":"明日の午前中は可能ですか？午前10時以降だといいです。","zh-CN":"明天上午可以吗？上午10点之后比较好。"}},{"speaker":"지민","text":"네, 그렇게 할게요. 혹시 다른 문제는 없어요?","trans":{"en":"Yes, I'll do that. Are there any other problems?","de":"Ja, das mache ich. Gibt es noch andere Probleme?","fr":"Oui, je ferai ça. Y a-t-il d'autres problèmes?","es":"Sí, lo haré así. ¿Hay otros problemas?","pl":"Tak, tak zrobię. Czy są inne problemy?","it":"Sì, farò così. Ci sono altri problemi?","sv":"Ja, det gör jag. Finns det några andra problem?","fi":"Kyllä, teen niin. Onko muita ongelmia?","ja":"はい、そうします。他に何か問題はありますか？","zh-CN":"好的，就这样安排。还有其他问题吗？"}},{"speaker":"현우","text":"화장실 환기가 잘 안 되는 것 같아요. 냄새가 좀 나서요.","trans":{"en":"The bathroom ventilation doesn't seem to work well. There's a bit of a smell.","de":"Die Badezimmerbelüftung scheint nicht gut zu funktionieren. Es riecht etwas.","fr":"La ventilation de la salle de bain ne semble pas bien fonctionner. Il y a une légère odeur.","es":"La ventilación del baño no parece funcionar bien. Hay un poco de olor.","pl":"Wentylacja w łazience chyba nie działa dobrze. Trochę śmierdzi.","it":"La ventilazione del bagno non sembra funzionare bene. C'è un po' di odore.","sv":"Badrummets ventilation verkar inte fungera bra. Det luktar lite.","fi":"Kylpyhuoneen ilmanvaihto ei taida toimia hyvin. Siellä on hieman hajua.","ja":"トイレの換気がうまくいっていないようです。少し臭いがして。","zh-CN":"卫生间好像通风不太好。有点异味。"}},{"speaker":"지민","text":"그것도 같이 확인해 드릴게요. 불편하셨겠어요. 빨리 처리하도록 하겠습니다.","trans":{"en":"I'll check that too. That must have been inconvenient. I'll take care of it quickly.","de":"Das überprüfe ich auch. Das muss unangenehm gewesen sein. Ich werde mich darum schnell kümmern.","fr":"Je vérifierai ça aussi. Vous avez dû être gêné. Je m'en occuperai rapidement.","es":"También lo verificaré. Debe haber sido incómodo. Me encargaré de ello rápidamente.","pl":"Sprawdzę to też. To musiało być niekomfortowe. Zajmę się tym szybko.","it":"Controllerò anche quello. Dev'essere stato scomodo. Me ne occuperò velocemente.","sv":"Jag kontrollerar det också. Det måste ha varit obekvämt. Jag tar hand om det snabbt.","fi":"Tarkistan senkin. Se on täytynyt olla epämukavaa. Huolehdin siitä nopeasti.","ja":"それも一緒に確認しますね。ご不便をおかけしました。早急に対応します。","zh-CN":"也一起确认一下。给您带来不便了。我会尽快处理的。"}}],"vocab":[{"word":"수도꼭지","trans":{"en":"faucet/tap","de":"Wasserhahn","fr":"robinet","es":"grifo","pl":"kran","it":"rubinetto","sv":"kran","fi":"hana","ja":"蛇口","zh-CN":"水龙头"}},{"word":"새다","trans":{"en":"to leak","de":"lecken/tropfen","fr":"fuir/couler","es":"gotear/fugar","pl":"przeciekać","it":"perdere/gocciolare","sv":"läcka","fi":"vuotaa","ja":"漏れる","zh-CN":"漏水/渗漏"}},{"word":"수도세","trans":{"en":"water bill","de":"Wasserrechnung","fr":"facture d'eau","es":"factura del agua","pl":"rachunek za wodę","it":"bolletta dell'acqua","sv":"vattenfaktura","fi":"vesilasku","ja":"水道代","zh-CN":"水费"}},{"word":"수리기사","trans":{"en":"repairman/technician","de":"Reparateur/Techniker","fr":"réparateur/technicien","es":"técnico/reparador","pl":"technik/pracownik serwisu","it":"tecnico/riparatore","sv":"reparatör/tekniker","fi":"korjaaja/asentaja","ja":"修理業者","zh-CN":"维修工"}},{"word":"환기","trans":{"en":"ventilation","de":"Belüftung","fr":"ventilation","es":"ventilación","pl":"wentylacja","it":"ventilazione","sv":"ventilation","fi":"ilmanvaihto","ja":"換気","zh-CN":"通风"}},{"word":"신고하다","trans":{"en":"to report","de":"melden","fr":"signaler","es":"reportar","pl":"zgłaszać","it":"segnalare","sv":"rapportera","fi":"ilmoittaa","ja":"申告する/報告する","zh-CN":"报告/申报"}},{"word":"처리하다","trans":{"en":"to handle/deal with","de":"behandeln/erledigen","fr":"traiter/gérer","es":"manejar/tratar","pl":"rozwiązać/załatwić","it":"gestire/trattare","sv":"hantera","fi":"käsitellä/hoitaa","ja":"処理する","zh-CN":"处理"}}],"patterns":[{"pattern":"~에서 ~가 새고 있어요","patternTrans":{"en":"~ is leaking from ~","de":"~ leckt aus ~","fr":"~ fuit de ~","es":"~ está goteando de ~","pl":"~ przecieka z ~","it":"~ perde da ~","sv":"~ läcker från ~","fi":"~ vuotaa ~","ja":"〜から〜が漏れています","zh-CN":"〜正在从〜漏"},"example":"부엌 수도꼭지에서 물이 새고 있어요.","trans":{"en":"The kitchen faucet is leaking water.","de":"Der Küchenhahn leckt Wasser.","fr":"Le robinet de la cuisine fuit de l'eau.","es":"El grifo de la cocina está goteando agua.","pl":"Kran w kuchni przecieka wodę.","it":"Il rubinetto della cucina perde acqua.","sv":"Köksekranen läcker vatten.","fi":"Keittiön hana vuotaa vettä.","ja":"台所の蛇口から水が漏れています。","zh-CN":"厨房的水龙头在漏水。"}},{"pattern":"~이/가 잘 안 되는 것 같아요","patternTrans":{"en":"It seems like ~ doesn't work well","de":"Es scheint, als ob ~ nicht gut funktioniert","fr":"Il semble que ~ ne fonctionne pas bien","es":"Parece que ~ no funciona bien","pl":"Wydaje się, że ~ nie działa dobrze","it":"Sembra che ~ non funzioni bene","sv":"Det verkar som att ~ inte fungerar bra","fi":"Tuntuu kuin ~ ei toimisi hyvin","ja":"〜がうまくいっていないようです","zh-CN":"〜好像不太好使"},"example":"화장실 환기가 잘 안 되는 것 같아요.","trans":{"en":"It seems like the bathroom ventilation doesn't work well.","de":"Es scheint, als ob die Badezimmerbelüftung nicht gut funktioniert.","fr":"Il semble que la ventilation de la salle de bain ne fonctionne pas bien.","es":"Parece que la ventilación del baño no funciona bien.","pl":"Wydaje się, że wentylacja w łazience nie działa dobrze.","it":"Sembra che la ventilazione del bagno non funzioni bene.","sv":"Det verkar som att badrummets ventilation inte fungerar bra.","fi":"Tuntuu kuin kylpyhuoneen ilmanvaihto ei toimisi hyvin.","ja":"トイレの換気がうまくいっていないようです。","zh-CN":"卫生间好像通风不太好。"}},{"pattern":"~도록 하겠습니다","patternTrans":{"en":"I will make sure to ~","de":"Ich werde dafür sorgen, dass ~","fr":"Je ferai en sorte de ~","es":"Me aseguraré de ~","pl":"Postaram się, żeby ~","it":"Farò in modo di ~","sv":"Jag ser till att ~","fi":"Varmistan, että ~","ja":"〜するようにします","zh-CN":"我会确保〜"},"example":"빨리 처리하도록 하겠습니다.","trans":{"en":"I will make sure to handle it quickly.","de":"Ich werde dafür sorgen, dass es schnell erledigt wird.","fr":"Je ferai en sorte que ce soit traité rapidement.","es":"Me aseguraré de manejarlo rápidamente.","pl":"Postaram się, żeby to szybko załatwić.","it":"Farò in modo di gestirlo velocemente.","sv":"Jag ser till att det hanteras snabbt.","fi":"Varmistan, että se käsitellään nopeasti.","ja":"早急に対応するようにします。","zh-CN":"我会尽快处理的。"}}],"quizzes":[{"type":"이해","questionAudio":"현우가 집주인에게 신고한 첫 번째 문제는 무엇입니까?","questionTrans":{"en":"What is the first problem Hyunwoo reported to the landlord?","de":"Was ist das erste Problem, das Hyunwoo dem Vermieter gemeldet hat?","fr":"Quel est le premier problème signalé par Hyunwoo au propriétaire?","es":"¿Cuál es el primer problema que Hyunwoo reportó al propietario?","pl":"Jaki jest pierwszy problem, który Hyunwoo zgłosił właścicielowi?","it":"Qual è il primo problema che Hyunwoo ha segnalato al proprietario?","sv":"Vilket är det första problemet Hyunwoo rapporterade till hyresvärden?","fi":"Mikä on ensimmäinen ongelma, jonka Hyunwoo ilmoitti vuokranantajalle?","ja":"ヒョヌが家主に報告した最初の問題は何ですか？","zh-CN":"贤宇向房东报告的第一个问题是什么？"},"options":[{"text":"화장실 환기 문제","trans":{"en":"Bathroom ventilation problem","de":"Badezimmerbelüftungsproblem","fr":"Problème de ventilation de la salle de bain","es":"Problema de ventilación del baño","pl":"Problem z wentylacją łazienki","it":"Problema di ventilazione del bagno","sv":"Problem med badrummets ventilation","fi":"Kylpyhuoneen ilmanvaihto-ongelma","ja":"トイレの換気問題","zh-CN":"卫生间通风问题"}},{"text":"부엌 수도꼭지 누수","trans":{"en":"Kitchen faucet leaking","de":"Küchenhahn leckt","fr":"Fuite du robinet de cuisine","es":"Grifo de cocina goteando","pl":"Przeciekający kran w kuchni","it":"Rubinetto della cucina che perde","sv":"Köksekran som läcker","fi":"Keittiön hanan vuoto","ja":"台所の蛇口の水漏れ","zh-CN":"厨房水龙头漏水"}},{"text":"창문이 잘 안 닫힘","trans":{"en":"Window doesn't close well","de":"Fenster schließt nicht gut","fr":"La fenêtre ne se ferme pas bien","es":"La ventana no cierra bien","pl":"Okno nie zamyka się dobrze","it":"La finestra non si chiude bene","sv":"Fönstret stängs inte bra","fi":"Ikkuna ei sulkeudu kunnolla","ja":"窓が閉まらない","zh-CN":"窗户关不好"}},{"text":"보일러 고장","trans":{"en":"Boiler broken","de":"Boiler defekt","fr":"Chaudière en panne","es":"Caldera averiada","pl":"Awaria bojlera","it":"Caldaia guasta","sv":"Pannkrasch","fi":"Kattila rikki","ja":"ボイラーの故障","zh-CN":"锅炉故障"}}],"answer":1,"explanation":"현우는 '부엌 수도꼭지에서 물이 새고 있어요'라고 첫 번째로 신고했습니다."},{"type":"이해","questionAudio":"수리기사는 언제 오기로 했습니까?","questionTrans":{"en":"When was the repairman scheduled to come?","de":"Wann sollte der Reparateur kommen?","fr":"Quand le réparateur devait-il venir?","es":"¿Cuándo estaba programado que viniera el técnico?","pl":"Kiedy miał przyjść technik?","it":"Quando era previsto che venisse il tecnico?","sv":"När var reparatören inplanerad att komma?","fi":"Milloin korjaajan oli tarkoitus tulla?","ja":"修理業者はいつ来ることになりましたか？","zh-CN":"维修工什么时候来？"},"options":[{"text":"오늘 오후","trans":{"en":"This afternoon","de":"Heute Nachmittag","fr":"Cet après-midi","es":"Esta tarde","pl":"Dzisiaj po południu","it":"Questo pomeriggio","sv":"I eftermiddag","fi":"Tänään iltapäivällä","ja":"今日の午後","zh-CN":"今天下午"}},{"text":"내일 오전 10시 이후","trans":{"en":"Tomorrow after 10 AM","de":"Morgen nach 10 Uhr","fr":"Demain après 10h","es":"Mañana después de las 10 AM","pl":"Jutro po godzinie 10","it":"Domani dopo le 10 del mattino","sv":"Imorgon efter klockan 10","fi":"Huomenna klo 10 jälkeen","ja":"明日の午前10時以降","zh-CN":"明天上午10点以后"}},{"text":"다음 주","trans":{"en":"Next week","de":"Nächste Woche","fr":"La semaine prochaine","es":"La próxima semana","pl":"W przyszłym tygodniu","it":"La prossima settimana","sv":"Nästa vecka","fi":"Ensi viikolla","ja":"来週","zh-CN":"下周"}},{"text":"오늘 저녁","trans":{"en":"This evening","de":"Heute Abend","fr":"Ce soir","es":"Esta noche","pl":"Dzisiaj wieczorem","it":"Stasera","sv":"I kväll","fi":"Tänään illalla","ja":"今日の夜","zh-CN":"今天晚上"}}],"answer":1,"explanation":"현우가 '내일 오전에 가능할까요? 오전 10시 이후면 좋겠어요'라고 했고, 지민이 동의했습니다."},{"type":"이해","questionAudio":"현우가 신고한 두 번째 문제는 무엇입니까?","questionTrans":{"en":"What is the second problem Hyunwoo reported?","de":"Was ist das zweite Problem, das Hyunwoo gemeldet hat?","fr":"Quel est le deuxième problème signalé par Hyunwoo?","es":"¿Cuál es el segundo problema que Hyunwoo reportó?","pl":"Jaki jest drugi problem zgłoszony przez Hyunwoo?","it":"Qual è il secondo problema segnalato da Hyunwoo?","sv":"Vilket är det andra problemet Hyunwoo rapporterade?","fi":"Mikä on toinen ongelma, jonka Hyunwoo ilmoitti?","ja":"ヒョヌが報告した2番目の問題は何ですか？","zh-CN":"贤宇报告的第二个问题是什么？"},"options":[{"text":"화장실 환기가 잘   11: {"id":11,"title":"숙소 예약","titleTrans":{"en":"Accommodation Booking","de":"Unterkunftsbuchung","fr":"Réservation d'hébergement","es":"Reserva de alojamiento","pl":"Rezerwacja noclegu","it":"Prenotazione alloggio","sv":"Bokning av boende","fi":"Majoitusvaraus","ja":"宿泊予約","zh-CN":"住宿预订"},"desc":"호텔이나 게스트하우스를 예약하고 체크인하는 과정을 배웁니다.","descTrans":{"en":"Learn how to book a hotel or guesthouse and check in.","de":"Lernen Sie, wie man ein Hotel oder eine Pension bucht und eincheckt.","fr":"Apprenez à réserver un hôtel ou une maison d'hôtes et à vous enregistrer.","es":"Aprende cómo reservar un hotel o pensión y hacer el check-in.","pl":"Dowiedz się, jak zarezerwować hotel lub pensjonat i zameldować się.","it":"Impara come prenotare un hotel o una pensione ed effettuare il check-in.","sv":"Lär dig hur du bokar ett hotell eller gästhus och checkar in.","fi":"Opi varaamaan hotelli tai majatalo ja kirjautumaan sisään.","ja":"ホテルやゲストハウスの予約とチェックインの方法を学びます。","zh-CN":"学习如何预订酒店或民宿并办理入住手续。"},"dialogue":[{"speaker":"지민","text":"안녕하세요. 이번 주말에 방을 예약하고 싶은데요.","trans":{"en":"Hello. I'd like to book a room for this weekend.","de":"Hallo. Ich möchte für dieses Wochenende ein Zimmer buchen.","fr":"Bonjour. Je voudrais réserver une chambre pour ce week-end.","es":"Hola. Me gustaría reservar una habitación para este fin de semana.","pl":"Dzień dobry. Chciałbym zarezerwować pokój na ten weekend.","it":"Buongiorno. Vorrei prenotare una camera per questo fine settimana.","sv":"Hej. Jag vill boka ett rum för den här helgen.","fi":"Hei. Haluaisin varata huoneen täksi viikonlopuksi.","ja":"こんにちは。今週末に部屋を予約したいんですが。","zh-CN":"您好，我想预订这个周末的房间。"}},{"speaker":"수미","text":"네, 어떤 방을 원하세요? 1인실과 2인실이 있습니다.","trans":{"en":"Sure, what type of room do you want? We have single and double rooms.","de":"Natürlich, welche Art von Zimmer möchten Sie? Wir haben Einzel- und Doppelzimmer.","fr":"Bien sûr, quel type de chambre souhaitez-vous? Nous avons des chambres simples et doubles.","es":"Claro, ¿qué tipo de habitación desea? Tenemos habitaciones individuales y dobles.","pl":"Oczywiście, jaki rodzaj pokoju Pan/Pani chce? Mamy pokoje jednoosobowe i dwuosobowe.","it":"Certo, che tipo di camera desidera? Abbiamo camere singole e doppie.","sv":"Visst, vilken typ av rum vill du ha? Vi har enkelrum och dubbelrum.","fi":"Toki, millaisen huoneen haluat? Meillä on yhden hengen huoneita ja kahden hengen huoneita.","ja":"はい、どんなお部屋をご希望ですか？シングルルームとダブルルームがございます。","zh-CN":"好的，您想要什么类型的房间？我们有单人间和双人间。"}},{"speaker":"지민","text":"1인실로 부탁드립니다. 하룻밤에 얼마예요?","trans":{"en":"A single room, please. How much is it per night?","de":"Ein Einzelzimmer bitte. Wie viel kostet eine Nacht?","fr":"Une chambre simple, s'il vous plaît. Combien coûte une nuit?","es":"Una habitación individual, por favor. ¿Cuánto cuesta por noche?","pl":"Proszę o pokój jednoosobowy. Ile kosztuje jedna noc?","it":"Una singola, per favore. Quanto costa per notte?","sv":"Ett enkelrum tack. Hur mycket kostar det per natt?","fi":"Yhden hengen huone, kiitos. Paljonko se maksaa yöltä?","ja":"シングルルームでお願いします。一泊いくらですか？","zh-CN":"请给我单人间。每晚多少钱？"}},{"speaker":"수미","text":"1인실은 하룻밤에 8만 원입니다. 조식도 포함되어 있어요.","trans":{"en":"A single room is 80,000 won per night. Breakfast is included.","de":"Ein Einzelzimmer kostet 80.000 Won pro Nacht. Frühstück ist inbegriffen.","fr":"Une chambre simple coûte 80 000 won par nuit. Le petit-déjeuner est inclus.","es":"Una habitación individual cuesta 80,000 won por noche. El desayuno está incluido.","pl":"Pokój jednoosobowy kosztuje 80 000 wonów za noc. Śniadanie jest wliczone.","it":"Una singola costa 80.000 won per notte. La colazione è inclusa.","sv":"Ett enkelrum kostar 80 000 won per natt. Frukost ingår.","fi":"Yhden hengen huone maksaa 80 000 wonia yöltä. Aamiainen sisältyy hintaan.","ja":"シングルルームは一泊8万ウォンです。朝食も含まれています。","zh-CN":"单人间每晚8万韩元，包含早餐。"}},{"speaker":"지민","text":"좋아요. 토요일부터 일요일까지 예약할게요.","trans":{"en":"Great. I'll book from Saturday to Sunday.","de":"Gut. Ich buche von Samstag bis Sonntag.","fr":"Parfait. Je vais réserver du samedi au dimanche.","es":"Perfecto. Reservaré del sábado al domingo.","pl":"Świetnie. Zarezerwuję od soboty do niedzieli.","it":"Perfetto. Prenoto da sabato a domenica.","sv":"Bra. Jag bokar från lördag till söndag.","fi":"Hyvä. Varaan lauantaista sunnuntaihin.","ja":"いいですね。土曜日から日曜日まで予約します。","zh-CN":"好的，我预订从周六到周日。"}},{"speaker":"수미","text":"성함과 연락처를 알려주시겠어요?","trans":{"en":"Could you give me your name and contact information?","de":"Könnten Sie mir Ihren Namen und Ihre Kontaktdaten geben?","fr":"Pourriez-vous me donner votre nom et vos coordonnées?","es":"¿Podría darme su nombre y datos de contacto?","pl":"Czy może mi Pan/Pani podać swoje imię i dane kontaktowe?","it":"Potrebbe darmi il suo nome e i suoi recapiti?","sv":"Kan du ge mig ditt namn och kontaktuppgifter?","fi":"Voisitko antaa nimesi ja yhteystietosi?","ja":"お名前と連絡先を教えていただけますか？","zh-CN":"请问您的姓名和联系方式？"}},{"speaker":"지민","text":"김지민이고요, 전화번호는 010-1234-5678이에요.","trans":{"en":"I'm Kim Jimin, and my phone number is 010-1234-5678.","de":"Ich bin Kim Jimin und meine Telefonnummer ist 010-1234-5678.","fr":"Je suis Kim Jimin et mon numéro de téléphone est le 010-1234-5678.","es":"Soy Kim Jimin y mi número de teléfono es 010-1234-5678.","pl":"Jestem Kim Jimin, a mój numer telefonu to 010-1234-5678.","it":"Sono Kim Jimin e il mio numero di telefono è 010-1234-5678.","sv":"Jag heter Kim Jimin och mitt telefonnummer är 010-1234-5678.","fi":"Olen Kim Jimin ja puhelinnumeroni on 010-1234-5678.","ja":"キム・ジミンです。電話番号は010-1234-5678です。","zh-CN":"我叫金智敏，电话号码是010-1234-5678。"}},{"speaker":"수미","text":"예약이 완료되었습니다. 체크인은 오후 3시부터 가능합니다.","trans":{"en":"Your reservation is complete. Check-in is available from 3 PM.","de":"Ihre Reservierung ist abgeschlossen. Der Check-in ist ab 15 Uhr möglich.","fr":"Votre réservation est terminée. L'enregistrement est possible à partir de 15h.","es":"Su reserva está completa. El check-in está disponible a partir de las 3 PM.","pl":"Rezerwacja jest zakończona. Zameldowanie możliwe od godziny 15:00.","it":"La sua prenotazione è completata. Il check-in è disponibile dalle 15:00.","sv":"Din bokning är klar. Incheckning är möjlig från kl. 15.00.","fi":"Varauksesi on valmis. Sisäänkirjautuminen on mahdollista klo 15 alkaen.","ja":"ご予約が完了しました。チェックインは午後3時からとなります。","zh-CN":"预订已完成。下午3点起可以办理入住。"}},{"speaker":"지민","text":"알겠습니다. 늦게 도착할 수도 있는데 괜찮을까요?","trans":{"en":"I see. I might arrive late — is that okay?","de":"Ich verstehe. Ich könnte spät ankommen — ist das in Ordnung?","fr":"Je vois. Il se peut que j'arrive tard — est-ce que c'est bon?","es":"Entiendo. Puede que llegue tarde, ¿está bien?","pl":"Rozumiem. Mogę przybyć późno — czy to w porządku?","it":"Capisco. Potrei arrivare tardi — va bene?","sv":"Jag förstår. Jag kanske anländer sent — är det okej?","fi":"Ymmärrän. Saatan saapua myöhään — onko se okei?","ja":"わかりました。遅く到着するかもしれませんが大丈夫ですか？","zh-CN":"明白了。我可能会晚到，没问题吗？"}},{"speaker":"수미","text":"네, 프런트는 24시간 운영하니까 언제든지 오셔도 됩니다.","trans":{"en":"Yes, the front desk operates 24 hours, so you can come anytime.","de":"Ja, die Rezeption ist rund um die Uhr geöffnet, Sie können jederzeit kommen.","fr":"Oui, la réception fonctionne 24 heures sur 24, vous pouvez donc venir à tout moment.","es":"Sí, la recepción funciona las 24 horas, así que puede venir en cualquier momento.","pl":"Tak, recepcja działa całą dobę, więc może Pan/Pani przyjść o każdej porze.","it":"Sì, la reception è operativa 24 ore su 24, quindi può venire in qualsiasi momento.","sv":"Ja, receptionen är öppen dygnet runt, så du kan komma när som helst.","fi":"Kyllä, vastaanotto on auki 24 tuntia, joten voit tulla milloin tahansa.","ja":"はい、フロントは24時間営業ですので、いつでもどうぞ。","zh-CN":"是的，前台24小时运营，您随时都可以来。"}}],"vocab":[{"word":"예약","trans":{"en":"reservation/booking","de":"Reservierung","fr":"réservation","es":"reserva","pl":"rezerwacja","it":"prenotazione","sv":"bokning","fi":"varaus","ja":"予約","zh-CN":"预订"}},{"word":"체크인","trans":{"en":"check-in","de":"Einchecken","fr":"enregistrement","es":"
