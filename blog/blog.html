?","pl":"Ile kosztuje pierwsza konsultacja z trenerem?","it":"Quanto costa la prima consulenza con il trainer?","sv":"Hur mycket kostar den första tränarkonsultationen?","fi":"Paljonko ensimmäinen valmentajakonsultointi maksaa?","ja":"トレーナーの最初の相談費用はいくらですか？","zh-CN":"教练第一次咨询费用是多少？"},"options":[{"text":"무료이다","trans":{"en":"It is free","de":"Es ist kostenlos","fr":"C'est gratuit","es":"Es gratis","pl":"Jest bezpłatna","it":"È gratuita","sv":"Det är gratis","fi":"Se on ilmainen","ja":"無料だ","zh-CN":"是免费的"}},{"text":"월 회비에 포함된다","trans":{"en":"It is included in the monthly fee","de":"Es ist in der Monatsgebühr enthalten","fr":"Il est inclus dans la cotisation mensuelle","es":"Está incluido en la cuota mensual","pl":"Jest wliczona w miesięczną opłatę","it":"È inclusa nella quota mensile","sv":"Det ingår i månadsavgiften","fi":"Se sisältyy kuukausimaksuun","ja":"月会費に含まれている","zh-CN":"包含在月费中"}},{"text":"PT 수업과 같은 가격이다","trans":{"en":"It costs the same as PT classes","de":"Es kostet genauso viel wie PT-Kurse","fr":"Ça coûte le même prix que les cours de PT","es":"Cuesta lo mismo que las clases de PT","pl":"Kosztuje tyle samo co zajęcia PT","it":"Costa quanto le lezioni di PT","sv":"Det kostar lika mycket som PT-lektioner","fi":"Se maksaa saman kuin PT-tunnit","ja":"PTレッスンと同じ値段だ","zh-CN":"和PT课程价格一样"}},{"text":"할인이 적용된다","trans":{"en":"A discount is applied","de":"Ein Rabatt wird angewendet","fr":"Une réduction est appliquée","es":"Se aplica un descuento","pl":"Stosowana jest zniżka","it":"Viene applicato uno sconto","sv":"En rabatt tillämpas","fi":"Alennus sovelletaan","ja":"割引が適用される","zh-CN":"享有折扣"}}],"answer":0,"explanation":"수미는 첫 번째 상담은 무료라고 했습니다."}]},
  17: {"id":17,"title":"요리와 레시피","titleTrans":{"en":"Cooking and Recipes","de":"Kochen und Rezepte","fr":"Cuisine et recettes","es":"Cocina y recetas","pl":"Gotowanie i przepisy","it":"Cucina e ricette","sv":"Matlagning och recept","fi":"Ruoanlaitto ja reseptit","ja":"料理とレシピ","zh-CN":"烹饪与食谱"},"desc":"요리 방법을 물어보고 알려주는 대화입니다.","descTrans":{"en":"A conversation about asking for and sharing cooking methods.","de":"Ein Gespräch über das Fragen und Mitteilen von Kochmethoden.","fr":"Une conversation sur la demande et le partage de méthodes de cuisine.","es":"Una conversación sobre preguntar y compartir métodos de cocina.","pl":"Rozmowa o pytaniu i dzieleniu się metodami gotowania.","it":"Una conversazione sul chiedere e condividere metodi di cucina.","sv":"En konversation om att fråga om och dela matlagningsmetoder.","fi":"Keskustelu ruoanlaittomenetelmien kysymisestä ja jakamisesta.","ja":"料理方法を聞いたり教えたりする会話です。","zh-CN":"关于询问和分享烹饪方法的对话。"},"dialogue":[{"speaker":"민준","text":"지수야, 네가 만든 김치찌개 정말 맛있었어. 어떻게 만드는 거야?","trans":{"en":"Jisu, the kimchi jjigae you made was really delicious. How do you make it?","de":"Jisu, der Kimchi-Eintopf, den du gemacht hast, war wirklich lecker. Wie macht man das?","fr":"Jisu, le kimchi jjigae que tu as fait était vraiment délicieux. Comment tu le fais ?","es":"Jisu, el kimchi jjigae que hiciste estaba realmente delicioso. ¿Cómo lo haces?","pl":"Jisu, kimchi jjigae, które zrobiłaś, było naprawdę pyszne. Jak się to robi?","it":"Jisu, il kimchi jjigae che hai fatto era davvero delizioso. Come lo si fa?","sv":"Jisu, kimchi jjigaen du lagade var verkligen utsökt. Hur gör man det?","fi":"Jisu, kimchi jjigae jonka teit oli todella herkullinen. Miten sen tehdään?","ja":"ジス、君が作ったキムチチゲ本当においしかったよ。どうやって作るの？","zh-CN":"智秀，你做的泡菜汤真的很好吃。怎么做的？"}},{"speaker":"지수","text":"어, 생각보다 간단해. 먼저 돼지고기를 볶다가 묵은 김치를 넣어.","trans":{"en":"Oh, it's simpler than you think. First, stir-fry the pork and then add aged kimchi.","de":"Oh, es ist einfacher als du denkst. Zuerst das Schweinefleisch anbraten, dann das fermentierte Kimchi hinzufügen.","fr":"Oh, c'est plus simple que tu ne le penses. D'abord, faire revenir le porc puis ajouter le kimchi fermenté.","es":"Oh, es más sencillo de lo que crees. Primero, saltear el cerdo y luego agregar el kimchi fermentado.","pl":"Och, to prostsze niż myślisz. Najpierw podsmaż wieprzowinę, potem dodaj dojrzałe kimchi.","it":"Oh, è più semplice di quanto pensi. Prima rosola la carne di maiale, poi aggiungi il kimchi fermentato.","sv":"Åh, det är enklare än du tror. Stek först fläskköttet och lägg sedan till det fermenterade kimchin.","fi":"Oi, se on yksinkertaisempaa kuin luulet. Ensin paista sianliha ja lisää sitten kypsä kimchi.","ja":"あ、思ったより簡単だよ。まず豚肉を炒めてから古いキムチを入れるんだ。","zh-CN":"哦，比你想的简单。先把猪肉炒一下，然后放入老泡菜。"}},{"speaker":"민준","text":"그다음에는 어떻게 해? 물은 얼마나 넣어?","trans":{"en":"What do you do next? How much water do you add?","de":"Was machst du dann? Wie viel Wasser gibst du dazu?","fr":"Qu'est-ce que tu fais ensuite ? Combien d'eau tu ajoutes ?","es":"¿Qué haces después? ¿Cuánta agua añades?","pl":"Co robisz potem? Ile wody dodajesz?","it":"Cosa fai dopo? Quanta acqua aggiungi?","sv":"Vad gör du sedan? Hur mycket vatten tillsätter du?","fi":"Mitä teet sitten? Kuinka paljon vettä lisäät?","ja":"次はどうするの？水はどのくらい入れるの？","zh-CN":"接下来怎么做？放多少水？"}},{"speaker":"지수","text":"물을 한 컵 반 정도 넣고 두부도 넣어. 그다음 중간 불에서 15분쯤 끓여.","trans":{"en":"Add about one and a half cups of water and also add tofu. Then boil on medium heat for about 15 minutes.","de":"Gib etwa eineinhalb Tassen Wasser und auch Tofu hinein. Dann koche es auf mittlerer Hitze für etwa 15 Minuten.","fr":"Ajoute environ une tasse et demie d'eau et aussi du tofu. Ensuite, fais bouillir à feu moyen pendant environ 15 minutes.","es":"Agrega aproximadamente una taza y media de agua y también tofu. Luego hierve a fuego medio durante unos 15 minutos.","pl":"Dodaj około półtorej szklanki wody i tofu. Potem gotuj na średnim ogniu przez około 15 minut.","it":"Aggiungi circa una tazza e mezza di acqua e anche il tofu. Poi fai bollire a fuoco medio per circa 15 minuti.","sv":"Tillsätt ungefär en och en halv kopp vatten och tofu också. Koka sedan på medelvärme i ungefär 15 minuter.","fi":"Lisää noin puolitoista kupillista vettä ja myös tofu. Keitä sitten keskilämmöllä noin 15 minuuttia.","ja":"水をカップ一杯半くらい入れて豆腐も入れるんだ。そして中火で15分くらい煮込むよ。","zh-CN":"放一杯半左右的水，再放豆腐。然后中火煮大约15分钟。"}},{"speaker":"민준","text":"간은 어떻게 맞춰? 소금을 넣어?","trans":{"en":"How do you season it? Do you add salt?","de":"Wie würzt du es? Gibst du Salz hinein?","fr":"Comment tu l'assaisonnes ? Tu ajoutes du sel ?","es":"¿Cómo lo sazonas? ¿Añades sal?","pl":"Jak przyprawiasz? Dodajesz sól?","it":"Come lo condisci? Aggiungi sale?","sv":"Hur smaksätter du det? Tillsätter du salt?","fi":"Miten maustat sen? Lisäätkö suolaa?","ja":"味付けはどうするの？塩を入れるの？","zh-CN":"怎么调味？放盐吗？"}},{"speaker":"지수","text":"소금 대신 새우젓이나 국간장으로 간을 맞춰. 마지막에 파를 넣으면 완성이야.","trans":{"en":"Season with fermented shrimp or soup soy sauce instead of salt. It's done when you add green onions at the end.","de":"Würze mit fermentierten Garnelen oder Suppensojasauce statt Salz. Es ist fertig, wenn du am Ende Frühlingszwiebeln hinzugibst.","fr":"Assaisonne avec des crevettes fermentées ou de la sauce soja pour soupe au lieu du sel. C'est terminé quand tu ajoutes des oignons verts à la fin.","es":"Sazona con camarones fermentados o salsa de soja para sopa en lugar de sal. Está listo cuando añades cebolletas al final.","pl":"Dopraw krewetkami fermentowanymi lub sosem sojowym do zup zamiast soli. Jest gotowe, gdy na końcu dodasz dymkę.","it":"Condisci con gamberetti fermentati o salsa di soia per zuppa invece del sale. È pronto quando aggiungi le cipolle verdi alla fine.","sv":"Smaksätt med fermenterade räkor eller soppsojasås istället för salt. Det är klart när du lägger till salladslök i slutet.","fi":"Mausta fermentoiduilla katkaravuilla tai keitossoijakastikkeella suolan sijaan. Se on valmis kun lisäät kevätsipulin lopussa.","ja":"塩の代わりに塩辛かスープしょうゆで味付けするんだ。最後にネギを入れたら完成だよ。","zh-CN":"用腌虾或汤用酱油代替盐来调味。最后放葱就完成了。"}},{"speaker":"민준","text":"생각보다 재료가 간단하네. 나도 도전해 봐야겠다!","trans":{"en":"The ingredients are simpler than I thought. I should give it a try!","de":"Die Zutaten sind einfacher als ich dachte. Ich sollte es versuchen!","fr":"Les ingrédients sont plus simples que je ne pensais. Je devrais essayer !","es":"Los ingredientes son más simples de lo que pensé. ¡Debería intentarlo!","pl":"Składniki są prostsze niż myślałem. Powinienem spróbować!","it":"Gli ingredienti sono più semplici di quanto pensassi. Dovrei provarlo!","sv":"Ingredienserna är enklare än jag trodde. Jag borde prova det!","fi":"Ainekset ovat yksinkertaisemmat kuin luulin. Minun pitäisi kokeilla!","ja":"思ったより材料がシンプルだね。私も挑戦してみなきゃ！","zh-CN":"食材比我想的简单。我也应该尝试一下！"}},{"speaker":"지수","text":"맞아, 어렵지 않아. 처음에 실패해도 괜찮아, 몇 번 해보면 금방 늘어.","trans":{"en":"Right, it's not difficult. It's okay to fail at first; you'll get better quickly after trying a few times.","de":"Richtig, es ist nicht schwer. Es ist okay, am Anfang zu scheitern; du wirst schnell besser, wenn du es ein paar Mal versuchst.","fr":"C'est vrai, ce n'est pas difficile. C'est normal d'échouer au début ; tu t'amélioreras rapidement après quelques essais.","es":"Cierto, no es difícil. Está bien fallar al principio; mejorarás rápidamente después de intentarlo varias veces.","pl":"Racja, to nie jest trudne. To normalne, że na początku popełniasz błędy; szybko się poprawisz po kilku próbach.","it":"Esatto, non è difficile. Va bene fallire all'inizio; migliorerai rapidamente dopo qualche tentativo.","sv":"Rätt, det är inte svårt. Det är okej att misslyckas i början; du blir bättre snabbt efter att ha provat några gånger.","fi":"Aivan, se ei ole vaikeaa. On ok epäonnistua aluksi; parannet nopeasti muutaman kokeilun jälkeen.","ja":"そう、難しくないよ。最初は失敗しても大丈夫、何回かやれば金方上達するよ。","zh-CN":"对，不难的。一开始失败也没关系，试几次就会很快进步的。"}},{"speaker":"민준","text":"고마워! 혹시 다른 쉬운 한국 음식도 알려줄 수 있어?","trans":{"en":"Thanks! Can you also tell me about other easy Korean foods?","de":"Danke! Kannst du mir auch von anderen einfachen koreanischen Gerichten erzählen?","fr":"Merci ! Peux-tu me parler d'autres plats coréens faciles ?","es":"¡Gracias! ¿Puedes contarme sobre otras comidas coreanas fáciles?","pl":"Dzięki! Czy możesz mi też powiedzieć o innych łatwych koreańskich potrawach?","it":"Grazie! Puoi anche dirmi di altri cibi coreani facili?","sv":"Tack! Kan du berätta om andra enkla koreanska maträtter?","fi":"Kiitos! Voitko myös kertoa muista helposta korealaisesta ruoasta?","ja":"ありがとう！他に簡単な韓国料理も教えてくれる？","zh-CN":"谢谢！你能告诉我其他简单的韩国料理吗？"}},{"speaker":"지수","text":"물론이지! 다음에 계란말이나 된장국 만드는 법도 가르쳐 줄게.","trans":{"en":"Of course! Next time I'll teach you how to make gyeran mari or doenjang soup too.","de":"Natürlich! Nächstes Mal werde ich dir auch beibringen, wie man Gyeran Mari oder Doenjang-Suppe macht.","fr":"Bien sûr ! La prochaine fois je t'apprendrai aussi à faire du gyeran mari ou de la soupe doenjang.","es":"¡Por supuesto! La próxima vez te enseñaré a hacer gyeran mari o sopa doenjang también.","pl":"Oczywiście! Następnym razem nauczę cię też, jak zrobić gyeran mari lub zupę doenjang.","it":"Certo! La prossima volta ti insegnerò anche a fare il gyeran mari o la zuppa doenjang.","sv":"Absolut! Nästa gång ska jag lära dig att laga gyeran mari eller doenjang-soppa också.","fi":"Tietenkin! Ensi kerralla opetan sinulle myös gyeran marin tai doenjang-keiton valmistuksen.","ja":"もちろん！今度は卵焼きやテンジャングクの作り方も教えてあげるね。","zh-CN":"当然！下次我也会教你鸡蛋卷或大酱汤的做法。"}}],"vocab":[{"word":"레시피","trans":{"en":"recipe","de":"Rezept","fr":"recette","es":"receta","pl":"przepis","it":"ricetta","sv":"recept","fi":"resepti","ja":"レシピ","zh-CN":"食谱"}},{"word":"볶다","trans":{"en":"to stir-fry","de":"anbraten","fr":"faire revenir","es":"saltear","pl":"smażyć","it":"rosolare","sv":"woka","fi":"paistaa","ja":"炒める","zh-CN":"炒"}},{"word":"끓이다","trans":{"en":"to boil","de":"kochen","fr":"faire bouillir","es":"hervir","pl":"gotować","it":"far bollire","sv":"koka","fi":"keittää","ja":"煮る","zh-CN":"煮"}},{"word":"간을 맞추다","trans":{"en":"to season","de":"würzen","fr":"assaisonner","es":"sazonar","pl":"przyprawiać","it":"condire","sv":"smaksätta","fi":"maustaa","ja":"味を整える","zh-CN":"调味"}},{"word":"재료","trans":{"en":"ingredient","de":"Zutat","fr":"ingrédient","es":"ingrediente","pl":"składnik","it":"ingrediente","sv":"ingrediens","fi":"ainesosa","ja":"材料","zh-CN":"食材"}},{"word":"중간 불","trans":{"en":"medium heat","de":"mittlere Hitze","fr":"feu moyen","es":"fuego medio","pl":"średni ogień","it":"fuoco medio","sv":"medelvärme","fi":"keskilämpö","ja":"中火","zh-CN":"中火"}},{"word":"두부","trans":{"en":"tofu","de":"Tofu","fr":"tofu","es":"tofu","pl":"tofu","it":"tofu","sv":"tofu","fi":"tofu","ja":"豆腐","zh-CN":"豆腐"}}],"patterns":[{"pattern":"어떻게 만드는 거야?","patternTrans":{"en":"How do you make it?","de":"Wie macht man das?","fr":"Comment tu le fais ?","es":"¿Cómo lo haces?","pl":"Jak się to robi?","it":"Come lo si fa?","sv":"Hur gör man det?","fi":"Miten sen tehdään?","ja":"どうやって作るの？","zh-CN":"怎么做的？"},"example":"김치찌개는 어떻게 만드는 거야?","trans":{"en":"How do you make kimchi jjigae?","de":"Wie macht man Kimchi-Eintopf?","fr":"Comment tu fais le kimchi jjigae ?","es":"¿Cómo se hace el kimchi jjigae?","pl":"Jak się robi kimchi jjigae?","it":"Come si fa il kimchi jjigae?","sv":"Hur gör man kimchi jjigae?","fi":"Miten kimchi jjigae tehdään?","ja":"キムチチゲはどうやって作るの？","zh-CN":"泡菜汤怎么做？"}},{"pattern":"~다가 ~을/를 넣어","patternTrans":{"en":"While ~ing, add ~","de":"Während du ~, gib ~ hinzu","fr":"Pendant que tu ~, ajoute ~","es":"Mientras ~, añade ~","pl":"Podczas ~, dodaj ~","it":"Mentre ~, aggiungi ~","sv":"Medan du ~, tillsätt ~","fi":"Kun ~, lisää ~","ja":"～しながら～を入れる","zh-CN":"在～的时候放入～"},"example":"돼지고기를 볶다가 김치를 넣어.","trans":{"en":"While stir-frying the pork, add the kimchi.","de":"Während du das Schweinefleisch anbrätst, gib das Kimchi hinzu.","fr":"Pendant que tu fais revenir le porc, ajoute le kimchi.","es":"Mientras salteas el cerdo, añade el kimchi.","pl":"Podczas smażenia wieprzowiny, dodaj kimchi.","it":"Mentre rosoli la carne di maiale, aggiungi il kimchi.","sv":"Medan du steker fläskköttet, tillsätt kimchin.","fi":"Kun paistaa sianlihaa, lisää kimchi.","ja":"豚肉を炒めながらキムチを入れる。","zh-CN":"在炒猪肉的时候放入泡菜。"}},{"pattern":"~(으)면 완성이야","patternTrans":{"en":"It's done when you ~","de":"Es ist fertig, wenn du ~","fr":"C'est terminé quand tu ~","es":"Está listo cuando ~","pl":"Jest gotowe, gdy ~","it":"È finito quando ~","sv":"Det är klart när du ~","fi":"Se on valmis kun ~","ja":"～したら完成だよ","zh-CN":"～就完成了"},"example":"마지막에 파를 넣으면 완성이야.","trans":{"en":"It's done when you add green onions at the end.","de":"Es ist fertig, wenn du am Ende Frühlingszwiebeln hinzugibst.","fr":"C'est terminé quand tu ajoutes des oignons verts à la fin.","es":"Está listo cuando añades cebolletas al final.","pl":"Jest gotowe, gdy na końcu dodasz dymkę.","it":"È finito quando aggiungi le cipolle verdi alla fine.","sv":"Det är klart när du lägger till salladslök i slutet.","fi":"Se on valmis kun lisäät kevätsipulin lopussa.","ja":"最後にネギを入れたら完成だよ。","zh-CN":"最后放葱就完成了。"}}],"quizzes":[{"type":"이해","questionAudio":"김치찌개를 만들 때 처음에 어떻게 해야 합니까?","questionTrans":{"en":"What should you do first when making kimchi jjigae?","de":"Was sollte man zuerst tun, wenn man Kimchi-Eintopf macht?","fr":"Que faut-il faire en premier quand on fait du kimchi jjigae ?","es":"¿Qué se debe hacer primero cuando se hace kimchi jjigae?","pl":"Co należy zrobić najpierw podczas robienia kimchi jjigae?","it":"Cosa bisogna fare prima quando si fa il kimchi jjigae?","sv":"Vad ska man göra först när man lagar kimchi jjigae?","fi":"Mitä pitää tehdä ensin kimchi jjigaeta tehtäessä?","ja":"キムチチゲを作るとき、最初に何をするべきですか？","zh-CN":"做泡菜汤时，首先应该怎么做？"},"options":[{"text":"두부를 먼저 넣는다","trans":{"en":"Add tofu first","de":"Tofu zuerst hinzufügen","fr":"Ajouter d'abord le tofu","es":"Añadir tofu primero","pl":"Najpierw dodać tofu","it":"Aggiungere prima il tofu","sv":"Tillsätt tofu först","fi":"Lisää tofu ensin","ja":"豆腐を先に入れる","zh-CN":"先放豆腐"}},{"text":"돼지고기를 볶는다","trans":{"en":"Stir-fry the pork","de":"Das Schweinefleisch anbraten","fr":"Faire revenir le porc","es":"Saltear el cerdo","pl":"Podsmaż wieprzowinę","it":"Rosolare la carne di maiale","sv":"Stek fläskköttet","fi":"Paista sianliha","ja":"豚肉を炒める","zh-CN":"炒猪肉"}},{"text":"물을 넣고 끓인다","trans":{"en":"Add water and boil","de":"Wasser hinzufügen und kochen","fr":"Ajouter de l'eau et faire bouillir","es":"Añadir agua y hervir","pl":"Dodać wodę i gotować","it":"Aggiungere acqua e far bollire","sv":"Tillsätt vatten och koka","fi":"Lisää vesi ja keitä","ja":"水を入れて煮る","zh-CN":"加水煮"}},{"text":"파를 잘게 썬다","trans":{"en":"Finely chop green onions","de":"Frühlingszwiebeln fein hacken","fr":"Couper finement les oignons verts","es":"Picar finamente las cebolletas","pl":"Drobno posiekać dymkę","it":"Tritare finemente le cipolle verdi","sv":"Hacka salladslöken fint","fi":"Hienonna kevätsipuli","ja":"ネギを細かく切る","zh-CN":"把葱切碎"}}],"answer":1,"explanation":"지수는 먼저 돼지고기를 볶다가 묵은 김치를 넣는다고 했습니다."},{"type":"이해","questionAudio":"김치찌개를 얼마나 끓여야 합니까?","questionTrans":{"en":"How long should you boil the kimchi jjigae?","de":"Wie lange soll man den Kimchi-Eintopf kochen?","fr":"Combien de temps faut-il faire bouillir le kimchi jjigae ?","es":"¿Cuánto tiempo hay que hervir el kimchi jjigae?","pl":"Jak długo należy gotować kimchi jjigae?","it":"Per quanto tempo bisogna far bollire il kimchi jjigae?","sv":"Hur länge ska man koka kimchi jjigaen?","fi":"Kuinka kauan kimchi jjigaeta pitää keittää?","ja":"キムチチゲをどのくらい煮ればいいですか？","zh-CN":"泡菜汤应该煮多久？"},"options":[{"text":"5분","trans":{"en":"5 minutes","de":"5 Minuten","fr":"5 minutes","es":"5 minutos","pl":"5 minut","it":"5 minuti","sv":"5 minuter","fi":"5 minuuttia","ja":"5分","zh-CN":"5分钟"}},{"text":"10분","trans":{"en":"10 minutes","de":"10 Minuten","fr":"10 minutes","es":"10 minutos","pl":"10 minut","it":"10 minuti","sv":"10 minuter","fi":"10 minuuttia","ja":"10分","zh-CN":"10分钟"}},{"text":"15분","trans":{"en":"15 minutes","de":"15 Minuten","fr":"15 minutes","es":"15 minutos","pl":"15 minut","it":"15 minuti","sv":"15 minuter","fi":"15 minuuttia","ja":"15分","zh-CN":"15分钟"}},{"text":"30분","trans":{"en":"30 minutes","de":"30 Minuten","fr":"30 minutes","es":"30 minutos","pl":"30 minut","it":"30 minuti","sv":"30 minuter","fi":"30 minuuttia","ja":"30分","zh-CN":"30分钟"}}],"answer":2,"explanation":"지수는 중간 불에서 15분쯤 끓이면 된다고 했습니다."},{"type":"이해","questionAudio":"지수가 소금 대신 사용하라고 한 것은 무엇입니까?","questionTrans":{"en":"What did Jisu say to use instead of salt?","de":"Was hat Jisu gesagt, was man statt Salz verwenden soll?","fr":"Qu'est-ce que Jisu a dit d'utiliser à la place du sel ?","es":"¿Qué dijo Jisu que usara en lugar de sal?","pl":"Co Jisu powiedziała, żeby użyć zamiast soli?","it":"Cosa ha detto Jisu di usare al posto del sale?","sv":"Vad sa Jisu att man ska använda istället för salt?","fi":"Mitä Jisu sanoi käyttää suolan sijaan?","ja":"ジスが塩の代わりに使えと言ったのは何ですか？","zh-CN":"智秀说要用什么代替盐？"},"options":[{"text":"설탕","trans":{"en":"Sugar","de":"Zucker","fr":"Sucre","es":"Azúcar","pl":"Cukier","it":"Zucchero","sv":"Socker","fi":"Sokeri","ja":"砂糖","zh-CN":"白糖"}},{"text":"새우젓이나 국간장","trans":{"en":"Fermented shrimp or soup soy sauce","de":"Fermentierte Garnelen oder Suppensojasauce","fr":"Crevettes fermentées ou sauce soja pour soupe","es":"Camarones fermentados o salsa de soja para sopa","pl":"Fermentowane krewetki lub sos sojowy do zup","it":"Gamberetti fermentati o salsa di soia per zuppa","sv":"Fermenterade räkor eller soppsojasås","fi":"Fermentoidut katkaravut tai keitossoijakastike","ja":"塩辛かスープしょうゆ","zh-CN":"腌虾或汤用酱油"}},{"text":"고추장","trans":{"en":"Gochujang (red pepper paste)","de":"Gochujang (rote Pfefferpaste)","fr":"Gochujang (pâte de piment rouge)","es":"Gochujang (pasta de pimiento rojo)","pl":"Gochujang (pasta z czerwonej papryki)","it":"Gochujang (pasta di peperoncino rosso)","sv":"Gochujang (röd paprikakräm)","fi":"Gochujang (punainen paprikatahna)","ja":"コチュジャン","zh-CN":"辣椒酱"}},{"text":"된장","trans":{"en":"Doenjang (fermented soybean paste)","de":"Doenjang (fermentierte Sojabohnenpaste)","fr":"Doenjang (pâte de soja fermentée)","es":"Doenjang (pasta de soja fermentada)","pl":"Doenjang (sfermentowana pasta sojowa)","it":"Doenjang (pasta di soia fermentata)","sv":"Doenjang (fermenterad sojabönspasta)","fi":"Doenjang (fermentoitu soijapaputahna)","ja":"テンジャン","zh-CN":"大酱"}}],"answer":1,"explanation":"지수는 소금 대신 새우젓이나 국간장으로 간을 맞추라고 했습니다."}]},
  18: {"id":18,"title":"영화 관람","titleTrans":{"en":"Watching Movies","de":"Kinobesuch","fr":"Aller au cinéma","es":"Ver películas","pl":"Oglądanie filmów","it":"Andare al cinema","sv":"Att se på film","fi":"Elokuvissa käynti","ja":"映画鑑賞","zh-CN":"观看电影"},"desc":"영화를 예매하고 감상을 이야기하는 대화입니다.","descTrans":{"en":"A conversation about booking movie tickets and sharing impressions.","de":"Ein Gespräch über das Buchen von Kinokarten und das Teilen von Eindrücken.","fr":"Une conversation sur la réservation de billets de cinéma et le partage des impressions.","es":"Una conversación sobre reservar entradas de cine y compartir impresiones.","pl":"Rozmowa o rezerwacji biletów do kina i dzieleniu się wrażeniami.","it":"Una conversazione sulla prenotazione di biglietti del cinema e la condivisione delle impressioni.","sv":"En konversation om att boka biobiljetter och dela intryck.","fi":"Keskustelu elokuvalippujen varaamisesta ja vaikutelmien jakamisesta.","ja":"映画のチケットを予約し、感想を話し合う会話です。","zh-CN":"关于预订电影票和分享观感的对话。"},"dialogue":[{"speaker":"유진","text":"현우야, 이번 주말에 영화 보러 갈래? 요즘 화제인 영화가 있거든.","trans":{"en":"Hyunwoo, do you want to go see a movie this weekend? There's a movie that's been the talk of the town lately.","de":"Hyunwoo, möchtest du dieses Wochenende ins Kino gehen? Es gibt einen Film, über den alle reden.","fr":"Hyunwoo, tu veux aller voir un film ce week-end ? Il y a un film dont tout le monde parle en ce moment.","es":"Hyunwoo, ¿quieres ir a ver una película este fin de semana? Hay una película que está siendo muy comentada.","pl":"Hyunwoo, chcesz pójść do kina w ten weekend? Jest film, o którym wszyscy teraz mówią.","it":"Hyunwoo, vuoi andare a vedere un film questo fine settimana? C'è un film di cui tutti parlano in questo momento.","sv":"Hyunwoo, vill du gå och se en film i helgen? Det finns en film som alla pratar om just nu.","fi":"Hyunwoo, haluatko mennä elokuviin viikonloppuna? On elokuva josta kaikki puhuvat nyt.","ja":"ヒョヌ、今週末映画を見に行く？最近話題になっている映画があるんだけど。","zh-CN":"贤宇，这个周末想去看电影吗？最近有部很热门的电影。"}},{"speaker":"현우","text":"좋아! 무슨 영화야? 장르가 뭔지 알아?","trans":{"en":"Sure! What movie is it? Do you know what genre it is?","de":"Klar! Was für ein Film ist es? Weißt du, welches Genre es ist?","fr":"Super ! C'est quel film ? Tu sais quel genre c'est ?","es":"¡Bien! ¿Qué película es? ¿Sabes de qué género es?","pl":"Świetnie! Jaki to film? Czy wiesz, jakie ma gatunek?","it":"Bene! Che film è? Sai che genere è?","sv":"Bra! Vilken film är det? Vet du vilken genre det är?","fi":"Hienoa! Mikä elokuva se on? Tiedätkö minkä tyylinen se on?","ja":"いいね！どんな映画？ジャンルは何かわかる？","zh-CN":"好啊！是什么电影？知道是什么类型吗？"}},{"speaker":"유진","text":"한국 스릴러 영화야. 관객 평점이 9점이 넘는다고 해서 기대가 돼.","trans":{"en":"It's a Korean thriller. They say the audience rating is over 9, so I'm looking forward to it.","de":"Es ist ein koreanischer Thriller. Man sagt, die Zuschauerbeurteilung liegt über 9, also freue ich mich darauf.","fr":"C'est un thriller coréen. On dit que la note du public est supérieure à 9, donc j'ai hâte de le voir.","es":"Es un thriller coreano. Dicen que la puntuación del público supera el 9, así que tengo muchas ganas de verlo.","pl":"To koreański thriller. Mówią, że ocena widzów przekracza 9, więc jestem podekscytowany.","it":"È un thriller coreano. Dicono che il voto del pubblico supera il 9, quindi non vedo l'ora di vederlo.","sv":"Det är en koreansk thriller. De säger att publikbetyget är över 9, så jag ser fram emot det.","fi":"Se on korealainen trilleri. Sanovat, että yleisöarvosana on yli 9, joten odotan innolla.","ja":"韓国スリラー映画だよ。観客評点が9点を超えてると聞いて楽しみ。","zh-CN":"是韩国惊悚片。据说观众评分超过9分，很期待。"}},{"speaker":"현우","text":"스릴러 좋아! 좌석은 어디서 예매해? 앱으로 할 수 있어?","trans":{"en":"I like thrillers! Where can you book seats? Can you do it through an app?","de":"Ich mag Thriller! Wo kann man Plätze buchen? Kann man es über eine App machen?","fr":"J'aime les thrillers ! Où peut-on réserver des places ? Peut-on le faire via une application ?","es":"¡Me gustan los thrillers! ¿Dónde se pueden reservar asientos? ¿Se puede hacer a través de una aplicación?","pl":"Lubię thrillery! Gdzie można zarezerwować miejsca? Czy można to zrobić przez aplikację?","it":"Mi piacciono i thriller! Dove si possono prenotare i posti? Si può fare tramite un'app?","sv":"Jag gillar thrillrar! Var kan man boka platser? Kan man göra det via en app?","fi":"Pidän trillereistä! Mistä voi varata paikkoja? Voiko sen tehdä sovelluksella?","ja":"スリラーいいね！座席はどこで予約できる？アプリでできる？","zh-CN":"我喜欢惊悚片！座位在哪里预订？可以用APP吗？"}},{"speaker":"유진","text":"응, CGV 앱에서 바로 예매할 수 있어. 좌석도 미리 고를 수 있거든.","trans":{"en":"Yes, you can book directly through the CGV app. You can also choose your seat in advance.","de":"Ja, du kannst direkt über die CGV-App buchen. Du kannst auch deinen Platz im Voraus aussuchen.","fr":"Oui, tu peux réserver directement via l'application CGV. Tu peux aussi choisir ta place à l'avance.","es":"Sí, puedes reservar directamente a través de la aplicación CGV. También puedes elegir tu asiento de antemano.","pl":"Tak, możesz zarezerwować bezpośrednio przez aplikację CGV. Możesz też wybrać miejsce z wyprzedzeniem.","it":"Sì, puoi prenotare direttamente tramite l'app CGV. Puoi anche scegliere il posto in anticipo.","sv":"Ja, du kan boka direkt via CGV-appen. Du kan också välja din plats i förväg.","fi":"Kyllä, voit varata suoraan CGV-sovelluksen kautta. Voit myös valita paikkasi etukäteen.","ja":"うん、CGVアプリで直接予約できるよ。座席もあらかじめ選べるんだ。","zh-CN":"是的，可以直接在CGV APP上预订。还可以提前选座。"}},{"speaker":"현우","text":"좋아, 내가 지금 예매할게. 몇 시 걸이 좋아?","trans":{"en":"Great, I'll book now. What showing time works for you?","de":"Gut, ich buche jetzt. Zu welcher Vorstellungszeit ist es dir recht?","fr":"Super, je vais réserver maintenant. Quelle heure de séance te convient ?","es":"Genial, reservaré ahora. ¿Qué horario de función te viene bien?","pl":"Świetnie, zarezerwuję teraz. O której godzinie seansu ci pasuje?","it":"Bene, prenoto adesso. Che orario di proiezione ti va bene?","sv":"Bra, jag bokar nu. Vilken visningstid passar dig?","fi":"Hienoa, varaan nyt. Mikä näytösaika sopii sinulle?","ja":"いいよ、今予約するね。何時の回がいい？","zh-CN":"好的，我现在订。你想看几点的场次？"}},{"speaker":"유진","text":"저녁 7시나 8시가 좋아. 그리고 중간 자리로 예매해 줘.","trans":{"en":"7 PM or 8 PM works. And please book seats in the middle.","de":"19 Uhr oder 20 Uhr ist gut. Und bitte buche Plätze in der Mitte.","fr":"19h ou 20h c'est bien. Et réserve des places au milieu s'il te plaît.","es":"Las 7 PM o las 8 PM está bien. Y por favor reserva asientos en el medio.","pl":"Dobrze 19:00 lub 20:00. I zarezerwuj miejsca w środku.","it":"Le 19 o le 20 vanno bene. E prenota posti nel mezzo per favore.","sv":"19:00 eller 20:00 passar. Och boka platser i mitten tack.","fi":"Kello 19 tai 20 sopii. Ja varaa paikat keskeltä.","ja":"夕方7時か8時がいいな。それと真ん中の席に予約してね。","zh-CN":"晚上7点或8点都行。还有帮我订中间的位置。"}},{"speaker":"현우","text":"알겠어. 8시 걸로 예매했어. 2열 가운데 자리야.","trans":{"en":"Got it. I booked the 8 PM showing. They're center seats in row 2.","de":"Verstanden. Ich habe die 20-Uhr-Vorstellung gebucht. Es sind Mittelplätze in Reihe 2.","fr":"Compris. J'ai réservé la séance de 20h. Ce sont des places centrales au rang 2.","es":"Entendido. Reservé la función de las 8 PM. Son asientos centrales en la fila 2.","pl":"Rozumiem. Zarezerwowałem seans o 20:00. Są to środkowe miejsca w rzędzie 2.","it":"Capito. Ho prenotato la proiezione delle 20. Sono posti centrali nella fila 2.","sv":"Förstår. Jag bokade 20:00-visningen. De är centrala platser i rad 2.","fi":"Selvä. Varasin kello 20 näytöksen. Ne ovat keskirivistön paikat rivillä 2.","ja":"わかった。8時の回を予約したよ。2列目の真ん中の席だよ。","zh-CN":"好的。我订了8点的场次。是第2排中间的位置。"}},{"speaker":"유진","text":"완벽해! 영화 보고 나서 카페 가서 이야기하자.","trans":{"en":"Perfect! Let's go to a café and talk after the movie.","de":"Perfekt! Gehen wir nach dem Film in ein Café und reden.","fr":"Parfait ! Allons dans un café parler après le film.","es":"¡Perfecto! Vayamos a un café y hablemos después de la película.","pl":"Idealnie! Chodźmy do kawiarni i porozmawiajmy po filmie.","it":"Perfetto! Andiamo in un caffè a parlare dopo il film.","sv":"Perfekt! Låt oss gå till ett café och prata efter filmen.","fi":"Täydellinen! Mennään kahvilaan juttelemaan elokuvan jälkeen.","ja":"完璧！映画を見た後、カフェに行って話そうよ。","zh-CN":"太棒了！看完电影后去咖啡馆聊聊吧。"}},{"speaker":"현우","text":"좋아. 영화 기대된다. 주말이 빨리 왔으면 좋겠다!","trans":{"en":"Sounds good. I'm looking forward to the movie. I wish the weekend would come quickly!","de":"Klingt gut. Ich freue mich auf den Film. Ich wünschte, das Wochenende käme schnell!","fr":"Super. J'ai hâte de voir le film. J'espère que le week-end arrive vite !","es":"Genial. Estoy ansioso por ver la película. ¡Ojalá llegue pronto el fin de semana!","pl":"Dobrze. Nie mogę się doczekać filmu. Chciałbym, żeby weekend przyszedł szybko!","it":"Bene. Non vedo l'ora di vedere il film. Speravo che il fine settimana arrivasse presto!","sv":"Låter bra. Jag ser fram emot filmen. Jag önskar att helgen kom snabbt!","fi":"Hyvä. Odotan elokuvaa innolla. Toivottavasti viikonloppu tulee nopeasti!","ja":"いいよ。映画楽しみ。週末が早く来ればいいな！","zh-CN":"好的。好期待这部电影啊。希望周末快点到来！"}}],"vocab":[{"word":"예매하다","trans":{"en":"to book in advance","de":"im Voraus buchen","fr":"réserver à l'avance","es":"reservar con anticipación","pl":"rezerwować z wyprzedzeniem","it":"prenotare in anticipo","sv":"boka i förväg","fi":"varata etukäteen","ja":"予約する","zh-CN":"提前预订"}},{"word":"화제","trans":{"en":"topic of discussion / buzz","de":"Gesprächsthema","fr":"sujet de discussion","es":"tema de conversación","pl":"temat rozmowy","it":"argomento di discussione","sv":"samtalsämne","fi":"puheenaihe","ja":"話題","zh-CN":"话题"}},{"word":"평점","trans":{"en":"rating","de":"Bewertung","fr":"note","es":"puntuación","pl":"ocena","it":"voto","sv":"betyg","fi":"arvosana","ja":"評点","zh-CN":"评分"}},{"word":"좌석","trans":{"en":"seat","de":"Sitz","fr":"siège","es":"asiento","pl":"miejsce","it":"posto","sv":"plats","fi":"paikka","ja":"座席","zh-CN":"座位"}},{"word":"스릴러","trans":{"en":"thriller","de":"Thriller","fr":"thriller","es":"thriller","pl":"thriller","it":"thriller","sv":"thriller","fi":"trilleri","ja":"スリラー","zh-CN":"惊悚片"}},{"word":"장르","trans":{"en":"genre","de":"Genre","fr":"genre","es":"género","pl":"gatunek","it":"genere","sv":"genre","fi":"genre","ja":"ジャンル","zh-CN":"类型"}},{"word":"감상","trans":{"en":"impression / review","de":"Eindruck","fr":"impression","es":"impresión","pl":"wrażenie","it":"impressione","sv":"intryck","fi":"vaikutelma","ja":"感想","zh-CN":"感想"}}],"patterns":[{"pattern":"~(으)러 갈래?","patternTrans":{"en":"Do you want to go to ~?","de":"Möchtest du ~ gehen?","fr":"Tu veux aller ~ ?","es":"¿Quieres ir a ~?","pl":"Chcesz pójść ~?","it":"Vuoi andare a ~?","sv":"Vill du gå ~?","fi":"Haluatko mennä ~?","ja":"～しに行く？","zh-CN":"想去～吗？"},"example":"영화 보러 갈래?","trans":{"en":"Do you want to go see a movie?","de":"Möchtest du ins Kino gehen?","fr":"Tu veux aller voir un film ?","es":"¿Quieres ir a ver una película?","pl":"Chcesz pójść do kina?","it":"Vuoi andare a vedere un film?","sv":"Vill du gå och se en film?","fi":"Haluatko mennä katsomaan elokuvan?","ja":"映画を見に行く？","zh-CN":"想去看电影吗？"}},{"pattern":"~다고 해서 기대가 돼","patternTrans":{"en":"I'm looking forward to it because they say ~","de":"Ich freue mich darauf, weil man sagt ~","fr":"J'ai hâte parce qu'on dit ~","es":"Estoy emocionado porque dicen ~","pl":"Nie mogę się doczekać, bo mówią ~","it":"Non vedo l'ora perché si dice ~","sv":"Jag ser fram emot det för de säger ~","fi":"Odotan innolla koska sanovat ~","ja":"～と聞いて楽しみ","zh-CN":"因为听说～很期待"},"example":"평점이 9점이 넘는다고 해서 기대가 돼.","trans":{"en":"I'm looking forward to it because they say the rating is over 9.","de":"Ich freue mich darauf, weil man sagt, die Bewertung liegt über 9.","fr":"J'ai hâte parce qu'on dit que la note est supérieure à 9.","es":"Estoy emocionado porque dicen que la puntuación supera el 9.","pl":"Nie mogę się doczekać, bo mówią, że ocena przekracza 9.","it":"Non vedo l'ora perché si dice che il voto supera il 9.","sv":"Jag ser fram emot det för de säger att betyget är över 9.","fi":"Odotan innolla koska sanovat arvosanan olevan yli 9.","ja":"評点が9点を超えると聞いて楽しみ。","zh-CN":"因为听说评分超过9分很期待。"}},{"pattern":"~(으)로 예매해 줘","patternTrans":{"en":"Please book ~ for me","de":"Bitte buche ~ für mich","fr":"S'il te plaît, réserve ~ pour moi","es":"Por favor, reserva ~ para mí","pl":"Proszę, zarezerwuj ~ dla mnie","it":"Per favore, prenota ~ per me","sv":"Snälla boka ~ åt mig","fi":"Varaa minulle ~ kiitos","ja":"～で予約してね","zh-CN":"帮我预订～"},"example":"중간 자리로 예매해 줘.","trans":{"en":"Please book center seats for me.","de":"Bitte buche Mittelplätze für mich.","fr":"S'il te plaît, réserve des places centrales pour moi.","es":"Por favor, reserva asientos centrales para mí.","pl":"Proszę, zarezerwuj dla mnie środkowe miejsca.","it":"Per favore, prenota posti centrali per me.","sv":"Snälla boka centrala platser åt mig.","fi":"Varaa minulle keskirivistön paikat.","ja":"真ん中の席に予約してね。","zh-CN":"帮我订中间的位置。"}}],"quizzes":[{"type":"이해","questionAudio":"두 사람이 보려는 영화의 장르는 무엇입니까?","questionTrans":{"en":"What genre is the movie they want to see?","de":"Welches Genre ist der Film, den sie sehen wollen?","fr":"Quel est le genre du film qu'ils veulent voir ?","es":"¿De qué género es la película que quieren ver?","pl":"Jakiego gatunku jest film, który chcą obejrzeć?","it":"Che genere è il film che vogliono vedere?","sv":"Vilken genre är filmen de vill se?","fi":"Mikä genre on elokuva jonka he haluavat nähdä?","ja":"二人が見ようとしている映画のジャンルは何ですか？","zh-CN":"他们要看的电影是什么类型？"},"options":[{"text":"코미디","trans":{"en":"Comedy","de":"Komödie","fr":"Comédie","es":"Comedia","pl":"Komedia","it":"Commedia","sv":"Komedi","fi":"Komedia","ja":"コメディ","zh-CN":"喜剧"}},{"text":"로맨스","trans":{"en":"Romance","de":"Romantik","fr":"Romance","es":"Romance","pl":"Romans","it":"Romance","sv":"Romantik","fi":"Romanssi","ja":"ロマンス","zh-CN":"爱情片"}},{"text":"스릴러","trans":{"en":"Thriller","de":"Thriller","fr":"Thriller","es":"Thriller","pl":"Thriller","it":"Thriller","sv":"Thriller","fi":"Trilleri","ja":"スリラー","zh-CN":"惊悚片"}},{"text":"액션","trans":{"en":"Action","de":"Action","fr":"Action","es":"Acción","pl":"Akcja","it":"Azione","sv":"Action","fi":"Toiminta","ja":"アクション","zh-CN":"动作片"}}],"answer":2,"explanation":"유진은 한국 스릴러 영화라고 했습니다."},{"type":"이해","questionAudio":"두 사람은 몇 시 영화를 예매했습니까?","questionTrans":{"en":"What time did they book the movie for?","de":"Für welche Uhrzeit haben sie den Film gebucht?","fr":"À quelle heure ont-ils réservé le film ?","es":"¿A qué hora reservaron la película?","pl":"Na którą godzinę zarezerwowali film?","it":"A che ora hanno prenotato il film?","sv":"Vilken tid bokade de filmen?","fi":"Mihin aikaan he varasivat elokuvan?","ja":"二人は何時の映画を予約しましたか？","zh-CN":"他们订了几点的电影？"},"options":[{"text":"6시","trans":{"en":"6 PM","de":"18 Uhr","fr":"18h","es":"6 PM","pl":"18:00","it":"18:00","sv":"18:00","fi":"18:00","ja":"18時","zh-CN":"下午6点"}},{"text":"7시","trans":{"en":"7 PM","de":"19 Uhr","fr":"19h","es":"7 PM","pl":"19:00","it":"19:00","sv":"19:00","fi":"19:00","ja":"19時","zh-CN":"下午7点"}},{"text":"8시","trans":{"en":"8 PM","de":"20 Uhr","fr":"20h","es":"8 PM","pl":"20:00","it":"20:00","sv":"20:00","fi":"20:00","ja":"20時","zh-CN":"晚上8点"}},{"text":"9시","trans":{"en":"9 PM","de":"21 Uhr","fr":"21h","es":"9 PM","pl":"21:00","it":"21:00","sv":"21:00","fi":"21:00","ja":"21時","zh-CN":"晚上9点"}}],"answer":2,"explanation":"현우가 8시 걸로 예매했다고 했습니다."},{"type":"이해","questionAudio":"영화 후에 두 사람은 무엇을 할 계획입니까?","questionTrans":{"en":"What do the two plan to do after the movie?","de":"Was haben die beiden nach dem Film vor?","fr":"Que prévoient-ils de faire après le film ?","es":"¿Qué planean hacer después de la película?","pl":"Co planują zrobić po filmie?","it":"Cosa pianificano di fare dopo il film?","sv":"Vad planerar de att göra efter filmen?","fi":"Mitä he suunnittelevat tekevänsä elokuvan jälkeen?","ja":"映画の後、二人は何をする計画ですか？","zh-CN":"看完电影后两人打算做什么？"},"options":[{"text":"밥을 먹으러 간다","trans":{"en":"Go eat food","de":"Essen gehen","fr":"Aller manger","es":"Ir a comer","pl":"Pójść zjeść","it":"Andare a mangiare","sv":"Gå och äta","fi":"Mennä syömään","ja":"ご飯を食べに行く","zh-CN":"去吃饭"}},{"text":"카페에서 이야기한다","trans":{"en":"Talk at a café","de":"In einem Café reden","fr":"Discuter dans un café","es":"Hablar en un café","pl":"Rozmawiać w kawiarni","it":"Parlare in un caffè","sv":"Prata på ett café","fi":"Jutella kahvilassa","ja":"カフェで話す","zh-CN":"在咖啡馆聊天"}},{"text":"바로 집에 간다","trans":{"en":"Go straight home","de":"Direkt nach Hause gehen","fr":"Rentrer directement à la maison","es":"Ir directamente a casa","pl":"Iść prosto do domu","it":"Andare direttamente a casa","sv":"Gå direkt hem","fi":"Mennä suoraan kotiin","ja":"すぐ家に帰る","zh-CN":"直接回家"}},{"text":"또 다른 영화를 본다","trans":{"en":"Watch another movie","de":"Einen anderen Film schauen","fr":"Regarder un autre film","es":"Ver otra película","pl":"Obejrzeć inny film","it":"Guardare un altro film","sv":"Se en annan film","fi":"Katsoa toinen elokuva","ja":"また別の映画を見る","zh-CN":"再看另一部电影"}}],"answer":1,"explanation":"유진이 영화 보고 나서 카페에서 이야기하자고 제안했습니다."}]},
  19: {"id":19,"title":"기념일 선물","titleTrans":{"en":"Anniversary Gifts","de":"Jubiläumsgeschenke","fr":"Cadeaux d'anniversaire","es":"Regalos de aniversario","pl":"Prezenty rocznicowe","it":"Regali di anniversario","sv":"Jubileumsgåvor","fi":"Vuosipäivälahjat","ja":"記念日のプレゼント","zh-CN":"纪念日礼物"},"desc":"기념일 선물을 고르고 계획하는 대화입니다.","descTrans":{"en":"A conversation about choosing and planning anniversary gifts.","de":"Ein Gespräch über die Auswahl und Planung von Jubiläumsgeschenken.","fr":"Une conversation sur le choix et la planification des cadeaux d'anniversaire.","es":"Una conversación sobre elegir y planificar regalos de aniversario.","pl":"Rozmowa o wyborze i planowaniu prezentów rocznicowych.","it":"Una conversazione sulla scelta e la pianificazione di regali per l'anniversario.","sv":"En konversation om att välja och planera jubileumsgåvor.","fi":"Keskustelu vuosipäivälahjien valitsemisesta ja suunnittelusta.","ja":"記念日のプレゼントを選んで計画する会話です。","zh-CN":"关于选择和计划纪念日礼物的对话。"},"dialogue":[{"speaker":"지민","text":"수미야, 다음 주가 우리 사귄 지 1주년이야. 선물로 뭐가 좋을까?","trans":{"en":"Sumi, next week is our 1-year anniversary of dating. What would be a good gift?","de":"Sumi, nächste Woche ist unser 1-jähriges Jubiläum der Beziehung. Was wäre ein gutes Geschenk?","fr":"Sumi, la semaine prochaine c'est notre 1er anniversaire de relation. Qu'est-ce qui serait bien comme cadeau ?","es":"Sumi, la próxima semana es nuestro 1er aniversario de relación. ¿Qué sería un buen regalo?","pl":"Sumi, w przyszłym tygodniu mija rok odkąd jesteśmy razem. Co byłoby dobrym prezentem?","it":"Sumi, la settimana prossima è il nostro 1° anniversario di fidanzamento. Cosa sarebbe un buon regalo?","sv":"Sumi, nästa vecka är vårt 1-årsdag av att dejta. Vad vore en bra present?","fi":"Sumi, ensi viikolla on vuosi siitä kun aloimme seurustella. Mikä olisi hyvä lahja?","ja":"スミ、来週が付き合って1周年だよ。プレゼントに何がいいかな？","zh-CN":"秀美，下周就是我们交往1周年了。送什么礼物好呢？"}},{"speaker":"수미","text":"1주년이라 특별하게 해줘야지! 상대방이 뭘 좋아해?","trans":{"en":"It's the 1st anniversary, so you should make it special! What does the other person like?","de":"Es ist der 1. Jahrestag, also solltest du es besonders machen! Was mag die andere Person?","fr":"C'est le 1er anniversaire, alors tu dois le rendre spécial ! Qu'est-ce que l'autre personne aime ?","es":"Es el 1er aniversario, ¡así que debes hacerlo especial! ¿Qué le gusta a la otra persona?","pl":"To 1. rocznica, więc musisz ją uczynić wyjątkową! Co lubi ta druga osoba?","it":"È il 1° anniversario, quindi devi renderlo speciale! Cosa piace all'altra persona?","sv":"Det är 1-årsdagen, så du bör göra det speciellt! Vad gillar den andra personen?","fi":"Se on 1. vuosipäivä, joten sinun pitää tehdä siitä erityinen! Mistä toinen pitää?","ja":"1周年だから特別にしてあげなきゃ！相手が何が好き？","zh-CN":"一周年很特别要好好庆祝！对方喜欢什么？"}},{"speaker":"지민","text":"꽃을 좋아하고 향수에도 관심이 있어. 그런데 어느 게 더 의미있을까?","trans":{"en":"She likes flowers and is also interested in perfume. But which would be more meaningful?","de":"Sie mag Blumen und interessiert sich auch für Parfüm. Aber was wäre bedeutungsvoller?","fr":"Elle aime les fleurs et s'intéresse aussi aux parfums. Mais lequel serait plus significatif ?","es":"Le gustan las flores y también le interesa el perfume. Pero ¿cuál sería más significativo?","pl":"Lubi kwiaty i interesuje się też perfumami. Ale co byłoby bardziej znaczące?","it":"Le piacciono i fiori e si interessa anche ai profumi. Ma quale sarebbe più significativo?","sv":"Hon gillar blommor och är också intresserad av parfym. Men vilket vore mer meningsfullt?","fi":"Hän tykkää kukista ja on myös kiinnostunut hajuvedestä. Mutta kumpi olisi merkityksellisempää?","ja":"花が好きで香水にも興味があるんだ。でもどっちの方が意味深いかな？","zh-CN":"她喜欢花，对香水也感兴趣。但哪个更有意义呢？"}},{"speaker":"수미","text":"둘 다 주는 건 어때? 꽃다발이랑 향수를 같이 선물하면 정말 감동적일 거야.","trans":{"en":"How about giving both? A bouquet of flowers and perfume together would be really touching.","de":"Wie wäre es, beides zu schenken? Einen Blumenstrauß und Parfüm zusammen würde wirklich berühren.","fr":"Que dirais-tu de donner les deux ? Un bouquet de fleurs et un parfum ensemble seraient vraiment touchants.","es":"¿Qué tal darle ambas cosas? Un ramo de flores y perfume juntos sería realmente conmovedor.","pl":"Co powiesz na danie obu? Bukiet kwiatów i perfumy razem byłyby naprawdę wzruszające.","it":"Che ne dici di dare entrambi? Un mazzo di fiori e un profumo insieme sarebbero davvero commoventi.","sv":"Vad sägs om att ge båda? En blombukett och parfym tillsammans vore riktigt rörande.","fi":"Entä jos antaisit molemmat? Kukkaképpu ja hajuvesi yhdessä olisi todella koskettavaa.","ja":"両方あげるのはどう？花束と香水を一緒にプレゼントしたら本当に感動的だと思うよ。","zh-CN":"两个都送怎么样？花束和香水一起送的话会非常感动的。"}},{"speaker":"지민","text":"좋은 생각이다! 예산은 10만 원 정도 생각하고 있어.","trans":{"en":"That's a great idea! I'm thinking of a budget of around 100,000 won.","de":"Das ist eine großartige Idee! Ich denke an ein Budget von etwa 100.000 Won.","fr":"C'est une excellente idée ! Je pense à un budget d'environ 100 000 won.","es":"¡Es una gran idea! Estoy pensando en un presupuesto de alrededor de 100,000 won.","pl":"To świetny pomysł! Myślę o budżecie около 100 000 wonów.","it":"È un'ottima idea! Sto pensando a un budget di circa 100.000 won.","sv":"Det är en bra idé! Jag tänker på en budget på ungefär 100 000 won.","fi":"Se on hieno idea! Olen ajatellut budjettia noin 100 000 wonia.","ja":"いいアイデアだ！予算は10万ウォンくらいを考えてるよ。","zh-CN":"好主意！我的预算大概是10万韩元左右。"}},{"speaker":"수미","text":"그러면 꽃다발에 3만 원, 향수에 7만 원 정도 쓰면 딱 맞겠다.","trans":{"en":"Then spending about 30,000 won on the bouquet and 70,000 won on the perfume would fit just right.","de":"Dann würde es gut passen, etwa 30.000 Won für den Blumenstrauß und 70.000 Won für das Parfüm auszugeben.","fr":"Alors dépenser environ 30 000 won pour le bouquet et 70 000 won pour le parfum conviendrait parfaitement.","es":"Entonces gastar unos 30,000 won en el ramo y 70,000 won en el perfume encajaría perfectamente.","pl":"Wydanie około 30 000 wonów na bukiet i 70 000 wonów na perfumy byłoby idealnym dopasowaniem.","it":"Allora spendere circa 30.000 won per il bouquet e 70.000 won per il profumo sarebbe perfetto.","sv":"Då skulle det passa perfekt att spendera ungefär 30 000 won på buketten och 70 000 won på parfymen.","fi":"Sitten noin 30 000 wonin käyttäminen kukkakimpuun ja 70 000 wonin hajuveteen sopisi juuri oikein.","ja":"じゃあ花束に3万ウォン、香水に7万ウォンくらい使えばちょうど合うね。","zh-CN":"那花束花3万韩元，香水花7万韩元刚刚好。"}},{"speaker":"지민","text":"같이 쇼핑 도와줄 수 있어? 향수 고르는 게 어려워서.","trans":{"en":"Can you help me shop? I find it difficult to choose perfume.","de":"Kannst du mir beim Einkaufen helfen? Es fällt mir schwer, ein Parfüm auszusuchen.","fr":"Peux-tu m'aider à faire du shopping ? Je trouve difficile de choisir un parfum.","es":"¿Puedes ayudarme a hacer las compras? Me resulta difícil elegir perfume.","pl":"Czy możesz pomóc mi w zakupach? Trudno mi wybrać perfumy.","it":"Puoi aiutarmi a fare shopping? Trovo difficile scegliere il profumo.","sv":"Kan du hjälpa mig shoppa? Jag tycker det är svårt att välja parfym.","fi":"Voitko auttaa minua ostoksilla? Minun on vaikea valita hajuvettä.","ja":"一緒に買い物を手伝ってくれる？香水の選び方が難しくて。","zh-CN":"可以陪我一起购物吗？不知道怎么选香水。"}},{"speaker":"수미","text":"물론이지! 토요일에 명동에 같이 가자. 좋은 향수 가게 알고 있어.","trans":{"en":"Of course! Let's go to Myeongdong together on Saturday. I know a good perfume shop.","de":"Natürlich! Lass uns am Samstag zusammen nach Myeongdong gehen. Ich kenne ein gutes Parfümladen.","fr":"Bien sûr ! Allons à Myeongdong ensemble samedi. Je connais un bon magasin de parfums.","es":"¡Por supuesto! Vayamos juntos a Myeongdong el sábado. Conozco una buena tienda de perfumes.","pl":"Oczywiście! Chodźmy razem do Myeongdong w sobotę. Znam dobry sklep z perfumami.","it":"Certo! Andiamo a Myeongdong insieme sabato. Conosco un buon negozio di profumi.","sv":"Absolut! Låt oss gå till Myeongdong tillsammans på lördag. Jag känner till en bra parfymbutik.","fi":"Totta kai! Mennään Myeongdongiin yhdessä lauantaina. Tiedän hyvän hajuvesikaupan.","ja":"もちろん！土曜日に明洞に一緒に行こう。いい香水のお店知ってるよ。","zh-CN":"当然！周六一起去明洞吧。我知道一家好的香水店。"}},{"speaker":"지민","text":"그리고 식당 예약도 해야 할 것 같아. 분위기 좋은 레스토랑 추천해 줄 수 있어?","trans":{"en":"And I think I should also make a restaurant reservation. Can you recommend a restaurant with a nice atmosphere?","de":"Und ich glaube, ich sollte auch ein Restaurant reservieren. Kannst du ein Restaurant mit guter Atmosphäre empfehlen?","fr":"Et je pense que je devrais aussi faire une réservation de restaurant. Peux-tu recommander un restaurant avec une belle atmosphère ?","es":"Y creo que también debería hacer una reserva en un restaurante. ¿Puedes recomendarme un restaurante con buena atmósfera?","pl":"I chyba też powinienem zarezerwować restaurację. Czy możesz polecić restaurację z miłą atmosferą?","it":"E penso che dovrei anche fare una prenotazione al ristorante. Puoi consigliarmi un ristorante con una bella atmosfera?","sv":"Och jag tror att jag borde göra en restaurangreservation också. Kan du rekommendera en restaurang med fin atmosfär?","fi":"Ja minun täytyy myös tehdä ravintola varaus. Voitko suositella ravintolaa jolla on mukava tunnelma?","ja":"それと、レストランの予約もしないといけないかな。雰囲気のいいレストランを教えてくれる？","zh-CN":"另外我想还需要订餐厅。你能推荐一个氛围好的餐厅吗？"}},{"speaker":"수미","text":"이태원에 분위기 좋은 곳이 많아. 미리 예약해야 하니까 빨리 알아봐!","trans":{"en":"There are many places with a nice atmosphere in Itaewon. You need to reserve in advance, so look into it quickly!","de":"In Itaewon gibt es viele Orte mit guter Atmosphäre. Du musst im Voraus reservieren, also schau schnell nach!","fr":"Il y a beaucoup d'endroits avec une belle atmosphère à Itaewon. Tu dois réserver à l'avance, alors renseigne-toi vite !","es":"Hay muchos lugares con buena atmósfera en Itaewon. Debes reservar con antelación, ¡así que infórmate rápidamente!","pl":"W Itaewon jest wiele miejsc z miłą atmosferą. Musisz zarezerwować z wyprzedzeniem, więc sprawdź szybko!","it":"Ci sono molti posti con una bella atmosfera a Itaewon. Devi prenotare in anticipo, quindi informati in fretta!","sv":"Det finns många ställen med fin atmosfär i Itaewon. Du måste boka i förväg, så undersök det snabbt!","fi":"Itaewonissa on monia paikkoja joilla on mukava tunnelma. Sinun täytyy varata etukäteen, joten tutki se nopeasti!","ja":"梨泰院に雰囲気のいい所がたくさんあるよ。事前に予約しないといけないから早く調べて！","zh-CN":"梨泰院有很多氛围好的地方。需要提前预订，快去查一查！"}}],"vocab":[{"word":"기념일","trans":{"en":"anniversary","de":"Jahrestag","fr":"anniversaire","es":"aniversario","pl":"rocznica","it":"anniversario","sv":"jubileum","fi":"vuosipäivä","ja":"記念日","zh-CN":"纪念日"}},{"word":"꽃다발","trans":{"en":"bouquet","de":"Blumenstrauß","fr":"bouquet de fleurs","es":"ramo de flores","pl":"bukiet kwiatów","it":"mazzo di fiori","sv":"blombukett","fi":"kukkakimppu","ja":"花束","zh-CN":"花束"}},{"word":"향수","trans":{"en":"perfume","de":"Parfüm","fr":"parfum","es":"perfume","pl":"perfumy","it":"profumo","sv":"parfym","fi":"hajuvesi","ja":"香水","zh-CN":"香水"}},{"word":"예산","trans":{"en":"budget","de":"Budget","fr":"budget","es":"presupuesto","pl":"budżet","it":"budget","sv":"budget","fi":"budjetti","ja":"予算","zh-CN":"预算"}},{"word":"감동적이다","trans":{"en":"touching / moving","de":"berührend","fr":"touchant","es":"conmovedor","pl":"wzruszający","it":"commovente","sv":"rörande","fi":"koskettava","ja":"感動的だ","zh-CN":"感人的"}},{"word":"분위기","trans":{"en":"atmosphere","de":"Atmosphäre","fr":"atmosphère","es":"ambiente","pl":"atmosfera","it":"atmosfera","sv":"atmosfär","fi":"tunnelma","ja":"雰囲気","zh-CN":"氛围"}},{"word":"의미있다","trans":{"en":"meaningful","de":"bedeutungsvoll","fr":"significatif","es":"significativo","pl":"znaczący","it":"significativo","sv":"meningsfull","fi":"merkityksellinen","ja":"意味深い","zh-CN":"有意义的"}}],"patterns":[{"pattern":"~으로 뭐가 좋을까?","patternTrans":{"en":"What would be good as ~?","de":"Was wäre gut als ~?","fr":"Qu'est-ce qui serait bien comme ~ ?","es":"¿Qué sería bueno como ~?","pl":"Co byłoby dobre jako ~?","it":"Cosa sarebbe bene come ~?","sv":"Vad vore bra som ~?","fi":"Mikä olisi hyvä ~ksi?","ja":"～に何がいいかな？","zh-CN":"作为～什么好呢？"},"example":"선물로 뭐가 좋을까?","trans": -CN":"需要提前预订，快～"},"example":"미리 예약해야 하니까 빨리 알아봐!","trans":{"en":"Since you need to reserve in advance, look into it quickly!","de":"Da du im Voraus reservieren musst, schau schnell nach!","fr":"Comme tu dois réserver à l'avance, renseigne-toi vite !","es":"Como debes reservar con antelación, ¡infórmate rápidamente!","pl":"Ponieważ musisz zarezerwować z wyprzedzeniem, sprawdź szybko!","it":"Poiché devi prenotare in anticipo, informati in fretta!","sv":"Eftersom du måste boka i förväg, undersök det snabbt!","fi":"Koska sinun täytyy varata etukäteen, tutki se nopeasti!","ja":"事前に予約しないといけないから早く調べて！","zh-CN":"需要提前预订，快去查一查！"}}],"quizzes":[{"type":"이해","questionAudio":"지민은 기념일 선물 예산을 얼마로 생각하고 있습니까?","questionTrans":{"en":"How much is Jimin's budget for the anniversary gift?","de":"Wie hoch ist Jimins Budget für das Jubiläumsgeschenk?","fr":"Quel est le budget de Jimin pour le cadeau d'anniversaire ?","es":"¿Cuánto es el presupuesto de Jimin para el regalo de aniversario?","pl":"Jaki jest budżet Jimina na prezent rocznicowy?","it":"Qual è il budget di Jimin per il regalo di anniversario?","sv":"Vad är Jimins budget för jubileumsgåvan?","fi":"Mikä on Jiminin budjetti vuosipäivälahjaan?","ja":"ジミンの記念日プレゼントの予算はいくらですか？","zh-CN":"智敏的纪念日礼物预算是多少？"},"options":[{"text":"5만 원","trans":{"en":"50,000 won","de":"50.000 Won","fr":"50 000 won","es":"50,000 won","pl":"50 000 wonów","it":"50.000 won","sv":"50 000 won","fi":"50 000 wonia","ja":"5万ウォン","zh-CN":"5万韩元"}},{"text":"10만 원","trans":{"en":"100,000 won","de":"100.000 Won","fr":"100 000 won","es":"100,000 won","pl":"100 000 wonów","it":"100.000 won","sv":"100 000 won","fi":"100 000 wonia","ja":"10万ウォン","zh-CN":"10万韩元"}},{"text":"15만 원","trans":{"en":"150,000 won","de":"150.000 Won","fr":"150 000 won","es":"150,000 won","pl":"150 000 wonów","it":"150.000 won","sv":"150 000 won","fi":"150 000 wonia","ja":"15万ウォン","zh-CN":"15万韩元"}},{"text":"20만 원","trans":{"en":"200,000 won","de":"200.000 Won","fr":"200 000 won","es":"200,000 won","pl":" den andra personen ha i present?","fi":"Mitä toinen henkilö haluaa lahjaksi?","ja":"相手がプレゼントとしてほしいのは何ですか？","zh-CN":"对方想要什么礼物？"},"options":[{"text":"책과 음악","trans":{"en":"Books and music","de":"Bücher und Musik","fr":"Livres et musique","es":"Libros y música","pl":"Książki i muzyka","it":"Libri e musica","sv":"Böcker och musik","fi":"Kirjat ja musiikki","ja":"本と音楽","zh-CN":"书和音乐"}},{"text":"꽃과 향수","trans":{"en":"Flowers and perfume","de":"Blumen und Parfüm","fr":"Fleurs et parfum","es":"Flores y perfume","pl":"Kwiaty i perfumy","it":"Fiori e profumo","sv":"Blommor och parfym","fi":"Kukat ja hajuvesi","ja":"花と香水","zh-CN":"花和香水"}},{"text":"옷과 액세서리","trans":{"en":"Clothes and accessories","de":"Kleidung und Accessoires","fr":"Vêtements et accessoires","es":"Ropa y accesorios","pl":"Ubrania i akcesoria","it":"Vestiti e accessori","sv":"Kläder och accessoarer","fi":"Vaatteet ja asusteet","ja":"服とアクセサリー","zh-CN":"衣服和配饰"}},{"text":"음식과 초콜릿","trans":{"en":"Food and chocolate","de":"Essen und Schokolade","fr":"Nourriture et chocolat","es":"Comida y chocolate","pl":"Jedzenie i czekolada","it":"Cibo e cioccolato","sv":"Mat och choklad","fi":"Ruoka ja suklaa","ja":"食べ物とチョコレート","zh-CN":"食物和巧克力"}}],"answer":1,"explanation":"지민은 꽃을 좋아하고 향수에도 관심이 있다고 했습니다."}]},
  20: {"id":20,"title":"고민 상담","titleTrans":{"en":"Seeking Advice","de":"Ratsuche","fr":"Chercher des conseils","es":"Buscar consejo","pl":"Szukanie porady","it":"Cercare consigli","sv":"Söka råd","fi":"Neuvojen hakeminen","ja":"悩み相談","zh-CN":"烦恼咨询"},"desc":"친구에게 고민을 털어놓고 조언을 받는 대화입니다.","descTrans":{"en":"A conversation about opening up to a friend and receiving advice.","de":"Ein Gespräch darüber, sich einem Freund anzuvertrauen und Rat zu bekommen.","fr":"Une conversation sur le fait de se confier à un ami et de recevoir des conseils.","es":"Una conversación sobre abrirse a un amigo y recibir consejos.","pl":"Rozmowa o zwierzaniu się przyjacielowi i otrzymywaniu porad.","it":"Una conversazione su aprirsi con un amico e ricevere consigli.","sv":"En konversation om att öppna sig för en vän och få råd.","fi":"Keskustelu ystävälle avautumisesta ja neuvojen saamisesta.","ja":"友達に悩みを打ち明けてアドバイスをもらう会話です。","zh-CN":"向朋友倾诉烦恼并获得建议的对话。"},"dialogue":[{"speaker":"민준","text":"지수야, 요즘 고민이 있어서 이야기 좀 해도 돼?","trans":{"en":"Jisu, I have a concern lately. Can I talk to you for a bit?","de":"Jisu, ich mache mir neuerdings Sorgen. Kann ich kurz mit dir reden?","fr":"Jisu, j'ai quelque chose qui me préoccupe dernièrement. Est-ce que je peux te parler un peu ?","es":"Jisu, últimamente tengo algo que me preocupa. ¿Puedo hablar contigo un momento?","pl":"Jisu, ostatnio mam pewne martwienie. Czy mogę z tobą chwilę porozmawiać?","it":"Jisu, ultimamente ho qualcosa che mi preoccupa. Posso parlarti un po'?","sv":"Jisu, jag har en oro på sistone. Kan jag prata med dig lite?","fi":"Jisu, minulla on viime aikoina huoli. Voiko puhua sinulle hetken?","ja":"ジス、最近悩みがあって少し話してもいい？","zh-CN":"智秀，我最近有点烦恼，可以跟你聊一下吗？"}},{"speaker":"지수","text":"물론이지! 무슨 일이야? 걱정스러워 보여.","trans":{"en":"Of course! What's going on? You look worried.","de":"Natürlich! Was ist los? Du siehst besorgt aus.","fr":"Bien sûr ! Qu'est-ce qui se passe ? Tu as l'air inquiet.","es":"¡Por supuesto! ¿Qué pasa? Pareces preocupado.","pl":"Oczywiście! Co się dzieje? Wyglądasz na zaniepokojony.","it":"Certo! Cosa succede? Sembri preoccupato.","sv":"Absolut! Vad är det? Du ser orolig ut.","fi":"Totta kai! Mitä tapahtui? Näytät huolestuneelta.","ja":"もちろん！どうしたの？心配そうに見えるよ。","zh-CN":"当然！怎么了？你看起来很烦恼。"}},{"speaker":"민준","text":"회사에서 팀장님과 사이가 좀 안 좋아. 내 의견을 무시할 때가 많아서 스트레스를 받아.","trans":{"en":"I'm not getting along well with my team leader at work. I'm stressed because they often ignore my opinions.","de":"Ich verstehe mich nicht gut mit meinem Teamleiter bei der Arbeit. Ich bin gestresst, weil sie meine Meinungen oft ignorieren.","fr":"Je ne m'entends pas bien avec mon chef d'équipe au travail. Je suis stressé parce qu'il ignore souvent mes opinions.","es":"No me llevo bien con mi jefe de equipo en el trabajo. Estoy estresado porque a menudo ignoran mis opiniones.","pl":"Nie układam się dobrze z liderem zespołu w pracy. Jestem zestresowany, bo często ignorują moje opinie.","it":"Non vado d'accordo con il mio capo squadra al lavoro. Sono stressato perché ignorano spesso le mie opinioni.","sv":"Jag kommer inte bra överens med min teamledare på jobbet. Jag är stressad för att de ofta ignorerar mina åsikter.","fi":"En tule hyvin toimeen tiimipäällikköni kanssa töissä. Olen stressaantunut koska he usein sivuuttavat mielipiteeni.","ja":"会社でチームリーダーとの関係があまりよくないんだ。自分の意見を無視されることが多くてストレスを受けてる。","zh-CN":"在公司和组长关系有点不好。经常忽视我的意见，压力很大。"}},{"speaker":"지수","text":"그건 정말 힘들겠다. 구체적으로 어떤 상황이야?","trans":{"en":"That must be really tough. What's the specific situation?","de":"Das muss wirklich schwer sein. Was ist die konkrete Situation?","fr":"Ce doit être vraiment difficile. Quelle est la situation concrète ?","es":"Eso debe ser muy difícil. ¿Cuál es la situación concreta?","pl":"To musi być naprawdę trudne. Jaka jest konkretna sytuacja?","it":"Deve essere davvero duro. Qual è la situazione concreta?","sv":"Det måste vara riktigt svårt. Vad är den konkreta situationen?","fi":"Se täytyy olla todella raskasta. Mikä on konkreettinen tilanne?","ja":"それは本当につらいね。具体的にどんな状況なの？","zh-CN":"那真的很辛苦啊。具体是什么情况？"}},{"speaker":"민준","text":"회의 중에 내가 새 아이디어를 제안하면 팀장님이 항상 일단 무시하고 넘어가. 나중에 다른 사람이 같은 말을 하면 칭찬을 해줘.","trans":{"en":"When I suggest new ideas during meetings, the team leader always just ignores them and moves on. Later, when someone else says the same thing, they get praised.","de":"Wenn ich in Besprechungen neue Ideen vorschlage, ignoriert der Teamleiter sie immer und geht weiter. Später, wenn jemand anderes dasselbe sagt, wird er gelobt.","fr":"Quand je propose de nouvelles idées en réunion, le chef d'équipe les ignore toujours et passe à autre chose. Plus tard, quand quelqu'un d'autre dit la même chose, il est félicité.","es":"Cuando propongo nuevas ideas en las reuniones, el jefe de equipo siempre las ignora y sigue adelante. Más tarde, cuando alguien más dice lo mismo, recibe elogios.","pl":"Kiedy proponuję nowe pomysły podczas spotkań, lider zespołu zawsze je ignoruje i idzie dalej. Później, gdy ktoś inny powie to samo, otrzymuje pochwały.","it":"Quando propongo nuove idee durante le riunioni, il capo squadra le ignora sempre e va avanti. Più tardi, quando qualcun altro dice la stessa cosa, riceve lodi.","sv":"När jag föreslår nya idéer under möten ignorerar teamledaren dem alltid och går vidare. Senare, när någon annan säger samma sak, blir de berömda.","fi":"Kun ehdotan uusia ideoita kokouksissa, tiimipäällikkö aina vain sivuuttaa ne ja jatkaa. Myöhemmin kun joku muu sanoo saman asian, heitä kehutaan.","ja":"会議中に新しいアイデアを提案すると、チームリーダーはいつも一旦無視して進んでいく。後で別の人が同じことを言うと褒めてくれる。","zh-CN":"开会时我提出新想法，组长总是直接忽视。但后来别人说同样的话，他就表扬。"}},{"speaker":"지수","text":"그 상황이 반복된다면 정말 답답하겠다. 혹시 팀장님한테 직접 얘기해 본 적 있어?","trans":{"en":"If that situation keeps repeating, it must be really frustrating. Have you ever tried talking to the team leader directly?","de":"Wenn sich diese Situation wiederholt, muss das wirklich frustrierend sein. Hast du schon mal direkt mit dem Teamleiter geredet?","fr":"Si cette situation se répète, ça doit être vraiment frustrant. Tu as déjà essayé de parler directement au chef d'équipe ?","es":"Si esa situación sigue repitiéndose, debe ser muy frustrante. ¿Has intentado hablar directamente con el jefe de equipo?","pl":"Jeśli ta sytuacja się powtarza, musi być naprawdę frustrująca. Czy rozmawiałeś kiedyś bezpośrednio z liderem zespołu?","it":"Se quella situazione continua a ripetersi, deve essere davvero frustrante. Hai mai provato a parlare direttamente con il capo squadra?","sv":"Om den situationen fortsätter att upprepas måste det vara riktigt frustrerande. Har du försökt prata direkt med teamledaren?","fi":"Jos tilanne toistuu, se täytyy olla todella turhauttavaa. Oletko koskaan yrittänyt puhua suoraan tiimipäällikölle?","ja":"その状況が繰り返されるなら本当にもどかしいね。チームリーダーに直接話してみたことある？","zh-CN":"如果这种情况一直重复，真的很憋屈。你有没有直接跟组长说过？"}},{"speaker":"민준","text":"아니, 아직 못 했어. 어떻게 말을 꺼내야 할지 몰라서.","trans":{"en":"No, not yet. I don't know how to bring it up.","de":"Nein, noch nicht. Ich weiß nicht, wie ich das Thema ansprechen soll.","fr":"Non, pas encore. Je ne sais pas comment aborder le sujet.","es":"No, todavía no. No sé cómo sacar el tema.","pl":"Nie, jeszcze nie. Nie wiem, jak poruszyć ten temat.","it":"No, non ancora. Non so come affrontare l'argomento.","sv":"Nej, inte ännu. Jag vet inte hur jag ska ta upp det.","fi":"En, en vielä. En tiedä miten ottaa se puheeksi.","ja":"いや、まだできてない。どうやって話を切り出せばいいかわからなくて。","zh-CN":"没有，还没有。不知道怎么开口。"}},{"speaker":"지수","text":"조심스럽게 일대일 대화를 청해봐. '따로 말씀드릴 게 있어요'라고 하면서 회의 외에 개인적으로 만나자고 하는 게 좋아.","trans":{"en":"Carefully ask for a one-on-one conversation. It's good to say 'I have something to tell you separately' and ask to meet personally outside of meetings.","de":"Bitte vorsichtig um ein Vier-Augen-Gespräch. Es ist gut zu sagen 'Ich habe etwas separat zu sagen' und darum zu bitten, sich außerhalb von Besprechungen persönlich zu treffen.","fr":"Demande prudemment une conversation en tête-à-tête. C'est bien de dire 'J'ai quelque chose à vous dire séparément' et de demander à se rencontrer personnellement en dehors des réunions.","es":"Pide con cuidado una conversación uno a uno. Es bueno decir 'Tengo algo que decirle por separado' y pedir encontrarse personalmente fuera de las reuniones.","pl":"Ostrożnie poproś o rozmowę w cztery oczy. Dobrze jest powiedzieć 'Mam coś do powiedzenia osobno' i poprosić o osobiste spotkanie poza zebraniami.","it":"Chiedi con cautela una conversazione uno a uno. È bene dire 'Ho qualcosa da dirti separatamente' e chiedere di incontrarsi personalmente al di fuori delle riunioni.","sv":"Be försiktigt om ett enskilt samtal. Det är bra att säga 'Jag har något att berätta separat' och be om att träffas personligen utanför möten.","fi":"Pyydä varovasti kahden kesken käytävää keskustelua. On hyvä sanoa 'Minulla on jotain kerrottavaa erikseen' ja pyytää tapaamaan henkilökohtaisesti kokousten ulkopuolella.","ja":"慎重に一対一の会話を求めてみて。「別にお話ししたいことがあります」と言いながら、会議以外に個人的に会おうと言うのがいいよ。","zh-CN":"小心地请求私下谈话。说'我有些事想单独跟您说'，请求在开会以外的时间私下见面比较好。"}},{"speaker":"민준","text":"그렇게 하면 기분 나쁘게 받아들이지 않을까?","trans":{"en":"Won't they take it the wrong way and feel bad?","de":"Wird er das nicht negativ aufnehmen und sich schlecht fühlen?","fr":"Est-ce qu'il ne le prendra pas mal et ne se sentira pas blessé ?","es":"¿No lo tomará a mal y se sentirá ofendido?","pl":"Czy nie weźmie tego źle i nie poczuje się urażony?","it":"Non lo prenderà nel modo sbagliato e si sentirà male?","sv":"Kommer han inte att ta det illa upp och känna sig dålig?","fi":"Eikö hän ota sen huonosti ja tunne pahaa mieltä?","ja":"そうすると、悪く受け取らないかな？","zh-CN":"这样做的话，会不会被误解，不高兴呢？"}},{"speaker":"지수","text":"태도가 중요해. 비판하는 게 아니라 도움을 구한다는 자세로 '제가 더 잘하려면 어떻게 해야 할까요?'라고 물어봐. 그러면 훨씬 부드럽게 대화할 수 있을 거야.","trans":{"en":"Attitude is important. Ask 'What should I do to do better?' as if you're seeking help rather than criticizing. That way you'll be able to have a much smoother conversation.","de":"Die Einstellung ist wichtig. Frage 'Was soll ich tun, um besser zu werden?' als würdest du um Hilfe bitten und nicht kritisieren. Dann kannst du ein viel sanfteres Gespräch führen.","fr":"L'attitude est importante. Pose la question 'Que devrais-je faire pour mieux faire ?' comme si tu cherchais de l'aide plutôt qu'à critiquer. Ainsi tu pourras avoir une conversation beaucoup plus douce.","es":"La actitud es importante. Pregunta '¿Qué debería hacer para hacerlo mejor?' como si buscaras ayuda en lugar de criticar. Así podrás tener una conversación mucho más suave.","pl":"Postawa jest ważna. Zapytaj 'Co powinienem zrobić, żeby robić to lepiej?' jakbyś szukał pomocy, a nie krytykował. W ten sposób będziesz mógł prowadzić o wiele łagodniejszą rozmowę.","it":"L'atteggiamento è importante. Chiedi 'Cosa dovrei fare per fare meglio?' come se stessi cercando aiuto piuttosto che criticando. In questo modo potrai avere una conversazione molto più morbida.","sv":"Attityd är viktigt. Fråga 'Vad ska jag göra för att göra det bättre?' som om du söker hjälp snarare än att kritisera. Då kan du ha en mycket smidigare konversation.","fi":"Asenne on tärkeä. Kysy 'Mitä minun pitäisi tehdä tehdäkseni paremmin?' kuin hakisit apua eikä kritisoisit. Siten voit käydä paljon sujuvampaa keskustelua.","ja":"態度が大切だよ。批判するんじゃなくて助けを求めるという姿勢で「もっとうまくやるにはどうすればいいですか？」と聞いてみて。そうすれば、ずっとスムーズに会話できると思うよ。","zh-CN":"态度很重要。不是批评，而是以寻求帮助的态度问'我要怎么做才能做得更好？'。这样的话会更顺畅地交谈。"}}],"vocab":[{"word":"고민","trans":{"en":"worry / concern","de":"Sorge","fr":"souci","es":"preocupación","pl":"troska","it":"preoccupazione","sv":"oro","fi":"huoli","ja":"悩み","zh-CN":"烦恼"}},{"word":"무시하다","trans":{"en":"to ignore","de":"ignorieren","fr":"ignorer","es":"ignorar","pl":"ignorować","it":"ignorare","sv":"ignorera","fi":"sivuuttaa","ja":"無視する","zh-CN":"忽视"}},{"word":"답답하다","trans":{"en":"frustrating / suffocating","de":"frustrierend","fr":"frustrant","es":"frustrante","pl":"frustrujący","it":"frustrante","sv":"frustrerande","fi":"turhauttava","ja":"もどかしい","zh-CN":"憋闷"}},{"word":"조언","trans":{"en":"advice","de":"Rat","fr":"conseil","es":"consejo","pl":"rada","it":"consiglio","sv":"råd","fi":"neuvo","ja":"アドバイス","zh-CN":"建议"}},{"word":"일대일","trans":{"en":"one-on-one","de":"Vier-Augen","fr":"en tête-à-tête","es":"uno a uno","pl":"w cztery oczy","it":"uno a uno","sv":"enskilt","fi":"kahden kesken","ja":"一対一","zh-CN":"一对一"}},{"word":"태도","trans":{"en":"attitude","de":"Einstellung","fr":"attitude","es":"actitud","pl":"postawa","it":"atteggiamento","sv":"attityd","fi":"asenne","ja":"態度","zh-CN":"态度"}},{"word":"말을 꺼내다","trans":{"en":"to bring up a topic","de":"ein Thema ansprechen","fr":"aborder un sujet","es":"sacar el tema","pl":"poruszyć temat","it":"affrontare un argomento","sv":"ta upp ett ämne","fi":"ottaa asia puheeksi","ja":"話を切り出す","zh-CN":"开口提起"}}],"patterns":[{"pattern":"이야기 좀 해도 돼?","patternTrans":{"en":"Can I talk to you for a bit?","de":"Kann ich kurz mit dir reden?","fr":"Est-ce que je peux te parler un peu ?","es":"¿Puedo hablar contigo un momento?","pl":"Czy mogę z tobą chwilę porozmawiać?","it":"Posso parlarti un po'?","sv":"Kan jag prata med dig lite?","fi":"Voiko puhua sinulle hetken?","ja":"少し話してもいい？","zh-CN":"可以跟你聊一下吗？"},"example":"요즘 고민이 있어서 이야기 좀 해도 돼?","trans":{"en":"I have a concern lately. Can I talk to you for a bit?","de":"Ich mache mir neuerdings Sorgen. Kann ich kurz mit dir reden?","fr":"J'ai quelque chose qui me préoccupe. Est-ce que je peux te parler un peu ?","es":"Tengo una preocupación últimamente. ¿Puedo hablar contigo un momento?","pl":"Ostatnio mam pewne martwienie. Czy mogę z tobą chwilę porozmawiać?","it":"Ultimamente ho una preoccupazione. Posso parlarti un po'?","sv":"Jag har en oro på sistone. Kan jag prata med dig lite?","fi":"Minulla on viime aikoina huoli. Voiko puhua sinulle hetken?","ja":"最近悩みがあって少し話してもいい？","zh-CN":"我最近有点烦恼，可以跟你聊一下吗？"}},{"pattern":"~을/를 할 때가 많아서 스트레스를 받아","patternTrans":{"en":"I'm stressed because ~ often happens","de":"Ich bin gestresst, weil ~ oft passiert","fr":"Je suis stressé parce que ~ arrive souvent","es":"Estoy estresado porque ~ ocurre frecuentemente","pl":"Jestem zestresowany, bo ~ zdarza się często","it":"Sono stressato perché ~ succede spesso","sv":"Jag är stressad för att ~ händer ofta","fi":"Olen stressaantunut koska ~ tapahtuu usein","ja":"～することが多くてストレスを受けてる","zh-CN":"因为经常～所以压力很大"},"example":"내 의견을 무시할 때가 많아서 스트레스를 받아.","trans":{"en":"I'm stressed because they often ignore my opinions.","de":"Ich bin gestresst, weil sie meine Meinungen oft ignorieren.","fr":"Je suis stressé parce qu'il ignore souvent mes opinions.","es":"Estoy estresado porque a menudo ignoran mis opiniones.","pl":"Jestem zestresowany, bo często ignorują moje opinie.","it":"Sono stressato perché ignorano spesso le mie opinioni.","sv":"Jag är stressad för att de ofta ignorerar mina åsikter.","fi":"Olen stressaantunut koska he usein sivuuttavat mielipiteeni.","ja":"自分の意見を無視されることが多くてストレスを受けてる。","zh-CN":"经常忽视我的意见，压力很大。"}},{"pattern":"~는 게 아니라 ~는 자세로","patternTrans":{"en":"Not ~ but with the attitude of ~","de":"Nicht ~ sondern mit der Einstellung ~","fr":"Pas ~ mais avec l'attitude de ~","es":"No ~ sino con la actitud de ~","pl":"Nie ~ ale z postawą ~","it":"Non ~ ma con l'atteggiamento di ~","sv":"Inte ~ utan med inställningen att ~","fi":"Ei ~ vaan ~n asenteella","ja":"～するんじゃなくて～という姿勢で","zh-CN":"不是～而是以～的态度"},"example":"비판하는 게 아니라 도움을 구한다는 자세로 물어봐.","trans":{"en":"Ask with the attitude of seeking help, not criticizing.","de":"Frag mit der Einstellung, Hilfe zu suchen, nicht zu kritisieren.","fr":"Pose la question avec l'attitude de chercher de l'aide, pas de critiquer.","es":"Pregunta con la actitud de buscar ayuda, no de criticar.","pl":"Zapytaj z postawą szukania pomocy, nie krytyki.","it":"Chiedi con l'atteggiamento di cercare aiuto, non di criticare.","sv":"Fråga med inställningen att söka hjälp, inte kritisera.","fi":"Kysy avun hakemisen asenteella, ei kritiikin.","ja":"批判するんじゃなくて助けを求めるという姿勢で聞いてみて。","zh-CN":"不是批评，而是以寻求帮助的态度问。"}}],"quizzes":[{"type":"이해","questionAudio":"민준의 회사 고민은 무엇입니까?","questionTrans":{"en":"What is Minjun's work concern?","de":"Was ist Minjuns Arbeitsproblem?","fr":"Quel est le problème professionnel de Minjun ?","es":"¿Cuál es la preocupación laboral de Minjun?","pl":"Jaki jest problem Minjuna w pracy?","it":"Qual è il problema lavorativo di Minjun?","sv":"Vad är Minjuns jobbproblem?","fi":"Mikä on Minjunin työhuoli?","ja":"ミンジュンの会社での悩みは何ですか？","zh-CN":"民俊在公司的烦恼是什么？"},"options":[{"text":"월급이 적다","trans":{"en":"The salary is low","de":"Das Gehalt ist niedrig","fr":"Le salaire est bas","es":"El salario es bajo","pl":"Wypłata jest niska","it":"Lo stipendio è basso","sv":"Lönen är låg","fi":"Palkka on alhainen","ja":"給料が少ない","zh-CN":"工资少"}},{"text":"팀장님이 자신의 의견을 무시한다","trans":{"en":"The team leader ignores his opinions","de":"Der Teamleiter ignoriert seine Meinungen","fr":"Le chef d'équipe ignore ses opinions","es":"El jefe de equipo ignora sus opiniones","pl":"Lider zespołu ignoruje jego opinie","it":"Il capo squadra ignora le sue opinioni","sv":"Teamledaren ignorerar hans åsikter","fi":"Tiimipäällikkö sivuuttaa hänen mielipiteensä","ja":"チームリーダーが自分の意見を無視する","zh-CN":"组长忽视自己的意见"}},{"text":"동료들과 사이가 나쁘다","trans":{"en":"He doesn't get along with coworkers","de":"Er versteht sich nicht mit seinen Kollegen","fr":"Il ne s'entend pas avec ses collègues","es":"No se lleva bien con sus compañeros","pl":"Nie dogaduje się z kolegami z pracy","it":"Non va d'accordo con i colleghi","sv":"Han kommer inte bra överens med kollegorna","fi":"Hän ei tule toimeen työtovereidensa kanssa","ja":"同僚と仲が悪い","zh-CN":"和同事关系不好"}},{"text":"일이 너무 많다","trans":{"en":"There is too much work","de":"Es gibt zu viel Arbeit","fr":"Il y a trop de travail","es":"Hay demasiado trabajo","pl":"Jest za dużo pracy","it":"C'è troppo lavoro","sv":"Det finns för mycket arbete","fi":"Töitä on liikaa","ja":"仕事が多すぎる","zh-CN":"工作太多"}}],"answer":1,"explanation":"민준은 팀장님이 회의에서 자신의 의견을 무시한다고 했습니다."},{"type":"이해","questionAudio":"민준이 팀장에게 직접 이야기하지 못한 이유는 무엇입니까?","questionTrans":{"en":"Why hasn't Minjun talked directly to the team leader?","de":"Warum hat Minjun nicht direkt mit dem Teamleiter gesprochen?","fr":"Pourquoi Minjun n'a-t-il pas parlé directement au chef d'équipe ?","es":"¿Por qué Minjun no ha hablado directamente con el jefe de equipo?","pl":"Dlaczego Minjun nie rozmawiał bezpośrednio z liderem zespołu?","it":"Perché Minjun non ha parlato direttamente con il capo squadra?","sv":"Varför har Minjun inte pratat direkt med teamledaren?","fi":"Miksi Minjun ei ole puhunut suoraan tiimipäällikölle?","ja":"ミンジュンがチームリーダーに直接話せない理由は何ですか？","zh-CN":"民俊没有直接跟组长说的原因是什么？"},"options":[{"text":"시간이 없어서","trans":{"en":"Because there is no time","de":"Weil keine Zeit ist","fr":"Parce qu'il n'y a pas de temps","es":"Porque no hay tiempo","pl":"Ponieważ nie ma czasu","it":"Perché non c'è tempo","sv":"För att det inte finns tid","fi":"Koska ei ole aikaa","ja":"時間がないから","zh-CN":"因为没时间"}},{"text":"어떻게 말을 꺼내야 할지 몰라서","trans":{"en":"Because he doesn't know how to bring it up","de":"Weil er nicht weiß, wie er das Thema ansprechen soll","fr":"Parce qu'il ne sait pas comment aborder le sujet","es":"Porque no sabe cómo sacar el tema","pl":"Ponieważ nie wie, jak poruszyć temat","it":"Perché non sa come affrontare l'argomento","sv":"För att han inte vet hur han ska ta upp det","fi":"Koska ei tiedä miten ottaa asia puheeksi","ja":"どうやって話を切り出せばいいかわからないから","zh-CN":"因为不知道怎么开口"}},{"text":"팀장님이 너무 바빠서","trans":{"en":"Because the team leader is too busy","de":"Weil der Teamleiter zu beschäftigt ist","fr":"Parce que le chef d'équipe est trop occupé","es":"Porque el jefe de equipo está demasiado ocupado","pl":"Ponieważ lider zespołu jest zbyt zajęty","it":"Perché il capo squadra è troppo occupato","sv":"För att teamledaren är för upptagen","fi":"Koska tiimipäällikkö on liian kiireinen","ja":"チームリーダーが忙しすぎるから","zh-CN":"因为组长太忙了"}},{"text":"회사 규정 때문에","trans":{"en":"Because of company regulations","de":"Wegen Unternehmensregeln","fr":"En raison des règles de l'entreprise","es":"Debido a las reglas de la empresa","pl":"Z powodu przepisów firmy","it":"A causa delle regole aziendali","sv":"På grund av företagets regler","fi":"Yrityksen sääntöjen takia","ja":"会社の規定のため","zh-CN":"因为公司规定"}}],"answer":1,"explanation":"민준은 어떻게 말을 꺼내야 할지 몰라서 아직 직접 이야기하지 못했다고 했습니다."},{"type":"이해","questionAudio":"지수는 민준에게 어떤 방식으로 팀장과 대화하라고 조언했습니까?","questionTrans":{"en":"What method did Jisu advise Minjun to use when talking to the team leader?","de":"Welche Methode empfahl Jisu Minjun für das Gespräch mit dem Teamleiter?","fr":"Quelle méthode Jisu a-t-il conseillé à Minjun d'utiliser pour parler au chef d'équipe ?","es":"¿Qué método aconsejó Jisu a Minjun para hablar con el jefe de equipo?","pl":"Jaką metodę Jisu poradziła Minjunowi do rozmowy z liderem zespołu?","it":"Quale metodo ha consigliato Jisu a Minjun per parlare con il capo squadra?","sv":"Vilken metod rådde Jisu Minjun att använda när han pratar med teamledaren?","fi":"Mitä menetelmää Jisu neuvoi Minjunia käyttämään tiimipäällikön kanssa puhuessa?","ja":"ジスはミンジュンにチームリーダーとどのような方法で話すように助言しましたか？","zh-CN":"智秀建议民俊用什么方式和组长谈话？"},"options":[{"text":"강하게 불만을 표현한다","trans":{"en":"Express dissatisfaction strongly","de":"Unzufriedenheit stark ausdrücken","fr":"Exprimer fortement son mécontentement","es":"Expresar la insatisfacción con fuerza","pl":"Silnie wyrażać niezadowolenie","it":"Esprimere fortemente l'insoddisfazione","sv":"Uttrycka missnöje starkt","fi":"Ilmaista tyytymättömyyttä vahvasti","ja":"強く不満を表現する","zh-CN":"强烈表达不满"}},{"text":"이메일로 의견을 전달한다","trans":{"en":"Convey opinions via email","de":"Meinungen per E-Mail mitteilen","fr":"Transmettre les opinions par e-mail","es":"Transmitir opiniones por correo electrónico","pl":"Przekazać opinie przez e-mail","it":"Trasmettere le opinioni via email","sv":"Förmedla åsikter via e-post","fi":"Välittää mielipiteitä sähköpostitse","ja":"メールで意見を伝える","zh-CN":"通过邮件传达意见"}},{"text":"도움을 구한다는 자세로 일대일 대화를 한다","trans":{"en":"Have a one-on-one conversation with the attitude of seeking help","de":"Ein Vier-Augen-Gespräch mit der Einstellung führen, Hilfe zu suchen","fr":"Avoir une conversation en tête-à-tête avec l'attitude de chercher de l'aide","es":"Tener una conversación uno a uno con la actitud de buscar ayuda","pl":"Prowadzić rozmowę w cztery oczy z postawą szukania pomocy","it":"Avere una conversazione uno a uno con l'atteggiamento di cercare aiuto","sv":"Ha ett enskilt samtal med inställningen att söka hjälp","fi":"Käydä kahden kesken keskustelu avun hakemisen asenteella","ja":"助けを求めるという姿勢で一対一の会話をする","zh-CN":"以寻求帮助的态度进行一对一谈话"}},{"text":"동료들에게 먼저 이야기한다","trans":{"en":"Talk to coworkers first","de":"Zuerst mit Kollegen reden","fr":"Parler d'abord aux collègues","es":"Hablar primero con los compañeros","pl":"Najpierw porozmawiać z kolegami","it":"Prima parlare con i colleghi","sv":"Prata med kollegorna först","fi":"Puhua työtovereille ensin","ja":"同僚にまず話す","zh-CN":"先跟同事说"}}],"answer":2,"explanation":"지수는 도움을 구한다는 자세로 '제가 더 잘하려면 어떻게 해야 할까요?'라고 물으며 일대일로 이야기하라고 조언했습니다."}]},
  21: {"id":21,"title":"날씨와 계절","titleTrans":{"en":"Weather and Seasons","de":"Wetter und Jahreszeiten","fr":"La météo et les saisons","es":"El tiempo y las estaciones","pl":"Pogoda i pory roku","it":"Il tempo e le stagioni","sv":"Väder och årstider","fi":"Sää ja vuodenajat","ja":"天気と季節","zh-CN":"天气与季节"},"desc":"날씨 변화와 계절 활동 계획 이야기","descTrans":{"en":"Talking about weather changes and planning seasonal activities","de":"Über Wetteränderungen und saisonale Aktivitäten sprechen","fr":"Parler des changements météorologiques et planifier des activités saisonnières","es":"Hablar sobre los cambios climáticos y planificar actividades estacionales","pl":"Rozmowa o zmianach pogody i planowanie sezonowych aktywności","it":"Parlare dei cambiamenti meteorologici e pianificare attività stagionali","sv":"Prata om väderförändringar och planera säsongsaktiviteter","fi":"Puhua säämuutoksista ja suunnitella kausiluonteisia aktiviteetteja","ja":"天気の変化や季節のアクティビティの計画について話す","zh-CN":"讨论天气变化和计划季节性活动"},"dialogue":[{"speaker":"지수","text":"오늘 날씨가 갑자기 많이 추워졌네요. 예보에서는 따뜻하다고 했는데.","trans":{"en":"It suddenly got a lot colder today. The forecast said it would be warm.","de":"Heute ist es plötzlich viel kälter geworden. Die Vorhersage sagte, es würde warm sein.","fr":"Il fait soudainement beaucoup plus froid aujourd'hui. Les prévisions disaient qu'il ferait chaud.","es":"De repente hoy hace mucho más frío. El pronóstico decía que haría calor.","pl":"Dziś nagle zrobiło się o wiele zimniej. Prognoza mówiła, że będzie ciepło.","it":"Oggi è improvvisamente diventato molto più freddo. Le previsioni dicevano che sarebbe stato caldo.","sv":"Det har plötsligt blivit mycket kallare idag. Prognosen sa att det skulle bli varmt.","fi":"Tänään on yhtäkkiä tullut paljon kylmempää. Ennuste sanoi, että olisi lämmin.","ja":"今日は急に寒くなりましたね。予報では暖かいと言っていたのに。","zh-CN":"今天突然变得很冷。天气预报说会很暖和的。"}},{"speaker":"민준","text":"맞아요. 요즘 날씨가 너무 변덕스럽죠. 일교차도 크고요.","trans":{"en":"Right. The weather has been so unpredictable lately. The temperature swings are big too.","de":"Stimmt. Das Wetter ist in letzter Zeit so unbeständig. Die Temperaturschwankungen sind auch groß.","fr":"C'est vrai. Le temps est tellement imprévisible ces derniers temps. Les écarts de température sont aussi importants.","es":"Exacto. El tiempo ha sido muy impredecible últimamente. Los cambios de temperatura también son grandes.","pl":"Zgadza się. Pogoda jest ostatnio bardzo zmienna. Wahania temperatur też są duże.","it":"Esatto. Il tempo è stato così imprevedibile ultimamente. Anche le oscillazioni di temperatura sono grandi.","sv":"Precis. Vädret har varit så oförutsägbart på sistone. Temperatursvängningarna är också stora.","fi":"Aivan. Sää on ollut niin arvaamaton viime aikoina. Lämpötilanvaihtelutkin ovat suuria.","ja":"そうですね。最近の天気は気まぐれすぎますよね。日較差も大きいし。","zh-CN":"是啊。最近天气太多变了。温差也很大。"}},{"speaker":"지수","text":"이제 가을이 완전히 깊어졌나봐요. 단풍도 절정이고 낙엽도 많이 쌓였어요.","trans":{"en":"Autumn seems to have deepened fully now. The fall colors are at their peak and lots of leaves have piled up.","de":"Es scheint, dass der Herbst jetzt vollständig eingesetzt hat. Die Herbstfarben sind auf ihrem Höhepunkt und es haben sich viele Blätter angesammelt.","fr":"L'automne semble s'être pleinement installé maintenant. Les couleurs d'automne sont à leur apogée et beaucoup de feuilles se sont accumulées.","es":"El otoño parece haberse profundizado por completo. Los colores otoñales están en su punto álgido y se han acumulado muchas hojas.","pl":"Wygląda na to, że jesień w pełni się pogłębiła. Jesienne kolory są u szczytu i nazbierało się dużo liści.","it":"L'autunno sembra essersi approfondito completamente ora. I colori autunnali sono al loro apice e si sono accumulate molte foglie.","sv":"Hösten verkar ha fördjupats fullständigt nu. Höstfärgerna är på sin topp och många löv har hopat sig.","fi":"Syksy näyttää syventyneen täysin nyt. Syysvärit ovat huipussaan ja lehtiä on kertynyt paljon.","ja":"もう秋が完全に深まったみたいですね。紅葉も見頃で落ち葉もたくさん積もっています。","zh-CN":"秋天好像完全深了
