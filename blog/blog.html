ore.","pl":"Mam nadzieję, że sytuacja gospodarcza się poprawi.","it":"Spero che la situazione economica migliori.","sv":"Jag hoppas att den ekonomiska situationen förbättras.","fi":"Toivon, että taloudellinen tilanne paranee.","ja":"経済状況が改善されればいいですね。","zh-CN":"希望经济形势能好转就好了。"}}],"quizzes":[{"type":"이해","questionAudio":"수진 씨는 물가가 오른 후 어떤 변화를 가장 먼저 말했나요?","questionTrans":{"en":"What change did Sujin mention first after prices rose?","de":"Welche Veränderung erwähnte Sujin zuerst nach dem Preisanstieg?","fr":"Quel changement Sujin a-t-elle mentionné en premier après la hausse des prix ?","es":"¿Qué cambio mencionó primero Sujin después de que subieron los precios?","pl":"Jaką zmianę jako pierwszą wspomniała Sujin po wzroście cen?","it":"Quale cambiamento ha menzionato prima Sujin dopo l'aumento dei prezzi?","sv":"Vilken förändring nämnde Sujin först efter att priserna steg?","fi":"Minkä muutoksen Sujin mainitsi ensin hintojen noustua?","ja":"物価が上がった後、スジンさんが最初に話した変化は何ですか？","zh-CN":"物价上涨后，秀珍首先提到了什么变化？"},"options":[{"text":"구독 서비스를 정리했다","trans":{"en":"She cleared out subscription services","de":"Sie räumte Abonnementdienste auf","fr":"Elle a nettoyé les services d'abonnement","es":"Ella limpió los servicios de suscripción","pl":"Wyczyściła usługi subskrypcji","it":"Ha eliminato i servizi in abbonamento","sv":"Hon rensade upp prenumerationstjänster","fi":"Hän siivosi tilauspalvelut","ja":"サブスクリプションサービスを整理した","zh-CN":"整理了订阅服务"}},{"text":"외식을 줄이고 집에서 요리를 늘렸다","trans":{"en":"She cut back on eating out and cooked more at home","de":"Sie reduzierte auswärts essen und kochte mehr zu Hause","fr":"Elle a réduit les repas au restaurant et cuisinait plus à la maison","es":"Redujo comer fuera y cocinó más en casa","pl":"Ograniczyła jedzenie na mieście i częściej gotowała w domu","it":"Ha ridotto i pasti fuori e cucinato di più a casa","sv":"Hon minskade ätandet ute och lagade mer mat hemma","fi":"Hän vähensi ulkona syömistä ja laittoi enemmän ruokaa kotona","ja":"外食を減らして家での料理を増やした","zh-CN":"减少外出就餐，增加在家做饭"}},{"text":"중고 물건만 구매하기 시작했다","trans":{"en":"She started buying only second-hand items","de":"Sie begann, nur gebrauchte Artikel zu kaufen","fr":"Elle a commencé à acheter uniquement des articles d'occasion","es":"Empezó a comprar solo artículos de segunda mano","pl":"Zaczęła kupować tylko używane przedmioty","it":"Ha iniziato ad acquistare solo articoli di seconda mano","sv":"Hon börjat köpa endast begagnade varor","fi":"Hän alkoi ostaa vain käytettyjä tavaroita","ja":"中古品だけ購入するようになった","zh-CN":"开始只购买二手物品"}},{"text":"할인 앱만 사용하게 됐다","trans":{"en":"She started using only discount apps","de":"Sie begann, nur Rabatt-Apps zu nutzen","fr":"Elle a commencé à utiliser uniquement des applications de réduction","es":"Empezó a usar solo aplicaciones de descuento","pl":"Zaczęła korzystać tylko z aplikacji rabatowych","it":"Ha iniziato a usare solo app di sconti","sv":"Hon började använda bara rabattappar","fi":"Hän alkoi käyttää vain alennussovelluksia","ja":"割引アプリだけを使うようになった","zh-CN":"开始只使用折扣应用"}}],"answer":1,"explanation":"수진 씨는 외식을 줄이고 집에서 요리하는 횟수를 늘렸다고 했습니다. 밀키트도 자주 사용한다고 했습니다."},{"type":"이해","questionAudio":"현우 씨가 구독 서비스를 정리한 이유는 무엇이에요?","questionTrans":{"en":"Why did Hyunwoo clear out his subscription services?","de":"Warum räumte Hyunwoo seine Abonnementdienste auf?","fr":"Pourquoi Hyunwoo a-t-il nettoyé ses services d'abonnement ?","es":"¿Por qué Hyunwoo limpió sus servicios de suscripción?","pl":"Dlaczego Hyunwoo wyczyścił swoje usługi subskrypcji?","it":"Perché Hyunwoo ha eliminato i suoi servizi in abbonamento?","sv":"Varför rensade Hyunwoo upp sina prenumerationstjänster?","fi":"Miksi Hyunwoo siivosi tilauspalvelunsa?","ja":"ヒョヌさんがサブスクリプションサービスを整理した理由は何ですか？","zh-CN":"贤宇整理订阅服务的原因是什么？"},"options":[{"text":"서비스 품질이 좋지 않아서","trans":{"en":"Because the service quality was poor","de":"Weil die Servicequalität schlecht war","fr":"Parce que la qualité du service était mauvaise","es":"Porque la calidad del servicio era mala","pl":"Ponieważ jakość usług była słaba","it":"Perché la qualità del servizio era scarsa","sv":"För att servicekvaliteten var dålig","fi":"Koska palvelun laatu oli huono","ja":"サービスの品質が良くなかったから","zh-CN":"因为服务质量不好"}},{"text":"더 좋은 서비스로 바꾸고 싶어서","trans":{"en":"Because he wanted to switch to better services","de":"Weil er zu besseren Diensten wechseln wollte","fr":"Parce qu'il voulait passer à de meilleurs services","es":"Porque quería cambiar a mejores servicios","pl":"Ponieważ chciał przejść na lepsze usługi","it":"Perché voleva passare a servizi migliori","sv":"För att han ville byta till bättre tjänster","fi":"Koska hän halusi vaihtaa parempiin palveluihin","ja":"より良いサービスに変えたかったから","zh-CN":"因为想换更好的服务"}},{"text":"쓰지 않는 서비스에 돈이 나가고 있었기 때문에","trans":{"en":"Because money was going out for services he wasn't using","de":"Weil Geld für Dienste ausging, die er nicht nutzte","fr":"Parce que l'argent partait pour des services qu'il n'utilisait pas","es":"Porque el dinero se iba por servicios que no estaba usando","pl":"Ponieważ pieniądze wychodziły na usługi, których nie używał","it":"Perché i soldi uscivano per servizi che non stava usando","sv":"För att pengar gick ut för tjänster han inte använde","fi":"Koska rahaa meni palveluihin, joita hän ei käyttänyt","ja":"使っていないサービスにお金が出ていっていたから","zh-CN":"因为钱在流向没有使用的服务"}},{"text":"회사에서 구독 비용을 지원하지 않아서","trans":{"en":"Because his company didn't support the subscription costs","de":"Weil sein Unternehmen die Abonnementkosten nicht unterstützte","fr":"Parce que son entreprise ne prenait pas en charge les coûts d'abonnement","es":"Porque su empresa no apoyaba los costos de suscripción","pl":"Ponieważ jego firma nie wspierała kosztów subskrypcji","it":"Perché la sua azienda non supportava i costi di abbonamento","sv":"För att hans företag inte stödde prenumerationskostnaderna","fi":"Koska hänen yrityksensä ei tukenut tilausmaksuja","ja":"会社が購読費用をサポートしてくれなかったから","zh-CN":"因为公司不支持订阅费用"}}],"answer":2,"explanation":"현우 씨는 '쓰지도 않는 것들에 돈이 나가고 있었더라고요'라고 했습니다. 사용하지 않는 구독 서비스에 돈을 낭비하고 있었기 때문입니다."},{"type":"이해","questionAudio":"두 사람은 소비 변화에서 어떤 긍정적인 점을 발견했나요?","questionTrans":{"en":"What positive aspect did the two people find in the change in spending?","de":"Welchen positiven Aspekt fanden die beiden Menschen in der Veränderung der Ausgaben?","fr":"Quel aspect positif les deux personnes ont-elles trouvé dans le changement de dépenses ?","es":"¿Qué aspecto positivo encontraron las dos personas en el cambio de gasto?","pl":"Jaki pozytywny aspekt znalazły dwie osoby w zmianie wydatków?","it":"Quale aspetto positivo hanno trovato le due persone nel cambiamento di spesa?","sv":"Vilken positiv aspekt hittade de två personerna i förändringen av utgifter?","fi":"Minkä positiivisen puolen kaksi ihmistä löysi kulutuksen muutoksessa?","ja":"二人は消費の変化にどんなポジティブな面を見出しましたか？","zh-CN":"两人在消费变化中发现了什么积极的方面？"},"options":[{"text":"돈을 더 많이 저축할 수 있게 됐다","trans":{"en":"They were able to save more money","de":"Sie konnten mehr Geld sparen","fr":"Ils ont pu économiser plus d'argent","es":"Pudieron ahorrar más dinero","pl":"Mogli zaoszczędzić więcej pieniędzy","it":"Hanno potuto risparmiare più denaro","sv":"De kunde spara mer pengar","fi":"He pystyivät säästämään enemmän rahaa","ja":"お金をより多く貯蓄できるようになった","zh-CN":"能够存更多的钱"}},{"text":"필요한 것과 원하는 것을 구별하는 법을 배웠다","trans":{"en":"They learned how to distinguish between what they need and what they want","de":"Sie lernten, zwischen dem, was sie brauchen, und dem, was sie wollen, zu unterscheiden","fr":"Ils ont appris à distinguer ce dont ils ont besoin et ce qu'ils veulent","es":"Aprendieron a distinguir entre lo que necesitan y lo que quieren","pl":"Nauczyli się odróżniać to, czego potrzebują, od tego, czego chcą","it":"Hanno imparato a distinguere tra ciò di cui hanno bisogno e ciò che vogliono","sv":"De lärde sig att skilja mellan vad de behöver och vad de vill ha","fi":"He oppivat erottamaan sen, mitä he tarvitsevat, siitä, mitä he haluavat","ja":"必要なものと欲しいものを区別する方法を学んだ","zh-CN":"学会了区分需要和想要"}},{"text":"더 건강한 음식을 먹게 됐다","trans":{"en":"They started eating healthier food","de":"Sie begannen, gesünderes Essen zu essen","fr":"Ils ont commencé à manger une nourriture plus saine","es":"Comenzaron a comer comida más saludable","pl":"Zaczęli jeść zdrowsze jedzenie","it":"Hanno iniziato a mangiare cibo più sano","sv":"De började äta hälsosammare mat","fi":"He alkoivat syödä terveellisempää ruokaa","ja":"より健康的な食事をするようになった","zh-CN":"开始吃更健康的食物"}},{"text":"새로운 취미를 찾게 됐다","trans":{"en":"They found new hobbies","de":"Sie fanden neue Hobbys","fr":"Ils ont trouvé de nouveaux passe-temps","es":"Encontraron nuevos pasatiempos","pl":"Znaleźli nowe hobby","it":"Hanno trovato nuovi hobby","sv":"De hittade nya hobbies","fi":"He löysivät uusia harrastuksia","ja":"新しい趣味を見つけた","zh-CN":"找到了新的爱好"}}],"answer":1,"explanation":"현우 씨가 '필요한 것과 원하는 것을 구별하는 법을 배운 것 같다'고 했고, 수진 씨도 소비에 대해 더 신중하게 생각하게 됐다고 동의했습니다."}]},
  29: {"id":29,"title":"자기 개발","titleTrans":{"en":"Self-Development","de":"Selbstentwicklung","fr":"Développement personnel","es":"Desarrollo personal","pl":"Samorozwój","it":"Sviluppo personale","sv":"Självutveckling","fi":"Itsensä kehittäminen","ja":"自己啓発","zh-CN":"自我提升"},"desc":"공부 방법과 자기 계발 목표 설정하기","descTrans":{"en":"Setting study methods and self-development goals","de":"Lernmethoden und Ziele zur Selbstentwicklung festlegen","fr":"Établir des méthodes d'étude et des objectifs de développement personnel","es":"Establecer métodos de estudio y metas de desarrollo personal","pl":"Ustalanie metod nauki i celów samorozwoju","it":"Impostare metodi di studio e obiettivi di sviluppo personale","sv":"Sätta upp studieteman och självutvecklingsmål","fi":"Opiskelumenetelmien ja itsensä kehittämistavoitteiden asettaminen","ja":"勉強方法と自己啓発目標の設定","zh-CN":"制定学习方法和自我提升目标"},"dialogue":[{"speaker":"지호","text":"수연아, 요즘 영어 공부를 어떻게 하고 있어?","trans":{"en":"Suyeon, how are you studying English these days?","de":"Suyeon, wie lernst du heutzutage Englisch?","fr":"Suyeon, comment tu étudies l'anglais ces temps-ci?","es":"Suyeon, ¿cómo estás estudiando inglés últimamente?","pl":"Suyeon, jak ostatnio uczysz się angielskiego?","it":"Suyeon, come stai studiando l'inglese ultimamente?","sv":"Suyeon, hur studerar du engelska nuförtiden?","fi":"Suyeon, miten olet opiskelut englantia viime aikoina?","ja":"スヨン、最近英語の勉強どうしてる？","zh-CN":"秀延，你最近是怎么学英语的？"}},{"speaker":"수연","text":"나는 매일 아침 팟캐스트를 들으면서 듣기 실력을 키우고 있어.","trans":{"en":"I'm building my listening skills by listening to podcasts every morning.","de":"Ich verbessere meine Hörfähigkeiten, indem ich jeden Morgen Podcasts höre.","fr":"J'améliore mes compétences en écoute en écoutant des podcasts chaque matin.","es":"Estoy desarrollando mis habilidades auditivas escuchando podcasts cada mañana.","pl":"Rozwijam umiejętności słuchania, słuchając podcastów każdego ranka.","it":"Sto migliorando le mie capacità di ascolto ascoltando podcast ogni mattina.","sv":"Jag förbättrar mina lyssnarfärdigheter genom att lyssna på podcasts varje morgon.","fi":"Kehitän kuuntelutaitojani kuuntelemalla podcasteja joka aamu.","ja":"毎朝ポッドキャストを聞いてリスニング力を鍛えているよ。","zh-CN":"我每天早上听播客来提高听力水平。"}},{"speaker":"지호","text":"정말? 그 방법이 효과적이야?","trans":{"en":"Really? Is that method effective?","de":"Wirklich? Ist diese Methode effektiv?","fr":"Vraiment? Cette méthode est-elle efficace?","es":"¿De verdad? ¿Es efectivo ese método?","pl":"Naprawdę? Czy ta metoda jest skuteczna?","it":"Davvero? Quel metodo è efficace?","sv":"Verkligen? Är den metoden effektiv?","fi":"Oikeasti? Onko tuo menetelmä tehokas?","ja":"本当？その方法って効果的なの？","zh-CN":"真的吗？那种方法有效吗？"}},{"speaker":"수연","text":"응, 꾸준히 하니까 확실히 귀가 트이더라고. 중요한 건 매일 조금씩 하는 거야.","trans":{"en":"Yes, since I do it consistently, my ears have definitely opened up. The important thing is doing a little bit every day.","de":"Ja, weil ich es konsequent tue, haben sich meine Ohren definitiv geöffnet. Das Wichtige ist, jeden Tag ein bisschen zu machen.","fr":"Oui, comme je le fais régulièrement, mes oreilles se sont vraiment ouvertes. L'important c'est de faire un peu chaque jour.","es":"Sí, como lo hago constantemente, mis oídos definitivamente se han abierto. Lo importante es hacer un poco cada día.","pl":"Tak, ponieważ robię to systematycznie, moje uszy zdecydowanie się otworzyły. Ważne jest robienie trochę każdego dnia.","it":"Sì, poiché lo faccio costantemente, le mie orecchie si sono decisamente aperte. La cosa importante è fare un po' ogni giorno.","sv":"Ja, eftersom jag gör det konsekvent har mina öron definitivt öppnat sig. Det viktiga är att göra lite varje dag.","fi":"Kyllä, koska teen sitä johdonmukaisesti, korvani ovat selvästi avautuneet. Tärkeää on tehdä vähän joka päivä.","ja":"うん、コツコツやってると確かに耳が開いてくるよ。大事なのは毎日少しずつやること。","zh-CN":"是的，因为坚持做，耳朵确实开了。重要的是每天做一点点。"}},{"speaker":"지호","text":"나는 단어 암기에만 집중해 왔는데 방법을 바꿔야겠다.","trans":{"en":"I've been focusing only on memorizing vocabulary — I think I need to change my method.","de":"Ich habe mich nur auf das Auswendiglernen von Vokabeln konzentriert — ich muss wohl meine Methode ändern.","fr":"Je me suis concentré uniquement sur la mémorisation du vocabulaire — je pense que je dois changer de méthode.","es":"Me he estado concentrando solo en memorizar vocabulario — creo que debo cambiar mi método.","pl":"Skupiałem się tylko na zapamiętywaniu słówek — chyba muszę zmienić metodę.","it":"Mi sono concentrato solo sulla memorizzazione del vocabolario — devo cambiare metodo.","sv":"Jag har bara fokuserat på att memorera ord — jag måste nog ändra metod.","fi":"Olen keskittynyt vain sanojen ulkoa opetteluun — täytyy kai muuttaa menetelmää.","ja":"僕は単語の暗記だけに集中してきたけど、方法を変えなきゃ。","zh-CN":"我一直只专注于背单词——看来我得改变方法了。"}},{"speaker":"수연","text":"단어도 중요하지만 문맥 속에서 익히는 게 더 오래 기억돼.","trans":{"en":"Vocabulary is important too, but learning words in context helps you remember them longer.","de":"Vokabeln sind auch wichtig, aber Wörter im Kontext zu lernen hilft, sie länger zu behalten.","fr":"Le vocabulaire est aussi important, mais apprendre les mots en contexte aide à les retenir plus longtemps.","es":"El vocabulario también es importante, pero aprender palabras en contexto te ayuda a recordarlas por más tiempo.","pl":"Słownictwo też jest ważne, ale uczenie się słów w kontekście pomaga je zapamiętać na dłużej.","it":"Il vocabolario è importante, ma imparare le parole nel contesto aiuta a ricordarle più a lungo.","sv":"Ordförråd är viktigt, men att lära sig ord i sammanhang hjälper dig att komma ihåg dem längre.","fi":"Sanasto on tärkeää, mutta sanojen oppiminen asiayhteydessä auttaa muistamaan ne pidempään.","ja":"単語も大事だけど、文脈の中で覚える方が長く記憶に残るよ。","zh-CN":"单词也很重要，但在语境中学习单词能记得更久。"}},{"speaker":"지호","text":"그렇구나. 올해 목표가 토익 800점인데, 현실적으로 가능할까?","trans":{"en":"I see. My goal this year is to score 800 on the TOEIC — is that realistically achievable?","de":"Ich verstehe. Mein Ziel für dieses Jahr ist ein TOEIC-Score von 800 — ist das realistisch erreichbar?","fr":"Je vois. Mon objectif cette année est d'obtenir 800 au TOEIC — est-ce réalistement faisable?","es":"Entiendo. Mi objetivo este año es sacar 800 en el TOEIC — ¿es realísticamente alcanzable?","pl":"Rozumiem. Moim celem na ten rok jest wynik 800 w TOEIC — czy to realistycznie osiągalne?","it":"Capisco. Il mio obiettivo quest'anno è 800 al TOEIC — è realisticamente raggiungibile?","sv":"Jag förstår. Mitt mål i år är att få 800 på TOEIC — är det realistiskt uppnåeligt?","fi":"Ymmärrän. Tavoitteeni tänä vuonna on 800 TOEIC:ssä — onko se realistisesti saavutettavissa?","ja":"なるほど。今年の目標はTOEIC800点なんだけど、現実的に可能かな？","zh-CN":"原来如此。我今年的目标是托业800分，现实可行吗？"}},{"speaker":"수연","text":"충분히 가능해! 계획을 세우고 꾸준히 노력하면 반드시 달성할 수 있어.","trans":{"en":"It's absolutely possible! If you make a plan and work consistently, you can definitely achieve it.","de":"Es ist absolut möglich! Wenn du einen Plan erstellst und konsequent arbeitest, kannst du es definitiv erreichen.","fr":"C'est absolument possible! Si tu fais un plan et travailles régulièrement, tu peux sûrement y arriver.","es":"¡Es absolutamente posible! Si haces un plan y trabajas con constancia, definitivamente puedes lograrlo.","pl":"To absolutnie możliwe! Jeśli zrobisz plan i będziesz regularnie pracować, na pewno to osiągniesz.","it":"È assolutamente possibile! Se fai un piano e lavori costantemente, puoi sicuramente raggiungere questo obiettivo.","sv":"Det är absolut möjligt! Om du gör en plan och arbetar konsekvent kan du definitivt uppnå det.","fi":"Se on täysin mahdollista! Jos teet suunnitelman ja teet töitä johdonmukaisesti, voit varmasti saavuttaa sen.","ja":"十分可能だよ！計画を立てて継続的に努力すれば、必ず達成できる。","zh-CN":"完全可以！制定计划并坚持努力的话，一定能实现的。"}},{"speaker":"지호","text":"고마워. 수연이 덕분에 동기부여가 됐어. 나도 듣기 연습부터 시작해 볼게.","trans":{"en":"Thank you. Thanks to you, Suyeon, I'm motivated. I'll start with listening practice too.","de":"Danke. Dank dir, Suyeon, bin ich motiviert. Ich werde auch mit dem Hörübung anfangen.","fr":"Merci. Grâce à toi, Suyeon, je suis motivé. Je vais commencer par les exercices d'écoute aussi.","es":"Gracias. Gracias a ti, Suyeon, estoy motivado. También empezaré con la práctica de escucha.","pl":"Dziękuję. Dzięki tobie, Suyeon, jestem zmotywowany. Też zacznę od ćwiczeń słuchania.","it":"Grazie. Grazie a te, Suyeon, sono motivato. Inizierò anche io con la pratica dell'ascolto.","sv":"Tack. Tack vare dig, Suyeon, är jag motiverad. Jag ska också börja med lyssningsövningar.","fi":"Kiitos. Sinun ansiostasi, Suyeon, olen motivoitunut. Aloitan myös kuunteluharjoittelusta.","ja":"ありがとう。スヨンのおかげでやる気が出たよ。僕もリスニング練習から始めてみる。","zh-CN":"谢谢你。多亏了你，秀延，我有了动力。我也从听力练习开始吧。"}},{"speaker":"수연","text":"화이팅! 같이 열심히 해보자.","trans":{"en":"Go for it! Let's work hard together.","de":"Weiter so! Lass uns gemeinsam hart arbeiten.","fr":"Allez! Travaillons dur ensemble.","es":"¡Ánimo! Esforcémonos juntos.","pl":"Trzymaj się! Ciężko pracujmy razem.","it":"Forza! Lavoriamo sodo insieme.","sv":"Kämpa på! Låt oss jobba hårt tillsammans.","fi":"Tsemppiä! Tehdään töitä yhdessä.","ja":"ファイト！一緒に頑張ろう。","zh-CN":"加油！我们一起努力吧。"}}],"vocab":[{"word":"자기 계발","trans":{"en":"self-development","de":"Selbstentwicklung","fr":"développement personnel","es":"desarrollo personal","pl":"samorozwój","it":"sviluppo personale","sv":"självutveckling","fi":"itsensä kehittäminen","ja":"自己啓発","zh-CN":"自我提升"}},{"word":"꾸준히","trans":{"en":"consistently / steadily","de":"konsequent / stetig","fr":"régulièrement / constamment","es":"constantemente / regularmente","pl":"konsekwentnie / systematycznie","it":"costantemente / regolarmente","sv":"konsekvent / stadigt","fi":"johdonmukaisesti / tasaisesti","ja":"コツコツ / 着実に","zh-CN":"持续地 / 稳步地"}},{"word":"목표","trans":{"en":"goal / target","de":"Ziel","fr":"objectif / but","es":"meta / objetivo","pl":"cel","it":"obiettivo / meta","sv":"mål","fi":"tavoite","ja":"目標","zh-CN":"目标"}},{"word":"동기부여","trans":{"en":"motivation","de":"Motivation","fr":"motivation","es":"motivación","pl":"motywacja","it":"motivazione","sv":"motivation","fi":"motivaatio","ja":"モチベーション","zh-CN":"动力 / 积极性"}},{"word":"효과적이다","trans":{"en":"to be effective","de":"effektiv sein","fr":"être efficace","es":"ser efectivo","pl":"być skutecznym","it":"essere efficace","sv":"vara effektiv","fi":"olla tehokas","ja":"効果的だ","zh-CN":"有效"}},{"word":"달성하다","trans":{"en":"to achieve / to accomplish","de":"erreichen / erzielen","fr":"accomplir / atteindre","es":"lograr / alcanzar","pl":"osiągnąć","it":"raggiungere / conseguire","sv":"uppnå / åstadkomma","fi":"saavuttaa","ja":"達成する","zh-CN":"实现 / 达成"}},{"word":"암기하다","trans":{"en":"to memorize","de":"auswendig lernen","fr":"mémoriser","es":"memorizar","pl":"zapamiętywać / uczyć się na pamięć","it":"memorizzare","sv":"memorera / lära sig utantill","fi":"opetella ulkoa","ja":"暗記する","zh-CN":"记忆 / 背诵"}},{"word":"귀가 트이다","trans":{"en":"ears to open up (listening improves)","de":"die Ohren öffnen sich (Hörverständnis verbessert sich)","fr":"les oreilles s'ouvrent (la compréhension auditive s'améliore)","es":"los oídos se abren (la comprensión auditiva mejora)","pl":"uszy się otwierają (słuchanie się poprawia)","it":"le orecchie si aprono (la comprensione auditiva migliora)","sv":"öronen öppnar sig (lyssnarförståelse förbättras)","fi":"korvat avautuvat (kuunteleminen paranee)","ja":"耳が開く（リスニング力が上がる）","zh-CN":"耳朵开了（听力水平提高）"}}],"patterns":[{"pattern":"-으면서","patternTrans":{"en":"while doing ~; simultaneously","de":"während man ~; gleichzeitig","fr":"en faisant ~; simultanément","es":"mientras hace ~; simultáneamente","pl":"robiąc jednocześnie ~; w tym samym czasie","it":"mentre fa ~; simultaneamente","sv":"medan man gör ~; samtidigt","fi":"samalla kun tekee ~; samanaikaisesti","ja":"〜しながら","zh-CN":"一边~一边~; 同时"},"example":"팟캐스트를 들으면서 운동해요.","trans":{"en":"I exercise while listening to a podcast.","de":"Ich trainiere, während ich einen Podcast höre.","fr":"Je fais de l'exercice en écoutant un podcast.","es":"Hago ejercicio mientras escucho un podcast.","pl":"Ćwiczę słuchając podcastu."   30: {"id":30,"title":"미래 계획","titleTrans":{"en":"Future Plans","de":"Zukunftspläne","fr":"Plans futurs","es":"Planes futuros","pl":"Plany na przyszłość","it":"Piani futuri","sv":"Framtidsplaner","fi":"Tulevaisuudensuunnitelmat","ja":"将来の計画","zh-CN":"未来计划"},"desc":"진로와 꿈에 대해 친구와 이야기하기","descTrans":{"en":"Talking with a friend about career paths and dreams","de":"Mit einem Freund über Karrierewege und Träume sprechen","fr":"Parler avec un ami de sa carrière et de ses rêves","es":"Hablar con un amigo sobre trayectorias profesionales y sueños","pl":"Rozmawianie z przyjacielem o ścieżkach kariery i marzeniach","it":"Parlare con un amico dei percorsi di carriera e dei sogni","sv":"Prata med en vän om karriärvägar och drömmar","fi":"Puhuminen ystävän kanssa urapoluista ja unelmista","ja":"キャリアパスと夢について友人と話す","zh-CN":"和朋友谈论职业方向和梦想"},"dialogue":[{"speaker":"민준","text":"은지야, 졸업하고 나서 뭘 할 계획이야?","trans":{"en":"Eunji, what are your plans after graduation?","de":"Eunji, was planst du nach dem Abschluss?","fr":"Eunji, quels sont tes projets après l'obtention de ton diplôme?","es":"Eunji, ¿qué planes tienes después de graduarte?","pl":"Eunji, co planujesz robić po ukończeniu studiów?","it":"Eunji, cosa hai in programma dopo la laurea?","sv":"Eunji, vad har du för planer efter examen?","fi":"Eunji, mitä suunnittelet valmistumisen jälkeen?","ja":"ウンジ、卒業してから何をする予定？","zh-CN":"恩智，你毕业后有什么计划？"}},{"speaker":"은지","text":"나는 해외에서 일해 보고 싶어. 특히 유럽 쪽에서 마케팅 관련 일을 하고 싶거든.","trans":{"en":"I want to try working abroad. Especially, I want to do marketing-related work in Europe.","de":"Ich möchte im Ausland arbeiten. Besonders möchte ich eine marketingbezogene Arbeit in Europa machen.","fr":"Je veux essayer de travailler à l'étranger. Surtout, je veux faire un travail lié au marketing en Europe.","es":"Quiero intentar trabajar en el extranjero. Especialmente, quiero hacer trabajo relacionado con el marketing en Europa.","pl":"Chcę spróbować pracować za granicą. Szczególnie chcę pracować w marketingu w Europie.","it":"Voglio provare a lavorare all'estero. In particolare, voglio fare lavoro legato al marketing in Europa.","sv":"Jag vill prova att arbeta utomlands. Speciellt vill jag göra marknadsföringsrelaterat arbete i Europa.","fi":"Haluan kokeilla työskentelyä ulkomailla. Erityisesti haluan tehdä markkinointiin liittyvää työtä Euroopassa.","ja":"海外で働いてみたい。特にヨーロッパでマーケティング関連の仕事をしたいな。","zh-CN":"我想去海外工作。特别是想在欧洲做市场营销相关的工作。"}},{"speaker":"민준","text":"대단한데! 어떻게 준비하고 있어?","trans":{"en":"Impressive! How are you preparing?","de":"Beeindruckend! Wie bereitest du dich vor?","fr":"Impressionnant! Comment tu te prépares?","es":"¡Impresionante! ¿Cómo te estás preparando?","pl":"Imponujące! Jak się przygotowujesz?","it":"Impressionante! Come ti stai preparando?","sv":"Imponerande! Hur förbereder du dig?","fi":"Vaikuttavaa! Miten valmistaudut?","ja":"すごいね！どうやって準備してるの？","zh-CN":"厉害！你是怎么准备的？"}},{"speaker":"은지","text":"영어랑 독일어를 열심히 공부하고, 인턴십도 경험하려고 지원하는 중이야.","trans":{"en":"I'm studying English and German hard, and I'm also applying for internships to get experience.","de":"Ich lerne fleißig Englisch und Deutsch und bewerbe mich auch für Praktika, um Erfahrung zu sammeln.","fr":"J'étudie l'anglais et l'allemand avec beaucoup d'énergie, et je postule aussi pour des stages pour acquérir de l'expérience.","es":"Estudio inglés y alemán con mucho esfuerzo, y también estoy aplicando a pasantías para obtener experiencia.","pl":"Pilnie uczę się angielskiego i niemieckiego, a także aplikuję na staże, żeby zdobyć doświadczenie.","it":"Studio inglese e tedesco con impegno, e mi sto candidando anche per stage per fare esperienza.","sv":"Jag studerar engelska och tyska flitigt, och ansöker också om praktikplatser för att få erfarenhet.","fi":"Opiskelen englantia ja saksaa ahkerasti, ja haen myös harjoittelupaikkoihin saadakseni kokemusta.","ja":"英語とドイツ語を頑張って勉強して、インターンシップにも経験のために応募しているところ。","zh-CN":"我在努力学习英语和德语，同时也在申请实习来积累经验。"}},{"speaker":"민준","text":"너는 정말 구체적으로 계획을 세웠구나. 나는 아직 진로가 불확실해서 고민이 많아.","trans":{"en":"You've really made specific plans. I still have a lot of worries because my career path is uncertain.","de":"Du hast wirklich konkrete Pläne gemacht. Ich mache mir noch viele Sorgen, weil mein Karriereweg unsicher ist.","fr":"Tu as vraiment fait des plans concrets. J'ai encore beaucoup de soucis car ma carrière est incertaine.","es":"Realmente has hecho planes concretos. Todavía tengo muchas preocupaciones porque mi camino profesional es incierto.","pl":"Naprawdę zrobiłaś konkretne plany. Wciąż mam dużo obaw, ponieważ moja ścieżka kariery jest niepewna.","it":"Hai davvero fatto piani concreti. Ho ancora molte preoccupazioni perché il mio percorso di carriera è incerto.","sv":"Du har verkligen gjort konkreta planer. Jag har fortfarande många bekymmer eftersom min karriärväg är osäker.","fi":"Olet todella tehnyt konkreettisia suunnitelmia. Minulla on vielä paljon huolia, koska urani on epävarma.","ja":"本当に具体的に計画を立てたんだね。僕はまだ進路が不確かで悩みが多いよ。","zh-CN":"你真的制定了具体的计划。我还不确定职业方向，有很多烦恼。"}},{"speaker":"은지","text":"무엇에 관심이 있어? 관심 분야부터 생각해 보는 게 좋아.","trans":{"en":"What are you interested in? It's good to start by thinking about your areas of interest.","de":"Wofür interessierst du dich? Es ist gut, zunächst über deine Interessengebiete nachzudenken.","fr":"Qu'est-ce qui t'intéresse? C'est bien de commencer par réfléchir à tes domaines d'intérêt.","es":"¿En qué estás interesado? Es bueno empezar pensando en tus áreas de interés.","pl":"Czym się interesujesz? Dobrze jest zacząć od przemyślenia swoich obszarów zainteresowań.","it":"Cosa ti interessa? È bene iniziare pensando alle proprie aree di interesse.","sv":"Vad är du intresserad av? Det är bra att börja med att tänka på dina intresseområden.","fi":"Mistä olet kiinnostunut? On hyvä aloittaa miettimällä kiinnostuksen kohteitasi.","ja":"何に興味があるの？まず興味のある分野から考えてみるといいよ。","zh-CN":"你对什么感兴趣？先从感兴趣的领域开始思考比较好。"}},{"speaker":"민준","text":"나는 IT 분야에 관심이 있는데, 개발자가 될 수 있을지 자신이 없어.","trans":{"en":"I'm interested in the IT field, but I'm not confident about whether I can become a developer.","de":"Ich bin an der IT-Branche interessiert, aber ich bin nicht sicher, ob ich Entwickler werden kann.","fr":"Je m'intéresse au domaine de l'informatique, mais je ne suis pas sûr de pouvoir devenir développeur.","es":"Estoy interesado en el campo de TI, pero no estoy seguro de si puedo convertirme en desarrollador.","pl":"Interesuję się branżą IT, ale nie jestem pewny, czy mogę zostać programistą.","it":"Sono interessato al campo IT, ma non sono sicuro di poter diventare uno sviluppatore.","sv":"Jag är intresserad av IT-branschen, men jag är inte säker på om jag kan bli utvecklare.","fi":"Olen kiinnostunut IT-alasta, mutta en ole varma, voiko minusta tulla kehittäjä.","ja":"IT分野に興味があるんだけど、開発者になれるか自信がないんだよね。","zh-CN":"我对IT领域感兴趣，但不确定自己能否成为一名开发者。"}},{"speaker":"은지","text":"일단 작은 프로젝트부터 시작해 봐. 경험을 쌓다 보면 자신감도 생길 거야.","trans":{"en":"Start with small projects for now. As you accumulate experience, your confidence will also grow.","de":"Fang erst einmal mit kleinen Projekten an. Wenn du Erfahrungen sammelst, wird auch dein Selbstvertrauen wachsen.","fr":"Commence d'abord par de petits projets. Au fur et à mesure que tu accumuleras de l'expérience, ta confiance en toi grandira aussi.","es":"Empieza con proyectos pequeños por ahora. A medida que acumules experiencia, tu confianza también crecerá.","pl":"Na razie zacznij od małych projektów. W miarę jak będziesz zdobywać doświadczenie, twoja pewność siebie też wzrośnie.","it":"Comincia con piccoli progetti per ora. Man mano che accumuli esperienza, crescerà anche la tua fiducia.","sv":"Börja med små projekt för nu. När du samlar erfarenhet kommer även ditt självförtroende att växa.","fi":"Aloita pienistä projekteista toistaiseksi. Kun kerrytät kokemusta, myös luottamuksesi kasvaa.","ja":"まずは小さいプロジェクトから始めてみて。経験を積むうちに自信も生まれるよ。","zh-CN":"先从小项目开始吧。积累经验的过程中，自信心也会慢慢建立起来的。"}},{"speaker":"민준","text":"맞아, 해보지도 않고 포기하면 안 되겠지. 올해 안에 앱을 하나 만들어 볼게.","trans":{"en":"You're right, I shouldn't give up without even trying. I'll try to make one app before the end of this year.","de":"Du hast recht, ich sollte nicht aufgeben, ohne es versucht zu haben. Ich werde versuchen, noch in diesem Jahr eine App zu erstellen.","fr":"Tu as raison, je ne devrais pas abandonner sans même essayer. Je vais essayer de créer une application avant la fin de cette année.","es":"Tienes razón, no debería rendirme sin siquiera intentarlo. Intentaré crear una aplicación antes de que termine el año.","pl":"Masz rację, nie powinienem rezygnować, nawet nie próbując. Postaram się stworzyć jedną aplikację przed końcem roku.","it":"Hai ragione, non dovrei arrendermi senza nemmeno provare. Proverò a creare un'app entro la fine di quest'anno.","sv":"Du har rätt, jag bör inte ge upp utan ens att försöka. Jag ska försöka skapa en app innan årets slut.","fi":"Olet oikeassa, en saa luovuttaa edes yrittämättä. Yritän luoda yhden sovelluksen ennen vuoden loppua.","ja":"そうだね、やってみもしないで諦めちゃいけないよね。今年中にアプリを一つ作ってみる。","zh-CN":"说得对，还没试就放弃可不行。我今年内要试着做一个应用。"}}],"vocab":[{"word":"진로","trans":{"en":"career path / course of life","de":"Karriereweg / Lebensweg","fr":"voie professionnelle / parcours de vie","es":"trayectoria profesional / camino de vida","pl":"ścieżka kariery / droga życiowa","it":"percorso di carriera / corso di vita","sv":"karriärväg / livsväg","fi":"urapolku / elämänpolku","ja":"進路","zh-CN":"职业方向 / 人生道路"}},{"word":"해외","trans":{"en":"overseas / abroad","de":"Ausland / Übersee","fr":"à l'étranger / outre-mer","es":"en el extranjero / en el exterior","pl":"za granicą / zagranica","it":"all'estero / oltremare","sv":"utomlands / utländsk","fi":"ulkomailla / ulkomaat","ja":"海外","zh-CN":"海外 / 国外"}},{"word":"인턴십","trans":{"en":"internship","de":"Praktikum","fr":"stage","es":"pasantía / prácticas","pl":"staż","it":"tirocinio / stage","sv":"praktik","fi":"harjoittelu","ja":"インターンシップ","zh-CN":"实习"}},{"word":"구체적","trans":{"en":"concrete / specific","de":"konkret / spezifisch","fr":"concret / spécifique","es":"concreto / específico","pl":"konkretny / szczegółowy","it":"concreto / specifico","sv":"konkret / specifik","fi":"konkreettinen / tarkka","ja":"具体的","zh-CN":"具体的"}},{"word":"불확실하다","trans":{"en":"to be uncertain / unclear","de":"ungewiss / unklar sein","fr":"être incertain / flou","es":"ser incierto / poco claro","pl":"być niepewnym / niejasnym","it":"essere incerto / poco chiaro","sv":"vara osäker / oklar","fi":"olla epävarma / epäselvä","ja":"不確かだ / 不明だ","zh-CN":"不确定 / 不明朗"}},{"word":"자신감","trans":{"en":"self-confidence","de":"Selbstvertrauen","fr":"confiance en soi","es":"confianza en uno mismo","pl":"pewność siebie","it":"fiducia in se stessi","sv":"självförtroende","fi":"itseluottamus","ja":"自信","zh-CN":"自信心"}},{"word":"경험을 쌓다","trans":{"en":"to accumulate experience","de":"Erfahrungen sammeln","fr":"accumuler de l'expérience","es":"acumular experiencia","pl":"zdobywać doświadczenie","it":"accumulare esperienza","sv":"samla erfarenhet","fi":"kerätä kokemusta","ja":"経験を積む","zh-CN":"积累经验"}}],"patterns":[{"pattern":"-아/어 보고 싶다","patternTrans":{"en":"want to try doing ~","de":"möchte ~ ausprobieren","fr":"vouloir essayer de ~","es":"querer intentar ~","pl":"chcieć spróbować ~","it":"voler provare a ~","sv":"vilja prova att ~","fi":"haluta kokeilla ~","ja":"〜してみたい","zh-CN":"想试着~"},"example":"해외에서 일해 보고 싶어요.","trans":{"en":"I want to try working abroad.","de":"Ich möchte im Ausland arbeiten.","fr":"Je veux essayer de travailler à l'étranger.","es":"Quiero intentar trabajar en el extranjero.","pl":"Chcę spróbować pracować za granicą.","it":"Voglio provare a lavorare all'estero.","sv":"Jag vill prova att arbeta utomlands.","fi":"Haluan kokeilla työskentelyä ulkomailla.","ja":"海外で働いてみたいです。","zh-CN":"我想试着去海外工作。"}},{"pattern":"-다 보면","patternTrans":{"en":"as you keep doing ~, (you'll find that) ~","de":"wenn du ~ weiter machst, (wirst du feststellen, dass) ~","fr":"à force de ~, (tu trouveras que) ~","es":"a medida que sigues haciendo ~, (encontrarás que) ~","pl":"w miarę jak robisz ~, (odkryjesz, że) ~","it":"man mano che continui a fare ~, (troverai che) ~","sv":"när du fortsätter att göra ~, (kommer du att märka att) ~","fi":"kun jatkat tekemistä ~, (huomaat että) ~","ja":"〜していると（やがて）〜","zh-CN":"在不断~的过程中，（会发现）~"},"example":"경험을 쌓다 보면 자신감도 생길 거야.","trans":{"en":"As you keep accumulating experience, your confidence will also grow.","de":"Wenn du weiter Erfahrungen sammelst, wird auch dein Selbstvertrauen wachsen.","fr":"À force d'accumuler de l'expérience, ta confiance en toi grandira aussi.","es":"A medida que sigas acumulando experiencia, tu confianza también crecerá.","pl":"W miarę jak będziesz zdobywać doświadczenie, twoja pewność siebie też wzrośnie.","it":"Man mano che accumuli esperienza, crescerà anche la tua fiducia.","sv":"När du fortsätter att samla erfarenhet kommer även ditt självförtroende att växa.","fi":"Kun jatkat kokemuksen keräämistä, myös luottamuksesi kasvaa.","ja":"経験を積んでいると自信も生まれてくるよ。","zh-CN":"在不断积累经验的过程中，自信心也会慢慢增长的。"}},{"pattern":"-(으)ㄹ 수 있을지 자신이 없다","patternTrans":{"en":"not confident about whether one can ~","de":"nicht sicher sein, ob man ~ kann","fr":"ne pas être sûr de pouvoir ~","es":"no estar seguro de si uno puede ~","pl":"nie być pewnym, czy można ~","it":"non essere sicuro di poter ~","sv":"inte vara säker på om man kan ~","fi":"ei olla varma, voiko ~","ja":"〜できるか自信がない","zh-CN":"不确定自己能否~，没有自信"},"example":"개발자가 될 수 있을지 자신이 없어요.","trans":{"en":"I'm not confident about whether I can become a developer.","de":"Ich bin nicht sicher, ob ich Entwickler werden kann.","fr":"Je ne suis pas sûr de pouvoir devenir développeur.","es":"No estoy seguro de si puedo convertirme en desarrollador.","pl":"Nie jestem pewny, czy mogę zostać programistą.","it":"Non sono sicuro di poter diventare uno sviluppatore.","sv":"Jag är inte säker på om jag kan bli utvecklare.","fi":"En ole varma, voiko minusta tulla kehittäjä.","ja":"開発者になれるか自信がないです。","zh-CN":"我不确定自己能否成为一名开发者，没有信心。"}}],"quizzes":[{" // ============================================================
// STATE
// ============================================================
let selectedLang = 'en';
let currentUnitId = 1;
let playbackSpeed = 1.0;
let isHideAll = false;
let isHideTrans = false;
let currentAudio = null;
let isPlayingAll = false;
let dialoguePlayIndex = 0;

// ============================================================
// VOICE
// ============================================================
let _krFemaleVoice = null;
function loadKoreanVoice() {
    const voices = window.speechSynthesis.getVoices();
    const preferred = [
        v => v.name.includes('Google') && v.lang.startsWith('ko') && /female|여성|Yuna|Sora|Heami/i.test(v.name),
        v => v.name.includes('Google') && v.lang.startsWith('ko'),
        v => v.lang.startsWith('ko') && /female|여성|Yuna|Sora|Heami/i.test(v.name),
        v => v.lang.startsWith('ko'),
    ];
    for (const fn of preferred) {
        const found = voices.find(fn);
        if (found) { _krFemaleVoice = found; break; }
    }
}
if (window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = loadKoreanVoice;
}
loadKoreanVoice();

function speak(text) {
    window.speechSynthesis.cancel();
    isPlayingAll = false;
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ko-KR';
    utter.rate = playbackSpeed;
    if (_krFemaleVoice) utter.voice = _krFemaleVoice;
    window.speechSynthesis.speak(utter);
}

// ============================================================
// UNIT MENU
// ============================================================
function buildUnitMenu() {
    const list = document.getElementById('unit-btn-list');
    const ids = Object.keys(unitsData).map(Number).sort((a,b)=>a-b);
    list.innerHTML = ids.map(id => {
        const u = unitsData[id];
        const isActive = id === currentUnitId;
        const localTitle = getTrans(u.titleTrans) || u.title;
        return `<button onclick="goToUnit(${id}); toggleUnitMenu();"
            class="w-full text-left px-3 py-2 rounded-lg transition ${isActive ? 'bg-indigo-600 text-white' : 'hover:bg-slate-100 text-slate-700'}">
            <span class="text-xs ${isActive ? 'text-indigo-200' : 'text-slate-400'} mr-1">Unit ${id}</span><span class="text-sm font-semibold">${localTitle}</span>
            <span class="block text-[11px] ${isActive ? 'text-indigo-200' : 'text-slate-400'} mt-0.5">${u.title}</span>
        </button>`;
    }).join('');
}

function toggleUnitMenu() {
    const dd = document.getElementById('unit-menu-dropdown');
    dd.classList.toggle('hidden');
    if (!dd.classList.contains('hidden')) buildUnitMenu();
}

document.addEventListener('click', e => {
    const dd = document.getElementById('unit-menu-dropdown');
    const btn = document.getElementById('unit-burger-btn');
    if (!dd.contains(e.target) && !btn.contains(e.target)) dd.classList.add('hidden');
    const lm = document.getElementById('lang-menu');
    const lb = document.getElementById('lang-btn');
    if (!lm.contains(e.target) && !lb.contains(e.target)) lm.classList.add('hidden');
});

// ============================================================
// LANGUAGE
// ============================================================
const LANGUAGES = [
    { code: 'en',    label: 'English (영어)' },
    { code: 'de',    label: 'Deutsch (독일어)' },
    { code: 'fr',    label: 'Français (프랑스어)' },
    { code: 'es',    label: 'Español (스페인어)' },
    { code: 'pl',    label: 'Polski (폴란드어)' },
    { code: 'it',    label: 'Italiano (이탈리아어)' },
    { code: 'sv',    label: 'Svenska (스웨덴어)' },
    { code: 'fi',    label: 'Suomi (핀란드어)' },
    { code: 'ja',    label: '日本語 (일본어)' },
    { code: 'zh-CN', label: '中文简体 (중국어 간체)' },
];

function buildLangMenu() {
    const menu = document.getElementById('lang-menu');
    menu.innerHTML = LANGUAGES.map(l => {
        const isActive = l.code === selectedLang;
        return `<button onclick="changeLanguage('${l.code}')"
            class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium transition flex items-center justify-between ${isActive ? 'bg-indigo-600 text-white' : 'hover:bg-slate-100 text-slate-700'}">
            <span>${l.label}</span>
            ${isActive ? '<i class="fa-solid fa-check text-[11px]"></i>' : ''}
        </button>`;
    }).join('');
}

function toggleLangMenu(e) {
    if (e) e.stopPropagation();
    const menu = document.getElementById('lang-menu');
    document.getElementById('unit-menu-dropdown').classList.add('hidden');
    menu.classList.toggle('hidden');
    if (!menu.classList.contains('hidden')) buildLangMenu();
}

function changeLanguage(lang) {
    selectedLang = lang;
    const found = LANGUAGES.find(l => l.code === lang);
    document.getElementById('lang-current-label').textContent = found ? found.label : lang;
    document.getElementById('lang-menu').classList.add('hidden');
    renderAll(currentUnitId);
    buildUnitMenu();
}

function getTrans(obj) {
    if (!obj) return '';
    if (typeof obj === 'string') return obj;
    return obj[selectedLang] || obj['en'] || Object.values(obj)[0] || '';
}

// ============================================================
// SPEED
// ============================================================
function setSpeed(s) {
    playbackSpeed = s;
    document.querySelectorAll('.speed-btn').forEach(b => {
        b.classList.remove('bg-white','shadow-sm','text-indigo-600','font-bold');
        b.classList.add('hover:bg-white');
    });
    const btn = document.getElementById(`speed-${s}`);
    if (btn) {
        btn.classList.add('bg-white','shadow-sm','text-indigo-600','font-bold');
        btn.classList.remove('hover:bg-white');
    }
}

// ============================================================
// VISIBILITY TOGGLES
// ============================================================
function toggleHideAll() {
    isHideAll = !isHideAll;
    const icon = document.getElementById('hide-all-icon');
    icon.className = `fa-solid ${isHideAll ? 'fa-eye' : 'fa-eye-slash'} text-slate-500 ml-2`;
    document.querySelectorAll('.dialogue-korean').forEach(el => {
        el.classList.toggle('blur-text', isHideAll);
    });
}

function toggleHideTrans() {
    isHideTrans = !isHideTrans;
    const icon = document.getElementById('hide-trans-icon');
    icon.className = `fa-solid fa-language ${isHideTrans ? 'text-indigo-500' : 'text-slate-500'} ml-2`;
    document.querySelectorAll('.translation-text').forEach(el => {
        el.classList.toggle('hide-translation', isHideTrans);
    });
}

// ============================================================
// FULL DIALOGUE PLAYBACK
// ============================================================
function playFullDialogue() {
    const unit = unitsData[currentUnitId];
    if (!unit || !unit.dialogue || !unit.dialogue.length) return;
    window.speechSynthesis.cancel();
    isPlayingAll = true;
    dialoguePlayIndex = 0;
    playNextLine(unit.dialogue);
}

function playNextLine(dialogue) {
    if (!isPlayingAll || dialoguePlayIndex >= dialogue.length) {
        isPlayingAll = false;
        return;
    }
    const line = dialogue[dialoguePlayIndex];
    const utter = new SpeechSynthesisUtterance(line.text);
    utter.lang = 'ko-KR';
    utter.rate = playbackSpeed;
    if (_krFemaleVoice) utter.voice = _krFemaleVoice;
    utter.onend = () => { dialoguePlayIndex++; setTimeout(() => playNextLine(dialogue), 400); };
    utter.onerror = () => { isPlayingAll = false; };
    window.speechSynthesis.speak(utter);
}

// ============================================================
// NAVIGATION
// ============================================================
function goToUnit(id) {
    window.speechSynthesis.cancel();
    isPlayingAll = false;
    currentUnitId = id;
    renderAll(id);
    window.scrollTo({top: 0, behavior: 'smooth'});
}

function goToPrevUnit() {
    const ids = Object.keys(unitsData).map(Number).sort((a,b)=>a-b);
    const idx = ids.indexOf(currentUnitId);
    if (idx > 0) goToUnit(ids[idx - 1]);
}

function goToNextUnit() {
    const ids = Object.keys(unitsData).map(Number).sort((a,b)=>a-b);
    const idx = ids.indexOf(currentUnitId);
    if (idx < ids.length - 1) goToUnit(ids[idx + 1]);
}

function updateNavButtons() {
    const ids = Object.keys(unitsData).map(Number).sort((a,b)=>a-b);
    const idx = ids.indexOf(currentUnitId);
    document.getElementById('prev-btn').disabled = (idx === 0);
    document.getElementById('next-btn').disabled = (idx === ids.length - 1);
    document.getElementById('unit-progress').textContent = `${currentUnitId} / ${ids.length}`;
}

// ============================================================
// RENDER ALL
// ============================================================
function renderAll(unitId) {
    const unit = unitsData[unitId];
    if (!unit) return;
    renderUnitHeader(unit);
    renderDialogue(unit);
    renderVocab(unit);
    renderPatterns(unit);
    renderQuizzes(unit);
    updateNavButtons();
}

function renderUnitHeader(unit) {
    document.getElementById('unit-badge').textContent = `Unit ${unit.id}`;
    document.getElementById('unit-title').textContent = unit.title;
    document.getElementById('unit-title-trans').textContent = getTrans(unit.titleTrans);
    document.getElementById('unit-desc').textContent = unit.desc || '';
    document.getElementById('unit-desc-trans').textContent = getTrans(unit.descTrans);
    // Show/hide trans class on header elements
    document.querySelectorAll('#unit-title-trans, #unit-desc-trans').forEach(el => {
        el.classList.toggle('hide-translation', isHideTrans);
    });
}

// ============================================================
// RENDER DIALOGUE — list style (image 2)
// ============================================================
function renderDialogue(unit) {
    const container = document.getElementById('dialogue-container');
    if (!unit.dialogue || !unit.dialogue.length) { container.innerHTML = ''; return; }

    // Assign colors per speaker
    const speakerList = [...new Set(unit.dialogue.map(l => l.speaker))];
    const palette = [
        { avatar: 'bg-indigo-100 text-indigo-700', name: 'text-indigo-700', btn: 'bg-indigo-50 border-indigo-200 text-indigo-600 hover:bg-indigo-100' },
        { avatar: 'bg-emerald-100 text-emerald-700', name: 'text-emerald-700', btn: 'bg-emerald-50 border-emerald-200 text-emerald-600 hover:bg-emerald-100' },
        { avatar: 'bg-amber-100 text-amber-700', name: 'text-amber-700', btn: 'bg-amber-50 border-amber-200 text-amber-600 hover:bg-amber-100' },
        { avatar: 'bg-rose-100 text-rose-700', name: 'text-rose-700', btn: 'bg-rose-50 border-rose-200 text-rose-600 hover:bg-rose-100' },
    ];
    const speakerColor = {};
    speakerList.forEach((sp, i) => { speakerColor[sp] = palette[i % palette.length]; });

    container.innerHTML = unit.dialogue.map((line, i) => {
        const c = speakerColor[line.speaker] || palette[0];
        const trans = getTrans(line.trans);
        const safeText = (line.text || '').replace(/"/g, '&quot;');
        return `
        <div class="dialogue-row">
            <div class="dialogue-avatar ${c.avatar}">${(line.speaker || '?').charAt(0)}</div>
            <div class="dialogue-body">
                <div class="dialogue-speaker-row">
                    <span class="dialogue-speaker-name ${c.name}">${line.speaker}</span>
                    <button class="speak-btn dialogue-listen-btn ${c.btn}" data-text="${safeText}">
                        <i class="fa-solid fa-volume-high text-[9px]"></i> 듣기
                    </button>
                </div>
                <p class="dialogue-korean${isHideAll ? ' blur-text' : ''}">${line.text}</p>
                <p class="dialogue-trans translation-text${isHideTrans ? ' hide-translation' : ''}">${trans}</p>
            </div>
        </div>`;
    }).join('');

    container.querySelectorAll('.speak-btn').forEach(btn => {
        btn.addEventListener('click', () => speak(btn.dataset.text));
    });
}

// ============================================================
// RENDER VOCAB
// ============================================================
function renderVocab(unit) {
    const container = document.getElementById('vocab-container');
    if (!unit.vocab || !unit.vocab.length) { container.innerHTML = '<p class="text-sm text-slate-400 col-span-3">어휘 없음</p>'; return; }
    container.innerHTML = unit.vocab.map(v => {
        const trans = getTrans(v.trans);
        const safeWord = (v.word || '').replace(/"/g, '&quot;');
        return `
        <button class="vocab-speak-btn p-3 bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 rounded-xl text-left transition group shadow-sm" data-text="${safeWord}">
            <div class="flex items-center justify-between mb-1">
                <span class="text-sm font-bold text-slate-800 group-hover:text-indigo-700">${v.word}</span>
                <i class="fa-solid fa-volume-high text-slate-300 group-hover:text-indigo-500 text-xs transition"></i>
            </div>
            <p class="translation-text text-xs text-slate-500 leading-snug${isHideTrans ? ' hide-translation' : ''}">${trans}</p>
        </button>`;
    }).join('');
    container.querySelectorAll('.vocab-speak-btn').forEach(btn => {
        btn.addEventListener('click', () => speak(btn.dataset.text));
    });
}

// RENDER PATTERNS

        const ptrans = getTrans(p.patternTrans);

        return `
        <div class="bg-amber-50 border border-amber-200 rounded-xl p-4">
            <div class="flex items-start gap-2 mb-2">
                <i class="fa-solid fa-star text-amber-400 mt-0.5 text-xs flex-shrink-0"></i>
                <div class="flex-1">
                    <div class="flex items-center justify-between gap-2">
                        <p class="font-bold text-slate-800 text-sm">${p.pattern}</p>
                        <button class="pattern-speak-btn flex-shrink-0 w-6 h-6 bg-amber-200 hover:bg-amber-300 rounded-full flex items-center justify-center transition" data-text="${safePattern}">

                    </div>
                    <p class="translation-text text-xs text-amber-700 mt-0.5${isHideTrans ? ' hide-translation' : ''}">${ptrans}</p>

                    <i class="fa-solid fa-play text-amber-700 text-[9px]"></i>

        btn.addEventListener('click', () => speak(btn.dataset.text));
    });

// ============================================================
// RENDER QUIZZES (comprehension only)
// ============================================================
function renderQuizzes(unit) {
    const container = document.getElementById('quiz-list');
    if (!unit.quizzes || !unit.quizzes.length) { container.innerHTML = ''; return; }
    const filteredQuizzes = unit.quizzes.filter(q => {
        const qtype = (q.type || '').toLowerCase();
        return !/어휘|단어|문법|grammar|vocab|vocabulary/i.test(qtype);
    });
    if (!filteredQuizzes.length) { container.innerHTML = '<p class="text-sm text-slate-400">퀴즈 없음</p>'; return; }

    container.innerHTML = filteredQuizzes.map((q, qi) => {
        const qtrans = getTrans(q.questionTrans);
        const explanationTrans = typeof q.explanation === 'object' ? getTrans(q.explanation) : (q.explanation || '');
        const safeAudio = (q.questionAudio || '').replace(/"/g, '&quot;');
        const options = (q.options || []).map((opt, oi) => {
            const otrans = getTrans(opt.trans);
            const safeExpl = explanationTrans.replace(/"/g, '&quot;');
            return `
            <label class="quiz-option flex items-start gap-3 p-3 bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 rounded-xl cursor-pointer transition group" data-quiz="${qi}" data-opt="${oi}">
                <input type="radio" name="quiz-${unit.id}-${qi}" value="${oi}"
                    class="mt-0.5 accent-indigo-600 flex-shrink-0"
                    data-qi="${qi}" data-oi="${oi}" data-answer="${q.answer}" data-expl="${safeExpl}">
                <div>
                    <span class="text-sm font-medium text-slate-700 group-hover:text-indigo-700">${opt.text}</span>
                    <p class="translation-text text-xs text-slate-400 mt-0.5${isHideTrans ? ' hide-translation' : ''}">${otrans}</p>
                </div>
            </label>`;
        }).join('');
        return `
        <div class="quiz-card bg-white border border-slate-200 rounded-2xl p-5 shadow-sm" id="quiz-card-${qi}">
            <div class="flex items-start justify-between gap-2 mb-3">
                <span class="text-[11px] font-bold text-rose-400 uppercase tracking-wide">Q${qi+1}</span>
                <button class="quiz-listen-btn px-3 py-1.5 bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-600 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition" data-text="${safeAudio}">
                    <i class="fa-solid fa-headphones"></i> 문제 듣기
                </button>
            </div>
            <p class="text-sm font-semibold text-slate-700 mb-1">${q.questionAudio}</p>
            <p class="translation-text text-xs text-slate-500 mb-4${isHideTrans ? ' hide-translation' : ''}">${qtrans}</p>
            <div class="space-y-2" id="quiz-options-${qi}">${options}</div>
            <div id="quiz-result-${qi}" class="hidden mt-4 p-3 rounded-xl text-sm font-medium"></div>
        </div>`;
    }).join('');

    container.querySelectorAll('.quiz-listen-btn').forEach(btn => {
        btn.addEventListener('click', () => speak(btn.dataset.text));
    });
    container.querySelectorAll('input[type="radio"]').forEach(radio => {
        radio.addEventListener('change', () => {
            checkAnswer(parseInt(radio.dataset.qi), parseInt(radio.dataset.oi), parseInt(radio.dataset.answer), radio.dataset.expl);
        });
    });
}

function checkAnswer(qIdx, selected, correct, explanation) {
    const resultEl = document.getElementById(`quiz-result-${qIdx}`);
    const optionsEl = document.getElementById(`quiz-options-${qIdx}`);
    optionsEl.querySelectorAll('input[type="radio"]').forEach(r => r.disabled = true);
    optionsEl.querySelectorAll('.quiz-option').forEach((el, i) => {
        el.classList.remove('hover:bg-indigo-50','hover:border-indigo-300','cursor-pointer');
        if (i === correct) el.classList.add('bg-emerald-50','border-emerald-400','ring-2','ring-emerald-300');
        else if (i === selected && selected !== correct) el.classList.add('bg-rose-50','border-rose-400','ring-2','ring-rose-300');
    });
    const isCorrect = selected === correct;
    resultEl.className = `mt-4 p-3 rounded-xl text-sm font-medium flex items-start gap-2 ${isCorrect ? 'bg-emerald-50 border border-emerald-200 text-emerald-800' : 'bg-rose-50 border border-rose-200 text-rose-800'}`;
    resultEl.innerHTML = `
        <i class="fa-solid ${isCorrect ? 'fa-circle-check text-emerald-500' : 'fa-circle-xmark text-rose-500'} mt-0.5 flex-shrink-0"></i>
        <div>
            <span class="font-bold">${isCorrect ? '정답입니다! ✓' : '틀렸습니다. ✗'}</span>
            ${explanation ? `<p class="text-xs mt-1 font-normal opacity-80">${explanation}</p>` : ''}
        </div>`;
    resultEl.classList.remove('hidden');
}

renderAll(1);
buildUnitMenu();
buildLangMenu();
</script>
