rans":{"en":"Breakfast","de":"Frühstück","fr":"Petit-déjeuner","es":"Desayuno","pl":"Śniadanie","it":"Colazione","sv":"Frukost","fi":"Aamiainen","ja":"朝食","zh-CN":"早餐"}},{"text":"주차","trans":{"en":"Parking","de":"Parkplatz","fr":"Stationnement","es":"Estacionamiento","pl":"Parking","it":"Parcheggio","sv":"Parkering","fi":"Pysäköinti","ja":"駐車場","zh-CN":"停车"}}],"answer":2,"explanation":"수미가 '조식도 포함되어 있어요'라고 말했습니다."},{"type":"이해","questionAudio":"프런트는 몇 시간 운영하나요?","questionTrans":{"en":"How many hours does the front desk operate?","de":"Wie viele Stunden ist die Rezeption geöffnet?","fr":"Combien d'heures la réception fonctionne-t-elle?","es":"¿Cuántas horas opera la recepción?","pl":"Ile godzin działa recepcja?","it":"Quante ore è operativa la reception?","sv":"Hur många timmar är receptionen öppen?","fi":"Kuinka monta tuntia vastaanotto on auki?","ja":"フロントは何時間営業していますか？","zh-CN":"前台运营多少小时？"},"options":[{"text":"12시간","trans":{"en":"12 hours","de":"12 Stunden","fr":"12 heures","es":"12 horas","pl":"12 godzin","it":"12 ore","sv":"12 timmar","fi":"12 tuntia","ja":"12時間","zh-CN":"12小时"}},{"text":"16시간","trans":{"en":"16 hours","de":"16 Stunden","fr":"16 heures","es":"16 horas","pl":"16 godzin","it":"16 ore","sv":"16 timmar","fi":"16 tuntia","ja":"16時間","zh-CN":"16小时"}},{"text":"20시간","trans":{"en":"20 hours","de":"20 Stunden","fr":"20 heures","es":"20 horas","pl":"20 godzin","it":"20 ore","sv":"20 timmar","fi":"20 tuntia","ja":"20時間","zh-CN":"20小时"}},{"text":"24시간","trans":{"en":"24 hours","de":"24 Stunden","fr":"24 heures","es":"24 horas","pl":"24 godziny","it":"24 ore","sv":"24 timmar","fi":"24 tuntia","ja":"24時間","zh-CN":"24小时"}}],"answer":3,"explanation":"수미가 '프런트는 24시간 운영한다'고 말했습니다."}]},
  12: {"id":12,"title":"교통 문제","titleTrans":{"en":"Transportation Issues","de":"Verkehrsprobleme","fr":"Problèmes de transport","es":"Problemas de transporte","pl":"Problemy z transportem","it":"Problemi di trasporto","sv":"Transportproblem","fi":"Liikenneongelmia","ja":"交通トラブル","zh-CN":"交通问题"},"desc":"지하철이나 버스를 이용하다가 생기는 문제를 해결하는 방법을 배웁니다.","descTrans":{"en":"Learn how to solve problems that arise while using the subway or bus.","de":"Lernen Sie, wie man Probleme löst, die bei der Nutzung von U-Bahn oder Bus entstehen.","fr":"Apprenez à résoudre les problèmes qui surviennent lors de l'utilisation du métro ou du bus.","es":"Aprende a resolver los problemas que surgen al usar el metro o el autobús.","pl":"Dowiedz się, jak rozwiązywać problemy, które pojawiają się podczas korzystania z metra lub autobusu.","it":"Impara a risolvere i problemi che sorgono durante l'utilizzo della metropolitana o dell'autobus.","sv":"Lär dig hur du löser problem som uppstår när du använder tunnelbanan eller bussen.","fi":"Opi ratkaisemaan ongelmia, joita syntyy metron tai bussin käytön aikana.","ja":"地下鉄やバスを利用中に起きる問題の解決方法を学びます。","zh-CN":"学习在乘坐地铁或公交车时遇到问题的解决方法。"},"dialogue":[{"speaker":"민준","text":"저, 죄송한데요. 이 버스가 시청역으로 가나요?","trans":{"en":"Excuse me. Does this bus go to City Hall station?","de":"Entschuldigung. Fährt dieser Bus zur Station Rathaus?","fr":"Excusez-moi. Est-ce que ce bus va à la station Mairie?","es":"Disculpe. ¿Este autobús va a la estación Ayuntamiento?","pl":"Przepraszam. Czy ten autobus jedzie do stacji Ratusz?","it":"Scusi. Questo autobus va alla stazione del Municipio?","sv":"Ursäkta. Går den här bussen till Rådhushållplatsen?","fi":"Anteeksi. Meneekö tämä bussi Kaupungintalon asemalle?","ja":"すみません。このバスは市庁駅へ行きますか？","zh-CN":"打扰一下，这路公交车去市厅站吗？"}},{"speaker":"지수","text":"아니요, 이 버스는 반대 방향이에요. 맞은편에서 타셔야 해요.","trans":{"en":"No, this bus goes in the opposite direction. You need to take it from across the street.","de":"Nein, dieser Bus fährt in die entgegengesetzte Richtung. Sie müssen auf der anderen Straßenseite einsteigen.","fr":"Non, ce bus va dans la direction opposée. Vous devez le prendre de l'autre côté.","es":"No, este autobús va en dirección opuesta. Tiene que tomarlo del otro lado.","pl":"Nie, ten autobus jedzie w przeciwnym kierunku. Musi Pan/Pani wsiąść po drugiej stronie.","it":"No, questo autobus va nella direzione opposta. Deve prenderlo dall'altra parte.","sv":"Nej, den här bussen går åt motsatt håll. Du måste ta den från andra sidan gatan.","fi":"Ei, tämä bussi menee vastakkaiseen suuntaan. Sinun täytyy nousta sille kadun toisella puolella.","ja":"いいえ、このバスは反対方向です。向こう側から乗らないといけません。","zh-CN":"不，这路公交车方向相反，您需要在对面乘坐。"}},{"speaker":"민준","text":"아, 그렇군요. 감사합니다. 그런데 지하철을 타면 어떨까요?","trans":{"en":"Oh, I see. Thank you. But what if I take the subway?","de":"Oh, ich verstehe. Danke. Aber was wäre, wenn ich die U-Bahn nehme?","fr":"Oh, je vois. Merci. Mais et si je prends le métro?","es":"Oh, ya veo. Gracias. Pero ¿y si tomo el metro?","pl":"Och, rozumiem. Dziękuję. A co jeśli pojadę metrem?","it":"Oh, capisco. Grazie. Ma se prendessi la metropolitana?","sv":"Åh, jag förstår. Tack. Men vad händer om jag tar tunnelbanan?","fi":"Ai niin. Kiitos. Mutta entä jos otan metron?","ja":"あ、そうですか。ありがとうございます。でも地下鉄に乗ったらどうでしょう？","zh-CN":"哦，原来如此。谢谢。那坐地铁怎么样呢？"}},{"speaker":"지수","text":"지하철이 더 빠를 거예요. 2호선을 타면 시청역까지 바로 가요.","trans":{"en":"The subway will be faster. If you take Line 2, it goes straight to City Hall station.","de":"Die U-Bahn wird schneller sein. Wenn Sie die Linie 2 nehmen, fahren Sie direkt zur Station Rathaus.","fr":"Le métro sera plus rapide. Si vous prenez la ligne 2, elle va directement à la station Mairie.","es":"El metro será más rápido. Si tomas la línea 2, va directo a la estación Ayuntamiento.","pl":"Metro będzie szybsze. Jeśli wsiądziesz do linii 2, jedzie bezpośrednio do stacji Ratusz.","it":"La metropolitana sarà più veloce. Se prende la linea 2, va direttamente alla stazione del Municipio.","sv":"Tunnelbanan kommer att vara snabbare. Om du tar linje 2 går den direkt till Rådhushållplatsen.","fi":"Metro on nopeampi. Jos otat linjan 2, se menee suoraan Kaupungintalon asemalle.","ja":"地下鉄の方が速いですよ。2号線に乗れば市庁駅まで直通です。","zh-CN":"地铁会更快。乘坐2号线可以直达市厅站。"}},{"speaker":"민준","text":"그런데 교통카드 잔액이 부족한 것 같아요.","trans":{"en":"But I think my transit card balance is low.","de":"Aber ich glaube, mein ÖPNV-Kartenguthaben ist zu niedrig.","fr":"Mais je pense que le solde de ma carte de transport est insuffisant.","es":"Pero creo que el saldo de mi tarjeta de transporte es bajo.","pl":"Ale myślę, że saldo mojej karty komunikacyjnej jest zbyt niskie.","it":"Ma penso che il saldo della mia carta dei trasporti sia basso.","sv":"Men jag tror att mitt saldo på trafikkortet är lågt.","fi":"Mutta luulen, että matkakortissani on vähän saldoa.","ja":"でも交通カードの残高が足りないみたいです。","zh-CN":"但是我的交通卡余额好像不够了。"}},{"speaker":"지수","text":"역 안에 충전기가 있어요. 현금이나 카드로 충전할 수 있어요.","trans":{"en":"There's a charging machine inside the station. You can charge it with cash or card.","de":"Im Bahnhof gibt es ein Aufladegerät. Sie können es mit Bargeld oder Karte aufladen.","fr":"Il y a une machine de recharge dans la station. Vous pouvez la recharger avec de l'argent liquide ou une carte.","es":"Hay una máquina de recarga dentro de la estación. Puede recargarla con efectivo o tarjeta.","pl":"W stacji jest ładowarka. Można doładować gotówką lub kartą.","it":"C'è una macchina di ricarica all'interno della stazione. Può ricaricarla con contanti o carta.","sv":"Det finns en uppladdningsmaskin inne i stationen. Du kan ladda den med kontanter eller kort.","fi":"Aseman sisällä on latauskone. Voit ladata sen käteisellä tai kortilla.","ja":"駅の中に充電機があります。現金かカードで充電できます。","zh-CN":"站内有充值机，可以用现金或刷卡充值。"}},{"speaker":"민준","text":"감사합니다. 그런데 2호선 타는 곳이 어디예요?","trans":{"en":"Thank you. But where do I take Line 2?","de":"Danke. Aber wo fährt die Linie 2 ab?","fr":"Merci. Mais où est-ce que je prends la ligne 2?","es":"Gracias. Pero ¿dónde tomo la línea 2?","pl":"Dziękuję. Ale gdzie wsiadam do linii 2?","it":"Grazie. Ma dove prendo la linea 2?","sv":"Tack. Men var tar jag linje 2?","fi":"Kiitos. Mutta missä otan linjan 2?","ja":"ありがとうございます。でも2号線はどこで乗れますか？","zh-CN":"谢谢。但2号线在哪里乘坐？"}},{"speaker":"지수","text":"저쪽 계단 내려가면 바로 2호선 플랫폼이에요.","trans":{"en":"Go down those stairs and it's the Line 2 platform right there.","de":"Gehen Sie diese Treppe hinunter und dort ist sofort der Bahnsteig der Linie 2.","fr":"Descendez ces escaliers et c'est le quai de la ligne 2 juste là.","es":"Baje esas escaleras y ahí está el andén de la línea 2.","pl":"Zejdź po tych schodach i od razu jest peron linii 2.","it":"Scenda quelle scale ed è subito il binario della linea 2.","sv":"Gå ner för de trapporna och det är linje 2-plattformen direkt.","fi":"Mene alas niitä portaita ja siellä on heti linjan 2 laituri.","ja":"あちらの階段を下りればすぐ2号線のホームです。","zh-CN":"下那边的楼梯就直接是2号线站台了。"}},{"speaker":"민준","text":"정말 친절하시네요. 덕분에 많은 도움이 됐어요.","trans":{"en":"You're so kind. You've been a great help.","de":"Sie sind sehr freundlich. Sie haben mir sehr geholfen.","fr":"Vous êtes très gentil. Vous m'avez beaucoup aidé.","es":"Es muy amable. Ha sido de gran ayuda.","pl":"Jesteś bardzo miły/a. Bardzo mi pomogłeś/pomogłaś.","it":"È molto gentile. Mi ha aiutato molto.","sv":"Du är så snäll. Du har hjälpt mig mycket.","fi":"Olet niin kiltti. Olet ollut suuri apu.","ja":"本当に親切ですね。おかげで大変助かりました。","zh-CN":"您真的很热心。多亏了您帮了大忙。"}}],"vocab":[{"word":"반대 방향","trans":{"en":"opposite direction","de":"entgegengesetzte Richtung","fr":"direction opposée","es":"dirección opuesta","pl":"przeciwny kierunek","it":"direzione opposta","sv":"motsatt riktning","fi":"vastakkainen suunta","ja":"反対方向","zh-CN":"反方向"}},{"word":"교통카드","trans":{"en":"transit card","de":"ÖPNV-Karte","fr":"carte de transport","es":"tarjeta de transporte","pl":"karta komunikacyjna","it":"carta dei trasporti","sv":"trafikkort","fi":"matkakortti","ja":"交通カード","zh-CN":"交通卡"}},{"word":"잔액","trans":{"en":"balance/remaining amount","de":"Guthaben/Restbetrag","fr":"solde","es":"saldo","pl":"saldo/pozostała kwota","it":"saldo","sv":"saldo/återstående belopp","fi":"saldo/jäljellä oleva summa","ja":"残高","zh-CN":"余额"}},{"word":"충전하다","trans":{"en":"to charge/top up","de":"aufladen","fr":"recharger","es":"recargar","pl":"doładować","it":"ricaricare","sv":"ladda/fylla på","fi":"ladata/täyttää","ja":"充電する","zh-CN":"充值"}},{"word":"플랫폼","trans":{"en":"platform","de":"Bahnsteig","fr":"quai","es":"andén","pl":"peron","it":"binario/banchina","sv":"plattform","fi":"laituri","ja":"プラットフォーム","zh-CN":"站台"}},{"word":"맞은편","trans":{"en":"opposite side/across","de":"gegenüber","fr":"en face","es":"enfrente","pl":"naprzeciwko","it":"di fronte","sv":"mittemot","fi":"vastapäätä","ja":"向かい側","zh-CN":"对面"}},{"word":"계단","trans":{"en":"stairs","de":"Treppe","fr":"escaliers","es":"escaleras","pl":"schody","it":"scale","sv":"trappor","fi":"portaat","ja":"階段","zh-CN":"楼梯"}}],"patterns":[{"pattern":"~(으)면 어떨까요?","patternTrans":{"en":"What if we ~? / How about ~?","de":"Was wäre, wenn wir ~? / Wie wäre es mit ~?","fr":"Et si on ~? / Que diriez-vous de ~?","es":"¿Y si ~? / ¿Qué tal si ~?","pl":"A co jeśli ~? / Jak by było, gdyby ~?","it":"E se ~? / Che ne dici di ~?","sv":"Vad händer om vi ~? / Hur är det med ~?","fi":"Entä jos ~? / Mitä jos ~?","ja":"〜したらどうでしょう？","zh-CN":"如果~怎么样？"},"example":"지하철을 타면 어떨까요?","trans":{"en":"What if I take the subway?","de":"Was wäre, wenn ich die U-Bahn nehme?","fr":"Et si je prenais le métro?","es":"¿Y si tomo el metro?","pl":"A co jeśli pojadę metrem?","it":"E se prendessi la metropolitana?","sv":"Vad händer om jag tar tunnelbanan?","fi":"Entä jos otan metron?","ja":"地下鉄に乗ったらどうでしょう？","zh-CN":"坐地铁怎么样？"}},{"pattern":"~(으)면 바로 ~예요/이에요","patternTrans":{"en":"If you ~, it's right there / ~ straight away","de":"Wenn Sie ~, ist es sofort ~","fr":"Si vous ~, c'est tout de suite ~","es":"Si ~, está justo ~","pl":"Jeśli ~, to jest od razu ~","it":"Se ~, è subito ~","sv":"Om du ~, är det precis ~","fi":"Jos ~, se on heti ~","ja":"〜すれば、すぐ〜です","zh-CN":"如果~，马上就是~"},"example":"저쪽 계단 내려가면 바로 2호선 플랫폼이에요.","trans":{"en":"Go down those stairs and it's the Line 2 platform right there.","de":"Wenn Sie diese Treppe hinuntergehen, ist es sofort der Bahnsteig der Linie 2.","fr":"Si vous descendez ces escaliers, c'est tout de suite le quai de la ligne 2.","es":"Si bajas esas escaleras, está justo el andén de la línea 2.","pl":"Jeśli zejdziesz po tych schodach, jest od razu peron linii 2.","it":"Se scende quelle scale, è subito il binario della linea 2.","sv":"Om du går ner för de trapporna, är det precis linje 2-plattformen.","fi":"Jos menet alas niitä portaita, se on heti linjan 2 laituri.","ja":"あちらの階段を下りれば、すぐ2号線のホームです。","zh-CN":"下那边的楼梯马上就是2号线站台。"}},{"pattern":"덕분에 ~이/가 됐어요","patternTrans":{"en":"Thanks to you, ~ happened / You helped me ~","de":"Dank Ihnen ~ / Sie haben mir geholfen zu ~","fr":"Grâce à vous, ~ / Vous m'avez aidé à ~","es":"Gracias a usted, ~ / Me ayudó a ~","pl":"Dzięki Tobie ~ / Pomogłeś/Pomogłaś mi ~","it":"Grazie a lei, ~ / Mi ha aiutato a ~","sv":"Tack vare dig ~ / Du hjälpte mig att ~","fi":"Kiitos sinulle ~","ja":"おかげで〜になりました","zh-CN":"多亏了您~"},"example":"덕분에 많은 도움이 됐어요.","trans":{"en":"Thanks to you, it was a great help.","de":"Dank Ihnen war es eine große Hilfe.","fr":"Grâce à vous, c'était d'une grande aide.","es":"Gracias a usted, fue de gran ayuda.","pl":"Dzięki Tobie, to była ogromna pomoc.","it":"Grazie a lei, è stato di grande aiuto.","sv":"Tack vare dig var det till stor hjälp.","fi":"Kiitos sinulle, se oli suuri apu.","ja":"おかげで大変助かりました。","zh-CN":"多亏了您，帮了大忙。"}}],"quizzes":[{"type":"이해","questionAudio":"민준이 처음에 타려고 했던 버스는 왜 문제가 있었나요?","questionTrans":{"en":"Why was there a problem with the bus Minjun initially tried to take?","de":"Warum gab es ein Problem mit dem Bus, den Minjun zunächst nehmen wollte?","fr":"Pourquoi y avait-il un problème avec le bus que Minjun voulait initialement prendre?","es":"¿Por qué había un problema con el autobús que Minjun intentó tomar inicialmente?","pl":"Dlaczego był problem z autobusem, który Minjun początkowo chciał wziąć?","it":"Perché c'era un problema con l'autobus che Minjun voleva prendere inizialmente?","sv":"Varför var det ett problem med bussen som Minjun initialt försökte ta?","fi":"Miksi Minjunin aluksi yrittämässä bussissa oli ongelma?","ja":"ミンジュンが最初に乗ろうとしたバスはなぜ問題だったのですか？","zh-CN":"民准最初想坐的公交车为什么有问题？"},"options":[{"text":"버스가 고장났어요","trans":{"en":"The bus was broken","de":"Der Bus war kaputt","fr":"Le bus était en panne","es":"El autobús estaba averiado","pl":"Autobus był zepsuty","it":"L'autobus era guasto","sv":"Bussen var trasig","fi":"Bussi oli rikki","ja":"バスが故障していた","zh-CN":"公交车坏了"}},{"text":"반대 방향으로 가는 버스였어요","trans":{"en":"It was a bus going in the opposite direction","de":"Es war ein Bus in die entgegengesetzte Richtung","fr":"C'était un bus allant dans la direction opposée","es":"Era un autobús que iba en dirección opuesta","pl":"To był autobus jadący w przeciwnym kierunku","it":"Era un autobus che andava nella direzione opposta","sv":"Det var en buss som gick åt motsatt håll","fi":"Se oli bussi, joka meni vastakkaiseen suuntaan","ja":"反対方向に行くバスだった","zh-CN":"是开往反方向的公交车"}},{"text":"버스 요금이 너무 비쌌어요","trans":{"en":"The bus fare was too expensive","de":"Der Busfahrpreis war zu teuer","fr":"Le prix du bus était trop cher","es":"La tarifa del autobús era demasiado cara","pl":"Opłata za autobus była zbyt wysoka","it":"La tariffa dell'autobus era troppo cara","sv":"Busspriset var för dyrt","fi":"Bussilippu oli liian kallis","ja":"バスの料金が高すぎた","zh-CN":"公交车费太贵了"}},{"text":"버스가 너무 늦게 왔어요","trans":{"en":"The bus came too late","de":"Der Bus kam zu spät","fr":"Le bus est arrivé trop tard","es":"El autobús llegó demasiado tarde","pl":"Autobus przyjechał zbyt późno","it":"L'autobus è arrivato troppo tardi","sv":"Bussen kom för sent","fi":"Bussi tuli liian myöhään","ja":"バスが来るのが遅すぎた","zh-CN":"公交车来得太晚了"}}],"answer":1,"explanation":"지수가 '이 버스는 반대 방향이에요'라고 말했습니다."},{"type":"이해","questionAudio":"교통카드를 충전하려면 어떻게 해야 하나요?","questionTrans":{"en":"What do you need to do to charge the transit card?","de":"Was müssen Sie tun, um die ÖPNV-Karte aufzuladen?","fr":"Que devez-vous faire pour recharger la carte de transport?","es":"¿Qué hay que hacer para recargar la tarjeta de transporte?","pl":"Co należy zrobić, aby doładować kartę komunikacyjną?","it":"Cosa bisogna fare per ricaricare la carta dei trasporti?","sv":"Vad behöver du göra för att ladda trafikkortet?","fi":"Mitä sinun täytyy tehdä ladataksesi matkakortin?","ja":"交通カードを充電するにはどうすればいいですか？","zh-CN":"如何给交通卡充值？"},"options":[{"text":"버스 기사에게 부탁해야 해요","trans":{"en":"You need to ask the bus driver","de":"Sie müssen den Busfahrer bitten","fr":"Vous devez demander au chauffeur de bus","es":"Tienes que pedírselo al conductor del autobús","pl":"Musisz poprosić kierowcę autobusu","it":"Deve chiedere all'autista dell'autobus","sv":"Du måste be busschauffören","fi":"Sinun täytyy pyytää bussinkuljettajaa","ja":"バスの運転手にお願いする必要がある","zh-CN":"需要请求公交司机"}},{"text":"은행에 가야 해요","trans":{"en":"You need to go to the bank","de":"Sie müssen zur Bank gehen","fr":"Vous devez aller à la banque","es":"Tienes que ir al banco","pl":"Musisz iść do banku","it":"Deve andare in banca","sv":"Du måste gå till banken","fi":"Sinun täytyy mennä pankkiin","ja":"銀行に行く必要がある","zh-CN":"需要去银行"}},{"text":"역 안에 있는 충전기를 이용해요","trans":{"en":"Use the charging machine inside the station","de":"Benutzen Sie das Aufladegerät im Bahnhof","fr":"Utilisez la machine de recharge dans la station","es":"Use la máquina de recarga dentro de la estación","pl":"Użyj ładowarki w stacji","it":"Usi la macchina di ricarica all'interno della stazione","sv":"Använd uppladdningsmaskinen inne i stationen","fi":"Käytä aseman sisällä olevaa latauskonetta","ja":"駅の中の充電機を使う","zh-CN":"使用站内的充值机"}},{"text":"앱으로 충전해야 해요","trans":{"en":"You need to charge it via app","de":"Sie müssen es über eine App aufladen","fr":"Vous devez le recharger via une application","es":"Tienes que recargarlo a través de una app","pl":"Musisz doładować przez aplikację","it":"Deve ricaricarla tramite app","sv":"Du måste ladda den via en app","fi":"Sinun täytyy ladata se sovelluksen kautta","ja":"アプリで充電する必要がある","zh-CN":"需要通过应用程序充值"}}],"answer":2,"explanation":"지수가 '역 안에 충전기가 있어요'라고 말했습니다."},{"type":"이해","questionAudio":"2호선 플랫폼은 어디에 있나요?","questionTrans":{"en":"Where is the Line 2 platform?","de":"Wo ist der Bahnsteig der Linie 2?","fr":"Où se trouve le quai de la ligne 2?","es":"¿Dónde está el andén de la línea 2?","pl":"Gdzie jest peron linii 2?","it":"Dove si trova il binario della linea 2?","sv":"Var är linje 2-plattformen?","fi":"Missä on linjan 2 laituri?","ja":"2号線のホームはどこにありますか？","zh-CN":"2号线站台在哪里？"},"options":[{"text":"1층 오른쪽","trans":{"en":"1st floor, right side","de":"1. Etage, rechts","fr":"1er étage, côté droit","es":"1er piso, lado derecho","pl":"1. piętro, prawa strona","it":"1° piano, lato destro","sv":"1:a våningen, höger sida","fi":"1. kerros, oikealla puolella","ja":"1階右側","zh-CN":"一楼右侧"}},{"text":"계단 위","trans":{"en":"Above the stairs","de":"Über der Treppe","fr":"Au-dessus des escaliers","es":"Encima de las escaleras","pl":"Nad schodami","it":"Sopra le scale","sv":"Ovanför trapporna","fi":"Portaiden yläpuolella","ja":"階段の上","zh-CN":"楼梯上方"}},{"text":"계단 내려가면 바로","trans":{"en":"Right after going down the stairs","de":"Gleich nach dem Treppenabgang","fr":"Juste après avoir descendu les escaliers","es":"Justo después de bajar las escaleras","pl":"Zaraz po zejściu ze schodów","it":"Subito dopo aver sceso le scale","sv":"Direkt efter att ha gått ner för trapporna","fi":"Heti portaita alaspäin mentäessä","ja":"階段を下りてすぐ","zh-CN":"下楼梯后马上就是"}},{"text":"출구 밖에","trans":{"en":"Outside the exit","de":"Außerhalb des Ausgangs","fr":"À l'extérieur de la sortie","es":"Fuera de la salida","pl":"Na zewnątrz wyjścia","it":"Fuori dall'uscita","sv":"Utanför utgången","fi":"Uloskäynnin ulkopuolella","ja":"出口の外","zh-CN":"出口外面"}}],"answer":2,"explanation":"지수가 '저쪽 계단 내려가면 바로 2호선 플랫폼이에요'라고 말했습니다."}]},
  13: {"id":13,"title":"인터넷 쇼핑","titleTrans":{"en":"Online Shopping","de":"Online-Shopping","fr":"Achats en ligne","es":"Compras en línea","pl":"Zakupy online","it":"Shopping online","sv":"Näthandel","fi":"Verkkokauppa","ja":"ネットショッピング","zh-CN":"网购"},"desc":"앱으로 물건을 주문하고 배송을 확인하는 과정을 배웁니다.","descTrans":{"en":"Learn how to order items via app and track deliveries.","de":"Lernen Sie, wie man Artikel per App bestellt und die Lieferung verfolgt.","fr":"Apprenez à commander des articles via une application et à suivre les livraisons.","es":"Aprende a pedir artículos a través de una app y a rastrear los envíos.","pl":"Dowiedz się, jak zamawiać produkty przez aplikację i śledzić dostawy.","it":"Impara a ordinare articoli tramite app e a monitorare le consegne.","sv":"Lär dig hur du beställer varor via app och spårar leveranser.","fi":"Opi tilaamaan tuotteita sovelluksen kautta ja seuraamaan toimituksia.","ja":"アプリで商品を注文して配送を確認する方法を学びます。","zh-CN":"学习如何通过应用程序订购商品并确认快递。"},"dialogue":[{"speaker":"유진","text":"지수야, 이 앱으로 쇼핑해 본 적 있어?","trans":{"en":"Jisu, have you ever shopped with this app?","de":"Jisu, hast du schon mal mit dieser App eingekauft?","fr":"Jisu, as-tu déjà fait des achats avec cette application?","es":"Jisu, ¿alguna vez has comprado con esta aplicación?","pl":"Jisu, czy robiłeś kiedyś zakupy przez tę aplikację?","it":"Jisu, hai mai fatto acquisti con questa app?","sv":"Jisu, har du någonsin handlat med den här appen?","fi":"Jisu, oletko koskaan ostanut tällä sovelluksella?","ja":"ジス、このアプリでショッピングしたことある？","zh-CN":"智秀，你用这个应用购物过吗？"}},{"speaker":"지수","text":"응, 자주 써. 배송도 빠르고 반품도 쉬워서 좋아.","trans":{"en":"Yeah, I use it often. Shipping is fast and returns are easy.","de":"Ja, ich benutze es oft. Die Lieferung ist schnell und Rücksendungen sind einfach.","fr":"Oui, je l'utilise souvent. La livraison est rapide et les retours sont faciles.","es":"Sí, lo uso a menudo. El envío es rápido y las devoluciones son fáciles.","pl":"Tak, często używam. Dostawa jest szybka i zwroty są łatwe.","it":"Sì, lo uso spesso. La spedizione è veloce e i resi sono facili.","sv":"Ja, jag använder det ofta. Frakten är snabb och returerna är enkla.","fi":"Joo, käytän sitä usein. Toimitus on nopeaa ja palautukset ovat helppoja.","ja":"うん、よく使うよ。配送も速いし返品も簡単で良いよ。","zh-CN":"嗯，经常用。配送快、退货也方便，很喜欢。"}},{"speaker":"유진","text":"나는 어제 처음으로 주문했는데 배송이 아직 안 왔어.","trans":{"en":"I ordered for the first time yesterday, but my delivery hasn't arrived yet.","de":"Ich habe gestern zum ersten Mal bestellt, aber meine Lieferung ist noch nicht angekommen.","fr":"J'ai commandé pour la première fois hier, mais ma livraison n'est pas encore arrivée.","es":"Pedí por primera vez ayer, pero mi entrega todavía no ha llegado.","pl":"Wczoraj po raz pierwszy zamówiłem, ale dostawa jeszcze nie przyszła.","it":"Ho ordinato per la prima volta ieri, ma la mia consegna non è ancora arrivata.","sv":"Jag beställde för första gången igår, men min leverans har inte kommit ännu.","fi":"Tilasin eilen ensimmäistä kertaa, mutta toimitukseni ei ole vielä saapunut.","ja":"昨日初めて注文したんだけど、配送がまだ来ないよ。","zh-CN":"我昨天第一次下单，但快递还没到。"}},{"speaker":"지수","text":"앱에서 배송 조회를 해 봤어? 현재 위치를 확인할 수 있어.","trans":{"en":"Have you tried checking the delivery status on the app? You can see the current location.","de":"Hast du versucht, den Lieferstatus in der App zu überprüfen? Du kannst den aktuellen Standort sehen.","fr":"As-tu essayé de vérifier le statut de livraison sur l'application? Tu peux voir l'emplacement actuel.","es":"¿Has intentado revisar el estado de entrega en la app? Puedes ver la ubicación actual.","pl":"Czy próbowałeś sprawdzić status dostawy w aplikacji? Możesz zobaczyć aktualną lokalizację.","it":"Hai provato a verificare lo stato della consegna sull'app? Puoi vedere la posizione attuale.","sv":"Har du försökt kontrollera leveransstatus i appen? Du kan se den aktuella platsen.","fi":"Oletko yrittänyt tarkistaa toimituksen tilan sovelluksessa? Voit nähdä nykyisen sijainnin.","ja":"アプリで配送状況を確認してみた？現在位置が確認できるよ。","zh-CN":"你在应用里查看配送追踪了吗？可以确认当前位置。"}},{"speaker":"유진","text":"어떻게 하는지 잘 모르겠어. 가르쳐 줄 수 있어?","trans":{"en":"I'm not sure how to do it. Can you teach me?","de":"Ich weiß nicht genau, wie das geht. Kannst du mir es zeigen?","fr":"Je ne suis pas sûre de savoir comment faire. Tu peux m'apprendre?","es":"No estoy seguro de cómo hacerlo. ¿Puedes enseñarme?","pl":"Nie jestem pewien jak to zrobić. Czy możesz mi pokazać?","it":"Non sono sicuro di come farlo. Puoi insegnarmi?","sv":"Jag vet inte riktigt hur man gör. Kan du lära mig?","fi":"En ole varma miten se tehdään. Voitko opettaa minulle?","ja":"どうするのかよくわからない。教えてもらえる？","zh-CN":"我不太知道怎么做，你能教我吗？"}},{"speaker":"지수","text":"먼저 나의 주문 메뉴를 클릭해. 거기서 주문 목록을 볼 수 있어.","trans":{"en":"First, click the My Orders menu. You can see the order list there.","de":"Klicke zuerst auf das Menü Meine Bestellungen. Dort kannst du die Bestellliste sehen.","fr":"D'abord, clique sur le menu Mes commandes. Tu peux voir la liste des commandes là.","es":"Primero, haz clic en el menú Mis pedidos. Allí puedes ver la lista de pedidos.","pl":"Najpierw kliknij menu Moje zamówienia. Tam możesz zobaczyć listę zamówień.","it":"Prima, clicca sul menu I miei ordini. Lì puoi vedere l'elenco degli ordini.","sv":"Klicka först på menyn Mina beställningar. Där kan du se beställningslistan.","fi":"Napsauta ensin Omat tilaukset -valikkoa. Siellä voit nähdä tilauslistan.","ja":"まずマイオーダーメニューをクリックして。そこで注文一覧が見られるよ。","zh-CN":"先点击我的订单菜单，在那里可以看到订单列表。"}},{"speaker":"유진","text":"아, 찾았어. 배송 중이라고 나오는데 오늘 도착 예정이래.","trans":{"en":"Oh, I found it. It says In Delivery and shows it's expected to arrive today.","de":"Oh, ich habe es gefunden. Es steht In Lieferung und zeigt an, dass es heute ankommen soll.","fr":"Oh, je l'ai trouvé. Il est écrit En livraison et indique qu'il doit arriver aujourd'hui.","es":"Oh, lo encontré. Dice En camino y muestra que se espera que llegue hoy.","pl":"Och, znalazłem. Wyświetla W dostawie i pokazuje, że ma dotrzeć dzisiaj.","it":"Oh, l'ho trovato. Dice In consegna e mostra che dovrebbe arrivare oggi.","sv":"Åh, hittade det. Det står Under leverans och visar att det förväntas anlända idag.","fi":"Voi, löysin sen. Siinä lukee Toimituksessa ja se näyttää saapuvan tänään.","ja":"あ、見つけた。配送中って出てて今日到着予定だって。","zh-CN":"啊，找到了！显示配送中，预计今天到达。"}},{"speaker":"지수","text":"다행이다. 만약 문제가 있으면 고객센터에 연락하면 돼.","trans":{"en":"That's a relief. If there's a problem, you can contact customer service.","de":"Das ist erleichternd. Wenn es ein Problem gibt, kannst du den Kundendienst kontaktieren.","fr":"Quel soulagement. S'il y a un problème, tu peux contacter le service clientèle.","es":"Qué alivio. Si hay un problema, puedes contactar el servicio al cliente.","pl":"To ulga. Jeśli jest problem, możesz skontaktować się z obsługą klienta.","it":"Meno male. Se c'è un problema, puoi contattare il servizio clienti.","sv":"Det är en lättnad. Om det finns ett problem kan du kontakta kundtjänst.","fi":"Se on helpotus. Jos on ongelma, voit ottaa yhteyttä asiakaspalveluun.","ja":"よかった。もし問題があればカスタマーセンターに連絡すればいいよ。","zh-CN":"太好了。如果有问题可以联系客服。"}},{"speaker":"유진","text":"고마워. 앞으로 자주 이용해야겠다.","trans":{"en":"Thanks. I'll have to use it more often from now on.","de":"Danke. Ich werde es von nun an öfter benutzen müssen.","fr":"Merci. Je vais devoir l'utiliser plus souvent à partir de maintenant.","es":"Gracias. Tendré que usarlo más a menudo de ahora en adelante.","pl":"Dziękuję. Będę musiał korzystać z tego częściej od teraz.","it":"Grazie. Dovrò usarlo più spesso d'ora in poi.","sv":"Tack. Jag måste använda det oftare från och med nu.","fi":"Kiitos. Minun täytyy käyttää sitä useammin jatkossa.","ja":"ありがとう。これからよく使わないといけないね。","zh-CN":"谢谢！以后要经常用了。"}}],"vocab":[{"word":"배송","trans":{"en":"delivery/shipping","de":"Lieferung","fr":"livraison","es":"envío","pl":"dostawa","it":"consegna","sv":"leverans","fi":"toimitus","ja":"配送","zh-CN":"配送"}},{"word":"주문","trans":{"en":"order","de":"Bestellung","fr":"commande","es":"pedido","pl":"zamówienie","it":"ordine","sv":"beställning","fi":"tilaus","ja":"注文","zh-CN":"订单"}},{"word":"반품","trans":{"en":"return of goods","de":"Rücksendung","fr":"retour","es":"devolución","pl":"zwrot towaru","it":"reso","sv":"retur","fi":"palautus","ja":"返品","zh-CN":"退货"}},{"word":"배송 조회","trans":{"en":"delivery tracking","de":"Lieferverfolgung","fr":"suivi de livraison","es":"rastreo de envío","pl":"śledzenie dostawy","it":"tracciamento consegna","sv":"leveransspårning","fi":"toimituksen seuranta","ja":"配送追跡","zh-CN":"快递查询"}},{"word":"도착 예정","trans":{"en":"expected arrival","de":"voraussichtliche Ankunft","fr":"arrivée prévue","es":"llegada estimada","pl":"przewidywane przybycie","it":"arrivo previsto","sv":"beräknad ankomst","fi":"arvioitu saapuminen","ja":"到着予定","zh-CN":"预计到达"}},{"word":"고객센터","trans":{"en":"customer service center","de":"Kundendienst","fr":"service clientèle","es":"atención al cliente","pl":"centrum obsługi klienta","it":"centro assistenza clienti","sv":"kundtjänst","fi":"asiakaspalvelu","ja":"カスタマーセンター","zh-CN":"客服中心"}},{"word":"목록","trans":{"en":"list","de":"Liste","fr":"liste","es":"lista","pl":"lista","it":"elenco","sv":"lista","fi":"luettelo","ja":"一覧","zh-CN":"列表"}}],"patterns":[{"pattern":"~아/어 본 적 있어?","patternTrans":{"en":"Have you ever ~?","de":"Hast du jemals ~?","fr":"As-tu jamais ~?","es":"¿Alguna vez has ~?","pl":"Czy kiedykolwiek ~?","it":"Hai mai ~?","sv":"Har du någonsin ~?","fi":"Oletko koskaan ~?","ja":"〜したことある？","zh-CN":"你有没有~过？"},"example":"이 앱으로 쇼핑해 본 적 있어?","trans":{"en":"Have you ever shopped with this app?","de":"Hast du jemals mit dieser App eingekauft?","fr":"As-tu jamais fait des achats avec cette application?","es":"¿Alguna vez has comprado con esta aplicación?","pl":"Czy kiedykolwiek robiłeś zakupy przez tę aplikację?","it":"Hai mai fatto acquisti con questa app?","sv":"Har du någonsin handlat med den här appen?","fi":"Oletko koskaan ostanut tällä sovelluksella?","ja":"このアプリでショッピングしたことある？","zh-CN":"你有没有用这个应用购物过？"}},{"pattern":"~(으)면 돼","patternTrans":{"en":"You just need to ~","de":"Du musst nur ~","fr":"Il suffit de ~","es":"Solo tienes que ~","pl":"Wystarczy ~","it":"Basta ~","sv":"Du behöver bara ~","fi":"Sinun tarvitsee vain ~","ja":"〜すればいいよ","zh-CN":"只要~就行了"},"example":"고객센터에 연락하면 돼.","trans":{"en":"You just need to contact customer service.","de":"Du musst nur den Kundendienst kontaktieren.","fr":"Il suffit de contacter le service clientèle.","es":"Solo tienes que contactar el servicio al cliente.","pl":"Wystarczy skontaktować się z obsługą klienta.","it":"Basta contattare il servizio clienti.","sv":"Du behöver bara kontakta kundtjänst.","fi":"Sinun tarvitsee vain ottaa yhteyttä asiakaspalveluun.","ja":"カスタマーセンターに連絡すればいいよ。","zh-CN":"联系客服就行了。"}},{"pattern":"~라고 나오는데 ~래","patternTrans":{"en":"It shows ~ and says ~","de":"Es zeigt ~ und sagt ~","fr":"Il affiche ~ et indique ~","es":"Muestra ~ y dice ~","pl":"Wyświetla ~ i pokazuje ~","it":"Mostra ~ e dice ~","sv":"Det visar ~ och säger ~","fi":"Se näyttää ~ ja sanoo ~","ja":"〜って出てて〜だって","zh-CN":"显示~，说~"},"example":"배송 중이라고 나오는데 오늘 도착 예정이래.","trans":{"en":"It says In Delivery and shows it is expected to arrive today.","de":"Es steht In Lieferung und zeigt an, dass es heute ankommen soll.","fr":"Il est écrit En livraison et indique qu'il doit arriver aujourd'hui.","es":"Dice En camino y muestra que se espera que llegue hoy.","pl":"Wyświetla W dostawie i pokazuje, że ma dotrzeć dzisiaj.","it":"Dice In consegna e mostra che dovrebbe arrivare oggi.","sv":"Det står Under leverans och visar att det förväntas anlända idag.","fi":"Siinä lukee Toimituksessa ja se näyttää saapuvan tänään.","ja":"配送中って出てて今日到着予定だって。","zh-CN":"显示配送中，说预计今天到达。"}}],"quizzes":[{"type":"이해","questionAudio":"유진이 앱을 처음 사용한 것은 언제인가요?","questionTrans":{"en":"When did Yujin first use the app?","de":"Wann hat Yujin die App zum ersten Mal benutzt?","fr":"Quand Yujin a-t-elle utilisé l'application pour la première fois?","es":"¿Cuándo usó Yujin la aplicación por primera vez?","pl":"Kiedy Yujin użyła aplikacji po raz pierwszy?","it":"Quando Yujin ha usato l'app per la prima volta?","sv":"När använde Yujin appen för första gången?","fi":"Milloin Yujin käytti sovellusta ensimmäistä kertaa?","ja":"ユジンが初めてアプリを使ったのはいつですか？","zh-CN":"有真是什么时候第一次使用该应用程序的？"},"options":[{"text":"오늘","trans":{"en":"Today","de":"Heute","fr":"Aujourd'hui","es":"Hoy","pl":"Dzisiaj","it":"Oggi","sv":"Idag","fi":"Tänään","ja":"今日","zh-CN":"今天"}},{"text":"어제","trans":{"en":"Yesterday","de":"Gestern","fr":"Hier","es":"Ayer","pl":"Wczoraj","it":"Ieri","sv":"Igår","fi":"Eilen","ja":"昨日","zh-CN":"昨天"}},{"text":"지난주","trans":{"en":"Last week","de":"Letzte Woche","fr":"La semaine dernière","es":"La semana pasada","pl":"W zeszłym tygodniu","it":"La settimana scorsa","sv":"Förra veckan","fi":"Viime viikolla","ja":"先週","zh-CN":"上周"}},{"text":"한 달 전","trans":{"en":"A month ago","de":"Vor einem Monat","fr":"Il y a un mois","es":"Hace un mes","pl":"Miesiąc temu","it":"Un mese fa","sv":"För en månad sedan","fi":"Kuukausi sitten","ja":"一ヶ月前","zh-CN":"一个月前"}}],"answer":1,"explanation":"유진이 '나는 어제 처음으로 주문했다'고 말했습니다."},{"type":"이해","questionAudio":"배송 상태를 확인하려면 어떤 메뉴를 클릭해야 하나요?","questionTrans":{"en":"What menu should you click to check the delivery status?","de":"Welches Menü muss man anklicken, um den Lieferstatus zu überprüfen?","fr":"Sur quel menu doit-on cliquer pour vérifier le statut de livraison?","es":"¿En qué menú debes hacer clic para verificar el estado de entrega?","pl":"W jakim menu należy kliknąć, aby sprawdzić status dostawy?","it":"Su quale menu bisogna cliccare per verificare lo stato della consegna?","sv":"Vilken meny ska du klicka på för att kontrollera leveransstatus?","fi":"Mitä valikkoa sinun täytyy napsauttaa tarkistaaksesi toimituksen tilan?","ja":"配送状況を確認するにはどのメニューをクリックすればいいですか？","zh-CN":"要查看配送状态需要点击哪个菜单？"},"options":[{"text":"홈","trans":{"en":"Home","de":"Startseite","fr":"Accueil","es":"Inicio","pl":"Strona główna","it":"Home","sv":"Hem","fi":"Koti","ja":"ホーム","zh-CN":"首页"}},{"text":"장바구니","trans":{"en":"Cart","de":"Warenkorb","fr":"Panier","es":"Carrito","pl":"Koszyk","it":"Carrello","sv":"Kundvagn","fi":"Ostoskori","ja":"カート","zh-CN":"购物车"}},{"text":"나의 주문","trans":{"en":"My Orders","de":"Meine Bestellungen","fr":"Mes commandes","es":"Mis pedidos","pl":"Moje zamówienia","it":"I miei ordini","sv":"Mina beställningar","fi":"Omat tilaukset","ja":"マイオーダー","zh-CN":"我的订单"}},{"text":"검색","trans":{"en":"Search","de":"Suche","fr":"Recherche","es":"Búsqueda","pl":"Wyszukiwarka","it":"Ricerca","sv":"Sök","fi":"Haku","ja":"検索","zh-CN":"搜索"}}],"answer":2,"explanation":"지수가 나의 주문 메뉴를 클릭하면 주문 목록을 볼 수 있다고 말했습니다."},{"type":"이해","questionAudio":"유진의 배송은 언제 도착할 예정인가요?","questionTrans":{"en":"When is Yujin's delivery expected to arrive?","de":"Wann soll Yujins Lieferung ankommen?","fr":"Quand la livraison de Yujin est-elle prévue d'arriver?","es":"¿Cuándo se espera que llegue la entrega de Yujin?","pl":"Kiedy dostawa Yujin ma dotrzeć?","it":"Quando è previsto l'arrivo della consegna di Yujin?","sv":"När förväntas Yujins leverans anlända?","fi":"Milloin Yujinin toimitus on arvioitu saapuvan?","ja":"ユジンの配送はいつ到着する予定ですか？","zh-CN":"有真的快递预计什么时候到达？"},"options":[{"text":"내일","trans":{"en":"Tomorrow","de":"Morgen","fr":"Demain","es":"Mañana","pl":"Jutro","it":"Domani","sv":"Imorgon","fi":"Huomenna","ja":"明日","zh-CN":"明天"}},{"text":"모레","trans":{"en":"The day after tomorrow","de":"Übermorgen","fr":"Après-demain","es":"Pasado mañana","pl":"Pojutrze","it":"Dopodomani","sv":"I övermorgon","fi":"Ylihuomenna","ja":"明後日","zh-CN":"后天"}},{"text":"오늘","trans":{"en":"Today","de":"Heute","fr":"Aujourd'hui","es":"Hoy","pl":"Dzisiaj","it":"Oggi","sv":"Idag","fi":"Tänään","ja":"今日","zh-CN":"今天"}},{"text":"이번 주말","trans":{"en":"This weekend","de":"Dieses Wochenende","fr":"Ce week-end","es":"Este fin de semana","pl":"Ten weekend","it":"Questo fine settimana","sv":"Den här helgen","fi":"Tänä viikonloppuna","ja":"今週末","zh-CN":"本周末"}}],"answer":2,"explanation":"유진이 오늘 도착 예정이라고 앱에 나와 있다고 했습니다."}]},
  14: {"id":14,"title":"동료와 점심","titleTrans":{"en":"Lunch with a Colleague","de":"Mittagessen mit einem Kollegen","fr":"Déjeuner avec un collègue","es":"Almuerzo con un compañero","pl":"Lunch z kolegą","it":"Pranzo con un collega","sv":"Lunch med en kollega","fi":"Lounas kollegan kanssa","ja":"同僚とランチ","zh-CN":"与同事共进午餐"},"desc":"직장 동료와 함께 점심 메뉴를 고르고 식사하는 과정을 배웁니다.","descTrans":{"en":"Learn how to choose a lunch menu and eat with a work colleague.","de":"Lernen Sie, wie man mit einem Arbeitskollegen ein Mittagsmenü auswählt.","fr":"Apprenez à choisir un menu de déjeuner et à manger avec un collègue.","es":"Aprende a elegir un menú de almuerzo con un compañero de trabajo.","pl":"Dowiedz się, jak wybrać menu na lunch z kolegą z pracy.","it":"Impara come scegliere un menu per il pranzo con un collega.","sv":"Lär dig hur du väljer en lunchmeny med en arbetskollega.","fi":"Opi valitsemaan lounasmenu työkollegan kanssa.","ja":"職場の同僚と一緒にランチメニューを選ぶ方法を学びます。","zh-CN":"学习与职场同事一起选择午餐菜单的过程。"},"dialogue":[{"speaker":"현우","text":"민준 씨, 오늘 점심 같이 먹을래요?","trans":{"en":"Minjun, would you like to have lunch together today?","de":"Minjun, möchten Sie heute zusammen zu Mittag essen?","fr":"Minjun, voulez-vous déjeuner ensemble aujourd'hui?","es":"Minjun, ¿le gustaría almorzar juntos hoy?","pl":"Minjun, czy chciałbyś zjeść razem obiad dzisiaj?","it":"Minjun, vuole pranzare insieme oggi?","sv":"Minjun, vill du äta lunch tillsammans idag?","fi":"Minjun, haluaisitko syödä lounaan yhdessä tänään?","ja":"ミンジュンさん、今日一緒にランチ食べませんか？","zh-CN":"民准，今天一起吃午饭吗？"}},{"speaker":"민준","text":"좋아요! 뭐 먹을까요? 배가 많이 고프네요.","trans":{"en":"Sure! What shall we eat? I'm really hungry.","de":"Gerne! Was sollen wir essen? Ich bin sehr hungrig.","fr":"Bien sûr! Qu'allons-nous manger? J'ai très faim.","es":"¡Claro! ¿Qué vamos a comer? Tengo mucha hambre.","pl":"Chętnie! Co będziemy jeść? Jestem bardzo głodny.","it":"Certo! Cosa mangiamo? Ho molta fame.","sv":"Visst! Vad ska vi äta? Jag är väldigt hungrig.","fi":"Toki! Mitä syömme? Minulla on todella nälkä.","ja":"いいですね！何食べましょうか？すごくお腹が空いています。","zh-CN":"好啊！吃什么好呢？我很饿。"}},{"speaker":"현우","text":"요즘 회사 근처에 새로 생긴 한식집이 있어요. 거기 어때요?","trans":{"en":"There's a new Korean restaurant near the office lately. How about there?","de":"Es gibt neuerdings ein neues koreanisches Restaurant in der Nähe des Büros.","fr":"Il y a un nouveau restaurant coréen ouvert récemment près du bureau. Qu'en est-il?","es":"Hay un nuevo restaurante coreano que abrió recientemente cerca de la oficina.","pl":"Niedawno przy biurze otworzył się nowy koreański lokal. Co ty na to?","it":"C'è un nuovo ristorante coreano aperto di recente vicino all'ufficio.","sv":"Det finns ett nytt koreanskt restaurang nära kontoret. Vad säger du?","fi":"Toimiston lähellä on äskettäin avattu uusi korealainen ravintola. Mitä siitä?","ja":"最近、会社の近くに新しくできた韓食屋があります。そこはどうですか？","zh-CN":"最近公司附近新开了一家韩餐馆，去那里怎么样？"}},{"speaker":"민준","text":"저는 매운 음식을 잘 못 먹는데 거기 메뉴가 많이 매운가요?","trans":{"en":"I'm not good with spicy food. Is the menu there very spicy?","de":"Ich esse nicht gerne scharf. Sind die Gerichte dort sehr scharf?","fr":"Je ne mange pas très bien les plats épicés. Le menu est-il très épicé là-bas?","es":"No soy bueno con la comida picante. ¿El menú allí es muy picante?","pl":"Nie jem dobrze ostrych potraw. Czy menu tam jest bardzo ostre?","it":"Non sono bravo con il cibo piccante. Il menu lì è molto piccante?","sv":"Jag är inte bra på kryddig mat. Är menyn där väldigt kryddig?","fi":"En pärjää hyvin mausteisen ruoan kanssa. Onko menu siellä todella mausteinen?","ja":"私は辛い食べ物が苦手なんですが、そこのメニューはとても辛いですか？","zh-CN":"我不太吃得了辣的食物，那里的菜单很辣吗？"}},{"speaker":"현우","text":"매운 것도 있지만 순한 음식도 많아요. 비빔밥이나 된장찌개는 어때요?","trans":{"en":"There are spicy items, but there's also plenty of mild food. How about bibimbap or doenjang jjigae?","de":"Es gibt zwar scharfe Gerichte, aber auch viel mildes Essen. Wie wäre es mit Bibimbap oder Doenjang Jjigae?","fr":"Il y a des plats épicés, mais il y a aussi beaucoup de nourriture douce. Que diriez-vous de bibimbap ou de doenjang jjigae?","es":"Hay platos picantes, pero también hay mucha comida suave. ¿Qué tal bibimbap o doenjang jjigae?","pl":"Są ostre potrawy, ale jest też dużo łagodnych. Co powiesz na bibimbap lub doenjang jjigae?","it":"Ci sono piatti piccanti, ma c'è anche molto cibo delicato. Che ne dici di bibimbap o doenjang jjigae?","sv":"Det finns kryddiga rätter, men det finns också mycket mild mat. Vad säger du om bibimbap eller doenjang jjigae?","fi":"Siellä on mausteisia annoksia, mutta myös paljon mietoa ruokaa. Entä bibimbap tai doenjang jjigae?","ja":"辛い料理もありますが、マイルドな料理もたくさんありますよ。ビビンバかテンジャンチゲはどうですか？","zh-CN":"辣的也有，但清淡的食物也很多。拌饭或大酱汤怎么样？"}},{"speaker":"민준","text":"된장찌개 좋아요. 그런데 오늘 점심시간이 좀 짧은데 빨리 먹을 수 있을까요?","trans":{"en":"I like doenjang jjigae. But today's lunch break is a bit short. Can we eat quickly?","de":"Ich mag Doenjang Jjigae. Aber die Mittagspause ist heute etwas kurz. Können wir schnell essen?","fr":"J'aime le doenjang jjigae. Mais la pause déjeuner d'aujourd'hui est un peu courte. Pouvons-nous manger rapidement?","es":"Me gusta el doenjang jjigae. Pero el almuerzo de hoy es un poco corto. ¿Podemos comer rápido?","pl":"Lubię doenjang jjigae. Ale dzisiaj przerwa na lunch jest trochę krótka. Czy możemy jeść szybko?","it":"Mi piace il doenjang jjigae. Ma la pausa pranzo di oggi è un po' corta. Possiamo mangiare velocemente?","sv":"Jag gillar doenjang jjigae. Men lunchrasten är lite kort idag. Kan vi äta snabbt?","fi":"Pidän doenjang jjigaesta. Mutta tänään lounastauko on vähän lyhyt. Voimmeko syödä nopeasti?","ja":"テンジャンチゲ良いですね。でも今日のランチタイムが少し短いのですが、早く食べられますか？","zh-CN":"我喜欢大酱汤。但今天午休时间有点短，能吃得快吗？"}},{"speaker":"현우","text":"그 식당은 보통 주문하고 10분 안에 나와요. 걱정하지 마세요.","trans":{"en":"That restaurant usually serves within 10 minutes of ordering. Don't worry.","de":"Dieses Restaurant serviert normalerweise innerhalb von 10 Minuten nach der Bestellung. Machen Sie sich keine Sorgen.","fr":"Ce restaurant sert généralement dans les 10 minutes suivant la commande. Ne vous inquiétez pas.","es":"Ese restaurante suele servir en 10 minutos después de pedir. No se preocupe.","pl":"Ta restauracja zazwyczaj podaje jedzenie w ciągu 10 minut od zamówienia. Nie martw się.","it":"Quel ristorante di solito serve entro 10 minuti dall'ordine. Non si preoccupi.","sv":"Den restaurangen serverar vanligtvis inom 10 minuter efter beställning. Oroa dig inte.","fi":"Se ravintola yleensä tarjoilee tilauksesta 10 minuutin sisällä. Älä huoli.","ja":"あのレストランは普通、注文してから10分以内に出てきますよ。心配しないでください。","zh-CN":"那家餐厅通常点餐后10分钟以内就上菜了。不用担心。"}},{"speaker":"민준","text":"그럼 빨리 출발해요! 저 오늘 회의도 있어서 늦으면 안 돼요.","trans":{"en":"Then let's go quickly! I have a meeting today too, so I can't be late.","de":"Dann gehen wir schnell! Ich habe heute auch ein Meeting, also darf ich nicht zu spät kommen.","fr":"Alors partons vite! J'ai aussi une réunion aujourd'hui, donc je ne peux pas être en retard.","es":"¡Entonces vámonos rápido! Hoy también tengo una reunión, así que no puedo llegar tarde.","pl":"Więc chodźmy szybko! Mam też dziś spotkanie, więc nie mogę się spóźnić.","it":"Allora andiamo in fretta! Oggi ho anche una riunione, quindi non posso essere in ritardo.","sv":"Låt oss gå snabbt då! Jag har ett möte idag också, så jag kan inte vara sen.","fi":"Sitten lähdetään nopeasti! Minulla on myös kokous tänään, joten en voi olla myöhässä.","ja":"じゃあ早く出発しましょう！今日会議もあるので遅れたらだめなんです。","zh-CN":"那我们快点出发吧！我今天还有会议，不能迟到。"}},{"speaker":"현우","text":"알겠어요. 가는 길에 음료수도 사면 어때요?","trans":{"en":"Got it. How about buying drinks on the way?","de":"Alright. Wie wäre es, wenn wir unterwegs Getränke kaufen?","fr":"D'accord. Que diriez-vous d'acheter des boissons en chemin?","es":"Entendido. ¿Qué tal si compramos bebidas de camino?","pl":"Rozumiem. Co powiesz na zakup napojów po drodze?","it":"Capito. Che ne dice di comprare delle bevande lungo la strada?","sv":"Förstår. Vad säger du om att köpa drycker på vägen?","fi":"Selvä. Mitä jos ostaisimme juomia matkalla?","ja":"わかりました。行く途中に飲み物   15: {"id":15,"title":"날씨와 여행 계획","titleTrans":{"en":"Weather and Travel Plans","de":"Wetter und Reisepläne","fr":"Météo et plans de voyage","es":"Clima y planes de viaje","pl":"Pogoda i plany podróży","it":"Meteo e piani di viaggio","sv":"Väder och reseplaner","fi":"Sää ja matkasuunnitelmat","ja":"天気と旅行計画","zh-CN":"天气与旅行计划"},"desc":"날씨에 따라 여행 계획을 변경하는 방법을 배웁니다.","descTrans":{"en":"Learn how to change travel plans depending on the weather.","de":"Lernen Sie, wie man Reisepläne je nach Wetter ändert.","fr":"Apprenez à modifier les plans de voyage en fonction de la météo.","es":"Aprende cómo cambiar los planes de viaje según el clima.","pl":"Dowiedz się, jak zmieniać plany podróży w zależności od pogody.","it":"Impara come modificare i piani di viaggio in base al meteo.","sv":"Lär dig hur du ändrar reseplaner beroende på vädret.","fi":"Opi muuttamaan matkasuunnitelmia säästä riippuen.","ja":"天気に応じて旅行計画を変更する方法を学びます。","zh-CN":"学习根据天气情况更改旅行计划的方法。"},"dialogue":[{"speaker":"지수","text":"유진아, 이번 주말에 부산 여행 갈 준비 됐어?","trans":{"en":"Yujin, are you ready for the Busan trip this weekend?","de":"Yujin, bist du bereit für die Busan-Reise dieses Wochenende?","fr":"Yujin, es-tu prête pour le voyage à Busan ce week-end?","es":"Yujin, ¿estás lista para el viaje a Busan este fin de semana?","pl":"Yujin, czy jesteś gotowa na wyjazd do Busan w ten weekend?","it":"Yujin, sei pronta per il viaggio a Busan questo fine settimana?","sv":"Yujin, är du redo för Busan-resan den här helgen?","fi":"Yujin, oletko valmis Busan-matkalle tänä viikonloppuna?","ja":"ユジン、今週末の釜山旅行の準備できた？","zh-CN":"有真，这个周末去釜山旅行准备好了吗？"}},{"speaker":"유진","text":"그런데 날씨 예보 봤어? 주말에 비가 많이 온다고 했어.","trans":{"en":"But did you see the weather forecast? It said it will rain a lot on the weekend.","de":"Aber hast du die Wettervorhersage gesehen? Es wurde gesagt, dass es am Wochenende viel regnen wird.","fr":"Mais as-tu vu la météo? Il a dit qu'il pleuvrait beaucoup ce week-end.","es":"¿Pero viste el pronóstico del tiempo? Dijo que lloverá mucho el fin de semana.","pl":"Ale widziałaś prognozę pogody? Mówiono, że w weekend będzie dużo deszczu.","it":"Ma hai visto le previsioni del tempo? Dicevano che pioverà molto nel fine settimana.","sv":"Men har du sett väderleksrapporten? Det sa att det skulle regna mycket under helgen.","fi":"Mutta näitkö sääennusteen? Se sanoi, että viikonloppuna sataa paljon.","ja":"でも天気予報見た？週末に雨がたくさん降るって言ってたよ。","zh-CN":"但是你看天气预报了吗？说周末会下很多雨。"}},{"speaker":"지수","text":"아, 정말? 나는 바다에서 놀고 싶었는데 이런.","trans":{"en":"Oh, really? I wanted to play by the sea, that's a shame.","de":"Oh, wirklich? Ich wollte am Meer spielen, wie schade.","fr":"Oh, vraiment? Je voulais jouer en bord de mer, quel dommage.","es":"¡Oh, de verdad! Quería jugar junto al mar, qué lástima.","pl":"Och, naprawdę? Chciałam bawić się nad morzem, szkoda.","it":"Oh, davvero? Volevo giocare in riva al mare, che peccato.","sv":"Åh, verkligen? Jag ville leka vid havet, det är synd.","fi":"Voi, oikeasti? Halusin leikkiä meren äärellä, harmi.","ja":"え、本当に？海で遊びたかったのに、残念。","zh-CN":"哦，真的吗？我想在海边玩，真可惜。"}},{"speaker":"유진","text":"계획을 바꾸는 게 나을 것 같아. 다음 주로 미루는 건 어때?","trans":{"en":"I think it's better to change the plan. How about postponing to next week?","de":"Ich denke, es ist besser, den Plan zu ändern. Wie wäre es, es auf nächste Woche zu verschieben?","fr":"Je pense qu'il vaut mieux changer le plan. Que diriez-vous de le reporter à la semaine prochaine?","es":"Creo que es mejor cambiar el plan. ¿Qué tal posponerlo a la próxima semana?","pl":"Myślę, że lepiej zmienić plan. Co powiesz na przełożenie na przyszły tydzień?","it":"Penso che sia meglio cambiare il piano. Che ne dici di rimandare alla prossima settimana?","sv":"Jag tror det är bättre att ändra planen. Vad säger du om att skjuta upp det till nästa vecka?","fi":"Mielestäni on parempi muuttaa suunnitelma. Mitä jos lykkäisimme ensi viikoksi?","ja":"計画を変えた方が良さそう。来週に延ばすのはどう？","zh-CN":"我觉得最好改变计划，推迟到下周怎么样？"}},{"speaker":"지수","text":"다음 주에도 시간이 날지 모르겠어. 비가 오더라도 그냥 가는 건 어때?","trans":{"en":"I'm not sure I'll have time next week. How about just going even if it rains?","de":"Ich weiß nicht, ob ich nächste Woche Zeit haben werde. Wie wäre es, einfach zu gehen, auch wenn es regnet?","fr":"Je ne suis pas sûre d'avoir du temps la semaine prochaine. Que diriez-vous d'y aller quand même, même s'il pleut?","es":"No sé si tendré tiempo la próxima semana. ¿Qué tal ir de todos modos aunque llueva?","pl":"Nie wiem, czy będę mieć czas w przyszłym tygodniu. Co powiesz na to, żeby pojechać, nawet jeśli będzie deszcz?","it":"Non so se avrò tempo la prossima settimana. Che ne dici di andare lo stesso anche se piove?","sv":"Jag vet inte om jag har tid nästa vecka. Vad säger du om att bara åka trots att det regnar?","fi":"En tiedä onko minulla aikaa ensi viikolla. Mitä jos mentäisiin siitä huolimatta, vaikka sataakin?","ja":"来週も時間があるかわからないよ。雨が降っても普通に行くのはどう？","zh-CN":"下周不知道有没有时间。就算下雨也直接去怎么样？"}},{"speaker":"유진","text":"비가 오면 실내 관광지를 위주로 돌아다니면 되지. 부산에 박물관이나 쇼핑센터도 많잖아.","trans":{"en":"If it rains, we can just focus on indoor attractions. Busan has plenty of museums and shopping centers.","de":"Wenn es regnet, können wir uns auf Innenattraktionen konzentrieren. Busan hat viele Museen und Einkaufszentren.","fr":"Si ça pleut, on peut se concentrer sur les attractions intérieures. Busan a beaucoup de musées et de centres commerciaux.","es":"Si llueve, podemos centrarnos en atracciones de interior. Busan tiene muchos museos y centros comerciales.","pl":"Jeśli będzie deszcz, możemy skupić się na atrakcjach wewnętrznych. Busan ma wiele muzeów i centrów handlowych.","it":"Se piove, possiamo concentrarci sulle attrazioni al coperto. Busan ha molti musei e centri commerciali.","sv":"Om det regnar kan vi fokusera på inomhus attraktioner. Busan har gott om museer och shoppingcenter.","fi":"Jos sataa, voimme keskittyä sisätiloissa oleviin nähtävyyksiin. Busanissa on paljon museoita ja kauppakeskuksia.","ja":"雨が降ったら屋内観光地を中心に回ればいいじゃない。釜山には博物館やショッピングセンターも多いでしょ。","zh-CN":"如果下雨就主要逛室内景点好了。釜山有很多博物馆和购物中心。"}},{"speaker":"지수","text":"그렇네. 그럼 아침에 날씨 보고 최종 결정하자.","trans":{"en":"True. Then let's make the final decision by checking the weather in the morning.","de":"Stimmt. Dann lass uns die endgültige Entscheidung nach dem Überprüfen des Wetters am Morgen treffen.","fr":"C'est vrai. Alors décidons définitivement en vérifiant la météo le matin.","es":"Es verdad. Entonces tomemos la decisión final revisando el tiempo por la mañana.","pl":"Racja. Więc podejmijmy ostateczną decyzję sprawdzając pogodę rano.","it":"È vero. Allora prendiamo la decisione finale controllando il tempo al mattino.","sv":"Det stämmer. Låt oss ta det slutgiltiga beslutet genom att kolla vädret på morgonen.","fi":"Totta. Tehdään sitten lopullinen päätös tarkistamalla sää aamulla.","ja":"そうだね。じゃあ朝に天気を見て最終決定しよう。","zh-CN":"说得对。那早上看天气再做最终决定吧。"}},{"speaker":"유진","text":"좋아. 그리고 우산이랑 방수 재킷도 미리 챙겨 두자.","trans":{"en":"Good. And let's pack an umbrella and a waterproof jacket in advance.","de":"Gut. Und packen wir einen Regenschirm und eine wasserdichte Jacke im Voraus ein.","fr":"Bien. Et emportons un parapluie et une veste imperméable à l'avance.","es":"Bien. Y empaquemos un paraguas y una chaqueta impermeable con anticipación.","pl":"Dobrze. I spakujmy wcześniej parasol i kurtkę przeciwdeszczową.","it":"Bene. E prepariamo in anticipo un ombrello e una giacca impermeabile.","sv":"Bra. Och låt oss packa ett paraply och en vattentät jacka i förväg.","fi":"Hyvä. Ja pakataan sateenvarjo ja vedenpitävä takki etukäteen.","ja":"良いね。そして傘と防水ジャケットも事前に用意しておこう。","zh-CN":"好的。还有提前准备好雨伞和防水夹克。"}},{"speaker":"지수","text":"그래, 어떤 날씨가 와도 즐길 수 있게 준비하자!","trans":{"en":"Sure, let's prepare so we can enjoy it no matter what the weather is!","de":"Gut, lass uns vorbereiten, damit wir es egal bei welchem Wetter genießen können!","fr":"D'accord, préparons-nous pour profiter peu importe le temps!","es":"Bien, preparémonos para disfrutarlo sin importar el clima!","pl":"Dobrze, przygotujmy się, żeby móc cieszyć się bez względu na pogodę!","it":"Giusto, prepariamoci per goderci qualunque tempo faccia!","sv":"Bra, låt oss förbereda oss så att vi kan njuta oavsett väder!","fi":"Hyvä, valmistaudutaan niin, että voimme nauttia säästä riippumatta!","ja":"そうだね、どんな天気が来ても楽しめるように準備しよう！","zh-CN":"好，无论什么天气都能享受，做好准备吧！"}}],"vocab":[{"word":"날씨 예보","trans":{"en":"weather forecast","de":"Wettervorhersage","fr":"prévisions météo","es":"pronóstico del tiempo","pl":"prognoza pogody","it":"previsioni del tempo","sv":"väderleksrapport","fi":"sääennuste","ja":"天気予報","zh-CN":"天气预报"}},{"word":"미루다","trans":{"en":"to postpone","de":"verschieben","fr":"reporter","es":"posponer","pl":"odkładać","it":"rimandare","sv":"skjuta upp","fi":"lykätä","ja":"延ばす","zh-CN":"推迟"}},{"word":"실내","trans":{"en":"indoor","de":"Innen-","fr":"intérieur","es":"interior","pl":"wewnętrzny","it":"interno","sv":"inomhus","fi":"sisätilat","ja":"室内","zh-CN":"室内"}},{"word":"관광지","trans":{"en":"tourist attraction","de":"Touristenattraktion","fr":"site touristique","es":"atracción turística","pl":"atrakcja turystyczna","it":"attrazione turistica","sv":"turistattraktion","fi":"turistinähtävyys","ja":"観光地","zh-CN":"旅游景点"}},{"word":"최종 결정","trans":{"en":"final decision","de":"endgültige Entscheidung","fr":"décision finale","es":"decisión final","pl":"ostateczna decyzja","it":"decisione finale","sv":"slutgiltigt beslut","fi":"lopullinen päätös","ja":"最終決定","zh-CN":"最终决定"}},{"word":"방수 재킷","trans":{"en":"waterproof jacket","de":"wasserdichte Jacke","fr":"veste imperméable","es":"chaqueta impermeable","pl":"kurtka przeciwdeszczowa","it":"giacca impermeabile","sv":"vattentät jacka","fi":"vedenpitävä takki","ja":"防水ジャケット","zh-CN":"防水夹克"}},{"word":"챙기다","trans":{"en":"to pack/prepare","de":"einpacken","fr":"préparer","es":"preparar","pl":"spakować","it":"preparare","sv":"packa","fi":"pakata","ja":"用意する","zh-CN":"准备好"}}],"patterns":[{"pattern":"~는 게 나을 것 같아","patternTrans":{"en":"I think it's better to ~","de":"Ich denke, es ist besser zu ~","fr":"Je pense qu'il vaut mieux ~","es":"Creo que es mejor ~","pl":"Myślę, że lepiej ~","it":"Penso che sia meglio ~","sv":"Jag tror det är bättre att ~","fi":"Mielestäni on parempi ~","ja":"〜する方がよさそう","zh-CN":"我觉得最好是~"},"example":"계획을 바꾸는 게 나을 것 같아.","trans":{"en":"I think it's better to change the plan.","de":"Ich denke, es ist besser, den Plan zu ändern.","fr":"Je pense qu'il vaut mieux changer le plan.","es":"Creo que es mejor cambiar el plan.","pl":"Myślę, że lepiej zmienić plan.","it":"Penso che sia meglio cambiare il piano.","sv":"Jag tror det är bättre att ändra planen.","fi":"Mielestäni on parempi muuttaa suunnitelma.","ja":"計画を変えた方がよさそう。","zh-CN":"我觉得最好改变计划。"}},{"pattern":"~더라도 ~(으)면 되지","patternTrans":{"en":"Even if ~, you can just ~","de":"Selbst wenn ~, kann man einfach ~","fr":"Même si ~, tu peux juste ~","es":"Incluso si ~, puedes simplemente ~","pl":"Nawet jeśli ~, możesz po prostu ~","it":"Anche se ~, puoi semplicemente ~","sv":"Även om ~, kan du bara ~","fi":"Vaikka ~, voit vain ~","ja":"〜でも〜すればいい","zh-CN":"就算~，~就行了"},"example":"비가 오더라도 실내 관광지를 위주로 돌아다니면 되지.","trans":{"en":"Even if it rains, you can just focus on indoor attractions.","de":"Selbst wenn es regnet, kann man sich auf Innenattraktionen konzentrieren.","fr":"Même s'il pleut, tu peux te concentrer sur les attractions intérieures.","es":"Incluso si llueve, puedes enfocarte en las atracciones de interior.","pl":"Nawet jeśli będzie deszcz, możesz skupić się na atrakcjach wewnętrznych.","it":"Anche se piove, puoi concentrarti sulle attrazioni al coperto.","sv":"Även om det regnar, kan du fokusera på inomhusattraktioner.","fi":"Vaikka sataakin, voit vain keskittyä sisätilojen nähtävyyksiin.","ja":"雨が降っても屋内観光地を中心に回ればいい。","zh-CN":"就算下雨，主要逛室内景点就行了。"}},{"pattern":"~(이)랑 ~도 미리 챙겨 두자","patternTrans":{"en":"Let's pack ~ and ~ in advance too","de":"Lass uns auch ~ und ~ im Voraus einpacken","fr":"Préparons aussi ~ et ~ à l'avance","es":"Empaquemos ~ y ~ también con anticipación","pl":"Spakujmy też ~ i ~ wcześniej","it":"Prepariamo anche ~ e ~ in anticipo","sv":"Låt oss packa ~ och ~ i förväg också","fi":"Pakataan myös ~ ja ~ etukäteen","ja":"〜と〜も前もって用意しておこう","zh-CN":"也提前把~和~准备好"},"example":"우산이랑 방수 재킷도 미리 챙겨 두자.","trans":{"en":"Let's pack an umbrella and a waterproof jacket in advance too.","de":"Lass uns auch einen Regenschirm und eine wasserdichte Jacke im Voraus einpacken.","fr":"Préparons aussi un parapluie et une veste imperméable à l'avance.","es":"Empaquemos también un paraguas y una chaqueta impermeable con anticipación.","pl":"Spakujmy też wcześniej parasol i kurtkę przeciwdeszczową.","it":"Prepariamo anche un ombrello e una giacca impermeabile in anticipo.","sv":"Låt oss också packa ett paraply och en vattentät jacka i förväg.","fi":"Pakataan myös sateenvarjo ja vedenpitävä takki etukäteen.","ja":"傘と防水ジャケットも前もって用意しておこう。","zh-CN":"也提前把雨伞和防水夹克准备好。"}}],"quizzes":[{"type":"이해","questionAudio":"왜 여행 계획을 바꿔야 할 수도 있나요?","questionTrans":{"en":"Why might the travel plan need to be changed?","de":"Warum könnte der Reiseplan geändert werden müssen?","fr":"Pourquoi le plan de voyage pourrait-il devoir être modifié?","es":"¿Por qué el plan de viaje podría necesitar cambiarse?","pl":"Dlaczego plan podróży może wymagać zmiany?","it":"Perché il piano di viaggio potrebbe dover essere cambiato?","sv":"Varför kan reseplanen behöva ändras?","fi":"Miksi matkasuunnitelmaa saattaa täytyä muuttaa?","ja":"旅行計画を変更しなければならないかもしれない理由は何ですか？","zh-CN":"为什么旅行计划可能需要改变？"},"options":[{"text":"기차 예약이 안 돼서","trans":{"en":"Because the train reservation did not work","de":"Weil die Zugbuchung nicht geklappt hat","fr":"Parce que la réservation de train n'a pas fonctionné","es":"Porque la reserva del tren no funcionó","pl":"Ponieważ rezerwacja pociągu nie wyszła","it":"Perché la prenotazione del treno non ha funzionato","sv":"Eftersom tågreservationen inte fungerade","fi":"Koska junavarausta ei saatu tehtyä","ja":"電車の予約ができないから","zh-CN":"因为火车预订失败了"}},{"text":"주말에 비가 많이 온다고 해서","trans":{"en":"Because it is forecast to rain a lot on the weekend","de":"Weil für das Wochenende viel Regen vorhergesagt ist","fr":"Parce qu'il est prévu de beaucoup pleuvoir le week-end","es":"Porque se pronostica mucha lluvia para el fin de semana","pl":"Ponieważ na weekend zapowiadają dużo deszczu","it":"Perché è previsto che piova molto nel fine settimana","sv":"Eftersom det förväntas regna mycket under helgen","fi":"Koska viikonlopuksi on ennustettu paljon sadetta","ja":"週末に雨がたくさん降るという予報だから","zh-CN":"因为预报周末会下很多雨"}},{"text":"숙소 예약이 취소돼서","trans":{"en":"Because the accommodation reservation was cancelled","de":"Weil die Unterkunftsbuchung storniert wurde","fr":"Parce que la réservation d'hébergement a été annulée","es":"Porque la reserva de alojamiento fue cancelada","pl":"Ponieważ rezerwacja noclegu została anulowana","it":"Perché la prenotazione dell'alloggio è stata cancellata","sv":"Eftersom boendebevaringen avbokades","fi":"Koska majoitusvaraus peruutettiin","ja":"宿泊予約がキャンセルされたから","zh-CN":"因为住宿预订被取消了"}},{"text":"교통이 너무 복잡해서","trans":{"en":"Because the traffic is too complicated","de":"Weil der Verkehr zu kompliziert ist","fr":"Parce que le trafic est trop compliqué","es":"Porque el tráfico es demasiado complicado","pl":"Ponieważ ruch drogowy jest zbyt skomplikowany","it":"Perché il traffico è troppo complicato","sv":"Eftersom trafiken är för komplicerad","fi":"Koska liikenne on liian monimutkaista","ja":"交通が複雑すぎるから","zh-CN":"因为交通太复杂了"}}],"answer":1,"explanation":"유진이 주말에 비가 많이 온다고 했다고 날씨 예보를 언급했습니다."},{"type":"이해","questionAudio":"비가 와도 부산에서 어디를 방문할 수 있나요?","questionTrans":{"en":"Where can you visit in Busan even if it rains?","de":"Wo kann man in Busan besuchen, auch wenn es regnet?","fr":"Où peut-on visiter à Busan même s'il pleut?","es":"¿Dónde se puede visitar en Busan aunque llueva?","pl":"Gdzie można odwiedzić w Busan nawet gdy pada deszcz?","it":"Dove si può visitare a Busan anche se piove?","sv":"Var kan man besöka i Busan även om det regnar?","fi":"Missä voi vierailla Busanissa, vaikka sataisi?","ja":"雨が降っても釜山でどこを訪れることができますか？","zh-CN":"就算下雨，在釜山可以去哪里？"},"options":[{"text":"해수욕장과 바다","trans":{"en":"Beaches and the sea","de":"Strände und das Meer","fr":"Plages et la mer","es":"Playas y el mar","pl":"Plaże i morze","it":"Spiagge e il mare","sv":"Stränder och havet","fi":"Rannat ja meri","ja":"海水浴場と海","zh-CN":"海水浴场和海边"}},{"text":"공원과 등산로","trans":{"en":"Parks and hiking trails","de":"Parks und Wanderwege","fr":"Parcs et sentiers de randonnée","es":"Parques y senderos de senderismo","pl":"Parki i szlaki turystyczne","it":"Parchi e sentieri escursionistici","sv":"Parker och vandringsleder","fi":"Puistot ja vaellusreitit","ja":"公園と登山道","zh-CN":"公园和登山道"}},{"text":"박물관이나 쇼핑센터","trans":{"en":"Museums or shopping centers","de":"Museen oder Einkaufszentren","fr":"Musées ou centres commerciaux","es":"Museos o centros comerciales","pl":"Muzea lub centra handlowe","it":"Musei o centri commerciali","sv":"Museer eller shoppingcenter","fi":"Museot tai kauppakeskukset","ja":"博物館やショッピングセンター","zh-CN":"博物馆或购物中心"}},{"text":"야외 공연장","trans":{"en":"Outdoor performance venues","de":"Freiluftveranstaltungsorte","fr":"Scènes de spectacle en plein air","es":"Lugares de actuación al aire libre","pl":"Plenerowe miejsca spektakli","it":"Palcoscenici all'aperto","sv":"Utomhusscener","fi":"Ulkoilmaesityspaikkoja","ja":"野外公演場","zh-CN":"户外演出场所"}}],"answer":2,"explanation":"유진이 부산에 박물관이나 쇼핑센터도 많잖아라고 말했습니다."},{"type":"이해","questionAudio":"두 사람은 언제 최종 결정을 내리기로 했나요?","questionTrans":{"en":"When did the two decide to make the final decision?","de":"Wann haben die beiden beschlossen, die endgültige Entscheidung zu treffen?","fr":"Quand les deux ont-ils décidé de prendre la décision finale?","es":"¿Cuándo decidieron los dos tomar la decisión final?","pl":"Kiedy dwoje zdecydowało się podjąć ostateczną decyzję?","it":"Quando i due hanno deciso di prendere la decisione finale?","sv":"När bestämde de två sig för att fatta det slutgiltiga beslutet?","fi":"Milloin molemmat päättivät tehdä lopullisen päätöksen?","ja":"二人はいつ最終決定を下すことにしましたか？","zh-CN":"两人决定什么时候做最终决定？"},"options":[{"text":"지금 바로","trans":{"en":"Right now","de":"Sofort","fr":"Maintenant même","es":"Ahora mismo","pl":"Teraz od razu","it":"Proprio adesso","sv":"Direkt nu","fi":"Heti nyt","ja":"今すぐ","zh-CN":"现在马上"}},{"text":"전날 저녁에","trans":{"en":"The night before","de":"Am Abend zuvor","fr":"Le soir d'avant","es":"La noche anterior","pl":"Dzień wcześniej wieczorem","it":"La sera prima","sv":"Kvällen innan","fi":"Edellisenä iltana","ja":"前日の夜に","zh-CN":"前一天晚上"}},{"text":"아침에 날씨 보고","trans":{"en":"In the morning after checking the weather","de":"Am Morgen nach dem Überprüfen des Wetters","fr":"Le matin après avoir vérifié la météo","es":"Por la mañana después de revisar el tiempo","pl":"Rano po sprawdzeniu pogody","it":"Al mattino dopo aver controllato il tempo","sv":"På morgonen efter att ha kollat vädret","fi":"Aamulla sään tarkistamisen jälkeen","ja":"朝に天気を見てから","zh-CN":"早上看完天气之后"}},{"text":"여행 당일 출발 전에","trans":{"en":"Before departure on the day of the trip","de":"Vor der Abreise am Reisetag","fr":"Avant le départ le jour du voyage","es":"Antes de partir el día del viaje","pl":"Przed wyjazdem w dniu podróży","it":"Prima della partenza il giorno del viaggio","sv":"Innan avresan på resdagen","fi":"Ennen lähtöä matkustuspäivänä","ja":"旅行当日の出発前に","zh-CN":"旅行当天出发前"}}],"answer":2,"explanation":"지수가 아침에 날씨 보고 최종 결정하자고 말했습니다."}]},
  16: {"id":16,"title":"운동과 건강 관리","titleTrans":{"en":"Exercise and Health Management","de":"Sport und Gesundheitsmanagement","fr":"Exercice et gestion de la santé","es":"Ejercicio y gestión de la salud","pl":"Ćwiczenia i zarządzanie zdrowiem","it":"Esercizio e gestione della salute","sv":"Träning och hälsovård","fi":"Liikunta ja terveydenhoito","ja":"運動と健康管理","zh-CN":"运动与健康管理"},"desc":"헬스장에 등록하고 운동 계획을 세우는 대화입니다.","descTrans":{"en":"A conversation about registering at a gym and making an exercise plan.","de":"Ein Gespräch über die Anmeldung in einem Fitnessstudio und die Erstellung eines Trainingsplans.","fr":"Une conversation sur l'inscription à une salle de sport et la création d'un plan d'exercice.","es":"Una conversación sobre registrarse en un gimnasio y hacer un plan de ejercicios.","pl":"Rozmowa o rejestracji w siłowni i tworzeniu planu ćwiczeń.","it":"Una conversazione sulla registrazione in palestra e sulla creazione di un piano di esercizio.","sv":"En konversation om att registrera sig på ett gym och göra en träningsplan.","fi":"Keskustelu kuntosalille rekisteröitymisestä ja harjoitussuunnitelman tekemisestä.","ja":"ジムに登録して運動計画を立てる会話です。","zh-CN":"关于在健身房注册和制定锻炼计划的对话。"},"dialogue":[{"speaker":"지민","text":"수미야, 너 요즘 헬스장 다닌다고 했지? 어디 다녀?","trans":{"en":"Sumi, you said you're going to the gym these days, right? Where do you go?","de":"Sumi, du hast gesagt, du gehst neuerdings ins Fitnessstudio, oder? Wohin gehst du?","fr":"Sumi, tu as dit que tu allais à la salle de sport ces jours-ci, non ? Où vas-tu ?","es":"Sumi, dijiste que ibas al gimnasio últimamente, ¿verdad? ¿Dónde vas?","pl":"Sumi, mówiłaś, że ostatnio chodzisz na siłownię, prawda? Gdzie chodzisz?","it":"Sumi, hai detto che vai in palestra di recente, vero? Dove vai?","sv":"Sumi, du sa att du går på gymmet nu för tiden, eller hur? Vart går du?","fi":"Sumi, sanoit että käyt kuntosalilla nykyisin, eikö niin? Missä käyt?","ja":"スミ、最近ジムに通ってるって言ってたよね？どこに行ってるの？","zh-CN":"秀美，你说你最近在去健身房，对吧？你去哪里？"}},{"speaker":"수미","text":"응, 집 근처 피트니스센터에 다녀. 시설이 좋고 가격도 적당해.","trans":{"en":"Yeah, I go to a fitness center near my house. The facilities are good and the price is reasonable.","de":"Ja, ich gehe in ein Fitnesscenter in der Nähe meines Hauses. Die Einrichtungen sind gut und der Preis ist angemessen.","fr":"Oui, je vais dans un centre de fitness près de chez moi. Les installations sont bonnes et le prix est raisonnable.","es":"Sí, voy a un centro de fitness cerca de mi casa. Las instalaciones son buenas y el precio es razonable.","pl":"Tak, chodzę do centrum fitness niedaleko mojego domu. Zaplecze jest dobre i cena jest rozsądna.","it":"Sì, vado in un centro fitness vicino a casa mia. Le strutture sono buone e il prezzo è ragionevole.","sv":"Ja, jag går till ett fitnesscenter nära mitt hus. Faciliteterna är bra och priset är rimligt.","fi":"Joo, käyn kuntokeskuksessa lähellä kotiani. Tilat ovat hyvät ja hinta on kohtuullinen.","ja":"うん、家の近くのフィットネスセンターに通ってるよ。施設がよくて値段も適切だよ。","zh-CN":"对，我去家附近的健身中心。设施很好，价格也合理。"}},{"speaker":"지민","text":"나도 운동을 시작하고 싶은데, 어떻게 등록해? 월 회비가 얼마야?","trans":{"en":"I also want to start exercising. How do I register? How much is the monthly fee?","de":"Ich möchte auch mit dem Sport beginnen. Wie melde ich mich an? Wie hoch ist die monatliche Gebühr?","fr":"Je veux aussi commencer à faire de l'exercice. Comment je m'inscris ? Quel est le tarif mensuel ?","es":"Yo también quiero empezar a hacer ejercicio. ¿Cómo me registro? ¿Cuánto es la cuota mensual?","pl":"Też chcę zacząć ćwiczyć. Jak się zarejestrować? Ile wynosi miesięczna opłata?","it":"Anch'io voglio iniziare ad allenarmi. Come mi registro? Quanto è la quota mensile?","sv":"Jag vill också börja träna. Hur registrerar jag mig? Hur mycket är månadsavgiften?","fi":"Minäkin haluaisin aloittaa harjoittelun. Miten rekisteröidyn? Paljonko kuukausimaksu on?","ja":"私も運動を始めたいんだけど、どうやって登録するの？月会費はいくら？","zh-CN":"我也想开始锻炼。怎么注册？月费是多少？"}},{"speaker":"수미","text":"카운터에 가서 신분증 보여주고 신청서 작성하면 돼. 3개월 등록하면 할인도 받을 수 있어.","trans":{"en":"Go to the counter, show your ID, and fill out the application form. If you register for 3 months, you can get a discount.","de":"Geh zur Rezeption, zeig deinen Ausweis und füll das Anmeldeformular aus. Wenn du dich für 3 Monate anmeldest, kannst du einen Rabatt bekommen.","fr":"Va au comptoir, montre ta carte d'identité et remplis le formulaire d'inscription. Si tu t'inscris pour 3 mois, tu peux obtenir une réduction.","es":"Ve al mostrador, muestra tu identificación y rellena el formulario de solicitud. Si te registras por 3 meses, puedes obtener un descuento.","pl":"Idź do recepcji, pokaż dowód tożsamości i wypełnij formularz zgłoszeniowy. Jeśli zarejestrujesz się na 3 miesiące, możesz otrzymać zniżkę.","it":"Vai allo sportello, mostra il documento d'identità e compila il modulo di domanda. Se ti iscrivi per 3 mesi, puoi ottenere uno sconto.","sv":"Gå till disken, visa din legitimation och fyll i ansökningsblanketten. Om du registrerar dig för 3 månader kan du få rabatt.","fi":"Mene tiskille, näytä henkilökorttisi ja täytä hakulomake. Jos rekisteröidyt 3 kuukaudeksi, voit saada alennuksen.","ja":"カウンターに行って身分証を見せて申請書を書けばいいよ。3ヶ月登録すると割引も受けられるよ。","zh-CN":"去柜台，出示身份证，填写申请表就可以了。注册3个月的话可以享受折扣。"}},{"speaker":"지민","text":"그렇구나. 나는 살을 빼고 싶은데 어떤 운동이 효과적일까?","trans":{"en":"I see. I want to lose weight. What kind of exercise is effective?","de":"Ich verstehe. Ich möchte abnehmen. Was für eine Art von Übung ist effektiv?","fr":"Je vois. Je veux perdre du poids. Quel type d'exercice est efficace ?","es":"Ya veo. Quiero perder peso. ¿Qué tipo de ejercicio es efectivo?","pl":"Rozumiem. Chcę schudnąć. Jaki rodzaj ćwiczeń jest skuteczny?","it":"Capisco. Voglio perdere peso. Che tipo di esercizio è efficace?","sv":"Jag förstår. Jag vill gå ner i vikt. Vilken typ av träning är effektiv?","fi":"Ymmärrän. Haluaisin laihtua. Millainen liikunta on tehokasta?","ja":"そうか。私は痩せたいんだけど、どんな運動が効果的かな？","zh-CN":"原来如此。我想减肥，什么运动比较有效？"}},{"speaker":"수미","text":"유산소 운동이랑 근력 운동을 같이 하는 게 좋아. 처음에는 트레이너한테 상담받는 걸 추천해.","trans":{"en":"It's good to do cardio and strength training together. I recommend getting a consultation from a trainer at first.","de":"Es ist gut, Cardio und Krafttraining zusammen zu machen. Ich empfehle, sich zu Beginn von einem Trainer beraten zu lassen.","fr":"Il est bien de faire de la cardio et de la musculation ensemble. Je recommande de consulter un entraîneur au début.","es":"Es bueno hacer cardio y entrenamiento de fuerza juntos. Recomiendo consultar a un entrenador al principio.","pl":"Dobrze jest robić jednocześnie ćwiczenia cardio i trening siłowy. Polecam skonsultowanie się z trenerem na początku.","it":"È bene fare cardio e allenamento della forza insieme. Consiglio di consultare un allenatore all'inizio.","sv":"Det är bra att göra cardio och styrketräning tillsammans. Jag rekommenderar att konsultera en tränare i början.","fi":"On hyvä tehdä aerobista harjoittelua ja voimaharjoittelua yhdessä. Suosittelen konsultoimaan valmentajaa aluksi.","ja":"有酸素運動と筋力トレーニングを一緒にするのがいいよ。最初はトレーナーに相談することをお勧めするよ。","zh-CN":"有氧运动和力量训练一起做比较好。一开始建议咨询教练。"}},{"speaker":"지민","text":"트레이너 상담은 따로 비용이 들어?","trans":{"en":"Does trainer consultation cost extra?","de":"Kostet die Trainerberatung extra?","fr":"La consultation avec un entraîneur coûte-t-elle en plus ?","es":"¿La consulta con el entrenador tiene un costo adicional?","pl":"Czy konsultacja z trenerem kosztuje dodatkowo?","it":"La consulenza con il trainer ha un costo aggiuntivo?","sv":"Kostar tränarkonsultationen extra?","fi":"Maksaako valmentajakonsultointi erikseen?","ja":"トレーナーの相談は別途費用がかかるの？","zh-CN":"教练咨询需要额外付费吗？"}},{"speaker":"수미","text":"첫 번째 상담은 무료야. 그다음부터 PT 수업을 신청하면 비용이 생겨.","trans":{"en":"The first consultation is free. After that, there's a cost if you sign up for PT classes.","de":"Die erste Beratung ist kostenlos. Danach entstehen Kosten, wenn du PT-Kurse buchst.","fr":"La première consultation est gratuite. Après cela, il y a un coût si vous vous inscrivez aux cours de PT.","es":"La primera consulta es gratuita. Después de eso, hay un costo si te inscribes en clases de PT.","pl":"Pierwsza konsultacja jest bezpłatna. Potem pojawia się koszt, jeśli zapiszesz się na zajęcia PT.","it":"La prima consulenza è gratuita. Dopo di ciò, c'è un costo se ti iscrivi alle lezioni di PT.","sv":"Den första konsultationen är gratis. Därefter tillkommer en kostnad om du anmäler dig till PT-lektioner.","fi":"Ensimmäinen konsultointi on ilmainen. Sen jälkeen tulee kustannuksia, jos ilmoittaudut PT-tunneille.","ja":"最初の相談は無料だよ。その次からPTレッスンを申し込むと費用が発生するよ。","zh-CN":"第一次咨询是免费的。之后如果申请PT课程就需要付费了。"}},{"speaker":"지민","text":"좋아, 이번 주 안에 한번 가봐야겠다. 같이 운동하면 더 동기 부여가 될 것 같아.","trans":{"en":"Great, I should go sometime this week. I think exercising together will be more motivating.","de":"Gut, ich sollte diese Woche mal hingehen. Ich denke, gemeinsam zu trainieren wird motivierender sein.","fr":"Super, je devrais y aller cette semaine. Je pense que s'entraîner ensemble sera plus motivant.","es":"Genial, debería ir esta semana. Creo que entrenar juntos será más motivador.","pl":"Świetnie, powinienem pojść w tym tygodniu. Myślę, że ćwiczenie razem będzie bardziej motywujące.","it":"Ottimo, dovrei andarci questa settimana. Penso che allenarsi insieme sarà più motivante.","sv":"Bra, jag borde åka dit den här veckan. Jag tror att träna tillsammans kommer att vara mer motiverande.","fi":"Hienoa, minun pitäisi mennä sinne tällä viikolla. Luulen, että yhdessä harjoittelu on motivoivampaa.","ja":"いいね、今週中に一度行ってみなきゃ。一緒に運動したらもっとモチベーションが上がりそう。","zh-CN":"太好了，这周我得去一趟。我觉得一起运动会更有动力。"}},{"speaker":"수미","text":"그래, 같이 가자! 내가 안내해 줄게. 주말에 시간 되면 같이 등록하러 가자.","trans":{"en":"Sure, let's go together! I'll guide you. If you have time on the weekend, let's go register together.","de":"Klar, lass uns zusammen gehen! Ich führe dich. Wenn du am Wochenende Zeit hast, lass uns zusammen zur Anmeldung gehen.","fr":"Bien sûr, allons-y ensemble ! Je vais te guider. Si tu as le temps le week-end, allons-y ensemble pour s'inscrire.","es":"¡Claro, vayamos juntos! Te guiaré. Si tienes tiempo el fin de semana, vayamos juntos a registrarnos.","pl":"Jasne, chodźmy razem! Poprowadzę cię. Jeśli masz czas w weekend, chodźmy razem się zarejestrować.","it":"Certo, andiamo insieme! Ti guido io. Se hai tempo nel weekend, andiamo insieme a registrarci.","sv":"Absolut, låt oss gå tillsammans! Jag guidar dig. Om du har tid på helgen, låt oss gå och registrera oss tillsammans.","fi":"Totta kai, mennään yhdessä! Ohjaan sinut. Jos sinulla on aikaa viikonloppuna, mennään yhdessä rekisteröitymään.","ja":"うん、一緒に行こう！私が案内するよ。週末に時間があれば一緒に登録しに行こう。","zh-CN":"好啊，一起去吧！我来带你。如果周末有时间，一起去注册吧。"}}],"vocab":[{"word":"헬스장","trans":{"en":"gym","de":"Fitnessstudio","fr":"salle de sport","es":"gimnasio","pl":"siłownia","it":"palestra","sv":"gym","fi":"kuntosali","ja":"ジム","zh-CN":"健身房"}},{"word":"등록하다","trans":{"en":"to register","de":"sich anmelden","fr":"s'inscrire","es":"registrarse","pl":"zarejestrować się","it":"registrarsi","sv":"registrera sig","fi":"rekisteröityä","ja":"登録する","zh-CN":"注册"}},{"word":"유산소 운동","trans":{"en":"cardio exercise","de":"Ausdauertraining","fr":"exercice cardio","es":"ejercicio cardio","pl":"ćwiczenia cardio","it":"esercizio cardio","sv":"konditionsträning","fi":"aerobinen liikunta","ja":"有酸素運動","zh-CN":"有氧运动"}},{"word":"근력 운동","trans":{"en":"strength training","de":"Krafttraining","fr":"musculation","es":"entrenamiento de fuerza","pl":"trening siłowy","it":"allenamento della forza","sv":"styrketräning","fi":"voimaharjoittelu","ja":"筋力トレーニング","zh-CN":"力量训练"}},{"word":"월 회비","trans":{"en":"monthly fee","de":"Monatsbeitrag","fr":"cotisation mensuelle","es":"cuota mensual","pl":"miesięczna opłata","it":"quota mensile","sv":"månadsavgift","fi":"kuukausimaksu","ja":"月会費","zh-CN":"月费"}},{"word":"동기 부여","trans":{"en":"motivation","de":"Motivation","fr":"motivation","es":"motivación","pl":"motywacja","it":"motivazione","sv":"motivation","fi":"motivaatio","ja":"モチベーション","zh-CN":"动力"}},{"word":"트레
