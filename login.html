<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 도메인 통일: www.businesskorean.com으로 들어와도 즉시 businesskorean.com으로 강제 이동.
     구글 로그인(리다이렉트 방식)은 "떠날 때"와 "돌아올 때"가 반드시 같은 주소여야 정상 작동하므로,
     Firebase 코드가 실행되기 전에 가장 먼저 이 작업을 합니다. -->
<script>
  if (location.hostname === 'www.businesskorean.com') {
    location.replace('https://businesskorean.com' + location.pathname + location.search + location.hash);
  }
</script>
<title>Sign In – All About Korea</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#222222; --gray:#6b6b6b; --gray-soft:#f7f7f7; --border:#e8e8e8;
    --blue:#3d5afe; --blue-dark:#2c40c9; --coral:#ff385c;
    --white:#ffffff; --radius:16px; --radius-sm:10px;
    --shadow:0 6px 20px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;color:var(--ink);background:var(--gray-soft);-webkit-font-smoothing:antialiased;}
  h1{font-family:'Poppins',sans-serif;margin:0;letter-spacing:-.01em;}
  a{color:inherit;text-decoration:none;}
  button{font:inherit;cursor:pointer;}

  .topbar{background:var(--white);border-bottom:1px solid var(--border);}
  .topbar-inner{max-width:1120px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;}
  .logo{font-family:'Poppins',sans-serif;font-weight:700;font-size:19px;color:var(--ink);}
  .logo span{color:var(--blue);}

  .stage{min-height:calc(100vh - 65px);display:flex;align-items:center;justify-content:center;padding:40px 20px;}
  .card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
        width:100%;max-width:400px;padding:40px 32px;text-align:center;}
  .card-icon{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--blue),#7c8cff);
        display:flex;align-items:center;justify-content:center;margin:0 auto 20px;}
  .card h1{font-size:22px;margin-bottom:6px;}
  .card p.sub{color:var(--gray);font-size:14px;margin:0 0 28px;line-height:1.5;}

  .google-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
        padding:13px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);
        background:var(--white);font-size:15px;font-weight:600;color:var(--ink);transition:.15s;}
  .google-btn:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);border-color:#d0d0d0;}
  .google-btn:active{transform:scale(.99);}
  .google-btn:disabled{opacity:.6;cursor:default;}
  .google-btn svg{flex-shrink:0;}

  .terms{font-size:12px;color:var(--gray);margin-top:24px;line-height:1.6;}
  .terms a{color:var(--blue);font-weight:600;}

  .back{display:inline-flex;align-items:center;gap:6px;margin-top:28px;font-size:13px;color:var(--gray);font-weight:500;}
  .back:hover{color:var(--ink);}

  @media (max-width:480px){
    .card{padding:32px 22px;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="https://www.businesskorean.com/" class="logo">All About <span>Korea</span></a>
  </div>
</header>

<div class="stage">
  <div class="card">
    <div class="card-icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
    <h1>Welcome to All About Korea</h1>
    <p class="sub">Sign in to unlock premium Korean content and study materials.</p>

    <button class="google-btn" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 48 48">
        <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
        <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
        <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
        <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
      </svg>
      Continue with Google
    </button>

    <p class="terms">By continuing, you agree to our<br><a href="https://www.businesskorean.com/Terms of Service.html">Terms of Service</a> and <a href="https://www.businesskorean.com/Privacy Policy.html">Privacy Policy</a>.</p>
    <p id="errorMsg" style="display:none;color:var(--coral);font-size:13px;margin:16px 0 0;font-weight:500;"></p>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA-qZfGlrEEAQRpl4KQzJmU7f4j1R0Usl8",
    authDomain: "all-about-korea-login.firebaseapp.com",
    projectId: "all-about-korea-login",
    storageBucket: "all-about-korea-login.firebasestorage.app",
    messagingSenderId: "20771155142",
    appId: "1:20771155142:web:bbfeb19541625e750cbbc7"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  const btn = document.getElementById('googleBtn');
  const errorMsg = document.getElementById('errorMsg');

  // 어디서 로그인 페이지로 왔는지 확인 (예: ?redirect=payment.html)
  // 보안을 위해 화이트리스트에 있는 안전한 페이지로만 이동 허용 (외부 주소로 리다이렉트 방지)
  // 어디서 로그인 페이지로 왔는지 확인 (예: ?redirect=members/News%20Letter_260805.html)
  // 화이트리스트 대신, 안전한 "상대경로 .html 파일"인지 패턴으로 검증합니다.
  // 콜론(:), 역슬래시(\), 연속 슬래시(//), 상위경로(..)가 있으면 외부 사이트로 유도하는
  // 공격(Open Redirect)일 수 있으므로 거부하고, 이 조건을 통과한 내부 페이지 경로만 허용합니다.
  function isSafeRedirect(path) {
    if (!path) return false;
    let decoded;
    try { decoded = decodeURIComponent(path); } catch { return false; }
    if (!/^[A-Za-z0-9 _\-./]+\.html$/.test(decoded)) return false;
    if (decoded.includes('..') || decoded.includes('//') || decoded.startsWith('/')) return false;
    return true;
  }
  const params = new URLSearchParams(location.search);
  const requestedRedirect = params.get('redirect');
  const redirectTarget = isSafeRedirect(requestedRedirect) ? requestedRedirect : null;

  function goNext() {
    location.href = redirectTarget
      ? `https://businesskorean.com/${redirectTarget}`
      : "https://businesskorean.com/";
  }

  // 구글에서 리다이렉트로 돌아왔을 때 로그인 결과를 확인합니다 (팝업 방식 대신 리다이렉트 방식 사용 —
  // 브라우저의 서드파티 저장소 차단으로 인한 "The requested action is invalid" 오류를 피하기 위함)
  getRedirectResult(auth)
    .then((result) => {
      if (result && result.user) {
        goNext();
      }
    })
    .catch((err) => {
      console.error(err);
      errorMsg.textContent = "Sign-in failed. Please try again.";
      errorMsg.style.display = 'block';
    });

  btn.addEventListener('click', () => {
    btn.disabled = true;
    errorMsg.style.display = 'none';
    signInWithRedirect(auth, provider).catch((err) => {
      console.error(err);
      errorMsg.textContent = "Sign-in failed. Please try again.";
      errorMsg.style.display = 'block';
      btn.disabled = false;
    });
  });
</script>

</body>
</html>
