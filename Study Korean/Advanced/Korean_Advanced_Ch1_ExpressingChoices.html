<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Study Korean – 1장. 선택을 나타낼 때 (Expressing Choices)</title>
<style>
  :root{
    --bg:#F5F5F7;
    --card:#FFFFFF;
    --ink:#1D1D1F;
    --ink-soft:#6E6E73;
    --line:#E5E5EA;
    --blue:#0071E3;
    --blue-deep:#0059B3;
    --blue-tint:#EAF3FE;
    --green:#2FA84F;
    --green-tint:#E7F6EA;
    --red:#E0393E;
    --red-tint:#FDECEC;
    --orange:#C9760A;
    --orange-tint:#FDF2E3;
    --purple:#5E5CE6;
    --purple-tint:#EEEEFD;
    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:11px;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
    --content-w:720px;
    --content-pad:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro KR","Apple SD Gothic Neo","Helvetica Neue",Arial,sans-serif;
    background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button,input,textarea{font-family:inherit;}

  /* ── TOPBAR ─────────────────────────────────────────────────── */
  .topbar{
    position:sticky;top:0;z-index:200;
    background:rgba(255,255,255,.78);backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    display:flex;align-items:center;padding:0 16px;height:52px;gap:10px;
    border-bottom:1px solid rgba(0,0,0,.06);
  }
  .burger{background:none;border:none;cursor:pointer;padding:8px;margin-left:-8px;display:flex;flex-direction:column;gap:5px;border-radius:10px;}
  .burger:active{background:rgba(0,0,0,.06);}
  .burger span{display:block;width:20px;height:2px;background:var(--ink);border-radius:2px;transition:transform .25s,opacity .25s;}
  .burger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
  .burger.open span:nth-child(2){opacity:0;}
  .burger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
  .topbar-title{font-size:15px;font-weight:600;letter-spacing:-.2px;}
  .topbar-sub{color:var(--ink-soft);font-size:12px;margin-left:auto;font-weight:500;background:var(--line);padding:3px 10px;border-radius:20px;}

  /* ── DRAWER ─────────────────────────────────────────────────── */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:300;opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(2px);}
  .overlay.show{opacity:1;pointer-events:all;}
  .drawer{position:fixed;left:-300px;top:0;bottom:0;width:300px;background:var(--card);z-index:400;transition:left .3s cubic-bezier(.32,.72,0,1);overflow-y:auto;}
  .drawer.open{left:0;}
  .drawer-header{padding:22px 20px 14px;display:flex;align-items:center;justify-content:space-between;}
  .drawer-header h2{font-size:19px;font-weight:700;letter-spacing:-.3px;}
  .drawer-header h2 span{color:var(--blue);}
  .drawer-close{background:var(--bg);border:none;width:30px;height:30px;border-radius:50%;font-size:16px;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .drawer-hr{height:1px;background:var(--line);margin:2px 20px 8px;}
  .nav-section{padding:6px 10px;}
  .nav-item{display:flex;align-items:center;gap:13px;padding:13px 12px;color:var(--ink);text-decoration:none;font-size:15.5px;font-weight:600;cursor:pointer;transition:background .15s;border-radius:12px;}
  .nav-item:active,.nav-item.active{background:var(--blue-tint);color:var(--blue-deep);}
  .nav-icon{width:22px;height:22px;flex:none;display:flex;align-items:center;justify-content:center;}

  /* ── HERO ───────────────────────────────────────────────────── */
  .hero{padding:30px 20px 18px;text-align:center;}
  .hero-badge{display:inline-block;background:var(--purple-tint);color:var(--purple);border-radius:20px;padding:5px 14px;font-size:12px;font-weight:700;margin-bottom:12px;letter-spacing:.2px;}
  .hero h1{font-size:26px;font-weight:800;line-height:1.3;letter-spacing:-.4px;}
  .hero .sub{font-size:15px;font-weight:500;color:var(--ink-soft);margin-top:6px;}

  /* ── TABS ───────────────────────────────────────────────────── */
  .unit-tabs-wrap{position:sticky;top:52px;z-index:150;background:var(--bg);padding:8px var(--content-pad) 12px;max-width:calc(var(--content-w) + 2*var(--content-pad));margin:0 auto;}
  .unit-tabs{display:flex;gap:6px;overflow-x:auto;background:#E9E9EC;border-radius:14px;padding:4px;scrollbar-width:none;}
  .unit-tabs::-webkit-scrollbar{display:none;}
  .unit-tab{flex:1;min-width:max-content;padding:9px 14px;font-size:13px;font-weight:600;color:var(--ink-soft);border-radius:11px;cursor:pointer;white-space:nowrap;text-align:center;transition:all .2s;}
  .unit-tab.active{color:var(--ink);background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12);}

  /* ── CARDS ──────────────────────────────────────────────────── */
  .grammar-list{padding:4px var(--content-pad) 40px;display:flex;flex-direction:column;gap:14px;max-width:calc(var(--content-w) + 2*var(--content-pad));margin:0 auto;}
  .grammar-card{background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;}
  .card-header{display:flex;align-items:center;padding:16px 18px;cursor:pointer;gap:13px;}
  .card-num{width:34px;height:34px;border-radius:50%;background:linear-gradient(150deg,var(--blue),var(--blue-deep));color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;}
  .card-title-wrap{flex:1;min-width:0;}
  .card-level{font-size:11.5px;color:var(--green);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
  .card-title{font-size:17px;font-weight:700;color:var(--ink);margin-top:2px;letter-spacing:-.2px;}
  .card-arrow{font-size:14px;color:var(--ink-soft);transition:transform .3s;flex:none;}
  .card-arrow.open{transform:rotate(180deg);}
  .card-body{display:none;padding:0 18px 20px;}
  .card-body.show{display:block;animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}

  /* ── CONTENT ────────────────────────────────────────────────── */
  .section-tag{display:inline-block;background:var(--blue-tint);color:var(--blue-deep);font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:20px;margin-bottom:10px;letter-spacing:.2px;}
  .formula-box{background:linear-gradient(135deg,var(--blue),var(--blue-deep));color:#fff;border-radius:var(--radius-md);padding:16px 18px;font-size:16px;font-weight:700;text-align:center;margin-bottom:14px;letter-spacing:.1px;line-height:1.5;}
  .analogy-box{background:var(--purple-tint);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:14px;}
  .analogy-box .lbl{font-size:11.5px;font-weight:800;color:var(--purple);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;}
  .analogy-box .pattern-line{font-size:14px;font-weight:700;color:#3A38C4;line-height:1.6;padding:3px 0;}
  .analogy-box .similar-wrap{margin-top:10px;padding-top:10px;border-top:1px solid rgba(94,92,230,.18);}
  .analogy-box .similar-item{margin-bottom:7px;}
  .analogy-box .similar-expr{font-size:13.5px;font-weight:700;color:#3A38C4;}
  .analogy-box .similar-note{font-size:12px;color:#5E5CE6;margin-top:2px;line-height:1.5;}
  .analogy-box .similar-note-en{font-size:11.5px;color:#5E5CE6;font-style:italic;margin-top:1px;line-height:1.5;}
  .rule-card{background:var(--bg);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;}
  .rule-title{font-size:13.5px;font-weight:700;color:var(--blue-deep);margin-bottom:4px;}
  .rule-text{font-size:13.5px;color:#3A3A3C;line-height:1.6;}
  .rule-ex{font-size:12.5px;color:var(--blue-deep);margin-top:6px;font-weight:500;}
  .examples-list{list-style:none;display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .ex-item{background:var(--bg);border-radius:var(--radius-sm);padding:11px 14px;}
  .ex-kr{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:3px;}
  .ex-en{font-size:12.5px;color:var(--ink-soft);}

  /* ── QUIZ ───────────────────────────────────────────────────── */
  .quiz-section{margin-top:16px;}
  .quiz-type-label{font-size:12px;font-weight:700;color:#fff;border-radius:20px;padding:4px 13px;display:inline-flex;align-items:center;gap:5px;margin-bottom:10px;}
  .quiz-desc{font-size:12px;color:var(--ink-soft);margin:-4px 0 10px 2px;}
  .quiz-q{background:var(--bg);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:10px;}
  .quiz-q p{font-size:14.5px;color:var(--ink);font-weight:600;margin-bottom:8px;line-height:1.5;white-space:pre-line;}
  .quiz-q .en{font-size:12.5px;color:var(--ink-soft);font-weight:400;margin-top:-4px;margin-bottom:9px;white-space:pre-line;}
  .passage-box{background:#fff;border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px;font-size:14px;line-height:1.7;color:var(--ink);border:1px solid var(--line);white-space:pre-line;}

  .ox-row{display:flex;gap:8px;margin-bottom:4px;}
  .ox-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 10px;min-height:44px;border-radius:12px;border:none;background:#fff;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink);transition:all .15s;box-shadow:0 1px 2px rgba(0,0,0,.06);}
  .ox-btn:active{transform:scale(.97);}
  .ox-btn.correct{background:var(--green);color:#fff;}
  .ox-btn.wrong{background:var(--red);color:#fff;}
  .ox-btn:disabled{cursor:default;}

  .mc-opt{margin-bottom:8px;}
  .mc-btn{display:block;width:100%;text-align:left;padding:12px 14px;min-height:44px;border-radius:12px;border:none;background:#fff;font-size:14px;color:var(--ink);cursor:pointer;transition:all .15s;box-shadow:0 1px 2px rgba(0,0,0,.06);line-height:1.45;}
  .mc-btn:active{transform:scale(.985);}
  .mc-btn.correct{background:var(--green);color:#fff;font-weight:600;}
  .mc-btn.wrong{background:var(--red);color:#fff;}
  .mc-btn:disabled{cursor:default;}
  .mc-detail{display:none;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-top:6px;font-size:12.5px;line-height:1.55;}
  .mc-detail.show{display:block;animation:fadeIn .2s ease;}
  .mc-detail.is-correct{border-color:var(--green);background:var(--green-tint);}
  .mc-detail.is-wrong{border-color:var(--red);background:var(--red-tint);}
  .mc-detail .fkr{font-weight:700;color:var(--ink);}
  .mc-detail .fen{color:var(--ink-soft);font-style:italic;margin-top:2px;}
  .mc-detail .fnote{color:var(--ink-soft);margin-top:5px;}
  .mc-detail .fnote-en{color:var(--ink-soft);font-style:italic;margin-top:1px;}

  .fill-wrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14.5px;color:var(--ink);font-weight:600;margin-bottom:8px;line-height:2.1;}
  .fill-input{border:none;border-bottom:2.5px solid var(--blue);background:none;font-size:15px;font-weight:700;color:var(--blue-deep);min-width:120px;outline:none;text-align:center;padding:4px 6px;}
  .fill-input::placeholder{color:#B0B0B5;font-weight:500;font-size:12.5px;}
  .fill-textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:14.5px;color:var(--ink);outline:none;padding:11px 13px;resize:vertical;min-height:44px;font-weight:500;line-height:1.5;}
  .fill-textarea:focus{border-color:var(--blue);}
  .check-btn{background:var(--blue);color:#fff;border:none;border-radius:980px;padding:11px 22px;font-size:13.5px;font-weight:700;cursor:pointer;margin-top:8px;display:inline-block;min-height:40px;transition:transform .12s,background .15s;}
  .check-btn:active{transform:scale(.96);background:var(--blue-deep);}
  .fb{display:none;font-size:12.5px;margin-top:9px;font-weight:600;padding:9px 12px;border-radius:10px;line-height:1.5;}
  .fb.ok{background:var(--green-tint);color:#1D7A37;display:block;}
  .fb.no{background:var(--red-tint);color:#B7292D;display:block;}
  .fb .en-line{display:block;font-weight:400;font-style:italic;opacity:.85;margin-top:3px;}

  /* DIALOGUE */
  .dialogue-wrap{display:flex;flex-direction:column;gap:8px;}
  .dialogue-item{display:flex;flex-direction:column;}
  .bubble-a-wrap{align-items:flex-start;}
  .bubble-b-wrap{align-items:flex-end;}
  .who-label{font-size:11px;color:var(--ink-soft);font-weight:700;padding:0 6px;margin-bottom:3px;}
  .dialogue-bubble{border-radius:16px;padding:11px 15px;max-width:88%;font-size:14px;line-height:1.65;}
  .bubble-a{background:#fff;color:var(--ink);border-bottom-left-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.06);}
  .bubble-b{background:var(--blue);color:#fff;border-bottom-right-radius:4px;}
  .bubble-en{font-size:11px;opacity:.65;margin-top:4px;}
  .dia-fill{border:none;border-bottom:2.5px dashed var(--blue-deep);background:rgba(0,113,227,.08);border-radius:4px 4px 0 0;font-size:14px;font-weight:700;color:#1D7A37;min-width:96px;outline:none;padding:2px 6px;margin:0 2px;}
  .bubble-b .dia-fill{border-bottom-color:#fff;color:#CFF3D8;background:rgba(255,255,255,.15);}
  .dia-hint{font-size:11px;color:#1D7A37;font-style:italic;margin-top:2px;display:none;padding-left:2px;}
  .bubble-b .dia-hint{color:#CFF3D8;}
  .dia-hint.show{display:block;}
  .dia-row{display:flex;flex-direction:column;margin-bottom:6px;line-height:1.75;}
  .dia-tip{font-size:11.5px;color:var(--ink-soft);margin:-2px 0 10px 2px;}

  /* TOPIK */
  .topik-badge{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,#1D1D1F,#3A3A3C);color:#fff;font-size:11px;font-weight:800;border-radius:20px;padding:4px 12px;margin-bottom:10px;letter-spacing:.3px;}
  .topik-instruction{font-size:12.5px;color:var(--ink-soft);margin-bottom:8px;}
  .topik-sentence{font-size:15px;font-weight:600;color:var(--ink);line-height:1.6;margin-bottom:4px;}
  .topik-sentence u{text-decoration-color:var(--blue);text-decoration-thickness:2px;text-underline-offset:3px;color:var(--blue-deep);}
  .topik-sentence-en{font-size:12.5px;color:var(--ink-soft);font-style:italic;margin-bottom:10px;}
  .topik-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .topik-source{font-size:10.5px;color:var(--ink-soft);text-align:right;margin-top:8px;}
  .dialogue-scenario{margin-bottom:10px;}
  .dialogue-scenario .d-line{font-size:13.5px;line-height:1.65;margin-bottom:4px;}
  .dialogue-scenario .d-who{font-weight:700;color:var(--blue-deep);}
  .dialogue-scenario .d-blank{font-weight:700;color:var(--ink-soft);font-style:italic;}
  .docx-fallback-link{display:none;align-items:center;gap:5px;background:var(--orange-tint);border:1.5px solid var(--orange);border-radius:980px;padding:6px 13px;font-size:12px;font-weight:700;color:var(--orange);text-decoration:none;margin-left:8px;min-height:32px;}

  /* DOCX button */
  .docx-btn{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1.5px solid var(--line);border-radius:980px;padding:6px 13px;font-size:12px;font-weight:700;color:var(--blue-deep);cursor:pointer;transition:background .15s,transform .12s;vertical-align:middle;flex:none;min-height:32px;}
  .docx-btn:active{transform:scale(.95);background:var(--blue-tint);}
  .docx-btn svg{flex:none;}
  .docx-btn.loading{opacity:.6;pointer-events:none;}
  .formula-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
  .formula-row .section-tag{margin-bottom:0;}

  .score-chip{display:inline-flex;align-items:center;gap:5px;background:var(--purple-tint);color:var(--purple);font-size:12px;font-weight:700;border-radius:20px;padding:5px 12px;margin-bottom:12px;}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:rgba(29,29,31,.92);backdrop-filter:blur(10px);color:#fff;font-size:13.5px;font-weight:600;padding:12px 20px;border-radius:14px;z-index:500;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.32,.72,0,1);box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:88%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (min-width:600px){
    .hero h1{font-size:30px;}
  }
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeDrawer()"></div>

<div class="drawer" id="drawer">
  <div class="drawer-header">
    <h2>All About <span>Korea</span></h2>
    <button class="drawer-close" onclick="closeDrawer()" aria-label="Close">✕</button>
  </div>
  <div class="drawer-hr"></div>
  <div class="nav-section">

      Home
    </a>

    <a class="nav-item" href="https://www.businesskorean.com/Guided%20Tour/Guided%20Tour.html">

      Pricing
    </a>
  </div>
</div>

<div class="topbar">
  <button class="burger" id="burgerBtn" onclick="toggleDrawer()" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
  <span class="topbar-title">🇰🇷 Study Korean</span>
  <span class="topbar-sub">Advanced</span>

<div class="hero">
  <div class="hero-badge">TOPIK Level 5–6 · 고급</div>
  <h1>1장. 선택을 나타낼 때<br><span class="sub">Expressing Choices</span></h1>

<div class="unit-tabs-wrap">
  <div class="unit-tabs" id="unitTabs">
    <div class="unit-tab active" onclick="showUnit(0,this)">01 –느니</div>
    <div class="unit-tab" onclick="showUnit(1,this)">02 –(으)ㄹ 바에야</div>
    <div class="unit-tab" onclick="showUnit(2,this)">03 –건 –건</div>
    <div class="unit-tab" onclick="showUnit(3,this)">04 –(느)ㄴ다기보다는</div>

<script>
const UNITS = [

let currentUnit=0;
let scoreState={};

function toggleDrawer(){
  const d=document.getElementById('drawer'),o=document.getElementById('overlay'),b=document.getElementById('burgerBtn');
  d.classList.toggle('open');o.classList.toggle('show');b.classList.toggle('open');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('burgerBtn').classList.remove('open');
}
function showUnit(idx,tab){
  currentUnit=idx;
  document.querySelectorAll('.unit-tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');
  renderUnit(idx);
  window.scrollTo({top:0,behavior:'smooth'});
}
function renderUnit(idx){
  const u=UNITS[idx];
  const list=document.getElementById('grammarList');
  list.innerHTML='';
  list.appendChild(buildCard(u));
}
function buildCard(u){
  const card=document.createElement('div');
  card.className='grammar-card';
  card.innerHTML=`
    <div class="card-header" onclick="toggleBody(this)">
      <div class="card-num">${u.num}</div>
      <div class="card-title-wrap">
        <div class="card-level">${u.level}</div>
        <div class="card-title">${u.title}</div>
      </div>
      <span class="card-arrow">▾</span>
    </div>
    <div class="card-body show">${renderBody(u)}</div>`;
  return card;
}
function toggleBody(hdr){
  const body=hdr.nextElementSibling;
  const arrow=hdr.querySelector('.card-arrow');
  body.classList.toggle('show');
  arrow.classList.toggle('open');
}
function renderBody(u){
  const uid='u'+u.num;
  return `
    <div class="formula-row">
      <span class="section-tag">📐 문법 공식 · Grammar Formula</span>
      <button class="docx-btn" id="${uid}docxBtn" onclick="downloadDocx('${uid}')" title="Download as Word (.docx)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
        DOCX
      </button>
      <a class="docx-fallback-link" id="${uid}docxFallback" href="#" download></a>
    </div>
    <div class="formula-box">${u.formula}</div>
    <div class="analogy-box">
      <div class="lbl">🔤 영어의 이 표현과 같아요 · Same as this English pattern</div>
      ${u.englishPatterns.map(p=>`<div class="pattern-line">"${p}"</div>`).join('')}
      <div style="margin-top:8px;">
        <div class="ex-item" style="background:#fff;"><div class="ex-kr">${u.analogyExampleKr}</div><div class="ex-en">${u.analogyExampleEn}</div></div>

      ${u.examples.map(ex=>`<li class="ex-item"><div class="ex-kr">${ex.kr}</div><div class="ex-en">${ex.en}</div></li>`).join('')}
    </ul>
    ${renderQuiz(u.quiz,uid)}`;
}

function countTotal(q){
  let n=q.ox.length+q.sentence.length+q.context.length+q.correction.length+q.topik.length;
  q.dialogue.lines.forEach(l=>{ if(l.fill){ n += Array.isArray(l.ans)?l.ans.length:1; } });
  return n;
}

                <div>${line.kr}</div><div class="bubble-en">${line.en}</div>
              </div></div>`;
          }
          const hints = Array.isArray(line.hint) ? line.hint : [line.hint];
          const bases = Array.isArray(line.base) ? line.base : [line.base];
          const parts = line.kr.split('___');
          let rows = [];
          let curRow = '';
          parts.forEach((part,pi)=>{
            curRow += part;
            if(pi < hints.length){
              const inputId = uid+'dl'+li+'_'+pi;
              const baseVal = bases[pi] || '';
              curRow += `<input class="dia-fill" id="${inputId}" value="${baseVal}" placeholder="${baseVal?'':(hints[pi]||'')}" type="text" onfocus="this.select()">`;
              if(pi < hints.length-1){
                rows.push(curRow);
                curRow = '';
              }
            }
          });
          if(curRow) rows.push(curRow);
          const rowsHtml = rows.map((row,ri)=>{
            const hint = hints[ri];
            return `<div class="dia-row">${row}<span class="dia-hint" data-hint="${hint||''}">${hint||''}</span></div>`;
          }).join('');
          return `<div class="dialogue-item ${isA?'bubble-a-wrap':'bubble-b-wrap'}">
            <div class="who-label">${line.who}</div>
            <div class="dialogue-bubble ${bubbleCls}">
              ${rowsHtml}
              <div class="bubble-en">${line.en}</div>
            </div></div>`;
        }).join('')}
      </div>
      <button class="check-btn" style="margin-top:12px;" onclick="checkDialogue('${uid}','${uid}dlf')">답 확인하기 ✓</button>
      <div class="fb" id="${uid}dlf"></div>

    <div class="quiz-desc">실제 TOPIK II 시험에 나오는 형태의 문제예요.</div>
    ${renderTopikUnderline(q.topik[0],uid,0)}
    ${renderTopikDialogue(q.topik[1],uid,1)}
  </div>`;
}

function esc(s){return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');}
function norm(s){return String(s).trim().replace(/\s+/g,' ').replace(/[.!?]+$/,'');}

function markAnswered(uid,key,isCorrect){
  const st=scoreState[uid]; if(!st) return;
  if(st.seen.has(key)) return;
  st.seen.add(key); st.answered++; if(isCorrect) st.correct++;
  const el=document.getElementById(uid+'score');
  if(el) el.textContent=`✓ ${st.correct}/${st.total} 정답 · ${st.answered}/${st.total} 풀이 완료`;
}

function showToast(msg){
  const t=document.getElementById('toast');
  if(!t) return;
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>t.classList.remove('show'),3200);
}

function checkCorrection(uid,i,inpId,ans,ansEn,fbId){

  const fbEl=document.getElementById(fbId);
  const ok=norm(val)===norm(ans);
  fbEl.innerHTML=(ok?'✓ 정확하게 고쳤어요!':`✗ 다시 확인해 보세요. 모범 답안: ${ans}`)+`<span class="en-line">${ansEn}</span>`;
  fbEl.className='fb '+(ok?'ok':'no');
  markAnswered(uid,uid+'co'+i,ok);
}
function checkDialogue(uid,fbId){
  const u=UNITS[currentUnit];
  const lines=u.quiz.dialogue.lines;
  let score=0,total=0;
  lines.forEach((line,li)=>{
    if(!line.fill)return;
    const ansList=Array.isArray(line.ans)?line.ans:[line.ans];
    ansList.forEach((correctAns,pi)=>{
      total++;
      const inp=document.getElementById(uid+'dl'+li+'_'+pi);
      if(!inp)return;
      const val=inp.value.trim();
      const ok=val===correctAns;
      if(ok) score++;
      const row=inp.closest('.dia-row');
      const hintEl = row ? row.querySelector('.dia-hint') : null;
      if(ok){
        inp.style.color='';
        if(hintEl){ hintEl.textContent='✓ 정답'; hintEl.classList.add('show'); }
      } else {
        inp.style.color='#E0393E';
        if(hintEl){ hintEl.textContent='정답: '+correctAns; hintEl.classList.add('show'); }
      }
      markAnswered(uid,uid+'dl'+li+'_'+pi,ok);
    });
  });
  const fbEl=document.getElementById(fbId);
  fbEl.textContent=score===total?`✓ 모두 정답이에요! (${score}/${total})`:`점수: ${score}/${total} — 빈칸 아래 정답을 확인해 보세요.`;
  fbEl.className='fb '+(score===total?'ok':'no');
}
// ── DOCX Download ───────────────────────────────────────────────────────
// Builds the .docx file directly as raw OOXML + a hand-rolled, dependency-
// free STORE-only ZIP (CRC32 + local/central headers), instead of routing
// through the large bundled docx.js library. This removes ~1.2MB of
// third-party code from the page (the only thing it was used for) and
// removes every layer that could get mangled between "works on this
// machine" and "works after the page is hosted and opened on a phone":
// no compression tables, no base64 round-trip, no big minified library —
// just plain UTF-8 text turned into three small XML files and zipped with
// STORE (no compression at all). This mirrors the structure of a known-
// good minimal .docx: [Content_Types].xml + _rels/.rels + word/document.xml,
// nothing else.

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function utf8Bytes(str){ return new TextEncoder().encode(str); }

function makeZip(files){
  const chunks = [];
  const central = [];
  let offset = 0;
  const dosTime = 0, dosDate = 0x21;

  function push(arr){ chunks.push(arr); offset += arr.length; }
  function u16(n){ return new Uint8Array([n & 0xFF, (n >>> 8) & 0xFF]); }
  function u32(n){ return new Uint8Array([n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF]); }
  function concat(...arrs){
    let len = 0; arrs.forEach(a=>len+=a.length);
    const out = new Uint8Array(len);
    let o=0; arrs.forEach(a=>{ out.set(a,o); o+=a.length; });
    return out;
  }

  for (const f of files) {
    const nameBytes = utf8Bytes(f.name);
    const data = f.data;
    const crc = crc32(data);
    const localOffset = offset;

    push(concat(
      u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(dosTime), u16(dosDate),
      u32(crc), u32(data.length), u32(data.length), u16(nameBytes.length), u16(0)
    ));
    push(nameBytes);
    push(data);

    central.push(concat(
      u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(dosTime), u16(dosDate),
      u32(crc), u32(data.length), u32(data.length), u16(nameBytes.length), u16(0), u16(0),
      u16(0), u16(0), u32(0), u32(localOffset), nameBytes
    ));
  }

  const centralStart = offset;
  let centralSize = 0;
  central.forEach(c => { push(c); centralSize += c.length; });

  push(concat(
    u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length),
    u32(centralSize), u32(centralStart), u16(0)
  ));

  return concat(...chunks);
}

function xmlEscape(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\r\n/g,' ').replace(/\n/g,' ').replace(/\r/g,' ');
}

function buildDocxBytes(u){
  const FONT='Helvetica';
  const BLUE='0071E3', RED='E0393E', GREY='6E6E73', DARK='1D1D1F';
  const paras = [];

  function run(text, opts={}){
    const size = opts.size || 22;
    let rPr = `<w:rFonts w:ascii="${FONT}" w:hAnsi="${FONT}" w:eastAsia="${FONT}" w:cs="${FONT}"/>`;
    if(opts.bold) rPr += '<w:b/><w:bCs/>';
    if(opts.italics) rPr += '<w:i/><w:iCs/>';
    rPr += `<w:color w:val="${opts.color||DARK}"/>`;
    rPr += `<w:sz w:val="${size}"/><w:szCs w:val="${size}"/>`;
    return `<w:r><w:rPr>${rPr}</w:rPr><w:t xml:space="preserve">${xmlEscape(text)}</w:t></w:r>`;
  }
  function para(runsXml, pOpts={}){
    let pPr = `<w:spacing w:line="360"${pOpts.before!=null?` w:before="${pOpts.before}"`:''}${pOpts.after!=null?` w:after="${pOpts.after}"`:''}/>`;
    if(pOpts.center) pPr += '<w:jc w:val="center"/>';
    paras.push(`<w:p><w:pPr>${pPr}</w:pPr>${runsXml}</w:p>`);
  }
  const p = (text, opts={}) => para(run(text, opts));
  const sectionHeader = (text) => para(run(text,{bold:true,color:BLUE,size:40}), {before:220, after:100});
  const circ = (i) => String.fromCharCode(9312+i);

  // ── Title
  para(run(`1장 · ${u.level}`, {bold:true, color:BLUE}));
  para(run(u.title, {bold:true, size:36, color:DARK}));
  p('');

  // ── Formula & English patterns
  sectionHeader('📐 문법 공식 · Grammar Formula');
  para(run(u.formula, {bold:true, size:28, color:BLUE}), {center:true});
  p('');
  p('🔤 영어의 이 표현과 같아요:', {bold:true, color:GREY});
  u.englishPatterns.forEach(pt=>{ p('   "'+pt+'"', {italics:true, color:GREY}); });
  p('');
  p('   '+u.analogyExampleKr, {bold:true});
  p('   '+u.analogyExampleEn, {italics:true, color:GREY});
  p('');

  // ── Rules
  sectionHeader('📖 활용 규칙 · Rules');
  u.rules.forEach(r=>{
    p(r.t, {bold:true, color:BLUE});
    p(r.en);
    p('예) '+r.ex, {italics:true, color:BLUE});
    p('');
  });

  // ── Examples
  sectionHeader('💬 예문 · Examples');
  u.examples.forEach(ex=>{
    p(ex.kr, {bold:true});
    p(ex.en, {color:GREY});
  });
  p('');

  // ── OX
  sectionHeader('✅ OX 문제 (True / False)');
  u.quiz.ox.forEach((item,i)=>{
    p(`Q${i+1}. ${item.krSentence}`, {bold:true});
    p('   '+item.en, {italics:true, color:GREY});
    p('   '+(item.ans?'정답: 맞다 (True)':'정답: 틀리다 (False)'), {color:BLUE, bold:true});
    p('   '+item.fbKr, {italics:true, color:GREY});
    p('   '+item.fbEn, {italics:true, color:GREY});
    p('');
  });

  // ── Sentence completion
  sectionHeader('✍️ 문장 완성 (Complete with the Grammar)');
  u.quiz.sentence.forEach((item,i)=>{
    p(`Q${i+1}. ${item.en}`, {bold:true});
    para(
      run('   '+item.pre+' [ ', {color:DARK}) +
      run(item.ans, {bold:true, color:BLUE}) +
      run(' ] '+item.suf, {color:DARK})
    );
    p('');
  });

  // ── Context choice
  sectionHeader('🗣️ 문맥 표현 선택 (Context Choice)');
  u.quiz.context.forEach((item,i)=>{
    p(`Q${i+1}. `+item.scenarioKr.replace(/\n/g,' '), {bold:true});
    p('   '+item.passageKr.replace(/\n/g,'  /  '));
    p('   '+item.passageEn.replace(/\n/g,'  /  '), {italics:true, color:GREY});
    item.options.forEach((opt,oi)=>{
      p('   '+circ(oi)+' '+opt.text, {color: opt.correct?BLUE:RED, bold:opt.correct});
    });
    const correctOpt = item.options.find(o=>o.correct);
    p('   ✓ '+correctOpt.filledKr, {color:BLUE});
    p('   '+correctOpt.filledEn, {italics:true, color:GREY});
    p('');
  });

  // ── Correction
  sectionHeader('🛠️ 오류 수정 (Error Correction)');
  u.quiz.correction.forEach((item,i)=>{
    p(`Q${i+1}.`, {bold:true});
    p('   ✗ '+item.wrong, {color:RED});
    p('   '+item.wrongEn, {italics:true, color:GREY});
    p('   ✓ '+item.ans, {color:BLUE});
    p('   '+item.ansEn, {italics:true, color:GREY});
    p('');
  });

  // ── Dialogue
  sectionHeader('💭 대화 완성 (Dialogue)');
  u.quiz.dialogue.lines.forEach(line=>{
    const ansList = Array.isArray(line.ans) ? line.ans : (line.ans?[line.ans]:[]);
    let text = line.kr;
    ansList.forEach(a=>{ text = text.replace('___', '['+a+']'); });
    para(
      run(`${line.who}: `, {bold:true, color: line.who==='A'?BLUE:DARK}) +
      run(text, {color: line.fill?BLUE:DARK})
    );
    p('   ('+line.en+')', {italics:true, color:GREY});
  });
  p('');

  // ── TOPIK II
  sectionHeader('🎯 실전 TOPIK II 유형');
  const tp1 = u.quiz.topik[0];
  p(tp1.instructionKr, {bold:true});
  p(tp1.instructionEn, {italics:true, color:GREY});
  p('   '+tp1.sentenceKr.replace(/__/g,''), {bold:true});
  p('   '+tp1.sentenceEn, {italics:true, color:GREY});
  tp1.options.forEach((opt,oi)=>{
    p('   '+circ(oi)+' '+opt.text, {color: opt.correct?BLUE:RED, bold:opt.correct});
  });
  p('');

  const tp2 = u.quiz.topik[1];
  p(tp2.instructionKr, {bold:true});
  p(tp2.instructionEn, {italics:true, color:GREY});
  tp2.lines.forEach(l=>{ p('   '+l.who+': '+l.kr); });
  tp2.options.forEach((opt,oi)=>{
    p('   '+circ(oi)+' '+opt, {color: oi===tp2.ans?BLUE:RED, bold: oi===tp2.ans});
  });
  p('   '+tp2.fbKr, {italics:true, color:GREY});
  p('   '+tp2.fbEn, {italics:true, color:GREY});

  const documentXml =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
    '<w:body>' + paras.join('') + '</w:body></w:document>';

  const contentTypesXml =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
    '</Types>';

  const relsXml =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
    '</Relationships>';

  return makeZip([
    { name: '[Content_Types].xml', data: utf8Bytes(contentTypesXml) },
    { name: '_rels/.rels', data: utf8Bytes(relsXml) },
    { name: 'word/document.xml', data: utf8Bytes(documentXml) },
  ]);
}

function showDocxFallback(uid, url, filename){
  const link = document.getElementById(uid+'docxFallback');
  if(!link) return;
  link.textContent = '⬇️ 안 열리면 여기를 탭';
  link.href = url;
  link.setAttribute('download', filename);
  link.style.display = 'inline-flex';
  const key = '__fbTimer_'+uid;
  clearTimeout(window[key]);
  window[key] = setTimeout(()=>{ link.style.display='none'; try{URL.revokeObjectURL(url);}catch(e){} }, 180000);
}

function downloadDocx(uid){
  const u = UNITS[currentUnit];
  const btn = document.getElementById(uid+'docxBtn');
  if(btn) btn.classList.add('loading');

  try{
    const bytes = buildDocxBytes(u);
    const filename = `Korean_Grammar_Ch1_${u.num}_${u.title.replace(/[\/\s]/g,'_')}.docx`;
    const blob = new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ a.remove(); }, 400);
    showDocxFallback(uid, url, filename);
    if(btn) btn.classList.remove('loading');
    showToast('✓ DOCX 파일이 다운로드되었어요. 안 열리면 옆의 링크를 탭해 보세요.');
  }catch(err){
    console.error('DOCX generation failed:',err);
    if(btn) btn.classList.remove('loading');
    showToast('⚠️ DOCX 생성 중 오류가 발생했어요.');
  }
}

renderUnit(0);
</script>
