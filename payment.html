<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unlock Premium Access – All About Korea</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- PayPal Subscription SDK -->
<script src="https://www.paypal.com/sdk/js?client-id=BAAP1J34jx0tuIShHWW2J0TyMgBtD_cqsNfTCQkK8cqFQfIohmXLmBBPtp-NTWnSA6E4ljLQRRLxriNsvk&vault=true&intent=subscription" data-sdk-integration-source="button-factory"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-functions.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA-qZfGlrEEAQRpl4KQzJmU7f4j1R0Usl8",
    authDomain: "all-about-korea-login.firebaseapp.com",
    projectId: "all-about-korea-login",
    storageBucket: "all-about-korea-login.firebasestorage.app",
    messagingSenderId: "20771155142",
    appId: "1:20771155142:web:bbfeb19541625e750cbbc7"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const functions = getFunctions(app);
  // ⚠️ 아래 함수가 Cloud Functions에 아직 없다면 새로 만들어야 합니다 (subscriptionID로 PayPal API 조회 후 Firestore 기록)
  const verifyPaypalSubscription = httpsCallable(functions, "verifyPaypalSubscription");

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      location.href = "https://www.businesskorean.com/login.html";
      return;
    }
    document.getElementById('stage').style.display = 'flex';
    document.getElementById('loading').style.display = 'none';
  });

  window.addEventListener('DOMContentLoaded', () => {
    paypal.Buttons({
      style: { layout: 'vertical', color: 'gold', shape: 'pill', label: 'subscribe' },
      createSubscription: (data, actions) => {
        return actions.subscription.create({
          plan_id: 'P-8MM518007F4309714NJZP7II'
        });
      },
      onApprove: async (data, actions) => {
        setStatus('Processing your subscription…', false);
        try {
          await verifyPaypalSubscription({ subscriptionID: data.subscriptionID });
          setStatus('Subscription confirmed! Redirecting…', false);
          setTimeout(() => { location.href = "https://www.businesskorean.com/"; }, 1200);
        } catch (err) {
          console.error(err);
          setStatus('We received your subscription but verification failed. Please contact support.', true);
        }
      },
      onError: (err) => {
        console.error(err);
        setStatus('Something went wrong with PayPal. Please try again.', true);
      }
    }).render('#paypal-button-container-P-8MM518007F4309714NJZP7II');
  });

  function setStatus(msg, isError) {
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.style.color = isError ? 'var(--coral)' : 'var(--gray)';
    el.style.display = 'block';
  }
</script>

<style>
  :root{
    --ink:#222222; --gray:#6b6b6b; --gray-soft:#f7f7f7; --border:#e8e8e8;
    --blue:#3d5afe; --coral:#ff385c;
    --white:#ffffff; --radius:16px; --radius-sm:10px;
    --shadow:0 6px 20px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;color:var(--ink);background:var(--gray-soft);}
  h1{font-family:'Poppins',sans-serif;margin:0;letter-spacing:-.01em;}
  a{color:inherit;text-decoration:none;}

  .topbar{background:var(--white);border-bottom:1px solid var(--border);}
  .topbar-inner{max-width:1120px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;}
  .logo{font-family:'Poppins',sans-serif;font-weight:700;font-size:19px;color:var(--ink);}
  .logo span{color:var(--blue);}

  #loading{min-height:calc(100vh - 65px);display:flex;align-items:center;justify-content:center;color:var(--gray);font-size:14px;}
  #stage{display:none;min-height:calc(100vh - 65px);align-items:center;justify-content:center;padding:40px 20px;}
  .card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
        width:100%;max-width:420px;padding:40px 32px;text-align:center;}
  .price-badge{display:inline-block;background:var(--gray-soft);border-radius:20px;padding:6px 16px;font-size:13px;font-weight:600;color:var(--blue);margin-bottom:18px;}
  .card h1{font-size:22px;margin-bottom:8px;}
  .card p.sub{color:var(--gray);font-size:14px;margin:0 0 28px;line-height:1.5;}
  .features{text-align:left;margin:0 0 28px;padding:0;list-style:none;}
  .features li{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink);margin-bottom:10px;}
  .features li svg{flex-shrink:0;margin-top:2px;}
  #statusMsg{font-size:13px;margin-top:16px;display:none;}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="https://www.businesskorean.com/" class="logo">All About <span>Korea</span></a>
  </div>
</header>

<div id="loading">Loading…</div>

<div id="stage">
  <div class="card">
    <!-- ⚠️ 실제 구독 요금/주기로 문구 수정 필요 (예: $9.99/month) -->
    <span class="price-badge">Subscription</span>
    <h1>Unlock Premium Access</h1>
    <p class="sub">Subscribe for full access to all grammar units, vocabulary, and expressions.</p>
    <ul class="features">
      <li><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3d5afe" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg> All beginner–advanced grammar units</li>
      <li><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3d5afe" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg> Full vocabulary & expression library</li>
      <li><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3d5afe" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg> Cancel anytime</li>
    </ul>
    <div id="paypal-button-container-P-8MM518007F4309714NJZP7II"></div>
    <p id="statusMsg"></p>
  </div>
</div>

</body>
</html>
